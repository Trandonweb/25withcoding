</style></head><body><main class="wrap">

<div class="heading"><div><h1>활쏘기 대결</h1><p>각도는 자동으로 움직입니다. A / L을 눌렀다 놓으면 해당 진영에서 발사합니다.</p></div></div>

<div class="help">양쪽 진영은 매 경기 각자 진영 안의 무작위 위치에서 시작합니다. 조준 각도는 자동으로 왕복하며, A는 왼쪽 진영, L은 오른쪽 진영의 발사 키입니다. 누르고 있는 동안 힘이 모이고 놓으면 발사됩니다.</div>
<div class="bottom"><button class="btn hidden" id="done">결과 확인 →</button><span id="message">각도를 조절하고 활시위를 당겨 보세요.</span></div>
<script>
const settings=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu'};
const mode=settings.mode||'cpu',canvas=document.getElementById('arena'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
document.getElementById('round').textContent=settings.round?settings.round+'번째 게임':'';
if(mode==='local'){document.getElementById('leftName').textContent='1P · 명중';document.getElementById('rightName').textContent='2P · 명중';document.getElementById('rightControlTitle').textContent='2P · 오른쪽 진영';document.getElementById('rightControlText').textContent='L을 눌렀다 놓기 · 발사 전용'}
const ground=H-34,gravity=.19,archers=[{x:65+Math.random()*155,y:ground,side:1,angle:-.48,angleDir:Math.random()<.5?1:-1,draw:0,holding:false,hits:0,color:'#53e88a',name:'1P',cooldown:0},{x:W-65-Math.random()*155,y:ground,side:-1,angle:-.48,angleDir:Math.random()<.5?1:-1,draw:0,holding:false,hits:0,color:'#ffd477',name:'2P',cooldown:0}];
let arrows=[],particles=[],playing=false,keys=new Set(),cpuClock=0,lastTime=performance.now(),winner=null;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function facingAngle(a){return a.side===1?a.angle:Math.PI-a.angle}
function startDraw(i){const a=archers[i];if(!playing||a.holding||a.cooldown>0)return;a.holding=true;a.draw=0}
function releaseDraw(i){const a=archers[i];if(!a.holding||!playing)return;a.holding=false;const power=clamp(a.draw,12,100),speed=4.5+power*.105,ang=a.angle;const startX=a.x+a.side*30*Math.cos(ang),startY=a.y-39+30*Math.sin(ang);arrows.push({x:startX,y:startY,vx:a.side*Math.cos(ang)*speed,vy:Math.sin(ang)*speed,owner:i,life:0,color:a.color});a.draw=0;a.cooldown=20;document.getElementById('message').textContent=a.name+' 발사!'}
function adjust(i,d){const a=archers[i];a.angle=clamp(a.angle+d,-1.25,.05)}
function finish(w){if(!playing)return;playing=false;winner=w;const me=archers[1].hits,opp=archers[0].hits;localStorage.setItem('miniGameResult',JSON.stringify({game:' 활쏘기 대결',winner:w,me,opp}));document.getElementById('message').textContent=w==='me'?'1P 승리!':w==='opp'?'2P 승리!':'무승부';document.getElementById('done').classList.remove('hidden')}
function hit(i,x,y){const a=archers[i];a.hits++;document.getElementById('hits'+(i+1)).textContent=a.hits;for(let k=0;k<14;k++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.8)*4,life:25,color:a.color});if(a.hits>=4)finish(i===1?'me':'opp')}
function drawArcher(a){const ang=facingAngle(a),headY=a.y-66;ctx.strokeStyle=a.color;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y-54);ctx.lineTo(a.x,a.y-20);ctx.moveTo(a.x,a.y-43);ctx.lineTo(a.x+a.side*19,a.y-27);ctx.moveTo(a.x,a.y-25);ctx.lineTo(a.x-a.side*10,a.y);ctx.moveTo(a.x,a.y-25);ctx.lineTo(a.x+a.side*12,a.y);ctx.stroke();ctx.fillStyle=a.color;ctx.beginPath();ctx.arc(a.x,headY,13,0,Math.PI*2);ctx.fill();const bx=a.x+a.side*20,by=a.y-44;ctx.strokeStyle=a.color;ctx.lineWidth=4;ctx.beginPath();ctx.arc(bx,by,24,ang-Math.PI*.45,ang+Math.PI*.45,a.side<0);ctx.stroke();const tipX=bx+a.side*(24*Math.cos(ang)),tipY=by-24*Math.sin(ang);ctx.strokeStyle='#eafcef';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx-a.side*8,by);ctx.lineTo(tipX,tipY);ctx.stroke();if(a.holding){ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-a.side*(7+a.draw*.14),by+a.draw*.2);ctx.lineTo(bx-a.side*8,by);ctx.stroke();ctx.fillStyle=a.color;ctx.fillRect(a.x-28,a.y-92,56,6);ctx.fillStyle='#fff';ctx.fillRect(a.x-28,a.y-92,56*a.draw/100,6)}}
function render(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0b2014');sky.addColorStop(1,'#102c1c');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.fillStyle='#1b422a';ctx.fillRect(0,ground,W,H-ground);ctx.strokeStyle='#47714e';ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(W,ground);ctx.stroke();ctx.fillStyle='#a9c5b2';ctx.font='bold 15px Arial';ctx.fillText('1P',archers[0].x-10,32);ctx.textAlign='right';ctx.fillText('2P',archers[1].x+12,32);ctx.textAlign='left';drawArcher(archers[0]);drawArcher(archers[1]);for(const a of arrows){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(Math.atan2(a.vy,a.vx));ctx.strokeStyle=a.color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(17,0);ctx.stroke();ctx.fillStyle=a.color;ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(8,-6);ctx.lineTo(8,6);ctx.closePath();ctx.fill();ctx.restore()}for(const p of particles){ctx.globalAlpha=p.life/25;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}if(mode==='cpu'){ctx.fillStyle='#a9c5b2';ctx.font='12px Arial';ctx.fillText(mode==='cpu'?'AI':'2P',archers[1].x-8,58)}}
function step(now){if(!playing)return;const dt=Math.min(2.5,(now-lastTime)/16.67);lastTime=now;for(let i=0;i<2;i++){const a=archers[i];if(a.cooldown>0)a.cooldown-=dt;if(a.holding)a.draw=clamp(a.draw+1.25*dt,0,100);a.angle+=a.angleDir*.006*dt;if(a.angle<=-1.18){a.angle=-1.18;a.angleDir=1}else if(a.angle>=-.04){a.angle=-.04;a.angleDir=-1}}if(mode==='cpu'){cpuClock+=dt;if(cpuClock>52&&archers[1].cooldown<=0&&!archers[1].holding){const a=archers[1],target=archers[0],speed=4.5+88*.105,dx=Math.abs(target.x-a.x),targetY=target.y-50,startY=a.y-39;let best={angle:-.48,error:Infinity};for(let angle=-1.12;angle<=-.02;angle+=.002){const vx=Math.cos(angle)*speed,t=dx/vx,predY=startY+Math.sin(angle)*speed*t+.5*gravity*t*t,err=Math.abs(predY-targetY);if(err<best.error)best={angle,error:err}}a.angle=best.angle+(Math.random()-.5)*.006;startDraw(1);cpuClock=0}if(archers[1].holding&&archers[1].draw>=88)releaseDraw(1)}
for(const b of arrows){b.vy+=gravity*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life+=dt;const target=archers[1-b.owner];if(Math.abs(b.x-target.x)<20&&b.y>target.y-92&&b.y<target.y-8){b.dead=true;hit(1-b.owner,b.x,b.y)}if(b.y>ground||b.x<0||b.x>W||b.life>500)b.dead=true}arrows=arrows.filter(a=>!a.dead);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);render();if(playing)requestAnimationFrame(step)}
window.addEventListener('keydown',e=>{if(e.repeat&&['KeyA','KeyL'].includes(e.code))return;if(['KeyA','KeyL'].includes(e.code))e.preventDefault();if(mode==='online'&&e.mgRemote){startDraw(1);keys.add('KeyL');return}if(e.code==='KeyA')startDraw(0);if(e.code==='KeyL')startDraw(1);keys.add(e.code)},true);
window.addEventListener('keyup',e=>{if(mode==='online'&&e.mgRemote){releaseDraw(1);keys.delete('KeyL');return}if(e.code==='KeyA')releaseDraw(0);if(e.code==='KeyL')releaseDraw(1);keys.delete(e.code)},true);
document.getElementById('done').onclick=()=>location.href='../index.html';if(mode==='online')document.getElementById('message').textContent='온라인 대전: A는 왼쪽 진영, L은 오른쪽 진영 발사입니다.';render();beginUniversalCountdown(()=>{if(mode==='online'&&window.mgOnline?.role==='guest'){playing=false;return}playing=true;lastTime=performance.now();requestAnimationFrame(step)});
function beginUniversalCountdown(onGo){let overlay=document.getElementById('mgUniversalCountdown');if(!overlay){overlay=document.createElement('div');overlay.id='mgUniversalCountdown';overlay.style.cssText='position:fixed;inset:0;z-index:100000;display:grid;place-items:center;background:#07130de8;color:#fff;font:800 clamp(64px,16vw,140px)/1 Arial,sans-serif;letter-spacing:.04em';document.body.appendChild(overlay)}let seq=['3!','2!','1!','GO!'],i=0;overlay.style.display='grid';const step=()=>{overlay.textContent=seq[i];overlay.style.color=i===3?'#72f0a1':'#fff';window.miniGameSound?.(i===3?'win':'key');if(i++<3)setTimeout(step,650);else setTimeout(()=>{overlay.style.display='none';onGo?.()},420)};step()}document.body.tabIndex=0;document.addEventListener('pointerdown',()=>{try{document.body.focus({preventScroll:true})}catch(e){}},true);</script></main><div id="miniSoundPanel" style="position:fixed;right:14px;bottom:14px;z-index:9999"><button id="miniSoundToggle" type="button" aria-pressed="true" style="border:1px solid #ffffff35;border-radius:999px;padding:10px 14px;background:#10251a;color:#effff4;font:700 13px Arial,sans-serif;box-shadow:0 6px 22px #0006;cursor:pointer"> 소리 켜짐</button></div><script>(function(){let enabled=localStorage.getItem('miniGameSound')!=='off',audio=null,lastKeySound=0;const btn=document.getElementById('miniSoundToggle');function label(){btn.textContent=enabled?'소리 켜짐':'소리 꺼짐';btn.setAttribute('aria-pressed',String(enabled))}function sound(kind='ui'){if(!enabled)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audio=audio||new AC();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const seq=kind==='win'?[523,659,784]:kind==='score'?[660,880]:kind==='hit'?[220,165]:kind==='bounce'?[420]:kind==='jump'?[440,660]:kind==='key'?[330]:[520];seq.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='hit'?'triangle':'sine';o.frequency.setValueAtTime(hz,now+i*.075);g.gain.setValueAtTime(.0001,now+i*.075);g.gain.exponentialRampToValueAtTime(((kind==='ui'||kind==='key')?0.035:0.065),now+i*.075+.012);g.gain.exponentialRampToValueAtTime(.0001,now+i*.075+.11);o.connect(g);g.connect(audio.destination);o.start(now+i*.075);o.stop(now+i*.075+.12)})}catch(e){}}window.miniGameSound=sound;btn.addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('miniGameSound',enabled?'on':'off');label();if(enabled)sound('ui')});document.addEventListener('click',e=>{if(e.target.closest('#miniSoundPanel'))return;if(e.target.closest('button'))sound('ui')},true);document.addEventListener('keydown',e=>{if(e.repeat||!['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code))return;const now=performance.now();if(now-lastKeySound>75){sound('key');lastKeySound=now}},true);label()})();</script><script type="module" src="../online-sync.js"></script>
<script>
/* Tablet keyboard focus and automatic result display */
(function(){
  try{localStorage.removeItem('miniGameResult')}catch(e){}
  document.body.tabIndex=0;
  const focusGame=()=>{try{document.body.focus({preventScroll:true})}catch(e){document.body.focus()}};
  window.addEventListener('pageshow',()=>setTimeout(focusGame,100));
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('button,input,textarea,select'))focusGame()},{passive:true});
  const css=document.createElement('style');
  css.textContent='#mgAutoResult{position:fixed;inset:0;z-index:20000;display:none;place-items:center;padding:20px;background:#07110ddd;backdrop-filter:blur(10px)}#mgAutoResult .panel{width:min(460px,94vw);padding:30px;border:1px solid #b6f6ca;border-radius:24px;background:#f8fff9;color:#17251c;text-align:center;box-shadow:0 24px 80px #0005;font-family:Arial,sans-serif}#mgAutoResult .headline{font-size:clamp(34px,8vw,54px);font-weight:950;margin:12px 0}#mgAutoResult .detail{color:#617166;line-height:1.6}#mgAutoResult button{margin-top:22px;border:0;border-radius:12px;padding:14px 24px;background:#187447;color:white;font-weight:850;font-size:15px}#mgTabletPad{position:fixed;left:10px;bottom:10px;z-index:8000;display:flex;gap:6px;flex-wrap:wrap;max-width:85vw}#mgTabletPad button{touch-action:manipulation;min-width:44px;min-height:42px;padding:9px 12px;border:1px solid #b9d9c3;border-radius:12px;background:#f7fff8;color:#173d28;font-weight:850;box-shadow:0 4px 14px #0002}';
  document.head.appendChild(css);
  const overlay=document.createElement('div');overlay.id='mgAutoResult';
  overlay.innerHTML='<div class="panel"><div style="font-size:12px;font-weight:850;letter-spacing:.15em;color:#187447">MATCH RESULT</div><div class="headline" id="mgAutoHeadline">경기 종료</div><div class="detail" id="mgAutoDetail">최종 결과</div><button id="mgAutoBack">메뉴로 돌아가기</button></div>';
  document.body.appendChild(overlay);
  document.getElementById('mgAutoBack').onclick=()=>location.href='../index.html';
  let shown=false;

  function showResult(data){
    if(shown||!data||!data.winner)return;
    shown=true;
    const settings=JSON.parse(localStorage.getItem('miniGameSettings')||'null');document.getElementById('mgAutoHeadline').textContent=settings?.mode==='local'?(data.winner==='me'?'1P 승':data.winner==='opp'?'2P 승':'무승부'):(data.winner==='me'?'승리':data.winner==='opp'?'패배':'무승부');
    const score=data.me!==undefined||data.opp!==undefined?'최종 점수 '+(data.me??0)+' : '+(data.opp??0):'';
    document.getElementById('mgAutoDetail').textContent=[data.game||'미니게임',score].filter(Boolean).join(' · ');
    overlay.style.display='grid';
  }
  function checkResult(){let raw;try{raw=localStorage.getItem('miniGameResult')}catch(e){return}if(raw){try{showResult(JSON.parse(raw))}catch(e){}}}
  const originalSetItem=Storage.prototype.setItem;
  Storage.prototype.setItem=function(key,value){
    originalSetItem.call(this,key,value);
    if(key==='miniGameResult'){try{showResult(JSON.parse(value))}catch(e){}}
  };
  const observer=new MutationObserver(checkResult);
  observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','hidden','style']});
  // On-screen backup controls for touchscreen tablets
  const n=(location.pathname.match(/game([1-9])\.html/)||[])[1];
  const keys={'1':[['A','KeyA'],['L','KeyL']],'2':[['A','KeyA'],['L','KeyL']],'3':[['반응','Enter']],'5':[['점프','Space']],'6':[['위','ArrowUp'],['아래','ArrowDown'],['발사','Enter'],['방향','Space']],'7':[['왼쪽','KeyA'],['오른쪽','KeyD'],['발사','KeyS'],['P2 ←','ArrowLeft'],['P2 →','ArrowRight'],['P2 발사','ArrowDown']],'8':[['위','ArrowUp'],['아래','ArrowDown'],['시작','Enter']],'9':[['왼쪽','ArrowLeft'],['오른쪽','ArrowRight'],['점프','Space'],['P2 점프','ArrowUp']]};
  if(keys[n]){
    const pad=document.createElement('div');pad.id='mgTabletPad';
    keys[n].forEach(([label,code])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{focusGame();const key=code==='Space'?' ':code==='Enter'?'Enter':code.startsWith('Key')?code.slice(3).toLowerCase():code;document.dispatchEvent(new KeyboardEvent('keydown',{key,code,bubbles:true,cancelable:true}));if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyS'].includes(code))document.dispatchEvent(new KeyboardEvent('keyup',{key,code,bubbles:true,cancelable:true}))};pad.appendChild(b)});
    document.body.appendChild(pad);
  }
})();
</script>
</body></html>
