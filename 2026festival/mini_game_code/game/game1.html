<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>줄달이기 | MINI GAME</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#071b12,#123b27);color:#fff;display:flex;align-items:center;justify-content:center}.wrap{width:min(900px,94vw);text-align:center;padding:24px}.top{display:flex;justify-content:space-between;opacity:.75}.title{font-size:clamp(32px,6vw,52px);font-weight:900;margin:12px}.arena{background:rgba(255,255,255,.07);border-radius:28px;padding:32px}.players{display:grid;grid-template-columns:1fr 1fr;font-size:20px;font-weight:800}.key{display:inline-flex;align-items:center;justify-content:center;background:#1ea857;border-radius:10px;width:44px;height:44px;margin:6px}.rope{position:relative;height:90px;margin:20px 0}.line{position:absolute;left:5%;right:5%;top:43px;height:12px;background:#c99b55;border-radius:20px}.marker{position:absolute;left:50%;top:28px;width:42px;height:42px;border-radius:50%;background:white;transform:translateX(-50%);transition:left .08s}.hint{margin:18px;color:#b9ddc5}.controls{display:grid;grid-template-columns:1fr 1fr;gap:15px}.control,.resultBtn{border:0;border-radius:15px;padding:20px;background:rgba(255,255,255,.1);color:white;font-size:20px;font-weight:900;cursor:pointer}.control:active,.resultBtn:active{transform:scale(.97)}.result{margin-top:22px;font-size:30px;font-weight:900;min-height:45px}.result small{display:block;font-size:14px;opacity:.7;margin:8px}.hidden{display:none!important}.note{color:#ffd98a;font-size:13px;margin-top:10px}@media(max-width:600px){.arena{padding:22px 12px}.control{padding:17px 8px}.players{font-size:17px}}</style></head><body><div class="wrap"><div class="top"><span id="round"></span><span id="mode"></span></div><div class="title">🪢 줄달이기</div><div class="arena"><div class="players"><div>나 <span class="key">A</span></div><div><span class="key" id="oppKey">L</span><span id="oppName">상대</span></div></div><div class="rope"><div class="line"></div><div class="marker" id="marker">●</div></div><div class="hint" id="hint">A를 빠르게 연타하세요!</div><div class="controls"><button class="control" id="left">A 당기기<small>키보드 A / 클릭</small></button><button class="control" id="right">L 당기기<small>키보드 L / 클릭</small></button></div><div class="note hidden" id="note">온라인 상대 입력은 연결 후 반영됩니다.</div><div class="result" id="result"></div><button class="resultBtn hidden" id="done">결과 확인 →</button></div></div><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu',modeName:'컴퓨터와 대전'};const mode=s.mode||'cpu';let pos=50,playing=true,cpu=null;const $=id=>document.getElementById(id);$('mode').textContent=s.modeName||'컴퓨터와 대전';$('round').textContent=s.round?`${s.round}번째 게임`:'';if(mode==='cpu'){$('oppName').textContent='컴퓨터';$('oppKey').textContent='🤖';$('right').disabled=true;$('right').style.opacity='.45';$('hint').textContent='A를 빠르게 연타해서 컴퓨터보다 먼저 당기세요!';cpu=setInterval(()=>pull('opp'),2000)}else if(mode==='online'){$('oppName').textContent='온라인 상대';$('oppKey').textContent='?';$('right').disabled=true;$('right').style.opacity='.45';$('note').classList.remove('hidden')}function pull(who){if(!playing)return;pos=Math.max(5,Math.min(95,pos+(who==='me'?1.75:-1.75)));$('marker').style.left=pos+'%';if(pos>=95)finish('me');if(pos<=5)finish('opp')}function finish(winner){if(!playing)return;playing=false;clearInterval(cpu);const text=winner==='me'?'🎉 승리!':'😮 패배!';$('result').innerHTML=text+'<small>이번 게임 결과</small>';$('done').classList.remove('hidden');localStorage.setItem('miniGameResult',JSON.stringify({game:'🪢 줄달이기',winner,me:winner==='me'?1:0,opp:winner==='opp'?1:0}))}$('left').onclick=()=>pull('me');$('right').onclick=()=>{if(mode==='local')pull('opp')};document.addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k==='a')pull('me');if(k==='l'&&mode==='local')pull('opp')});$('done').onclick=()=>location.href='../index.html';</script></body></html>
