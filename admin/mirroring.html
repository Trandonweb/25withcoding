<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>화면 모니터링</title>
<style>
    :root {
      --bg-color: #f0f0f0;
      --card-bg: #ffffff;
      --text-color: #111111;
      --header-bg: #ffffff;
      --border-color: var(--primary-color, #27ae60);
      --header-text: var(--primary-color, #27ae60);
      --card-hover-bg: color-mix(in srgb, var(--primary-color) 8%, white);
      --primary-color: #27ae60;
      --btn-bg: #27ae60;
      --btn-text: #ffffff;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1E1E1E;
      --text-color: #FFFFFF;
      --header-bg: #1E1E1E;
      --border-color: var(--primary-color);
      --header-text: var(--primary-color);
      --card-hover-bg: color-mix(in srgb, var(--primary-color) 15%, #1E1E1E);
      --btn-bg: var(--primary-color);
      --btn-text: #FFFFFF;
    }

    *{ box-sizing:border-box; }
    
    body{ 
        margin:0; 
        background: var(--bg-color); 
        color: var(--text-color); 
        font-family:sans-serif; 
        transition: background 0.2s, color 0.2s;
    }

    header{
        width: 100%; 
        height: 70px;
        display: flex; 
        justify-content: space-between; 
        align-items: center;
        padding: 0 20px; 
        background: var(--header-bg);
        box-shadow: 0 2px 10px rgba(0,0,0,.08);
        border-bottom: 3px solid var(--border-color);
    }

    header h2 {
        color: var(--header-text);
        font-size: 22px;
    }

    #back{
        padding: 10px 15px; 
        border: none; 
        border-radius: 10px;
        background: var(--primary-color); 
        color: white; 
        cursor: pointer;
        font-weight: bold;
        transition: filter 0.2s;
    }

    #back:hover {
        filter: brightness(0.9);
    }

    #online{ 
        font-weight: bold; 
        margin-left: 20px; 
        color: var(--text-color);
    }

    .left{ 
        display: flex; 
        align-items: center; 
    }

    #grid{
        padding: 20px;
        display: grid; 
        grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
        gap: 20px;
        max-width: 1200px;
        margin: auto;
    }

    .card{
        background: var(--card-bg); 
        color: var(--text-color);
        padding: 20px; 
        border-radius: 20px;
        cursor: pointer; 
        box-shadow: 0 2px 8px rgba(0,0,0,.08); 
        transition: transform .2s, background .2s, border .2s;
        border: 2px solid var(--border-color);
    }

    .card:hover{ 
        transform: translateY(-3px); 
        background: var(--card-hover-bg);
    }

    .card h3{ 
        margin-top: 0; 
        color: var(--header-text);
    }

    .card p {
        color: var(--text-color);
        opacity: 0.8;
    }

    #viewer{
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%;
        background: rgba(0,0,0,0.7); 
        display: none; 
        justify-content: center; 
        align-items: center;
        z-index: 1000;
    }

    #viewerBox{ 
        width: 90%; 
        max-width: 1100px; 
        background: var(--card-bg); 
        color: var(--text-color);
        border-radius: 20px; 
        padding: 20px; 
        border: 2px solid var(--border-color);
        box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    #viewerTop{ 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 10px;
    }

    #viewerTitle {
        color: var(--header-text);
        margin: 0;
    }

    #closeViewer{ 
        padding: 10px 15px; 
        border: none; 
        border-radius: 10px; 
        background: #ff5b5b; 
        color: white; 
        cursor: pointer; 
        font-weight: bold;
        transition: filter 0.2s;
    }

    #closeViewer:hover {
        filter: brightness(0.9);
    }

    #bigVideo{ 
        width: 100%; 
        margin-top: 20px; 
        border-radius: 15px; 
        background: black; 
        max-height: 70vh;
        object-fit: contain;
    }
</style>
</head>
<body>

<header>
<div class="left">
<button id="back">← 홈</button>
<div id="online">🟢 접속 0명</div>
</div>
<h2>화면 모니터링</h2>
</header>

<div id="grid"></div>

<div id="viewer">
<div id="viewerBox">
<div id="viewerTop">
<h2 id="viewerTitle">학생 화면</h2>
<button id="closeViewer">닫기</button>
</div>
<video id="bigVideo" autoplay playsinline></video>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",
    authDomain: "points2026-f5e50.firebaseapp.com",
    projectId: "points2026-f5e50",
    storageBucket: "points2026-f5e50.firebasestorage.app",
    messagingSenderId: "248724251417",
    appId: "1:248724251417:web:02d85cdc4addac98069b88"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 테마 동기화 로직
const SETTINGS_KEY = "coding_with_ramen_settings";

function applyStoredSettings() {
    const saved = localStorage.getItem(SETTINGS_KEY);
    if (saved) {
        try {
            const settings = JSON.parse(saved);
            if (settings.darkMode) {
                document.body.classList.add("dark-mode");
            } else {
                document.body.classList.remove("dark-mode");
            }
            if (settings.primaryColor) {
                document.documentElement.style.setProperty('--primary-color', settings.primaryColor);
            }
        } catch (e) {
            console.error("설정 로드 실패", e);
        }
    }
}

// 페이지 로드 즉시 테마 적용 (깜빡임 방지)
applyStoredSettings();

let selectedId = null;
let peerConnection = null;
let unsubscribeUser = null; 
const addedClientCandidates = new Set();
let isConnecting = false;

const rtcConfig = {
    iceServers: [
        { urls: "stun:stun.relay.metered.ca:80" },
        { urls: "turn:standard.relay.metered.ca:80", username: "cc29acf1a234c7ca3a5ae899", credential: "CW4V8T/D1+AnGnED" },
        { urls: "turn:standard.relay.metered.ca:80?transport=tcp", username: "cc29acf1a234c7ca3a5ae899", credential: "CW4V8T/D1+AnGnED" },
        { urls: "turn:standard.relay.metered.ca:443", username: "cc29acf1a234c7ca3a5ae899", credential: "CW4V8T/D1+AnGnED" },
        { urls: "turns:standard.relay.metered.ca:443?transport=tcp", username: "cc29acf1a234c7ca3a5ae899", credential: "CW4V8T/D1+AnGnED" }
    ]
};
const adminId = localStorage.getItem("userId");

if (!adminId) { alert("로그인이 필요합니다."); location.href = "/signin?redirect=/admin/mirroring.html"; throw new Error("로그인 필요"); }

async function closeViewerSession() {
    document.getElementById("viewer").style.display = "none";
    const video = document.getElementById("bigVideo");
    if (video) video.srcObject = null;
    
    if (selectedId) {
        try {
            await updateDoc(doc(db, "users", selectedId), { 
                sharing: false,
                sharingStartedAt: null,
                adminAnswer: null,
                adminCandidates: []
            });
        } catch (e) { console.error(e); }
    }

    if (peerConnection) { 
        try { peerConnection.close(); } catch(e){} 
        peerConnection = null; 
    }
    if (unsubscribeUser) { 
        unsubscribeUser(); 
        unsubscribeUser = null; 
    }
    selectedId = null; 
    addedClientCandidates.clear();
}

async function initAdmin() {
    try {
        const backBtn = document.getElementById("back");
        if (backBtn) { backBtn.onclick = () => { location.href = "/admin/index.html"; }; }

        const closeBtn = document.getElementById("closeViewer");
        if (closeBtn) { closeBtn.onclick = async () => { await closeViewerSession(); }; }

        const adminSnap = await getDoc(doc(db, "users", adminId));
        if (!adminSnap.exists()) { alert("계정을 찾을 수 없습니다."); location.href = "/"; return; }
        const adminData = adminSnap.data();
        if (adminData.role !== "president" && adminData.role !== "vice") { alert("관리자만 접근 가능합니다."); location.href = "/"; return; }
        loadUsers();
    } catch (error) { console.error(error); }
}

function updateOnlineCount(count) { 
    const onlineEl = document.getElementById("online");
    if (onlineEl) onlineEl.innerText = `🟢 접속 ${count}명`; 
}

function createCard(id, data) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h3>${data.name ?? id}</h3><p>ID : ${id}</p><p>상태 : ${data.online ? "온라인" : "오프라인"}</p><p>모드 : ${data.mode ?? "unknown"}</p>`;
    if (data.online === true) { 
        card.onclick = async () => { 
            if (isConnecting) return;
            isConnecting = true;
            try {
                await connectStudent(id); 
            } finally {
                isConnecting = false;
            }
        }; 
    }
    return card;
}

function loadUsers() {
    onSnapshot(collection(db, "users"), async (snapshot) => {
        const grid = document.getElementById("grid"); 
        if (!grid) return;
        grid.innerHTML = ""; 
        let onlineCount = 0;
        
        const now = Date.now();
        snapshot.forEach(async (userDoc) => {
            const data = userDoc.data(); 
            const id = userDoc.id; 
            if (id === adminId) return;

            if (data.online === true && data.updatedAt) {
                const updatedAtMs = data.updatedAt.toMillis ? data.updatedAt.toMillis() : new Date(data.updatedAt).getTime();
                if (now - updatedAtMs > 60000) {
                    try {
                        await updateDoc(doc(db, "users", id), { online: false, state: "offline", sharing: false, sharingStartedAt: null });
                        return; 
                    } catch (e) { console.error(e); }
                }
            }

            if (data.online === true) onlineCount++;
            grid.appendChild(createCard(id, data));
        });
        updateOnlineCount(onlineCount);
    });
}

async function connectStudent(userId) {
    await closeViewerSession();

    selectedId = userId;
    addedClientCandidates.clear();

    document.getElementById("viewer").style.display = "flex";
    document.getElementById("viewerTitle").innerText = `${userId} 화면`;

    const userRef = doc(db, "users", userId);
    
    try {
        await updateDoc(userRef, { 
            sharing: true,
            sharingStartedAt: serverTimestamp(),
            adminAnswer: null,
            adminCandidates: []
        });
    } catch (e) { console.error(e); }

    let data = null;
    let attempts = 0;
    while (attempts < 5) {
        await new Promise(res => setTimeout(res, 1000));
        const snap = await getDoc(userRef);
        if (!snap.exists()) {
            alert("사용자를 찾을 수 없습니다.");
            await closeViewerSession();
            return;
        }
        data = snap.data();
        if (data.clientOffer) break;
        attempts++;
    }

    if (!data || !data.clientOffer) {
        alert("학생이 아직 화면 공유 준비가 되지 않았습니다. 잠시 후 다시 시도해주세요.");
        await closeViewerSession();
        return;
    }

    peerConnection = new RTCPeerConnection(rtcConfig);

    peerConnection.ontrack = (event) => {
        const video = document.getElementById("bigVideo");
        if (event.streams[0] && video) {
            video.srcObject = event.streams[0];
            video.onloadedmetadata = () => { video.play().catch((e) => console.error(e)); };
        }
    };

    peerConnection.onicecandidate = async (event) => {
        if (!event.candidate) return;
        try {
            await updateDoc(userRef, { adminCandidates: arrayUnion(event.candidate.toJSON()) });
        } catch (e) { console.error(e); }
    };

    peerConnection.onconnectionstatechange = () => {
        console.log("[ADMIN] Connection State:", peerConnection.connectionState);
    };

    try {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.clientOffer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        await updateDoc(userRef, {
            adminAnswer: { 
                type: answer.type, 
                sdp: answer.sdp, 
                sessionId: data.clientOffer.sessionId 
            }
        });

        watchClientCandidates(userId);
    } catch (error) { 
        console.error("WebRTC 설정 에러:", error); 
        await closeViewerSession();
    }
}

function watchClientCandidates(userId) {
    const userRef = doc(db, "users", userId);
    unsubscribeUser = onSnapshot(userRef, async (snapshot) => {
        if (!snapshot.exists() || !peerConnection) return;
        const data = snapshot.data();

        if (!data.clientOffer) {
            console.warn("[ADMIN] 학생 측에서 세션이 초기화되었습니다.");
            return;
        }

        if (data.clientCandidates && Array.isArray(data.clientCandidates)) {
            for (const candidate of data.clientCandidates) {
                const key = JSON.stringify(candidate);
                if (addedClientCandidates.has(key)) continue;

                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                    addedClientCandidates.add(key);
                } catch (e) { console.warn(e); }
            }
        }
    });
}

initAdmin();
</script>
</body>
</html>
