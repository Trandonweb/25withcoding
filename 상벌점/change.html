<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>비밀번호 변경 페이지 이동</title>
</head>
<body>
<script>
const params = new URLSearchParams(location.search);
const requested = params.get("redirect") || "/상벌점/main.html";
const safeRedirect = requested.startsWith("/") && !requested.startsWith("//")
  ? requested
  : "/상벌점/main.html";
location.replace("/password_change?redirect=" + encodeURIComponent(safeRedirect));
</script>
<p>비밀번호 변경 페이지로 이동 중입니다.</p>
</body>
</html>
