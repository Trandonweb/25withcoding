<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코딩과 함께라면 2026 Festival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#0f0f14;color:white}.gate-open{overflow:hidden}
#festivalGate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 10% 10%,rgba(0,200,83,.20),transparent 35%),radial-gradient(circle at 90% 90%,rgba(100,221,23,.18),transparent 35%),#0f0f14}.gate-card{width:min(420px,100%);padding:34px 28px;text-align:center;background:rgba(28,28,37,.96);border:1px solid rgba(255,255,255,.08);border-radius:24px;box-shadow:0 25px 70px rgba(0,0,0,.5)}.gate-icon{font-size:52px;margin-bottom:8px}.gate-title{margin:0;font-family:'Black Han Sans',sans-serif;font-size:32px;background:linear-gradient(90deg,#00c853,#64dd17);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.gate-description{margin:14px 0 24px;color:#aaa;font-size:14px;line-height:1.7}.gate-input{width:100%;height:50px;padding:0 16px;border:1px solid #3a3a45;border-radius:13px;background:#15151c;color:white;outline:none;font-size:15px;text-align:center;transition:.2s}.gate-input::placeholder{color:#777}.gate-input:focus{border-color:#00c853;box-shadow:0 0 0 3px rgba(0,200,83,.12)}.gate-button{width:100%;height:50px;margin-top:10px;border:none;border-radius:13px;background:linear-gradient(90deg,#00c853,#64dd17);color:white;font-size:15px;font-weight:bold;cursor:pointer;transition:.2s}.gate-button:hover{filter:brightness(.92);transform:translateY(-1px)}.gate-button:active{transform:translateY(0)}.gate-button:disabled{opacity:.6;cursor:not-allowed;transform:none}.gate-divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:#666;font-size:12px}.gate-divider:before,.gate-divider:after{content:"";flex:1;height:1px;background:#33333d}.gate-error{min-height:20px;margin-top:10px;color:#ff7070;font-size:13px}.gate-success{min-height:20px;margin-top:10px;color:#7cff91;font-size:13px}.gate-loading{color:#aaa;font-size:14px}#festivalGate.hidden{display:none}.home-link{position:fixed;top:18px;left:20px;color:rgba(255,255,255,.75);text-decoration:none;font-size:13px;z-index:1000}.home-link:hover{color:white}header{text-align:center;padding:12px 20px;font-family:'Black Han Sans',sans-serif;font-size:30px;background:linear-gradient(90deg,#00c853,#64dd17);color:white;box-shadow:0 4px 20px rgba(0,0,0,.3)}.subtitle{text-align:center;padding:10px;color:#b8ffb8;font-size:14px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:20px}.card{background:#1c1c25;border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s;display:flex;flex-direction:column}.card:hover{transform:scale(1.03)}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.info{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}.title{font-weight:bold;font-size:18px}.desc{font-size:13px;color:#bbb;height:2.6em;overflow:hidden}.likes{color:#64dd17;margin-top:auto}.like-btn{margin-top:8px;padding:8px;border:none;border-radius:6px;cursor:pointer;background:#00c853;color:white;font-weight:bold}@media(max-width:768px){.grid{grid-template-columns:1fr}header{font-size:24px}.gate-card{padding:30px 22px}.gate-title{font-size:28px}}
</style>
</head>
<body class="gate-open">
<div id="festivalGate"><div class="gate-card"><div class="gate-icon">🎉</div><h1 class="gate-title">2026 FESTIVAL</h1><div class="gate-description" id="gateDescription">축제 입장 정보를 확인하고 있습니다...</div><div id="guestArea" style="display:none"><button class="gate-button" id="loginButton">로그인하기</button><div class="gate-divider">또는</div><input id="accessCodeInput" class="gate-input" type="text" maxlength="5" placeholder="5자리 축제 이용 코드를 입력하세요" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="gate-button" id="accessCodeButton">코드로 입장</button><div class="gate-error" id="gateError"></div></div><div id="memberCodeArea" style="display:none"><input id="memberAccessCodeInput" class="gate-input" type="text" maxlength="5" placeholder="5자리 축제 이용 코드를 입력하세요" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="gate-button" id="memberAccessCodeButton">코드로 입장</button><div class="gate-error" id="memberGateError"></div></div><div id="loadingArea" class="gate-loading">확인 중...</div></div></div>
<a class="home-link" href="/">Home</a><header>코딩과 함께라면 2026 Festival</header><div class="subtitle" id="subtitle"><div>since 2025</div><div>❤️ 지금까지 0번의 응원이 도착했어요!</div></div><div class="grid" id="grid"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import{getFirestore,collection,onSnapshot,doc,updateDoc,increment,getDoc,runTransaction}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9Q",authDomain:"festivallikes.firebaseapp.com",projectId:"festivallikes",storageBucket:"festivallikes.firebasestorage.app",messagingSenderId:"782245120700",appId:"1:782245120700:web:c61e16313e9ae688e6deb9"};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
const loginFirebaseConfig={apiKey:"AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",authDomain:"points2026-f5e50.firebaseapp.com",projectId:"points2026-f5e50"};
const loginApp=initializeApp(loginFirebaseConfig,"loginApp"),loginDB=getFirestore(loginApp);
const festivalGate=document.getElementById("festivalGate"),guestArea=document.getElementById("guestArea"),memberCodeArea=document.getElementById("memberCodeArea"),loadingArea=document.getElementById("loadingArea"),gateDescription=document.getElementById("gateDescription"),gateError=document.getElementById("gateError"),memberGateError=document.getElementById("memberGateError");
function enterFestival(){festivalGate.classList.add("hidden");document.body.classList.remove("gate-open")}
function showGuestGate(){loadingArea.style.display="none";guestArea.style.display="block";memberCodeArea.style.display="none";gateDescription.textContent="축제에 입장하려면 로그인하거나 이용 코드를 입력해주세요."}
function showCodeGate(){loadingArea.style.display="none";guestArea.style.display="none";memberCodeArea.style.display="block";gateDescription.textContent="축제 이용 코드를 입력해주세요."}
document.getElementById("loginButton").addEventListener("click",()=>{const redirect=encodeURIComponent("/2026festival/");location.href=`/signin/?redirect=${redirect}`});
function normalizeCode(value){return value.trim().toUpperCase()}
async function redeemAccessCode(rawCode){const code=normalizeCode(rawCode);if(!/^[A-Z0-9]{5}$/.test(code))return{success:false,message:"축제 이용 코드는 정확히 5자리입니다."};const codeRef=doc(db,"accesscodes",code);try{const result=await runTransaction(db,async transaction=>{const snap=await transaction.get(codeRef);if(!snap.exists())throw new Error("CODE_NOT_FOUND");const data=snap.data();if(data.active===false)throw new Error("CODE_INACTIVE");const max=Number(data.max);const used=Number(data.used||0);if(!Number.isInteger(max)||max<1||max>5)throw new Error("CODE_INVALID");if(used>=max)throw new Error("CODE_EXHAUSTED");transaction.update(codeRef,{used:used+1});return{people:max,used:used+1,max}});sessionStorage.setItem("festival2026CodeAccess","true");sessionStorage.setItem("festival2026AccessCode",code);return{success:true,message:`${result.people}인 이용권으로 입장했습니다.`}}catch(error){console.error("이용 코드 처리 오류:",error);switch(error.message){case"CODE_NOT_FOUND":return{success:false,message:"존재하지 않는 이용 코드입니다."};case"CODE_INACTIVE":return{success:false,message:"사용할 수 없는 이용 코드입니다."};case"CODE_EXHAUSTED":return{success:false,message:"이 코드는 모두 사용되었습니다."};case"CODE_INVALID":return{success:false,message:"올바르지 않은 이용 코드입니다."};default:return{success:false,message:"코드 확인 중 오류가 발생했습니다."}}}}
async function handleCode(input,button,errorElement){errorElement.className="gate-error";errorElement.textContent="";button.disabled=true;button.textContent="확인 중...";try{const result=await redeemAccessCode(input.value);if(result.success){errorElement.className="gate-success";errorElement.textContent=result.message;setTimeout(enterFestival,450)}else errorElement.textContent=result.message}catch(error){console.error("입장 처리 오류:",error);errorElement.textContent="입장 처리 중 오류가 발생했습니다."}finally{button.disabled=false;button.textContent="코드로 입장"}}
document.getElementById("accessCodeButton").addEventListener("click",()=>handleCode(document.getElementById("accessCodeInput"),document.getElementById("accessCodeButton"),gateError));
document.getElementById("memberAccessCodeButton").addEventListener("click",()=>handleCode(document.getElementById("memberAccessCodeInput"),document.getElementById("memberAccessCodeButton"),memberGateError));
for(const id of ["accessCodeInput","memberAccessCodeInput"])document.getElementById(id).addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById(id==="accessCodeInput"?"accessCodeButton":"memberAccessCodeButton").click()});
async function checkFestivalAccess(){if(sessionStorage.getItem("festival2026CodeAccess")==="true"){enterFestival();return}const userId=localStorage.getItem("userId");if(!userId){showGuestGate();return}try{const userSnap=await getDoc(doc(loginDB,"users",userId));if(userSnap.exists()){enterFestival();return}showCodeGate()}catch(error){console.error("로그인 상태 확인 실패:",error);showCodeGate();gateDescription.textContent="로그인 상태를 확인하지 못했습니다. 이용 코드를 입력해주세요."}}
checkFestivalAccess();
const grid=document.getElementById("grid");
function loadProjects(){onSnapshot(collection(db,"projects"),snap=>{grid.innerHTML="";const projects=[];snap.forEach(docSnap=>projects.push({id:docSnap.id,...docSnap.data()}));projects.sort((a,b)=>(b.likes||0)-(a.likes||0));const totalLikes=projects.reduce((sum,p)=>sum+(p.likes||0),0);document.getElementById("subtitle").innerHTML=`<div>since 2025</div><div>❤️ 지금까지 ${totalLikes.toLocaleString()}번의 응원이 도착했어요</div>`;projects.forEach((p,index)=>{const medal=index===0?"🥇 ":index===1?"🥈 ":index===2?"🥉 ":"";const card=document.createElement("div");card.className="card";card.innerHTML=`<img src="${p.thum}" alt="${p.id}"><div class="info"><div class="title">${medal}${p.id}</div><div class="desc">${p.detail}</div><div class="likes">❤️ ${p.likes||0}</div><button class="like-btn">응원하기</button></div>`;card.onclick=()=>{location.href=p.url};card.querySelector(".like-btn").onclick=async event=>{event.stopPropagation();try{await updateDoc(doc(db,"projects",p.id),{likes:increment(1)})}catch(error){console.error("응원 처리 실패:",error)}};grid.appendChild(card)})},error=>console.error("작품 목록 불러오기 실패:",error))}
loadProjects();
</script>
</body>
</html>
