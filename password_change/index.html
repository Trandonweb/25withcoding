<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>코딩과 함께라면_비밀번호 변경</title>
  <style>
    :root{--bg:#f0f0f0;--card:#fff;--text:#111;--sub:#666;--input:#f8fafc;--border:#e1e8ed;--primary:#27ae60}
    body.dark-mode{--bg:#121212;--card:#1e1e1e;--text:#fff;--sub:#aaa;--input:#2a2a2a;--border:#333}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:var(--bg);color:var(--text);font-family:'Malgun Gothic',sans-serif}
    .card{width:min(100%,380px);padding:35px 30px;border:1px solid var(--border);border-radius:24px;background:var(--card);text-align:center;box-shadow:0 8px 30px #0001}
    h1{margin:0 0 8px;font-size:20px}h2{margin:0 0 25px;color:var(--sub);font-size:14px;font-weight:normal}
    input{width:100%;padding:14px 16px;margin:8px 0;border:1px solid var(--border);border-radius:16px;background:var(--input);color:var(--text);font-size:14px;outline:none}
    input:focus{border-color:var(--primary)}.pw-wrap{position:relative}.pw-wrap input{padding-right:48px}.toggle{position:absolute;right:15px;top:50%;transform:translateY(-50%);cursor:pointer;opacity:.7}
    button{width:100%;height:50px;margin-top:15px;border:0;border-radius:16px;background:var(--primary);color:#fff;font-size:15px;font-weight:bold;cursor:pointer}button:disabled{opacity:.7;cursor:wait}
    .message{min-height:18px;margin-top:12px;color:var(--sub);font-size:13px;line-height:1.5}.back{display:inline-block;margin-top:14px;color:var(--sub);font-size:13px;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>2026 코딩과 함께라면</h1><h2>비밀번호 변경</h2>
    <input id="pw1" type="password" autocomplete="new-password" placeholder="새 비밀번호 (6자 이상)">
    <div class="pw-wrap"><input id="pw2" type="password" autocomplete="new-password" placeholder="새 비밀번호 확인"><span class="toggle" role="button" tabindex="0" aria-label="비밀번호 표시" onclick="togglePw()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePw()}">👁</span></div>
    <button id="changeBtn" type="button" onclick="changePassword()">비밀번호 변경</button>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <a class="back" id="backLink" href="/">취소하고 돌아가기</a>
  </main>
<script>
const API_PATH="/api/points2026/auth";
const SETTINGS_KEY="coding_with_ramen_settings";
const params=new URLSearchParams(location.search);
const rawRedirect=params.get("redirect")||"/상벌점/main.html";
const redirect=rawRedirect.startsWith("/")&&!rawRedirect.startsWith("//")?rawRedirect:"/상벌점/main.html";
document.getElementById("backLink").href=redirect;
try{const s=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}");document.body.classList.toggle("dark-mode",!!s.darkMode);if(typeof s.primaryColor==="string"&&/^#[0-9a-f]{6}$/i.test(s.primaryColor))document.documentElement.style.setProperty("--primary",s.primaryColor)}catch{}
window.togglePw=()=>{const a=document.getElementById("pw1"),b=document.getElementById("pw2");const t=a.type==="password"?"text":"password";a.type=t;b.type=t};
async function callAuth(operation,payload){
  const response=await fetch(API_PATH,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({operation,payload})});
  let data={};try{data=await response.json()}catch{}
  if(!response.ok||data.error?.message||data.error)throw new Error(String(data.error?.message||data.error||"REQUEST_FAILED"));
  return data;
}
window.changePassword=async()=>{
  const p1=document.getElementById("pw1").value,p2=document.getElementById("pw2").value;
  const button=document.getElementById("changeBtn"),message=document.getElementById("message");
  const idToken=localStorage.getItem("firebaseIdToken");
  if(!idToken){message.textContent="로그인이 필요합니다. 다시 로그인해 주세요.";return}
  if(p1.length<6){message.textContent="비밀번호는 6자 이상이어야 합니다.";return}
  if(p1!==p2){message.textContent="입력한 비밀번호가 서로 일치하지 않습니다.";return}
  button.disabled=true;button.textContent="변경 중...";message.textContent="";
  try{
    const result=await callAuth("update",{idToken,password:p1,returnSecureToken:true});
    if(result.idToken)localStorage.setItem("firebaseIdToken",result.idToken);
    if(result.refreshToken)localStorage.setItem("firebaseRefreshToken",result.refreshToken);
    document.getElementById("pw1").value="";document.getElementById("pw2").value="";
    message.textContent="비밀번호가 변경되었습니다.";
    setTimeout(()=>location.replace(redirect),900);
  }catch(error){
    console.error("비밀번호 변경 요청 실패",error.message);
    const code=error.message;
    const messages={
      "TOKEN_EXPIRED":"로그인 세션이 만료되었습니다. 다시 로그인해 주세요.",
      "CREDENTIAL_TOO_OLD_LOGIN_AGAIN":"보안을 위해 다시 로그인한 뒤 변경해 주세요.",
      "WEAK_PASSWORD":"더 안전한 비밀번호를 입력해 주세요. (6자 이상)",
      "INVALID_ID_TOKEN":"로그인 세션이 유효하지 않습니다. 다시 로그인해 주세요.",
      "Failed to fetch":"Cloudflare 인증 API에 연결할 수 없습니다."
    };
    message.textContent=messages[code]||"비밀번호 변경에 실패했습니다. 로그인 상태와 Cloudflare API를 확인해 주세요.";
  }finally{button.disabled=false;button.textContent="비밀번호 변경"}
};
</script>
</body>
</html>
