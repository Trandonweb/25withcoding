<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coby AI</title>

<style>
:root{
    --bg-color:#ffffff;
    --card-bg:#ffffff;
    --text-color:#222222;
    --header-text:#222222;
    --card-sub-bg:#f5f5f5;
    --border-color:#dddddd;
    --border-sub-color:#e5e5e5;
    --input-bg:#ffffff;
    --input-focus-bg:#ffffff;
    --primary-color:#27ae60;
    --btn-bg:var(--primary-color);
    --btn-text:#ffffff;
    --badge-bg:#eeeeee;
    --badge-text:#555555;
}

body.dark-mode{
    --bg-color:#121212;
    --card-bg:#1e1e1e;
    --text-color:#ffffff;
    --header-text:#ffffff;
    --card-sub-bg:#2a2a2a;
    --border-color:#333333;
    --border-sub-color:#333333;
    --input-bg:#2a2a2a;
    --input-focus-bg:#1e1e1e;
    --btn-bg:var(--primary-color);
    --btn-text:#ffffff;
    --badge-bg:#333333;
    --badge-text:#e0e0e0;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",Arial,sans-serif;
    background:var(--bg-color);
    color:var(--text-color);
    height:100vh;
    overflow:hidden;
    transition:background .2s,color .2s;
}

/* ===== Header ===== */

.header{
    height:64px;
    display:flex;
    align-items:center;
    padding:0 20px;
    position:relative;
    background:linear-gradient(
        to bottom,
        color-mix(in srgb,var(--card-bg) 92%,var(--primary-color)),
        var(--bg-color)
    );
    border-bottom:1px solid var(--border-color);
}

.menu-btn{
    width:42px;
    height:42px;
    border-radius:12px;
    border:none;
    background:var(--card-bg);
    color:var(--text-color);
    font-size:24px;
    cursor:pointer;
    margin:0;
}

.logo{
    margin-left:15px;
    font-size:22px;
    font-weight:700;
    color:var(--primary-color);
}

/* ===== Sidebar ===== */

.sidebar{
    position:fixed;
    left:-280px;
    top:0;
    width:280px;
    height:100vh;
    background:var(--card-bg);
    color:var(--text-color);
    box-shadow:3px 0 20px rgba(0,0,0,.15);
    transition:.3s;
    z-index:10;
    display:flex;
    flex-direction:column;
    border-right:1px solid var(--border-color);
}

.sidebar.open{
    left:0;
}

.side-top{
    padding:20px;
}

.side-btn{
    width:100%;
    padding:14px;
    margin:0 0 10px 0;
    border:none;
    border-radius:12px;
    background:var(--card-sub-bg);
    color:var(--text-color);
    text-align:left;
    font-size:15px;
    cursor:pointer;
}

.side-btn:hover{
    background:color-mix(
        in srgb,
        var(--primary-color) 10%,
        var(--card-sub-bg)
    );
}

.side-title{
    margin-top:20px;
    font-size:13px;
    color:var(--badge-text);
}

.chat-list{
    flex:1;
    overflow:auto;
    padding:10px 20px;
}

.chat-item{
    padding:11px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:4px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.chat-item:hover{
    background:var(--card-sub-bg);
}

.chat-item.active{
    background:color-mix(
        in srgb,
        var(--primary-color) 12%,
        var(--card-sub-bg)
    );
    color:var(--primary-color);
    font-weight:bold;
}

.chat-project{
    display:block;
    font-size:11px;
    margin-top:3px;
    color:var(--badge-text);
    font-weight:normal;
}

.profile{
    margin:15px;
    padding:12px;
    border-radius:30px;
    background:var(--card-sub-bg);
    display:flex;
    align-items:center;
    cursor:pointer;
}

.profile-circle{
    width:35px;
    height:35px;
    flex-shrink:0;
    border-radius:50%;
    background:var(--primary-color);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-right:10px;
    font-weight:bold;
}

/* ===== Main ===== */

.main{
    height:calc(100vh - 64px);
    display:flex;
    flex-direction:column;
}

.messages{
    flex:1;
    overflow:auto;
    padding:30px max(20px,8vw);
}

.welcome{
    margin-top:100px;
    text-align:center;
}

.welcome h2{
    color:var(--header-text);
    font-size:28px;
}

.welcome p{
    color:var(--badge-text);
    font-size:16px;
}

.message{
    max-width:800px;
    margin:20px auto;
    padding:15px;
    border-radius:15px;
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.55;
}

.message.ai{
    background:var(--card-sub-bg);
    color:var(--text-color);
    border:1px solid var(--border-sub-color);
    margin-right:auto;
}

.message.user{
    background:var(--primary-color);
    color:#fff;
    margin-left:auto;
    border:none;
}

.message.thinking{
    opacity:.7;
}

/* ===== Input ===== */

.input-area{
    padding:20px;
    display:flex;
    justify-content:center;
}

.input-box{
    width:min(800px,90%);
    display:flex;
    align-items:center;
    background:var(--input-bg);
    border:1px solid var(--border-color);
    border-radius:25px;
    padding:8px;
    transition:.2s;
}

.input-box:focus-within{
    border-color:var(--primary-color);
    background:var(--input-focus-bg);
}

input{
    flex:1;
    min-width:0;
    border:none;
    outline:none;
    padding:12px;
    background:transparent;
    color:var(--text-color);
    font-size:15px;
}

input::placeholder{
    color:var(--badge-text);
}

.send{
    width:45px;
    height:45px;
    flex-shrink:0;
    border-radius:50%;
    border:none;
    background:var(--btn-bg);
    color:var(--btn-text);
    cursor:pointer;
    font-size:18px;
    margin:0;
}

.send:hover{
    filter:brightness(.92);
}

.send:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* ===== Overlay ===== */

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.2);
    z-index:5;
}

.overlay.show{
    display:block;
}

/* ===== Project modal ===== */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:30;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.35);
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(430px,100%);
    background:var(--card-bg);
    color:var(--text-color);
    border:1px solid var(--border-color);
    border-radius:24px;
    padding:25px;
    box-shadow:0 15px 45px rgba(0,0,0,.2);
}

.modal-card h3{
    margin:0 0 15px;
}

.modal-card input{
    width:100%;
    margin:0 0 12px 0;
    padding:13px 15px;
    border:1px solid var(--border-color);
    border-radius:16px;
    background:var(--input-bg);
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

.modal-actions button{
    margin:0;
}

.cancel-btn{
    background:var(--card-sub-bg)!important;
    color:var(--text-color)!important;
}

/* ===== Project selector ===== */

.project-bar{
    display:none;
    align-items:center;
    gap:8px;
    padding:8px 20px 0;
    color:var(--badge-text);
    font-size:13px;
}

.project-bar.show{
    display:flex;
}

.project-badge{
    padding:6px 11px;
    border-radius:10px;
    background:var(--badge-bg);
    color:var(--badge-text);
}

.status{
    font-size:12px;
    color:var(--badge-text);
}

@media(max-width:600px){
    .messages{
        padding:20px 12px;
    }

    .message{
        max-width:92%;
    }

    .welcome{
        margin-top:60px;
    }

    .welcome h2{
        font-size:23px;
    }

    .input-area{
        padding:12px;
    }

    .input-box{
        width:100%;
    }
}
</style>
</head>

<body>

</div>

<div class="sidebar" id="sidebar">

</div>
<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    addDoc,
    collection,
    query,
    where,
    orderBy,
    limit,
    getDocs,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =========================================================
   Firebase
   ========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAiO65YzYeRfuf6fCzosuW7OAVV47o47Js",

    authDomain:
        "coby-ai-328dd.firebaseapp.com",

    databaseURL:
        "https://coby-ai-328dd-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "coby-ai-328dd",

    storageBucket:
        "coby-ai-328dd.firebasestorage.app",

    messagingSenderId:
        "865530259286",

    appId:
        "1:865530259286:web:6feaa5781dc538700b18f7"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   Coby 사용자 정보
   ========================================================= */

const STUDENT_NUMBER = "20623";
const DEFAULT_NAME = "Trandon";


/*
 * 중요:
 *
 * Firebase Auth UID와 학교 학번은 서로 다른 값이다.
 *
 * Firebase Auth:
 *     실제 접근 권한 확인
 *
 * 학번:
 *     Firestore에서 사람 문서의 ID
 *
 * 최종 구조:
 *
 * people/20623
 *
 */

let currentUser = null;
let currentPersonRef = null;


/* =========================================================
   현재 대화
   ========================================================= */

let currentConversationId = null;
let currentConversationTitle = null;

let currentProjectId = null;
let currentProjectName = null;

let unsubscribeMessages = null;
let unsubscribeConversations = null;


/* =========================================================
   DOM
   ========================================================= */

const messagesElement =
    document.getElementById("messages");

const welcomeElement =
    document.getElementById("welcome");

const inputElement =
    document.getElementById("userInput");

const sendButton =
    document.getElementById("sendButton");

const chatListElement =
    document.getElementById("chatList");

const projectModal =
    document.getElementById("projectModal");

const projectNameInput =
    document.getElementById("projectNameInput");

const projectDescriptionInput =
    document.getElementById("projectDescriptionInput");

const projectBar =
    document.getElementById("projectBar");

const currentProjectNameElement =
    document.getElementById("currentProjectName");

const saveStatusElement =
    document.getElementById("saveStatus");


/* =========================================================
   Sidebar
   ========================================================= */

window.openMenu = function(){

    document
        .getElementById("sidebar")
        .classList
        .add("open");

    document
        .getElementById("overlay")
        .classList
        .add("show");
};


window.closeMenu = function(){

    document
        .getElementById("sidebar")
        .classList
        .remove("open");

    document
        .getElementById("overlay")
        .classList
        .remove("show");
};


/* =========================================================
   메시지 화면
   ========================================================= */

function clearMessages(){

    messagesElement.innerHTML = "";

}


function addMessage(text,type,options={}){

    const message =
        document.createElement("div");

    message.className =
        `message ${type}`;

    if(options.id){
        message.dataset.messageId =
            options.id;
    }

    message.textContent =
        text;

    messagesElement.appendChild(message);

    messagesElement.scrollTop =
        messagesElement.scrollHeight;

    return message;
}


/* =========================================================
   Firebase Auth
   ========================================================= */

async function initializeAuth(){

    try{

        /*
         * 현재는 익명 인증을 사용한다.
         *
         * 나중에 25withcoding 기존 로그인 시스템과
         * Firebase Authentication을 연결할 경우
         * 이 부분만 교체하면 된다.
         */

        await signInAnonymously(auth);

    }catch(error){

        console.error(
            "Firebase Auth error:",
            error
        );

        alert(
            "Firebase 인증에 실패했습니다.\n" +
            "Firebase Authentication에서 익명 인증이 " +
            "활성화되어 있는지 확인해주세요."
        );

    }

}


/* =========================================================
   사용자 문서
   ========================================================= */

async function initializePerson(){

    if(!currentUser){
        throw new Error(
            "Firebase 사용자가 없습니다."
        );
    }

    currentPersonRef =
        doc(
            db,
            "people",
            STUDENT_NUMBER
        );


    const snapshot =
        await getDoc(currentPersonRef);


    if(!snapshot.exists()){

        /*
         * 최초 접속
         */

        await setDoc(
            currentPersonRef,
            {
                studentNumber:
                    STUDENT_NUMBER,

                name:
                    DEFAULT_NAME,

                ownerUid:
                    currentUser.uid,

                createdAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()
            }
        );

    }else{

        /*
         * 기존 사용자라면
         * 이름이나 기본 정보는 유지한다.
         *
         * ownerUid가 현재 Auth UID와 다른 경우에는
         * 임의로 덮어쓰지 않는다.
         */

        const data =
            snapshot.data();

        if(data.ownerUid !== currentUser.uid){

            console.error(
                "이 학번은 다른 Firebase 사용자에게 연결되어 있습니다."
            );

            throw new Error(
                "이 학번은 현재 계정과 연결되어 있지 않습니다."
            );
        }

    }

}


/* =========================================================
   대화 제목 만들기
   ========================================================= */

function makeConversationTitle(text){

    const clean =
        text
            .replace(/\s+/g," ")
            .trim();

    if(!clean){
        return "새 대화";
    }

    return clean.length > 35
        ? clean.slice(0,35) + "..."
        : clean;
}


/* =========================================================
   새 대화 생성
   ========================================================= */

async function createConversation(firstMessage){

    if(!currentPersonRef){
        throw new Error(
            "사용자 정보가 준비되지 않았습니다."
        );
    }


    const title =
        makeConversationTitle(firstMessage);


    const conversationRef =
        await addDoc(
            collection(
                currentPersonRef,
                "conversations"
            ),
            {

                title:

                    title,

                projectId:

                    currentProjectId || null,

                projectName:

                    currentProjectName || null,

                createdAt:

                    serverTimestamp(),

                updatedAt:

                    serverTimestamp()
            }
        );


    currentConversationId =
        conversationRef.id;

    currentConversationTitle =
        title;


    await loadRecentConversations();


    return conversationRef;

}


/* =========================================================
   최근 대화
   ========================================================= */

async function loadRecentConversations(){

    if(!currentPersonRef){
        return;
    }


    chatListElement.innerHTML =
        `<div class="chat-item">
            대화를 불러오는 중...
        </div>`;


    try{

        const conversationsRef =
            collection(
                currentPersonRef,
                "conversations"
            );


        const conversationsQuery =
            query(
                conversationsRef,
                orderBy(
                    "updatedAt",
                    "desc"
                ),
                limit(30)
            );


        const snapshot =
            await getDocs(
                conversationsQuery
            );


        chatListElement.innerHTML = "";


        if(snapshot.empty){

            chatListElement.innerHTML =
                `<div class="chat-item">
                    아직 대화가 없습니다.
                </div>`;

            return;

        }


        snapshot.forEach(
            conversationSnapshot => {

                const data =
                    conversationSnapshot.data();


                const item =
                    document.createElement("div");


                item.className =
                    "chat-item";


                item.dataset.id =
                    conversationSnapshot.id;


                if(
                    conversationSnapshot.id ===
                    currentConversationId
                ){

                    item.classList.add(
                        "active"
                    );

                }


                const title =
                    data.title ||
                    "제목 없는 대화";


                item.innerHTML =
                    `<span>
                        ${escapeHtml(title)}
                    </span>
                    ${
                        data.projectName
                        ?
                        `<span class="chat-project">
                            📁 ${escapeHtml(data.projectName)}
                        </span>`
                        :
                        ""
                    }`;


                item.addEventListener(
                    "click",
                    () => {

                        loadConversation(
                            conversationSnapshot.id
                        );

                    }
                );


                chatListElement.appendChild(
                    item
                );

            }
        );


    }catch(error){

        console.error(
            "최근 대화 불러오기 실패:",
            error
        );


        chatListElement.innerHTML =
            `<div class="chat-item">
                대화를 불러오지 못했습니다.
            </div>`;

    }

}


function escapeHtml(value){

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");
}
/* =========================================================
   대화 불러오기
   ========================================================= */

async function loadConversation(conversationId){

    if(!currentPersonRef){
        return;
    }


    try{

        const conversationRef =
            doc(
                currentPersonRef,
                "conversations",
                conversationId
            );


        const conversationSnapshot =
            await getDoc(
                conversationRef
            );


        if(!conversationSnapshot.exists()){

            alert(
                "대화를 찾을 수 없습니다."
            );

            return;

        }


        const conversation =
            conversationSnapshot.data();


        currentConversationId =
            conversationId;

        currentConversationTitle =
            conversation.title ||
            "새 대화";


        currentProjectId =
            conversation.projectId ||
            null;

        currentProjectName =
            conversation.projectName ||
            null;


        updateProjectUI();


        clearMessages();


        const messagesRef =
            collection(
                conversationRef,
                "messages"
            );


        const messagesQuery =
            query(
                messagesRef,
                orderBy(
                    "createdAt",
                    "asc"
                )
            );


        const snapshot =
            await getDocs(
                messagesQuery
            );


        if(snapshot.empty){

            showWelcome();

        }else{

            snapshot.forEach(
                messageSnapshot => {

                    const data =
                        messageSnapshot.data();


                    addMessage(
                        data.content || "",
                        data.role === "user"
                            ? "user"
                            : "ai",
                        {
                            id:
                                messageSnapshot.id
                        }
                    );

                }
            );

        }


        document
            .querySelectorAll(".chat-item")
            .forEach(item => {

                item.classList.toggle(
                    "active",
                    item.dataset.id ===
                    conversationId
                );

            });


        closeMenu();


    }catch(error){

        console.error(
            "대화 불러오기 실패:",
            error
        );


        alert(
            "대화를 불러오지 못했습니다."
        );

    }

}


function showWelcome(){

    clearMessages();

    const welcome =
        document.createElement("div");

    welcome.className =
        "welcome";

    welcome.id =
        "welcome";

    welcome.innerHTML =
        `
        <h2>어서오세요, Trandon님!</h2>
        <p>
            무한한 상상의 나래를 펼쳐요 🚀
            <br>
            Coby가 당신의 코딩 여정을 함께합니다.
        </p>
        `;

    messagesElement.appendChild(
        welcome
    );

}


/* =========================================================
   메시지 저장
   ========================================================= */

async function saveMessage(
    conversationId,
    role,
    content
){

    if(!currentPersonRef){
        throw new Error(
            "사용자 정보가 없습니다."
        );
    }


    const conversationRef =
        doc(
            currentPersonRef,
            "conversations",
            conversationId
        );


    const messagesRef =
        collection(
            conversationRef,
            "messages"
        );


    await addDoc(
        messagesRef,
        {

            role:

                role,

            content:

                content,

            createdAt:

                serverTimestamp()

        }
    );


    await setDoc(
        conversationRef,
        {

            updatedAt:
                serverTimestamp()

        },
        {
            merge:true
        }
    );

}


/* =========================================================
   AI에게 보낼 대화 기록
   ========================================================= */

async function getConversationHistory(){

    if(
        !currentPersonRef ||
        !currentConversationId
    ){

        return [];

    }


    const conversationRef =
        doc(
            currentPersonRef,
            "conversations",
            currentConversationId
        );


    const messagesRef =
        collection(
            conversationRef,
            "messages"
        );


    const messagesQuery =
        query(
            messagesRef,
            orderBy(
                "createdAt",
                "asc"
            ),
                limit(30)
        );


    const snapshot =
        await getDocs(
            messagesQuery
        );


    const history = [];


    snapshot.forEach(
        messageSnapshot => {

            const data =
                messageSnapshot.data();


            history.push({

                role:
                    data.role,

                content:
                    data.content

            });

        }
    );


    return history;

}


/* =========================================================
   Render API
   ========================================================= */

async function requestCoby(
    text,
    history
){

    const response =
        await fetch(
            "https://two5withcoding.onrender.com/chat",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        message:
                            text,

                        history:
                            history,

                        projectId:
                            currentProjectId,

                        projectName:
                            currentProjectName

                    })
            }
        );


    if(!response.ok){

        throw new Error(
            `HTTP ${response.status}`
        );

    }


    const data =
        await response.json();


    return data.answer ||
        "응답이 없습니다.";

}


/* =========================================================
   메시지 전송
   ========================================================= */

async function sendMessage(){

    const text =
        inputElement.value.trim();


    if(
        !text ||
        sendButton.disabled ||
        !currentUser
    ){

        return;

    }


    const welcome =
        document.getElementById(
            "welcome"
        );


    if(welcome){
        welcome.remove();
    }


    addMessage(
        text,
        "user"
    );


    inputElement.value = "";

    sendButton.disabled = true;


    saveStatusElement.textContent =
        "저장 중...";


    try{

        /*
         * 아직 대화가 없다면
         * 첫 메시지를 이용해 자동으로 생성한다.
         */

        if(!currentConversationId){

            await createConversation(
                text
            );

        }


        /*
         * 사용자 메시지 저장
         */

        await saveMessage(
            currentConversationId,
            "user",
            text
        );


        /*
         * 최근 대화 목록 갱신
         */

        await loadRecentConversations();


        /*
         * AI에게 전달할 기존 대화 기록
         */

        const history =
            await getConversationHistory();


        const thinking =
            addMessage(
                "Coby가 생각하고 있어요...",
                "ai"
            );


        thinking.classList.add(
            "thinking"
        );


        /*
         * Render /chat 호출
         */

        const answer =
            await requestCoby(
                text,
                history
            );


        thinking.classList.remove(
            "thinking"
        );


        thinking.textContent =
            answer;


        /*
         * AI 응답 Firebase 저장
         */

        await saveMessage(
            currentConversationId,
            "assistant",
            answer
        );


        saveStatusElement.textContent =
            "저장됨";


        /*
         * 대화 목록에서 최신 대화를
         * 위쪽으로 다시 정렬
         */

        await loadRecentConversations();


    }catch(error){

        console.error(
            "Coby error:",
            error
        );


        const errorMessage =
            "Coby 서버 또는 Firebase에 문제가 발생했습니다.";


        addMessage(
            errorMessage,
            "ai"
        );


        saveStatusElement.textContent =
            "오류";


    }finally{

        sendButton.disabled = false;

        inputElement.focus();

    }

}


/* =========================================================
   새 채팅
   ========================================================= */

async function startNewChat(){

    currentConversationId =
        null;

    currentConversationTitle =
        null;


    clearMessages();


    showWelcome();


    currentProjectId =
        null;

    currentProjectName =
        null;


    updateProjectUI();


    document
        .querySelectorAll(".chat-item")
        .forEach(item => {

            item.classList.remove(
                "active"
            );

        });


    closeMenu();


    inputElement.focus();

}


/* =========================================================
   프로젝트 UI
   ========================================================= */

function updateProjectUI(){

    if(currentProjectId){

        projectBar.classList.add(
            "show"
        );


        currentProjectNameElement.textContent =
            currentProjectName ||
            "이름 없는 프로젝트";

    }else{

        projectBar.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   프로젝트 모달
   ========================================================= */

window.openProjectModal =
    function(){

        projectNameInput.value =
            "";

        projectDescriptionInput.value =
            "";

        projectModal.classList.add(
            "show"
        );

        projectNameInput.focus();

    };


window.closeProjectModal =
    function(){

        projectModal.classList.remove(
            "show"
        );

    };


async function createProject(){

    const name =
        projectNameInput.value.trim();


    const description =
        projectDescriptionInput.value.trim();


    if(!name){

        alert(
            "프로젝트 이름을 입력해주세요."
        );

        return;

    }


    if(!currentPersonRef){

        alert(
            "Firebase 사용자 정보가 아직 준비되지 않았습니다."
        );

        return;

    }


    try{

        const projectRef =
            await addDoc(
                collection(
                    currentPersonRef,
                    "projects"
                ),
                {

                    name:

                        name,

                    description:

                        description,

                    createdAt:

                        serverTimestamp(),

                    updatedAt:

                        serverTimestamp()

                }
            );


        currentProjectId =
            projectRef.id;

        currentProjectName =
            name;


        currentConversationId =
            null;

        currentConversationTitle =
            null;


        updateProjectUI();


        clearMessages();

        showWelcome();


        closeProjectModal();

        closeMenu();


        inputElement.focus();


    }catch(error){

        console.error(
            "프로젝트 생성 실패:",
            error
        );


        alert(
            "프로젝트를 만들지 못했습니다."
        );

    }

}


/* =========================================================
   프로젝트 버튼
   ========================================================= */

document
    .getElementById("projectButton")
    .addEventListener(
        "click",
        () => {

            window.openProjectModal();

        }
    );


/* =========================================================
   새 채팅 버튼
   ========================================================= */

document
    .getElementById("newChatButton")
    .addEventListener(
        "click",
        startNewChat
    );


/* =========================================================
   Enter
   ========================================================= */

inputElement.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   초기화
   ========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){
            return;
        }


        currentUser =
            user;


        try{

            await initializePerson();

            await loadRecentConversations();


            document.getElementById(
                "profileName"
            ).textContent =
                DEFAULT_NAME;


            document.getElementById(
                "profileStudentNumber"
            ).textContent =
                STUDENT_NUMBER;


            document.getElementById(
                "profileCircle"
            ).textContent =
                DEFAULT_NAME
                    .charAt(0)
                    .toUpperCase();


            inputElement.focus();


        }catch(error){

            console.error(
                "Coby 초기화 실패:",
                error
            );


            chatListElement.innerHTML =
                `
                <div class="chat-item">
                    Firebase 연결에 실패했습니다.
                </div>
                `;

        }

    }
);


/*
 * 익명 인증 시작
 */

initializeAuth();
