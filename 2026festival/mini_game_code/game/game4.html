<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4목</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#071b12,#123b27);color:white;font-family:Arial,'Noto Sans KR',sans-serif;display:grid;place-items:center;padding:16px}.wrap{width:min(650px,100%);text-align:center}h1{font-size:42px}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:#10251a;padding:12px;border-radius:16px}.cell{aspect-ratio:1;border:0;border-radius:50%;background:#294532;cursor:pointer}.p1{background:#53e88a}.p2{background:#ffcf67}.btn{padding:12px 20px;border:0;border-radius:10px;background:#1ea857;color:white;font-weight:bold;cursor:pointer}.hidden{display:none}.muted{color:#b7cbb9}
/* Shared MINI GAME visual refresh */
:root{color-scheme:dark;--mg-bg:#07110d;--mg-panel:rgba(14,35,25,.88);--mg-line:rgba(150,255,190,.18);--mg-green:#53e88a;--mg-mint:#b9ffd2}body{background:radial-gradient(ellipse at 12% 0%,#17442c 0%,transparent 42%),radial-gradient(ellipse at 100% 100%,#102d20 0%,transparent 45%),#050b08!important;color:#f3fff6!important;font-family:Inter,'Noto Sans KR',Arial,sans-serif!important}h1,h2,h3,.title,.logo{letter-spacing:-.035em}h1{ text-shadow:0 5px 28px rgba(83,232,138,.12)}button,.btn,.next,.setbtn{font-family:inherit!important;transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease!important}button:hover,.btn:hover,.next:hover,.setbtn:hover{transform:translateY(-2px);box-shadow:0 8px 24px #0005}button:focus-visible,.btn:focus-visible,.next:focus-visible,.setbtn:focus-visible{outline:2px solid var(--mg-green);outline-offset:3px}.wrap{position:relative}.arena,.setting,.summary,.history,.board,canvas,.card{box-shadow:0 18px 48px #0003}canvas{border:1px solid var(--mg-line);box-shadow:0 0 0 5px #ffffff05,0 20px 55px #0005}p{line-height:1.65}.muted,.desc,.sub{color:#b8cdbf}
/* Responsive full-screen layout: keep the game inside the visible viewport. */

body{width:100%;height:100dvh;min-height:0!important;overflow:hidden!important;padding:clamp(6px,1.2vh,14px)!important;overscroll-behavior:none}
.wrap{width:min(100%,1000px);max-height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:clamp(3px,0.7vh,8px);padding:0!important;margin:auto}

/* Refined MINI GAME interface */
:root{color-scheme:light;--mg-ink:#17251c;--mg-muted:#617166;--mg-green:#187447;--mg-line:#dbe5dc}
body{background:#f2f5f1!important;color:var(--mg-ink)!important;font-family:Inter,'Noto Sans KR',system-ui,sans-serif!important}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 0% 0%,#dceee0 0,transparent 40%);z-index:-1}
.wrap{color:var(--mg-ink)!important}
.top,.sub,.desc,.muted,.hint,.instruction,.info,.help,.round,.note{color:var(--mg-muted)!important}
.arena,.setting,.summary,.history,.card,.score,.keyhelp span{background:#fff!important;color:var(--mg-ink)!important;border:1px solid var(--mg-line)!important;box-shadow:0 12px 35px #203b2810!important}
.card{border-radius:16px!important}
button,.btn,.next,.done,.resultBtn{background:#187447!important;color:#fff!important;border:1px solid #187447!important;border-radius:11px!important;font-weight:750!important}
button:disabled{opacity:.42!important}
button:hover,.btn:hover,.next:hover,.done:hover{background:#12613a!important;box-shadow:0 7px 18px #18744722!important}
input{background:#fff!important;color:var(--mg-ink)!important;border:1px solid #cbd8cd!important}
.cell{background:#e8eee9!important;border:1px solid #d5e0d7!important}
.cell.me,.p1{background:#2e9b5c!important}.cell.opp,.p2{background:#edbd56!important}
.icon{display:none!important}
#miniSoundPanel button{background:#fff!important;color:#23412d!important;border:1px solid #d4e0d5!important;box-shadow:0 4px 14px #0001!important}
@media(max-width:650px){.card .desc{display:none!important}#projectShortDescription,#projectCreator{display:block!important}.wrap{padding:0!important}}
.countdown{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#10251acc;backdrop-filter:blur(8px)}.countdown div{font-size:clamp(70px,20vw,160px);font-weight:950;color:#fff;letter-spacing:-.06em;text-shadow:0 10px 40px #0005;animation:countpop .55s ease}@keyframes countpop{from{transform:scale(1.35);opacity:.2}to{transform:scale(1);opacity:1}}.countdown.hidden{display:none!important}.wrap{width:min(1000px,96vw);display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.85fr);gap:12px;text-align:left;padding:clamp(12px,3vw,30px)}.board{grid-column:2;grid-row:2 / span 4;align-self:center;width:100%;gap:clamp(3px,.7vw,8px);padding:clamp(7px,1.2vw,14px);background:#174a30!important;border:1px solid #246441!important;border-radius:24px}.cell{aspect-ratio:1;border-radius:50%;background:#e6eee8!important;border:2px solid #cddbd0!important;box-shadow:inset 0 3px 8px #10251a20!important}.cell.p1{background:#3ec878!important;border-color:#8df0b2!important}.cell.p2{background:#f1c46c!important;border-color:#ffe2a3!important}#message,#helpText,#done{grid-column:1;justify-self:start}.wrap h1{font-size:clamp(28px,4vw,42px)!important}.wrap>p:first-of-type{margin:0}@media(max-width:680px){.wrap{grid-template-columns:1fr;gap:8px}.board{grid-column:1;grid-row:auto;width:min(100%,min(65vh,560px));justify-self:center}.wrap h1{margin:0!important}.wrap>p:first-of-type{font-size:13px}}</style></head><body><main class="wrap"><div id="round"></div><div id="mode"></div><h1> 4목</h1><p>가로·세로·대각선으로 네 개를 먼저 연결하세요.</p><div id="board" class="board"></div><div id="countdown" class="countdown"><div id="countdownLabel">3!</div></div><h3 id="message">플레이어 차례</h3><button id="done" class="btn hidden">결과 확인 →</button><p class="muted" id="helpText">AI 대전은 자동으로 진행됩니다. 1대1은 번갈아 클릭하세요.</p></main><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu'};
document.getElementById('mode').textContent=s.modeName||'컴퓨터와 대전';
document.getElementById('round').textContent=s.round?s.round+'번째 게임':'';
const R=6,C=7,boardState=Array.from({length:R},()=>Array(C).fill(0));
let turn=1,over=false,cpuTimer=null,ready=false;
const board=document.getElementById('board'),message=document.getElementById('message'),done=document.getElementById('done');
function draw(){board.replaceChildren();for(let r=0;r<R;r++)for(let c=0;c<C;c++){const x=document.createElement('button');x.className='cell'+(boardState[r][c]?' p'+boardState[r][c]:'');x.setAttribute('aria-label',`행 ${R-r}, 열 ${c+1}${boardState[r][c]?' 점유':''}`);x.title=`열 ${c+1}`;x.onclick=()=>drop(c);board.appendChild(x)}}
function landingRow(b,c){for(let r=R-1;r>=0;r--)if(!b[r][c])return r;return -1}
function put(b,c,p){const r=landingRow(b,c);if(r<0)return -1;b[r][c]=p;return r}
function hasWin(b,p){for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(b[r][c]!==p)continue;for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let n=1;for(let k=1;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=R||cc<0||cc>=C||b[rr][cc]!==p)break;n++}if(n>=4)return true}}return false}
function legal(b){return Array.from({length:C},(_,c)=>c).filter(c=>b[0][c]===0)}
function copyBoard(b){return b.map(row=>row.slice())}
function winningMove(b,p,c){const test=copyBoard(b);put(test,c,p);return hasWin(test,p)}
function evaluateWindow(vals,p){const opp=p===1?2:1,n=vals.filter(v=>v===p).length,o=vals.filter(v=>v===opp).length,e=vals.filter(v=>v===0).length;if(n===4)return 100000;if(n===3&&e===1)return 120;if(n===2&&e===2)return 12;if(o===3&&e===1)return -160;return 0}
function heuristic(b,p){let score=0;for(let r=0;r<R;r++)if(b[r][3]===p)score+=7;for(let r=0;r<R;r++)for(let c=0;c<C;c++){for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const vals=[];for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=R||cc<0||cc>=C){vals.length=0;break}vals.push(b[rr][cc])}if(vals.length===4)score+=evaluateWindow(vals,p)}}return score}
function minimax(b,depth,alpha,beta,maximizing){const moves=legal(b);if(hasWin(b,2))return {score:100000+depth};if(hasWin(b,1))return {score:-100000-depth};if(depth===0||!moves.length)return {score:heuristic(b,2)};let bestCol=moves[0];if(maximizing){let value=-Infinity;for(const c of moves.slice().sort((a,z)=>Math.abs(a-3)-Math.abs(z-3))){const next=copyBoard(b);put(next,c,2);const score=minimax(next,depth-1,alpha,beta,false).score;if(score>value){value=score;bestCol=c}alpha=Math.max(alpha,value);if(alpha>=beta)break}return {col:bestCol,score:value}}let value=Infinity;for(const c of moves.slice().sort((a,z)=>Math.abs(a-3)-Math.abs(z-3))){const next=copyBoard(b);put(next,c,1);const score=minimax(next,depth-1,alpha,beta,true).score;if(score<value){value=score;bestCol=c}beta=Math.min(beta,value);if(alpha>=beta)break}return {col:bestCol,score:value}}
function finish(w){over=true;clearTimeout(cpuTimer);window.mgOnline?.publish({game:'game4',boardState,turn,over:true,winner:w,message:w==='draw'?'무승부':w==='me'?'방장 승리':'방장 패배'});window.miniGameSound?.('win');const label=mode==='local'?(w==='me'?'1P 승':w==='opp'?'2P 승':'무승부'):(w==='me'?'승리':w==='opp'?'패배':'무승부');message.textContent=label;localStorage.setItem('miniGameResult',JSON.stringify({game:' 4목',winner:w,me:w==='me'?1:0,opp:w==='opp'?1:0}));done.classList.remove('hidden');draw()}
function afterMove(p){draw();window.mgOnline?.publish({game:'game4',boardState,turn,over:false,message:message.textContent});window.miniGameSound?.('score');if(hasWin(boardState,p)){finish(p===1?'me':'opp');return}if(legal(boardState).length===0){finish('draw');return}turn=p===1?2:1;message.textContent=s.mode==='local'?(turn===1?'1P 차례':'2P 차례'):(turn===1?'플레이어 차례':'2P 차례');if(s.mode==='cpu'&&turn===2)cpuTimer=setTimeout(ai,220)}
function drop(c){if(!ready||over|| (s.mode==='cpu'&&turn!==1)||(s.mode==='online'&&window.mgOnline?.role==='guest')||landingRow(boardState,c)<0)return;put(boardState,c,turn);afterMove(turn)}
function ai(){if(over||turn!==2)return;const moves=legal(boardState);if(!moves.length){finish('draw');return}let col=moves.find(c=>winningMove(boardState,2,c));if(col===undefined)col=moves.find(c=>winningMove(boardState,1,c));if(col===undefined)col=minimax(boardState,4,-Infinity,Infinity,true).col;if(col===undefined)col=moves[0];put(boardState,col,2);afterMove(2)}
done.onclick=()=>location.href='../index.html';document.body.tabIndex=0;document.addEventListener('pointerdown',()=>{try{document.body.focus({preventScroll:true})}catch(e){}},true);if(s.mode==='local')document.getElementById('helpText').textContent='1P와 2P가 번갈아 열을 선택합니다.';draw();
function beginCountdown(){const overlay=document.getElementById('countdown');const label=document.getElementById('countdownLabel');const sequence=['3!','2!','1!','GO!'];let i=0;overlay.classList.remove('hidden');const step=()=>{label.textContent=sequence[i];window.miniGameSound?.(i===3?'win':'key');i++;if(i<sequence.length)setTimeout(step,650);else setTimeout(()=>{overlay.classList.add('hidden');ready=true;message.textContent=s.mode==='local'?'1P 차례':s.mode==='cpu'?'플레이어 차례':'방장 차례'},420)};step()}
window.addEventListener('mg-online-ready',()=>window.mgOnline?.listen(state=>{if(state?.game!=='game4')return;for(let r=0;r<R;r++)boardState[r]=state.boardState[r].slice();turn=state.turn;over=state.over;message.textContent=state.message||'';draw();if(over&&state.winner)done.classList.remove('hidden')}));
beginCountdown();
</script><div id="miniSoundPanel" style="position:fixed;right:14px;bottom:14px;z-index:9999"><button id="miniSoundToggle" type="button" aria-pressed="true" style="border:1px solid #ffffff35;border-radius:999px;padding:10px 14px;background:#10251a;color:#effff4;font:700 13px Arial,sans-serif;box-shadow:0 6px 22px #0006;cursor:pointer"> 소리 켜짐</button></div><script>(function(){let enabled=localStorage.getItem('miniGameSound')!=='off',audio=null,lastKeySound=0;const btn=document.getElementById('miniSoundToggle');function label(){btn.textContent=enabled?'소리 켜짐':'소리 꺼짐';btn.setAttribute('aria-pressed',String(enabled))}function sound(kind='ui'){if(!enabled)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audio=audio||new AC();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const seq=kind==='win'?[523,659,784]:kind==='score'?[660,880]:kind==='hit'?[220,165]:kind==='bounce'?[420]:kind==='jump'?[440,660]:kind==='key'?[330]:[520];seq.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='hit'?'triangle':'sine';o.frequency.setValueAtTime(hz,now+i*.075);g.gain.setValueAtTime(.0001,now+i*.075);g.gain.exponentialRampToValueAtTime(((kind==='ui'||kind==='key')?0.035:0.065),now+i*.075+.012);g.gain.exponentialRampToValueAtTime(.0001,now+i*.075+.11);o.connect(g);g.connect(audio.destination);o.start(now+i*.075);o.stop(now+i*.075+.12)})}catch(e){}}window.miniGameSound=sound;btn.addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('miniGameSound',enabled?'on':'off');label();if(enabled)sound('ui')});document.addEventListener('click',e=>{if(e.target.closest('#miniSoundPanel'))return;if(e.target.closest('button'))sound('ui')},true);document.addEventListener('keydown',e=>{if(e.repeat||!['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code))return;const now=performance.now();if(now-lastKeySound>75){sound('key');lastKeySound=now}},true);label()})();</script><script type="module" src="../online-sync.js"></script>
<script>
/* Tablet keyboard focus and automatic result display */
(function(){
  try{localStorage.removeItem('miniGameResult')}catch(e){}
  document.body.tabIndex=0;
  const focusGame=()=>{try{document.body.focus({preventScroll:true})}catch(e){document.body.focus()}};
  window.addEventListener('pageshow',()=>setTimeout(focusGame,100));
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('button,input,textarea,select'))focusGame()},{passive:true});
  const css=document.createElement('style');
  css.textContent='#mgAutoResult{position:fixed;inset:0;z-index:20000;display:none;place-items:center;padding:20px;background:#07110ddd;backdrop-filter:blur(10px)}#mgAutoResult .panel{width:min(460px,94vw);padding:30px;border:1px solid #b6f6ca;border-radius:24px;background:#f8fff9;color:#17251c;text-align:center;box-shadow:0 24px 80px #0005;font-family:Arial,sans-serif}#mgAutoResult .headline{font-size:clamp(34px,8vw,54px);font-weight:950;margin:12px 0}#mgAutoResult .detail{color:#617166;line-height:1.6}#mgAutoResult button{margin-top:22px;border:0;border-radius:12px;padding:14px 24px;background:#187447;color:white;font-weight:850;font-size:15px}#mgTabletPad{position:fixed;left:10px;bottom:10px;z-index:8000;display:flex;gap:6px;flex-wrap:wrap;max-width:85vw}#mgTabletPad button{touch-action:manipulation;min-width:44px;min-height:42px;padding:9px 12px;border:1px solid #b9d9c3;border-radius:12px;background:#f7fff8;color:#173d28;font-weight:850;box-shadow:0 4px 14px #0002}';
  document.head.appendChild(css);
  const overlay=document.createElement('div');overlay.id='mgAutoResult';
  overlay.innerHTML='<div class="panel"><div style="font-size:12px;font-weight:850;letter-spacing:.15em;color:#187447">MATCH RESULT</div><div class="headline" id="mgAutoHeadline">경기 종료</div><div class="detail" id="mgAutoDetail">최종 결과</div><button id="mgAutoBack">메뉴로 돌아가기</button></div>';
  document.body.appendChild(overlay);
  document.getElementById('mgAutoBack').onclick=()=>location.href='../index.html';
  let shown=false;

  function showResult(data){
    if(shown||!data||!data.winner)return;
    shown=true;
    const settings=JSON.parse(localStorage.getItem('miniGameSettings')||'null');document.getElementById('mgAutoHeadline').textContent=settings?.mode==='local'?(data.winner==='me'?'1P 승':data.winner==='opp'?'2P 승':'무승부'):(data.winner==='me'?'승리':data.winner==='opp'?'패배':'무승부');
    const score=data.me!==undefined||data.opp!==undefined?'최종 점수 '+(data.me??0)+' : '+(data.opp??0):'';
    document.getElementById('mgAutoDetail').textContent=[data.game||'미니게임',score].filter(Boolean).join(' · ');
    overlay.style.display='grid';
  }
  function checkResult(){let raw;try{raw=localStorage.getItem('miniGameResult')}catch(e){return}if(raw){try{showResult(JSON.parse(raw))}catch(e){}}}
  const originalSetItem=Storage.prototype.setItem;
  Storage.prototype.setItem=function(key,value){
    originalSetItem.call(this,key,value);
    if(key==='miniGameResult'){try{showResult(JSON.parse(value))}catch(e){}}
  };
  const observer=new MutationObserver(checkResult);
  observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','hidden','style']});
  // On-screen backup controls for touchscreen tablets
  const n=(location.pathname.match(/game([1-9])\.html/)||[])[1];
  const keys={'1':[['A','KeyA'],['L','KeyL']],'2':[['A','KeyA'],['L','KeyL']],'3':[['반응','Enter']],'5':[['점프','Space']],'6':[['위','ArrowUp'],['아래','ArrowDown'],['발사','Enter'],['방향','Space']],'7':[['왼쪽','KeyA'],['오른쪽','KeyD'],['발사','KeyS'],['P2 ←','ArrowLeft'],['P2 →','ArrowRight'],['P2 발사','ArrowDown']],'8':[['위','ArrowUp'],['아래','ArrowDown'],['시작','Enter']],'9':[['왼쪽','ArrowLeft'],['오른쪽','ArrowRight'],['점프','Space'],['P2 점프','ArrowUp']]};
  if(keys[n]){
    const pad=document.createElement('div');pad.id='mgTabletPad';
    keys[n].forEach(([label,code])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{focusGame();const key=code==='Space'?' ':code==='Enter'?'Enter':code.startsWith('Key')?code.slice(3).toLowerCase():code;document.dispatchEvent(new KeyboardEvent('keydown',{key,code,bubbles:true,cancelable:true}));if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyS'].includes(code))document.dispatchEvent(new KeyboardEvent('keyup',{key,code,bubbles:true,cancelable:true}))};pad.appendChild(b)});
    document.body.appendChild(pad);
  }
})();
</script>
