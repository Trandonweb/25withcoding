<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>점프 러너</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#071b12,#123b27);color:white;font-family:Arial,'Noto Sans KR',sans-serif;display:grid;place-items:center;padding:16px}.wrap{width:min(850px,100%);text-align:center}canvas{width:100%;background:#07100b;border-radius:14px;touch-action:manipulation}.btn{padding:12px 20px;border:0;border-radius:10px;background:#1ea857;color:white;font-weight:bold;cursor:pointer;margin:6px}.hidden{display:none}.muted{color:#b7cbb9}</style></head><body><main class="wrap"><div id="round"></div><div id="mode"></div><h1>🦖 점프 러너</h1><p>스페이스 / ↑ / 화면 탭으로 점프! 30초를 버티세요.</p><canvas id="game" width="800" height="300"></canvas><h2>생존 시간 <span id="time">0.0</span>초</h2><button class="btn" id="start">시작 / 다시 시작</button><button class="btn" id="jump">점프 ↑</button><h3 id="message">시작을 누르세요.</h3><button class="btn hidden" id="done">결과 확인 →</button><p class="muted">컴퓨터 대전에서는 AI 기록과 비교합니다.</p></main><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu'};document.getElementById('mode').textContent=s.modeName||'컴퓨터와 대전';document.getElementById('round').textContent=s.round?s.round+'번째 게임':'';const cv=document.getElementById('game'),ctx=cv.getContext('2d');let running=false,ended=false,t=0,last=0,y=0,vy=0,obs=[],spawn=40;function jump(){if(running&&y>=0)vy=-11}function reset(){cancelAnimationFrame(raf);running=true;ended=false;t=0;last=0;y=0;vy=0;obs=[];spawn=40;document.getElementById('done').classList.add('hidden');document.getElementById('message').textContent='달리는 중!';raf=requestAnimationFrame(loop)}let raf=0;function loop(now){if(!running)return;let dt=Math.min(2,(now-last||16.7)/16.7);last=now;t+=dt/60;vy+=.62*dt;y=Math.min(0,y+vy*dt);if(y===0)vy=0;if((spawn-=dt)<=0){obs.push({x:820,w:22+Math.random()*22,h:28+Math.random()*32});spawn=55+Math.random()*50}obs.forEach(o=>o.x-=5.5*dt);obs=obs.filter(o=>o.x>-50);ctx.clearRect(0,0,800,300);ctx.strokeStyle='#31583b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,250);ctx.lineTo(800,250);ctx.stroke();ctx.fillStyle='#53e88a';ctx.fillRect(100,210+y,34,40);ctx.fillStyle='#ffcf67';for(const o of obs){ctx.fillRect(o.x,250-o.h,o.w,o.h);if(o.x<130&&o.x+o.w>100&&210+y+40>250-o.h){end(false);return}}document.getElementById('time').textContent=Math.min(30,t).toFixed(1);if(t>=30){end(true);return}raf=requestAnimationFrame(loop)}function end(ok){if(ended)return;ended=true;running=false;const ai=s.mode==='cpu'?18+Math.random()*12:0;const winner=ok?(s.mode==='cpu'&&ai>=30?'draw':'me'):'opp';document.getElementById('message').textContent=ok?'완주! 30초 생존 성공':'장애물에 부딪혔습니다.';localStorage.setItem('miniGameResult',JSON.stringify({game:'🦖 점프 러너',winner:winner,me:Math.round(t*10),opp:Math.round(ai*10)}));document.getElementById('done').classList.remove('hidden')}document.getElementById('start').onclick=reset;document.getElementById('jump').onclick=jump;cv.onclick=jump;document.addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump()}});document.getElementById('done').onclick=()=>location.href='../index.html';</script></body></html>
