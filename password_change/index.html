<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>코딩과 함께라면_비밀번호 변경</title>
  <style>
    :root {
      --bg-color: #f0f0f0;
      --card-bg: #ffffff;
      --text-color: #111111;
      --sub-text: #666666;
      --input-bg: #f8fafc;
      --input-border: #e1e8ed;
      --input-focus-bg: #ffffff;
      --primary-color: #27ae60;
      --btn-bg: var(--primary-color);
      --btn-text: #ffffff;
    }
    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --sub-text: #aaaaaa;
      --input-bg: #2a2a2a;
      --input-border: #333333;
      --input-focus-bg: #1e1e1e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: 'Malgun Gothic', sans-serif;
      transition: background .2s, color .2s;
    }
    .card {
      width: min(100%, 380px);
      padding: 35px 30px;
      border: 1px solid var(--input-border);
      border-radius: 24px;
      background: var(--card-bg);
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    h2 { margin: 0 0 25px; color: var(--sub-text); font-size: 14px; font-weight: normal; }
    input {
      width: 100%;
      padding: 14px 16px;
      margin: 8px 0;
      border: 1px solid var(--input-border);
      border-radius: 16px;
      outline: none;
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 14px;
      transition: border .2s, background .2s;
    }
    input:focus { border-color: var(--primary-color); background: var(--input-focus-bg); }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 48px; }
    .toggle {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      cursor: pointer;
      opacity: .6;
      user-select: none;
    }
    .toggle:hover { opacity: 1; }
    button {
      width: 100%;
      height: 50px;
      margin-top: 15px;
      border: 0;
      border-radius: 16px;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: filter .2s;
    }
    button:hover:not(:disabled) { filter: brightness(.9); }
    button:disabled { cursor: default; opacity: .75; }
    .message { min-height: 18px; margin-top: 12px; color: var(--sub-text); font-size: 13px; line-height: 1.5; }
    .back { display: inline-block; margin-top: 14px; color: var(--sub-text); font-size: 13px; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <h1>2026 코딩과 함께라면</h1>
    <h2>비밀번호 변경</h2>
    <input id="pw1" type="password" autocomplete="new-password" placeholder="새 비밀번호 (6자 이상)">
    <div class="pw-wrap">
      <input id="pw2" type="password" autocomplete="new-password" placeholder="새 비밀번호 확인">
      <span class="toggle" role="button" tabindex="0" aria-label="비밀번호 표시" onclick="togglePw()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePw()}">👁</span>
    </div>
    <button id="changeBtn" type="button" onclick="changePassword()">비밀번호 변경</button>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <a class="back" id="backLink" href="/">취소하고 돌아가기</a>
  </main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",
  authDomain: "points2026-f5e50.firebaseapp.com",
  projectId: "points2026-f5e50",
  storageBucket: "points2026-f5e50.firebasestorage.app",
  messagingSenderId: "248724251417",
  appId: "1:248724251417:web:02d85cdc4addac98069b88"
};
const auth = getAuth(initializeApp(firebaseConfig));
const SETTINGS_KEY = "coding_with_ramen_settings";
const params = new URLSearchParams(location.search);
const rawRedirect = params.get("redirect") || "/상벌점/main.html";
const redirect = rawRedirect.startsWith("/") && !rawRedirect.startsWith("//") ? rawRedirect : "/상벌점/main.html";
document.getElementById("backLink").href = redirect;

try {
  const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
  document.body.classList.toggle("dark-mode", Boolean(saved.darkMode));
  if (typeof saved.primaryColor === "string" && /^#[0-9a-f]{6}$/i.test(saved.primaryColor)) {
    document.documentElement.style.setProperty("--primary-color", saved.primaryColor);
  }
} catch {}

let currentUser = null;
let authReadyResolve;
const authReady = new Promise(resolve => { authReadyResolve = resolve; });
onAuthStateChanged(auth, user => {
  currentUser = user;
  authReadyResolve();
  if (!user) {
    location.replace("/signin?redirect=" + encodeURIComponent("/password_change?redirect=" + encodeURIComponent(redirect)));
  }
});

window.togglePw = () => {
  const p1 = document.getElementById("pw1");
  const p2 = document.getElementById("pw2");
  const type = p1.type === "password" ? "text" : "password";
  p1.type = type;
  p2.type = type;
};

window.changePassword = async () => {
  await authReady;
  const pw1 = document.getElementById("pw1").value;
  const pw2 = document.getElementById("pw2").value;
  const button = document.getElementById("changeBtn");
  const message = document.getElementById("message");

  if (!currentUser) {
    message.textContent = "로그인이 필요합니다. 다시 로그인해 주세요.";
    return;
  }
  if (pw1.length < 6) {
    message.textContent = "비밀번호는 6자 이상이어야 합니다.";
    return;
  }
  if (pw1 !== pw2) {
    message.textContent = "입력한 비밀번호가 서로 일치하지 않습니다.";
    return;
  }

  button.disabled = true;
  button.textContent = "변경 중...";
  message.textContent = "";

  try {
    await updatePassword(currentUser, pw1);
    const idToken = await currentUser.getIdToken(true);
    localStorage.setItem("firebaseIdToken", idToken);
    localStorage.removeItem("firebaseRefreshToken");
    document.getElementById("pw1").value = "";
    document.getElementById("pw2").value = "";
    message.textContent = "비밀번호가 변경되었습니다.";
    setTimeout(() => location.replace(redirect), 900);
  } catch (error) {
    console.error("Firebase 비밀번호 변경 실패", error);
    if (error.code === "auth/requires-recent-login") {
      message.textContent = "보안을 위해 다시 로그인한 뒤 비밀번호를 변경해 주세요.";
    } else if (error.code === "auth/weak-password") {
      message.textContent = "더 안전한 비밀번호를 입력해 주세요. (6자 이상)";
    } else {
      message.textContent = "비밀번호 변경에 실패했습니다. 잠시 후 다시 시도해 주세요.";
    }
  } finally {
    button.disabled = false;
    button.textContent = "비밀번호 변경";
  }
};
</script>
</body>
</html>
