<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#101722"><title>AI vs HUMAN</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Pretendard,"Noto Sans KR",sans-serif}html,body{width:100%;height:100%;background:#0b1119;color:#eef4f8}body{min-height:100dvh}button{font:inherit;color:inherit}#screen{min-height:100dvh;padding:24px}.home{min-height:calc(100dvh - 48px);display:grid;place-items:center}.home-card{width:min(980px,100%);padding:58px;border:1px solid #263544;border-radius:32px;background:linear-gradient(145deg,#111a25,#0d141d);box-shadow:0 30px 80px #0008}.logo{font-size:clamp(2.5rem,7vw,5.5rem);font-weight:900;letter-spacing:-.06em}.logo span{color:#42d37d}.sub{margin:12px 0 42px;color:#8796a5}.home-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.main-btn,.game-select-btn{border:1px solid #314252;background:#151f2b;border-radius:20px;min-height:110px;cursor:pointer;transition:.2s}.main-btn:hover,.game-select-btn:hover{transform:translateY(-3px);border-color:#42d37d;background:#192737}.main-btn b{display:block;font-size:1.2rem}.main-btn small{color:#8495a5}.top-bar{display:flex;align-items:center;gap:14px;margin-bottom:18px}.back-btn{width:48px;height:48px;border:1px solid #334657;background:#141e29;border-radius:14px;cursor:pointer}.title{font-size:1.5rem;font-weight:800}.category{max-width:1200px;margin:auto}.game-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.game-select-btn{text-align:left;padding:26px}.game-select-btn strong{display:block;font-size:1.35rem}.game-select-btn span{display:block;color:#80909f;margin-top:7px}#gameScreen{display:none;position:fixed;inset:0;background:#080d13;z-index:50}#gameScreen>.top-bar{position:absolute;z-index:100;top:12px;left:12px;margin:0}.game-area{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;overflow:hidden;background:#080d13}@media(max-width:700px){#screen{padding:12px}.home-card{padding:30px 20px}.home-actions{grid-template-columns:1fr}.main-btn{min-height:80px}}</style></head>
<body><div id="screen"><section id="homeScreen" class="home"><div class="home-card"><div class="logo">AI <span>vs</span> HUMAN</div><p class="sub">인공지능과 인간의 한 판 승부</p><div class="home-actions"><button class="main-btn" onclick="showCategory('intelligence')"><b>🧠 지능</b><small>두뇌를 시험하세요</small></button><button class="main-btn" onclick="showCategory('physical')"><b>⚡ 피지컬</b><small>반응과 타이밍으로 승부</small></button><button class="main-btn" onclick="showRanking()"><b>🏆 랭킹</b><small>나의 기록 확인</small></button></div></div></section><section id="categoryScreen" class="category" style="display:none"><div class="top-bar"><button class="back-btn" onclick="showHome()">←</button><div><div class="title" id="categoryTitle"></div><small style="color:#8292a2">GAME SELECT</small></div></div><div id="gameList" class="game-list"></div></section><section id="gameScreen"><div class="top-bar"><button class="back-btn" onclick="backToCategory()">←</button><div class="title" id="gameTitle"></div></div><div id="gameArea" class="game-area"></div></section></div><script>
const intelligenceGames=[['틱택토','AI와 수 싸움'],['미로','탈출 경로를 찾아라'],['숫자 맞추기','감각적인 추리']];const physicalGames=[['축구','반응 속도 대결'],['야구','AI 투수와 실전 승부']];let currentCategory='',currentGameModule=null;function showHome(){homeScreen.style.display='grid';categoryScreen.style.display='none';gameScreen.style.display='none'}function showCategory(type){currentCategory=type;homeScreen.style.display='none';categoryScreen.style.display='block';gameScreen.style.display='none';categoryTitle.textContent=type==='intelligence'?'지능':'피지컬';gameList.innerHTML='';(type==='intelligence'?intelligenceGames:physicalGames).forEach(([name,desc])=>{const b=document.createElement('button');b.className='game-select-btn';b.innerHTML=`<strong>${name}</strong><span>${desc}</span>`;b.onclick=()=>openGame(name);gameList.appendChild(b)})}async function openGame(game){categoryScreen.style.display='none';gameScreen.style.display='block';gameTitle.textContent=game;gameArea.innerHTML='';currentGameModule=null;const path={틱택토:'./js/games/tictactoe.js',미로:'./js/games/maze.js','숫자 맞추기':'./js/games/number.js',축구:'./js/games/soccer.js',야구:'./js/games/baseball.js'}[game];try{const m=await import(path);currentGameModule=m;const fn=game==='야구'?'openBaseball':game==='축구'?'openSoccer':game==='틱택토'?'openTicTacToe':game==='미로'?'openMaze':'openNumber';m[fn](gameArea)}catch(e){console.error(e);gameArea.innerHTML='<div style="padding:40px;color:#ff8b8b">게임을 불러오지 못했습니다.<br><small>'+e.message+'</small></div>'}}function backToCategory(){currentGameModule?.destroy?.();showCategory(currentCategory)}function showRanking(){alert('랭킹 시스템은 다음 업데이트에서 공개됩니다.')}showHome();</script></body></html>
