<!DOCTYPE html>
<html>
<head>
  <title>코딩과 함께라면_상벌점</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #f0f0f0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      padding: 10px 14px;
      margin: 5px;
      border-radius: 14px;
      border: none;
      background-color: #ffffff;
      cursor: pointer;
    }

    button:hover {
      background-color: #e6e6e6;
    }

    .home-icon {
      width: 24px;
      height: 24px;
      position: relative;
      display: inline-block;
    }

    .home-icon::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 14px;
      background: black;
      bottom: 0;
      left: 2px;
    }

    .home-icon::after {
      content: "";
      position: absolute;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 12px solid black;
      top: -2px;
      left: 0;
    }

    .card {
      background-color: white;
      padding: 15px;
      border-radius: 20px;
      margin-top: 10px;
    }

    .user-item {
      display: flex;
      align-items: center;
      padding: 10px;
      margin: 5px 0;
      border-radius: 14px;
      background-color: #f9f9f9;
      cursor: pointer;
      transition: 0.2s;
    }

    .user-item.selected {
      background-color: #dcdcdc;
    }

    .user-item input {
      margin-right: 10px;
    }

    .user-item.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input[type="text"] {
      padding: 10px;
      border-radius: 14px;
      border: none;
      background-color: white;
      width: 180px;
    }

    .footer {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-size: 12px;
      color: #555;
    }

    .plus {
      color: blue;
      font-weight: bold;
    }

    .minus {
      color: red;
      font-weight: bold;
    }

    .zero {
      color: black;
      font-weight: bold;
    }

    #warning {
      position: fixed;
      width: 420px;
      max-width: 70vw;
      background: white;
      color: black;
      padding: 14px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      font-size: 13px;
      z-index: 9999;
      display: none;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="top-bar">
  <div style="display:flex; align-items:center; gap:6px;">
    <button onclick="goHome()">
      <div class="home-icon"></div>
    </button>

    <!-- 관리자 버튼 (회장 또는 부회장에게 표시) -->
    <button id="adminBtn"
      onclick="goAdmin()"
      style="display:none;">
      관리자
    </button>

    <!-- 안내 버튼 -->
    <button id="infoBtn" onclick="toggleWarning()">
      ?
    </button>
  </div>

  <button onclick="logout()">로그아웃</button>
</div>

<div class="card" id="myInfo">
  로딩중...
</div>

<!-- 공동 목표 카드 -->
<div class="card" id="rewardBox">
  로딩중...
</div>

<!-- 학생인 경우 컨트롤 버튼들 비활성화 처리 -->
<button id="selectAllBtn" onclick="selectAll()">모두 선택</button>
<button id="clearAllBtn" onclick="clearAll()">모두 해제</button>

<div class="card" id="userList"></div>

<br>

<input id="scoreInput" type="text" placeholder="점수를 입력하세요.">
<button id="applyBtn" onclick="apply()">적용</button>

<div id="loadingBox" style="display:none; margin-top:10px;">
  <div class="loading-inline">
    <span>적용 중...</span>
    <div class="spinner"></div>
  </div>
</div>

<div class="footer">
  *이 시스템은 학교 내 그린마일리지와는 무관합니다.*
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  increment,
  runTransaction
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",
  authDomain: "points2026-f5e50.firebaseapp.com",
  projectId: "points2026-f5e50"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectedUsers = new Set();
let myId = localStorage.getItem("userId");
let myData = null;
let rewardRef = doc(db, "reward", "main");
let stage = 0;
let bonus = 1;
let usersSnap = null;

// 점수 색상
window.formatScore = function(score) {
  if (score > 0) return `<span class="plus">${score}</span>`;
  if (score < 0) return `<span class="minus">${score}</span>`;
  return `<span class="zero">${score}</span>`;
}

// 권한 한글화
window.roleToText = function(role) {
  if (role === "president") return "회장";
  if (role === "vice") return "부회장";
  return "학생";
}

// 총점 갱신 함수
async function refreshTotalScore() {
  const users = await getDocs(collection(db, "users"));
  let sum = 0;
  users.forEach((user) => {
    sum += Number(user.data().score || 0);
  });
  await updateDoc(rewardRef, {
    totalScore: sum
  });
}

// 초기 실행 함수
async function init() {
  if (!myId) {
    alert("로그인이 필요합니다.");
    location.href = "index.html";
    return;
  }

  const mySnap = await getDoc(doc(db, "users", myId));

  if (!mySnap.exists()) {
    alert("사용자 정보를 찾을 수 없습니다.");
    localStorage.removeItem("userId");
    location.href = "index.html";
    return;
  }

  myData = mySnap.data();

  if (myData.role === "president" || myData.role === "vice") {
    document.getElementById("adminBtn").style.display = "inline-block";
  }

  /* 학생 권한인 경우 입력 및 선택 컨트롤 비활성화 */
  if (myData.role === "student") {
    document.getElementById("selectAllBtn").disabled = true;
    document.getElementById("clearAllBtn").disabled = true;
    document.getElementById("scoreInput").disabled = true;
    document.getElementById("applyBtn").disabled = true;
  }

  /* 내 정보 표시 */
  document.getElementById("myInfo").innerHTML =
    "이름: " + myData.name +
    " / 점수: " + formatScore(myData.score) +
    " / 권한: " + roleToText(myData.role);

  /* 공동 목표 데이터 초기화 및 로드 */
  let rewardSnap = await getDoc(rewardRef);

  if (!rewardSnap.exists()) {
    await setDoc(rewardRef, {
      stage: 0,
      totalScore: 0
    });
    rewardSnap = await getDoc(rewardRef);
  }

  const rewardData = rewardSnap.data();
  stage = rewardData.stage;

  /* 유저 목록 조회 및 실시간 totalScore 계산 */
  usersSnap = await getDocs(collection(db, "users"));
  let totalScore = 0;
  usersSnap.forEach((userDoc) => {
    totalScore += Number(userDoc.data().score || 0);
  });

  const target = 250 * (2 ** stage);
  bonus = 2 ** stage;

  const remain = Math.max(0, target - totalScore);
  let percentage = Math.min(100, (totalScore / target) * 100).toFixed(1);

  let rewardHtml = `
    <strong>공동 목표</strong><br><br>
    현재 총점 : ${totalScore}점<br>
    다음 목표 : ${target}점<br>
    ${remain > 0 ? `${remain}점 남았습니다.<br>` : ""}
    달성률 : ${percentage}%<br>
    달성 보상 : +${bonus}점
  `;

  const isAchieved = totalScore >= target;

  if (isAchieved) {
    rewardHtml += `<br><br><span style="color: green; font-weight: bold;">목표를 달성했습니다!</span>`;
    
    if (myData.role === "president" || myData.role === "vice") {
      rewardHtml += `<br><button id="bonusBtn" style="margin-top:8px; background-color: #d1e7dd; font-weight: bold;" onclick="claimBonus()">보너스 지급</button>`;
    }
  }

  document.getElementById("rewardBox").innerHTML = rewardHtml;

  /* 유저 목록 렌더링 */
  const listDiv = document.getElementById("userList");
  listDiv.innerHTML = "";

  usersSnap.forEach((docu) => {
    const d = docu.data();
    const isMe = docu.id === myId;
    let disabled = false;

    if (myData.role === "student") {
      disabled = true;
    }

    if (myData.role === "vice") {
      if (isMe) disabled = true;
      if (d.role === "president") disabled = true;
    }

    const div = document.createElement("div");
    div.className = "user-item" + (disabled ? " disabled" : "");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.disabled = disabled;
    checkbox.dataset.id = docu.id;

    const text = document.createElement("span");
    text.innerHTML =
      docu.id + " - " +
      d.name +
      " (" + formatScore(d.score) + ") " +
      "[" + roleToText(d.role) + "]";

    function updateSelection() {
      if (checkbox.checked) {
        selectedUsers.add(docu.id);
        div.classList.add("selected");
      } else {
        selectedUsers.delete(docu.id);
        div.classList.remove("selected");
      }
    }

    checkbox.addEventListener("click", (e) => {
      e.stopPropagation();
    });

    checkbox.addEventListener("change", () => {
      updateSelection();
    });

    div.addEventListener("click", () => {
      if (disabled) return;
      checkbox.checked = !checkbox.checked;
      updateSelection();
    });

    div.appendChild(checkbox);
    div.appendChild(text);
    listDiv.appendChild(div);
  });
}

// 페이지 로드 시 init 실행
init();

/* 트랜잭션 및 보너스 지급 함수 */
window.claimBonus = async () => {
  if (myData.role !== "president" && myData.role !== "vice") {
    alert("권한이 없습니다.");
    return;
  }

  if (!confirm(`전원에게 +${bonus}점을 지급하시겠습니까?`)) {
    return;
  }

  try {
    document.getElementById("bonusBtn").disabled = true;

    const allUsersSnap = await getDocs(collection(db, "users"));
    const promises = [];
    allUsersSnap.forEach((userDoc) => {
      promises.push(
        updateDoc(doc(db, "users", userDoc.id), {
          score: increment(bonus)
        })
      );
    });
    await Promise.all(promises);

    await refreshTotalScore();

    await runTransaction(db, async (transaction) => {
      const freshRewardSnap = await transaction.get(rewardRef);
      if (!freshRewardSnap.exists()) {
        throw new Error("목표 데이터가 존재하지 않습니다.");
      }

      const freshStage = freshRewardSnap.data().stage;
      if (freshStage !== stage) {
        throw new Error("이미 보너스가 지급되었습니다.");
      }

      transaction.update(rewardRef, { stage: freshStage + 1 });
    });

    alert("보너스가 지급되었습니다!");
    location.reload();
  } catch (err) {
    console.error(err);
    alert(err.message || "보너스 지급 중 오류가 발생했습니다.");
    document.getElementById("bonusBtn").disabled = false;
  }
};

/* 모두 선택 */
window.selectAll = () => {
  if (myData.role === "student") return;
  selectedUsers.clear();

  document.querySelectorAll(".user-item").forEach((el) => {
    const cb = el.querySelector("input");
    if (cb.disabled) return;
    cb.checked = true;
    el.classList.add("selected");
    selectedUsers.add(cb.dataset.id);
  });
};

/* 모두 해제 */
window.clearAll = () => {
  if (myData.role === "student") return;
  selectedUsers.clear();

  document.querySelectorAll(".user-item").forEach((el) => {
    el.classList.remove("selected");
    el.querySelector("input").checked = false;
  });
};

/* 점수 적용 */
window.apply = async () => {
  if (myData.role === "student") {
    alert("권한이 없습니다.");
    return;
  }

  if (selectedUsers.size === 0) {
    alert("대상을 선택해주세요.");
    return;
  }

  const val = Number(document.getElementById("scoreInput").value);

  if (isNaN(val)) {
    alert("숫자를 입력해주세요.");
    return;
  }

  if (!Number.isInteger(val)) {
    alert("정수를 입력해주세요.");
    return;
  }

  if (val === 0) {
    alert("0점은 적용할 수 없습니다.");
    return;
  }

  if (Math.abs(val) > 20) {
    alert("최대 ±20점까지 가능합니다.");
    return;
  }

  try {
    document.getElementById("applyBtn").style.display = "none";
    document.getElementById("loadingBox").style.display = "block";

    const promises = [];
    for (const id of selectedUsers) {
      promises.push(
        updateDoc(doc(db, "users", id), {
          score: increment(val)
        })
      );
    }
    await Promise.all(promises);

    await refreshTotalScore();

    alert("적용 완료!");
    location.reload();

  } catch (err) {
    console.error(err);
    alert("오류 발생");
    document.getElementById("applyBtn").style.display = "inline-block";
    document.getElementById("loadingBox").style.display = "none";
  }
};

/* 경고문 토글 */
window.toggleWarning = () => {
  const box = document.getElementById("warning");
  const btn = document.getElementById("infoBtn");

  if (box.style.display === "block") {
    box.style.display = "none";
  } else {
    const rect = btn.getBoundingClientRect();
    box.style.left = (rect.right + 10) + "px";
    box.style.top = rect.top + "px";
    box.style.display = "block";
  }
};

/* 로그아웃 */
window.logout = () => {
  location.href = "/signout?redirect=/";
};

/* 홈 이동 */
window.goHome = () => {
  location.href = "https://25withcoding.kr";
};

window.goAdmin = () => {
  location.href = "admin.html";
};

</script>

<!-- 안내 박스 -->
<div id="warning">
  무단 결석시 -2점, 출석시 1점.<br>
  미리와서 컴퓨터(1~12번, 교사용 컴퓨터) 켜 두면 상점 1점.<br>
  (단, 이 사항은 학생의 모범도에 따라 달라질 수 있다.)<br><br>

  벌점 10점 이상 : 축제 수익 -50%<br>
  벌점 20점 이상 : 축제 수익 -75%<br>
  벌점 30점 이상 : 축제 수익 없음<br>
  벌점 40점 이상 : 동아리 수료 불가<br><br>

  연 1회 이상 각 학년별 상점 우수자에게는 상품 부여.
  (단, 회장 제외)
</div>

</body>
</html>
