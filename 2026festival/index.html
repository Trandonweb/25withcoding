<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: sans-serif;
  background: #0f0f14;
  color: white;
}

/* =========================================
   Festival Gate
========================================= */

#festivalGate {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(0, 200, 83, 0.20),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(100, 221, 23, 0.18),
      transparent 35%
    ),
    #0f0f14;
}

.gate-card {
  width: min(420px, 100%);
  padding: 34px 28px;

  text-align: center;

  background: rgba(28, 28, 37, 0.96);

  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;

  box-shadow:
    0 25px 70px rgba(0,0,0,0.5);
}

.gate-icon {
  font-size: 52px;
  margin-bottom: 8px;
}

.gate-title {
  margin: 0;

  font-family: 'Black Han Sans', sans-serif;
  font-size: 32px;

  background: linear-gradient(
    90deg,
    #00c853,
    #64dd17
  );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.gate-description {
  margin: 14px 0 24px;

  color: #aaa;

  font-size: 14px;
  line-height: 1.7;
}

/* =========================================
   Input
========================================= */

.gate-input {
  width: 100%;
  height: 50px;

  padding: 0 16px;

  border: 1px solid #3a3a45;
  border-radius: 13px;

  background: #15151c;
  color: white;

  outline: none;

  font-size: 15px;
  text-align: center;

  transition: 0.2s;
}

.gate-input::placeholder {
  color: #777;
}

.gate-input:focus {
  border-color: #00c853;

  box-shadow:
    0 0 0 3px rgba(0,200,83,0.12);
}

/* =========================================
   Button
========================================= */

.gate-button {
  width: 100%;
  height: 50px;

  margin-top: 10px;

  border: none;
  border-radius: 13px;

  background: linear-gradient(
    90deg,
    #00c853,
    #64dd17
  );

  color: white;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;

  transition: 0.2s;
}

.gate-button:hover {
  filter: brightness(0.92);
  transform: translateY(-1px);
}

.gate-button:active {
  transform: translateY(0);
}

.gate-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

/* =========================================
   Divider
========================================= */

.gate-divider {
  display: flex;
  align-items: center;

  gap: 10px;

  margin: 18px 0;

  color: #666;

  font-size: 12px;
}

.gate-divider::before,
.gate-divider::after {
  content: "";

  flex: 1;

  height: 1px;

  background: #33333d;
}

/* =========================================
   Error
========================================= */

.gate-error {
  min-height: 20px;

  margin-top: 10px;

  color: #ff7070;

  font-size: 13px;
}

/* =========================================
   Success
========================================= */

.gate-success {
  min-height: 20px;

  margin-top: 10px;

  color: #7cff91;

  font-size: 13px;
}

/* =========================================
   Loading
========================================= */

.gate-loading {
  color: #aaa;
  font-size: 14px;
}

/* =========================================
   Hide
========================================= */

#festivalGate.hidden {
  display: none;
}

body.gate-open {
  overflow: hidden;
}

/* =========================================
   Home
========================================= */

.home-link {
  position: fixed;
  top: 18px;
  left: 20px;

  color: rgba(255,255,255,0.75);

  text-decoration: none;

  font-size: 13px;

  z-index: 1000;
}

.home-link:hover {
  color: white;
}

/* =========================================
   Header
========================================= */

header {
  text-align: center;

  padding: 12px 20px;

  font-family: 'Black Han Sans', sans-serif;

  font-size: 30px;

  background:
    linear-gradient(
      90deg,
      #00c853,
      #64dd17
    );

  color: white;

  box-shadow:
    0 4px 20px rgba(0,0,0,.3);
}

/* =========================================
   Subtitle
========================================= */

.subtitle {
  text-align: center;

  padding: 10px;

  color: #b8ffb8;

  font-size: 14px;

  line-height: 1.8;
}

/* =========================================
   Grid
========================================= */

.grid {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 20px;

  padding: 20px;
}

/* =========================================
   Mobile
========================================= */

@media (max-width: 768px) {

  .grid {
    grid-template-columns: 1fr;
  }

  header {
    font-size: 24px;
  }

  .gate-card {
    padding: 30px 22px;
  }

  .gate-title {
    font-size: 28px;
  }

}

/* =========================================
   Card
========================================= */

.card {
  background: #1c1c25;

  border-radius: 14px;

  overflow: hidden;

  cursor: pointer;

  transition: 0.2s;

  display: flex;

  flex-direction: column;
}

.card:hover {
  transform: scale(1.03);
}

.card img {
  width: 100%;

  aspect-ratio: 16 / 9;

  object-fit: cover;

  display: block;
}

.info {
  padding: 12px;

  display: flex;

  flex-direction: column;

  gap: 6px;

  flex: 1;
}

.title {
  font-weight: bold;

  font-size: 18px;
}

.desc {
  font-size: 13px;

  color: #bbb;

}

.likes {

}

.like-btn {

  padding: 8px;

  border: none;

  border-radius: 6px;

  cursor: pointer;

  background: #00c853;

  color: white;

  font-weight: bold;
}

<script type="module">


/* =========================================
   Firebase imports
========================================= */

/* =========================================
   Festival Firebase
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9Q",

    "festivallikes",

  appId:

};


const app =

  );


const db =

/* =========================================
   Login Firebase
========================================= */

const loginFirebaseConfig = {

  apiKey:
    "AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",

  authDomain:
    "points2026-f5e50.firebaseapp.com",

  projectId:
    "points2026-f5e50"

};


const loginApp =
  initializeApp(
    loginFirebaseConfig,
    "loginApp"
  );


const loginDB =
  getFirestore(loginApp);


/* =========================================
   Gate Elements
========================================= */

const festivalGate =
  document.getElementById(
    "festivalGate"
  );

const guestArea =
  document.getElementById(
    "guestArea"
  );

const memberCodeArea =
  document.getElementById(
    "memberCodeArea"
  );

const loadingArea =
  document.getElementById(
    "loadingArea"
  );

const gateDescription =
  document.getElementById(
    "gateDescription"
  );

const gateError =
  document.getElementById(
    "gateError"
  );

const memberGateError =
  document.getElementById(
    "memberGateError"
  );


/* =========================================
   Festival Enter
========================================= */

function enterFestival() {

  festivalGate.classList.add(
    "hidden"
  );

  document.body.classList.remove(
    "gate-open"
  );

}


/* =========================================
   Guest Gate
========================================= */

function showGuestGate() {

  loadingArea.style.display =
    "none";

  guestArea.style.display =
    "block";

  memberCodeArea.style.display =
    "none";

  gateDescription.textContent =
    "축제에 입장하려면 로그인하거나 이용 코드를 입력해주세요.";

}


/* =========================================
   Code Gate
========================================= */

function showCodeGate() {

  loadingArea.style.display =
    "none";

  guestArea.style.display =
    "none";

  memberCodeArea.style.display =
    "block";

  gateDescription.textContent =
    "축제 이용 코드를 입력해주세요.";

}


/* =========================================
   Login
========================================= */

document
  .getElementById(
    "loginButton"
  )
  .addEventListener(
    "click",
    () => {

      const redirect =
        encodeURIComponent(
          "/2026festival/"
        );

      location.href =
        `/signin/?redirect=${redirect}`;

    }
  );


/* =========================================
   Normalize Code
========================================= */

function normalizeCode(
  value
) {

  return value
    .trim()
    .toUpperCase()
    .replace(/\s+/g, "");

}


/* =========================================
   Access Code
========================================= */

async function redeemAccessCode(
  rawCode
) {

  const code =
    normalizeCode(
      rawCode
    );


  if (!code) {

    return {
      success: false,
      message:
        "이용 코드를 입력해주세요."
    };

  }


  /*
   * accessCodes/{CODE}
   */

  const codeRef =
    doc(
      db,
      "accessCodes",
      code
    );


  try {

    const result =
      await runTransaction(
        db,
        async transaction => {

          const codeSnap =
            await transaction.get(
              codeRef
            );


          /* 코드가 없음 */

          if (
            !codeSnap.exists()
          ) {

            throw new Error(
              "CODE_NOT_FOUND"
            );

          }


          const data =
            codeSnap.data();


          /*
           * coins.html에서 생성할 때
           *
           * active: true
           *
           * 가 들어가야 한다.
           */

          if (
            data.active !== true
          ) {

            throw new Error(
              "CODE_INACTIVE"
            );

          }


          /*
           * maxUses:
           * 1 / 2 / 3 / 4 / 5
           */

          const maxUses =
            Number(
              data.maxUses || 0
            );


          const usedCount =
            Number(
              data.usedCount || 0
            );


          if (
            ![1, 2, 3, 4, 5]
              .includes(maxUses)
          ) {

            throw new Error(
              "CODE_INVALID"
            );

          }


          /*
           * 이미 모두 사용됨
           */

          if (
            usedCount >= maxUses
          ) {

            throw new Error(
              "CODE_EXHAUSTED"
            );

          }


          /*
           * 사용 횟수 +1
           */

          transaction.update(
            codeRef,
            {
              usedCount:
                usedCount + 1
            }
          );


          return {

            people:
              maxUses,

            usedCount:
              usedCount + 1,

            maxUses:
              maxUses

          };

        }
      );


    /*
     * 이 탭에서는 이미 입장권을
     * 사용했다는 표시.
     *
     * 새로고침 시 같은 코드가
     * 다시 차감되는 것을 방지.
     */

    sessionStorage.setItem(
      "festival2026CodeAccess",
      "true"
    );


    sessionStorage.setItem(
      "festival2026AccessCode",
      code
    );


    return {

      success: true,

      message:
        `${result.people}인 이용권으로 입장했습니다.`

    };

  }

  catch (error) {

    console.error(
      "이용 코드 처리 오류:",
      error
    );


    switch (
      error.message
    ) {

      case "CODE_NOT_FOUND":

        return {
          success: false,
          message:
            "존재하지 않는 이용 코드입니다."
        };


      case "CODE_INACTIVE":

        return {
          success: false,
          message:
            "사용할 수 없는 이용 코드입니다."
        };


      case "CODE_EXHAUSTED":

        return {
          success: false,
          message:
            "이미 모두 사용된 이용 코드입니다."
        };


      case "CODE_INVALID":

        return {
          success: false,
          message:
            "올바르지 않은 이용 코드입니다."
        };


      default:

        return {
          success: false,
          message:
            "코드 확인 중 오류가 발생했습니다."
        };

    }

  }

}


/* =========================================
   Guest Code Button
========================================= */

document
  .getElementById(
    "accessCodeButton"
  )
  .addEventListener(
    "click",
    async () => {

      const input =
        document.getElementById(
          "accessCodeInput"
        );

      const button =
        document.getElementById(
          "accessCodeButton"
        );


      gateError.className =
        "gate-error";

      gateError.textContent =
        "";


      button.disabled =
        true;

      button.textContent =
        "확인 중...";


      const result =
        await redeemAccessCode(
          input.value
        );


      if (
        result.success
      ) {

        gateError.className =
          "gate-success";

        gateError.textContent =
          result.message;


        setTimeout(
          enterFestival,
          450
        );

      }

      else {

        gateError.className =
          "gate-error";

        gateError.textContent =
          result.message;

      }


      button.disabled =
        false;

      button.textContent =
        "코드로 입장";

    }
  );


/* =========================================
   Member Code Button
========================================= */

document
  .getElementById(
    "memberAccessCodeButton"
  )
  .addEventListener(
    "click",
    async () => {

      const input =
        document.getElementById(
          "memberAccessCodeInput"
        );

      const button =
        document.getElementById(
          "memberAccessCodeButton"
        );


      memberGateError.className =
        "gate-error";

      memberGateError.textContent =
        "";


      button.disabled =

      button.textContent =

      const result =

        );


      if (

      ) {

        memberGateError.className =

   Enter Key
========================================= */

document

/* =========================================
   Check Festival Access
========================================= */

async function checkFestivalAccess() {

  /*
   * 코드로 이미 입장한 경우
   *
   * 같은 탭의 새로고침에서는
   * 다시 코드를 차감하지 않는다.
   */

  if (
    sessionStorage.getItem(
      "festival2026CodeAccess"
    ) === "true"
  ) {

    enterFestival();

    return;

  }


  /*
   * /signin에서 로그인 성공 시
   * 저장되는 userId
   */

  const userId =
    localStorage.getItem(
      "userId"
    );


  /*
   * 로그인하지 않음
   */

  if (!userId) {

    showGuestGate();

    return;

  }


  /*
   * 로그인한 계정이 users 컬렉션에
   * 실제로 존재하는지 확인.
   *
   * role은 검사하지 않는다.
   *
   * student
   * vice
   * president
   *
   * 모두 부원 프리패스.
   */

  try {

    const userRef =
      doc(
        loginDB,
        "users",
        userId
      );


    const userSnap =
      await getDoc(
        userRef
      );


    if (
      userSnap.exists()
    ) {

      enterFestival();

      return;

    }


    /*
     * 로그인 정보는 있지만
     * users 문서가 없는 경우
     *
     * → 코드 입장 가능
     */

    showCodeGate();

  }

  catch (error) {

    console.error(
      "로그인 상태 확인 실패:",
      error
    );


    /*
     * 확인에 실패했다고
     * 프리패스시키지 않는다.
     */

    showCodeGate();

    gateDescription.textContent =
      "로그인 상태를 확인하지 못했습니다. 이용 코드를 입력해주세요.";

  }

}


/* =========================================
   Start Gate
========================================= */

checkFestivalAccess();


/* =========================================
   Projects
========================================= */

const grid =
  document.getElementById(
    "grid"
  );


function loadProjects() {

  onSnapshot(

    collection(
      db,
      "projects"
    ),

    snap => {

      grid.innerHTML = "";


      let projects = [];


      snap.forEach(
        docSnap => {

          projects.push({

            id:
              docSnap.id,

            ...docSnap.data()

          });

        }
      );


      /* 응원 순 정렬 */

      projects.sort(
        (a, b) =>
          (b.likes || 0) -
          (a.likes || 0)
      );


      /* 총 응원 수 */

      const totalLikes =
        projects.reduce(

          (sum, p) =>
            sum + (p.likes || 0),

          0

        );


      document
        .getElementById(
          "subtitle"
        )
        .innerHTML = `

          <div>
            since 2025
          </div>

          <div>
            ❤️ 지금까지
            ${totalLikes.toLocaleString()}
            번의 응원이 도착했어요
          </div>

        `;


      /* 카드 */

      projects.forEach(
        (p, index) => {

          const medal =

            index === 0
              ? "🥇 "

            : index === 1
              ? "🥈 "

            : index === 2
              ? "🥉 "

            : "";


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "card";


          card.innerHTML = `

            <img
              src="${p.thum}"
              alt="${p.id}"
            >

            <div class="info">

              <div class="title">
                ${medal}${p.id}
              </div>

              <div class="desc">
                ${p.detail}
              </div>

              <div class="likes">
                ❤️ ${p.likes || 0}
              </div>

              <button
                class="like-btn"
              >
                응원하기
              </button>

            </div>

          `;


          /* 카드 클릭 */

          card.onclick = () => {

            location.href =
              p.url;

          };


          /* 좋아요 */

          card
            .querySelector(
              ".like-btn"
            )
            .onclick =
            async event => {

              event.stopPropagation();


              try {

                await updateDoc(

                  doc(
                    db,
                    "projects",
                    p.id
                  ),

                  {
                    likes:
                      increment(1)
                  }

                );

              }

              catch (error) {

                console.error(
                  "응원 처리 실패:",
                  error
                );

              }

            };


          grid.appendChild(
            card
          );

        }
      );

    },

    error => {

      console.error(
        "작품 목록 불러오기 실패:",
        error
      );

    }

  );

}


loadProjects();

</script>

</body>
</html>
