<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>영역 채우기 | MINI GAME</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#071b12,#123b27);color:#fff;display:flex;align-items:center;justify-content:center}.wrap{width:min(760px,94vw);text-align:center}.top{display:flex;justify-content:space-between;opacity:.75}h1{font-size:clamp(34px,6vw,54px);margin:12px 0 4px}.timer{font-size:32px;font-weight:900}.score{display:flex;justify-content:center;gap:45px;font-weight:800;margin:5px}.score span{font-size:34px}.board{margin:15px auto;width:min(78vw,560px);aspect-ratio:1;display:grid;gap:4px;padding:6px;background:rgba(255,255,255,.08);border-radius:14px}.cell{border:0;border-radius:5px;background:rgba(255,255,255,.08);cursor:pointer}.cell.me{background:#27ae60}.cell.opp{background:#e74c3c}.info{min-height:28px;font-size:17px}.done{margin-top:14px;border:0;border-radius:14px;padding:14px 28px;background:#1ea857;color:#fff;font-weight:800;font-size:17px;cursor:pointer}.note{font-size:13px;color:#ffd98a;margin-top:8px}.hidden{display:none!important}
/* Shared MINI GAME visual refresh */
:root{color-scheme:dark;--mg-bg:#07110d;--mg-panel:rgba(14,35,25,.88);--mg-line:rgba(150,255,190,.18);--mg-green:#53e88a;--mg-mint:#b9ffd2}body{background:radial-gradient(ellipse at 12% 0%,#17442c 0%,transparent 42%),radial-gradient(ellipse at 100% 100%,#102d20 0%,transparent 45%),#050b08!important;color:#f3fff6!important;font-family:Inter,'Noto Sans KR',Arial,sans-serif!important}h1,h2,h3,.title,.logo{letter-spacing:-.035em}h1{ text-shadow:0 5px 28px rgba(83,232,138,.12)}button,.btn,.next,.setbtn{font-family:inherit!important;transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease!important}button:hover,.btn:hover,.next:hover,.setbtn:hover{transform:translateY(-2px);box-shadow:0 8px 24px #0005}button:focus-visible,.btn:focus-visible,.next:focus-visible,.setbtn:focus-visible{outline:2px solid var(--mg-green);outline-offset:3px}.wrap{position:relative}.arena,.setting,.summary,.history,.board,canvas,.card{box-shadow:0 18px 48px #0003}canvas{border:1px solid var(--mg-line);box-shadow:0 0 0 5px #ffffff05,0 20px 55px #0005}p{line-height:1.65}.muted,.desc,.sub{color:#b8cdbf}
/* Responsive full-screen layout: keep the game inside the visible viewport. */
html{width:100%;height:100%;overflow:hidden}
body{width:100%;height:100dvh;min-height:0!important;overflow:hidden!important;padding:clamp(6px,1.2vh,14px)!important;overscroll-behavior:none}
.wrap{width:min(100%,1000px);max-height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:clamp(3px,0.7vh,8px);padding:0!important;margin:auto}
.wrap>*{flex-shrink:0}
h1,.heading h1{font-size:clamp(21px,4.2vh,42px)!important;line-height:1.08;margin:clamp(2px,0.5vh,7px) 0!important}
p,.sub,.desc,.help{font-size:clamp(11px,1.65vh,15px);line-height:1.35}
canvas{max-width:100%;max-height:43dvh;width:auto;height:auto;object-fit:contain;margin-block:clamp(3px,0.6vh,8px)!important}
button,.btn{padding:clamp(7px,1.2vh,12px) clamp(10px,2vw,18px);font-size:clamp(11px,1.6vh,15px)}
#message{min-height:0!important;margin:clamp(2px,0.4vh,6px) 0!important;font-size:clamp(11px,1.6vh,15px)}
.top{flex-shrink:0}
@media(max-width:650px){body{padding:6px!important}.wrap{width:100%;gap:3px}.heading{margin:4px 0 6px!important}.controls{grid-template-columns:1fr 1fr!important;gap:5px!important}.control{padding:6px!important}.control span{font-size:10px!important}.arena{padding:4px!important}.scores{margin:4px 0!important}.score{padding:5px 8px!important}.score strong{font-size:clamp(16px,3vh,22px)!important}.help{margin:4px 0!important}.bottom{gap:5px!important}}
@media(max-height:620px){canvas{max-height:35dvh}.heading{margin:3px 0 5px!important}.scores{margin:3px 0!important}.controls{gap:4px!important}.control{padding:5px 8px!important}.help{margin:3px 0!important}}

/* Refined MINI GAME interface */
:root{color-scheme:light;--mg-ink:#17251c;--mg-muted:#617166;--mg-green:#187447;--mg-line:#dbe5dc}
body{background:#f2f5f1!important;color:var(--mg-ink)!important;font-family:Inter,'Noto Sans KR',system-ui,sans-serif!important}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 0% 0%,#dceee0 0,transparent 40%);z-index:-1}
.wrap{color:var(--mg-ink)!important}
.top,.sub,.desc,.muted,.hint,.instruction,.info,.help,.round,.note{color:var(--mg-muted)!important}
.arena,.setting,.summary,.history,.card,.score,.keyhelp span{background:#fff!important;color:var(--mg-ink)!important;border:1px solid var(--mg-line)!important;box-shadow:0 12px 35px #203b2810!important}
.card{border-radius:16px!important}
button,.btn,.next,.done,.resultBtn{background:#187447!important;color:#fff!important;border:1px solid #187447!important;border-radius:11px!important;font-weight:750!important}
button:disabled{opacity:.42!important}
button:hover,.btn:hover,.next:hover,.done:hover{background:#12613a!important;box-shadow:0 7px 18px #18744722!important}
input{background:#fff!important;color:var(--mg-ink)!important;border:1px solid #cbd8cd!important}
.cell{background:#e8eee9!important;border:1px solid #d5e0d7!important}
.cell.me,.p1{background:#2e9b5c!important}.cell.opp,.p2{background:#edbd56!important}
.icon{display:none!important}
#miniSoundPanel button{background:#fff!important;color:#23412d!important;border:1px solid #d4e0d5!important;box-shadow:0 4px 14px #0001!important}
@media(max-width:650px){.card .desc{display:none!important}#projectShortDescription,#projectCreator{display:block!important}.wrap{padding:0!important}}
</style></head><body><div class="wrap"><div class="top"><span id="round"></span><span id="mode"></span></div><h1> 영역 채우기</h1><div>20초 동안 계속 뺏고 뺏깁니다.</div><div class="timer" id="timer">20</div><div class="score"><div><span id="meLabel">플레이어</span> <span id="me">0</span></div><div><span id="oppLabel">컴퓨터</span> <span id="opp">0</span></div></div><div class="board" id="board"></div><div class="info" id="info"></div><div class="note hidden" id="note">온라인 상대 입력은 연결 후 반영됩니다.</div><button class="done hidden" id="done">결과 확인 →</button></div><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu',modeName:'컴퓨터와 대전'};const mode=s.mode||'cpu';const size=5+Math.floor(Math.random()*3);let cells=Array(size*size).fill(0),left=20,playing=true,timer,ai;const board=document.getElementById('board'),me=document.getElementById('me'),opp=document.getElementById('opp'),info=document.getElementById('info');document.getElementById('mode').textContent=s.modeName||'컴퓨터와 대전';if(mode==='local'){document.getElementById('meLabel').textContent='1P';document.getElementById('oppLabel').textContent='2P'}document.getElementById('round').textContent=s.round?`${s.round}번째 게임`:'';board.style.gridTemplateColumns=`repeat(${size},1fr)`;for(let i=0;i<cells.length;i++){const b=document.createElement('button');b.className='cell';b.onclick=()=>claim(i,1);board.appendChild(b)}function render(){me.textContent=cells.filter(x=>x===1).length;opp.textContent=cells.filter(x=>x===2).length;[...board.children].forEach((b,i)=>b.className='cell'+(cells[i]===1?' me':cells[i]===2?' opp':''))}function claim(i,who){if(!playing||cells[i]===who||(mode==='online'&&window.mgOnline?.role==='guest'))return;cells[i]=who;render();window.mgOnline?.publish({game:'game2',cells,left,playing});window.miniGameSound?.('score')}function keyClaim(who){const a=cells.map((v,i)=>v!==who?i:-1).filter(i=>i>=0);if(a.length)claim(a[Math.floor(Math.random()*a.length)],who)}if(mode==='cpu'){ai=setInterval(()=>{keyClaim(2);if(Math.random()<.42)keyClaim(2)},360)}else if(mode==='online')document.getElementById('note').classList.remove('hidden');timer=setInterval(()=>{left--;document.getElementById('timer').textContent=left;window.mgOnline?.publish({game:'game2',cells,left,playing});if(left<=0)finish()},1000);document.addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k==='a')keyClaim(1);if(k==='l'&&mode==='local')keyClaim(2)});function finish(){if(!playing)return;playing=false;clearInterval(timer);clearInterval(ai);window.mgOnline?.publish({game:'game2',cells,left,playing:false});window.miniGameSound?.('win');const a=cells.filter(x=>x===1).length,b=cells.filter(x=>x===2).length,w=a>b?'me':a<b?'opp':'draw';info.textContent=w==='me'?'승리':w==='opp'?'패배':'무승부';document.getElementById('done').classList.remove('hidden');localStorage.setItem('miniGameResult',JSON.stringify({game:' 영역 채우기',winner:w,me:a,opp:b}))}document.getElementById('done').onclick=()=>location.href='../index.html';render();window.addEventListener('mg-online-ready',()=>window.mgOnline?.listen(state=>{if(state?.game!=='game2')return;cells=state.cells;left=state.left;playing=state.playing;document.getElementById('timer').textContent=left;render();if(!playing){const a=cells.filter(x=>x===1).length,b=cells.filter(x=>x===2).length;info.textContent=a>b?'방장 승리':a<b?'방장 패배':'무승부';document.getElementById('done').classList.remove('hidden')}}));</script><div id="miniSoundPanel" style="position:fixed;right:14px;bottom:14px;z-index:9999"><button id="miniSoundToggle" type="button" aria-pressed="true" style="border:1px solid #ffffff35;border-radius:999px;padding:10px 14px;background:#10251a;color:#effff4;font:700 13px Arial,sans-serif;box-shadow:0 6px 22px #0006;cursor:pointer"> 소리 켜짐</button></div><script>(function(){let enabled=localStorage.getItem('miniGameSound')!=='off',audio=null,lastKeySound=0;const btn=document.getElementById('miniSoundToggle');function label(){btn.textContent=enabled?'소리 켜짐':'소리 꺼짐';btn.setAttribute('aria-pressed',String(enabled))}function sound(kind='ui'){if(!enabled)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audio=audio||new AC();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const seq=kind==='win'?[523,659,784]:kind==='score'?[660,880]:kind==='hit'?[220,165]:kind==='bounce'?[420]:kind==='jump'?[440,660]:kind==='key'?[330]:[520];seq.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='hit'?'triangle':'sine';o.frequency.setValueAtTime(hz,now+i*.075);g.gain.setValueAtTime(.0001,now+i*.075);g.gain.exponentialRampToValueAtTime(((kind==='ui'||kind==='key')?0.035:0.065),now+i*.075+.012);g.gain.exponentialRampToValueAtTime(.0001,now+i*.075+.11);o.connect(g);g.connect(audio.destination);o.start(now+i*.075);o.stop(now+i*.075+.12)})}catch(e){}}window.miniGameSound=sound;btn.addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('miniGameSound',enabled?'on':'off');label();if(enabled)sound('ui')});document.addEventListener('click',e=>{if(e.target.closest('#miniSoundPanel'))return;if(e.target.closest('button'))sound('ui')},true);document.addEventListener('keydown',e=>{if(e.repeat||!['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code))return;const now=performance.now();if(now-lastKeySound>75){sound('key');lastKeySound=now}},true);label()})();</script><script type="module" src="../online-sync.js"></script></body></html>
