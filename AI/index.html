<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#27ae60">
<title>Coby AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="coby-markup.css">
</head>
<body>
<header class="header">
    <button class="menu-btn" onclick="openMenu()" aria-label="메뉴 열기">☰</button>
    <div class="logo"><img src="COBY_AI_logo.png" alt="Coby AI"></div>
    <div class="user-status"><span class="status-dot" id="statusDot"></span><span class="status-text" id="statusText">사용자 확인 중...</span></div>
</header>

<aside class="sidebar" id="sidebar">
    <div class="side-top">
        <button class="side-btn" onclick="newChat()">＋ 새 채팅</button>
        <button class="side-btn" onclick="openProjectModal()">📁 새 프로젝트</button>
        <button class="side-btn" onclick="openTrash()">🗑 휴지통</button>
        <button class="side-btn" onclick="openSettings()">⚙️ 설정</button>
        <div class="side-title">최근 대화</div>
    </div>
    <div class="chat-list" id="chatList"><div class="empty-chat">대화를 불러오는 중...</div></div>
    <div class="project-section">
        <div class="project-title">프로젝트</div>
        <div id="projectList"><div class="empty-chat">프로젝트가 없습니다.</div></div>
    </div>
    <div class="profile-area">
        <button class="profile" type="button" onclick="toggleProfileMenu(event)" aria-label="프로필 메뉴 열기" aria-expanded="false">
            <div class="profile-circle" id="profileCircle">?</div>
            <div class="profile-info">
                <div class="profile-name" id="profileName">사용자 확인 중...</div>
                <div class="profile-id" id="profileId">-</div>
            </div>
            <span class="profile-chevron">⌃</span>
        </button>
        <div class="profile-menu" id="profileMenu" hidden>
            <button type="button" class="profile-menu-item" onclick="goHome()"><span>⌂</span><span>홈으로</span></button>
            <button type="button" class="profile-menu-item profile-menu-logout" onclick="logout()"><span>↪</span><span>로그아웃</span></button>
        </div>
    </div>
</aside>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<main class="main">
    <div class="messages" id="messages">
        <div class="welcome" id="welcome">
            <h2>어서오세요!</h2>
            <p>무한한 상상의 나래를 펼쳐요 🚀<br>Coby가 당신의 코딩 여정을 함께합니다.</p>
        </div>
    </div>
    <div class="input-area">
        <div class="input-box">
            <textarea id="userInput" placeholder="Coby에게 무엇이든 물어보세요" autocomplete="off" spellcheck="false" rows="1"></textarea>
            <button class="send" id="sendButton" onclick="sendMessage()" aria-label="메시지 전송">↑</button>
        </div>
    </div>
</main>

<div class="project-modal" id="projectModal">
    <div class="modal-box">
        <h3>새 프로젝트</h3>
        <input id="projectNameInput" placeholder="프로젝트 이름" maxlength="50">
        <input id="projectDescriptionInput" placeholder="프로젝트 설명 (선택)" maxlength="200">
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="closeProjectModal()">취소</button>
            <button class="create-btn" onclick="createProject()">만들기</button>
        </div>
    </div>
</div>

<div class="system-modal" id="settingsModal" aria-hidden="true">
    <div class="system-box">
        <div class="system-head"><h3>⚙️ 설정</h3><button class="modal-close" onclick="closeSettings()">×</button></div>
        <div class="settings-list">
            <button class="settings-item" id="settingsAdminLogsButton" onclick="closeSettings();openAdminLogs()" hidden>📋 대화 로그 보기</button>
            <div class="settings-empty" id="settingsEmpty">현재 제공되는 설정이 없습니다.</div>
        </div>
    </div>
</div>

<div class="system-modal" id="trashModal" aria-hidden="true">
    <div class="system-box">
        <div class="system-head"><h3>🗑 휴지통</h3><button class="modal-close" onclick="closeTrash()">×</button></div>
        <p class="system-desc">삭제한 대화는 휴지통에 보관됩니다. 여기에서 복구할 수 있습니다.</p>
        <div id="trashList" class="system-list"><div class="empty-chat">휴지통을 불러오는 중...</div></div>
    </div>
</div>

<div class="system-modal" id="adminLogsModal" aria-hidden="true">
    <div class="system-box system-box-large">
        <div class="system-head"><div><h3>📋 대화 로그</h3><p class="system-desc">회장/부회장 전용 관리 화면입니다.</p></div><button class="modal-close" onclick="closeAdminLogs()">×</button></div>
        <div class="admin-toolbar"><button class="side-btn" onclick="loadAdminLogs()">새로고침</button></div>
        <div id="adminLogsList" class="system-list"><div class="empty-chat">로그를 불러오는 중...</div></div>
    </div>
</div>

<script type="module" src="js/settings.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
