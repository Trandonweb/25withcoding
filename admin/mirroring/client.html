<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화면 공유</title>
<style>
body{margin:0;font-family:sans-serif;background:#f0f0f0;display:flex;justify-content:center;align-items:center;height:100vh}.box{width:90%;max-width:600px;background:#fff;padding:30px;border-radius:20px;box-shadow:0 0 20px rgba(0,0,0,.1)}h1{margin-top:0;color:#27ae60}.status{margin-top:20px;font-size:18px;font-weight:bold}.warn{margin-top:25px;color:#c0392b;line-height:1.7}
</style>
</head>
<body id="page">
<div class="box">
<h1>화면 공유</h1>
<p>관리자에게 화면을 공유하고 있습니다.<br>이 창을 닫지 마세요.</p>
<div class="status" id="status">화면을 클릭하면 공유할 화면을 선택할 수 있습니다.</div>
<div class="warn">- 창을 닫으면 화면 공유가 종료됩니다.<br>- 새로고침하지 마세요.<br>- 뒤로가기 하지 마세요.<br>- 공유가 종료되면 다시 로그인해야 합니다.</div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import{getFirestore,doc,getDoc,updateDoc,onSnapshot,arrayUnion,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",authDomain:"points2026-f5e50.firebaseapp.com",projectId:"points2026-f5e50",storageBucket:"points2026-f5e50.firebasestorage.app",messagingSenderId:"248724251417",appId:"1:248724251417:web:02d85cdc4addac98069b88"};
const db=getFirestore(initializeApp(firebaseConfig));
const userId=localStorage.getItem("userId");
if(!userId){alert("로그인이 필요합니다.");location.href="/";throw new Error("로그인 필요")}
const userRef=doc(db,"users",userId),statusEl=document.getElementById("status");
const setStatus=t=>statusEl.innerText=t;
const TURN_API="https://two5withcoding.onrender.com/turn-credentials";
let rtcConfig={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
let iceServersLoaded=false;
let pc=null,stream=null,unsubscribe=null,heartbeatTimer=null,reconnectTimer=null,disconnected=false,reconnecting=false,settingAnswer=false,currentSessionId=null,currentSharingState=false,starting=false;
const addedAdminCandidates=new Set();
function cleanupPeerConnection(){if(pc){try{pc.close()}catch(e){}pc=null}}
async function loadIceServers(){
 if(iceServersLoaded)return;
 try{
  const response=await fetch(TURN_API,{cache:"no-store"});
  if(!response.ok)throw new Error("TURN HTTP "+response.status);
  const servers=await response.json();
  if(!Array.isArray(servers)||!servers.length)throw new Error("빈 TURN 서버 목록");
  rtcConfig={iceServers:[{urls:"stun:stun.l.google.com:19302"},...servers]};
  iceServersLoaded=true;
  console.log("[CLIENT] TURN 서버 로드 완료");
 }catch(e){
  console.warn("[CLIENT] TURN 서버 로드 실패. STUN으로 계속합니다.",e);
  setStatus("화면 공유는 시작됐습니다. 네트워크 연결을 준비하는 중...");
 }
}
async function fullDisconnect(){if(disconnected)return;disconnected=true;if(reconnectTimer)clearTimeout(reconnectTimer);if(heartbeatTimer)clearInterval(heartbeatTimer);if(unsubscribe)unsubscribe();if(stream)stream.getTracks().forEach(t=>t.stop());cleanupPeerConnection();try{await updateDoc(userRef,{online:false,state:"offline",mode:"firebase",sharing:false,sharingStartedAt:null,sessionId:null,clientOffer:null,adminAnswer:null,clientCandidates:[],adminCandidates:[],updatedAt:serverTimestamp()})}catch(e){console.warn(e)}}
window.addEventListener("pagehide",()=>{fullDisconnect()});
async function initWebRTC(){
 if(starting||stream||disconnected)return;
 starting=true;
 try{
  if(!window.isSecureContext)throw new Error("HTTPS 연결이 필요합니다.");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia)throw new Error("이 브라우저는 화면 공유를 지원하지 않습니다.");
  setStatus("화면 선택창을 열고 있습니다...");
  const captured=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
  if(!captured||captured.getVideoTracks().length===0){captured?.getTracks().forEach(t=>t.stop());throw new Error("화면 공유 트랙을 가져오지 못했습니다.")}
  stream=captured;
  const track=stream.getVideoTracks()[0];
  track.onended=async()=>{await fullDisconnect();alert("화면 공유가 종료되었습니다.");location.href="/"};
  setStatus("연결 정보를 준비하는 중...");
  await loadIceServers();
  await executeNegotiation();
  watchAdminSignal();
 }catch(e){
  console.error("[CLIENT] 화면 공유 시작 실패:",e);
  setStatus(e.name==="NotAllowedError"?"화면 공유가 취소되었습니다. 화면을 다시 클릭해 주세요.":"화면 공유를 시작할 수 없습니다.");
 }finally{starting=false}
}
function triggerRestart(delayMs){if(disconnected||reconnecting||reconnectTimer||!stream)return;reconnectTimer=setTimeout(()=>{reconnectTimer=null;executeRestartNegotiation()},delayMs)}
async function executeNegotiation(isRestart=false){
 if(disconnected||!stream)return;
 reconnecting=true;
 try{
  if(!iceServersLoaded)await loadIceServers();
  cleanupPeerConnection();
  setStatus(isRestart?"재연결 시도 중...":"WEBRTC 연결 준비중...");
  pc=new RTCPeerConnection(rtcConfig);
  for(const track of stream.getTracks())pc.addTrack(track,stream);
  pc.onconnectionstatechange=()=>{
   const state=pc.connectionState;
   console.log("[CLIENT] Connection State:",state);
   if(state==="failed")executeRestartNegotiation();
   else if(state==="disconnected")triggerRestart(5000);
   else if(state==="connected"){
    if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null}
    setStatus(currentSharingState?"관리자에게 화면을 전송 중입니다.":"관리자와 연결됨. 공유 대기 중");
   }
  };
  pc.onicecandidate=async e=>{
   if(!e.candidate)return;
   try{await updateDoc(userRef,{clientCandidates:arrayUnion(e.candidate.toJSON()),updatedAt:serverTimestamp()})}catch(e){console.error("[CLIENT] ICE 저장 실패:",e)}
  };
  currentSessionId="sess_"+Math.random().toString(36).substring(2)+Date.now();
  addedAdminCandidates.clear();
  await updateDoc(userRef,{online:true,state:"connecting",mode:"webrtc",sharing:false,sessionId:currentSessionId,clientOffer:null,clientCandidates:[],adminAnswer:null,adminCandidates:[],updatedAt:serverTimestamp()});
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  await updateDoc(userRef,{clientOffer:{type:offer.type,sdp:offer.sdp,sessionId:currentSessionId},updatedAt:serverTimestamp()});
  setStatus("관리자 연결을 기다리는 중...");
 }catch(e){
  console.error("[CLIENT] 협상 에러:",e);
  setStatus("WEBRTC 연결을 시작하지 못했습니다.");
 }finally{reconnecting=false}
}
async function executeRestartNegotiation(){await executeNegotiation(true)}
function watchAdminSignal(){
 if(unsubscribe)unsubscribe();
 unsubscribe=onSnapshot(userRef,async snap=>{
  if(!snap.exists()||!pc)return;
  const data=snap.data();
  if(data.sessionId!==currentSessionId)return;
  currentSharingState=data.sharing===true;
  if(currentSharingState&&pc.connectionState==="connected")setStatus("관리자에게 화면을 전송 중입니다.");
  else setStatus(pc.connectionState==="connected"?"관리자와 연결됨. 공유 대기 중":"관리자 연결 중...");
  if(data.adminAnswer&&!pc.currentRemoteDescription&&!settingAnswer){
   if(!data.adminAnswer.sessionId||data.adminAnswer.sessionId!==currentSessionId)return;
   settingAnswer=true;
   try{await pc.setRemoteDescription(new RTCSessionDescription({type:data.adminAnswer.type,sdp:data.adminAnswer.sdp}))}
   catch(e){console.error("[CLIENT] 원격 디스크립션 설정 에러:",e)}
   finally{settingAnswer=false}
  }
  if(Array.isArray(data.adminCandidates)&&pc.currentRemoteDescription){
   for(const candidate of data.adminCandidates){
    const key=JSON.stringify(candidate);
    if(addedAdminCandidates.has(key))continue;
    try{await pc.addIceCandidate(new RTCIceCandidate(candidate));addedAdminCandidates.add(key)}catch(e){console.warn("[CLIENT] Candidate 추가 실패:",e)}
   }
  }
 });
}
async function boot(){
 try{
  const snap=await getDoc(userRef);
  if(!snap.exists()){alert("계정을 찾을 수 없습니다.");location.href="/";return}
  heartbeatTimer=setInterval(async()=>{
   if(disconnected||!pc)return;
   try{const connected=pc.connectionState==="connected";await updateDoc(userRef,{online:true,state:connected?"live":"connecting",mode:"webrtc",sharing:connected&&currentSharingState,sessionId:currentSessionId,updatedAt:serverTimestamp()})}
   catch(e){console.error("Heartbeat 에러:",e)}
  },10000);
 }catch(e){console.error("[CLIENT] 초기화 실패:",e);setStatus("초기화에 실패했습니다.")}
}
document.getElementById("page").addEventListener("click",()=>{if(!stream&&!starting)initWebRTC()},{capture:true});
boot();
</script>
</body>
</html>
