<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON OUTPOST // FPS</title><style>
:root{--cyan:#65f6ff;--red:#ff5470;--bg:#05070b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#f5fbff}canvas{display:block}#start{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#172b3dcc 0,#05070bef 52%,#020306f5 100%)}.panel{width:min(620px,calc(100vw - 40px));padding:44px 46px;border:1px solid #ffffff22;background:#080c13e8;box-shadow:0 30px 100px #000;backdrop-filter:blur(14px);position:relative}.panel:before{content:"FPS // TRAINING SECTOR 01";display:block;color:var(--cyan);font:700 12px ui-monospace,monospace;letter-spacing:.18em;margin-bottom:18px}.panel h1{font-size:clamp(42px,8vw,76px);line-height:.9;margin:0 0 20px;letter-spacing:-.055em}.panel h1 span{color:var(--cyan)}.panel p{color:#9eacba;line-height:1.75;margin:0 0 28px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}.key{border:1px solid #ffffff20;background:#ffffff08;padding:9px 11px;font:700 12px ui-monospace,monospace;color:#dce8ee}.key b{color:var(--cyan)}#play{width:100%;border:0;padding:16px 20px;background:var(--cyan);color:#031014;font-weight:900;letter-spacing:.08em;cursor:pointer;transition:.15s;box-shadow:0 0 25px #65f6ff33}#play:hover{transform:translateY(-2px);filter:brightness(1.08)}#play:active{transform:translateY(0)}#hud{position:fixed;inset:0;z-index:5;pointer-events:none}.topbar{position:absolute;left:24px;right:24px;top:20px;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 10px #000}.stat{font:700 14px ui-monospace,monospace;letter-spacing:.08em}.stat small{display:block;color:#6e7c88;font-size:10px;margin-bottom:5px}.hpbar{width:190px;height:5px;background:#ffffff18;margin-top:7px}.hpfill{height:100%;width:100%;background:var(--cyan);box-shadow:0 0 10px #65f6ff99}.right{color:#91a1ad;text-align:right;font:600 11px ui-monospace,monospace;line-height:1.7}.right strong{color:#fff}.cross{position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 7px #65f6ff99}.cross:before{width:2px;height:28px;left:13px}.cross:after{height:2px;width:28px;top:13px}.cross i{position:absolute;inset:10px;border:1px solid var(--cyan);border-radius:50%}.msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font:900 24px ui-monospace,monospace;letter-spacing:.16em;opacity:0;text-shadow:0 0 18px currentColor;transition:opacity .12s}.hit{color:var(--cyan)}.damage{color:var(--red)}.vignette{position:absolute;inset:0;box-shadow:inset 0 0 150px #0009}.status{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:#71808c;font:600 10px ui-monospace,monospace;letter-spacing:.12em}
</style></head><body><div id="start"><div class="panel"><h1>NEON<br><span>OUTPOST</span></h1><p>ENTER THE TRAINING SECTOR. Eliminate hostile targets and survive.<br>Click to engage pointer lock and enter the arena.</p><div class="controls"><div class="key"><b>W A S D</b> MOVE</div><div class="key"><b>MOUSE</b> AIM</div><div class="key"><b>LMB</b> FIRE</div><div class="key"><b>ESC</b> RELEASE</div></div><button id="play">ENTER ARENA</button></div></div><div id="hud"><div class="topbar"><div class="stat"><small>VITALS</small><span id="hp">100</span> HP<div class="hpbar"><div id="hpfill" class="hpfill"></div></div></div><div class="right">SECTOR 01 // LIVE<br>TARGETS <strong id="targets">5</strong> &nbsp; KILLS <strong id="kills">0</strong></div></div><div class="cross"><i></i></div><div id="msg" class="msg"></div><div class="vignette"></div><div class="status">NEON OUTPOST // TRAINING SIMULATION</div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';import{PointerLockControls}from'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05070b);scene.fog=new THREE.Fog(0x05070b,24,78);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,120);camera.position.set(0,1.7,10);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);const controls=new PointerLockControls(camera,document.body);scene.add(controls.object);scene.add(new THREE.HemisphereLight(0xbfd9e6,0x11151a,1.6));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(10,22,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:0x151c22,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(70,35,0x344952,0x202a30);grid.position.y=.01;scene.add(grid);const wallMat=new THREE.MeshStandardMaterial({color:0x27343c,roughness:.8});function box(x,y,z,sx,sy,sz,mat=wallMat){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m)}box(0,2,-28,56,4,1);box(0,2,28,56,4,1);box(-28,2,0,1,4,56);box(28,2,0,1,4,56);for(let i=0;i<10;i++){const x=(i%5)*9-18,z=Math.floor(i/5)*12-6;box(x,1.3,z,2.3,2.6,2.3,new THREE.MeshStandardMaterial({color:0x34444d,roughness:.72}))}for(let i=0;i<8;i++){const a=i*Math.PI/4,x=Math.cos(a)*20,z=Math.sin(a)*20;const l=new THREE.PointLight(i%2?0xff526b:0x65f6ff,7,10);l.position.set(x,3,z);scene.add(l);box(x,1.1,z,.3,2.2,.3,new THREE.MeshStandardMaterial({color:0x18242a,emissive:i%2?0x4d0712:0x06343b,emissiveIntensity:2}))}
const gun=new THREE.Group();const gm=new THREE.MeshStandardMaterial({color:0x14191d,metalness:.75,roughness:.28});const body=new THREE.Mesh(new THREE.BoxGeometry(.22,.22,.72),gm);body.position.set(.24,-.22,-.56);gun.add(body);const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.045,.055,.36,12),gm);barrel.rotation.x=Math.PI/2;barrel.position.set(.24,-.17,-.96);gun.add(barrel);camera.add(gun);
const enemies=[];let hp=100,kills=0,spawnTimer=0,gameOver=false;function spawnEnemy(){let x,z;do{x=THREE.MathUtils.randFloat(-22,22);z=THREE.MathUtils.randFloat(-22,22)}while(Math.hypot(x-camera.position.x,z-camera.position.z)<11);const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:0xc33d50,roughness:.55,emissive:0x26050a,emissiveIntensity:.5}),b=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.25,5,10),mat);b.position.y=1.05;b.castShadow=true;g.add(b);const eye=new THREE.Mesh(new THREE.BoxGeometry(.45,.12,.12),new THREE.MeshBasicMaterial({color:0xffffff}));eye.position.set(0,1.45,.48);g.add(eye);g.position.set(x,0,z);g.userData={hp:100,cool:0,body:b};scene.add(g);enemies.push(g);document.querySelector('#targets').textContent=enemies.length}for(let i=0;i<5;i++)spawnEnemy();const ray=new THREE.Raycaster(),keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
function show(t,c){const m=document.querySelector('#msg');m.textContent=t;m.className='msg '+c;m.style.opacity=1;clearTimeout(show.t);show.t=setTimeout(()=>m.style.opacity=0,260)}function shoot(){if(gameOver||!controls.isLocked)return;ray.setFromCamera(new THREE.Vector2(0,0),camera);const hit=ray.intersectObjects(enemies.flatMap(e=>e.children),false)[0];if(hit){const e=hit.object.parent;e.userData.hp-=50;show(e.userData.hp<=0?'ELIMINATED':'HIT','hit');e.userData.body.material.emissive.setHex(0xffffff);setTimeout(()=>e.parent&&e.userData.body.material.emissive.setHex(0x26050a),70);if(e.userData.hp<=0){scene.remove(e);enemies.splice(enemies.indexOf(e),1);kills++;document.querySelector('#kills').textContent=kills;document.querySelector('#targets').textContent=enemies.length}}else show('MISS','')}document.body.addEventListener('click',shoot);const start=document.querySelector('#start');document.querySelector('#play').addEventListener('click',e=>{e.stopPropagation();start.style.display='none';controls.lock()});
function damage(n){hp=Math.max(0,hp-n);document.querySelector('#hp').textContent=hp;document.querySelector('#hpfill').style.width=hp+'%';show('-'+n,'damage');if(hp<=0){gameOver=true;controls.unlock();start.style.display='flex';start.querySelector('h1').innerHTML='MISSION<br><span>FAILED</span>';start.querySelector('p').textContent='The sector has been compromised. Reload to redeploy.';document.querySelector('#play').style.display='none'}}let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;if(controls.isLocked&&!gameOver){const d=new THREE.Vector3((keys.KeyD?1:0)-(keys.KeyA?1:0),0,(keys.KeyS?1:0)-(keys.KeyW?1:0));if(d.lengthSq())d.normalize();controls.moveRight(d.x*7*dt);controls.moveForward(d.z*7*dt);camera.position.x=THREE.MathUtils.clamp(camera.position.x,-25.5,25.5);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-25.5,25.5);for(const e of enemies){const dx=camera.position.x-e.position.x,dz=camera.position.z-e.position.z,dist=Math.hypot(dx,dz);e.userData.cool-=dt;if(dist>2.5){e.position.x+=dx/dist*1.3*dt;e.position.z+=dz/dist*1.3*dt}else if(e.userData.cool<=0){damage(8);e.userData.cool=1}e.lookAt(camera.position.x,1.1,camera.position.z)}spawnTimer-=dt;if(spawnTimer<=0&&enemies.length<9){spawnEnemy();spawnTimer=3.5}}renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
