<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>점프 러너 | MINI GAME</title>
<style>
*{box-sizing:border-box} :root{color-scheme:dark;--green:#53e88a;--line:rgba(150,255,190,.18)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#17442c,transparent 42%),#050b08;color:#f3fff6;font-family:Inter,'Noto Sans KR',Arial,sans-serif;display:grid;place-items:center;padding:22px}
.wrap{width:min(1040px,100%)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#b8cdbf;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:16px 0 22px}.heading h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.05em;margin:0}.heading p{margin:8px 0 0;color:#b8cdbf}.timerbox{padding:12px 18px;border:1px solid var(--line);border-radius:16px;background:#ffffff08;text-align:right;min-width:130px}.timerbox small{display:block;color:#b8cdbf}.timerbox strong{font-size:27px;font-variant-numeric:tabular-nums}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lane{min-width:0;border:1px solid var(--line);border-radius:22px;padding:14px;background:linear-gradient(150deg,#10251a,#08130d);box-shadow:0 20px 50px #0004}.lanehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.lanehead strong{font-size:15px}.pill{font-size:11px;letter-spacing:.08em;border-radius:999px;padding:5px 9px;background:#53e88a1c;color:#9dffbd;border:1px solid #53e88a38}.computer .pill{background:#78b7ff14;color:#acd1ff;border-color:#78b7ff38}canvas{display:block;width:100%;height:auto;background:#050b08;border:1px solid #ffffff12;border-radius:13px;touch-action:manipulation}.lanefoot{display:flex;justify-content:space-between;gap:8px;color:#b8cdbf;font-size:12px;margin-top:10px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px}.btn{border:1px solid var(--line);border-radius:13px;padding:13px 18px;background:#ffffff0a;color:#f3fff6;font-weight:750;cursor:pointer}.btn.primary{background:var(--green);color:#062012;border-color:transparent}.hint{margin-left:auto;color:#b8cdbf;font-size:13px}#message{min-height:24px;font-weight:750;margin:16px 0 0}#done[hidden]{display:none}.note{color:#9fb6a6;font-size:12px;margin-top:12px;line-height:1.6}
@media(max-width:680px){body{padding:14px}.heading{align-items:start;flex-direction:column}.timerbox{text-align:left}.lanes{grid-template-columns:1fr}.hint{width:100%;margin-left:0}.lane{padding:10px}}
/* Responsive full-screen layout: keep the game inside the visible viewport. */
html{width:100%;height:100%;overflow:hidden}
body{width:100%;height:100dvh;min-height:0!important;overflow:hidden!important;padding:clamp(6px,1.2vh,14px)!important;overscroll-behavior:none}
.wrap{width:min(100%,1000px);max-height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:clamp(3px,0.7vh,8px);padding:0!important;margin:auto}
.wrap>*{flex-shrink:0}
h1,.heading h1{font-size:clamp(21px,4.2vh,42px)!important;line-height:1.08;margin:clamp(2px,0.5vh,7px) 0!important}
p,.sub,.desc,.help{font-size:clamp(11px,1.65vh,15px);line-height:1.35}
canvas{max-width:100%;max-height:43dvh;width:auto;height:auto;object-fit:contain;margin-block:clamp(3px,0.6vh,8px)!important}
button,.btn{padding:clamp(7px,1.2vh,12px) clamp(10px,2vw,18px);font-size:clamp(11px,1.6vh,15px)}
#message{min-height:0!important;margin:clamp(2px,0.4vh,6px) 0!important;font-size:clamp(11px,1.6vh,15px)}
.top{flex-shrink:0}
@media(max-width:650px){body{padding:6px!important}.wrap{width:100%;gap:3px}.heading{margin:4px 0 6px!important}.controls{grid-template-columns:1fr 1fr!important;gap:5px!important}.control{padding:6px!important}.control span{font-size:10px!important}.arena{padding:4px!important}.scores{margin:4px 0!important}.score{padding:5px 8px!important}.score strong{font-size:clamp(16px,3vh,22px)!important}.help{margin:4px 0!important}.bottom{gap:5px!important}}
@media(max-height:620px){canvas{max-height:35dvh}.heading{margin:3px 0 5px!important}.scores{margin:3px 0!important}.controls{gap:4px!important}.control{padding:5px 8px!important}.help{margin:3px 0!important}}
</style></head><body><main class="wrap">
<div class="top"><span>MINI GAME / 05</span><span id="round"></span></div>
<div class="heading"><div><h1>점프 러너</h1><p>나와 컴퓨터의 주행 거리와 속도는 동일합니다.</p></div><div class="timerbox"><small>경과 시간</small><strong><span id="time">0.0</span>s</strong></div></div>
<div class="lanes">
<section class="lane"><div class="lanehead"><strong id="playerLabel">플레이어</strong><span class="pill">P1</span></div><canvas id="player" width="480" height="220" aria-label="플레이어 점프 러너"></canvas><div class="lanefoot"><span>스페이스 / ↑ / 탭</span><span id="playerSpeed">속도 1.0×</span></div></section>
<section class="lane computer"><div class="lanehead"><strong id="cpuLabel">컴퓨터</strong><span class="pill">CPU</span></div><canvas id="cpu" width="480" height="220" aria-label="컴퓨터 점프 러너"></canvas><div class="lanefoot"><span id="cpuState">AI 대기 중</span><span id="cpuSpeed">속도 1.0×</span></div></section>
</div>
<div class="controls"><button class="btn primary" id="start">시작 / 다시 시작</button><button class="btn" id="jump">점프 ↑</button><button class="btn" id="done" hidden>결과 확인 →</button><span class="hint">먼저 장애물에 부딪히면 패배</span></div>
<div id="message">시작을 눌러 대결하세요.</div><div class="note">두 주행 코스는 같은 속도와 같은 장애물 배치를 사용합니다. 시간이 지날수록 속도가 증가하며, 30초 생존 시 완주합니다.</div>
</main><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu'};
document.getElementById('round').textContent=s.round?s.round+'번째 게임':'연습 모드';if(s.mode==='local'){document.getElementById('playerLabel').textContent='1P';document.getElementById('cpuLabel').textContent='2P'}
const pCanvas=document.getElementById('player'),cCanvas=document.getElementById('cpu'),pctx=pCanvas.getContext('2d'),cctx=cCanvas.getContext('2d');
const W=480,H=220,ground=178,finishAt=30;
let running=false,ended=false,t=0,last=0,raf=0,spawnP=30,py=0,pvy=0,cy=0,cvy=0,pobs=[],cobs=[],cpuNextJump=0,pAlive=true,cAlive=true,pEndTime=null,cEndTime=null;
function reset(){cancelAnimationFrame(raf);running=true;ended=false;t=0;last=0;spawnP=28;py=cy=pvy=cvy=0;pobs=[];cobs=[];cpuNextJump=0;pAlive=cAlive=true;pEndTime=cEndTime=null;document.getElementById('done').hidden=true;document.getElementById('message').textContent='달리는 중! 두 주행이 모두 끝나면 결과가 확정됩니다.';document.getElementById('cpuState').textContent='AI 주행 중';raf=requestAnimationFrame(loop)}
function jump(){if(running&&pAlive&&py>=-0.5)pvy=-10.5}
function draw(ctx,y,obs,speed,label){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a1b11';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#31583b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(W,ground);ctx.stroke();ctx.fillStyle='#1a3825';for(let i=0;i<12;i++){let x=((i*53-t*speed*28)%W+W)%W;ctx.fillRect(x,ground+10,22,2)}ctx.fillStyle='#53e88a';ctx.fillRect(65,ground-34+y,29,34);ctx.fillRect(83,ground-45+y,13,15);ctx.fillStyle='#07110d';ctx.fillRect(91,ground-40+y,3,3);ctx.fillStyle='#ffcf67';for(const o of obs){ctx.fillRect(o.x,ground-o.h,o.w,o.h);ctx.fillRect(o.x+o.w*.2,ground-o.h-5,o.w*.6,5)}ctx.fillStyle='#9ab6a1';ctx.font='11px Arial';ctx.fillText(label,12,18)}
function addObstacle(arr){const h=24+Math.random()*25,w=15+Math.random()*14;arr.push({x:W+10,w,h})}
function collision(y,arr){return arr.some(o=>o.x<94&&o.x+o.w>65&&ground-34+y+34>ground-o.h+2)}
function loop(now){
if(!running)return;
const dt=Math.min(2.2,(now-(last||now-16.67))/16.67);last=now;t+=dt/60;
const ramp=1+Math.min(1.7,t/30*1.7),speed=4.0*ramp;
if(pAlive){pvy+=.58*dt;py=Math.min(0,py+pvy*dt);if(py===0)pvy=0}
if(cAlive){cvy+=.58*dt;cy=Math.min(0,cy+cvy*dt);if(cy===0)cvy=0}
spawnP-=dt;
if(spawnP<=0){
 const h=24+Math.random()*25,w=15+Math.random()*14,x=W+10;
 if(pAlive)pobs.push({x,w,h});if(cAlive)cobs.push({x,w,h});
 spawnP=Math.max(20,58/ramp+Math.random()*23)
}
if(pAlive){pobs.forEach(o=>o.x-=speed*dt);pobs=pobs.filter(o=>o.x>-40)}
if(cAlive){cobs.forEach(o=>o.x-=speed*dt);cobs=cobs.filter(o=>o.x>-40)}
if(cAlive){const next=cobs.find(o=>o.x>75);if(next&&next.x<150&&cy===0&&cpuNextJump<=t){cvy=-10.1;cpuNextJump=t+(Math.random()<Math.min(.42,t/80)?0.75:0.28)}}
if(pAlive&&collision(py,pobs)){pAlive=false;pEndTime=t;document.getElementById('message').textContent='플레이어 주행 종료 · 컴퓨터는 계속 달립니다.'}
if(cAlive&&collision(cy,cobs)){cAlive=false;cEndTime=t;document.getElementById('cpuState').textContent='주행 종료'}
if(t>=finishAt){if(pAlive){pAlive=false;pEndTime=finishAt;document.getElementById('message').textContent='플레이어 완주 · 컴퓨터는 계속 달립니다.'}if(cAlive){cAlive=false;cEndTime=finishAt}}
draw(pctx,py,pobs,speed,pAlive?'PLAYER':'PLAYER · OUT');draw(cctx,cy,cobs,speed,cAlive?'COMPUTER':'COMPUTER · OUT');
if(!pAlive){pctx.fillStyle='#ffcf67';pctx.font='bold 17px Arial';pctx.fillText('FINISHED',W/2-35,48)}
if(!cAlive){cctx.fillStyle='#ffcf67';cctx.font='bold 17px Arial';cctx.fillText('FINISHED',W/2-35,48)}
document.getElementById('time').textContent=Math.min(finishAt,t).toFixed(1);
document.getElementById('playerSpeed').textContent='속도 '+ramp.toFixed(1)+'×';document.getElementById('cpuSpeed').textContent='속도 '+ramp.toFixed(1)+'×';
if(!pAlive&&!cAlive){finishRace();return}
raf=requestAnimationFrame(loop)
}
function finishRace(){
if(ended)return;ended=true;running=false;
const me=Math.round((pEndTime??finishAt)*10),opp=Math.round((cEndTime??finishAt)*10);
const winner=me>opp?'me':me<opp?'opp':'draw';
document.getElementById('message').textContent=winner==='me'?'승리 · 컴퓨터보다 더 오래 주행했습니다.':winner==='opp'?'패배 · 컴퓨터가 더 오래 주행했습니다.':'무승부 · 두 주행 시간이 같습니다.';
document.getElementById('cpuState').textContent=winner==='me'?'패배':winner==='opp'?'승리':'무승부';
localStorage.setItem('miniGameResult',JSON.stringify({game:'🦖 점프 러너',winner,me,opp}));
document.getElementById('done').hidden=false
}
document.getElementById('start').onclick=reset;document.getElementById('jump').onclick=jump;pCanvas.onclick=jump;document.addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump()}});
document.getElementById('done').onclick=()=>location.href='../index.html';
draw(pctx,0,[] ,4,'PLAYER');draw(cctx,0,[],3.8,'COMPUTER');
</script><div id="miniSoundPanel" style="position:fixed;right:14px;bottom:14px;z-index:9999"><button id="miniSoundToggle" type="button" aria-pressed="true" style="border:1px solid #ffffff35;border-radius:999px;padding:10px 14px;background:#10251a;color:#effff4;font:700 13px Arial,sans-serif;box-shadow:0 6px 22px #0006;cursor:pointer">🔊 소리 켜짐</button></div><script>(function(){let enabled=localStorage.getItem('miniGameSound')!=='off',audio=null,lastKeySound=0;const btn=document.getElementById('miniSoundToggle');function label(){btn.textContent=enabled?'🔊 소리 켜짐':'🔇 소리 꺼짐';btn.setAttribute('aria-pressed',String(enabled))}function sound(kind='ui'){if(!enabled)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audio=audio||new AC();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const seq=kind==='win'?[523,659,784]:kind==='score'?[660,880]:kind==='hit'?[220,165]:kind==='bounce'?[420]:kind==='jump'?[440,660]:kind==='key'?[330]:[520];seq.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='hit'?'triangle':'sine';o.frequency.setValueAtTime(hz,now+i*.075);g.gain.setValueAtTime(.0001,now+i*.075);g.gain.exponentialRampToValueAtTime(((kind==='ui'||kind==='key')?0.035:0.065),now+i*.075+.012);g.gain.exponentialRampToValueAtTime(.0001,now+i*.075+.11);o.connect(g);g.connect(audio.destination);o.start(now+i*.075);o.stop(now+i*.075+.12)})}catch(e){}}window.miniGameSound=sound;btn.addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('miniGameSound',enabled?'on':'off');label();if(enabled)sound('ui')});document.addEventListener('click',e=>{if(e.target.closest('#miniSoundPanel'))return;if(e.target.closest('button'))sound('ui')},true);document.addEventListener('keydown',e=>{if(e.repeat||!['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code))return;const now=performance.now();if(now-lastKeySound>75){sound('key');lastKeySound=now}},true);label()})();</script></body></html>
