<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>무한의 계단 - 확장 모드</title>
<style>
body {
    margin: 0;
    background-color: #111;
    color: white;
    font-family: 'Arial', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
}
#ui {
    text-align: center;
    margin-bottom: 10px;
}
#score-board {
    font-size: 18px;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}
#timer-bar-container {
    width: 360px;
    height: 16px;
    background-color: #222;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 10px;
    border: 2px solid #fff;
}
#timer-bar {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ff4757, #ff6b81);
    transition: width 0.1s linear;
}
#canvas-container {
    position: relative;
    width: min(480px, calc((100vh - 120px) * 2 / 3), calc(100vw - 32px));
    aspect-ratio: 2 / 3;
    height: auto;
    flex: 0 0 auto;
}
canvas {
    display: block;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    border: 4px solid #fff;
    border-radius: 12px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.8);
}
.overlay {
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    background-color: rgba(0, 0, 0, 0.9);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
}
.overlay h1 {
    color: #ffd32a;
    font-size: 30px;
    margin-bottom: 15px;
    text-shadow: 3px 3px 0px #000;
}
.menu-btn {
    padding: 10px 20px;
    font-size: 15px;
    font-weight: bold;
    background-color: #2ecc71;
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    box-shadow: 0 4px 0px #27ae60;
    transition: 0.1s;
    margin: 6px;
    width: 210px;
}
.menu-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0px #27ae60;
}
.shop-btn {
    background-color: #e67e22;
    box-shadow: 0 4px 0px #d35400;
}
.map-btn {
    background-color: #1abc9c;
    box-shadow: 0 4px 0px #16a085;
}
.mode-btn {
    background-color: #9b59b6;
    box-shadow: 0 4px 0px #8e44ad;
}
.fever-btn {
    background-color: #e74c3c;
    box-shadow: 0 4px 0px #c0392b;
}
.skin-card, .map-card {
    background: #222;
    border: 2px solid #444;
    border-radius: 8px;
    padding: 8px 12px;
    margin: 4px;
    width: 240px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.skin-card.selected, .map-card.selected {
    border-color: #2ecc71;
    background: #1b3322;
}
.action-select-btn {
    padding: 5px 12px;
    font-size: 11px;
    font-weight: bold;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
#skin-list { width: 270px; max-height: 300px !important; overflow-y: auto; margin-bottom: 10px; padding: 3px; }
.skin-card { width: auto; min-height: 54px; padding: 8px 10px; margin: 4px 2px; border-radius: 12px; }
.skin-card.selected { box-shadow: 0 0 0 2px rgba(46,204,113,0.18); }
.skin-preview { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%; background:#111; border:2px solid #555; display:flex; align-items:center; justify-content:center; margin-right:8px; box-sizing:border-box; }
.skin-preview-inner { width:20px; height:20px; border-radius:5px; border:2px solid rgba(255,255,255,0.8); box-sizing:border-box; }
.skin-card-main { min-width:0; flex:1; display:flex; align-items:center; }
.skin-name { font-size:12px; font-weight:bold; }
.skin-condition { font-size:10px; color:#ffd32a; margin-top:2px; }
#controls {
    margin-top: 15px;
    font-size: 12px;
    color: #aaa;
    text-align: center;
    line-height: 1.4;
}
.btn-hint {
    display: inline-block;
    padding: 2px 5px;
    background: #444;
    color: #fff;
    border-radius: 4px;
    font-weight: bold;
    border: 1px solid #666;
}

/* 상단 HUD: 계단 수를 크게, 시간은 중앙, 보석은 오른쪽에 고정 */
#ui {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: min(560px, calc(100vw - 24px));
    margin: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    pointer-events: none;
}
#score-board {
    font-size: 14px;
    line-height: 1.15;
    text-align: center;
    width: 100%;
}
#current-score-line {
    font-size: clamp(28px, 4vw, 38px);
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 1px;
    text-shadow: 0 3px 6px rgba(0,0,0,.8), 0 0 10px rgba(255,255,255,.18);
}
#current-score {
    color: #ffd32a;
    font-size: inherit;
}
#max-score-line {
    margin-top: 2px;
    color: #dfe6e9;
    font-size: 12px;
    text-shadow: 1px 2px 4px rgba(0,0,0,.75);
}
#timer-bar-container {
    width: min(360px, calc(100vw - 100px));
    height: 14px;
    margin-top: 1px;
    box-sizing: border-box;
    border-width: 2px;
    box-shadow: 0 2px 8px rgba(0,0,0,.55);
}
#gem-counter {
    position: absolute;
    top: 4px;
    right: 0;
    padding: 7px 11px;
    border: 1px solid rgba(0,232,255,.65);
    border-radius: 12px;
    background: rgba(8,20,35,.88);
    color: #00e8ff;
    font-size: 20px;
    font-weight: 900;
    text-shadow: 0 2px 5px #000;
    white-space: nowrap;
}
@media (max-width: 420px) {
    #ui { top: 8px; width: calc(100vw - 16px); }
    #current-score-line { font-size: 28px; }
    #max-score-line { font-size: 11px; }
    #timer-bar-container { width: calc(100vw - 112px); }
    #gem-counter { top: 3px; right: 0; padding: 6px 8px; font-size: 17px; }
}

</style>
</head>
<body>

<div id="ui">
    <div id="score-board">
        <div id="current-score-line">계단 <span id="current-score">0</span></div>
        <div id="max-score-line">최고 기록 <span id="max-score" style="color:#ffd32a;">0</span></div>
    </div>
    <div id="timer-bar-container">
        <div id="timer-bar"></div>
    </div>
    <div id="gem-counter">💎 <span id="current-gems" style="color:#00e8ff;">0</span></div>
</div>

<div id="canvas-container">
    <!-- 홈 화면 -->
    <div id="startScreen" class="overlay">
        <h1>무한의 계단</h1>
        <button class="menu-btn" onclick="startGame(0)">일반 모드 시작</button>
        <button class="menu-btn mode-btn" onclick="openModeSelect()">모드 선택</button>
        <button class="menu-btn shop-btn" onclick="openShop()">캐릭터 선택</button>
        <button class="menu-btn map-btn" onclick="openMapSelect()">맵 변경 (무료)</button>
    </div>

    <!-- 모드 선택 화면 -->
    <div id="modeScreen" class="overlay" style="display: none;">
        <h1 style="color: #9b59b6;">모드 선택</h1>
        <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;">
            <button class="menu-btn mode-btn" style="width: 240px;" onclick="startGame(1)">유리계단 모드<br><span style="font-size:10px; color:#ddd;">(150계단 달성시 '유리인간' 해금)</span></button>
            <button class="menu-btn fever-btn" style="width: 240px;" onclick="startGame(2)">피버 모드<br><span style="font-size:10px; color:#ddd;">(직진 전용 / 50계단마다 방향 전환)</span></button>
        </div>
        <button class="menu-btn" style="background-color: #7f8c8d; box-shadow: 0 4px 0px #7f8c8d;" onclick="closeModeSelect()">돌아가기</button>
    </div>

    <!-- 상점 화면 -->
    <div id="shopScreen" class="overlay" style="display: none;">
        <h1 style="color: #e67e22; margin-bottom: 6px;">캐릭터 선택</h1><div style="font-size:11px;color:#bbb;margin-bottom:6px;">원하는 캐릭터의 [선택] 버튼을 누르세요</div>
        <div id="skin-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 10px;"></div>
        <button class="menu-btn" style="background-color: #7f8c8d; box-shadow: 0 4px 0px #7f8c8d;" onclick="closeShop()">돌아가기</button>
    </div>

    <!-- 맵 선택 화면 -->
    <div id="mapScreen" class="overlay" style="display: none;">
        <h1 style="color: #1abc9c;">맵 변경 (무료)</h1>
        <div id="map-list" style="max-height: 170px; overflow-y: auto; margin-bottom: 8px;"></div>
        <div style="font-weight:bold;font-size:13px;margin:4px 0 6px;">계단 색상 선택</div>
        <div id="stair-color-list" style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:270px;margin-bottom:8px;"></div>
        <button class="menu-btn" style="background-color: #7f8c8d; box-shadow: 0 4px 0px #7f8c8d;" onclick="closeMapSelect()">돌아가기</button>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="gameOverScreen" class="overlay" style="display: none;">
        <h1 style="color: #ff4757;">GAME OVER</h1>
        <div style="text-align: center; margin-bottom: 15px;">
            <p style="font-size: 16px; margin-bottom: 6px;">최종 점수: <span id="final-score" style="color:#ffd32a; font-weight:bold;">0</span>점</p>
            <p style="font-size: 16px; margin-bottom: 6px;">획득 보석: <span id="earned-gems" style="color:#00e8ff; font-weight:bold;">0</span>개</p>
            <p id="unlock-notice" style="font-size: 14px; color: #2ecc71; margin-top: 8px; font-weight: bold; display: none;"></p>
        </div>
        <button class="menu-btn" style="background-color:#3498db; box-shadow:0 4px 0px #2980b9;" onclick="restartGame()">다시 도전 (Space)</button>
        <button class="menu-btn" style="background-color:#7f8c8d; box-shadow:0 4px 0px #7f8c8d;" onclick="goHome()">홈으로</button>
    </div>

    <canvas id="gameCanvas" width="360" height="540"></canvas>
</div>

<div id="controls">
    [방향 전환] : <span class="btn-hint">A</span> / <span class="btn-hint">←</span> |
    [그대로 오르기] : <span class="btn-hint">D</span> / <span class="btn-hint">→</span>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('current-score');
const maxScoreEl = document.getElementById('max-score');
const gemsEl = document.getElementById('current-gems');
const finalScoreEl = document.getElementById('final-score');
const earnedGemsEl = document.getElementById('earned-gems');
const timerBar = document.getElementById('timer-bar');
const unlockNoticeEl = document.getElementById('unlock-notice');

const startScreen = document.getElementById('startScreen');
const modeScreen = document.getElementById('modeScreen');
const shopScreen = document.getElementById('shopScreen');
const mapScreen = document.getElementById('mapScreen');
const gameOverScreen = document.getElementById('gameOverScreen');

const STAIR_WIDTH = 42;
const STAIR_HEIGHT = 12;
const STEP_X = 35;
const STEP_Y = 16;

const CENTER_X = canvas.width / 2;
const CENTER_Y = canvas.height - 180;

let score = 0;
let gameGems = 0;
let totalGems = 0;
let gameMode = 0;

let maxScore = 0;
maxScoreEl.textContent = maxScore;

let savedSkinsState = JSON.parse(localStorage.getItem('infiniteStairs_skins')) || {};
let skins = [
    { id: 0, name: "기본이", price: 0, unlocked: true, bodyColor: "#9b59b6", faceColor: "#fdb45c", hairColor: "#4a2306", hairType: "short", deathType: "springBounce" },
    { id: 1, name: "유리인간", price: 0, unlocked: savedSkinsState[1] || false, specialUnlock: "유리계단 150계단", bodyColor: "rgba(255,255,255,0.25)", faceColor: "rgba(255,255,255,0.25)", hairColor: "rgba(255,255,255,0.4)", hairType: "none", deathType: "shatter", isGlass: true },
    { id: 2, name: "파이어맨", price: 0, unlocked: savedSkinsState[2] || false, specialUnlock: "피버모드 클리어", bodyColor: "#e74c3c", faceColor: "#fffa65", hairColor: "#c0392b", hairType: "ninja", deathType: "burnUp" },
    { id: 3, name: "사이버 닌자", price: 150, unlocked: savedSkinsState[3] !== undefined ? savedSkinsState[3] : false, bodyColor: "#111111", faceColor: "#111111", hairColor: "#111111", hairType: "ninja", deathType: "shadowDash" },
    { id: 4, name: "황금 로봇", price: 150, unlocked: savedSkinsState[4] !== undefined ? savedSkinsState[4] : false, bodyColor: "#f1c40f", faceColor: "#f1c40f", hairColor: "#f1c40f", hairType: "robot", deathType: "explode" },
    { id: 5, name: "긴머리 소녀", price: 150, unlocked: savedSkinsState[5] !== undefined ? savedSkinsState[5] : false, bodyColor: "#e91e63", faceColor: "#ffcc80", hairColor: "#3e2723", hairType: "long", deathType: "dizzySpin" },
    { id: 6, name: "스페이스 파일럿", price: 150, unlocked: savedSkinsState[6] !== undefined ? savedSkinsState[6] : false, bodyColor: "#3498db", faceColor: "#ffffff", hairColor: "#bdc3c7", hairType: "propeller", deathType: "flyAway" },
    { id: 7, name: "꼬마 마법사", price: 150, unlocked: savedSkinsState[7] !== undefined ? savedSkinsState[7] : false, bodyColor: "#8e44ad", faceColor: "#ffd32a", hairColor: "#e67e22", hairType: "long", deathType: "broomFly" },
    { id: 8, name: "제트 슬라이더", price: 150, unlocked: savedSkinsState[8] !== undefined ? savedSkinsState[8] : false, bodyColor: "#e74c3c", faceColor: "#fffa65", hairColor: "#2c3e50", hairType: "ninja", deathType: "spinDrop" },
    { id: 9, name: "무지개 임지완", price: 0, unlocked: savedSkinsState[9] || false, specialUnlock: "일반 모드 500계단", unlockScore: 500, bodyColor: "#ffffff", faceColor: "#ffe0bd", hairColor: "#ffffff", hairType: "none", deathType: "rainbowFade", isRainbow: true },
    { id: 10, name: "빛나는 신", price: 0, unlocked: savedSkinsState[10] || false, specialUnlock: "일반 모드 1000계단", unlockScore: 1000, bodyColor: "#ffffff", faceColor: "#ffffff", hairColor: "#ffffff", hairType: "none", deathType: "heavenAscend", isGod: true }
];
let currentSkinId = 0;

let maps = [
    { id: 0, name: "밝은 도시", theme: "city" },
    { id: 1, name: "초록 정글", theme: "jungle" },
    { id: 2, name: "고대 이집트", theme: "pyramid" },
    { id: 3, name: "푸른 바다", theme: "ocean" },
    { id: 4, name: "벚꽃 정원", theme: "sakura" },
    { id: 5, name: "오로라 설원", theme: "aurora" },
    { id: 6, name: "달빛 우주", theme: "space" },
    { id: 7, name: "화산 지대", theme: "volcano" }
];
let currentMapId = 0;
let stairPalettes = [
    { name: "기본 빨강", top: "#e74c3c", side: "#c0392b", current: "#f1c40f", currentSide: "#d4ac0d" },
    { name: "하늘색", top: "#48dbfb", side: "#0abde3", current: "#fff200", currentSide: "#f6b93b" },
    { name: "초록", top: "#2ecc71", side: "#219150", current: "#ffe66d", currentSide: "#f1c40f" },
    { name: "보라", top: "#a55eea", side: "#8854d0", current: "#fed330", currentSide: "#f7b731" },
    { name: "분홍", top: "#ff6bcb", side: "#c44569", current: "#fff200", currentSide: "#f6b93b" },
    { name: "금색", top: "#f6b93b", side: "#b7791f", current: "#ffffff", currentSide: "#dfe6e9" },
    { name: "민트", top: "#55efc4", side: "#00b894", current: "#ffeaa7", currentSide: "#fdcb6e" },
    { name: "흰색", top: "#f5f6fa", side: "#a4b0be", current: "#70a1ff", currentSide: "#1e90ff" }
];
let currentStairPalette = Number(localStorage.getItem("infiniteStairs_stairPalette") || 0);

let isPlaying = false;
let deathTimer = 0;
let activeDeathType = "fall";

let timeLimit = 100;
let timeDecreaseRate = 0.18;

let player = {
    direction: 1,
    walkFrame: 0,
    currentIndex: 0
};

let stairs = [];
let cameraX = 0;
let cameraY = 0;
let targetCameraX = 0;
let targetCameraY = 0;

let turnConsecutiveCount = 0;
let lastTurnDirectionChange = 0;

// 배경 오브젝트 초기화
let cityBuildings = [];
for(let i = 0; i < 6; i++) {
    cityBuildings.push({
        x: i * 65 + 10,
        height: 180 + (i * 30) % 150,
        color: i % 2 === 0 ? '#34495e' : '#2c3e50'
    });
}

let glassDecorations = [];
for(let i = 0; i < 15; i++) {
    glassDecorations.push({
        x: Math.random() * 360,
        y: Math.random() * 540,
        size: 15 + Math.random() * 25,
        angle: Math.random() * Math.PI
    });
}

let hellFlames = [];
for(let i = 0; i < 12; i++) {
    hellFlames.push({
        x: Math.random() * 360,
        y: 400 + Math.random() * 140,
        size: 20 + Math.random() * 30
    });
}

let fishes = [];
for(let i = 0; i < 8; i++) {
    fishes.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        speed: 0.5 + Math.random() * 1.5,
        size: 10 + Math.random() * 15,
        color: ['#ff7675', '#ffeaa7', '#55efc4', '#74b9ff', '#fdcb6e'][Math.floor(Math.random()*5)],
        dir: Math.random() > 0.5 ? 1 : -1
    });
}

let jungleTrees = [];
for(let i = 0; i < 12; i++) {
    jungleTrees.push({
        x: (i * 45) - 30 + Math.random() * 20,
        yOffset: i * 70,
        width: 16 + Math.random() * 14,
        height: 140 + Math.random() * 70,
        color: i % 2 === 0 ? '#055c58' : '#044440',
        leafColor: i % 2 === 0 ? '#10ac84' : '#009432'
    });
}

updateGemsDisplay();

function updateGemsDisplay() {
    gemsEl.textContent = totalGems;
}

function saveSkinsData() {
    let state = {};
    skins.forEach(s => { state[s.id] = s.unlocked; });
    localStorage.setItem('infiniteStairs_skins', JSON.stringify(state));
}
function checkSpecialUnlocks() {
    if (gameMode !== 0) return;
    let unlocked = false;
    const rainbow = skins.find(s => s.id === 9);
    const god = skins.find(s => s.id === 10);
    if (rainbow && score >= 500 && !rainbow.unlocked) { rainbow.unlocked = true; unlocked = true; }
    if (god && score >= 1000 && !god.unlocked) { god.unlocked = true; unlocked = true; }
    if (unlocked) saveSkinsData();
}


function goHome() {
    gameOverScreen.style.display = 'none';
    shopScreen.style.display = 'none';
    mapScreen.style.display = 'none';
    modeScreen.style.display = 'none';
    startScreen.style.display = 'flex';
    isPlaying = false;
    deathTimer = 0;
}

function openModeSelect() {
    startScreen.style.display = 'none';
    modeScreen.style.display = 'flex';
}
function closeModeSelect() {
    modeScreen.style.display = 'none';
    startScreen.style.display = 'flex';
}

function openShop() {
    startScreen.style.display = 'none';
    shopScreen.style.display = 'flex';
    renderShopList();
}
function closeShop() {
    shopScreen.style.display = 'none';
    startScreen.style.display = 'flex';
}

function renderShopList() {
    const listContainer = document.getElementById('skin-list');
    listContainer.innerHTML = '';
    skins.forEach(skin => {
        const card = document.createElement('div');
        card.className = `skin-card ${skin.id === currentSkinId ? 'selected' : ''}`;

        let previewStyle = `background:${skin.bodyColor};`;
        if (skin.isRainbow) previewStyle = 'background:linear-gradient(135deg,#ff0000,#ff8c00,#ffe600,#00c853,#00b0ff,#304ffe,#aa00ff);';
        if (skin.isGod) previewStyle = 'background:radial-gradient(circle,#ffffff 0%,#fff8dc 55%,#ffd700 100%);box-shadow:0 0 10px #ffffff;';

        let btnHTML = "";
        if (skin.id === currentSkinId) btnHTML = `<span style="color:#2ecc71;font-weight:bold;font-size:11px;">사용 중 ✓</span>`;
        else if (skin.unlocked) btnHTML = `<button class="action-select-btn" style="background:#2ecc71;color:white;" onclick="selectSkin(${skin.id})">선택</button>`;
        else if (skin.specialUnlock) btnHTML = `<span style="color:#e74c3c;font-size:10px;font-weight:bold;">🔒 ${skin.specialUnlock}</span>`;
        else btnHTML = `<button class="action-select-btn" style="background:#e67e22;color:white;" onclick="buySkin(${skin.id})">${skin.price} 보석</button>`;

        let condition = "";
        if (skin.id === 9) condition = '<div class="skin-condition">🌈 500계단 달성</div>';
        if (skin.id === 10) condition = '<div class="skin-condition">✨ 1000계단 달성</div>';

        card.innerHTML = `
            <div class="skin-card-main">
                <div class="skin-preview"><div class="skin-preview-inner" style="${previewStyle}"></div></div>
                <div><div class="skin-name">${skin.name}</div>${condition}</div>
            </div>
            <div>${btnHTML}</div>
        `;
        listContainer.appendChild(card);
    });
}

function selectSkin(id) {
    currentSkinId = id;
    renderShopList();
}

function buySkin(id) {
    const skin = skins.find(s => s.id === id);
    if (totalGems >= skin.price) {
        totalGems -= skin.price;
        skin.unlocked = true;
        currentSkinId = id;
        updateGemsDisplay();
        saveSkinsData();
        renderShopList();
    } else {
        alert("보석이 부족합니다!");
    }
}

function openMapSelect() {
    startScreen.style.display = 'none';
    mapScreen.style.display = 'flex';
    renderMapList();
}
function closeMapSelect() {
    mapScreen.style.display = 'none';
    startScreen.style.display = 'flex';
}

function renderMapList() {
    const listContainer = document.getElementById('map-list');
    listContainer.innerHTML = '';
    maps.forEach(map => {
        const card = document.createElement('div');
        card.className = `map-card ${map.id === currentMapId ? 'selected' : ''}`;
        let btnHTML = map.id === currentMapId ? 
            `<span style="color:#2ecc71; font-weight:bold; font-size:11px;">사용 중</span>` : 
            `<button class="action-select-btn" style="background:#1abc9c; color:white;" onclick="selectMap(${map.id})">선택</button>`;
        const descriptions = { city:"네온 빌딩과 도시 야경", jungle:"깊은 숲과 거대한 나무", pyramid:"모래언덕·피라미드·스핑크스", ocean:"물고기가 헤엄치는 바닷속", sakura:"벚꽃잎이 흩날리는 정원", aurora:"오로라가 빛나는 얼음 평원", space:"별과 행성이 떠 있는 우주", volcano:"용암이 흐르는 화산" };
        card.innerHTML = `<div style="text-align:left;"><div style="font-weight:bold; font-size:13px;">${map.name} <span style="font-size:10px; color:#2ecc71;">(무료)</span></div><div style="font-size:10px;color:#aaa;margin-top:3px;">${descriptions[map.theme] || ""}</div></div><div>${btnHTML}</div>`;
        listContainer.appendChild(card);
    });
    renderStairPaletteList();
}

function renderStairPaletteList() {
    const container = document.getElementById('stair-color-list');
    if (!container) return;
    container.innerHTML = '';
    stairPalettes.forEach((palette, index) => {
        const button = document.createElement('button');
        button.title = palette.name;
        button.setAttribute('aria-label', palette.name);
        button.style.cssText = `width:29px;height:29px;border-radius:50%;border:3px solid ${index === currentStairPalette ? '#ffffff' : '#555'};background:${palette.top};box-shadow:inset 0 -7px 0 ${palette.side};cursor:pointer;`;
        button.onclick = () => {
            currentStairPalette = index;
            localStorage.setItem('infiniteStairs_stairPalette', String(index));
            renderStairPaletteList();
        };
        container.appendChild(button);
    });
}

function selectMap(id) {
    currentMapId = id;
    renderMapList();
}

function startGame(mode) {
    gameMode = mode;
    startScreen.style.display = 'none';
    modeScreen.style.display = 'none';
    shopScreen.style.display = 'none';
    mapScreen.style.display = 'none';
    gameOverScreen.style.display = 'none';

    score = 0;
    gameGems = 0;
    scoreEl.textContent = '0';

    timeLimit = 100;
    if (gameMode === 2) {
        timeDecreaseRate = 0.40;
    } else {
        timeDecreaseRate = 0.18;
    }
    timerBar.style.width = '100%';

    player.direction = 1;
    player.walkFrame = 0;
    player.currentIndex = 0;

    cameraX = 0;
    cameraY = 0;
    targetCameraX = 0;
    targetCameraY = 0;

    turnConsecutiveCount = 0;
    lastTurnDirectionChange = 1;
    stairs = [];
    deathTimer = 0;

    stairs.push({ x: 0, y: 0, hasItem: false });
    stairs.push({ x: STEP_X, y: -STEP_Y, hasItem: false });
    lastTurnDirectionChange = 1;

    for (let i = 0; i < 80; i++) {
        generateNextStair();
    }

    isPlaying = true;
    requestAnimationFrame(gameLoop);
}

function restartGame() {
    startGame(gameMode);
}

function generateNextStair() {
    const lastStair = stairs[stairs.length - 1];
    const prevLastStair = stairs[stairs.length - 2];
    
    let lastDiff = lastStair.x - prevLastStair.x;

    let rand;
    if (gameMode === 2) {
        // 피버 모드: 50계단마다 방향이 꺾임 (그 전까지는 일직선)
        let totalStairsCount = stairs.length;
        if (totalStairsCount % 50 === 0) {
            rand = (lastDiff > 0 ? -1 : 1);
        } else {
            rand = (lastDiff > 0 ? 1 : -1);
        }
    } else {
        if (turnConsecutiveCount >= 3) {
            rand = lastDiff > 0 ? 1 : -1;
            turnConsecutiveCount = 0;
            lastTurnDirectionChange = rand;
        } else {
            rand = Math.random() > 0.5 ? 1 : -1;
            if (rand !== (lastDiff > 0 ? 1 : -1)) {
                turnConsecutiveCount++;
            } else {
                turnConsecutiveCount = 0;
            }
        }
    }

    let hasItem = Math.random() < 0.25;
    stairs.push({
        x: lastStair.x + (rand * STEP_X),
        y: lastStair.y - STEP_Y,
        hasItem: hasItem
    });
}

window.addEventListener('keydown', (e) => {
    if (gameOverScreen.style.display === 'flex') {
        if (e.key === ' ' || e.code === 'Space') {
            e.preventDefault();
            restartGame();
        }
        return;
    }

    if (!isPlaying || deathTimer > 0) return;
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();

    let inputType = "";
    if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') inputType = "turn";
    else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') inputType = "straight";

    if (inputType === "") return;

    const currentStair = stairs[player.currentIndex];
    const nextStair = stairs[player.currentIndex + 1];
    if (!nextStair) return;

    const targetDirection = nextStair.x > currentStair.x ? 1 : -1;
    if (inputType === "turn") player.direction *= -1;

    if (player.direction === targetDirection) {
        score++;
        checkSpecialUnlocks();

        if (nextStair.hasItem) {
            gameGems++;
            totalGems++;
            updateGemsDisplay();
            nextStair.hasItem = false;
        }

        scoreEl.textContent = score;
        player.walkFrame = (player.walkFrame + 1) % 2;
        player.currentIndex++;

        if (gameMode === 2) {
            timeLimit = Math.min(100, timeLimit + 4.0);
            timeDecreaseRate = 0.40 + (score * 0.001);
        } else {
            timeLimit = Math.min(100, timeLimit + 5);
            let hundredMultiplier = Math.floor(score / 100);
            timeDecreaseRate = 0.18 + (score * 0.0006) + (hundredMultiplier * 0.05);
        }

        const targetStair = stairs[player.currentIndex];
        targetCameraX = -targetStair.x;
        targetCameraY = -targetStair.y;

        if (stairs.length - player.currentIndex < 30) {
            generateNextStair();
        }
    } else {
        triggerDeath();
    }
});

function triggerDeath() {
    isPlaying = false;

    if (score > maxScore) {
        maxScore = score;
        maxScoreEl.textContent = maxScore;
        
        totalGems += 10;
        gameGems += 10;
        updateGemsDisplay();
    }

    const activeSkin = skins.find(s => s.id === currentSkinId) || skins[0];
    activeDeathType = activeSkin.deathType || "fall";

    deathTimer = 1;

    setTimeout(() => {
        endGame();
    }, 850);
}

function endGame() {
    deathTimer = 0;
    finalScoreEl.textContent = score;
    earnedGemsEl.textContent = gameGems;

    checkSpecialUnlocks();

    let unlockedMsg = "";
    if (gameMode === 0 && score >= 1000) {
        unlockedMsg = "✨ 1000계단 달성! '빛나는 신' 캐릭터 해금!";
    } else if (gameMode === 0 && score >= 500) {
        unlockedMsg = "🌈 500계단 달성! '무지개 임지완' 캐릭터 해금!";
    } else if (gameMode === 1 && score >= 150) {
        const glassHuman = skins.find(s => s.id === 1);
        if (!glassHuman.unlocked) {
            glassHuman.unlocked = true;
            saveSkinsData();
            unlockedMsg = "🎉 유리계단 150계단 달성! '유리인간' 캐릭터 해금!";
        }
    } else if (gameMode === 2 && score >= 100) {
        const fireMan = skins.find(s => s.id === 2);
        if (!fireMan.unlocked) {
            fireMan.unlocked = true;
            saveSkinsData();
            unlockedMsg = "🎉 피버모드 달성! '파이어맨' 캐릭터 해금!";
        }
    }

    if (unlockedMsg !== "") {
        unlockNoticeEl.textContent = unlockedMsg;
        unlockNoticeEl.style.display = "block";
    } else {
        unlockNoticeEl.style.display = "none";
    }

    gameOverScreen.style.display = 'flex';
}

function gameLoop() {
    if (!isPlaying && deathTimer === 0) return;

    if (isPlaying) {
        timeLimit -= timeDecreaseRate;
        if (timeLimit <= 0) {
            timeLimit = 0;
            timerBar.style.width = '0%';
            triggerDeath();
            return;
        }
        timerBar.style.width = timeLimit + '%';

        cameraX += (targetCameraX - cameraX) * 0.35;
        cameraY += (targetCameraY - cameraY) * 0.35;
    } else if (deathTimer > 0) {
        deathTimer += 1;
    }

    draw();

    if (isPlaying || deathTimer > 0) {
        requestAnimationFrame(gameLoop);
    }
}

function draw() {

        bgGrad.addColorStop(1, '#273c75');

        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.lineWidth = 1.5;
        glassDecorations.forEach(g => {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.save();
            ctx.translate(g.x, g.y);
            ctx.rotate(g.angle);
            ctx.fillRect(-g.size/2, -g.size/2, g.size, g.size);
            ctx.strokeRect(-g.size/2, -g.size/2, g.size, g.size);
            ctx.restore();
        });
    } else if (gameMode === 2) {
        let hellGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        hellGrad.addColorStop(0, '#2c0b0e');
        hellGrad.addColorStop(0.7, '#4a0e17');
        hellGrad.addColorStop(1, '#8b0000');
        ctx.fillStyle = hellGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        hellFlames.forEach(f => {
            ctx.fillStyle = 'rgba(255, 69, 0, 0.25)';
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
            ctx.fill();
        });
    } else {
        const mapTheme = maps[currentMapId].theme;

                ctx.fillStyle = b.color;
                ctx.fillRect(b.x * 1.2, by, 55, b.height + 100);

                ctx.fillStyle = '#fffa65';

            gradient.addColorStop(1, '#01a3a4');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            fishes.forEach(fish => {
                fish.x += fish.speed * fish.dir;
                if (fish.x > canvas.width + 30) fish.x = -30;
                if (fish.x < -30) fish.x = canvas.width + 30;

                ctx.save();
                ctx.translate(fish.x, fish.y);
                if (fish.dir === -1) ctx.scale(-1, 1);

                ctx.fillStyle = fish.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, fish.size, fish.size / 2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-fish.size, 0);
                ctx.lineTo(-fish.size - 8, -6);
                ctx.lineTo(-fish.size - 8, 6);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(fish.size / 2 - 3, -2, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });
        }
    }

    stairs.forEach((stair, index) => {
        let drawX = CENTER_X + stair.x + cameraX;
        let drawY = CENTER_Y + stair.y + cameraY;
        if (drawY > canvas.height + 60 || drawY < -60) return;

        let isCurrent = (index === player.currentIndex);

        if (gameMode === 1) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.fillRect(drawX - STAIR_WIDTH/2, drawY - STAIR_HEIGHT, STAIR_WIDTH, STAIR_HEIGHT);
            
            ctx.strokeStyle = isCurrent ? '#f1c40f' : 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 2;
            ctx.strokeRect(drawX - STAIR_WIDTH/2, drawY - STAIR_HEIGHT, STAIR_WIDTH, STAIR_HEIGHT);
        } else {
            const palette = stairPalettes[currentStairPalette] || stairPalettes[0];
            ctx.fillStyle = isCurrent ? palette.current : palette.top;
            ctx.fillRect(drawX - STAIR_WIDTH/2, drawY - STAIR_HEIGHT, STAIR_WIDTH, STAIR_HEIGHT);
            ctx.fillStyle = isCurrent ? palette.currentSide : palette.side;
            ctx.fillRect(drawX - STAIR_WIDTH/2, drawY, STAIR_WIDTH, 4);
            ctx.strokeStyle = "rgba(255,255,255,.22)";
            ctx.lineWidth = 1;
            ctx.strokeRect(drawX - STAIR_WIDTH/2, drawY - STAIR_HEIGHT, STAIR_WIDTH, STAIR_HEIGHT);
        }

        if (stair.hasItem) {
            ctx.fillStyle = '#00e8ff';
            ctx.beginPath();
            ctx.arc(drawX, drawY - STAIR_HEIGHT - 12, 5, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    const activeSkin = skins.find(s => s.id === currentSkinId) || skins[0];
    ctx.save();
    ctx.translate(CENTER_X, CENTER_Y);

    if (deathTimer > 0) {
        if (activeDeathType === "springBounce") {
            ctx.rotate(Math.sin(deathTimer * 0.65) * 0.22);
            ctx.translate(0, deathTimer * 5);
            ctx.globalAlpha = Math.max(0, 1 - deathTimer / 24);
            ctx.strokeStyle = "#c084fc";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, -20, 7 + deathTimer * 1.4, 0, Math.PI * 2);
            ctx.stroke();
        } else if (activeDeathType === "rainbowFade") {
            ctx.globalAlpha = Math.max(0, 1 - deathTimer / 32);
            for (let i = 0; i < 7; i++) {
                ctx.strokeStyle = ["#ff0000","#ff8c00","#ffe600","#00c853","#00b0ff","#304ffe","#aa00ff"][i];
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, -28, 14 + deathTimer * 1.2 + i * 2.5, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.translate(0, -deathTimer * 2);
        } else if (activeDeathType === "heavenAscend") {
            ctx.translate(0, -deathTimer * 10);
            ctx.globalAlpha = Math.max(0, 1 - deathTimer / 36);
        } else if (activeDeathType === "flyAway") {
            ctx.translate(deathTimer * 8, -deathTimer * 18);
            ctx.rotate(deathTimer * 0.15);
        } else if (activeDeathType === "shatter") {
            // 유리인간 전용 박살나는 연출 강화
            ctx.save();
            for(let i = 0; i < 10; i++) {
                let angle = (i * Math.PI / 5) + (deathTimer * 0.3);
                let dist = deathTimer * 7;
                ctx.fillStyle = "rgba(255,255,255,0.85)";
                ctx.fillRect(Math.cos(angle)*dist, Math.sin(angle)*dist, 7, 7);
            }
            ctx.restore();
            ctx.globalAlpha = 0;
        } else if (activeDeathType === "explode") {
            ctx.save();
            ctx.fillStyle = "#ff4757";
            ctx.beginPath();
            ctx.arc(0, -25, deathTimer * 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffd32a";
            ctx.beginPath();
            ctx.arc(0, -25, deathTimer * 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            if (deathTimer > 15) ctx.globalAlpha = 0;
        } else if (activeDeathType === "burnUp") {
            // 파이어맨 전용 타오르며 소멸하는 연출 강화
            ctx.translate(0, -deathTimer * 6);
            ctx.fillStyle = "#ff4500";
            ctx.beginPath();
            ctx.arc(0, -20, deathTimer * 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffeb3b";
            ctx.beginPath();
            ctx.arc(0, -20, deathTimer * 1.2, 0, Math.PI * 2);
            ctx.fill();
        } else if (activeDeathType === "shadowDash") {
            for(let trail=0;trail<4;trail++){ctx.fillStyle=`rgba(20,20,35,${.45-trail*.08})`;ctx.fillRect(-deathTimer*15-trail*12,-42+trail*7,18,22);}
            ctx.translate(deathTimer * 15, 0);
            ctx.globalAlpha = Math.max(0, 1 - deathTimer / 20);
        } else if (activeDeathType === "dizzySpin") {
            ctx.strokeStyle="#ffcc80";ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-56,12+deathTimer*.4,4,deathTimer*.3,0,Math.PI*2);ctx.stroke();
            ctx.rotate(deathTimer * 0.5);
            ctx.translate(0, deathTimer * 8);
        } else if (activeDeathType === "broomFly") {
            ctx.translate(deathTimer * 10, -deathTimer * 12);
            ctx.rotate(-0.3);
        } else if (activeDeathType === "spinDrop") {
            ctx.strokeStyle="#ff4757";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-25,10+deathTimer,deathTimer*.2,deathTimer*.2+Math.PI*1.5);ctx.stroke();
            ctx.translate(-deathTimer * 6, deathTimer * 12);
            ctx.rotate(deathTimer * 0.3);
        } else {
            ctx.translate(0, deathTimer * 14);
        }
    }

    ctx.scale(player.direction, 1);

    if (activeSkin.isRainbow) {
        drawRainbowCharacter();
    } else if (activeSkin.isGod) {
        drawGodCharacter();
    } else if (activeSkin.isGlass) {
        // 유리인간: 눈, 코, 입을 완전히 없애고 투명한 유리 질감 형태로만 표현
        ctx.fillStyle = activeSkin.bodyColor;
        ctx.fillRect(-10, -36, 20, 20);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-10, -36, 20, 20);

        ctx.fillRect(-8, -50, 16, 16);
        ctx.strokeRect(-8, -50, 16, 16);

        // 하이라이트 반사 광채 효과 (유리 느낌 강조)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fillRect(-5, -46, 3, 8);

        ctx.fillStyle = activeSkin.bodyColor;
        if (player.walkFrame === 0) {
            ctx.fillRect(-8, -16, 6, 9);
            ctx.strokeRect(-8, -16, 6, 9);
            ctx.fillRect(2, -16, 6, 6);
            ctx.strokeRect(2, -16, 6, 6);
        } else {
            ctx.fillRect(-8, -16, 6, 6);
            ctx.strokeRect(-8, -16, 6, 6);
            ctx.fillRect(2, -16, 6, 9);
            ctx.strokeRect(2, -16, 6, 9);
        }
    } else {
        ctx.fillStyle = activeSkin.bodyColor;
        ctx.fillRect(-10, -36, 20, 20);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.strokeRect(-10, -36, 20, 20);

        ctx.fillStyle = activeSkin.faceColor;
        ctx.fillRect(-8, -50, 16, 16);
        ctx.strokeRect(-8, -50, 16, 16);
        ctx.fillStyle = '#000';
        ctx.fillRect(2, -45, 3, 4);

        if (activeSkin.hairType === "long") {
            ctx.fillStyle = activeSkin.hairColor;
            ctx.fillRect(-10, -50, 6, 18);
        } else if (activeSkin.hairType === "ninja") {
            ctx.fillStyle = '#111111';
            ctx.fillRect(-8, -50, 16, 6);
        } else if (activeSkin.hairType === "robot") {
            ctx.fillStyle = activeSkin.hairColor;
            ctx.fillRect(-2, -56, 4, 6);
        } else if (activeSkin.hairType === "propeller") {
            ctx.fillStyle = activeSkin.hairColor;
            ctx.fillRect(-2, -58, 4, 8);
            ctx.fillStyle = '#ff4757';
            let propWidth = 16 + Math.sin(Date.now() * 0.05) * 8;
            ctx.fillRect(-propWidth / 2, -61, propWidth, 3);
        }

        ctx.fillStyle = activeSkin.bodyColor;
        if (player.walkFrame === 0) {
            ctx.fillRect(-8, -16, 6, 9);
            ctx.strokeRect(-8, -16, 6, 9);
            ctx.fillRect(2, -16, 6, 6);
            ctx.strokeRect(2, -16, 6, 6);
        } else {
            ctx.fillRect(-8, -16, 6, 6);
            ctx.strokeRect(-8, -16, 6, 6);
            ctx.fillRect(2, -16, 6, 9);
            ctx.strokeRect(2, -16, 6, 9);
        }
    }

    ctx.restore();

    if (isPlaying && gameMode === 1) {
        ctx.font = "bold 14px Arial";
        ctx.fillStyle = "#00e8ff";
        ctx.textAlign = "center";
        ctx.fillText("💎 유리계단 모드", canvas.width / 2, 35);
    } else if (isPlaying && gameMode === 2) {
        ctx.font = "bold 14px Arial";
        ctx.fillStyle = "#ff7675";
        ctx.textAlign = "center";
        ctx.fillText("🔥 피버 모드", canvas.width / 2, 35);
    }
}

</script>
</body>
