<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>축제 주문</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f6f8;color:#222}button{font:inherit;cursor:pointer}.role-screen{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:#111;color:#fff}.role-screen h1{font-size:28px}.role-screen p{color:#aaa}.app{display:none;height:100vh}.client{width:100%;height:100%;display:grid;grid-template-columns:3fr 1fr}.menu{padding:28px;overflow:auto}.menu h1{margin:0 0 22px;font-size:32px}.menus{display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:20px}.menu-card{border:0;border-radius:20px;background:#fff;padding:28px;min-height:190px;text-align:left;box-shadow:0 5px 18px #00000012;transition:.15s}.menu-card:hover{transform:translateY(-2px)}.menu-card .name{font-size:27px;font-weight:800}.menu-card .price{font-size:22px;margin-top:12px;color:#168a4b}.add{margin-top:25px;width:100%;padding:16px;border:0;border-radius:12px;background:#168a4b;color:#fff;font-weight:700}.cart{background:#fff;border-left:1px solid #ddd;padding:24px;display:flex;flex-direction:column;min-width:280px}.cart h2{margin:0 0 18px}.cart-list{flex:1;overflow:auto}.cart-item{padding:13px 0;border-bottom:1px solid #eee}.cart-item-row{display:flex;justify-content:space-between;gap:8px}.qty{font-size:14px;color:#777}.total{border-top:2px solid #222;padding-top:18px;font-size:25px;font-weight:800}.host{height:100vh;padding:24px;display:flex;flex-direction:column}.host-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.host h1{margin:0}.pay{background:#168a4b;color:white;border:0;border-radius:12px;padding:14px 24px;font-weight:800}.pay:disabled{background:#aaa;cursor:not-allowed}.host-list{background:#fff;border-radius:14px;overflow:auto;flex:1}.order-row{display:grid;grid-template-columns:70px 1fr 160px 160px;gap:15px;padding:18px;border-bottom:1px solid #eee;align-items:center}.order-row.header{font-weight:800;background:#f1f3f5;position:sticky;top:0}.status{font-weight:700}.paid{color:#168a4b}.empty{padding:40px;text-align:center;color:#888}.hint{font-size:13px;color:#888;margin-top:8px}@media(max-width:800px){.client{grid-template-columns:1fr}.cart{border-left:0;border-top:1px solid #ddd;height:38vh}.menu{height:62vh;padding:16px}.menus{grid-template-columns:1fr 1fr;gap:10px}.menu-card{min-height:130px;padding:16px}.menu-card .name{font-size:20px}.menu-card .price{font-size:17px}.add{padding:10px;margin-top:12px}.order-row{grid-template-columns:50px 1fr 100px 100px;font-size:14px}}
</style>
</head>
<body>
<div id="roleScreen" class="role-screen"><div><h1>콘솔 명령어로 역할을 지정하세요.</h1><p>role.change("host,1") 또는 role.change("client,1")</p></div></div>
<div id="clientApp" class="app"><div class="client"><main class="menu"><h1>주문하기</h1><div id="menus" class="menus"></div></main><aside class="cart"><h2>담은 메뉴</h2><div id="cartList" class="cart-list"><div class="empty">아직 담은 메뉴가 없습니다.</div></div><div class="total">총 <span id="total">0</span>원</div></aside></div></div>
<div id="hostApp" class="app"><div class="host"><div class="host-top"><div><h1>주문 관리자</h1><div class="hint" id="hostInfo"></div></div><button id="payBtn" class="pay" disabled>결제 완료</button></div><div class="host-list"><div class="order-row header"><div>번호</div><div>메뉴 / 수량</div><div>금액</div><div>상태</div></div><div id="hostList"></div></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import{getFirestore,doc,onSnapshot,setDoc,updateDoc}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9Q",authDomain:"festivallikes.firebaseapp.com",projectId:"festivallikes",storageBucket:"festivallikes.firebasestorage.app",messagingSenderId:"782245120700",appId:"1:782245120700:web:c61e16313e9ae688e6deb9"};
const db=getFirestore(initializeApp(firebaseConfig));
const PASSWORD="25쟈소채야ㅜㅎ";
const menus=[{id:"m1",name:"메뉴 1",price:3000},{id:"m2",name:"메뉴 2",price:4000},{id:"m3",name:"메뉴 3",price:5000},{id:"m4",name:"메뉴 4",price:6000}];
let role=null,hostSlots=[],unlocked=false,orderRef=null,order={items:{},total:0,status:"waiting"};
window.role={change(value){if(typeof value!=="string"){console.warn("role.change(\"host,1\") 형식으로 입력하세요.");return}const p=value.split(",").map(x=>x.trim());if(!["host","client"].includes(p[0])){console.warn("host 또는 client만 사용할 수 있습니다.");return}if(p[0]==="host"){const slots=p.slice(1);if(!slots.length||slots.length>4||slots.some(x=>!/^([1-4])$/.test(x))||new Set(slots).size!==slots.length){console.warn("host는 1~4번을 중복 없이 최대 4개 지정할 수 있습니다.");return}role="host";hostSlots=slots}else{if(!p[1]||!/^\d+$/.test(p[1])){console.warn("client는 client,1 형식으로 입력하세요.");return}role="client";hostSlots=[p[1]]}console.log("enter password");}};
window.password={enter(value){if(value!==PASSWORD){console.warn("password incorrect");return}if(!role){console.warn("먼저 role.change(...)를 실행하세요.");return}unlocked=true;start();}};
function money(n){return Number(n).toLocaleString("ko-KR")}
function renderMenus(){document.getElementById("menus").innerHTML=menus.map(m=>`<button class="menu-card" data-id="${m.id}"><div class="name">${m.name}</div><div class="price">${money(m.price)}원</div><div class="add">담기</div></button>`).join("");document.querySelectorAll(".menu-card").forEach(b=>b.onclick=()=>add(b.dataset.id));}
async function add(id){const m=menus.find(x=>x.id===id);order.items[id]=(order.items[id]||0)+1;order.total=menus.reduce((s,x)=>s+x.price*(order.items[x.id]||0),0);await setDoc(orderRef,{...order,updatedAt:Date.now()});}
function renderClient(o){order=o||order;const rows=menus.filter(m=>order.items[m.id]).map(m=>`<div class="cart-item"><div class="cart-item-row"><b>${m.name}</b><b>${money(m.price*(order.items[m.id]||0))}원</b></div><div class="qty">${order.items[m.id]}개 × ${money(m.price)}원</div></div>`).join("");document.getElementById("cartList").innerHTML=rows||'<div class="empty">아직 담은 메뉴가 없습니다.</div>';document.getElementById("total").textContent=money(order.total||0);}
function renderHost(o){order=o||order;const rows=menus.filter(m=>order.items[m.id]).map(m=>`<div class="order-row"><div>#</div><div>${m.name} × ${order.items[m.id]}</div><div>${money(m.price*order.items[m.id])}원</div><div class="status ${order.status==='paid'?'paid':''}">${order.status==='paid'?"결제 완료":"결제 대기"}</div></div>`).join("");document.getElementById("hostList").innerHTML=rows||'<div class="empty">현재 주문이 없습니다.</div>';document.getElementById("payBtn").disabled=!Object.keys(order.items||{}).length||order.status==='paid';}
function start(){document.getElementById("roleScreen").style.display="none";if(role==='client'){document.getElementById("clientApp").style.display="block";renderMenus();orderRef=doc(db,"festivalOrders","order-"+hostSlots[0]);onSnapshot(orderRef,s=>{if(s.exists())renderClient(s.data());});}else{document.getElementById("hostApp").style.display="block";document.getElementById("hostInfo").textContent="관리 대상: "+hostSlots.join(", ")+"번";orderRef=doc(db,"festivalOrders","order-"+hostSlots[0]);onSnapshot(orderRef,s=>{if(s.exists())renderHost(s.data());else renderHost({items:{},total:0,status:"waiting"});});document.getElementById("payBtn").onclick=async()=>{await updateDoc(orderRef,{status:"paid",paidAt:Date.now()});};}}
</script>
</body>
</html>
