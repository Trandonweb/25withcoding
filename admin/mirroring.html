<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>화면 모니터링</title>
<style>
:root{--bg:#f0f0f0;--panel:#fff;--text:#111;--muted:#777;--primary:var(--primary-color,#27ae60)}
body.dark-mode{--bg:#101010;--panel:#1b1b1b;--text:#fff;--muted:#aaa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:sans-serif;transition:.2s}
header{height:70px;padding:0 20px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--primary);box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:20}
.left{display:flex;align-items:center;gap:15px}header h2{margin:0;color:var(--primary);font-size:21px}
#back{border:0;border-radius:10px;padding:10px 15px;background:var(--primary);color:#fff;font-weight:bold;cursor:pointer}
#online{font-weight:bold}
#grid{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;max-width:1800px;margin:auto}
.cctv{position:relative;background:#080808;border:2px solid #333;border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:16/10;box-shadow:0 4px 14px #0003;transition:.18s}.cctv:hover{transform:scale(1.015);border-color:var(--primary)}
.cctv video{width:100%;height:100%;display:block;object-fit:contain;background:#000}.cctv .top{position:absolute;left:0;right:0;top:0;padding:9px 11px;background:linear-gradient(#000b,transparent);color:#fff;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 1px 3px #000}.name{font-weight:bold;font-size:15px}.status{font-size:12px;font-weight:bold}.status.connecting{color:#ffd166}.status.live{color:#7cff9a}.status.waiting{color:#ddd}.status.error{color:#ff7777}.status::before{content:'●';margin-right:5px}.cctv .bottom{position:absolute;left:0;right:0;bottom:0;padding:8px 11px;background:linear-gradient(transparent,#000c);color:#ddd;font-size:12px;pointer-events:none}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}
#viewer{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:100}
#viewerBox{width:min(94vw,1400px);height:min(92vh,900px);background:#111;border:1px solid #444;border-radius:14px;overflow:hidden;box-shadow:0 15px 50px #000;display:flex;flex-direction:column}
#viewerTop{height:58px;flex:none;padding:0 14px;display:flex;align-items:center;justify-content:space-between;color:#fff;background:#181818;border-bottom:1px solid #333}#viewerTitle{margin:0;font-size:18px}.viewer-status{font-size:12px;margin-left:10px}.viewer-status.live{color:#7cff9a}.viewer-status.error{color:#ff7777}.viewer-status.connecting{color:#ffd166}
#closeViewer{border:0;border-radius:8px;padding:9px 13px;background:#e74c3c;color:#fff;font-weight:bold;cursor:pointer}#bigVideo{width:100%;height:calc(100% - 58px);object-fit:contain;background:#000}
@media(max-width:600px){header{height:62px;padding:0 10px}header h2{font-size:17px}#grid{padding:10px;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cctv{border-radius:7px}.cctv .top{padding:6px;font-size:12px}.cctv .bottom{padding:5px;font-size:10px}.left{gap:8px}#online{font-size:12px}}
</style>
</head>
<body>
<header><div class="left"><button id="back">← 홈</button><div id="online">🟢 접속 0명</div></div><h2>📹 화면 모니터링</h2></header>
<main id="grid"><div class="empty">접속한 학생의 화면을 불러오는 중...</div></main>
<div id="viewer"><div id="viewerBox"><div id="viewerTop"><h2 id="viewerTitle">학생 화면 <span class="viewer-status connecting">● 연결 중</span></h2><button id="closeViewer">닫기</button></div><video id="bigVideo" autoplay playsinline></video></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import{getFirestore,collection,onSnapshot,doc,getDoc,updateDoc,arrayUnion,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",authDomain:"points2026-f5e50.firebaseapp.com",projectId:"points2026-f5e50",storageBucket:"points2026-f5e50.firebasestorage.app",messagingSenderId:"248724251417",appId:"1:248724251417:web:02d85cdc4addac98069b88"};
const db=getFirestore(initializeApp(firebaseConfig));

try{const s=JSON.parse(localStorage.getItem("coding_with_ramen_settings")||"{}");document.body.classList.toggle("dark-mode",!!s.darkMode);if(s.primaryColor)document.documentElement.style.setProperty("--primary-color",s.primaryColor)}catch(e){console.warn(e)}

const adminId=localStorage.getItem("userId");
if(!adminId){alert("로그인이 필요합니다.");location.href="/signin?redirect=/admin/mirroring.html";throw new Error("로그인 필요")}

const rtcConfig={iceServers:[
 {urls:"stun:stun.relay.metered.ca:80"},
 {urls:"turn:standard.relay.metered.ca:80",username:"cc29acf1a234c7ca3a5ae899",credential:"CW4V8T/D1+AnGnED"},
 {urls:"turn:standard.relay.metered.ca:80?transport=tcp",username:"cc29acf1a234c7ca3a5ae899",credential:"CW4V8T/D1+AnGnED"},
 {urls:"turn:standard.relay.metered.ca:443",username:"cc29acf1a234c7ca3a5ae899",credential:"CW4V8T/D1+AnGnED"},
 {urls:"turns:standard.relay.metered.ca:443?transport=tcp",username:"cc29acf1a234c7ca3a5ae899",credential:"CW4V8T/D1+AnGnED"}
]};

const sessions=new Map();
const busy=new Set();
let selectedId=null;

function findCard(id){for(const c of document.querySelectorAll(".cctv")){if(c.dataset.id===id)return c}return null}
function setCardStatus(id,type,text){const c=findCard(id);if(!c)return;const el=c.querySelector(".status");if(!el)return;el.className="status "+type;el.textContent=text}
function setViewerStatus(type,text){const el=document.querySelector("#viewerTitle .viewer-status");if(el){el.className="viewer-status "+type;el.textContent=text}}

function makeCard(id,d){
 const c=document.createElement("div");
 c.className="cctv";c.dataset.id=id;
 const video=document.createElement("video");video.autoplay=true;video.muted=true;video.playsInline=true;
 const top=document.createElement("div");top.className="top";
 const name=document.createElement("span");name.className="name";name.textContent=d.name||id;
 const status=document.createElement("span");status.className="status connecting";status.textContent="연결 중";
 top.append(name,status);
 const bottom=document.createElement("div");bottom.className="bottom";bottom.textContent=`ID: ${id} · ${d.mode||"webrtc"}`;
 c.append(video,top,bottom);
 c.onclick=()=>openViewer(id);
 return c;
}

function setVideo(id,stream){
 const c=findCard(id);if(!c)return;
 const v=c.querySelector("video");v.srcObject=stream;v.play().catch(()=>{});
 setCardStatus(id,"waiting","영상 확인 중");
}

function markError(id,text){setCardStatus(id,"error",text);if(selectedId===id)setViewerStatus("error","● "+text)}

async function verifyInbound(id){
 const s=sessions.get(id);if(!s||!s.pc)return;
 try{
  const stats=await s.pc.getStats();
  let received=false;
  stats.forEach(r=>{
   if(r.type!=="inbound-rtp")return;
   if(r.kind!=="video"&&r.mediaType!=="video")return;
   if(Number(r.bytesReceived||0)>0||Number(r.packetsReceived||0)>0)received=true;
  });
  if(received){
   s.receiving=true;
   setCardStatus(id,"live","LIVE");
   if(selectedId===id)setViewerStatus("live","● LIVE");
  }else if(s.pc.connectionState==="connected"){
   s.receiving=false;
   markError(id,"영상 없음");
  }
 }catch(e){console.warn("[ADMIN] stats",id,e)}
}

async function stopSession(id,clear=true){
 const s=sessions.get(id);if(!s)return;
 if(s.unsubscribe)try{s.unsubscribe()}catch(e){}
 if(s.statsTimer)clearInterval(s.statsTimer);
 try{s.pc.close()}catch(e){}
 sessions.delete(id);
 if(selectedId===id)closeViewer();
 if(clear){try{await updateDoc(doc(db,"users",id),{sharing:false,sharingStartedAt:null,adminAnswer:null,adminCandidates:[]})}catch(e){console.warn("[ADMIN] 상태 정리 실패",id,e)}}
}

async function connectStudent(id,d){
 if(busy.has(id)||sessions.has(id)||!d.clientOffer)return;
 const sid=d.clientOffer.sessionId||d.sessionId;if(!sid)return;
 busy.add(id);
 try{
  const ref=doc(db,"users",id);
  const pc=new RTCPeerConnection(rtcConfig);
  const s={pc,sessionId:sid,candidates:new Set(),unsubscribe:null,statsTimer:null,stream:null,receiving:false};
  sessions.set(id,s);
  setCardStatus(id,"connecting","연결 중");

  pc.ontrack=e=>{
   const stream=e.streams&&e.streams[0];
   if(!stream)return;
   s.stream=stream;
   setVideo(id,stream);
   const tracks=stream.getVideoTracks();
   for(const track of tracks){track.onended=()=>{s.receiving=false;markError(id,"영상 공유 종료")}}
   if(selectedId===id){document.getElementById("bigVideo").srcObject=stream;document.getElementById("bigVideo").play().catch(()=>{})}
   setTimeout(()=>verifyInbound(id),500);
  };

  pc.onicecandidate=async e=>{
   if(!e.candidate)return;
   try{await updateDoc(ref,{adminCandidates:arrayUnion(e.candidate.toJSON()),updatedAt:serverTimestamp()})}catch(x){console.warn("[ADMIN] ICE",x)}
  };

  pc.onconnectionstatechange=()=>{
   const state=pc.connectionState;
   if(state==="connected"){
    setCardStatus(id,"waiting","영상 확인 중");
    if(selectedId===id)setViewerStatus("connecting","● 영상 확인 중");
    setTimeout(()=>verifyInbound(id),500);
   }else if(state==="connecting"||state==="new"){
    setCardStatus(id,"connecting","연결 중");
    if(selectedId===id)setViewerStatus("connecting","● 연결 중");
   }else if(state==="disconnected"){
    markError(id,"연결 끊김");
   }else if(state==="failed"){
    markError(id,"연결 실패");
   }else if(state==="closed"){
    markError(id,"연결 종료");
   }
  };

  await pc.setRemoteDescription(new RTCSessionDescription({type:d.clientOffer.type,sdp:d.clientOffer.sdp}));
  const answer=await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await updateDoc(ref,{sharing:true,sharingStartedAt:serverTimestamp(),adminAnswer:{type:answer.type,sdp:answer.sdp,sessionId:sid},adminCandidates:[],updatedAt:serverTimestamp()});

  s.unsubscribe=onSnapshot(ref,async snap=>{
   const x=snap.data();
   if(!x||!x.online||x.sessionId!==sid)return;
   if(!Array.isArray(x.adminCandidates)||!pc.currentRemoteDescription)return;
   for(const q of x.adminCandidates){
    const key=JSON.stringify(q);if(s.candidates.has(key))continue;
    try{await pc.addIceCandidate(new RTCIceCandidate(q));s.candidates.add(key)}catch(e){console.warn("[ADMIN] candidate",e)}
   }
  });
  s.statsTimer=setInterval(()=>verifyInbound(id),3000);
 }catch(e){
  console.error("[ADMIN] 연결 실패",id,e);
  markError(id,"연결 실패");
  await stopSession(id,false);
 }finally{busy.delete(id)}
}

function openViewer(id){
 const s=sessions.get(id);if(!s)return;
 selectedId=id;
 const c=findCard(id);const name=c?.querySelector(".name")?.textContent||id;
 const title=document.getElementById("viewerTitle");title.textContent=name+" ";
 const badge=document.createElement("span");badge.className="viewer-status "+(s.receiving?"live":"connecting");badge.textContent=s.receiving?"● LIVE":"● 연결 확인 중";title.appendChild(badge);
 document.getElementById("bigVideo").srcObject=s.stream||null;
 document.getElementById("bigVideo").play().catch(()=>{});
 document.getElementById("viewer").style.display="flex";
 verifyInbound(id);
}
function closeViewer(){document.getElementById("viewer").style.display="none";document.getElementById("bigVideo").srcObject=null;selectedId=null}

document.getElementById("closeViewer").onclick=closeViewer;
document.getElementById("viewer").onclick=e=>{if(e.target.id==="viewer")closeViewer()};
document.onkeydown=e=>{if(e.key==="Escape")closeViewer()};
document.getElementById("back").onclick=()=>location.href="/admin/index.html";

function renderEmpty(){const g=document.getElementById("grid");if(!g.children.length)g.innerHTML='<div class="empty">현재 접속 중인 학생이 없습니다.</div>'}

function loadUsers(){
 onSnapshot(collection(db,"users"),snap=>{
  const g=document.getElementById("grid");const seen=new Set();let online=0;
  for(const u of snap.docs){
   const id=u.id;if(id===adminId)continue;
   const d=u.data();if(d.online!==true)continue;
   online++;seen.add(id);
   if(!findCard(id)){g.querySelector(".empty")?.remove();g.appendChild(makeCard(id,d))}
   if(!sessions.has(id)&&d.clientOffer)connectStudent(id,d);
  }
  for(const id of [...sessions.keys()])if(!seen.has(id))stopSession(id,true);
  g.querySelectorAll(".cctv").forEach(c=>{if(!seen.has(c.dataset.id))c.remove()});
  document.getElementById("online").textContent=`🟢 접속 ${online}명`;
  renderEmpty();
 },e=>console.error("[ADMIN] users snapshot",e));
}

(async()=>{
 try{
  const s=await getDoc(doc(db,"users",adminId));
  if(!s.exists()||!["president","vice"].includes(s.data().role)){alert("관리자만 접근 가능합니다.");location.href="/";return}
  loadUsers();
 }catch(e){console.error("[ADMIN] 초기화 실패",e);alert("화면 모니터링을 불러오지 못했습니다. 콘솔을 확인해주세요.")}
})();
</script>
</body>
</html>
