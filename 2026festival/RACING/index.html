<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RACING</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050708;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;top:14px;left:14px;right:14px;z-index:5;display:flex;justify-content:space-between;pointer-events:none}.readout{min-width:105px;padding:8px 12px;border-radius:10px;background:#050708b8;border:1px solid #ffffff18}.readout span{display:block;font-size:10px;letter-spacing:1.5px;color:#9ba5a8}.readout strong{font-size:20px}.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#0008}.panel{width:min(430px,calc(100% - 32px));padding:35px;text-align:center;border-radius:24px;background:#0b1110f2;box-shadow:0 30px 100px #000}.panel h1{font-size:58px;letter-spacing:5px;margin:0}.panel p{color:#b9c1c2;line-height:1.7}.start{border:0;padding:14px 30px;border-radius:12px;background:#24c46a;color:white;font-size:17px;font-weight:900}.hide{display:none}.controls{position:fixed;z-index:7;left:16px;right:16px;bottom:18px;display:flex;justify-content:space-between;pointer-events:none}.cluster{display:flex;gap:9px}.control{pointer-events:auto;width:64px;height:58px;border:1px solid #ffffff2b;border-radius:15px;background:#080b0ccc;color:#fff;font-weight:900;font-size:23px}.pedal{width:74px;font-size:11px}@media(min-width:800px){.controls{opacity:.35}.controls:hover{opacity:1}}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="readout"><span>SPEED</span><strong><b id="speed">0</b> km/h</strong></div><div class="readout"><span>OVERTAKEN</span><strong><b id="passed">0</b></strong></div><div class="readout"><span>DISTANCE</span><strong><b id="distance">0.00</b> km</strong></div></div><div class="screen" id="startScreen"><div class="panel"><h1>RACING</h1><p>운전석에서 자유롭게 조향하세요.<br><b>W / ↑</b> 가속 · <b>S / ↓</b> 브레이크<br><b>A / D</b> 자유 조향 · <b>SPACE</b> 니트로</p><button class="start" onclick="startGame()">START ENGINE</button></div></div><div class="screen hide" id="crashScreen"><div class="panel"><h1>CRASH</h1><p><b id="resultPassed">0</b>대 추월 · <b id="resultDistance">0.00</b> km</p><button class="start" onclick="startGame()">RESTART</button></div></div><div class="controls"><div class="cluster"><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div><div class="cluster"><button class="control pedal" id="brake">BRAKE</button><button class="control pedal" id="gas">GAS</button><button class="control" id="nitro">⚡</button></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,DPR=1,running=false,last=0,time=0,speed=0,distance=0,passed=0,carX=0,steer=0,throttle=0,brake=0,nitro=0,curve=0,curveTarget=0,roadTravel=0,spawnClock=0,traffic=[];const keys={};
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);function bind(id,code){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[code]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[code]=false}bind('left','ArrowLeft');bind('right','ArrowRight');bind('gas','ArrowUp');bind('brake','ArrowDown');bind('nitro','Space');
function startGame(){running=true;last=performance.now();time=0;speed=0;distance=0;passed=0;carX=0;steer=0;throttle=0;brake=0;nitro=0;curve=0;curveTarget=0;roadTravel=0;spawnClock=.8;traffic=[];document.getElementById('startScreen').classList.add('hide');document.getElementById('crashScreen').classList.add('hide');requestAnimationFrame(loop)}function crash(){running=false;document.getElementById('resultPassed').textContent=passed;document.getElementById('resultDistance').textContent=distance.toFixed(2);document.getElementById('crashScreen').classList.remove('hide')}
function roadAt(z){let p=clamp(z,0,1),f=Math.pow(p,1.7),h=H*.36,g=H*.91,w=lerp(W*.045,W*.94,f),cx=W/2+curve*f*f*W*.19;return{p,f,y:lerp(h,g,f),w,cx}}
function spawnTraffic(){// Always place traffic on one of three proper lanes. Different speeds create natural overtaking opportunities.
 let lane=[-.66,0,.66][Math.floor(Math.random()*3)];let base=[135,165,195,225,255][Math.floor(Math.random()*5)];traffic.push({lane,x:lane,z:0.02,speed:base/330,color:['#d94141','#2979d8','#f0bd3d','#ededed','#7d55c7'][Math.floor(Math.random()*5)],passed:false})}
function carShape(cx,cy,s,color){let w=68*s,h=112*s;ctx.save();ctx.translate(cx,cy);ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,h*.45,w*.64,8*s,0,0,7);ctx.fill();ctx.fillStyle='#101214';ctx.fillRect(-w*.56,-h*.12,w*.16,h*.48);ctx.fillRect(w*.40,-h*.12,w*.16,h*.48);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,9*s);ctx.fill();ctx.fillStyle='#17262d';ctx.beginPath();ctx.roundRect(-w*.32,-h*.34,w*.64,h*.27,7*s);ctx.fill();ctx.fillStyle='#bfe9f5';ctx.globalAlpha=.75;ctx.fillRect(-w*.24,-h*.27,w*.48,h*.10);ctx.globalAlpha=1;ctx.fillStyle='#fff2b0';ctx.fillRect(-w*.34,h*.27,w*.18,5*s);ctx.fillRect(w*.16,h*.27,w*.18,5*s);ctx.restore()}
function drawRoad(){let sky=ctx.createLinearGradient(0,0,0,H*.5);sky.addColorStop(0,'#091421');sky.addColorStop(.55,'#40647b');sky.addColorStop(1,'#9eb29a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#274b42';ctx.fillRect(0,H*.42,W,H*.58);let far=roadAt(0),near=roadAt(1);ctx.fillStyle='#292b2d';ctx.beginPath();ctx.moveTo(far.cx-far.w/2,far.y);ctx.lineTo(far.cx+far.w/2,far.y);ctx.lineTo(near.cx+near.w/2,near.y);ctx.lineTo(near.cx-near.w/2,near.y);ctx.closePath();ctx.fill();ctx.strokeStyle='#f4f0d7';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(far.cx-far.w/2,far.y);ctx.lineTo(near.cx-near.w/2,near.y);ctx.moveTo(far.cx+far.w/2,far.y);ctx.lineTo(near.cx+near.w/2,near.y);ctx.stroke();
 for(let lane of[-.33,.33])for(let i=0;i<13;i++){let z=(i/13+roadTravel*1.25)%1,z2=Math.min(1,z+.035+z*.05),a=roadAt(z),b=roadAt(z2);ctx.strokeStyle='#ffffffb5';ctx.lineWidth=3+z*3;ctx.beginPath();ctx.moveTo(a.cx+a.w*lane,a.y);ctx.lineTo(b.cx+b.w*lane,b.y);ctx.stroke()}
 for(let i=0;i<18;i++){let z=(i/18+roadTravel*.72)%1,p=roadAt(z),s=.12+z*.9;for(let side of[-1,1]){let xx=p.cx+side*(p.w/2+W*.035*s);ctx.fillStyle='#172c22';ctx.beginPath();ctx.arc(xx,p.y-42*s,18*s,0,7);ctx.fill();ctx.fillStyle='#85827a';ctx.fillRect(xx-2*s,p.y-25*s,4*s,25*s)}}
 traffic.slice().sort((a,b)=>a.z-b.z).forEach(v=>{let p=roadAt(v.z),s=.1+v.z*.95,xx=p.cx+(v.x-carX)*p.w*.42;carShape(xx,p.y,s,v.color)})}
function cockpit(){ctx.fillStyle='#0b1011';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H*.89);ctx.quadraticCurveTo(W*.5,H*.78,W,H*.89);ctx.lineTo(W,H);ctx.closePath();ctx.fill();let r=Math.min(W,H)*.09,wx=W*.5+steer*W*.035,wy=H*.94;ctx.strokeStyle='#060808';ctx.lineWidth=Math.max(10,W*.018);ctx.beginPath();ctx.arc(wx,wy,r,0,7);ctx.stroke();ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(wx,wy);ctx.lineTo(wx,wy+r*.75);ctx.moveTo(wx,wy);ctx.lineTo(wx-r*.62,wy+r*.45);ctx.moveTo(wx,wy);ctx.lineTo(wx+r*.62,wy+r*.45);ctx.stroke();ctx.fillStyle='#070b0c';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W*.055,0);ctx.lineTo(W*.12,H*.72);ctx.lineTo(0,H*.8);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W*.945,0);ctx.lineTo(W*.88,H*.72);ctx.lineTo(W,H*.8);ctx.closePath();ctx.fill()}
function update(dt){let gas=keys.ArrowUp||keys.KeyW,br=keys.ArrowDown||keys.KeyS,left=keys.ArrowLeft||keys.KeyA,right=keys.ArrowRight||keys.KeyD,dir=(right?1:0)-(left?1:0);throttle=lerp(throttle,gas?1:0,dt*(gas?8:3));brake=lerp(brake,br?1:0,dt*10);nitro=lerp(nitro,keys.Space?1:0,dt*8);let target=35+throttle*250-brake*190+nitro*160;speed=lerp(speed,clamp(target,0,420),1-Math.pow(.00001,dt));steer=lerp(steer,dir,1-Math.pow(.00005,dt));carX=clamp(carX+steer*dt*(.34+speed/330),-1.08,1.08);curveTarget=Math.sin(time*.035)*.75+Math.sin(time*.017+1.8)*.3;curve=lerp(curve,curveTarget,dt*.2);roadTravel+=speed*dt/900;distance+=speed*dt/3600;spawnClock-=dt;if(spawnClock<=0){spawnTraffic();spawnClock=clamp(1.2-speed/500,.42,1)}
 traffic.forEach(v=>{let relative=(speed/300)-(v.speed);v.z+=dt*relative*.48});for(let v of traffic){if(!v.passed&&v.z>.98){v.passed=true;passed++}if(v.z>.72&&v.z<1.02&&Math.abs(v.x-carX)<.22){crash();return}}traffic=traffic.filter(v=>v.z<1.08&&v.z>-.12);time+=dt}
function loop(t){if(!running)return;let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);drawRoad();cockpit();document.getElementById('speed').textContent=Math.round(speed);document.getElementById('passed').textContent=passed;document.getElementById('distance').textContent=distance.toFixed(2);requestAnimationFrame(loop)}drawRoad();cockpit();
</script></body></html>
