<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>키 반응 대결 | MINI GAME</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#071b12,#123b27);color:#fff;display:flex;align-items:center;justify-content:center}.wrap{width:min(900px,94vw);text-align:center;padding:24px}.top{display:flex;justify-content:space-between;opacity:.75}.title{font-size:clamp(32px,6vw,52px);font-weight:900;margin:12px}.timer{font-size:34px;font-weight:900}.score{display:flex;justify-content:center;gap:50px;font-size:19px;font-weight:800}.score span{display:block;font-size:46px}.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-top:20px}.turn{align-self:center;min-width:110px;padding:14px 10px;border:1px solid rgba(150,255,190,.22);border-radius:18px;background:rgba(83,232,138,.08);font-size:13px;color:#c8f5d6}.turn strong{display:block;font-size:17px;color:#53e88a;margin-top:6px}.side{padding:28px 18px;border-radius:26px;background:rgba(255,255,255,.07)}.side h2{margin:0 0 18px}.target{width:min(190px,32vw);height:min(190px,32vw);min-width:120px;min-height:120px;margin:0 auto 20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,8vw,72px);font-weight:900;box-shadow:0 0 25px rgba(255,255,255,.18);user-select:none}.green{background:#27ae60}.red{background:#e74c3c}.hint{min-height:28px;color:#b9d9c5}.result{font-size:30px;font-weight:900;margin:22px 0;min-height:45px}.result small{display:block;font-size:14px;opacity:.7;margin:7px}.done{border:0;border-radius:14px;padding:14px 28px;background:#1ea857;color:#fff;font-weight:800;font-size:17px;cursor:pointer}.note{font-size:13px;color:#ffd98a;margin-top:9px}.hidden{display:none!important}@media(max-width:650px){.arena{gap:8px}.side{padding:20px 8px}.target{min-width:105px;min-height:105px}}
/* Shared MINI GAME visual refresh */
:root{color-scheme:dark;--mg-bg:#07110d;--mg-panel:rgba(14,35,25,.88);--mg-line:rgba(150,255,190,.18);--mg-green:#53e88a;--mg-mint:#b9ffd2}body{background:radial-gradient(ellipse at 12% 0%,#17442c 0%,transparent 42%),radial-gradient(ellipse at 100% 100%,#102d20 0%,transparent 45%),#050b08!important;color:#f3fff6!important;font-family:Inter,'Noto Sans KR',Arial,sans-serif!important}h1,h2,h3,.title,.logo{letter-spacing:-.035em}h1{ text-shadow:0 5px 28px rgba(83,232,138,.12)}button,.btn,.next,.setbtn{font-family:inherit!important;transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease!important}button:hover,.btn:hover,.next:hover,.setbtn:hover{transform:translateY(-2px);box-shadow:0 8px 24px #0005}button:focus-visible,.btn:focus-visible,.next:focus-visible,.setbtn:focus-visible{outline:2px solid var(--mg-green);outline-offset:3px}.wrap{position:relative}.arena,.setting,.summary,.history,.board,canvas,.card{box-shadow:0 18px 48px #0003}canvas{border:1px solid var(--mg-line);box-shadow:0 0 0 5px #ffffff05,0 20px 55px #0005}p{line-height:1.65}.muted,.desc,.sub{color:#b8cdbf}
</style></head><body><div class="wrap"><div class="top"><span id="round"></span><span id="mode"></span></div><div class="title">⚡ 키 반응 대결</div><div class="timer" id="timer">10.0</div><div class="score"><div><span id="meLabel">플레이어</span><span id="me">0</span></div><div><span id="oppLabel">컴퓨터</span><span id="opp">0</span></div></div><div class="arena"><div class="side"><h2 id="playerHeading">플레이어</h2><div class="target green" id="green">W</div><div class="hint">표시된 키를 WASD 또는 방향키로 입력</div></div><div class="turn">이번 라운드 선공<strong id="firstTurn">확인 중</strong></div><div class="side"><h2 id="computerHeading">컴퓨터</h2><div class="target red" id="red">↑</div><div class="hint">컴퓨터가 반응할 목표 키</div></div></div><div class="note hidden" id="note">온라인 상대 입력은 연결 후 반영됩니다.</div><div class="result" id="result"></div><button class="done hidden" id="done">결과 확인 →</button></div><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu',modeName:'컴퓨터와 대전'};const mode=s.mode||'cpu';let me=0,opp=0,playing=true,start=performance.now(),ai=null;const g=document.getElementById('green'),r=document.getElementById('red');const wasd=['w','a','s','d'],arrows=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'],arrowText={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'};let playerTarget='w',firstIsPlayer=Math.random()<.5;document.getElementById('firstTurn').textContent=mode==='local'?(firstIsPlayer?'1P':'2P'):(firstIsPlayer?'플레이어':'컴퓨터');if(mode==='local'){document.getElementById('meLabel').textContent='1P';document.getElementById('oppLabel').textContent='2P';document.getElementById('playerHeading').textContent='1P';document.getElementById('computerHeading').textContent='2P'}document.getElementById('mode').textContent=s.modeName||'컴퓨터와 대전';document.getElementById('round').textContent=s.round?`${s.round}번째 게임`:'';if(mode==='online')document.getElementById('note').classList.remove('hidden');function randomize(){playerTarget=wasd[Math.floor(Math.random()*4)];g.textContent=playerTarget.toUpperCase();const k=arrows[Math.floor(Math.random()*4)];r.dataset.key=k;r.textContent=arrowText[k]}
function isPlayerMatch(e){const k=e.key.toLowerCase();const alias={w:'ArrowUp',a:'ArrowLeft',s:'ArrowDown',d:'ArrowRight'};return k===playerTarget||e.key===alias[playerTarget]||({'ArrowUp':'w','ArrowLeft':'a','ArrowDown':'s','ArrowRight':'d'}[e.key]===playerTarget)}function score(w){if(!playing)return;if(w==='me')me++;else opp++;document.getElementById(w==='me'?'me':'opp').textContent=w==='me'?me:opp;randomize()}function key(e){if(!playing)return;if(isPlayerMatch(e))score('me');if(mode==='local'&&arrows.includes(e.key)&&e.key===r.dataset.key)score('opp')}document.addEventListener('keydown',key);function cpu(){if(!playing)return;score('opp');ai=setTimeout(cpu,500+Math.random()*550)}if(mode==='cpu')ai=setTimeout(cpu,firstIsPlayer?850+Math.random()*350:250+Math.random()*250);function tick(){if(!playing)return;const t=Math.max(0,10-(performance.now()-start)/1000);document.getElementById('timer').textContent=t.toFixed(1);if(t<=0){finish();return}requestAnimationFrame(tick)}function finish(){if(!playing)return;playing=false;clearTimeout(ai);const w=me>opp?'me':me<opp?'opp':'draw';document.getElementById('result').innerHTML=(w==='me'?'승리':w==='opp'?'패배':'무승부')+`<small>최종 점수 ${me} : ${opp}</small>`;document.getElementById('done').classList.remove('hidden');localStorage.setItem('miniGameResult',JSON.stringify({game:'⚡ 키 반응 대결',winner:w,me,opp}))}document.getElementById('done').onclick=()=>location.href='../index.html';randomize();requestAnimationFrame(tick);</script></body></html>
