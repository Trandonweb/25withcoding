<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장애물 슈팅</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#071b12,#123b27);color:white;font-family:Arial,'Noto Sans KR',sans-serif;display:grid;place-items:center;padding:16px}.wrap{width:min(850px,100%);text-align:center}canvas{width:100%;background:#07100b;border-radius:14px;touch-action:manipulation}.btn{padding:12px 18px;border:0;border-radius:10px;background:#1ea857;color:white;font-weight:bold;cursor:pointer;margin:5px}.hidden{display:none}.muted{color:#b7cbb9}</style></head><body><main class="wrap"><div id="round"></div><div id="mode"></div><h1>🚀 장애물 슈팅</h1><p>자동으로 위아래로 움직이며 발사! 먼저 네 번 맞으면 패배.</p><canvas id="arena" width="800" height="420"></canvas><h2>나 <span id="hits1">0</span>/4　—　상대 <span id="hits2">0</span>/4</h2><button class="btn" id="up">▲ 위</button><button class="btn" id="fire">발사 SPACE</button><button class="btn" id="down">▼ 아래</button><h3 id="message">W/S 또는 ↑/↓ 이동, Space 발사</h3><button class="btn hidden" id="done">결과 확인 →</button><p class="muted">1대1: W/S + Space 대 방향키 + Enter. 컴퓨터 상대는 자동 조작.</p></main><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu'};document.getElementById('mode').textContent=s.modeName||'컴퓨터와 대전';document.getElementById('round').textContent=s.round?s.round+'번째 게임':'';const cv=document.getElementById('arena'),ctx=cv.getContext('2d'),mode=s.mode||'cpu';let y1=210,y2=210,h1=0,h2=0,bullets=[],obstacles=[],tick=0,playing=true;function fire(p){if(playing)bullets.push({x:p===1?135:665,y:p===1?y1:y2,v:p===1?7:-7,p})}function move(p,d){if(p===1)y1=Math.max(25,Math.min(395,y1+d));else if(mode==='local')y2=Math.max(25,Math.min(395,y2+d))}function end(w){if(!playing)return;playing=false;localStorage.setItem('miniGameResult',JSON.stringify({game:'🚀 장애물 슈팅',winner:w,me:4-h1,opp:4-h2}));document.getElementById('message').textContent=w==='me'?'🎉 승리!':'상대 승리!';document.getElementById('done').classList.remove('hidden')}function frame(){if(!playing)return;tick++;y1+=Math.sin(tick/17)*2.4;if(mode==='cpu')y2+=Math.sin(tick/23)*2.8;else if(mode==='local')y2+=Math.sin(tick/19)*1.5;if(tick%80===0){let gap=45+Math.random()*330;obstacles.push({x:400,w:24,y:Math.max(15,Math.min(350,gap)),h:55+Math.random()*70})}if(mode==='cpu'&&tick%48===0)fire(2);bullets.forEach(b=>b.x+=b.v);obstacles.forEach(o=>o.x-=2.5);bullets=bullets.filter(b=>b.x>-10&&b.x<810);obstacles=obstacles.filter(o=>o.x+o.w>0);for(const b of bullets){if(b.p===1&&Math.abs(b.x-665)<16&&Math.abs(b.y-y2)<25){h2++;b.x=900;document.getElementById('hits2').textContent=h2;if(h2>=4)end('me')}if(b.p===2&&Math.abs(b.x-135)<16&&Math.abs(b.y-y1)<25){h1++;b.x=-100;document.getElementById('hits1').textContent=h1;if(h1>=4)end('opp')}}ctx.clearRect(0,0,800,420);ctx.fillStyle='#102519';ctx.fillRect(0,0,800,420);ctx.strokeStyle='#254b31';ctx.setLineDash([7,9]);ctx.beginPath();ctx.moveTo(400,0);ctx.lineTo(400,420);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#53e88a';ctx.fillRect(105,y1-18,30,36);ctx.fillStyle='#ffcf67';ctx.fillRect(665,y2-18,30,36);ctx.fillStyle='#eafcef';for(const b of bullets)ctx.fillRect(b.x,b.y-3,12,6);ctx.fillStyle='#e35d65';for(const o of obstacles){ctx.fillRect(o.x,0,o.w,o.y);ctx.fillRect(o.x,o.y+o.h,o.w,420-o.y-o.h)}if(playing)requestAnimationFrame(frame)}document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key.toLowerCase()==='w')move(1,-22);if(e.key.toLowerCase()==='s')move(1,22);if(e.key==='ArrowUp')move(2,-22);if(e.key==='ArrowDown')move(2,22);if(e.code==='Space'){e.preventDefault();fire(1)}if(e.key==='Enter'&&mode==='local')fire(2)});document.getElementById('up').onclick=()=>move(1,-24);document.getElementById('down').onclick=()=>move(1,24);document.getElementById('fire').onclick=()=>fire(1);document.getElementById('done').onclick=()=>location.href='../index.html';if(mode==='local')document.getElementById('message').textContent='나: W/S + Space　상대: ↑/↓ + Enter';requestAnimationFrame(frame);</script></main></body></html>
