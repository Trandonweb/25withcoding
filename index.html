<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코딩과 함께라면</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#27ae60">
  <link rel="apple-touch-icon" href="/2025/logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root { --bg-color:#F0F0F0; --card-bg:#ffffff; --text-color:#111111; --header-bg:#F0F0F0; --border-color:var(--primary-color,#27ae60); --header-text:var(--primary-color,#27ae60); --card-hover-bg:color-mix(in srgb,var(--primary-color) 8%,white); --btn-bg:#e0e0e0; --btn-text:#333333; --btn-hover:#d0d0d0; --primary-color:#27ae60; --input-bg:#f8fafc; --input-border:#e1e8ed; }
    body.dark-mode { --bg-color:#121212; --card-bg:#1E1E1E; --text-color:#FFFFFF; --header-bg:#121212; --border-color:var(--primary-color); --header-text:var(--primary-color); --card-hover-bg:color-mix(in srgb,var(--primary-color) 15%,#1E1E1E); --btn-bg:#2C2C2C; --btn-text:#FFFFFF; --btn-hover:#3A3A3A; --input-bg:#2A2A2A; --input-border:#444444; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:var(--bg-color); color:var(--text-color); display:flex; flex-direction:column; align-items:center; min-height:100vh; transition:background .2s,color .2s; }
    header { position:relative; width:100%; padding:22px; background:var(--header-bg); color:var(--header-text); text-align:center; font-size:26px; font-weight:bold; border-bottom:3px solid var(--border-color); box-shadow:0 2px 10px rgba(0,0,0,.08); letter-spacing:1px; }
    .header-left { position:absolute; left:20px; top:16px; display:flex; gap:10px; }
    .header-btn,.auth-btn { border:none; border-radius:10px; padding:10px 15px; cursor:pointer; font-size:14px; font-weight:bold; }
    .header-btn { background:var(--btn-bg); color:var(--btn-text); transition:background .2s; }
    .header-btn:hover { background:var(--btn-hover); }
    #adminBtn,#noticeBtn,#mirrorBtn { display:none; }
    .auth-btn { position:absolute; right:20px; top:16px; background:var(--primary-color); color:white; transition:filter .2s; }
    .auth-btn:hover { filter:brightness(.9); }
    .container { margin-top:40px; width:90%; max-width:600px; }
    .card { background:var(--card-bg); padding:22px; margin:18px 0; border-radius:18px; cursor:pointer; transition:transform .2s,background .2s,border .2s; border:2px solid var(--border-color); box-shadow:0 4px 12px rgba(0,0,0,.08); text-align:center; font-size:18px; font-weight:bold; color:var(--text-color); }
    .card:hover { transform:scale(1.03); background:var(--card-hover-bg); }
    .coby-card { display:flex; align-items:center; justify-content:center; gap:10px; height:69px; padding:10px 22px; text-decoration:none; }
    .coby-title { display:block; width:190px; height:45px; overflow:hidden; border-radius:10px; flex:0 0 190px; font-size:0; line-height:0; border:0; }
    .coby-beta { display:inline-flex; align-items:center; justify-content:center; padding:4px 9px; border-radius:999px; background:var(--primary-color); color:#fff; font-size:10px; line-height:1; font-weight:800; letter-spacing:.5px; }
    .coby-logo { width:100%; height:100%; display:block; object-fit:cover; object-position:center; pointer-events:none; user-select:none; }
    .footer { margin-top:auto; padding:20px; color:#777; font-size:13px; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; justify-content:center; align-items:center; z-index:1000; opacity:0; visibility:hidden; transition:opacity .3s ease,visibility .3s ease; }
    .modal-overlay.active { opacity:1; visibility:visible; }
    .modal-content { background:var(--card-bg); color:var(--text-color); width:90%; max-width:450px; border-radius:20px; padding:24px; box-shadow:0 8px 24px rgba(0,0,0,.2); border:2px solid var(--border-color); max-height:85vh; overflow-y:auto; transform:translateY(20px); transition:transform .3s ease; }
    .modal-overlay.active .modal-content { transform:translateY(0); }
    .modal-header { display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--border-color); padding-bottom:12px; margin-bottom:20px; font-size:20px; font-weight:bold; }
    .modal-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--text-color); }
    .setting-item { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid rgba(0,0,0,.1); }
    .setting-info { display:flex; flex-direction:column; gap:4px; }
    .setting-title { font-size:16px; font-weight:bold; }
    .setting-desc { font-size:12px; color:#888; }
    .switch { position:relative; display:inline-block; width:50px; height:26px; flex-shrink:0; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; cursor:pointer; inset:0; background-color:#ccc; transition:.3s; border-radius:26px; }
    .slider:before { position:absolute; content:""; height:20px; width:20px; left:3px; bottom:3px; background-color:white; transition:.3s; border-radius:50%; }
    input:checked + .slider { background-color:var(--primary-color); }
    input:checked + .slider:before { transform:translateX(24px); }
    .color-picker-group { display:flex; gap:8px; }
    .color-circle { width:26px; height:26px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition:transform .2s,border-color .2s; }
    .color-circle:hover { transform:scale(1.1); }
    .color-circle.selected { border-color:#111; transform:scale(1.15); box-shadow:0 0 0 2px var(--card-bg),0 0 6px rgba(0,0,0,.3); }
    body.dark-mode .color-circle.selected { border-color:#fff; box-shadow:0 0 0 2px var(--card-bg),0 0 6px rgba(255,255,255,.4); }
    .password-setting { display:block; }
    .password-toggle { width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border:none; background:none; color:var(--text-color); text-align:left; cursor:pointer; }
    .password-toggle .setting-info { margin:0; }
    .password-toggle-icon { font-size:18px; transition:transform .2s ease; flex-shrink:0; }
    .password-setting.open .password-toggle-icon { transform:rotate(180deg); }
    .password-form { display:none; flex-direction:column; gap:9px; padding-bottom:4px; }
    .password-setting.open .password-form { display:flex; }
    .password-input { width:100%; padding:12px 14px; border:1px solid var(--input-border); border-radius:12px; background:var(--input-bg); color:var(--text-color); font-size:14px; outline:none; }
    .password-input:focus { border-color:var(--primary-color); }
    .password-change-btn { width:100%; padding:12px; margin-top:3px; border:none; border-radius:12px; background:var(--primary-color); color:white; font-weight:bold; cursor:pointer; transition:filter .2s; }
    .password-change-btn:hover { filter:brightness(.9); }
    .password-change-btn:disabled { opacity:.6; cursor:default; }
    .badge-disabled { font-size:11px; background:#ccc; color:#666; padding:3px 8px; border-radius:6px; font-weight:bold; }
    @media (max-width:600px) { header{padding:58px 20px 20px;font-size:22px;} .header-left{top:12px;left:12px;} .auth-btn{top:12px;right:12px;} .header-btn,.auth-btn{padding:8px 11px;font-size:12px;} .container{margin-top:25px;} .card{margin:14px 0;padding:19px;} .coby-card{height:63px;padding:8px 19px;} .coby-title{width:135px;height:43px;flex-basis:135px;} }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <button id="adminBtn" class="header-btn" onclick="location.href='/admin'">관리자</button>
      <button id="noticeBtn" class="header-btn" onclick="location.href='/안내사항/'">공지</button>
      <button id="mirrorBtn" class="header-btn" onclick="location.href='/admin/mirroring/client.html'">화면공유</button>
      <button id="settingsBtn" class="header-btn" onclick="openSettingsModal()">설정</button>
    </div>
    코딩과 함께라면
    <button id="authBtn" class="auth-btn">로그인</button>
  </header>
  <div class="container">
    <div class="card" onclick="go('/2026festival/')">🎉 2026 Festival</div>
    <div class="card" onclick="go('/2025/')">2025 기념관</div>
    <div class="card" onclick="go('/memo/')">저장 공간</div>
    <div class="card" onclick="goPoint()">상벌점</div>
    <div class="card" onclick="go('/NOTE/')">설명용 노트</div>
    <a class="card coby-card" href="/AI"><span class="coby-title"><img class="coby-logo" id="cobyLogo" src="/AI/COBY_AI_logo.png" alt="COBY AI"></span><span class="coby-beta">BETA</span></a>
  </div>
  <div class="footer">2026 코딩과함께라면 | SINCE 2025</div>
  <div id="settingsModal" class="modal-overlay" onclick="handleModalOutsideClick(event)">
    <div class="modal-content">
      <div class="modal-header"><span>환경 설정</span><button class="modal-close" onclick="closeSettingsModal()">&times;</button></div>
      <div class="setting-item"><div class="setting-info"><span class="setting-title">다크 모드</span><span class="setting-desc">화면을 어둡게 표시합니다.</span></div><label class="switch"><input type="checkbox" id="darkModeToggle" onchange="toggleSetting('darkMode', this.checked)"><span class="slider"></span></label></div>
      <div class="setting-item"><div class="setting-info"><span class="setting-title">포인트 컬러 테마</span><span class="setting-desc">사이트의 대표 색상을 변경합니다.</span></div><div class="color-picker-group"><div class="color-circle" style="background:#27ae60;" onclick="changeThemeColor('#27ae60')" data-color="#27ae60"></div><div class="color-circle" style="background:#3498db;" onclick="changeThemeColor('#3498db')" data-color="#3498db"></div><div class="color-circle" style="background:#e84393;" onclick="changeThemeColor('#e84393')" data-color="#e84393"></div><div class="color-circle" style="background:#9b59b6;" onclick="changeThemeColor('#9b59b6')" data-color="#9b59b6"></div><div class="color-circle" style="background:#e74c3c;" onclick="changeThemeColor('#e74c3c')" data-color="#e74c3c"></div></div></div>
      <div class="setting-item"><div class="setting-info"><span class="setting-title">로그인 상태 유지</span><span class="setting-desc">브라우저 종료 후 재접속 시 로그인 유지합니다.</span></div><label class="switch"><input type="checkbox" id="keepLoginToggle" onchange="toggleSetting('keepLogin', this.checked)"><span class="slider"></span></label></div>
      <div class="setting-item password-setting" id="passwordSetting"><button type="button" class="password-toggle" onclick="togglePasswordForm()" aria-expanded="false" aria-controls="passwordForm"><span class="setting-info"><span class="setting-title">비밀번호 변경</span><span class="setting-desc">눌러서 비밀번호 변경</span></span><span class="password-toggle-icon">⌄</span></button><div class="password-form" id="passwordForm"><input class="password-input" id="currentPassword" type="password" autocomplete="current-password" placeholder="현재 비밀번호"><input class="password-input" id="newPassword" type="password" autocomplete="new-password" placeholder="새 비밀번호"><input class="password-input" id="confirmPassword" type="password" autocomplete="new-password" placeholder="새 비밀번호 확인"><button class="password-change-btn" id="passwordChangeBtn" onclick="changePassword()">비밀번호 변경</button></div></div>
    </div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    const firebaseConfig={apiKey:"AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",authDomain:"points2026-f5e50.firebaseapp.com",projectId:"points2026-f5e50"};
    const app=initializeApp(firebaseConfig); const db=getFirestore(app);
    const SETTINGS_KEY="coding_with_ramen_settings"; const COBY_LIGHT_LOGO="/AI/COBY_AI_logo.png"; const COBY_DARK_LOGO="/AI/COBY_AI_logo_dark_mode.png";
    const defaultSettings={darkMode:false,primaryColor:"#27ae60",keepLogin:true};
    function getStoredSettings(){const saved=localStorage.getItem(SETTINGS_KEY);if(saved){try{return {...defaultSettings,...JSON.parse(saved)}}catch(e){return {...defaultSettings}}}return {...defaultSettings}}
    function saveStoredSettings(settings){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}
    function removeLogoBackground(image,threshold=45){const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});if(!ctx)return null;canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;ctx.drawImage(image,0,0);const data=ctx.getImageData(0,0,canvas.width,canvas.height),pixels=data.data,corners=[[0,0],[canvas.width-1,0],[0,canvas.height-1],[canvas.width-1,canvas.height-1]],backgrounds=corners.map(([x,y])=>{const i=(y*canvas.width+x)*4;return [pixels[i],pixels[i+1],pixels[i+2]]});for(let i=0;i<pixels.length;i+=4){const r=pixels[i],g=pixels[i+1],b=pixels[i+2],isBackground=backgrounds.some(([br,bg,bb])=>Math.sqrt((r-br)**2+(g-bg)**2+(b-bb)**2)<=threshold);if(isBackground)pixels[i+3]=0}ctx.putImageData(data,0,0);return canvas.toDataURL("image/png")}
    function updateCobyLogo(darkMode){const logo=document.getElementById("cobyLogo");if(!logo)return;const target=darkMode?COBY_DARK_LOGO:COBY_LIGHT_LOGO;logo.dataset.source=target;const image=new Image();image.onload=()=>{if(darkMode){try{const processed=removeLogoBackground(image);if(processed){logo.src=processed;return}}catch(e){console.warn("COBY 로고 자동 배경제거 실패",e)}}logo.src=target};image.onerror=()=>{logo.src=target};image.src=target}
    function applySettings(settings){document.body.classList.toggle("dark-mode",!!settings.darkMode);if(settings.primaryColor)document.documentElement.style.setProperty("--primary-color",settings.primaryColor);document.querySelectorAll(".color-circle").forEach(circle=>circle.classList.toggle("selected",circle.getAttribute("data-color")===settings.primaryColor));updateCobyLogo(!!settings.darkMode)}
    function syncSettingsUI(){const settings=getStoredSettings();document.getElementById("darkModeToggle").checked=!!settings.darkMode;document.getElementById("keepLoginToggle").checked=!!settings.keepLogin;applySettings(settings)}
    window.toggleSetting=async function(key,value){const settings=getStoredSettings();settings[key]=value;saveStoredSettings(settings);applySettings(settings);const user=localStorage.getItem("userId");if(user){try{await setDoc(doc(db,"users",user),{settings:{[key]:value}},{merge:true})}catch(e){console.error("설정 동기화 실패",e)}}};
    window.changeThemeColor=async function(color){const settings=getStoredSettings();settings.primaryColor=color;saveStoredSettings(settings);applySettings(settings);const user=localStorage.getItem("userId");if(user){try{await setDoc(doc(db,"users",user),{settings:{primaryColor:color}},{merge:true})}catch(e){console.error("컬러 테마 동기화 실패",e)}}};
    applySettings(getStoredSettings());
    function go(path){location.href=path} window.go=go;
    function goPoint(){const user=localStorage.getItem("userId");location.href=user?"/상벌점/main.html":"/signin?redirect=/상벌점/main.html"} window.goPoint=goPoint;
    async function checkUserSettings(userId){const userRef=doc(db,"users",userId),snap=await getDoc(userRef);if(!snap.exists())return;const data=snap.data(),firebaseSettings=data.settings||{},settings={darkMode:firebaseSettings.darkMode??defaultSettings.darkMode,primaryColor:firebaseSettings.primaryColor??defaultSettings.primaryColor,keepLogin:firebaseSettings.keepLogin??defaultSettings.keepLogin},updateData={};if(firebaseSettings.darkMode===undefined)updateData.darkMode=settings.darkMode;if(firebaseSettings.primaryColor===undefined)updateData.primaryColor=settings.primaryColor;if(firebaseSettings.keepLogin===undefined)updateData.keepLogin=settings.keepLogin;if(Object.keys(updateData).length>0)await setDoc(userRef,{settings:updateData},{merge:true});saveStoredSettings(settings);applySettings(settings)}
    async function updateUI(){const user=localStorage.getItem("userId"),btn=document.getElementById("authBtn"),adminBtn=document.getElementById("adminBtn"),noticeBtn=document.getElementById("noticeBtn"),mirrorBtn=document.getElementById("mirrorBtn");adminBtn.style.display="none";noticeBtn.style.display="none";mirrorBtn.style.display="none";if(user){await checkUserSettings(user);try{const userSnap=await getDoc(doc(db,"users",user));if(userSnap.exists()){const userData=userSnap.data();if(userData.role==="president"){adminBtn.style.display="block";noticeBtn.style.display="block";}else{mirrorBtn.style.display="block";if(userData.role==="vice")adminBtn.style.display="block";}}}catch(e){console.error("권한 확인 실패",e)}}syncSettingsUI();if(user){btn.textContent=`${user} 로그아웃`;btn.onclick=()=>{location.href="/signout?redirect=/"}}else{btn.textContent="로그인";btn.onclick=()=>{location.href="/signin?redirect=/"}}}
    window.changePassword=async function(){const user=localStorage.getItem("userId");if(!user){alert("로그인 후 이용할 수 있습니다.");return}const currentPassword=document.getElementById("currentPassword").value,newPassword=document.getElementById("newPassword").value,confirmPassword=document.getElementById("confirmPassword").value,button=document.getElementById("passwordChangeBtn");if(!currentPassword||!newPassword||!confirmPassword){alert("현재 비밀번호와 새 비밀번호를 모두 입력하세요.");return}if(newPassword.length<6){alert("새 비밀번호는 6자 이상이어야 합니다.");return}if(newPassword!==confirmPassword){alert("새 비밀번호가 서로 일치하지 않습니다.");return}if(currentPassword===newPassword){alert("현재 비밀번호와 다른 비밀번호를 입력하세요.");return}button.disabled=true;button.textContent="확인 중...";try{const userRef=doc(db,"users",user),snap=await getDoc(userRef);if(!snap.exists()){alert("사용자 정보를 찾을 수 없습니다.");return}const data=snap.data();if(currentPassword!==data.password){alert("현재 비밀번호가 올바르지 않습니다.");return}await updateDoc(userRef,{password:newPassword});document.getElementById("currentPassword").value="";document.getElementById("newPassword").value="";document.getElementById("confirmPassword").value="";alert("비밀번호가 변경되었습니다.")}catch(e){console.error("비밀번호 변경 실패",e);alert("비밀번호 변경 중 오류가 발생했습니다.")}finally{button.disabled=false;button.textContent="비밀번호 변경"}};
    window.togglePasswordForm=function(){const setting=document.getElementById("passwordSetting"),toggle=setting.querySelector(".password-toggle"),isOpen=setting.classList.toggle("open");toggle.setAttribute("aria-expanded",String(isOpen))};
    updateUI();
    window.openSettingsModal=function(){syncSettingsUI();document.getElementById("settingsModal").classList.add("active")};
    window.closeSettingsModal=function(){document.getElementById("settingsModal").classList.remove("active")};
    window.handleModalOutsideClick=function(event){if(event.target===document.getElementById("settingsModal"))closeSettingsModal()};
  </script>
</body>
</html>
