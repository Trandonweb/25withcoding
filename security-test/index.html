<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>인증 연결 테스트</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color-scheme:light dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6f4;color:#17211b}
    main{width:min(92vw,520px);box-sizing:border-box;background:#fff;border:1px solid #dce6df;border-radius:20px;padding:24px;box-shadow:0 10px 36px #173b2512}
    h1{font-size:1.35rem;margin:0 0 8px}p{line-height:1.6;color:#526158}
    #status{padding:14px;border-radius:12px;background:#f1f5f2;margin:18px 0;font-weight:600}
    a,button{display:inline-block;border:0;border-radius:10px;padding:11px 14px;margin:4px 4px 4px 0;text-decoration:none;font:inherit;cursor:pointer}
    a{background:#23834a;color:white}button{background:#e4ebe6;color:#1d3024}
    small{display:block;margin-top:18px;color:#64746a;line-height:1.5}
    @media(prefers-color-scheme:dark){body{background:#111814;color:#e9f1eb}main{background:#1b251f;border-color:#33443a}p,small{color:#b2c1b6}#status{background:#26352b}}
  </style>
</head>
<body>
<main>
  <h1>인증 연결 테스트</h1>
  <p>이 페이지는 Firebase Authentication 로그인 세션만 확인합니다. 학생 정보, 상벌점, AI 데이터 또는 Firestore 문서를 읽거나 변경하지 않습니다.</p>
  <div id="status" role="status" aria-live="polite">인증 상태 확인 중…</div>
  <a href="/signin?redirect=%2Fsecurity-test%2F">로그인 페이지 열기</a>
  <button id="refresh" type="button">상태 다시 확인</button>
  <button id="logout" type="button">로그아웃 테스트</button>
  <small>참고: 인증 테스트 성공은 전체 사이트의 데이터 권한 검증이나 운영 재개 승인을 의미하지 않습니다.</small>
</main>
<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",
  authDomain: "points2026-f5e50.firebaseapp.com",
  projectId: "points2026-f5e50",
  storageBucket: "points2026-f5e50.firebasestorage.app",
  messagingSenderId: "248724251417",
  appId: "1:248724251417:web:02d85cdc4addac98069b88"
};
const app = getApps().find(item => item.name === "[DEFAULT]") || initializeApp(firebaseConfig);
const auth = getAuth(app);
const status = document.getElementById("status");

function render(user) {
  const match = (user?.email || "").match(/^(\d{5})@auth\.25withcoding\.kr$/i);
  if (user && match) {
    localStorage.setItem("userId", match[1]);
    localStorage.removeItem("firebaseIdToken");
    status.textContent = "성공: Firebase Authentication 세션이 확인되었습니다. (학번·토큰은 표시하지 않음)";
  } else {
    localStorage.removeItem("userId");
    localStorage.removeItem("firebaseIdToken");
    status.textContent = "로그아웃 상태입니다. 로그인 후 다시 확인해 주세요.";
  }
}
onAuthStateChanged(auth, render, error => {
  console.error("Auth 상태 확인 실패", error);
  status.textContent = "실패: 인증 상태를 확인하지 못했습니다. 네트워크와 Firebase 설정을 확인해 주세요.";
});
document.getElementById("refresh").addEventListener("click", async () => {
  status.textContent = "인증 상태 확인 중…";
  render(auth.currentUser);
});
document.getElementById("logout").addEventListener("click", async () => {
  try {
    await signOut(auth);
    localStorage.removeItem("userId");
    localStorage.removeItem("firebaseIdToken");
    status.textContent = "성공: 로그아웃되었습니다.";
  } catch (error) {
    console.error("로그아웃 테스트 실패", error);
    status.textContent = "실패: 로그아웃하지 못했습니다.";
  }
});
</script>
</body>
</html>
