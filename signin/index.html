<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>코딩과 함께라면_로그인</title>
  <style>
    :root {
      --bg-color: #f0f0f0;
      --card-bg: #ffffff;
      --text-color: #111111;
      --sub-text: #666666;
      --input-bg: #f8fafc;
      --input-border: #e1e8ed;
      --input-focus-bg: #ffffff;
      --primary-color: #27ae60;
      --btn-bg: var(--primary-color);
      --btn-hover: color-mix(in srgb, var(--primary-color) 85%, black);
      --btn-text: #ffffff;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1E1E1E;
      --text-color: #FFFFFF;
      --sub-text: #AAAAAA;
      --input-bg: #2A2A2A;
      --input-border: #333333;
      --input-focus-bg: #1E1E1E;
      --btn-bg: var(--primary-color);
      --btn-hover: color-mix(in srgb, var(--primary-color) 85%, black);
      --btn-text: #FFFFFF;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Malgun Gothic', sans-serif;
      transition: background 0.2s, color 0.2s;
    }

    .card {
      background: var(--card-bg);
      color: var(--text-color);
      padding: 35px 30px;
      border-radius: 24px;
      text-align: center;
      width: 320px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--input-border);
      transition: background 0.2s, border 0.2s;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: var(--text-color);
    }

    h2 {
      font-size: 14px;
      margin-bottom: 25px;
      color: var(--sub-text);
      font-weight: normal;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      margin: 8px 0;
      border-radius: 16px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--primary-color);
      background: var(--input-focus-bg);
    }

    .pw-wrap {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .pw-wrap input {
      margin-right: 0;
    }

    .toggle {
      position: absolute;
      right: 15px;
      cursor: pointer;
      font-size: 16px;
      opacity: 0.6;
      transition: 0.2s;
      user-select: none;
    }

    .toggle:hover {
      opacity: 1;
    }

    button {
      position: relative;
      padding: 14px;
      margin-top: 15px;
      width: 100%;
      height: 50px;
      border-radius: 16px;
      border: none;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: filter 0.2s, background 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button:hover:not(:disabled) {
      filter: brightness(0.9);
    }

    button:disabled {
      cursor: default;
      opacity: 0.8;
    }

    /* 로딩 스피너 스타일 */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .login-status { min-height: 18px; margin-top: 10px; color: var(--sub-text); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
  </style>
</head>

<body>

<div class="card">
  <h1>2026 코딩과 함께라면</h1>
  <h2>로그인</h2>

  <input id="id" placeholder="학번을 입력하세요.">

  <div class="pw-wrap">
    <input id="pw" type="password" placeholder="비밀번호를 입력하세요.">
    <span class="toggle" onclick="togglePw()">👁</span>
  </div>

  <button id="loginBtn" onclick="login()">로그인</button>
  <div id="loginStatus" class="login-status" role="status" aria-live="polite"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",
  authDomain: "points2026-f5e50.firebaseapp.com",
  projectId: "points2026-f5e50",
  storageBucket: "points2026-f5e50.firebasestorage.app",
  messagingSenderId: "248724251417",
  appId: "1:248724251417:web:02d85cdc4addac98069b88"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const SETTINGS_KEY = "coding_with_ramen_settings";

function applyStoredSettings() {
  try {
    const settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
    document.body.classList.toggle("dark-mode", Boolean(settings.darkMode));
    if (typeof settings.primaryColor === "string" && /^#[0-9a-f]{6}$/i.test(settings.primaryColor)) {
      document.documentElement.style.setProperty("--primary-color", settings.primaryColor);
    }
  } catch {}
}
applyStoredSettings();

const params = new URLSearchParams(window.location.search);
const requestedRedirect = params.get("redirect") || "/";
const redirect = requestedRedirect.startsWith("/") && !requestedRedirect.startsWith("//")
  ? requestedRedirect
  : "/";

onAuthStateChanged(auth, user => {
  const match = (user?.email || "").match(/^(\d{5})@auth\.25withcoding\.kr$/i);
  if (user && match) {
    // The Firebase Auth session is authoritative; localStorage is only a UI cache.
    localStorage.setItem("userId", match[1]);
    localStorage.removeItem("firebaseIdToken");
    localStorage.removeItem("firebaseRefreshToken");
    location.replace(redirect);
    return;
  }
  localStorage.removeItem("userId");
  localStorage.removeItem("firebaseIdToken");
  localStorage.removeItem("firebaseRefreshToken");
});

window.togglePw = () => {
  const pw = document.getElementById("pw");
  pw.type = pw.type === "password" ? "text" : "password";
};

window.login = async () => {
  const idInput = document.getElementById("id");
  const pwInput = document.getElementById("pw");
  const loginBtn = document.getElementById("loginBtn");
  const loginStatus = document.getElementById("loginStatus");
  const id = idInput.value.trim();
  const password = pwInput.value;

  if (!/^\d{5}$/.test(id) || !password) {
    alert("올바른 학번과 비밀번호를 입력하세요.");
    return;
  }

  loginStatus.textContent = "";
  loginBtn.disabled = true;
  loginBtn.innerHTML = '<div class="spinner"></div>';
  try {
    // Explicitly persist the Firebase session before navigating to another page.
    await setPersistence(auth, browserLocalPersistence);
    const credential = await signInWithEmailAndPassword(auth, id + "@auth.25withcoding.kr", password);
    const verifiedStudentId = (credential.user?.email || "").match(/^(\\d{5})@auth\\.25withcoding\\.kr$/i)?.[1] || "";
    if (verifiedStudentId !== id) throw new Error("AUTH_STUDENT_ID_MISMATCH");
    await credential.user.getIdToken();
    localStorage.setItem("userId", verifiedStudentId);
    localStorage.removeItem("firebaseIdToken");
    localStorage.removeItem("firebaseRefreshToken");
    location.replace(redirect);
  } catch (error) {
    console.error("Firebase 로그인 실패 코드:", error?.code || "unknown", error);
    const messages = {
      "auth/invalid-credential": "학번 계정이 없거나 비밀번호가 일치하지 않습니다. Firebase Authentication 사용자 목록에서 계정 상태를 확인해야 합니다.",
      "auth/user-not-found": "인증 계정을 찾을 수 없습니다. Firebase Authentication 사용자 목록에서 계정 등록 상태를 확인해 주세요.",
      "auth/wrong-password": "비밀번호가 일치하지 않습니다. 계정 비밀번호 재설정이 필요할 수 있습니다.",
      "auth/invalid-email": "학번으로 만든 로그인 주소 형식이 올바르지 않습니다.",
      "auth/too-many-requests": "로그인 시도가 많습니다. 잠시 후 다시 시도해 주세요.",
      "auth/network-request-failed": "네트워크 연결을 확인해 주세요.",
      "auth/operation-not-allowed": "Firebase Authentication에서 이메일/비밀번호 로그인이 비활성화되어 있습니다.",
      "auth/invalid-api-key": "Firebase 설정의 API 키가 올바르지 않습니다.",
      "auth/app-not-authorized": "현재 도메인이 Firebase Authentication에서 허용되지 않았습니다."
    };
    const code = error?.code || "unknown";
    loginStatus.textContent = (messages[code] || "로그인에 실패했습니다. 아래 오류 코드를 관리자에게 전달해 주세요.") + " (오류 코드: " + code + ")";
    alert(loginStatus.textContent);
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "로그인";
  }
};

document.getElementById("id").addEventListener("keydown", event => {
  if (event.key === "Enter") window.login();
});
document.getElementById("pw").addEventListener("keydown", event => {
  if (event.key === "Enter") window.login();
});
</script>

</body>
</html>
