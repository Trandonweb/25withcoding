<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020403"><title>코딩과 함께라면 — 빛의 여정</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020403;color:#f4fff9;font-family:"Segoe UI","Noto Sans KR",system-ui,sans-serif}#intro,#scene{position:fixed;inset:0;width:100%;height:100%}#scene{display:block}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 22%,rgba(0,0,0,.86) 100%)}#startScreen{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at center,rgba(6,24,17,.2),#020403 80%);transition:opacity 1s}#startScreen.hide{opacity:0;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.42em;color:#78e8a8;margin-bottom:24px}h1{font-size:clamp(22px,4vw,36px);font-weight:400;letter-spacing:.12em;margin:0 0 14px}.hint{font-size:12px;color:#81988b;letter-spacing:.1em;margin-bottom:32px}button{font:inherit;cursor:pointer}#start,#continue{border:1px solid rgba(105,255,176,.45);border-radius:999px;background:rgba(105,255,176,.035);color:#dffff0;padding:13px 26px;font-size:11px;letter-spacing:.2em}#start:hover,#continue:hover{background:rgba(105,255,176,.12)}#logoReveal{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,42,27,.18),transparent 65%);opacity:0;visibility:hidden;transition:opacity 1.5s}#logoReveal.show{opacity:1;visibility:visible}#logo{width:min(560px,80vw);max-height:54vh;object-fit:contain;filter:brightness(1.25) drop-shadow(0 0 9px #69ffb0) drop-shadow(0 0 30px rgba(52,255,151,.4));transform:scale(.94);transition:transform 1.4s,opacity 1.2s;opacity:0}#logoReveal.show #logo{opacity:1;transform:scale(1)}#fallback{display:none;font-size:clamp(30px,7vw,68px);font-weight:800;color:#a7ffd0;text-shadow:0 0 8px #39ff9a,0 0 32px #39ff9a}#caption{margin-top:28px;font-size:10px;letter-spacing:.42em;color:#8aa995;opacity:0;transition:opacity 1s .8s}#logoReveal.show #caption{opacity:1}#continue{margin-top:38px;opacity:0;transition:opacity .8s 1.2s}#logoReveal.show #continue{opacity:1}#flash{position:fixed;inset:0;background:#eafff2;opacity:0;pointer-events:none}#skip{position:fixed;right:22px;bottom:20px;border:0;background:none;color:rgba(225,255,239,.45);font-size:10px;letter-spacing:.15em;padding:10px}#skip.hide{opacity:0;pointer-events:none}@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style></head><body>
<main id="intro"><canvas id="scene"></canvas><div class="vignette"></div>
<div id="startScreen"><div><div class="eyebrow">25 WITH CODING</div><h1>아직 보이지 않는 길</h1><div class="hint">빛을 따라, 앞으로.</div><button id="start">여정 시작하기</button></div></div>
<div id="logoReveal"><img id="logo" src="../logo_dark_mode_remove_bg.png" alt="코딩과 함께라면 로고"><div id="fallback">코딩과 함께라면</div><div id="caption">SINCE 2025</div><button id="continue">계속하기 ↗</button></div><div id="flash"></div><button id="skip">건너뛰기</button></main>
<script>
(function(){
const c=document.getElementById("scene"),x=c.getContext("2d"),startScreen=document.getElementById("startScreen"),start=document.getElementById("start"),reveal=document.getElementById("logoReveal"),logo=document.getElementById("logo"),fallback=document.getElementById("fallback"),flash=document.getElementById("flash"),skip=document.getElementById("skip");
let W=innerWidth,H=innerHeight,dpr=1,began=0,raf=0,finished=false,trail=[],sampleAt=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=t=>t*t*(3-2*t);
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px";x.setTransform(dpr,0,0,dpr,0,0);if(!began)idle()}
function idle(){x.fillStyle="#020403";x.fillRect(0,0,W,H);const g=x.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*.18);g.addColorStop(0,"rgba(105,255,176,.05)");g.addColorStop(1,"rgba(105,255,176,0)");x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle="#69ffb0";x.shadowColor="#69ffb0";x.shadowBlur=14;x.beginPath();x.moveTo(W/2,H*.53);x.lineTo(W/2,H*.525);x.stroke()}
function position(t){return{x:W*(.5+.26*Math.sin(t*1.12)+.105*Math.sin(t*2.31+.4)),y:H*(.5+.24*Math.sin(t*.78+1.05)+.085*Math.sin(t*1.93))}}
function stroke(points,alpha,width){if(points.length<2)return;x.save();x.globalAlpha=alpha;x.lineCap="round";x.lineJoin="round";x.beginPath();x.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)x.lineTo(points[i].x,points[i].y);x.strokeStyle="#69ffb0";x.lineWidth=width;x.shadowColor="rgba(75,255,165,.95)";x.shadowBlur=20;x.stroke();x.shadowBlur=4;x.strokeStyle="rgba(230,255,240,.95)";x.lineWidth=.55;x.stroke();x.restore()}
function draw(elapsed){x.fillStyle="#020403";x.fillRect(0,0,W,H);const sec=elapsed/1000,p=position(sec*.8);if(elapsed-sampleAt>20){trail.push({x:p.x,y:p.y});sampleAt=elapsed}if(trail.length>900)trail.shift();const points=trail.map((v,i)=>{const depth=trail.length<2?0:i/(trail.length-1),s=.12+.88*Math.pow(1-depth,1.55);return{x:W/2+(v.x-W/2)*s*1.65,y:H*.52+(v.y-H*.52)*s*1.5}});stroke(points,.9,1.5);const tip=points[points.length-1]||{x:W/2,y:H/2},r=Math.min(W,H)*.09,g=x.createRadialGradient(tip.x,tip.y,0,tip.x,tip.y,r);g.addColorStop(0,"rgba(220,255,237,.32)");g.addColorStop(.14,"rgba(105,255,176,.2)");g.addColorStop(1,"rgba(105,255,176,0)");x.fillStyle=g;x.beginPath();x.arc(tip.x,tip.y,r,0,Math.PI*2);x.fill();const edge=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.12,W/2,H/2,Math.max(W,H)*.75);edge.addColorStop(0,"rgba(0,0,0,0)");edge.addColorStop(1,"rgba(0,0,0,.68)");x.fillStyle=edge;x.fillRect(0,0,W,H);
if(elapsed>6900){const q=ease(clamp((elapsed-6900)/1900,0,1));x.fillStyle="rgba(2,4,3,"+(q*.18)+")";x.fillRect(0,0,W,H);x.save();x.globalAlpha=.14+.76*q;x.strokeStyle="#69ffb0";x.shadowColor="#69ffb0";x.shadowBlur=22;x.lineWidth=1.2;x.beginPath();for(let i=0;i<=180;i++){const a=i/180*Math.PI*2,rr=Math.min(W,H)*(.02+.48*q)*(1+.12*Math.sin(a*3+sec)*q+.06*Math.sin(a*7)),xx=W/2+Math.cos(a)*rr,yy=H/2+Math.sin(a)*rr*.52;if(i===0)x.moveTo(xx,yy);else x.lineTo(xx,yy)}x.stroke();x.restore();if(q>.72&&!finished){finished=true;showLogo();return}}
raf=requestAnimationFrame(tick)}
function tick(now){if(began&&!finished)draw(now-began)}
function showLogo(){cancelAnimationFrame(raf);flash.animate([{opacity:0},{opacity:.8},{opacity:0}],{duration:700,easing:"ease-out"});setTimeout(()=>reveal.classList.add("show"),250);skip.classList.add("hide")}
function begin(){if(began)return;began=performance.now();startScreen.classList.add("hide");if(matchMedia("(prefers-reduced-motion: reduce)").matches){for(let i=0;i<180;i++)trail.push(position(i/180*7));finished=true;showLogo();return}raf=requestAnimationFrame(tick)}
function skipToLogo(){if(!began)began=performance.now();finished=true;cancelAnimationFrame(raf);x.fillStyle="#020403";x.fillRect(0,0,W,H);startScreen.classList.add("hide");reveal.classList.add("show");skip.classList.add("hide")}
start.addEventListener("click",begin);skip.addEventListener("click",skipToLogo);logo.addEventListener("error",()=>{logo.style.display="none";fallback.style.display="block"});document.getElementById("continue").addEventListener("click",()=>{const next=new URLSearchParams(location.search).get("next");if(next){try{const u=new URL(next,location.origin);if(u.origin===location.origin)location.href=u.pathname+u.search+u.hash}catch(e){}}});addEventListener("resize",resize);addEventListener("keydown",e=>{if(e.key==="Enter"&&!began)begin();if(e.key==="Escape"&&began&&!finished)skipToLogo()});resize();
})();
</script></body></html>
