name: points2026 Firestore emergency rules tests

on:
  pull_request:
    paths:
      - "security-rules/**"
      - ".github/workflows/points2026-rules-tests.yml"
  push:
    branches:
      - security/cloudflare-worker-backend
    paths:
      - "security-rules/**"
      - ".github/workflows/points2026-rules-tests.yml"

jobs:
  firestore-rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
        working-directory: security-rules
      - run: npm test
        working-directory: security-rules
