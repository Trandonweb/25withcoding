<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METAL BUILD</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            width: 900px;
            height: 600px;
            background: #1a1a2e;
            position: relative;
            border: 4px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            overflow: hidden;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .active {
            display: flex;
        }
        
        /* 버튼 스타일 */
        .btn {
            background: linear-gradient(45deg, #00f0ff, #0077ff);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            transition: 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
        }

        /* 1. 시작 화면 */
        #screen-title {
            background: radial-gradient(circle, #1f4068, #162447, #1a1a2e);
        }
        .title-text {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #00f0ff;
            text-shadow: 0 0 20px #00f0ff, 0 0 40px #0077ff;
            margin-bottom: 40px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* 2. 홈 화면 */
        #screen-home {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=900&q=80') center/cover;
        }
        .home-ui-tl { position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; align-items: center; }
        .home-ui-tr { position: absolute; top: 20px; right: 20px; font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 8px; border: 1px solid #00f0ff; }
        .home-ui-bl { position: absolute; bottom: 20px; left: 20px; }
        .home-ui-br { position: absolute; bottom: 20px; right: 20px; }
        
        .mech-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 15px;
            border: 2px dashed #00f0ff;
        }
        .mech-visual {
            width: 150px;
            height: 200px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .mech-part {
            background: #333;
            border: 1px solid #00f0ff;
            margin: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            text-align: center;
            color: #00f0ff;
        }
        .p-head { width: 50px; height: 35px; border-radius: 5px; background: #222; }
        .p-torso { width: 80px; height: 60px; border-radius: 5px; background: #2a2a40; }
        .arms-container { display: flex; gap: 10px; }
        .p-arm { width: 35px; height: 50px; border-radius: 4px; background: #222; }
        .legs-container { display: flex; gap: 6px; }
        .p-leg { width: 32px; height: 50px; border-radius: 4px; background: #222; }
        .back-indicator { font-size: 12px; color: #ffaa00; margin-bottom: 5px; }

        /* 3. 커스터마이징 모달/화면 */
        #screen-custom {
            background: rgba(20, 20, 35, 0.95);
        }
        .custom-layout {
            display: flex;
            width: 100%;
            height: 100%;
            padding: 30px;
            gap: 20px;
        }
        .custom-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .custom-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.3);
            border: 1px solid #444;
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
        }
        .slot-btn {
            background: #252540;
            border: 1px solid #00f0ff;
            color: #fff;
            padding: 10px 15px;
            text-align: left;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slot-btn:hover, .slot-btn.selected {
            background: #00f0ff;
            color: #000;
            font-weight: bold;
        }
        .part-card {
            background: #2a2a45;
            border: 1px solid #555;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .part-card.equipped { border-color: #00ff66; background: #1a3a2a; }

        /* 4. 뽑기 화면 */
        #screen-gacha {
            background: rgba(15, 15, 30, 0.95);
        }
        .gacha-box {
            background: #222244;
            border: 2px solid #ff00ff;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.4);
        }

        /* 5. 전투 화면 */
        #screen-battle {
            background: linear-gradient(135deg, #2b1055, #7597de);
            justify-content: space-between;
            padding: 40px;
        }
        .battle-arena {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 300px;
            padding: 0 50px;
        }
        .fighter {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 250px;
        }
        .hp-bar-container {
            width: 100%;
            background: #444;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #fff;
            margin-bottom: 10px;
        }
        .hp-bar {
            width: 100%;
            height: 100%;
            background: #00ff66;
            transition: width 0.3s;
        }
        .fighter-avatar {
            font-size: 80px;
            animation: float 2s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .battle-log {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #00f0ff;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }

        /* 결과 모달 오버레이 */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="game-container">

    <!-- 1. 시작 화면 -->
    <div id="screen-title" class="screen active">
        <div class="title-text">METAL BUILD</div>
        <button class="btn" onclick="startGame()">게임 시작</button>
    </div>

    <!-- 2. 홈 화면 -->
    <div id="screen-home" class="screen">
        <div class="home-ui-tl">
            <button class="btn" style="padding:8px 15px; font-size:14px;" onclick="openGacha()">뽑기 시스템</button>
            <div id="coin-display" style="font-weight:bold; color:#ffaa00;">코인: 100G</div>
        </div>
        <div class="home-ui-tr" id="stage-display">STAGE 1 / 100</div>
        
        <div class="mech-display">
            <div class="back-indicator" id="home-back1">[등1: 없음]</div>
            <div class="back-indicator" id="home-back2">[등2: 없음]</div>
            <div class="mech-visual">
                <div class="mech-part p-head" id="home-head">머리</div>
                <div class="arms-container">
                    <div class="mech-part p-arm" id="home-arm-l">왼팔</div>
                    <div class="mech-part p-torso" id="home-torso">몸통</div>
                    <div class="mech-part p-arm" id="home-arm-r">오른팔</div>
                </div>
                <div class="legs-container">
                    <div class="mech-part p-leg" id="home-leg-l">왼다리</div>
                    <div class="mech-part p-leg" id="home-leg-r">우다리</div>
                </div>
            </div>
            <div style="margin-top: 10px; font-size: 14px; color: #00f0ff;" id="home-total-power">총 전투력: 150</div>
        </div>

        <div class="home-ui-bl">
            <button class="btn" onclick="openCustom()">커스터마이징</button>
        </div>
        <div class="home-ui-br">
            <button class="btn" style="background: linear-gradient(45deg, #ff3333, #ff9900);" onclick="startBattle()">전투 개시</button>
        </div>
    </div>

    <!-- 3. 커스터마이징 화면 -->
    <div id="screen-custom" class="screen">
        <div style="position: absolute; top: 20px; left: 30px; font-size: 22px; font-weight: bold; color: #00f0ff;">메카 커스터마이징</div>
        <div class="custom-layout" style="margin-top: 50px; height: calc(100% - 70px);">
            <div class="custom-left" id="slot-list-container">
                <!-- 7가지 부위 버튼 동적 생성 -->
            </div>
            <div class="custom-right">
                <div id="part-selection-title" style="font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #ffaa00;">부위를 선택하세요</div>
                <div id="inventory-list"></div>
            </div>
        </div>
        <div style="position: absolute; bottom: 20px; right: 30px;">
            <button class="btn" onclick="closeCustom()">저장 및 홈으로</button>
        </div>
    </div>

    <!-- 4. 뽑기 화면 -->
    <div id="screen-gacha" class="screen">
        <div class="gacha-box">
            <h2>메카 파츠 뽑기</h2>
            <p>랜덤한 부위의 장비를 획득합니다! (비용: 50 코인)</p>
            <div id="gacha-result" style="margin: 20px 0; font-size: 18px; color: #00f0ff; height: 30px;"></div>
            <button class="btn" onclick="doGacha()">뽑기 실행 (50G)</button>
            <br><br>
            <button class="btn" style="background: #444;" onclick="closeGacha()">돌아가기</button>
        </div>
    </div>

    <!-- 5. 전투 화면 -->
    <div id="screen-battle" class="screen">
        <div style="font-size: 24px; font-weight: bold;" id="battle-stage-title">STAGE 1</div>
        <div class="battle-arena">
            <div class="fighter">
                <div style="margin-bottom: 5px; font-weight: bold;" id="player-name">PLAYER MECH</div>
                <div class="hp-bar-container"><div class="hp-bar" id="player-hp-bar"></div></div>
                <div class="fighter-avatar">🤖</div>
                <div id="player-hp-text" style="font-size: 14px; margin-top:5px;">100 / 100</div>
            </div>
            <div style="font-size: 32px; font-weight: bold; color: #ff3333;">VS</div>
            <div class="fighter">
                <div style="margin-bottom: 5px; font-weight: bold;" id="enemy-name">ENEMY MECH</div>
                <div class="hp-bar-container"><div class="hp-bar" id="enemy-hp-bar" style="background: #ff3333;"></div></div>
                <div class="fighter-avatar">👾</div>
                <div id="enemy-hp-text" style="font-size: 14px; margin-top:5px;">100 / 100</div>
            </div>
        </div>
        <div class="battle-log" id="battle-log">전투가 시작되었습니다...</div>
    </div>

    <!-- 전투 결과 팝업 모달 -->
    <div id="battle-result-modal" class="modal-overlay">
        <div style="background: #22223b; padding: 40px; border-radius: 10px; border: 2px solid #00f0ff; text-align: center; width: 400px;">
            <h2 id="modal-result-title" style="font-size: 28px; margin-bottom: 15px;">승리!</h2>
            <p id="modal-result-desc" style="margin-bottom: 25px; color: #ccc;">파츠를 획득했습니다.</p>
            <button class="btn" onclick="returnToHomeFromBattle()">홈으로 돌아가기</button>
        </div>
    </div>

</div>

<script>
    // 게임 데이터 구조
    const partsData = {
        head: [
            { id: 'h_basic', name: '기본 헤드', slot: 'head', grade: '일반', power: 10 },
            { id: 'h_rare', name: '하이센서 헤드', slot: 'head', grade: '레어', power: 25 },
            { id: 'h_epic', name: '사이버 헤드', slot: 'head', grade: '에픽', power: 45 }
        ],
        torso: [
            { id: 't_basic', name: '기본 몸통', slot: 'torso', grade: '일반', power: 20 },
            { id: 't_rare', name: '강화 아머', slot: 'torso', grade: '레어', power: 40 },
            { id: 't_epic', name: '티타늄 코어', slot: 'torso', grade: '에픽', power: 70 }
        ],
        arm_l: [
            { id: 'al_shield', name: '왼쪽 팔 쉴드 (기본)', slot: 'arm_l', grade: '일반', power: 15 },
            { id: 'al_rare', name: '플라즈마 블레이드', slot: 'arm_l', grade: '레어', power: 30 },
            { id: 'al_epic', name: '네이팜 개틀링', slot: 'arm_l', grade: '에픽', power: 55 }
        ],
        arm_r: [
            { id: 'ar_launcher', name: '오른쪽 팔 런처 (기본)', slot: 'arm_r', grade: '일반', power: 20 },
            { id: 'ar_rare', name: '레일건', slot: 'arm_r', grade: '레어', power: 35 },
            { id: 'ar_epic', name: '하이퍼 캐논', slot: 'arm_r', grade: '에픽', power: 60 }
        ],
        back1: [
            { id: 'b1_none', name: '없음', slot: 'back1', grade: '일반', power: 0 },
            { id: 'b1_rare', name: '추러스 부스터', slot: 'back1', grade: '레어', power: 30 },
            { id: 'b1_epic', name: '윙 바인더', slot: 'back1', grade: '에픽', power: 55 }
        ],
        back2: [
            { id: 'b2_none', name: '없음', slot: 'back2', grade: '일반', power: 0 },
            { id: 'b2_rare', name: '미사일 포드', slot: 'back2', grade: '레어', power: 35 },
            { id: 'b2_epic', name: '에너지팩', slot: 'back2', grade: '에픽', power: 65 }
        ],
        leg_l: [
            { id: 'll_basic', name: '기본 왼쪽 다리', slot: 'leg_l', grade: '일반', power: 15 },
            { id: 'll_rare', name: '기동형 레그', slot: 'leg_l', grade: '레어', power: 30 },
            { id: 'll_epic', name: '호버 다리', slot: 'leg_l', grade: '에픽', power: 50 }
        ],
        leg_r: [
            { id: 'lr_basic', name: '기본 오른쪽 다리', slot: 'leg_r', grade: '일반', power: 15 },
            { id: 'lr_rare', name: '기동형 레그', slot: 'leg_r', grade: '레어', power: 30 },
            { id: 'lr_epic', name: '호버 다리', slot: 'leg_r', grade: '에픽', power: 50 }
        ]
    };

    // 플레이어 상태
    let player = {
        stage: 1,
        coins: 100,
        inventory: ['h_basic', 't_basic', 'al_shield', 'ar_launcher', 'b1_none', 'b2_none', 'll_basic', 'lr_basic'],
        equipped: {
            head: 'h_basic',
            torso: 't_basic',
            arm_l: 'al_shield',
            arm_r: 'ar_launcher',
            back1: 'b1_none',
            back2: 'b2_none',
            leg_l: 'll_basic',
            leg_r: 'lr_basic'
        }
    };

    const slotNames = {
        head: '머리',
        torso: '몸통',
        arm_l: '왼팔',
        arm_r: '오른팔',
        back1: '등1',
        back2: '등2',
        leg_l: '왼쪽 다리',
        leg_r: '오른쪽 다리'
    };

    let currentSelectedSlot = 'head';

    // 화면 전환 함수
    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startGame() {
        switchScreen('screen-home');
        updateHomeUI();
    }

    // 홈 화면 업데이트
    function updateHomeUI() {
        document.getElementById('stage-display').innerText = `STAGE ${player.stage} / 100`;
        document.getElementById('coin-display').innerText = `코인: ${player.coins}G`;

        // 메카 시각화 텍스트 업데이트
        document.getElementById('home-head').innerText = getPartName(player.equipped.head);
        document.getElementById('home-torso').innerText = getPartName(player.equipped.torso);
        document.getElementById('home-arm-l').innerText = getPartName(player.equipped.arm_l);
        document.getElementById('home-arm-r').innerText = getPartName(player.equipped.arm_r);
        document.getElementById('home-leg-l').innerText = getPartName(player.equipped.leg_l);
        document.getElementById('home-leg-r').innerText = getPartName(player.equipped.leg_r);
        
        document.getElementById('home-back1').innerText = `[등1: ${getPartName(player.equipped.back1)}]`;
        document.getElementById('home-back2').innerText = `[등2: ${getPartName(player.equipped.back2)}]`;

        document.getElementById('home-total-power').innerText = `총 전투력: ${calculateTotalPower(player.equipped)}`;
    }

    function getPartName(partId) {
        for (let slot in partsData) {
            let found = partsData[slot].find(p => p.id === partId);
            if (found) return found.name;
        }
        return '없음';
    }

    function getPartObject(partId) {
        for (let slot in partsData) {
            let found = partsData[slot].find(p => p.id === partId);
            if (found) return found;
        }
        return null;
    }

    function calculateTotalPower(equippedObj) {
        let total = 0;
        for (let slot in equippedObj) {
            let p = getPartObject(equippedObj[slot]);
            if (p) total += p.power;
        }
        return total;
    }

    // 커스터마이징 화면 제어
    function openCustom() {
        switchScreen('screen-custom');
        renderCustomSlots();
        selectSlot('head');
    }

    function closeCustom() {
        switchScreen('screen-home');
        updateHomeUI();
    }

    function renderCustomSlots() {
        let container = document.getElementById('slot-list-container');
        container.innerHTML = '';
        for (let slotKey in slotNames) {
            let btn = document.createElement('button');
            btn.className = `slot-btn ${currentSelectedSlot === slotKey ? 'selected' : ''}`;
            btn.innerHTML = `<span>${slotNames[slotKey]}</span> <span style="font-size:12px; color:#00f0ff;">[장착중: ${getPartName(player.equipped[slotKey])}]</span>`;
            btn.onclick = () => selectSlot(slotKey);
            container.appendChild(btn);
        }
    }

    function selectSlot(slotKey) {
        currentSelectedSlot = slotKey;
        renderCustomSlots();
        
        document.getElementById('part-selection-title').innerText = `${slotNames[slotKey]} 부위 파츠 선택`;
        let invContainer = document.getElementById('inventory-list');
        invContainer.innerHTML = '';

        // 해당 슬롯에 맞는 파츠들 중 플레이어가 보유한 것 필터링
        let availableParts = partsData[slotKey].filter(p => player.inventory.includes(p.id));

        availableParts.forEach(part => {
            let isEquipped = player.equipped[slotKey] === part.id;
            let card = document.createElement('div');
            card.className = `part-card ${isEquipped ? 'equipped' : ''}`;
            card.innerHTML = `
                <div>
                    <strong>${part.name}</strong> <span style="font-size:12px; color:#ffaa00;">(${part.grade})</span><br>
                    <span style="font-size:12px; color:#aaa;">전투력: +${part.power}</span>
                </div>
                <div>
                    ${isEquipped ? '<span style="color:#00ff66; font-weight:bold;">장착중</span>' : `<button class="btn" style="padding:5px 15px; font-size:14px;" onclick="equipPart('${slotKey}', '${part.id}')">장착</button>`}
                </div>
            `;
            invContainer.appendChild(card);
        });
    }

    function equipPart(slotKey, partId) {
        player.equipped[slotKey] = partId;
        selectSlot(slotKey);
        updateHomeUI();
    }

    // 뽑기 시스템
    function openGacha() {
        switchScreen('screen-gacha');
        document.getElementById('gacha-result').innerText = '';
    }

    function closeGacha() {
        switchScreen('screen-home');
        updateHomeUI();
    }

    function doGacha() {
        if (player.coins < 50) {
            document.getElementById('gacha-result').innerText = '코인이 부족합니다! (필요: 50G)';
            return;
        }
        player.coins -= 50;
        
        // 모든 파츠 중 랜덤 선택
        let allSlots = Object.keys(partsData);
        let randomSlot = allSlots[Math.floor(Math.random() * allSlots.length)];
        let slotParts = partsData[randomSlot];
        let randomPart = slotParts[Math.floor(Math.random() * slotParts.length)];

        if (!player.inventory.includes(randomPart.id)) {
            player.inventory.push(randomPart.id);
        }

        document.getElementById('gacha-result').innerHTML = `🎉 획득 성공: <span style="color:#ff00ff;">${randomPart.name}</span> (${slotNames[randomSlot]})`;
        document.getElementById('coin-display').innerText = `코인: ${player.coins}G`;
    }

    // 전투 시스템
    let battleInterval = null;

    function startBattle() {
        switchScreen('screen-battle');
        document.getElementById('battle-stage-title').innerText = `STAGE ${player.stage} / 100`;
        document.getElementById('battle-result-modal').style.display = 'none';

        let pPower = calculateTotalPower(player.equipped);
        // 스테이지가 올라갈수록 적이 점점 강해짐
        let ePower = Math.floor(pPower * 0.7 + (player.stage * 12));

        let playerMaxHp = 100 + (pPower * 2);
        let enemyMaxHp = 100 + (ePower * 2);

        let playerHp = playerMaxHp;
        let enemyHp = enemyMaxHp;

        document.getElementById('player-name').innerText = `PLAYER (전투력:${pPower})`;
        document.getElementById('enemy-name').innerText = `STAGE ${player.stage} 적 (전투력:${ePower})`;

        let logBox = document.getElementById('battle-log');
        logBox.innerHTML = `[전투 개시] 적 로봇이 나타났습니다! 전투력 차이를 계산합니다...<br>`;

        if (battleInterval) clearInterval(battleInterval);

        battleInterval = setInterval(() => {
            // 턴제 공방 시뮬레이션
            let pDamage = Math.max(10, Math.floor(pPower * (0.8 + Math.random() * 0.4)));
            let eDamage = Math.max(10, Math.floor(ePower * (0.8 + Math.random() * 0.4)));

            // 플레이어 공격
            enemyHp -= pDamage;
            if (enemyHp < 0) enemyHp = 0;
            logBox.innerHTML += `플레이어의 공격! 적에게 <span style="color:#00ff66;">${pDamage}</span> 데미지.<br>`;

            if (enemyHp <= 0) {
                clearInterval(battleInterval);
                endBattle(true);
                return;
            }

            // 적 공격
            playerHp -= eDamage;
            if (playerHp < 0) playerHp = 0;
            logBox.innerHTML += `적의 반격! 플레이어가 <span style="color:#ff3333;">${eDamage}</span> 데미지를 입음.<br>`;

            if (playerHp <= 0) {
                clearInterval(battleInterval);
                endBattle(false);
                return;
            }

            // UI 업데이트
            document.getElementById('player-hp-bar').style.width = `${(playerHp / playerMaxHp) * 100}%`;
            document.getElementById('player-hp-text').innerText = `${playerHp} / ${playerMaxHp}`;
            document.getElementById('enemy-hp-bar').style.width = `${(enemyHp / enemyMaxHp) * 100}%`;
            document.getElementById('enemy-hp-text').innerText = `${enemyHp} / ${enemyMaxHp}`;

            logBox.scrollTop = logBox.scrollHeight;
        }, 1000);
    }

    function endBattle(isWin) {
        let modal = document.getElementById('battle-result-modal');
        let title = document.getElementById('modal-result-title');
        let desc = document.getElementById('modal-result-desc');

        modal.style.display = 'flex';

        if (isWin) {
            title.innerText = "승리!";
            title.style.color = "#00ff66";
            
            // 보상 코인 지급 (스테이지 비례)
            let rewardCoins = 30 + (player.stage * 5);
            player.coins += rewardCoins;

            // 랜덤 파츠 드롭 (스테이지가 높을수록 에픽/레어 확률 증가)
            let allSlots = Object.keys(partsData);
            let dropSlot = allSlots[Math.floor(Math.random() * allSlots.length)];
            let possibleParts = partsData[dropSlot];
            
            // 스테이지 보정에 따른 드롭 파츠 선정
            let dropIndex = 0;
            if (player.stage > 30) dropIndex = Math.random() < 0.5 ? 2 : 1;
            else if (player.stage > 10) dropIndex = Math.random() < 0.6 ? 1 : 0;
            
            let droppedPart = possibleParts[dropIndex] || possibleParts[0];

            if (!player.inventory.includes(droppedPart.id)) {
                player.inventory.push(droppedPart.id);
            }

            desc.innerHTML = `스테이지 ${player.stage} 클리어!<br>보상 코인: <span style="color:#ffaa00;">+${rewardCoins}G</span><br>획득 파츠: <span style="color:#00f0ff;">${droppedPart.name}</span>`;

            if (player.stage < 100) {
                player.stage++;
            }
        } else {
            title.innerText = "패배...";
            title.style.color = "#ff3333";
            desc.innerHTML = `적의 화력이 너무 강했습니다.<br>더 좋은 파츠를 장착하거나 뽑기를 이용해 스펙을 높여보세요!`;
        }
    }

    function returnToHomeFromBattle() {
        document.getElementById('battle-result-modal').style.display = 'none';
        switchScreen('screen-home');
        updateHomeUI();
    }
</script>
