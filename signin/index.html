<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>코딩과 함께라면_로그인</title>
  <style>
    :root {
      --bg-color: #f0f0f0;
      --card-bg: #ffffff;
      --text-color: #111111;
      --sub-text: #666666;
      --input-bg: #f8fafc;
      --input-border: #e1e8ed;
      --input-focus-bg: #ffffff;
      --primary-color: #27ae60;
      --btn-bg: var(--primary-color);
      --btn-hover: color-mix(in srgb, var(--primary-color) 85%, black);
      --btn-text: #ffffff;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1E1E1E;
      --text-color: #FFFFFF;
      --sub-text: #AAAAAA;
      --input-bg: #2A2A2A;
      --input-border: #333333;
      --input-focus-bg: #1E1E1E;
      --btn-bg: var(--primary-color);
      --btn-hover: color-mix(in srgb, var(--primary-color) 85%, black);
      --btn-text: #FFFFFF;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Malgun Gothic', sans-serif;
      transition: background 0.2s, color 0.2s;
    }

    .card {
      background: var(--card-bg);
      color: var(--text-color);
      padding: 35px 30px;
      border-radius: 24px;
      text-align: center;
      width: 320px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--input-border);
      transition: background 0.2s, border 0.2s;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: var(--text-color);
    }

    h2 {
      font-size: 14px;
      margin-bottom: 25px;
      color: var(--sub-text);
      font-weight: normal;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      margin: 8px 0;
      border-radius: 16px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--primary-color);
      background: var(--input-focus-bg);
    }

    .pw-wrap {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .pw-wrap input {
      margin-right: 0;
    }

    .toggle {
      position: absolute;
      right: 15px;
      cursor: pointer;
      font-size: 16px;
      opacity: 0.6;
      transition: 0.2s;
      user-select: none;
    }

    .toggle:hover {
      opacity: 1;
    }

    button {
      padding: 14px;
      margin-top: 15px;
      width: 100%;
      border-radius: 16px;
      border: none;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: filter 0.2s, background 0.2s;
    }

    button:hover {
      filter: brightness(0.9);
    }
  </style>
</head>

<body>

<div class="card">
  <h1>2026 코딩과 함께라면</h1>
  <h2>로그인</h2>

  <input id="id" placeholder="학번을 입력하세요.">

  <div class="pw-wrap">
    <input id="pw" type="password" placeholder="비밀번호를 입력하세요.">
    <span class="toggle" onclick="togglePw()">👁</span>
  </div>

  <button onclick="login()">로그인</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",
  authDomain: "points2026-f5e50.firebaseapp.com",
  projectId: "points2026-f5e50"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 테마 동기화 로직
const SETTINGS_KEY = "coding_with_ramen_settings";

function applyStoredSettings() {
    const saved = localStorage.getItem(SETTINGS_KEY);
    if (saved) {
        try {
            const settings = JSON.parse(saved);
            if (settings.darkMode) {
                document.body.classList.add("dark-mode");
            } else {
                document.body.classList.remove("dark-mode");
            }
            if (settings.primaryColor) {
                document.documentElement.style.setProperty('--primary-color', settings.primaryColor);
            }
        } catch (e) {
            console.error("설정 로드 실패", e);
        }
    }
}

// 페이지 로드 즉시 테마 적용 (깜빡임 방지)
applyStoredSettings();

// 로그인 후 돌아갈 주소
const params = new URLSearchParams(window.location.search);
const redirect = params.get("redirect") || "/";

// 이미 로그인된 경우
if (localStorage.getItem("userId")) {
  location.href = redirect;
}

window.togglePw = () => {
  const pw = document.getElementById("pw");
  pw.type = pw.type === "password" ? "text" : "password";
};

window.login = async () => {
  const id = document.getElementById("id").value.trim();
  const pw = document.getElementById("pw").value;

  if (!id || !pw) {
    alert("학번과 비밀번호를 입력하세요.");
    return;
  }

  try {
    const snap = await getDoc(doc(db, "users", id));

    if (!snap.exists()) {
      alert("계정 없음");
      return;
    }

    const data = snap.data();

    if (pw !== data.password) {
      alert("비밀번호 틀림");
      return;
    }

    localStorage.setItem("userId", id);

    // 기본 비밀번호면 변경 페이지
    if (data.password === "qwer1234!") {
      location.href = "/상벌점/change.html";
      return;
    }

    // 원래 있던 페이지로 복귀
    location.href = redirect;

  } catch (e) {
    console.error(e);
    alert("로그인 중 오류 발생");
  }
};
</script>

</body>
</html>
