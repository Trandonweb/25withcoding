<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Coby AI</title>
<style>
*{box-sizing:border-box}
:root{--primary:#27ae60;--bg:#fff;--card:#f5f5f5;--text:#222;--sub:#777;--border:#ddd}
body{margin:0;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.header{height:64px;display:flex;align-items:center;padding:0 20px;background:linear-gradient(to bottom,#eee,#fff);border-bottom:1px solid #eee}
.menu-btn{width:42px;height:42px;border:0;border-radius:12px;background:#fff;font-size:24px;cursor:pointer}.logo{margin-left:15px;font-size:22px;font-weight:700;color:var(--primary)}
.user-status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}.status-dot{width:9px;height:9px;border-radius:50%;background:#aaa}.status-dot.connected{background:#27ae60}
.sidebar{position:fixed;left:-300px;top:0;width:300px;height:100vh;background:#fff;box-shadow:3px 0 20px rgba(0,0,0,.12);transition:.3s;z-index:10;display:flex;flex-direction:column}.sidebar.open{left:0}
.side-top{padding:20px}.side-btn{width:100%;padding:14px;margin-bottom:10px;border:0;border-radius:12px;background:#f5f5f5;text-align:left;font-size:15px;cursor:pointer}.side-btn:hover{background:#eaeaea}.side-title{margin-top:20px;margin-bottom:5px;font-size:13px;color:#777}
.chat-list{flex:1;overflow:auto;padding:10px 20px}.chat-item{padding:12px;border-radius:10px;cursor:pointer;margin-bottom:4px}.chat-item:hover{background:#f1f1f1}.chat-item.active{background:#e8f5e9;color:#188b48}.chat-title{font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.chat-date{font-size:11px;color:#999;margin-top:4px}
.project-section{padding:10px 20px;border-top:1px solid #eee;max-height:230px;overflow:auto}.project-title{font-size:13px;color:#777;margin-bottom:8px}.project-item{padding:9px 10px;border-radius:9px;cursor:pointer;font-size:14px}.project-item:hover{background:#f1f1f1}.project-item.active{background:#e8f5e9;color:#188b48;font-weight:600}
.profile{margin:15px;padding:12px;border-radius:30px;background:#f3f3f3;display:flex;align-items:center}.profile-circle{width:35px;height:35px;border-radius:50%;background:var(--primary);color:#fff;display:flex;justify-content:center;align-items:center;margin-right:10px;font-weight:bold}.profile-info{display:flex;flex-direction:column}.profile-name{font-weight:bold;font-size:14px}.profile-id{font-size:11px;color:#888}
.main{height:calc(100vh - 64px);display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:30px max(20px,8vw)}.welcome{margin-top:100px;text-align:center}.welcome h2{font-size:28px}.welcome p{color:#666;font-size:16px}.message{max-width:800px;margin:20px auto;padding:15px;border-radius:15px;white-space:pre-wrap;word-break:break-word;line-height:1.6}.ai{background:#f5f5f5}.user{background:var(--primary);color:#fff;margin-left:auto}.message-label{font-size:11px;opacity:.65;margin-bottom:5px;font-weight:700}
.input-area{padding:20px;display:flex;justify-content:center}.input-box{width:min(800px,90%);display:flex;background:#fff;border:1px solid #ddd;border-radius:25px;padding:8px;box-shadow:0 2px 10px rgba(0,0,0,.04)}input{flex:1;border:none;outline:none;padding:12px;font-size:15px}.send{width:45px;height:45px;border-radius:50%;border:0;background:var(--primary);color:#fff;cursor:pointer;font-size:18px}.send:disabled{opacity:.6;cursor:not-allowed}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:5}.overlay.show{display:block}.empty-chat{color:#999;text-align:center;padding:20px 10px;font-size:13px}
.project-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;align-items:center;justify-content:center}.project-modal.show{display:flex}.modal-box{width:min(420px,90%);background:#fff;border-radius:20px;padding:25px;box-shadow:0 10px 40px rgba(0,0,0,.2)}.modal-box h3{margin-top:0}.modal-box input{width:100%;border:1px solid var(--border);border-radius:12px;margin:10px 0}.modal-buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.modal-buttons button{padding:10px 16px;border:0;border-radius:10px;cursor:pointer}.cancel-btn{background:#eee}.create-btn{background:var(--primary);color:#fff}
@media(max-width:600px){.messages{padding:20px 12px}.message{max-width:95%}.user-status{display:none}.sidebar{width:290px}}
</style>
</head>
<body>
<div class="header"><button class="menu-btn" onclick="openMenu()">☰</button><div class="logo">🤖 Coby AI</div><div class="user-status"><span class="status-dot" id="statusDot"></span><span id="statusText">사용자 확인 중...</span></div></div>
<div class="sidebar" id="sidebar">
<div class="side-top"><button class="side-btn" onclick="newChat()">＋ 새 채팅</button><button class="side-btn" onclick="openProjectModal()">📁 새 프로젝트</button><div class="side-title">최근 대화</div></div>
<div class="chat-list" id="chatList"><div class="empty-chat">대화를 불러오는 중...</div></div>
<div class="project-section"><div class="project-title">프로젝트</div><div id="projectList"><div class="empty-chat">프로젝트가 없습니다.</div></div></div>
<div class="profile"><div class="profile-circle" id="profileCircle">?</div><div class="profile-info"><div class="profile-name" id="profileName">사용자 확인 중...</div><div class="profile-id" id="profileId">-</div></div></div>
</div>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<div class="main"><div class="messages" id="messages"><div class="welcome" id="welcome"><h2>어서오세요!</h2><p>무한한 상상의 나래를 펼쳐요 🚀<br>Coby가 당신의 코딩 여정을 함께합니다.</p></div></div><div class="input-area"><div class="input-box"><input id="userInput" placeholder="Coby에게 무엇이든 물어보세요" autocomplete="off"><button class="send" id="sendButton" onclick="sendMessage()">↑</button></div></div></div>
<div class="project-modal" id="projectModal"><div class="modal-box"><h3>새 프로젝트</h3><input id="projectNameInput" placeholder="프로젝트 이름" maxlength="50"><input id="projectDescriptionInput" placeholder="프로젝트 설명 (선택)" maxlength="200"><div class="modal-buttons"><button class="cancel-btn" onclick="closeProjectModal()">취소</button><button class="create-btn" onclick="createProject()">만들기</button></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,collection,addDoc,getDocs,query,orderBy,limit,serverTimestamp,updateDoc}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const mainFirebaseConfig={apiKey:"AIzaSyBgArbW8dArbW8dO7OSYsTVEQtRHT049U20",authDomain:"points2026-f5e50.firebaseapp.com",projectId:"points2026-f5e50",storageBucket:"points2026-f5e50.firebasestorage.app",messagingSenderId:"248724251417",appId:"1:248724251417:web:02d85cdc4addac98069b88"};
const cobyFirebaseConfig={apiKey:"AIzaSyAiO65YzYeRfuf6fCzosuW7OAVV47o47Js",authDomain:"coby-ai-328dd.firebaseapp.com",projectId:"coby-ai-328dd",storageBucket:"coby-ai-328dd.firebasestorage.app",messagingSenderId:"865530259286",appId:"1:865530259286:web:6feaa5781dc538700b18f7"};
const mainApp=initializeApp(mainFirebaseConfig,"mainApp");
const cobyApp=initializeApp(cobyFirebaseConfig,"cobyApp");
const mainDb=getFirestore(mainApp);const db=getFirestore(cobyApp);

let currentUserId=null,currentPerson=null,currentConversationId=null,currentProjectId=null,currentProject=null,isSending=false;
const API_URL="https://two5withcoding.onrender.com/chat";
const $=id=>document.getElementById(id);
const people=()=>collection(db,"people",currentUserId,"conversations");
const projects=()=>collection(db,"people",currentUserId,"projects");
const messagesRef=()=>collection(db,"people",currentUserId,"conversations",currentConversationId,"messages");
function setStatus(t,ok=false){$("statusText").textContent=t;$("statusDot").classList.toggle("connected",ok)}
function updateProfile(){const name=currentPerson?.name||currentUserId||"사용자";$("profileName").textContent=name;$("profileId").textContent=currentUserId?`학번 ${currentUserId}`:"-";$("profileCircle").textContent=name.charAt(0)}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function formatDate(ts){if(!ts)return"";const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})}
function openMenu(){$("sidebar").classList.add("open");$("overlay").classList.add("show")}function closeMenu(){$("sidebar").classList.remove("open");$("overlay").classList.remove("show")}
window.openMenu=openMenu;window.closeMenu=closeMenu;
function clearMessages(){$("messages").innerHTML=""}
function addMessage(role,content){const el=document.createElement("div");el.className=`message ${role==='user'?"user":"ai"}`;el.innerHTML=`<div class="message-label">${role==='user'?"YOU":"COBY"}</div>${escapeHtml(content)}`;$("messages").appendChild(el);$("messages").scrollTop=$("messages").scrollHeight}
function showWelcome(){clearMessages();const d=document.createElement("div");d.className="welcome";d.id="welcome";d.innerHTML="<h2>어서오세요!</h2><p>무한한 상상의 나래를 펼쳐요 🚀<br>Coby가 당신의 코딩 여정을 함께합니다.</p>";$("messages").appendChild(d)}
async function loadUser(){currentUserId=localStorage.getItem("userId");if(!currentUserId){setStatus("로그인이 필요합니다");updateProfile();return false}try{const snap=await getDoc(doc(mainDb,"users",currentUserId));currentPerson=snap.exists()?{schoolNumber:currentUserId,...snap.data()}:{schoolNumber:currentUserId};await setDoc(doc(db,"people",currentUserId),{schoolNumber:currentUserId,name:currentPerson.name||"사용자",updatedAt:serverTimestamp()},{merge:true});updateProfile();setStatus(`${currentPerson.name||"사용자"}님`,true);await Promise.all([loadChats(),loadProjects()]);return true}catch(e){console.error(e);setStatus("Firebase 연결 실패");updateProfile();alert("Coby Firebase 연결에 실패했습니다. Firestore 보안 규칙도 확인해주세요.");return false}}
async function loadChats(){if(!currentUserId)return;const snap=await getDocs(query(people(),orderBy("updatedAt","desc"),limit(30)));$("chatList").innerHTML="";if(snap.empty){$("chatList").innerHTML='<div class="empty-chat">아직 대화가 없습니다.</div>';return}snap.forEach(s=>{const d=s.data(),el=document.createElement("div");el.className="chat-item"+(s.id===currentConversationId?" active":"");el.onclick=()=>openConversation(s.id);el.innerHTML=`<div class="chat-title">${escapeHtml(d.title||"새 대화")}</div><div class="chat-date">${formatDate(d.updatedAt)}</div>`;$("chatList").appendChild(el)})}
async function loadProjects(){if(!currentUserId)return;const snap=await getDocs(query(projects(),orderBy("updatedAt","desc"),limit(30)));$("projectList").innerHTML="";if(snap.empty){$("projectList").innerHTML='<div class="empty-chat">프로젝트가 없습니다.</div>';return}snap.forEach(s=>{const d=s.data(),el=document.createElement("div");el.className="project-item"+(s.id===currentProjectId?" active":"");el.onclick=()=>selectProject(s.id,d);el.textContent="📁 "+(d.name||"이름 없음");$("projectList").appendChild(el)})}
async function createConversation(projectId=null){const ref=await addDoc(people(),{title:"새 대화",projectId:projectId||null,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});currentConversationId=ref.id;currentProjectId=projectId||null;showWelcome();await loadChats();return ref.id}
async function newChat(){if(!currentUserId){alert("먼저 로그인해주세요.");return}await createConversation(currentProjectId);closeMenu();$("userInput").focus()}
window.newChat=newChat;
async function openConversation(id){if(!currentUserId)return;currentConversationId=id;const snap=await getDoc(doc(db,"people",currentUserId,"conversations",id));if(!snap.exists())return;const d=snap.data();currentProjectId=d.projectId||null;currentProject=currentProjectId?((await getDoc(doc(db,"people",currentUserId,"projects",currentProjectId))).data()||null):null;const ms=await getDocs(query(messagesRef(),orderBy("createdAt","asc")));clearMessages();if(ms.empty)showWelcome();else ms.forEach(s=>{const m=s.data();addMessage(m.role,m.content)});await loadChats();await loadProjects();closeMenu()}
async function selectProject(id,data){currentProjectId=id;currentProject=data;await createConversation(id);await loadProjects();closeMenu()}
window.selectProject=selectProject;
function openProjectModal(){$("projectModal").classList.add("show");$("projectNameInput").focus()}function closeProjectModal(){$("projectModal").classList.remove("show");$("projectNameInput").value="";$("projectDescriptionInput").value=""}window.openProjectModal=openProjectModal;window.closeProjectModal=closeProjectModal;
async function createProject(){if(!currentUserId){alert("먼저 로그인해주세요.");return}const name=$("projectNameInput").value.trim(),description=$("projectDescriptionInput").value.trim();if(!name){alert("프로젝트 이름을 입력하세요.");return}try{const ref=await addDoc(projects(),{name,description,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});closeProjectModal();await loadProjects();await createConversation(ref.id);closeMenu()}catch(e){console.error(e);alert("프로젝트 생성에 실패했습니다.")}}
window.createProject=createProject;
async function getProjectContext(){if(!currentProjectId||!currentUserId)return[];try{const qs=await getDocs(query(people(),orderBy("updatedAt","desc"),limit(10)));const context=[];for(const s of qs.docs){const d=s.data();if(d.projectId!==currentProjectId||s.id===currentConversationId)continue;const ms=await getDocs(query(collection(db,"people",currentUserId,"conversations",s.id,"messages"),orderBy("createdAt","desc"),limit(6)));ms.docs.reverse().forEach(m=>{const x=m.data();context.push({role:x.role,content:x.content})})}return context.slice(-30)}catch(e){console.warn("프로젝트 컨텍스트 로드 실패",e);return[]}}
async function sendMessage(){if(isSending)return;const text=$("userInput").value.trim();if(!text)return;if(!currentUserId){alert("로그인이 필요합니다.");return}if(!currentConversationId)await createConversation(currentProjectId);isSending=true;$("sendButton").disabled=true;$("userInput").value="";addMessage("user",text);try{await addDoc(messagesRef(),{role:"user",content:text,createdAt:serverTimestamp()});const convoRef=doc(db,"people",currentUserId,"conversations",currentConversationId);const convo=await getDoc(convoRef);if(convo.exists()&&(convo.data().title==="새 대화"||!convo.data().title)){await updateDoc(convoRef,{title:text.length>35?text.slice(0,35)+"…":text,updatedAt:serverTimestamp()})}else await updateDoc(convoRef,{updatedAt:serverTimestamp()});const context=await getProjectContext();const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,studentId:currentUserId,conversationId:currentConversationId,projectId:currentProjectId,project:currentProject||null,context})});if(!response.ok)throw new Error(`API ${response.status}`);const data=await response.json();const answer=data.answer??data.response??data.message??"응답을 받지 못했습니다.";addMessage("assistant",answer);await addDoc(messagesRef(),{role:"assistant",content:answer,createdAt:serverTimestamp()});await updateDoc(convoRef,{updatedAt:serverTimestamp()});await loadChats()}catch(e){console.error(e);addMessage("assistant","죄송해요. 응답을 가져오는 중 오류가 발생했어요. 잠시 후 다시 시도해주세요.");}finally{isSending=false;$("sendButton").disabled=false;$("userInput").focus()}}
window.sendMessage=sendMessage;
$("userInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
$("projectModal").addEventListener("click",e=>{if(e.target===$("projectModal"))closeProjectModal()});

(async()=>{const ok=await loadUser();if(!ok)return;const chats=await getDocs(query(people(),orderBy("updatedAt","desc"),limit(1)));if(!chats.empty)await openConversation(chats.docs[0].id);else await createConversation(null)})();
</script>
</body>
</html>
