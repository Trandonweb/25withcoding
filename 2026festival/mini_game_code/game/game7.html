<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>활쏘기 대결 | MINI GAME</title>
<style>
*{box-sizing:border-box}:root{color-scheme:dark;--green:#53e88a;--gold:#ffd477;--line:rgba(150,255,190,.18)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,#17442c,transparent 42%),#050b08;color:#f3fff6;font-family:Inter,'Noto Sans KR',Arial,sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(1000px,100%)}.top{display:flex;justify-content:space-between;color:#a9c5b2;font-size:12px;letter-spacing:.1em}.heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:14px 0 18px}.heading h1{font-size:clamp(30px,5vw,46px);margin:0;letter-spacing:-.05em}.heading p{color:#b8cdbf;line-height:1.6;margin:8px 0 0}.arena{border:1px solid var(--line);background:#07100b;border-radius:20px;padding:8px;box-shadow:0 22px 60px #0005}canvas{display:block;width:100%;height:auto;border-radius:12px}.scores{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:13px 0}.score{border:1px solid var(--line);border-radius:13px;padding:10px 14px;background:#ffffff06}.score:last-child{text-align:right}.score small{display:block;color:#b8cdbf}.score strong{font-size:22px}.vs{font-size:12px;color:#8cb29a}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.control{border:1px solid var(--line);background:#ffffff08;border-radius:13px;padding:12px 14px}.control b{display:block;margin-bottom:4px}.control span{font-size:12px;color:#b8cdbf}.help{margin:12px 0;color:#b8cdbf;font-size:13px;line-height:1.7}button{font:inherit}.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--green);color:#062012;font-weight:800;cursor:pointer}.hidden{display:none!important}#message{font-weight:750;min-height:24px;margin:12px 0}.bottom{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hint{color:#a9c5b2;font-size:12px}@media(max-width:620px){body{padding:10px}.heading{display:block}.controls{grid-template-columns:1fr}.score{padding:8px}.score strong{font-size:18px}}
</style></head><body><main class="wrap">
<div class="top"><span>MINI GAME / 07</span><span id="round"></span></div>
<div class="heading"><div><h1>활쏘기 대결</h1><p>각도를 조준하고 활시위를 당긴 뒤 놓으면 발사됩니다. 바람과 중력을 고려해 맞혀 보세요.</p></div></div>
<div class="arena"><canvas id="arena" width="960" height="480" aria-label="양쪽에서 활을 쏘는 대결"></canvas></div>
<div class="scores"><div class="score"><small id="leftName">1P · 명중</small><strong><span id="hits1">0</span> / 4</strong></div><div class="vs">VS</div><div class="score"><small id="rightName">컴퓨터 · 명중</small><strong><span id="hits2">0</span> / 4</strong></div></div>
<div class="controls"><div class="control"><b>1P · 왼쪽 진영</b><span>A/D 각도 조준 · S를 누르고 있다가 놓기</span></div><div class="control"><b id="rightControlTitle">컴퓨터 · 오른쪽 진영</b><span id="rightControlText">자동 조준 및 발사</span></div></div>
<div class="help">한 컴퓨터 2P: 1P는 A/D + S, 2P는 ←/→ + ↓. 당기는 키를 누르고 있는 동안 힘이 모이고, 키를 놓는 순간 화살이 날아갑니다. 화살은 중력의 영향을 받습니다.</div>
<div class="bottom"><button class="btn hidden" id="done">결과 확인 →</button><span id="message">각도를 조절하고 활시위를 당겨 보세요.</span></div>
<script>
const settings=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu'};
const mode=settings.mode||'cpu',canvas=document.getElementById('arena'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
document.getElementById('round').textContent=settings.round?settings.round+'번째 게임':'';
if(mode==='local'){document.getElementById('leftName').textContent='1P · 명중';document.getElementById('rightName').textContent='2P · 명중';document.getElementById('rightControlTitle').textContent='2P · 오른쪽 진영';document.getElementById('rightControlText').textContent='←/→ 각도 조준 · ↓를 누르고 있다가 놓기'}
const ground=H-34,gravity=.19,archers=[{x:95,y:ground,side:1,angle:-.48,draw:0,holding:false,hits:0,color:'#53e88a',name:'1P',cooldown:0},{x:W-95,y:ground,side:-1,angle:-.48,draw:0,holding:false,hits:0,color:'#ffd477',name:mode==='local'?'2P':'CPU',cooldown:0}];
let arrows=[],particles=[],playing=true,keys=new Set(),cpuClock=0,lastTime=performance.now(),winner=null;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function facingAngle(a){return a.side===1?a.angle:Math.PI-a.angle}
function startDraw(i){const a=archers[i];if(!playing||a.holding||a.cooldown>0)return;a.holding=true;a.draw=0}
function releaseDraw(i){const a=archers[i];if(!a.holding||!playing)return;a.holding=false;const power=clamp(a.draw,12,100),speed=4.5+power*.105,ang=a.angle;const startX=a.x+a.side*30*Math.cos(ang),startY=a.y-39+30*Math.sin(ang);arrows.push({x:startX,y:startY,vx:a.side*Math.cos(ang)*speed,vy:Math.sin(ang)*speed,owner:i,life:0,color:a.color});a.draw=0;a.cooldown=20;document.getElementById('message').textContent=a.name+' 발사!'}
function adjust(i,d){const a=archers[i];a.angle=clamp(a.angle+d,-1.25,.05)}
function finish(w){if(!playing)return;playing=false;winner=w;const me=archers[1].hits,opp=archers[0].hits;localStorage.setItem('miniGameResult',JSON.stringify({game:'🏹 활쏘기 대결',winner:w,me,opp}));document.getElementById('message').textContent=w==='me'?'1P 승리!':w==='opp'?(mode==='local'?'2P 승리!':'컴퓨터 승리!'):'무승부';document.getElementById('done').classList.remove('hidden')}
function hit(i,x,y){const a=archers[i];a.hits++;document.getElementById('hits'+(i+1)).textContent=a.hits;for(let k=0;k<14;k++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.8)*4,life:25,color:a.color});if(a.hits>=4)finish(i===1?'me':'opp')}
function drawArcher(a){const ang=facingAngle(a),headY=a.y-66;ctx.strokeStyle=a.color;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y-54);ctx.lineTo(a.x,a.y-20);ctx.moveTo(a.x,a.y-43);ctx.lineTo(a.x+a.side*19,a.y-27);ctx.moveTo(a.x,a.y-25);ctx.lineTo(a.x-a.side*10,a.y);ctx.moveTo(a.x,a.y-25);ctx.lineTo(a.x+a.side*12,a.y);ctx.stroke();ctx.fillStyle=a.color;ctx.beginPath();ctx.arc(a.x,headY,13,0,Math.PI*2);ctx.fill();const bx=a.x+a.side*20,by=a.y-44;ctx.strokeStyle=a.color;ctx.lineWidth=4;ctx.beginPath();ctx.arc(bx,by,24,ang-Math.PI*.45,ang+Math.PI*.45,a.side<0);ctx.stroke();const tipX=bx+a.side*(24*Math.cos(ang)),tipY=by-24*Math.sin(ang);ctx.strokeStyle='#eafcef';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx-a.side*8,by);ctx.lineTo(tipX,tipY);ctx.stroke();if(a.holding){ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-a.side*(7+a.draw*.14),by+a.draw*.2);ctx.lineTo(bx-a.side*8,by);ctx.stroke();ctx.fillStyle=a.color;ctx.fillRect(a.x-28,a.y-92,56,6);ctx.fillStyle='#fff';ctx.fillRect(a.x-28,a.y-92,56*a.draw/100,6)}}
function render(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0b2014');sky.addColorStop(1,'#102c1c');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.fillStyle='#1b422a';ctx.fillRect(0,ground,W,H-ground);ctx.strokeStyle='#47714e';ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(W,ground);ctx.stroke();ctx.fillStyle='#a9c5b2';ctx.font='bold 15px Arial';ctx.fillText('1P',archers[0].x-10,32);ctx.textAlign='right';ctx.fillText(mode==='local'?'2P':'CPU',archers[1].x+12,32);ctx.textAlign='left';drawArcher(archers[0]);drawArcher(archers[1]);for(const a of arrows){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(Math.atan2(a.vy,a.vx));ctx.strokeStyle=a.color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(17,0);ctx.stroke();ctx.fillStyle=a.color;ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(8,-6);ctx.lineTo(8,6);ctx.closePath();ctx.fill();ctx.restore()}for(const p of particles){ctx.globalAlpha=p.life/25;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}if(mode==='cpu'){ctx.fillStyle='#a9c5b2';ctx.font='12px Arial';ctx.fillText('AI',archers[1].x-8,58)}}
function step(now){if(!playing)return;const dt=Math.min(2.5,(now-lastTime)/16.67);lastTime=now;for(let i=0;i<2;i++){const a=archers[i];if(a.cooldown>0)a.cooldown-=dt;if(a.holding)a.draw=clamp(a.draw+1.25*dt,0,100)}if(mode==='cpu'){cpuClock+=dt;if(cpuClock>90&&archers[1].cooldown<=0&&!archers[1].holding){const a=archers[1],target=archers[0];a.angle=clamp(Math.atan2(target.y-48-a.y,Math.abs(target.x-a.x))+(Math.random()-.5)*.12,-1.2,-.08);startDraw(1);cpuClock=0}if(archers[1].holding&&archers[1].draw>=45+Math.random()*3)releaseDraw(1)}
for(const b of arrows){b.vy+=gravity*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life+=dt;const target=archers[1-b.owner];if(Math.abs(b.x-target.x)<20&&b.y>target.y-92&&b.y<target.y-8){b.dead=true;hit(1-b.owner,b.x,b.y)}if(b.y>ground||b.x<0||b.x>W||b.life>500)b.dead=true}arrows=arrows.filter(a=>!a.dead);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);render();if(playing)requestAnimationFrame(step)}
document.addEventListener('keydown',e=>{if(e.repeat&&['KeyA','KeyD','KeyS','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code))return;if(['ArrowLeft','ArrowRight','ArrowDown','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyA')adjust(0,-.06);if(e.code==='KeyD')adjust(0,.06);if(e.code==='ArrowLeft'&&mode==='local')adjust(1,-.06);if(e.code==='ArrowRight'&&mode==='local')adjust(1,.06);if(e.code==='KeyS')startDraw(0);if(e.code==='ArrowDown'&&mode==='local')startDraw(1);keys.add(e.code)});
document.addEventListener('keyup',e=>{if(e.code==='KeyS')releaseDraw(0);if(e.code==='ArrowDown'&&mode==='local')releaseDraw(1);keys.delete(e.code)});
document.getElementById('done').onclick=()=>location.href='../index.html';if(mode==='online')document.getElementById('message').textContent='온라인 대전 입력은 현재 연결되지 않아 로컬 입력만 지원합니다.';render();requestAnimationFrame(step);
</script></main><div id="miniSoundPanel" style="position:fixed;right:14px;bottom:14px;z-index:9999"><button id="miniSoundToggle" type="button" aria-pressed="true" style="border:1px solid #ffffff35;border-radius:999px;padding:10px 14px;background:#10251a;color:#effff4;font:700 13px Arial,sans-serif;box-shadow:0 6px 22px #0006;cursor:pointer">🔊 소리 켜짐</button></div><script>(function(){let enabled=localStorage.getItem('miniGameSound')!=='off',audio=null,lastKeySound=0;const btn=document.getElementById('miniSoundToggle');function label(){btn.textContent=enabled?'🔊 소리 켜짐':'🔇 소리 꺼짐';btn.setAttribute('aria-pressed',String(enabled))}function sound(kind='ui'){if(!enabled)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audio=audio||new AC();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const seq=kind==='win'?[523,659,784]:kind==='score'?[660,880]:kind==='hit'?[220,165]:kind==='bounce'?[420]:kind==='jump'?[440,660]:kind==='key'?[330]:[520];seq.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='hit'?'triangle':'sine';o.frequency.setValueAtTime(hz,now+i*.075);g.gain.setValueAtTime(.0001,now+i*.075);g.gain.exponentialRampToValueAtTime(((kind==='ui'||kind==='key')?0.035:0.065),now+i*.075+.012);g.gain.exponentialRampToValueAtTime(.0001,now+i*.075+.11);o.connect(g);g.connect(audio.destination);o.start(now+i*.075);o.stop(now+i*.075+.12)})}catch(e){}}window.miniGameSound=sound;btn.addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('miniGameSound',enabled?'on':'off');label();if(enabled)sound('ui')});document.addEventListener('click',e=>{if(e.target.closest('#miniSoundPanel'))return;if(e.target.closest('button'))sound('ui')},true);document.addEventListener('keydown',e=>{if(e.repeat||!['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code))return;const now=performance.now();if(now-lastKeySound>75){sound('key');lastKeySound=now}},true);label()})();</script></body></html>
