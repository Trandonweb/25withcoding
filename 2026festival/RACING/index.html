<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RACING</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050709;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}.hud{position:fixed;top:14px;left:14px;right:14px;z-index:5;display:flex;justify-content:space-between;gap:7px;pointer-events:none}.read{background:#050709d0;border:1px solid #ffffff22;border-radius:12px;padding:7px 11px;min-width:88px}.read small{display:block;font-size:9px;color:#aab2b4;letter-spacing:1px}.read b{font-size:19px}.center{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:5;background:#050709d0;border-radius:20px;padding:7px 12px;font-size:12px}.msg{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:6;font-size:30px;font-weight:1000;text-shadow:0 3px 12px #000;opacity:0;transition:.15s;pointer-events:none}.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#0009}.panel{width:min(450px,calc(100% - 30px));padding:34px;text-align:center;border-radius:24px;background:#09100df5;box-shadow:0 30px 100px #000}.panel h1{font-size:56px;letter-spacing:4px;margin:0}.panel p{color:#bcc4c4;line-height:1.7}.btn{border:0;border-radius:12px;padding:14px 30px;background:#20bd62;color:#fff;font-weight:900;font-size:17px}.hide{display:none}.controls{position:fixed;bottom:18px;left:16px;right:16px;z-index:7;display:flex;justify-content:space-between;pointer-events:none}.cluster{display:flex;gap:8px}.ctrl{pointer-events:auto;width:64px;height:58px;border-radius:15px;border:1px solid #ffffff2d;background:#050709cc;color:#fff;font-size:22px;font-weight:900}.pedal{font-size:10px;width:75px}@media(min-width:900px){.controls{opacity:.2}.controls:hover{opacity:1}}</style></head><body><canvas id="g"></canvas><div class="hud"><div class="read"><small>SPEED</small><b><span id="sp">0</span> km/h</b></div><div class="read"><small>OVERTAKEN</small><b id="ov">0</b></div><div class="read"><small>DISTANCE</small><b><span id="di">0.00</span> km</b></div></div><div class="center" id="gear">P · READY</div><div class="msg" id="msg"></div><div class="screen" id="start"><div class="panel"><h1>RACING</h1><p>이번엔 추월이 목표입니다.<br><b>W / ↑</b> 가속 · <b>S / ↓</b> 브레이크 · <b>A / D</b> 자유 조향<br><b>SPACE</b> 니트로 · 느린 차를 피해 추월하세요.</p><button class="btn" onclick="begin()">START ENGINE</button></div></div><div class="screen hide" id="end"><div class="panel"><h1>CRASH</h1><p><b id="fo">0</b>대 추월 · <b id="fd">0.00</b> km</p><button class="btn" onclick="begin()">RESTART</button></div></div><div class="controls"><div class="cluster"><button class="ctrl" id="l">◀</button><button class="ctrl" id="r">▶</button></div><div class="cluster"><button class="ctrl pedal" id="b">BRAKE</button><button class="ctrl pedal" id="a">GAS</button><button class="ctrl" id="n">⚡</button></div></div><script>
const c=document.getElementById('g'),q=c.getContext('2d');let W,H,D=1,run=0,last=0,t=0,v=0,dist=0,passed=0,px=0,st=0,nit=0,curve=0,travel=0,spawn=0,cars=[],flash=0;const k={};
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;q.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();addEventListener('keydown',e=>{k[e.code]=1;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>k[e.code]=0);function bind(id,key){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();k[key]=1};['pointerup','pointercancel','pointerleave'].forEach(z=>b.addEventListener(z,()=>k[key]=0))}bind('l','ArrowLeft');bind('r','ArrowRight');bind('a','ArrowUp');bind('b','ArrowDown');bind('n','Space');
function begin(){run=1;last=performance.now();t=v=dist=passed=px=st=nit=curve=travel=0;spawn=.7;cars=[];start.classList.add('hide');end.classList.add('hide');requestAnimationFrame(loop)}function crash(){run=0;fd.textContent=dist.toFixed(2);fo.textContent=passed;end.classList.remove('hide')}
function rp(z){z=Math.max(0,Math.min(1,z));let f=z*z;return{w:W*(.045+.91*f),x:W/2+Math.sin(travel*.12+z*3)*curve*W*.18*f,y:H*(.37+.53*f)}}
function spawnTraffic(){// Three proper lanes. Traffic starts at varied gaps and has genuinely different cruising speeds.
 const lane=[-.68,0,.68][Math.floor(Math.random()*3)];const cruise=[105,125,150,175,200,225,250][Math.floor(Math.random()*7)];cars.push({lane,x:lane,z:.01,speed:cruise/330,col:['#df4141','#2e7dd8','#efbd3b','#eeeeee','#8856cc','#24a875'][Math.floor(Math.random()*6)],passed:false,delay:Math.random()})}
function car(x,y,s,col){let w=68*s,h=112*s;q.fillStyle='#0009';q.beginPath();q.ellipse(x,y+h*.43,w*.6,7*s,0,0,7);q.fill();q.fillStyle='#101214';q.fillRect(x-w*.56,y-h*.08,w*.15,h*.46);q.fillRect(x+w*.41,y-h*.08,w*.15,h*.46);q.fillStyle=col;q.beginPath();q.roundRect(x-w/2,y-h/2,w,h,8*s);q.fill();q.fillStyle='#16262c';q.beginPath();q.roundRect(x-w*.32,y-h*.34,w*.64,h*.27,6*s);q.fill();q.fillStyle='#fff1a7';q.fillRect(x-w*.34,y+h*.25,w*.18,5*s);q.fillRect(x+w*.16,y+h*.25,w*.18,5*s)}
function world(){let sky=q.createLinearGradient(0,0,0,H*.52);sky.addColorStop(0,'#091522');sky.addColorStop(.55,'#4c7285');sky.addColorStop(1,'#aab69c');q.fillStyle=sky;q.fillRect(0,0,W,H);q.fillStyle='#284e31';q.fillRect(0,H*.42,W,H*.58);let far=rp(0),near=rp(1);q.fillStyle='#292b2d';q.beginPath();q.moveTo(far.x-far.w/2,far.y);q.lineTo(far.x+far.w/2,far.y);q.lineTo(near.x+near.w/2,near.y);q.lineTo(near.x-near.w/2,near.y);q.closePath();q.fill();q.strokeStyle='#f4f0d7';q.lineWidth=5;q.beginPath();q.moveTo(far.x-far.w/2,far.y);q.lineTo(near.x-near.w/2,near.y);q.moveTo(far.x+far.w/2,far.y);q.lineTo(near.x+near.w/2,near.y);q.stroke();for(let lane of[-.33,.33])for(let i=0;i<14;i++){let z=(i/14+travel*1.3)%1,z2=Math.min(1,z+.03+z*.055),a=rp(z),b=rp(z2);q.strokeStyle='#ffffffb5';q.lineWidth=2+z*4;q.beginPath();q.moveTo(a.x+a.w*lane,a.y);q.lineTo(b.x+b.w*lane,b.y);q.stroke()}for(let i=0;i<18;i++){let z=(i/18+travel*.7)%1,p=rp(z),s=.12+z*.9;for(let side of[-1,1]){let xx=p.x+side*(p.w/2+W*.035*s);q.fillStyle='#173824';q.beginPath();q.arc(xx,p.y-42*s,18*s,0,7);q.fill();q.fillStyle='#85827a';q.fillRect(xx-2*s,p.y-25*s,4*s,25*s)}}cars.slice().sort((a,b)=>a.z-b.z).forEach(a=>{let p=rp(a.z),s=.1+a.z*.95,xx=p.x+(a.x-px)*p.w*.42;car(xx,p.y,s,a.col)})}
function cockpit(){q.fillStyle='#090e0f';q.beginPath();q.moveTo(0,H);q.lineTo(0,H*.87);q.quadraticCurveTo(W*.5,H*.76,W,H*.87);q.lineTo(W,H);q.fill();q.fillStyle='#202829';q.beginPath();q.roundRect(W*.34,H*.87,W*.32,H*.15,25);q.fill();let r=Math.min(W,H)*.09,wx=W/2+st*W*.035,wy=H*.94;q.strokeStyle='#050607';q.lineWidth=Math.max(10,W*.018);q.beginPath();q.arc(wx,wy,r,0,7);q.stroke();q.lineWidth=6;q.beginPath();q.moveTo(wx,wy);q.lineTo(wx,wy+r*.75);q.moveTo(wx,wy);q.lineTo(wx-r*.62,wy+r*.45);q.moveTo(wx,wy);q.lineTo(wx+r*.62,wy+r*.45);q.stroke();q.fillStyle='#070b0c';q.beginPath();q.moveTo(0,0);q.lineTo(W*.055,0);q.lineTo(W*.12,H*.72);q.lineTo(0,H*.8);q.closePath();q.fill();q.beginPath();q.moveTo(W,0);q.lineTo(W*.945,0);q.lineTo(W*.88,H*.72);q.lineTo(W,H*.8);q.closePath();q.fill()}
function update(dt){let gas=k.ArrowUp||k.KeyW,br=k.ArrowDown||k.KeyS,L=k.ArrowLeft||k.KeyA,R=k.ArrowRight||k.KeyD,dir=(R?1:0)-(L?1:0);
 // Acceleration and BRAKING are now physically different. Releasing gas coasts; holding brake actively loses speed.
 let target;if(br)target=Math.max(0,v-260);else target=gas?330:Math.max(0,v-28);if(k.Space)nit=1;else nit=Math.max(0,nit-dt*2.4);target+=nit*150;v+=(target-v)*(1-Math.pow(.00008,dt));
 st+=(dir-st)*(1-Math.pow(.00002,dt));px=clamp(px+st*dt*(.34+v/320),-1.12,1.12);px*=Math.pow(.988,dt*60);travel+=v*dt/900;dist+=v*dt/3600;curve=.55*Math.sin(t*.12)+.28*Math.sin(t*.043+1);
 spawn-=dt;if(spawn<=0){spawnTraffic();spawn=Math.max(.48,1.05-v/620)}
 // Each traffic car has its own speed. Relative motion naturally creates passing situations.
 for(let a of cars)a.z+=dt*((v-a.speed*330)/430);
 for(let a of cars){if(!a.passed&&a.z>1.0){a.passed=true;passed++;flash=.65;msg.textContent='OVERTAKE +1';msg.style.opacity=1;setTimeout(()=>msg.style.opacity=0,250)}if(a.z>.72&&a.z<1.01&&Math.abs(a.x-px)<.20){crash();return}}cars=cars.filter(a=>a.z<1.08&&a.z>-.22);flash=Math.max(0,flash-dt);t+=dt;sp.textContent=Math.round(v);di.textContent=dist.toFixed(2);ov.textContent=passed;gear.textContent=v<1?'P · READY':v<100?'1 · DRIVE':v<180?'2 · DRIVE':v<260?'3 · DRIVE':v<330?'4 · DRIVE':'5 · MAX'}
function loop(now){if(!run)return;let dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);world();cockpit();requestAnimationFrame(loop)}world();cockpit();
</script></body></html>
