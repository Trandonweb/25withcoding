<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>도트 로그라이크 - 고정 배경 버전</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      color: #333;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
      gap: 20px;
      overflow-x: auto;
      
      /* 🌟 깃허브 Raw 이미지 경로 적용 */
      background-image: url('https://raw.githubusercontent.com/Trandonweb/25withcoding/main/25withcoding/2026festival/RoguelikeGame_code/1.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      z-index: 1;
    }

    /* 🌟 배경 이미지가 너무 튀지 않게 밝은 틴트(막)를 씌움 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.4);
      z-index: -1;
    }

    /* ℹ️ 왼쪽 가이드 & 사이드 메뉴 박스 */
    #howto-container {
      background-color: rgba(255, 255, 255, 0.9); 
      border: 4px solid #009688;
      box-shadow: 0 0 20px rgba(0, 150, 136, 0.3);
      width: 300px;
      padding: 18px;
      text-align: left;
      font-size: 12px;
      line-height: 1.7;
      color: #333;
      display: flex;
      flex-direction: column;
    }

    #howto-container h2 {
      font-size: 15px;
      color: #009688;
      margin-top: 0;
      margin-bottom: 14px;
      text-shadow: 1px 1px #eee;
      border-bottom: 3px solid #009688;
      padding-bottom: 8px;
    }

    .guide-item { margin-bottom: 12px; }
    .guide-sym { font-size: 15px; margin-right: 6px; }

    .side-btn-container {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #btn-restart, #btn-save {
      font-size: 12px;
      padding: 12px;
      text-align: center;
      border-width: 3px;
      border-style: solid;
      font-family: 'Press Start 2P', monospace;
      cursor: pointer;
      transition: 0.1s;
    }
    #btn-restart { background-color: #e0f2f1; border-color: #009688; color: #00796b; }
    #btn-restart:hover:not(:disabled) { background-color: #009688; color: #fff; }
    #btn-save { background-color: #fce4ec; border-color: #e91e63; color: #c2185b; }
    #btn-save:hover:not(:disabled) { background-color: #e91e63; color: #fff; }

    /* 메인 컨테이너 */
    #game-container {
      background-color: rgba(255, 255, 255, 0.9); 
      border: 6px solid #009688;
      box-shadow: 0 0 30px rgba(0, 150, 136, 0.4);
      width: 100%;
      max-width: 680px;
      padding: 20px;
      text-align: center;
      color: #222;
    }

    h1 {
      font-size: 22px;
      color: #e91e63;
      margin-top: 0;
      margin-bottom: 15px;
      text-shadow: 2px 2px #fce4ec;
      letter-spacing: 2px;
    }

    /* 🗺️ 미니맵 */
    #map-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      width: 250px;
      margin: 0 auto 15px auto;
      background-color: rgba(240, 240, 240, 0.9);
      padding: 8px;
      border: 3px solid #ccc;
    }

    .map-cell {
      width: 44px;
      height: 44px;
      background-color: #fff;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.2s ease;
      color: #333;
    }

    .player-img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      display: block;
    }

    .map-cell.active {
      background-color: #e0f2f1 !important;
      border-color: #009688 !important;
      box-shadow: inset 0 0 8px rgba(0, 150, 136, 0.4);
    }
    .map-cell.theme-start { background-color: #e3f2fd; border-color: #90caf9; }
    .map-cell.theme-monster { background-color: #ffebee; border-color: #ef9a9a; }
    .map-cell.theme-treasure { background-color: #fff8e1; border-color: #ffe082; }
    .map-cell.theme-merchant { background-color: #e8f5e9; border-color: #a5d6a7; }
    .map-cell.theme-armory { background-color: #f3e5f5; border-color: #ce93d8; }
    .map-cell.theme-boss { background-color: #ffcdd2; border-color: #f44336; animation: blink 1s infinite; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    #situation-text {
      font-size: 14px;
      color: #111;
      margin-bottom: 15px;
      min-height: 70px;
      line-height: 1.6;
      border-left: 5px solid #e91e63;
      padding-left: 10px;
      text-align: left;
    }

    #status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 15px;
      border-bottom: 3px solid #ccc;
      padding-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* 로그 박스 */
    #log-box {
      background-color: rgba(245, 245, 245, 0.9);
      border: 2px solid #ccc;
      height: 110px;
      overflow-y: auto;
      font-size: 12px;
      text-align: left;
      padding: 10px;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .log-entry { margin-bottom: 6px; }
    .system { color: #0277bd; }
    .danger { color: #d32f2f; font-weight: bold; }
    .success { color: #2e7d32; font-weight: bold; }
    .weapon { color: #8e24aa; font-weight: bold; }

    .choice-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      background-color: #f9f9f9;
      color: #333;
      border: 3px solid #bbb;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 13px 13px;
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
      transition: 0.1s;
    }

    button:hover:not(:disabled) {
      background-color: #009688;
      color: #fff;
      border-color: #009688;
      transform: scale(1.01);
    }
    button:disabled { background-color: #eee; color: #999; border-color: #ddd; cursor: not-allowed; }

    @media (max-width: 950px) {
      body { flex-direction: column; align-items: center; }
      #howto-container { width: 100%; max-width: 680px; box-sizing: border-box; }
    }
  </style>
