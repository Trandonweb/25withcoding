<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>로그아웃 중</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f0f0f0;color:#222;font-family:'Malgun Gothic',sans-serif}
    main{text-align:center;padding:28px;border-radius:18px;background:#fff;box-shadow:0 8px 30px #0001}
  </style>
</head>
<body>
  <main><p id="status" role="status" aria-live="polite">로그아웃 중입니다.</p></main>
  <script>
    const params=new URLSearchParams(location.search);
    const requested=params.get("redirect")||"/";
    const redirect=requested.startsWith("/")&&!requested.startsWith("//")?requested:"/";
    try {
      localStorage.removeItem("userId");
      localStorage.removeItem("firebaseIdToken");
      localStorage.removeItem("firebaseRefreshToken");
      sessionStorage.clear();
    } catch (error) {
      document.getElementById("status").textContent="로그아웃 정보를 정리하지 못했습니다. 브라우저 설정을 확인해 주세요.";
      throw error;
    }
    location.replace(redirect);
  </script>
</body>
</html>
