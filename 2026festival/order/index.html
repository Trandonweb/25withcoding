<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>축제 주문</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f6f8;color:#222}button{font:inherit;cursor:pointer}.role-screen{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:#111;color:#fff}.role-screen h1{font-size:28px}.role-screen p{color:#aaa}.app{display:none;height:100vh}.client{width:100%;height:100%;display:grid;grid-template-columns:3fr 1fr}.menu{padding:28px;overflow:auto}.menu h1{margin:0 0 22px;font-size:32px}.kiosk{color:#168a4b;font-size:16px;margin-bottom:6px}.menus{display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:20px}.menu-card{border:0;border-radius:20px;background:#fff;padding:28px;min-height:190px;text-align:left;box-shadow:0 5px 18px #00000012;transition:.15s;position:relative}.menu-card:hover{transform:translateY(-2px)}.menu-card .name{font-size:27px;font-weight:800}.menu-card .price{font-size:22px;margin-top:12px;color:#168a4b}.controls{display:flex;align-items:center;gap:10px;margin-top:25px}.qty-btn{width:48px;height:48px;border:0;border-radius:12px;background:#168a4b;color:#fff;font-size:28px;font-weight:700}.qty-btn.minus{background:#e5e7e9;color:#222}.qty-num{min-width:42px;text-align:center;font-size:24px;font-weight:800}.cart{background:#fff;border-left:1px solid #ddd;padding:24px;display:flex;flex-direction:column;min-width:280px}.cart h2{margin:0 0 18px}.cart-list{flex:1;overflow:auto}.cart-item{padding:13px 0;border-bottom:1px solid #eee}.cart-item-row{display:flex;justify-content:space-between;gap:8px}.qty{font-size:14px;color:#777}.total{border-top:2px solid #222;padding-top:18px;font-size:25px;font-weight:800}.paidbox{margin-top:12px;padding:12px;border-radius:10px;background:#e9f8ef;color:#168a4b;font-weight:700;text-align:center}.host{height:100vh;padding:24px;display:flex;flex-direction:column}.host-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.host h1{margin:0}.host-list{background:#fff;border-radius:14px;overflow:auto;flex:1}.order-row{display:grid;grid-template-columns:90px 1fr 150px 150px 120px;gap:15px;padding:18px;border-bottom:1px solid #eee;align-items:center}.order-row.header{font-weight:800;background:#f1f3f5;position:sticky;top:0}.status{font-weight:700}.paid{color:#168a4b}.empty{padding:40px;text-align:center;color:#888}.hint{font-size:13px;color:#888;margin-top:8px}.pay-kiosk{background:#168a4b;color:#fff;border:0;border-radius:8px;padding:9px 12px;font-weight:700}.pay-kiosk:disabled{background:#bbb}.host-total{font-size:25px;font-weight:800;margin:0 0 16px}
@media(max-width:800px){.client{grid-template-columns:1fr}.cart{border-left:0;border-top:1px solid #ddd;height:38vh}.menu{height:62vh;padding:16px}.menus{grid-template-columns:1fr 1fr;gap:10px}.menu-card{min-height:145px;padding:16px}.menu-card .name{font-size:20px}.menu-card .price{font-size:17px}.controls{margin-top:12px}.qty-btn{width:40px;height:40px}.qty-num{font-size:20px}.order-row{grid-template-columns:55px 1fr 90px 90px 80px;font-size:13px}}
</style>
</head>
<body>
<div id="roleScreen" class="role-screen"><div><h1>콘솔 명령어로 역할을 지정하세요.</h1><p>role.change("host,1") 또는 role.change("client,1")</p></div></div>
<div id="clientApp" class="app"><div class="client"><main class="menu"><div id="clientKiosk" class="kiosk"></div><h1>주문하기</h1><div id="menus" class="menus"></div></main><aside class="cart"><h2>담은 메뉴</h2><div id="cartList" class="cart-list"><div class="empty">아직 담은 메뉴가 없습니다.</div></div><div class="total">총 <span id="total">0</span>원</div><div id="paidBox"></div></aside></div></div>
<div id="hostApp" class="app"><div class="host"><div class="host-top"><div><h1>주문 관리자</h1><div class="hint" id="hostInfo"></div></div><div class="host-total">총 매출 <span id="hostTotal">0</span>원</div></div><div class="host-list"><div class="order-row header"><div>키오스크</div><div>메뉴 / 수량</div><div>금액</div><div>상태</div><div>처리</div></div><div id="hostList"></div></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import{getFirestore,doc,onSnapshot,setDoc,updateDoc}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9Q",authDomain:"festivallikes.firebaseapp.com",projectId:"festivallikes",storageBucket:"festivallikes.firebasestorage.app",messagingSenderId:"782245120700",appId:"1:782245120700:web:c61e16313e9ae688e6deb9"};
const db=getFirestore(initializeApp(firebaseConfig));
const PASSWORD="25쟈소채야ㅜㅎ";
const menus=[{id:"m1",name:"메뉴 1",price:3000},{id:"m2",name:"메뉴 2",price:4000},{id:"m3",name:"메뉴 3",price:5000},{id:"m4",name:"메뉴 4",price:6000}];
let role=null,kiosks=[],orders={};
window.role={change(value){if(typeof value!=="string"){console.warn('role.change("host,1") 형식으로 입력하세요.');return}const p=value.split(",").map(x=>x.trim());if(!["host","client"].includes(p[0])){console.warn("host 또는 client만 사용할 수 있습니다.");return}if(p[0]==="host"){let raw=p.slice(1);if(raw.length===1&&raw[0].includes("-")){const[a,b]=raw[0].split("-").map(Number);if(Number.isInteger(a)&&Number.isInteger(b)&&a>=1&&b>=a&&b-a<4)raw=Array.from({length:b-a+1},(_,i)=>String(a+i))}if(!raw.length||raw.length>4||raw.some(x=>!/^[1-9]\d*$/.test(x))||new Set(raw).size!==raw.length){console.warn("host는 최대 4개의 키오스크 번호를 지정할 수 있습니다. 예: host,1-4 또는 host,1,3");return}role="host";kiosks=raw}else{if(p.length!==2||!/^[1-9]\d*$/.test(p[1])){console.warn("client는 client,1 형식으로 입력하세요.");return}role="client";kiosks=[p[1]]}console.log("enter password");}};
window.password={enter(value){if(value!==PASSWORD){console.warn("password incorrect");return}if(!role){console.warn("먼저 role.change(...)를 실행하세요.");return}start();}};
const money=n=>Number(n||0).toLocaleString("ko-KR"),emptyOrder=()=>({items:{},total:0,status:"waiting",updatedAt:Date.now()});
function renderMenus(){document.getElementById("menus").innerHTML=menus.map(m=>`<div class="menu-card"><div class="name">${m.name}</div><div class="price">${money(m.price)}원</div><div class="controls"><button class="qty-btn minus" data-id="${m.id}" data-delta="-1">−</button><div class="qty-num" id="qty-${m.id}">0</div><button class="qty-btn" data-id="${m.id}" data-delta="1">+</button></div></div>`).join("");document.querySelectorAll(".qty-btn").forEach(b=>b.onclick=()=>changeQty(b.dataset.id,Number(b.dataset.delta)));}
async function changeQty(id,delta){const kiosk=kiosks[0],current=orders[kiosk]||emptyOrder();if(current.status==='paid')return;const items={...(current.items||{})};items[id]=Math.max(0,(items[id]||0)+delta);if(items[id]===0)delete items[id];const total=menus.reduce((s,m)=>s+m.price*(items[m.id]||0),0);await setDoc(doc(db,"festivalOrders","kiosk-"+kiosk),{items,total,status:"waiting",updatedAt:Date.now(),kiosk});}
function renderClient(o){menus.forEach(m=>{const el=document.getElementById("qty-"+m.id);if(el)el.textContent=o.items?.[m.id]||0});const rows=menus.filter(m=>o.items?.[m.id]).map(m=>`<div class="cart-item"><div class="cart-item-row"><b>${m.name}</b><b>${money(m.price*(o.items[m.id]||0))}원</b></div><div class="qty">${o.items[m.id]}개 × ${money(m.price)}원</div></div>`).join("");document.getElementById("cartList").innerHTML=rows||'<div class="empty">아직 담은 메뉴가 없습니다.</div>';document.getElementById("total").textContent=money(o.total);document.getElementById("paidBox").innerHTML=o.status==='paid'?'<div class="paidbox">결제 완료</div>':'';document.querySelectorAll('.qty-btn').forEach(b=>b.disabled=o.status==='paid');}
function renderHost(){let html="",grand=0;for(const k of kiosks){const o=orders[k]||emptyOrder();grand+=Number(o.total||0);const items=menus.filter(m=>o.items?.[m.id]);if(!items.length){html+=`<div class="order-row"><div>${k}번</div><div>주문 없음</div><div>0원</div><div>-</div><div>-</div></div>`}else{for(const m of items){html+=`<div class="order-row"><div>${k}번</div><div>${m.name} × ${o.items[m.id]}</div><div>${money(m.price*o.items[m.id])}원</div><div class="status ${o.status==='paid'?'paid':''}">${o.status==='paid'?'결제 완료':'결제 대기'}</div><div><button class="pay-kiosk" data-kiosk="${k}" ${o.status==='paid'?'disabled':''}>결제 완료</button></div></div>`}}}document.getElementById("hostList").innerHTML=html;document.getElementById("hostTotal").textContent=money(grand);document.querySelectorAll('.pay-kiosk').forEach(b=>b.onclick=()=>pay(b.dataset.kiosk));}
async function pay(k){await updateDoc(doc(db,"festivalOrders","kiosk-"+k),{status:"paid",paidAt:Date.now()});}
function start(){document.getElementById("roleScreen").style.display="none";if(role==='client'){document.getElementById("clientApp").style.display="block";document.getElementById("clientKiosk").textContent=kiosks[0]+"번 키오스크";renderMenus();const k=kiosks[0];onSnapshot(doc(db,"festivalOrders","kiosk-"+k),s=>{orders[k]=s.exists()?s.data():emptyOrder();renderClient(orders[k]);});}else{document.getElementById("hostApp").style.display="block";document.getElementById("hostInfo").textContent="관리 키오스크: "+kiosks.join(", ")+"번";kiosks.forEach(k=>onSnapshot(doc(db,"festivalOrders","kiosk-"+k),s=>{orders[k]=s.exists()?s.data():emptyOrder();renderHost();}));}}
</script>
</body>
</html>
