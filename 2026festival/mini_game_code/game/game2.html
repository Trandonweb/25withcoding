<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>영역 채우기 | MINI GAME</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#071b12,#123b27);color:#fff;display:flex;align-items:center;justify-content:center}.wrap{width:min(760px,94vw);text-align:center}.top{display:flex;justify-content:space-between;opacity:.75}h1{font-size:clamp(34px,6vw,54px);margin:12px 0 4px}.timer{font-size:32px;font-weight:900}.score{display:flex;justify-content:center;gap:45px;font-weight:800;margin:5px}.score span{font-size:34px}.board{margin:15px auto;width:min(78vw,560px);aspect-ratio:1;display:grid;gap:4px;padding:6px;background:rgba(255,255,255,.08);border-radius:14px}.cell{border:0;border-radius:5px;background:rgba(255,255,255,.08);cursor:pointer}.cell.me{background:#27ae60}.cell.opp{background:#e74c3c}.info{min-height:28px;font-size:17px}.done{margin-top:14px;border:0;border-radius:14px;padding:14px 28px;background:#1ea857;color:#fff;font-weight:800;font-size:17px;cursor:pointer}.note{font-size:13px;color:#ffd98a;margin-top:8px}.hidden{display:none!important}</style></head><body><div class="wrap"><div class="top"><span id="round"></span><span id="mode"></span></div><h1>🟩 영역 채우기</h1><div>30초 동안 계속 뺏고 뺏깁니다.</div><div class="timer" id="timer">30</div><div class="score"><div>나 <span id="me">0</span></div><div>상대 <span id="opp">0</span></div></div><div class="board" id="board"></div><div class="info" id="info"></div><div class="note hidden" id="note">온라인 상대 입력은 연결 후 반영됩니다.</div><button class="done hidden" id="done">결과 확인 →</button></div><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu',modeName:'컴퓨터와 대전'};const mode=s.mode||'cpu';const size=5+Math.floor(Math.random()*3);let cells=Array(size*size).fill(0),left=30,playing=true,timer,ai;const board=document.getElementById('board'),me=document.getElementById('me'),opp=document.getElementById('opp'),info=document.getElementById('info');document.getElementById('mode').textContent=s.modeName||'컴퓨터와 대전';document.getElementById('round').textContent=s.round?`${s.round}번째 게임`:'';board.style.gridTemplateColumns=`repeat(${size},1fr)`;for(let i=0;i<cells.length;i++){const b=document.createElement('button');b.className='cell';b.onclick=()=>claim(i,1);board.appendChild(b)}function render(){me.textContent=cells.filter(x=>x===1).length;opp.textContent=cells.filter(x=>x===2).length;[...board.children].forEach((b,i)=>b.className='cell'+(cells[i]===1?' me':cells[i]===2?' opp':''))}function claim(i,who){if(!playing||cells[i]===who)return;cells[i]=who;render()}function keyClaim(who){const a=cells.map((v,i)=>v!==who?i:-1).filter(i=>i>=0);if(a.length)claim(a[Math.floor(Math.random()*a.length)],who)}if(mode==='cpu'){ai=setInterval(()=>keyClaim(2),700)}else if(mode==='online')document.getElementById('note').classList.remove('hidden');timer=setInterval(()=>{left--;document.getElementById('timer').textContent=left;if(left<=0)finish()},1000);document.addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k==='a')keyClaim(1);if(k==='l'&&mode==='local')keyClaim(2)});function finish(){if(!playing)return;playing=false;clearInterval(timer);clearInterval(ai);const a=cells.filter(x=>x===1).length,b=cells.filter(x=>x===2).length,w=a>b?'me':a<b?'opp':'draw';info.textContent=w==='me'?'🎉 승리!':w==='opp'?'😮 패배!':'🤝 무승부!';document.getElementById('done').classList.remove('hidden');localStorage.setItem('miniGameResult',JSON.stringify({game:'🟩 영역 채우기',winner:w,me:a,opp:b}))}document.getElementById('done').onclick=()=>location.href='../index.html';render();</script></body></html>
