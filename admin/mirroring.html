<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>화면 모니터링</title>
<style>
:root{--bg:#f0f0f0;--panel:#fff;--text:#111;--muted:#777;--primary:var(--primary-color,#27ae60)}
body.dark-mode{--bg:#101010;--panel:#1b1b1b;--text:#fff;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:sans-serif}header{height:70px;padding:0 20px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--primary);box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:20}.left{display:flex;align-items:center;gap:15px}header h2{margin:0;color:var(--primary);font-size:21px}button{border:0;border-radius:9px;padding:9px 13px;font-weight:bold;cursor:pointer}#back{background:var(--primary);color:#fff}#online{font-weight:bold}#grid{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;max-width:1800px;margin:auto}.cctv{position:relative;background:#080808;border:2px solid #333;border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:16/10;box-shadow:0 4px 14px #0003}.cctv video{width:100%;height:100%;display:block;object-fit:contain;background:#000}.top{position:absolute;left:0;right:0;top:0;padding:9px 11px;background:linear-gradient(#000b,transparent);color:#fff;display:flex;justify-content:space-between;pointer-events:none}.name{font-weight:bold;font-size:15px}.status{font-size:12px;font-weight:bold}.status.connecting{color:#ffd166}.status.live{color:#7cff9a}.status.waiting{color:#ddd}.status.error{color:#ff7777}.status::before{content:'●';margin-right:5px}.bottom{position:absolute;left:0;right:0;bottom:0;padding:8px 11px;background:linear-gradient(transparent,#000c);color:#ddd;font-size:12px;pointer-events:none}.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}#viewer{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:100}#viewerBox{width:min(94vw,1400px);height:min(92vh,900px);background:#111;border:1px solid #444;border-radius:14px;overflow:hidden;box-shadow:0 15px 50px #000;display:flex;flex-direction:column}#viewerTop{height:58px;flex:none;padding:0 14px;display:flex;align-items:center;justify-content:space-between;color:#fff;background:#181818;border-bottom:1px solid #333}#viewerTitle{margin:0;font-size:18px}.viewer-status{font-size:12px;margin-left:10px}.viewer-status.live{color:#7cff9a}.viewer-status.error{color:#ff7777}.viewer-status.connecting{color:#ffd166}#closeViewer{background:#e74c3c;color:#fff}#bigVideo{width:100%;height:calc(100% - 58px);object-fit:contain;background:#000}@media(max-width:600px){header{height:62px;padding:0 10px}header h2{font-size:17px}#grid{padding:10px;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.left{gap:8px}#online{font-size:12px}}
</style>
</head>
<body>
<header><div class="left"><button id="back">← 홈</button><div id="online">🟢 접속 0명</div></div><h2>📹 화면 모니터링</h2></header>
<main id="grid"><div class="empty">접속한 학생의 화면을 불러오는 중...</div></main>
<div id="viewer"><div id="viewerBox"><div id="viewerTop"><h2 id="viewerTitle">학생 화면 <span class="viewer-status connecting">● 연결 중</span></h2><button id="closeViewer">닫기</button></div><video id="bigVideo" autoplay playsinline></video></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import{getFirestore,collection,onSnapshot,doc,getDoc,updateDoc,arrayUnion,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",authDomain:"points2026-f5e50.firebaseapp.com",projectId:"points2026-f5e50",storageBucket:"points2026-f5e50.firebasestorage.app",messagingSenderId:"248724251417",appId:"1:248724251417:web:02d85cdc4addac98069b88"};
const db=getFirestore(initializeApp(firebaseConfig));
try{const s=JSON.parse(localStorage.getItem("coding_with_ramen_settings")||"{}");document.body.classList.toggle("dark-mode",!!s.darkMode);if(s.primaryColor)document.documentElement.style.setProperty("--primary-color",s.primaryColor)}catch(e){}
const adminId=localStorage.getItem("userId");if(!adminId){alert("로그인이 필요합니다.");location.href="/signin?redirect=/admin/mirroring.html";throw new Error("로그인 필요")}
const TURN_API="https://two5withcoding.onrender.com/turn-credentials";
let rtcConfig={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
let iceServersLoaded=false;
const sessions=new Map(),busy=new Set();let selectedId=null;
async function loadIceServers(){if(iceServersLoaded)return;try{const r=await fetch(TURN_API,{cache:"no-store"});if(!r.ok)throw new Error("TURN HTTP "+r.status);const servers=await r.json();if(!Array.isArray(servers)||!servers.length)throw new Error("빈 TURN 목록");rtcConfig={iceServers:[{urls:"stun:stun.l.google.com:19302"},...servers]};iceServersLoaded=true;console.log("[ADMIN] TURN 서버 로드 완료")}catch(e){console.warn("[ADMIN] TURN 로드 실패. STUN으로 계속합니다.",e)}}
function findCard(id){for(const c of document.querySelectorAll(".cctv"))if(c.dataset.id===id)return c;return null}
function setCardStatus(id,type,text){const c=findCard(id);const el=c?.querySelector(".status");if(el){el.className="status "+type;el.textContent=text}}
function setViewerStatus(type,text){const el=document.querySelector("#viewerTitle .viewer-status");if(el){el.className="viewer-status "+type;el.textContent=text}}
function makeCard(id,d){const c=document.createElement("div");c.className="cctv";c.dataset.id=id;const v=document.createElement("video");v.autoplay=true;v.muted=true;v.playsInline=true;const top=document.createElement("div");top.className="top";const n=document.createElement("span");n.className="name";n.textContent=d.name||id;const st=document.createElement("span");st.className="status connecting";st.textContent="연결 중";top.append(n,st);const b=document.createElement("div");b.className="bottom";b.textContent=`ID: ${id} · ${d.mode||"webrtc"}`;c.append(v,top,b);c.onclick=()=>openViewer(id);return c}
function markError(id,text){setCardStatus(id,"error",text);if(selectedId===id)setViewerStatus("error","● "+text)}
async function verifyInbound(id){const s=sessions.get(id);if(!s)return;try{const stats=await s.pc.getStats();let received=false;stats.forEach(r=>{if(r.type==="inbound-rtp"&&(r.kind==="video"||r.mediaType==="video")&&(Number(r.bytesReceived||0)>0||Number(r.packetsReceived||0)>0))received=true});if(received){s.receiving=true;setCardStatus(id,"live","LIVE");if(selectedId===id)setViewerStatus("live","● LIVE")}else if(s.pc.connectionState==="connected")markError(id,"영상 없음")}catch(e){console.warn("[ADMIN] stats",e)}}
async function stopSession(id,clear=true){const s=sessions.get(id);if(!s)return;if(s.unsubscribe)try{s.unsubscribe()}catch(e){}if(s.timer)clearInterval(s.timer);try{s.pc.close()}catch(e){}sessions.delete(id);if(selectedId===id)closeViewer();if(clear)try{await updateDoc(doc(db,"users",id),{sharing:false,sharingStartedAt:null,adminAnswer:null,adminCandidates:[]})}catch(e){}}
async function connectStudent(id,d){if(busy.has(id)||sessions.has(id)||!d.clientOffer)return;const sid=d.clientOffer.sessionId||d.sessionId;if(!sid)return;busy.add(id);try{await loadIceServers();const ref=doc(db,"users",id),pc=new RTCPeerConnection(rtcConfig),s={pc,sessionId:sid,candidates:new Set(),unsubscribe:null,timer:null,stream:null,receiving:false};sessions.set(id,s);setCardStatus(id,"connecting","연결 중");pc.ontrack=e=>{const stream=e.streams?.[0];if(!stream)return;s.stream=stream;const c=findCard(id);const v=c?.querySelector("video");if(v){v.srcObject=stream;v.play().catch(()=>{})}if(selectedId===id){const big=document.getElementById("bigVideo");big.srcObject=stream;big.play().catch(()=>{})}stream.getVideoTracks().forEach(t=>t.onended=()=>markError(id,"영상 공유 종료"));setTimeout(()=>verifyInbound(id),500)};pc.onicecandidate=async e=>{if(!e.candidate)return;try{await updateDoc(ref,{adminCandidates:arrayUnion(e.candidate.toJSON()),updatedAt:serverTimestamp()})}catch(x){console.warn("[ADMIN] ICE",x)}};pc.onconnectionstatechange=()=>{const state=pc.connectionState;if(state==="connected"){setCardStatus(id,"waiting","영상 확인 중");if(selectedId===id)setViewerStatus("connecting","● 영상 확인 중");setTimeout(()=>verifyInbound(id),500)}else if(state==="connecting"||state==="new"){setCardStatus(id,"connecting","연결 중");if(selectedId===id)setViewerStatus("connecting","● 연결 중")}else if(state==="disconnected")markError(id,"연결 끊김");else if(state==="failed")markError(id,"연결 실패");else if(state==="closed")markError(id,"연결 종료")};await pc.setRemoteDescription(new RTCSessionDescription({type:d.clientOffer.type,sdp:d.clientOffer.sdp}));const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await updateDoc(ref,{sharing:true,sharingStartedAt:serverTimestamp(),adminAnswer:{type:answer.type,sdp:answer.sdp,sessionId:sid},adminCandidates:[],updatedAt:serverTimestamp()});s.unsubscribe=onSnapshot(ref,async snap=>{const x=snap.data();if(!x||!x.online||x.sessionId!==sid||!Array.isArray(x.adminCandidates)||!pc.currentRemoteDescription)return;for(const q of x.adminCandidates){const key=JSON.stringify(q);if(s.candidates.has(key))continue;try{await pc.addIceCandidate(new RTCIceCandidate(q));s.candidates.add(key)}catch(e){console.warn("[ADMIN] candidate",e)}}});s.timer=setInterval(()=>verifyInbound(id),3000)}catch(e){console.error("[ADMIN] 연결 실패",id,e);markError(id,"연결 실패");await stopSession(id,false)}finally{busy.delete(id)}}
function openViewer(id){const s=sessions.get(id);if(!s)return;selectedId=id;const c=findCard(id);const title=document.getElementById("viewerTitle");title.textContent=c?.querySelector(".name")?.textContent||id;const badge=document.createElement("span");badge.className="viewer-status "+(s.receiving?"live":"connecting");badge.textContent=s.receiving?"● LIVE":"● 연결 확인 중";title.appendChild(badge);document.getElementById("bigVideo").srcObject=s.stream||null;document.getElementById("bigVideo").play().catch(()=>{});document.getElementById("viewer").style.display="flex";verifyInbound(id)}
function closeViewer(){document.getElementById("viewer").style.display="none";document.getElementById("bigVideo").srcObject=null;selectedId=null}
document.getElementById("closeViewer").onclick=closeViewer;document.getElementById("viewer").onclick=e=>{if(e.target.id==="viewer")closeViewer()};document.onkeydown=e=>{if(e.key==="Escape")closeViewer()};document.getElementById("back").onclick=()=>location.href="/admin/index.html";
function renderEmpty(){const g=document.getElementById("grid");if(!g.children.length)g.innerHTML='<div class="empty">현재 접속 중인 학생이 없습니다.</div>'}
function loadUsers(){onSnapshot(collection(db,"users"),snap=>{const g=document.getElementById("grid"),seen=new Set();let online=0;for(const u of snap.docs){const id=u.id;if(id===adminId)continue;const d=u.data();if(d.online!==true)continue;online++;seen.add(id);if(!findCard(id)){g.querySelector(".empty")?.remove();g.appendChild(makeCard(id,d))}if(!sessions.has(id)&&d.clientOffer)connectStudent(id,d)}for(const id of [...sessions.keys()])if(!seen.has(id))stopSession(id,true);g.querySelectorAll(".cctv").forEach(c=>{if(!seen.has(c.dataset.id))c.remove()});document.getElementById("online").textContent=`🟢 접속 ${online}명`;renderEmpty()},e=>console.error("[ADMIN] users snapshot",e))}
(async()=>{try{const s=await getDoc(doc(db,"users",adminId));if(!s.exists()||!["president","vice"].includes(s.data().role)){alert("관리자만 접근 가능합니다.");location.href="/";return}await loadIceServers();loadUsers()}catch(e){console.error("[ADMIN] 초기화 실패",e);alert("화면 모니터링을 불러오지 못했습니다. 콘솔을 확인해주세요.")}})();
</script>
</body>
</html>
