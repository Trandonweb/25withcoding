<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>로그아웃 중</title>
</head>
<body>
  <p>로그아웃 중입니다.</p>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",
      authDomain: "points2026-f5e50.firebaseapp.com",
      projectId: "points2026-f5e50",
      storageBucket: "points2026-f5e50.firebasestorage.app",
      messagingSenderId: "248724251417",
      appId: "1:248724251417:web:02d85cdc4addac98069b88"
    };
    const auth = getAuth(initializeApp(firebaseConfig));
    const params = new URLSearchParams(window.location.search);
    const requested = params.get("redirect") || "/";
    const redirect = requested.startsWith("/") && !requested.startsWith("//") ? requested : "/";

    try {
      await signOut(auth);
      localStorage.removeItem("userId");
      localStorage.removeItem("firebaseIdToken");
      localStorage.removeItem("firebaseRefreshToken");
      location.replace(redirect);
    } catch (error) {
      console.error("Firebase 로그아웃 실패", error);
      document.body.innerHTML = "";
      const message = document.createElement("p");
      message.textContent = "로그아웃을 완료하지 못했습니다. 네트워크 연결을 확인한 뒤 다시 시도해 주세요.";
      document.body.append(message);
      const retry = document.createElement("button");
      retry.type = "button";
      retry.textContent = "다시 시도";
      retry.onclick = () => location.reload();
      document.body.append(retry);
    }
  </script>
</body>
</html>
