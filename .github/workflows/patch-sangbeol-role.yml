name: Patch sangbeol role display
on:
  push:
    paths:
      - .github/workflows/patch-sangbeol-role.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('상벌점/main.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('      --role-vice-text: #4f46e5;\n\n      --warning-bg:', '      --role-vice-text: #4f46e5;\n\n      --role-committee-bg: #d1fae5;\n      --role-committee-text: #047857;\n\n      --warning-bg:', 1)
          s=s.replace('      --role-vice-text: #818cf8;\n\n      --warning-bg:', '      --role-vice-text: #818cf8;\n\n      --role-committee-bg: #064e3b;\n      --role-committee-text: #6ee7b7;\n\n      --warning-bg:', 1)
          s=s.replace('    .role-vice {\n      background: var(--role-vice-bg);\n      color: var(--role-vice-text);\n    }\n\n    .action-row', '    .role-vice {\n      background: var(--role-vice-bg);\n      color: var(--role-vice-text);\n    }\n\n    .role-committee {\n      background: var(--role-committee-bg);\n      color: var(--role-committee-text);\n    }\n\n    .action-row', 1)
          s=s.replace('  if (role === "vice") {\n    return `<span class="role-badge role-vice">부회장</span>`;\n  }\n  return `<span class="role-badge">학생</span>`;', '  if (role === "vice") {\n    return `<span class="role-badge role-vice">부회장</span>`;\n  }\n  if (role === "committee_chair") {\n    return `<span class="role-badge role-committee">상벌관리위원회장</span>`;\n  }\n  return `<span class="role-badge">학생</span>`;', 1)
          s=s.replace('  if (role === "vice") return "부회장";\n  return "학생";', '  if (role === "vice") return "부회장";\n  if (role === "committee_chair") return "상벌관리위원회장";\n  return "학생";', 1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '상벌점/main.html'
          git rm .github/workflows/patch-sangbeol-role.yml
          git commit -m '상벌점 페이지에 상벌관리위원회장 권한 표시 추가'
          git push
