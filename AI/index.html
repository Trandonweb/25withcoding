<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#27ae60"><title>Coby AI</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/profile-menu.css"><link rel="stylesheet" href="css/menu-button.css"><link rel="stylesheet" href="css/settings.css"><link rel="stylesheet" href="coby-markup.css"><style>.thinking-indicator{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #e5e5e5;border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 3px 14px rgba(0,0,0,.08);z-index:25;color:#666;font-size:12px}.thinking-indicator[hidden]{display:none}.thinking-dot{width:7px;height:7px;border-radius:50%;background:#27ae60;animation:cobyThinking 1s infinite ease-in-out}.send.stop{background:#555;font-size:14px}.send.stop:hover{background:#333}@keyframes cobyThinking{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}@media(max-width:767px){.thinking-indicator{bottom:86px;font-size:11px}}</style></head><body><header class="header"><button class="menu-btn" onclick="document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')" aria-label="메뉴 열기"><span aria-hidden="true">☰</span></button><div class="logo"><img src="COBY_AI_logo.png" alt="Coby AI" id="cobyLogo"></div><div class="user-status"><span class="status-dot" id="statusDot"></span><span class="status-text" id="statusText">사용자 확인 중...</span></div></header><aside class="sidebar" id="sidebar"><div class="side-top"><button class="side-btn" onclick="newChat()">＋ 새 채팅</button><button class="side-btn" onclick="openProjectModal()">📁 새 프로젝트</button><button class="side-btn" onclick="openTrash()">🗑 휴지통</button><button class="side-btn" onclick="openSettings()">⚙️ 설정</button><div class="side-title">최근 대화</div></div><div class="chat-list" id="chatList"><div class="empty-chat">대화를 불러오는 중...</div></div><div class="project-section"><div class="project-title">프로젝트</div><div id="projectList"><div class="empty-chat">프로젝트가 없습니다.</div></div></div><div class="profile-area"><button class="profile" type="button" onclick="toggleProfileMenu(event)" aria-label="프로필 메뉴 열기" aria-expanded="false"><div class="profile-circle" id="profileCircle">?</div><div class="profile-info"><div class="profile-name" id="profileName">사용자 확인 중...</div><div class="profile-id" id="profileId">-</div></div><span class="profile-chevron">⌃</span></button><div class="profile-menu" id="profileMenu" hidden><button type="button" class="profile-menu-item" onclick="goHome()"><span>⌂</span><span>홈으로</span></button><button type="button" class="profile-menu-item profile-menu-logout" onclick="logout()"><span>↪</span><span>로그아웃</span></button></div></div></aside><div class="overlay" id="overlay" onclick="closeMenu()"></div><main class="main"><div class="messages" id="messages"><div class="welcome" id="welcome"><h2>어서오세요!</h2><p>무한한 상상의 나래를 펼쳐요 🚀<br>Coby가 당신의 코딩 여정을 함께합니다.</p></div></div><div class="input-area"><div class="input-box"><textarea id="userInput" placeholder="Coby에게 무엇이든 물어보세요" autocomplete="off" spellcheck="false" rows="1"></textarea><button class="send" id="sendButton" onclick="sendMessage()" aria-label="메시지 전송">↑</button></div></div></main><div class="thinking-indicator" id="thinkingIndicator" hidden aria-live="polite"><span class="thinking-dot"></span><span>코비 생각 중입니다...</span></div><div class="project-modal" id="projectModal"><div class="modal-box"><h3>새 프로젝트</h3><input id="projectNameInput" placeholder="프로젝트 이름" maxlength="50"><input id="projectDescriptionInput" placeholder="프로젝트 설명 (선택)" maxlength="200"><div class="modal-buttons"><button class="cancel-btn" onclick="closeProjectModal()">취소</button><button class="create-btn" onclick="createProject()">만들기</button></div></div></div><div class="system-modal" id="settingsModal" aria-hidden="true"><div class="system-box settings-box"><div class="system-head"><div><h3>⚙️ COBY 설정</h3><p class="system-desc">COBY의 대화 방식을 설정할 수 있어요.</p></div><button class="modal-close" onclick="closeSettings()" aria-label="설정 닫기">×</button></div><div id="settingsList" class="settings-list"></div></div></div><div class="system-modal" id="adminLogsModal" aria-hidden="true"><div class="system-box system-box-large admin-logs-box"><div class="system-head"><div><h3>👥 사용자별 대화 로그</h3><p class="system-desc">관리자만 볼 수 있는 사용자별 COBY 대화 기록입니다.</p></div><button class="modal-close" onclick="closeAdminLogs()" aria-label="대화 로그 닫기">×</button></div><div id="adminUserList" class="admin-user-list"></div><div id="adminConversationList" class="admin-conversation-list" hidden></div></div></div><div class="system-modal" id="trashModal" aria-hidden="true"><div class="system-box system-box-large"><div class="system-head"><div><h3>🗑 휴지통</h3><p class="system-desc">삭제된 대화는 여기에서 복구하거나 영구 삭제할 수 있습니다.</p></div><button class="modal-close" onclick="closeTrash()">×</button></div><div id="trashList" class="system-list"></div></div></div><script type="module" src="js/app.js"></script><script type="module" src="js/theme.js"></script><script type="module" src="js/profile-menu.js"></script></body></html>
