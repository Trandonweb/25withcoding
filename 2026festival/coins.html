<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2026 Festival · 이용권 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#0f0f14;color:#fff}header{padding:18px 24px;background:linear-gradient(90deg,#00c853,#64dd17);box-shadow:0 4px 20px #0005}.header-inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font:25px 'Black Han Sans',sans-serif}.back{color:#fff;text-decoration:none}.container{width:min(1100px,calc(100% - 32px));margin:30px auto 60px}.page-title{margin-bottom:25px}.page-title h1{margin:0;font:32px 'Black Han Sans',sans-serif}.page-title p{color:#aaa;font-size:14px}.card{background:#1c1c25;border:1px solid #ffffff0f;border-radius:18px;padding:24px;margin-bottom:20px}.card-title{margin:0 0 18px}.top-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.control{background:#15151c;border:1px solid #353540;border-radius:12px;padding:13px}.label{display:block;color:#999;font-size:12px;margin-bottom:8px}.team-select{width:100%;height:42px;background:#24242d;color:#fff;border:1px solid #454550;border-radius:9px;padding:0 10px;font-size:15px}.toggle{height:42px;display:flex;background:#24242d;border:1px solid #454550;border-radius:9px;padding:3px;gap:3px}.toggle input{display:none}.toggle label{flex:1;display:flex;align-items:center;justify-content:center;border-radius:7px;color:#aaa;font-size:14px;cursor:pointer}.toggle input:checked+label{background:linear-gradient(90deg,#00c853,#64dd17);color:#fff;font-weight:bold}.rule{padding:13px 15px;background:#00c85312;border:1px solid #00c85333;border-radius:10px;margin-bottom:18px;color:#bbb;font-size:13px;line-height:1.7}.rule strong{color:#8cff9c}.code-rule{font-family:monospace;color:#fff}.coin-types{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.coin{position:relative}.coin input{position:absolute;opacity:0}.coin label{display:block;text-align:center;background:#15151c;border:1px solid #353540;border-radius:12px;padding:16px 8px;cursor:pointer}.coin input:checked+label{border-color:#00c853;background:#00c8531f}.coin-num{font-size:22px;font-weight:bold}.coin-sub{font-size:12px;color:#8cff9c;margin-top:5px}.generate{width:100%;height:52px;margin-top:18px;border:0;border-radius:12px;background:linear-gradient(90deg,#00c853,#64dd17);color:#fff;font-weight:bold;font-size:16px;cursor:pointer}.generate:disabled{opacity:.5}.status{text-align:center;min-height:20px;margin-top:10px;font-size:13px;color:#aaa}.error{color:#ff7070}.success{color:#8cff9c}.issued{display:none;text-align:center;background:#15151c;border:1px solid #00c85340;border-radius:14px;margin-top:16px;padding:20px}.issued-code{font: bold 34px monospace;letter-spacing:3px;margin:8px}.copy{border:0;border-radius:9px;padding:9px 15px;background:#292933;color:#fff}.code-list{display:flex;flex-direction:column;gap:10px}.code-item{display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;align-items:center;background:#15151c;border-radius:12px;padding:15px}.code{font:bold 18px monospace}.info{color:#999;font-size:12px;line-height:1.6;margin-top:5px}.badge{padding:6px 9px;border-radius:8px;background:#00c8531f;color:#8cff9c;font-size:12px;white-space:nowrap}.inactive{background:#ff64641f;color:#ff8585}.action{border:0;border-radius:8px;padding:9px 12px;background:#292933;color:#fff;cursor:pointer}.danger{color:#ff8585}.empty,.loading{text-align:center;color:#777;padding:35px}#app{display:none}#denied{display:none;min-height:100vh;align-items:center;justify-content:center}.denied-card{text-align:center;background:#1c1c25;border-radius:20px;padding:35px}.denied-card a{color:#8cff9c}@media(max-width:900px){.coin-types{grid-template-columns:repeat(3,1fr)}.code-item{grid-template-columns:1fr auto auto}}@media(max-width:600px){.top-controls{grid-template-columns:1fr}.coin-types{grid-template-columns:repeat(2,1fr)}.code-item{grid-template-columns:1fr 1fr}.action{width:100%}}@media(max-width:500px){.coin-types{grid-template-columns:1fr}.container{width:calc(100% - 20px)}.card{padding:17px}.issued-code{font-size:28px}}
</style>
</head>
<body>
<div id="denied"><div class="denied-card"><div style="font-size:45px">🔒</div><h1>접근 권한이 없습니다</h1><p>2026 Festival 이용권 관리 페이지는 지정된 관리자만 사용할 수 있습니다.</p><a href="/2026festival/">축제로 돌아가기</a></div></div>
<div id="app"><header><div class="header-inner"><div class="logo">2026 Festival · 이용권 관리</div><a class="back" href="/2026festival/">축제로 돌아가기</a></div></header>
<main class="container"><div class="page-title"><h1>🎟 이용권 관리</h1><p>팀과 부스를 선택한 뒤 이용권을 발급합니다.</p></div>
<section class="card"><h2 class="card-title">이용권 발급</h2>
<div class="top-controls"><div class="control"><span class="label">팀</span><select id="team" class="team-select"><option value="1">1팀</option><option value="2">2팀</option></select></div><div class="control"><span class="label">부스</span><div class="toggle"><input id="coding" name="booth" value="coding" type="radio" checked><label for="coding">코딩과 함께라면</label><input id="sancafe" name="booth" value="sancafe" type="radio"><label for="sancafe">S A N C A F E</label></div></div></div>
<div id="rule" class="rule"></div>
<div class="coin-types"><div class="coin"><input id="c1" name="people" value="1" type="radio"><label for="c1"><div class="coin-num">1인권</div><div class="coin-sub">이용권 수 · 1</div></label></div><div class="coin"><input id="c2" name="people" value="2" type="radio"><label for="c2"><div class="coin-num">2인권</div><div class="coin-sub">이용권 수 · 2</div></label></div><div class="coin"><input id="c3" name="people" value="3" type="radio"><label for="c3"><div class="coin-num">3인권</div><div class="coin-sub">이용권 수 · 3</div></label></div><div class="coin"><input id="c4" name="people" value="4" type="radio"><label for="c4"><div class="coin-num">4인권</div><div class="coin-sub">이용권 수 · 4</div></label></div><div class="coin"><input id="c5" name="people" value="5" type="radio"><label for="c5"><div class="coin-num">5인권</div><div class="coin-sub">이용권 수 · 5</div></label></div></div>
<button id="generate" class="generate">이용권 발급</button><div id="status" class="status"></div><div id="issued" class="issued"><b>발급 완료</b><div id="issuedCode" class="issued-code"></div><div id="issuedInfo"></div><button id="copy" class="copy">복사하기</button></div></section>
<section class="card"><h2 class="card-title">발급된 이용권</h2><div id="list" class="code-list"><div class="loading">이용권을 불러오는 중...</div></div></section></main></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js';
import{getFirestore,doc,getDoc,collection,onSnapshot,deleteDoc,serverTimestamp,runTransaction,query,orderBy,updateDoc}from'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9Q',authDomain:'festivallikes.firebaseapp.com',projectId:'festivallikes',storageBucket:'festivallikes.firebasestorage.app',messagingSenderId:'782245120700',appId:'1:782245120700:web:c61e16313e9ae688e6deb9'};
const loginConfig={apiKey:'AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20',authDomain:'points2026-f5e50.firebaseapp.com',projectId:'points2026-f5e50'};
const db=getFirestore(initializeApp(firebaseConfig)),loginDB=getFirestore(initializeApp(loginConfig,'loginApp'));
const $=id=>document.getElementById(id),TEAM_CHAR={1:'A',2:'B'},CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';let last='';
function random(n){const a=new Uint32Array(n);crypto.getRandomValues(a);return Array.from(a,x=>CHARS[x%CHARS.length]).join('')}
function alpha(){const a=new Uint32Array(1);crypto.getRandomValues(a);return 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[a[0]%26]}
function booth(){return document.querySelector('input[name="booth"]:checked').value}
function updateRule(){const t=$('team').value,b=booth(),d=TEAM_CHAR[t];$('rule').innerHTML=b==='coding'?`현재 <strong>코딩과 함께라면</strong> · <strong>${t}팀</strong><br>코드 형식: <span class="code-rule">(이용권 수)(랜덤)(랜덤)(랜덤)(판별문자)</span><br>예시: <span class="code-rule">3K8QA</span> · 판별문자 <strong>${d}</strong>`:`현재 <strong>S A N C A F E</strong> · <strong>${t}팀</strong><br>코드 형식: <span class="code-rule">(알파벳)(랜덤)(랜덤)(랜덤)(판별문자)</span><br>예시: <span class="code-rule">Q7K2${d}</span> · 판별문자 <strong>${d}</strong>`}
function makeCode(p,b,t){return b==='coding'?`${p}${random(3)}${TEAM_CHAR[t]}`:`${alpha()}${random(3)}${TEAM_CHAR[t]}`}
async function access(){const id=localStorage.getItem('userId');if(!id){$('denied').style.display='flex';return false}try{const s=await getDoc(doc(loginDB,'users',id));if(!s.exists())throw 0;const u=s.data();if(!(u.role==='president'||u.role==='vice'||u.coinManager===true))throw 0;$('app').style.display='block';return true}catch(e){$('denied').style.display='flex';return false}}
async function generate(){const sel=document.querySelector('input[name="people"]:checked');if(!sel){$('status').className='status error';$('status').textContent='이용권 수를 선택해주세요.';return}const p=Number(sel.value),b=booth(),t=Number($('team').value);$('generate').disabled=true;$('issued').style.display='none';$('status').className='status';$('status').textContent='이용권을 발급하는 중...';try{let saved=null;for(let i=0;i<20&&!saved;i++){const code=makeCode(p,b,t),ref=doc(db,'accesscodes',code);const ok=await runTransaction(db,async tx=>{if((await tx.get(ref)).exists())return false;tx.set(ref,{max:p,used:0,active:true,team:t,booth:b,createdAt:serverTimestamp(),createdBy:localStorage.getItem('userId')||'unknown'});return true});if(ok)saved=code}if(!saved)throw Error('FAIL');last=saved;$('issuedCode').textContent=saved;$('issuedInfo').textContent=`${t}팀 · ${b==='coding'?'코딩과 함께라면':'S A N C A F E'} · ${p}인권`;$('issued').style.display='block';$('status').className='status success';$('status').textContent=`${saved} 발급 완료!`;sel.checked=false}catch(e){console.error(e);$('status').className='status error';$('status').textContent='이용권 발급에 실패했습니다.'}finally{$('generate').disabled=false}}
$('generate').onclick=generate;$('team').onchange=updateRule;document.querySelectorAll('input[name="booth"]').forEach(x=>x.onchange=updateRule);
$('copy').onclick=async()=>{if(!last)return;try{await navigator.clipboard.writeText(last);$('copy').textContent='복사됨';setTimeout(()=>$('copy').textContent='복사하기',1200)}catch(e){alert(`코드: ${last}`)}};
function name(b){return b==='sancafe'?'S A N C A F E':'코딩과 함께라면'}function date(x){return x?.toDate?x.toDate().toLocaleString('ko-KR'):'-'}
async function toggle(id,a){const n=!a;if(!confirm(`이 이용권을 ${n?'활성화':'비활성화'}할까요?\n\n${id}`))return;try{await updateDoc(doc(db,'accesscodes',id),{active:n})}catch(e){alert('변경에 실패했습니다.')}}async function del(id){if(!confirm(`정말 삭제할까요?\n\n${id}`))return;try{await deleteDoc(doc(db,'accesscodes',id))}catch(e){alert('삭제에 실패했습니다.')}}
function load(){onSnapshot(query(collection(db,'accesscodes'),orderBy('createdAt','desc')),s=>{const list=$('list');list.innerHTML='';if(!s.size){list.innerHTML='<div class="empty">아직 발급된 이용권이 없습니다.</div>';return}s.forEach(x=>{const v=x.data(),used=Number(v.used||0),max=Number(v.max||0),active=v.active!==false,e=document.createElement('div');e.className='code-item';e.innerHTML=`<div><div class="code">${x.id}</div><div class="info">${v.team?`${v.team}팀 · ${name(v.booth)} · `:''}사용 ${used} / ${max}명 · 남은 ${Math.max(max-used,0)}명<br>발급일 ${date(v.createdAt)}</div></div><div class="badge ${active?'':'inactive'}">${active?'활성':'비활성'}</div><button class="action cp">복사</button><button class="action tg">${active?'비활성화':'활성화'}</button><button class="action danger dl">삭제</button>`;e.querySelector('.cp').onclick=()=>navigator.clipboard.writeText(x.id);e.querySelector('.tg').onclick=()=>toggle(x.id,active);e.querySelector('.dl').onclick=()=>del(x.id);list.appendChild(e)})},e=>{console.error(e);$('list').innerHTML='<div class="empty">이용권 목록을 불러오지 못했습니다.</div>'})}
updateRule();access().then(ok=>ok&&load());
</script></body></html>
