<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회피 서바이벌 | MINI GAME</title><style>*{box-sizing:border-box}:root{color-scheme:dark;--g:#53e88a}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#17442c,transparent 42%),#050b08;color:#f3fff6;font-family:Arial,'Noto Sans KR',sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(950px,100%)}.top{display:flex;justify-content:space-between;color:#a9c5b2;font-size:12px;letter-spacing:.1em}h1{font-size:clamp(30px,5vw,46px);margin:14px 0 4px}.sub{color:#b8cdbf;line-height:1.7}canvas{display:block;width:100%;height:auto;margin:18px 0;border:1px solid #ffffff20;border-radius:18px;background:#06100a;box-shadow:0 20px 55px #0005}.scores{display:flex;justify-content:center;gap:55px}.scores strong{display:block;text-align:center;font-size:32px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}button{border:0;border-radius:12px;padding:12px 18px;background:var(--g);color:#062012;font-weight:800;cursor:pointer}.secondary{background:#ffffff12;color:white;border:1px solid #ffffff20}.hint{color:#a9c5b2;font-size:13px}#message{min-height:26px;margin-top:14px;font-weight:750}.hidden{display:none!important}/* Responsive full-screen layout: keep the game inside the visible viewport. */
html{width:100%;height:100%;overflow:hidden}
body{width:100%;height:100dvh;min-height:0!important;overflow:hidden!important;padding:clamp(6px,1.2vh,14px)!important;overscroll-behavior:none}
.wrap{width:min(100%,1000px);max-height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:clamp(3px,0.7vh,8px);padding:0!important;margin:auto}
.wrap>*{flex-shrink:0}
h1,.heading h1{font-size:clamp(21px,4.2vh,42px)!important;line-height:1.08;margin:clamp(2px,0.5vh,7px) 0!important}
p,.sub,.desc,.help{font-size:clamp(11px,1.65vh,15px);line-height:1.35}
canvas{max-width:100%;max-height:43dvh;width:auto;height:auto;object-fit:contain;margin-block:clamp(3px,0.6vh,8px)!important}
button,.btn{padding:clamp(7px,1.2vh,12px) clamp(10px,2vw,18px);font-size:clamp(11px,1.6vh,15px)}
#message{min-height:0!important;margin:clamp(2px,0.4vh,6px) 0!important;font-size:clamp(11px,1.6vh,15px)}
.top{flex-shrink:0}
@media(max-width:650px){body{padding:6px!important}.wrap{width:100%;gap:3px}.heading{margin:4px 0 6px!important}.controls{grid-template-columns:1fr 1fr!important;gap:5px!important}.control{padding:6px!important}.control span{font-size:10px!important}.arena{padding:4px!important}.scores{margin:4px 0!important}.score{padding:5px 8px!important}.score strong{font-size:clamp(16px,3vh,22px)!important}.help{margin:4px 0!important}.bottom{gap:5px!important}}
@media(max-height:620px){canvas{max-height:35dvh}.heading{margin:3px 0 5px!important}.scores{margin:3px 0!important}.controls{gap:4px!important}.control{padding:5px 8px!important}.help{margin:3px 0!important}}

/* Refined MINI GAME interface */
:root{color-scheme:light;--mg-ink:#17251c;--mg-muted:#617166;--mg-green:#187447;--mg-line:#dbe5dc}
body{background:#f2f5f1!important;color:var(--mg-ink)!important;font-family:Inter,'Noto Sans KR',system-ui,sans-serif!important}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 0% 0%,#dceee0 0,transparent 40%);z-index:-1}
.wrap{color:var(--mg-ink)!important}
.top,.sub,.desc,.muted,.hint,.instruction,.info,.help,.round,.note{color:var(--mg-muted)!important}
.arena,.setting,.summary,.history,.card,.score,.keyhelp span{background:#fff!important;color:var(--mg-ink)!important;border:1px solid var(--mg-line)!important;box-shadow:0 12px 35px #203b2810!important}
.card{border-radius:16px!important}
button,.btn,.next,.done,.resultBtn{background:#187447!important;color:#fff!important;border:1px solid #187447!important;border-radius:11px!important;font-weight:750!important}
button:disabled{opacity:.42!important}
button:hover,.btn:hover,.next:hover,.done:hover{background:#12613a!important;box-shadow:0 7px 18px #18744722!important}
input{background:#fff!important;color:var(--mg-ink)!important;border:1px solid #cbd8cd!important}
.cell{background:#e8eee9!important;border:1px solid #d5e0d7!important}
.cell.me,.p1{background:#2e9b5c!important}.cell.opp,.p2{background:#edbd56!important}
.icon{display:none!important}
#miniSoundPanel button{background:#fff!important;color:#23412d!important;border:1px solid #d4e0d5!important;box-shadow:0 4px 14px #0001!important}
@media(max-width:650px){.card .desc{display:none!important}#projectShortDescription,#projectCreator{display:block!important}.wrap{padding:0!important}}
</style></head><body><main class="wrap"><div class="top"><span>MINI GAME / 09</span><span id="round"></span></div><h1>회피 서바이벌</h1><div class="sub">떨어지는 장애물을 피하세요. 오래 살아남은 쪽이 승리합니다.</div><div class="scores"><div><span id="leftLabel">플레이어</span><strong id="leftTime">0.0초</strong></div><div><span id="rightLabel">컴퓨터</span><strong id="rightTime">0.0초</strong></div></div><canvas id="arena" width="900" height="480" aria-label="회피 서바이벌 게임"></canvas><div class="bar"><button id="start">시작 / 다시 시작</button><button class="secondary" id="done" hidden>결과 확인 →</button><span class="hint" id="controls">1P: A/D 또는 ←/→ · 점프: W/↑</span></div><div id="message">시작을 눌러 게임하세요.</div></main><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu'};const mode=s.mode||'cpu';document.getElementById('round').textContent=s.round?s.round+'번째 게임':'';if(mode==='local'){document.getElementById('leftLabel').textContent='1P';document.getElementById('rightLabel').textContent='2P';document.getElementById('controls').textContent='1P: A/D + W · 2P: ←/→ + ↑'}if(mode==='online')document.getElementById('message').textContent='온라인 입력 동기화는 아직 연결되지 않아 로컬 플레이만 가능합니다.';
const cv=document.getElementById('arena'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;let players=[],blocks=[],playing=false,over=false,startAt=0,lastAt=0,raf=0,spawn=0;
function newPlayer(x,color,side){return{x,y:H-64,w:24,h:34,color,side,alive:true,vy:0,jump:false,time:0}}
function reset(){players=[newPlayer(W*.25,'#53e88a',0),newPlayer(W*.75,'#ffd477',1)];blocks=[];playing=false;over=false;spawn=0;startAt=lastAt=performance.now();document.getElementById('leftTime').textContent=document.getElementById('rightTime').textContent='0.0초';document.getElementById('done').hidden=true;document.getElementById('message').textContent='곧 시작합니다.';cancelAnimationFrame(raf);beginUniversalCountdown(()=>{playing=true;startAt=lastAt=performance.now();document.getElementById('message').textContent='장애물을 피하세요!';loop(startAt)})}
function endGame(){if(over)return;over=true;playing=false;const a=players[0].time,b=players[1].time,w=a===b?'draw':a>b?'me':'opp';document.getElementById('message').textContent=w==='draw'?'무승부':w==='me'?'1P 승리!':mode==='local'?'2P 승리!':'컴퓨터 승리!';localStorage.setItem('miniGameResult',JSON.stringify({game:'회피 서바이벌',winner:w,me:Number(a.toFixed(1)),opp:Number(b.toFixed(1))}));document.getElementById('done').hidden=false;window.miniGameSound?.('win')}
function jump(p){if(p.alive&&p.y>=H-64){p.vy=-10.5;p.jump=true;window.miniGameSound?.('jump')}}
function move(p,dt){if(!p.alive)return;const left=p.side===0?(mode==='local'?keys.has('KeyA'):(keys.has('KeyA')||keys.has('ArrowLeft'))):keys.has('ArrowLeft');const right=p.side===0?(mode==='local'?keys.has('KeyD'):(keys.has('KeyD')||keys.has('ArrowRight'))):keys.has('ArrowRight');if(mode==='cpu'&&p.side===1){const target=blocks.filter(b=>b.side===1&&b.y<H-45).sort((a,b)=>b.y-a.y)[0];if(target){if(target.x<p.x+8)p.x+=Math.min(4,dt*4);else if(target.x>p.x+24)p.x-=Math.min(4,dt*4)}}else{if(left)p.x-=5*dt;if(right)p.x+=5*dt}if(p.side===0&&(keys.has('KeyW')||(mode!=='local'&&keys.has('ArrowUp'))))jump(p);if(p.side===1&&mode==='local'&&keys.has('ArrowUp'))jump(p);p.x=Math.max(p.side===0?20:W/2+20,Math.min(p.side===0?W/2-20:W-20,p.x));p.vy+=.5*dt;p.y+=p.vy*dt;if(p.y>H-64){p.y=H-64;p.vy=0;p.jump=false}p.time=(performance.now()-startAt)/1000}
const keys=new Set();window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD','KeyW'].includes(e.code))e.preventDefault();keys.add(e.code)},true);window.addEventListener('keyup',e=>keys.delete(e.code),true);
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#09190f';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff18';ctx.setLineDash([8,10]);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#173b25';ctx.fillRect(0,H-28,W,H);for(const b of blocks){ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x-b.size/2,b.y-b.size/2,b.size,b.size,5);ctx.fill()}for(let i=0;i<players.length;i++){const p=players[i];ctx.globalAlpha=p.alive?1:.25;ctx.fillStyle=p.color;ctx.fillRect(p.x-p.w/2,p.y-p.h,p.w,p.h);ctx.beginPath();ctx.arc(p.x,p.y-p.h-8,9,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}ctx.fillStyle='#a9c5b2';ctx.font='bold 14px Arial';ctx.fillText('1P',25,28);ctx.textAlign='right';ctx.fillText(mode==='local'?'2P':'CPU',W-25,28);ctx.textAlign='left'}
function loop(now){if(!playing){draw();return}const dt=Math.min(2,(now-lastAt)/16.67);lastAt=now;spawn+=dt;if(spawn>22){spawn=0;for(let side=0;side<2;side++)blocks.push({x:(side===0?25:W/2+25)+Math.random()*(W/2-50),y:-20,size:18+Math.random()*18,vy:3+Math.random()*2,side,color:Math.random()<.5?'#ff7272':'#ffd477'})}for(const p of players)move(p,dt);for(const b of blocks){b.y+=b.vy*dt;const p=players[b.side];if(p.alive&&Math.abs(b.x-p.x)<p.w/2+b.size/2&&b.y>p.y-p.h&&b.y<p.y+4){p.alive=false;window.miniGameSound?.('hit')}}blocks=blocks.filter(b=>b.y<H+30);for(let i=0;i<2;i++){document.getElementById(i===0?'leftTime':'rightTime').textContent=players[i].time.toFixed(1)+'초'}draw();if(players.every(p=>!p.alive)){endGame();return}if(now-startAt>60000){players.forEach(p=>{if(p.alive)p.time=60});endGame();return}raf=requestAnimationFrame(loop)}
document.getElementById('start').onclick=reset;document.getElementById('done').onclick=()=>location.href='../index.html';document.body.tabIndex=0;document.addEventListener('pointerdown',()=>{try{window.focus()}catch(e){}},true);draw();reset();
</script></main><div id="miniSoundPanel" style="position:fixed;right:14px;bottom:14px;z-index:9999"><button id="miniSoundToggle" type="button" aria-pressed="true" style="border:1px solid #ffffff35;border-radius:999px;padding:10px 14px;background:#10251a;color:#effff4;font:700 13px Arial,sans-serif;box-shadow:0 6px 22px #0006;cursor:pointer"> 소리 켜짐</button></div><script>(function(){let enabled=localStorage.getItem('miniGameSound')!=='off',audio=null,lastKeySound=0;const btn=document.getElementById('miniSoundToggle');function label(){btn.textContent=enabled?'소리 켜짐':'소리 꺼짐';btn.setAttribute('aria-pressed',String(enabled))}function sound(kind='ui'){if(!enabled)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audio=audio||new AC();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const seq=kind==='win'?[523,659,784]:kind==='score'?[660,880]:kind==='hit'?[220,165]:kind==='bounce'?[420]:kind==='jump'?[440,660]:kind==='key'?[330]:[520];seq.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='hit'?'triangle':'sine';o.frequency.setValueAtTime(hz,now+i*.075);g.gain.setValueAtTime(.0001,now+i*.075);g.gain.exponentialRampToValueAtTime(((kind==='ui'||kind==='key')?0.035:0.065),now+i*.075+.012);g.gain.exponentialRampToValueAtTime(.0001,now+i*.075+.11);o.connect(g);g.connect(audio.destination);o.start(now+i*.075);o.stop(now+i*.075+.12)})}catch(e){}}window.miniGameSound=sound;btn.addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('miniGameSound',enabled?'on':'off');label();if(enabled)sound('ui')});document.addEventListener('click',e=>{if(e.target.closest('#miniSoundPanel'))return;if(e.target.closest('button'))sound('ui')},true);document.addEventListener('keydown',e=>{if(e.repeat||!['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code))return;const now=performance.now();if(now-lastKeySound>75){sound('key');lastKeySound=now}},true);label()})();</script><script type="module" src="../online-sync.js"></script>
<script>
/* Tablet keyboard focus and automatic result display */
(function(){
  try{localStorage.removeItem('miniGameResult')}catch(e){}
  document.body.tabIndex=0;
  const focusGame=()=>{try{document.body.focus({preventScroll:true})}catch(e){document.body.focus()}};
  window.addEventListener('pageshow',()=>setTimeout(focusGame,100));
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('button,input,textarea,select'))focusGame()},{passive:true});
  const css=document.createElement('style');
  css.textContent='#mgAutoResult{position:fixed;inset:0;z-index:20000;display:none;place-items:center;padding:20px;background:#07110ddd;backdrop-filter:blur(10px)}#mgAutoResult .panel{width:min(460px,94vw);padding:30px;border:1px solid #b6f6ca;border-radius:24px;background:#f8fff9;color:#17251c;text-align:center;box-shadow:0 24px 80px #0005;font-family:Arial,sans-serif}#mgAutoResult .headline{font-size:clamp(34px,8vw,54px);font-weight:950;margin:12px 0}#mgAutoResult .detail{color:#617166;line-height:1.6}#mgAutoResult button{margin-top:22px;border:0;border-radius:12px;padding:14px 24px;background:#187447;color:white;font-weight:850;font-size:15px}#mgTabletPad{position:fixed;left:10px;bottom:10px;z-index:8000;display:flex;gap:6px;flex-wrap:wrap;max-width:85vw}#mgTabletPad button{touch-action:manipulation;min-width:44px;min-height:42px;padding:9px 12px;border:1px solid #b9d9c3;border-radius:12px;background:#f7fff8;color:#173d28;font-weight:850;box-shadow:0 4px 14px #0002}';
  document.head.appendChild(css);
  const overlay=document.createElement('div');overlay.id='mgAutoResult';
  overlay.innerHTML='<div class="panel"><div style="font-size:12px;font-weight:850;letter-spacing:.15em;color:#187447">MATCH RESULT</div><div class="headline" id="mgAutoHeadline">경기 종료</div><div class="detail" id="mgAutoDetail">최종 결과</div><button id="mgAutoBack">메뉴로 돌아가기</button></div>';
  document.body.appendChild(overlay);
  document.getElementById('mgAutoBack').onclick=()=>location.href='../index.html';
  let shown=false;

  function showResult(data){
    if(shown||!data||!data.winner)return;
    shown=true;
    const settings=JSON.parse(localStorage.getItem('miniGameSettings')||'null');document.getElementById('mgAutoHeadline').textContent=settings?.mode==='local'?(data.winner==='me'?'1P 승':data.winner==='opp'?'2P 승':'무승부'):(data.winner==='me'?'승리':data.winner==='opp'?'패배':'무승부');
    const score=data.me!==undefined||data.opp!==undefined?'최종 점수 '+(data.me??0)+' : '+(data.opp??0):'';
    document.getElementById('mgAutoDetail').textContent=[data.game||'미니게임',score].filter(Boolean).join(' · ');
    overlay.style.display='grid';
  }
  function checkResult(){let raw;try{raw=localStorage.getItem('miniGameResult')}catch(e){return}if(raw){try{showResult(JSON.parse(raw))}catch(e){}}}
  const originalSetItem=Storage.prototype.setItem;
  Storage.prototype.setItem=function(key,value){
    originalSetItem.call(this,key,value);
    if(key==='miniGameResult'){try{showResult(JSON.parse(value))}catch(e){}}
  };
  const observer=new MutationObserver(checkResult);
  observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','hidden','style']});
  // On-screen backup controls for touchscreen tablets
  const n=(location.pathname.match(/game([1-9])\.html/)||[])[1];
  const keys={'1':[['A','KeyA'],['L','KeyL']],'2':[['A','KeyA'],['L','KeyL']],'3':[['반응','Enter']],'5':[['점프','Space']],'6':[['위','ArrowUp'],['아래','ArrowDown'],['발사','Enter'],['방향','Space']],'7':[['왼쪽','KeyA'],['오른쪽','KeyD'],['발사','KeyS'],['P2 ←','ArrowLeft'],['P2 →','ArrowRight'],['P2 발사','ArrowDown']],'8':[['위','ArrowUp'],['아래','ArrowDown'],['시작','Enter']],'9':[['왼쪽','ArrowLeft'],['오른쪽','ArrowRight'],['점프','Space'],['P2 점프','ArrowUp']]};
  if(keys[n]){
    const pad=document.createElement('div');pad.id='mgTabletPad';
    keys[n].forEach(([label,code])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{focusGame();const key=code==='Space'?' ':code==='Enter'?'Enter':code.startsWith('Key')?code.slice(3).toLowerCase():code;document.dispatchEvent(new KeyboardEvent('keydown',{key,code,bubbles:true,cancelable:true}));if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyS'].includes(code))document.dispatchEvent(new KeyboardEvent('keyup',{key,code,bubbles:true,cancelable:true}))};pad.appendChild(b)});
    document.body.appendChild(pad);
  }
})();
</script>
</body></html>
