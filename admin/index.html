<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>관리자 | 코딩과 함께라면</title>

<style>
    :root {
      --bg-color: #f0f0f0;
      --card-bg: #ffffff;
      --text-color: #111111;
      --header-bg: #ffffff;
      --border-color: var(--primary-color, #27ae60);
      --header-text: var(--primary-color, #27ae60);
      --card-hover-bg: color-mix(in srgb, var(--primary-color) 8%, white);
      --primary-color: #27ae60;
      --btn-bg: #e0e0e0;
      --btn-text: #333333;
      --btn-hover: #d0d0d0;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1E1E1E;
      --text-color: #FFFFFF;
      --header-bg: #1E1E1E;
      --border-color: var(--primary-color);
      --header-text: var(--primary-color);
      --card-hover-bg: color-mix(in srgb, var(--primary-color) 15%, #1E1E1E);
      --btn-bg: #2C2C2C;
      --btn-text: #FFFFFF;
      --btn-hover: #3A3A3A;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:sans-serif;
    }

    body{
        background: var(--bg-color);
        color: var(--text-color);
        transition: background 0.2s, color 0.2s;
    }

    header{
        background: var(--header-bg);
        color: var(--text-color);
        padding: 20px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 10px rgba(0,0,0,.08);
        border-bottom: 3px solid var(--border-color);
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .header-btn {
        background: var(--btn-bg);
        border: none;
        color: var(--btn-text);
        padding: 10px 18px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        transition: background 0.2s;
    }

    .header-btn:hover {
        background: var(--btn-hover);
    }

    header h1{
        font-size: 26px;
        color: var(--header-text);
    }

    header p{
        color: #888;
        margin-top: 5px;
    }

    #logout{
        background: #ff5b5b;
        border: none;
        color: white;
        padding: 10px 18px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        transition: filter 0.2s;
    }

    #logout:hover {
        filter: brightness(0.9);
    }

    .container{
        max-width: 1200px;
        margin: auto;
        padding: 30px;
    }

    .grid{
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
        gap: 20px;
    }

    .card{
        background: var(--card-bg);
        color: var(--text-color);
        padding: 25px;
        border-radius: 18px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
        transition: transform .2s, background .2s, border .2s;
        border: 2px solid transparent;
    }

    .card:hover{
        transform: translateY(-5px);
        background: var(--card-hover-bg);
    }

    .main{
        border-left: 6px solid var(--primary-color);
        border-top: 2px solid var(--border-color);
        border-right: 2px solid var(--border-color);
        border-bottom: 2px solid var(--border-color);
    }

    .disabled{
        opacity: .45;
        cursor: default;
    }

    footer{
        text-align: center;
        padding: 30px;
        color: #888;
    }

    #loading{
        position: fixed;
        inset: 0;
        background: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 25px;
        z-index: 2000;
    }
</style>

</head>


<body>


<div id="loading">
확인 중...
</div>


<header>

<div class="header-left">
    <button id="homeBtn" class="header-btn">
        홈
    </button>
    <div>
        <h1>관리자 페이지</h1>
        <p id="welcome">불러오는 중...</p>
    </div>
</div>

<div>
    <button id="logout">
        로그아웃
    </button>
</div>

</header>



<div class="container">


<div class="grid">


<div class="card main" id="mirroring">

<h2>
🖥 화면 모니터링
</h2>

<p>
학생 화면 실시간 확인
</p>

</div>



<div class="card main" id="users">

<h2>
👥 사용자 관리
</h2>

<p>
사용자 정보 관리
</p>

</div>



<div class="card disabled">

<h2>
🏅 상벌점 관리
</h2>

<p>
준비 중
</p>

</div>



<div class="card disabled">

<h2>
📊 통계
</h2>

<p>
준비 중
</p>

</div>



</div>


</div>


<footer>

2026 코딩과 함께라면 | 관리자 페이지
</footer>



<script type="module">

import {
    requireAdmin
} from "./js/auth.js";

// 메인 페이지와 동일한 설정 키를 사용하여 다크모드 및 컬러 테마 동기화
const SETTINGS_KEY = "coding_with_ramen_settings";

function applyStoredSettings() {
    const saved = localStorage.getItem(SETTINGS_KEY);
    if (saved) {
        try {
            const settings = JSON.parse(saved);
            if (settings.darkMode) {
                document.body.classList.add("dark-mode");
            } else {
                document.body.classList.remove("dark-mode");
            }
            if (settings.primaryColor) {
                document.documentElement.style.setProperty('--primary-color', settings.primaryColor);
            }
        } catch (e) {
            console.error("설정 로드 실패", e);
        }
    }
}

// 페이지 로드 즉시 테마 적용 (깜빡임 방지)
applyStoredSettings();

try{

const user =
    await requireAdmin();

document.getElementById("welcome").innerHTML =
`
안녕하세요,
<b>${user.name}</b>님
(${user.role})
`;

document.getElementById("loading").style.display="none";

}catch(e){

console.error(e);

}

// 홈 버튼 클릭 시 /index.html로 이동
document.getElementById("homeBtn").onclick = () => {
    location.href = "/index.html";
};

document.getElementById("logout").onclick = () => {
    localStorage.removeItem("userId");
    location.href = "/signin/";
};

document.getElementById("mirroring").onclick = () => {
    location.href = "/admin/mirroring.html";
};

document.getElementById("users").onclick = () => {
    location.href = "/admin/users.html";
};

</script>


</body>
</html>
