<!DOCTYPE html>
<html>
<head>
  <title>코딩과 함께라면_사용자_관리</title>

  <style>

    body {
      font-family: 'Malgun Gothic', sans-serif;
      padding: 30px;
      background-color: #f4f6f9;
      color: #333;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0;
      color: #2c3e50;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    h3 {
      margin-top: 0;
      margin-bottom: 15px;
      color: #34495e;
      font-size: 1.1rem;
    }

    input, select {
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid #e1e8ed;
      margin: 5px;
      background: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus, select:focus {
      border-color: #27ae60;
      background: white;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 16px;
      background: #27ae60;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
      transition: background 0.2s;
    }

    button:hover {
      background: #219653;
    }

    /* 위험한 액션 (삭제 등) 버튼 스타일 구분 */
    button.danger {
      background: #e74c3c;
    }

    button.danger:hover {
      background: #c0392b;
    }

    /* 사용자 목록 한 줄 정렬 레이아웃 */
    .user {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-radius: 16px;
      background: #fdfdfe;
      border: 1px solid #edf2f7;
      margin-top: 10px;
      transition: transform 0.1s;
    }

    .user:hover {
      background: #f8fafc;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 15px;
    }

    .user-info input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #27ae60;
    }

    .role-badge {
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      background: #edf2f7;
      color: #4a5568;
    }

    .role-president {
      background: #fef3c7;
      color: #d97706;
    }

    .role-vice {
      background: #e0e7ff;
      color: #4f46e5;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

  </style>
</head>

<body>

<div class="top-bar">

  <button onclick="goBack()">
    ← 뒤로가기
  </button>

  <h2>사용자 관리</h2>

</div>

<div class="card">

  <h3>학생 추가</h3>

  <div class="action-row">
    <input id="newId" placeholder="학번 (예: 10101)">
    <input id="newName" placeholder="이름">
    <select id="newRole">
      <option value="student">학생</option>
    </select>
    <button onclick="createUser()">추가하기</button>
  </div>

</div>

<div class="card">

  <h3>사용자 검색</h3>

  <input id="searchInput" placeholder="학번 또는 이름 검색" oninput="filterUsers()" style="width: 100%; box-sizing: border-box;">

</div>

<div class="card">

  <h3 id="selectedCountText">선택된 사용자 : 0명</h3>

  <div id="selectedUserList" style="margin-bottom: 15px; color: #718096; max-height: 150px; overflow-y: auto; font-size: 14px; line-height: 1.6;">
    선택된 사용자가 없습니다.
  </div>

  <div class="action-row">
    <select id="batchRoleSelect">
      <option value="student">학생</option>
    </select>
    <button onclick="batchChangeRole()">권한 변경</button>
    <button onclick="batchResetPassword()">비밀번호 초기화</button>
    <button class="danger" onclick="batchDeleteUsers()">선택 삭제</button>
  </div>

</div>

<div class="card">

  <h3>사용자 목록</h3>

  <div id="userList">
    로딩중...
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc
}
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey:
    "AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",

  authDomain:
    "points2026-f5e50.firebaseapp.com",

  projectId:
    "points2026-f5e50"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const myId =
  localStorage.getItem("userId");

if (!myId) {

  alert("로그인이 필요합니다.");

  location.href = "/index.html";
  throw new Error("로그인 필요");

}

const mySnap =
  await getDoc(doc(db, "users", myId));

if (!mySnap.exists()) {

  alert("사용자 없음");

  location.href = "/index.html";
  throw new Error("사용자 없음");

}

const myData = mySnap.data();

/*--------------------------------------------------
  접근 권한 확인 함수
--------------------------------------------------*/
if (myData.role === "student") {
  alert("접근 권한이 없습니다.");
  location.replace("/admin");
  throw new Error("권한 없음");
}

/* 전역 변수 설정 및 president 권한일 때만 추가 선택지 부여 */
let allUsers = [];
let selectedUsers = [];

if (myData.role === "president") {
  document.getElementById("newRole").innerHTML = `
    <option value="student">학생</option>
    <option value="vice">부회장</option>
    <option value="president">회장</option>
  `;
  document.getElementById("batchRoleSelect").innerHTML = `
    <option value="student">학생</option>
    <option value="vice">부회장</option>
    <option value="president">회장</option>
  `;
}

/*--------------------------------------------------
  권한 한글화 및 배지 디자인 함수
--------------------------------------------------*/
function roleToBadge(role) {
  if (role === "president") {
    return `<span class="role-badge role-president">회장</span>`;
  }
  if (role === "vice") {
    return `<span class="role-badge role-vice">부회장</span>`;
  }
  return `<span class="role-badge">학생</span>`;
}

function roleToText(role) {
  if (role === "president") return "회장";
  if (role === "vice") return "부회장";
  return "학생";
}

/*--------------------------------------------------
  뒤로가기 함수
--------------------------------------------------*/
window.goBack = () => {
  location.href = "/admin";
};

/*--------------------------------------------------
  유저 생성 함수
--------------------------------------------------*/
window.createUser = async () => {

  const id = document.getElementById("newId").value.trim();
  const name = document.getElementById("newName").value.trim();
  const role = document.getElementById("newRole").value;

  if (!id || !name) {
    alert("입력해주세요.");
    return;
  }

  /* 학번 5자리 및 숫자 검사 */
  if (id.length !== 5) {
    alert("학번은 5자리입니다.");
    return;
  }

  if (isNaN(id)) {
    alert("숫자만 입력해주세요.");
    return;
  }

  /* 상세 학번 규칙 검증 (학년 1~3, 반 1~9, 번호 1~99) */
  const gradeNum = Number(id[0]);
  const classNum = Number(id.slice(1, 3));
  const numberNum = Number(id.slice(3, 5));

  if (
    gradeNum < 1 || gradeNum > 3 ||
    classNum < 1 || classNum > 9 ||
    numberNum < 1 || numberNum > 99
  ) {
    alert("올바른 학번이 아닙니다.");
    return;
  }

  /* vice 권한 생성 제한 검사 (개발자 도구 조작 방어 포함) */
  if (myData.role === "vice") {
    if (role === "vice" || role === "president") {
      alert("권한이 없습니다.");
      return;
    }
  }

  try {
    const ref = doc(db, "users", id);
    const snap = await getDoc(ref);

    if (snap.exists()) {
      alert("이미 존재하는 학번");
      return;
    }

    const grade = id.charAt(0);

    await setDoc(ref, {
      grade: grade,
      name: name,
      password: "qwer1234!",
      role: role,
      score: 0
    });

    alert("생성 완료");
    location.reload();
  } catch (error) {
    alert("생성 중 오류가 발생했습니다.");
  }

};

/*--------------------------------------------------
  유저 데이터 불러오기 및 렌더링 함수
--------------------------------------------------*/
async function loadUsers() {
  const userListDiv = document.getElementById("userList");
  userListDiv.innerHTML = "로딩중...";

  try {
    const querySnapshot = await getDocs(collection(db, "users"));
    allUsers = [];

    querySnapshot.forEach((docu) => {
      allUsers.push({
        id: docu.id,
        ...docu.data()
      });
    });

    /* 숫자 기준 학번 정렬 */
    allUsers.sort((a, b) => {
      return Number(a.id) - Number(b.id);
    });

    renderUserList(allUsers);
  } catch (error) {
    userListDiv.innerHTML = "데이터를 불러오는 중 오류가 발생했습니다.";
  }
}

/*--------------------------------------------------
  유저 목록 화면 출력 함수 (목록 내에서 권한 변경 기능 추가)
--------------------------------------------------*/
function renderUserList(users) {
  const userListDiv = document.getElementById("userList");
  userListDiv.innerHTML = "";

  for (const user of users) {
    const div = document.createElement("div");
    div.className = "user";

    let selectable = true;
    let statusText = "";

    /* 본인 계정 체크 */
    if (user.id === myId) {
      selectable = false;
      statusText = "(본인 계정)";
    } 
    /* vice 관리 정책 체크 */
    else if (myData.role === "vice") {
      if (user.role === "vice" || user.role === "president") {
        selectable = false;
        statusText = roleToText(user.role);
      }
    }

    let leftHTML = "";
    if (selectable) {
      const isChecked = selectedUsers.includes(user.id) ? "checked" : "";
      leftHTML = `<input type="checkbox" value="${user.id}" onchange="toggleSelectUser('${user.id}')" ${isChecked}>`;
    } else {
      leftHTML = `<span style="font-size: 13px; color: #a0aec0; font-weight: bold;">${statusText}</span>`;
    }

    /* 회장 권한일 때만 목록에서 바로 직관적으로 권한을 바꿀 수 있는 select 제공 */
    let roleControlHTML = roleToBadge(user.role);
    if (myData.role === "president" && user.id !== myId) {
      roleControlHTML = `
        <select onchange="changeSingleRole('${user.id}', this.value)" style="padding: 6px 10px; font-size: 13px; border-radius: 10px; margin: 0;">
          <option value="student" ${user.role === "student" ? "selected" : ""}>학생</option>
          <option value="vice" ${user.role === "vice" ? "selected" : ""}>부회장</option>
          <option value="president" ${user.role === "president" ? "selected" : ""}>회장</option>
        </select>
      `;
    }

    div.innerHTML = `
      <div class="user-info">
        ${leftHTML}
        <b>${user.id}</b>
        <span>${user.name}</span>
      </div>
      <div>
        ${roleControlHTML}
      </div>
    `;

    userListDiv.appendChild(div);
  }
}

/*--------------------------------------------------
  목록에서 개별 권한 즉시 변경 함수
--------------------------------------------------*/
window.changeSingleRole = async (targetId, newRole) => {
  if (targetId === myId) {
    alert("본인의 권한은 변경할 수 없습니다.");
    loadUsers();
    return;
  }

  try {
    await updateDoc(doc(db, "users", targetId), {
      role: newRole
    });
    alert("권한이 변경되었습니다.");
    loadUsers();
  } catch (error) {
    alert("권한 변경 중 오류가 발생했습니다.");
    loadUsers();
  }
};

/*--------------------------------------------------
  사용자 검색 필터링 함수
--------------------------------------------------*/
window.filterUsers = () => {
  const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
  
  if (!keyword) {
    renderUserList(allUsers);
    return;
  }

  const filtered = [];
  for (const user of allUsers) {
    if (user.id.toLowerCase().includes(keyword) || user.name.toLowerCase().includes(keyword)) {
      filtered.push(user);
    }
  }

  renderUserList(filtered);
};

/*--------------------------------------------------
  체크박스 선택 관리 함수 (중복 방어 포함)
--------------------------------------------------*/
window.toggleSelectUser = (id) => {
  const index = selectedUsers.indexOf(id);
  if (index > -1) {
    selectedUsers.splice(index, 1);
  } else {
    if (!selectedUsers.includes(id)) {
      selectedUsers.push(id);
    }
  }
  updateSelectedUI();
};

/*--------------------------------------------------
  선택된 사용자 UI 업데이트 함수
--------------------------------------------------*/
function updateSelectedUI() {
  const countText = document.getElementById("selectedCountText");
  const selectedListDiv = document.getElementById("selectedUserList");

  countText.innerText = `선택된 사용자 : ${selectedUsers.length}명`;

  if (selectedUsers.length === 0) {
    selectedListDiv.innerText = "선택된 사용자가 없습니다.";
    return;
  }

  let textArray = [];
  for (const id of selectedUsers) {
    for (const user of allUsers) {
      if (user.id === id) {
        textArray.push(`${user.id} ${user.name}`);
      }
    }
  }

  selectedListDiv.innerHTML = textArray.join(" | ");
}

/*--------------------------------------------------
  다중 권한 변경 함수
--------------------------------------------------*/
window.batchChangeRole = async () => {
  if (selectedUsers.length === 0) {
    alert("선택된 사용자가 없습니다.");
    return;
  }

  for (const id of selectedUsers) {
    if (id === myId) {
      alert("본인의 권한은 변경할 수 없습니다.");
      return;
    }
  }

  const newRole = document.getElementById("batchRoleSelect").value;

  if (myData.role === "vice") {
    if (newRole === "vice" || newRole === "president") {
      alert("권한이 없습니다.");
      return;
    }
  }

  let namesArray = [];
  for (const id of selectedUsers) {
    for (const user of allUsers) {
      if (user.id === id) {
        namesArray.push(`${user.id} ${user.name}`);
      }
    }
  }

  const confirmMessage = `${selectedUsers.length}명의 권한을 변경하시겠습니까?\n\n` + namesArray.join("\n");

  if (!confirm(confirmMessage)) {
    return;
  }

  try {
    for (const id of selectedUsers) {
      const targetUser = allUsers.find(user => user.id === id);
      if (targetUser && targetUser.role === newRole) {
        continue;
      }

      await updateDoc(doc(db, "users", id), {
        role: newRole
      });
    }

    alert("권한 변경 완료");
    selectedUsers = [];
    location.reload();
  } catch (error) {
    alert("권한 변경 중 오류가 발생했습니다.");
  }
};

/*--------------------------------------------------
  다중 비밀번호 초기화 함수
--------------------------------------------------*/
window.batchResetPassword = async () => {
  if (selectedUsers.length === 0) {
    alert("선택된 사용자 목록이 없습니다.");
    return;
  }

  let namesArray = [];
  for (const id of selectedUsers) {
    for (const user of allUsers) {
      if (user.id === id) {
        namesArray.push(`${user.id} ${user.name}`);
      }
    }
  }

  const confirmMessage = `${selectedUsers.length}명의 비밀번호를 초기화하시겠습니까?\n\n` + namesArray.join("\n");

  if (!confirm(confirmMessage)) {
    return;
  }

  try {
    for (const id of selectedUsers) {
      await updateDoc(doc(db, "users", id), {
        password: "qwer1234!"
      });
    }

    alert("비밀번호 초기화 완료");
    selectedUsers = [];
    location.reload();
  } catch (error) {
    alert("비밀번호 초기화 중 오류가 발생했습니다.");
  }
};

/*--------------------------------------------------
  다중 삭제 함수
--------------------------------------------------*/
window.batchDeleteUsers = async () => {
  if (selectedUsers.length === 0) {
    alert("선택된 사용자가 없습니다.");
    return;
  }

  for (const id of selectedUsers) {
    if (id === myId) {
      alert("본인의 계정은 삭제할 수 없습니다.");
      return;
    }
  }

  let namesArray = [];
  for (const id of selectedUsers) {
    for (const user of allUsers) {
      if (user.id === id) {
        namesArray.push(`${user.id} ${user.name}`);
      }
    }
  }

  const confirmMessage = `${selectedUsers.length}명을 삭제하시겠습니까?\n\n` + namesArray.join("\n");

  if (!confirm(confirmMessage)) {
    return;
  }

  try {
    for (const id of selectedUsers) {
      await deleteDoc(doc(db, "users", id));
    }

    alert("삭제 완료");
    selectedUsers = [];
    location.reload();
  } catch (error) {
    alert("삭제 중 오류가 발생했습니다.");
  }
};

/* 초기 로딩 실행 */
loadUsers();

</script>

</body>
</html>
