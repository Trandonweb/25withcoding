<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>줄다리기 | MINI GAME</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#071b12,#123b27);color:#fff;display:flex;align-items:center;justify-content:center}.wrap{width:min(900px,94vw);text-align:center;padding:24px}.top{display:flex;justify-content:space-between;opacity:.75}.title{font-size:clamp(32px,6vw,52px);font-weight:900;margin:12px}.arena{background:rgba(255,255,255,.07);border-radius:28px;padding:32px}.players{display:grid;grid-template-columns:1fr 1fr;font-size:20px;font-weight:800}.key{display:inline-flex;align-items:center;justify-content:center;background:#1ea857;border-radius:10px;width:44px;height:44px;margin:6px}.rope{position:relative;height:90px;margin:20px 0}.line{position:absolute;left:5%;right:5%;top:43px;height:12px;background:#c99b55;border-radius:20px}.marker{position:absolute;left:50%;top:28px;width:42px;height:42px;border-radius:50%;background:white;transform:translateX(-50%);transition:left .08s}.hint{margin:18px;color:#b9ddc5}.controls{display:grid;grid-template-columns:1fr 1fr;gap:15px}.control,.resultBtn{border:0;border-radius:15px;padding:20px;background:rgba(255,255,255,.1);color:white;font-size:20px;font-weight:900;cursor:pointer}.control:active,.resultBtn:active{transform:scale(.97)}.result{margin-top:22px;font-size:30px;font-weight:900;min-height:45px}.result small{display:block;font-size:14px;opacity:.7;margin:8px}.hidden{display:none!important}.note{color:#ffd98a;font-size:13px;margin-top:10px}@media(max-width:600px){.arena{padding:22px 12px}.control{padding:17px 8px}.players{font-size:17px}}
/* Shared MINI GAME visual refresh */
:root{color-scheme:dark;--mg-bg:#07110d;--mg-panel:rgba(14,35,25,.88);--mg-line:rgba(150,255,190,.18);--mg-green:#53e88a;--mg-mint:#b9ffd2}body{background:radial-gradient(ellipse at 12% 0%,#17442c 0%,transparent 42%),radial-gradient(ellipse at 100% 100%,#102d20 0%,transparent 45%),#050b08!important;color:#f3fff6!important;font-family:Inter,'Noto Sans KR',Arial,sans-serif!important}h1,h2,h3,.title,.logo{letter-spacing:-.035em}h1{ text-shadow:0 5px 28px rgba(83,232,138,.12)}button,.btn,.next,.setbtn{font-family:inherit!important;transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease!important}button:hover,.btn:hover,.next:hover,.setbtn:hover{transform:translateY(-2px);box-shadow:0 8px 24px #0005}button:focus-visible,.btn:focus-visible,.next:focus-visible,.setbtn:focus-visible{outline:2px solid var(--mg-green);outline-offset:3px}.wrap{position:relative}.arena,.setting,.summary,.history,.board,canvas,.card{box-shadow:0 18px 48px #0003}canvas{border:1px solid var(--mg-line);box-shadow:0 0 0 5px #ffffff05,0 20px 55px #0005}p{line-height:1.65}.muted,.desc,.sub{color:#b8cdbf}
/* Responsive full-screen layout: keep the game inside the visible viewport. */
html{width:100%;height:100%;overflow:hidden}
body{width:100%;height:100dvh;min-height:0!important;overflow:hidden!important;padding:clamp(6px,1.2vh,14px)!important;overscroll-behavior:none}
.wrap{width:min(100%,1000px);max-height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:clamp(3px,0.7vh,8px);padding:0!important;margin:auto}
.wrap>*{flex-shrink:0}
h1,.heading h1{font-size:clamp(21px,4.2vh,42px)!important;line-height:1.08;margin:clamp(2px,0.5vh,7px) 0!important}
p,.sub,.desc,.help{font-size:clamp(11px,1.65vh,15px);line-height:1.35}
canvas{max-width:100%;max-height:43dvh;width:auto;height:auto;object-fit:contain;margin-block:clamp(3px,0.6vh,8px)!important}
button,.btn{padding:clamp(7px,1.2vh,12px) clamp(10px,2vw,18px);font-size:clamp(11px,1.6vh,15px)}
#message{min-height:0!important;margin:clamp(2px,0.4vh,6px) 0!important;font-size:clamp(11px,1.6vh,15px)}
.top{flex-shrink:0}
@media(max-width:650px){body{padding:6px!important}.wrap{width:100%;gap:3px}.heading{margin:4px 0 6px!important}.controls{grid-template-columns:1fr 1fr!important;gap:5px!important}.control{padding:6px!important}.control span{font-size:10px!important}.arena{padding:4px!important}.scores{margin:4px 0!important}.score{padding:5px 8px!important}.score strong{font-size:clamp(16px,3vh,22px)!important}.help{margin:4px 0!important}.bottom{gap:5px!important}}
@media(max-height:620px){canvas{max-height:35dvh}.heading{margin:3px 0 5px!important}.scores{margin:3px 0!important}.controls{gap:4px!important}.control{padding:5px 8px!important}.help{margin:3px 0!important}}

/* Refined MINI GAME interface */
:root{color-scheme:light;--mg-ink:#17251c;--mg-muted:#617166;--mg-green:#187447;--mg-line:#dbe5dc}
body{background:#f2f5f1!important;color:var(--mg-ink)!important;font-family:Inter,'Noto Sans KR',system-ui,sans-serif!important}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 0% 0%,#dceee0 0,transparent 40%);z-index:-1}
.wrap{color:var(--mg-ink)!important}
.top,.sub,.desc,.muted,.hint,.instruction,.info,.help,.round,.note{color:var(--mg-muted)!important}
.arena,.setting,.summary,.history,.card,.score,.keyhelp span{background:#fff!important;color:var(--mg-ink)!important;border:1px solid var(--mg-line)!important;box-shadow:0 12px 35px #203b2810!important}
.card{border-radius:16px!important}
button,.btn,.next,.done,.resultBtn{background:#187447!important;color:#fff!important;border:1px solid #187447!important;border-radius:11px!important;font-weight:750!important}
button:disabled{opacity:.42!important}
button:hover,.btn:hover,.next:hover,.done:hover{background:#12613a!important;box-shadow:0 7px 18px #18744722!important}
input{background:#fff!important;color:var(--mg-ink)!important;border:1px solid #cbd8cd!important}
.cell{background:#e8eee9!important;border:1px solid #d5e0d7!important}
.cell.me,.p1{background:#2e9b5c!important}.cell.opp,.p2{background:#edbd56!important}
.icon{display:none!important}
#miniSoundPanel button{background:#fff!important;color:#23412d!important;border:1px solid #d4e0d5!important;box-shadow:0 4px 14px #0001!important}
@media(max-width:650px){.card .desc{display:none!important}#projectShortDescription,#projectCreator{display:block!important}.wrap{padding:0!important}}
</style></head><body><div class="wrap"><div class="top"><span id="round"></span><span id="mode"></span></div><div class="title"> 줄다리기</div><div class="arena"><div class="players"><div><span id="leftName">1P</span> <span class="key">A</span></div><div><span class="key" id="oppKey">L</span><span id="oppName">2P</span></div></div><div class="rope"><div class="line"></div><div class="marker" id="marker">●</div></div><div class="hint" id="hint">A를 빠르게 연타하세요!</div><div class="controls"><button class="control" id="left">A 당기기<small>키보드 A / 클릭</small></button><button class="control" id="right">L 당기기<small>키보드 L / 클릭</small></button></div><div class="note hidden" id="note">온라인 상대 입력은 연결 후 반영됩니다.</div><div class="result" id="result"></div><button class="resultBtn hidden" id="done">결과 확인 →</button></div></div><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu',modeName:'컴퓨터와 대전'};const mode=s.mode||'cpu';let pos=50,playing=true,cpu=null,cpuHeat=0;const $=id=>document.getElementById(id);$('mode').textContent=s.modeName||'컴퓨터와 대전';$('round').textContent=s.round?`${s.round}번째 게임`:'';if(mode==='local'){$('leftName').textContent='1P';$('oppName').textContent='2P';$('hint').textContent='1P는 A, 2P는 L을 눌러 당기세요.'}else if(mode==='cpu'){$('leftName').textContent='플레이어';$('oppName').textContent='컴퓨터';$('oppKey').textContent='';$('right').disabled=true;$('right').style.opacity='.45';$('hint').textContent='A를 빠르게 연타해서 컴퓨터보다 먼저 당기세요!';function cpuStep(){if(!playing)return;const delay=Math.max(210,560-Math.min(250,cpuHeat*7)+Math.random()*170);cpu=setTimeout(()=>{if(!playing)return;cpuHeat++;pull('opp',Math.random()<.24?3.1:2.15);cpuStep()},delay)}cpuStep()}else if(mode==='online'){$('oppName').textContent='온라인 상대';$('oppKey').textContent='?';$('right').disabled=true;$('right').style.opacity='.45';$('note').classList.remove('hidden')}function pull(who,force=1.75){if(!playing||(mode==='online'&&window.mgOnline?.role==='guest'))return;pos=Math.max(5,Math.min(95,pos+(who==='me'?-force:force)));$('marker').style.left=pos+'%';window.mgOnline?.publish({game:'game1',pos,playing});window.miniGameSound?.('score');if(pos<=5)finish('me');if(pos>=95)finish('opp')}function finish(winner){if(!playing)return;playing=false;clearTimeout(cpu);window.mgOnline?.publish({game:'game1',pos,playing:false,winner});window.miniGameSound?.('win');const text=winner==='me'?'승리':'패배';$('result').innerHTML=text+'<small>라운드 결과</small>';$('done').classList.remove('hidden');localStorage.setItem('miniGameResult',JSON.stringify({game:' 줄다리기',winner,me:winner==='me'?1:0,opp:winner==='opp'?1:0}))}$('left').onclick=()=>pull('me');$('right').onclick=()=>{if(mode==='local')pull('opp')};document.addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k==='a')pull('me');if(k==='l'&&mode==='local')pull('opp')});window.addEventListener('mg-online-ready',()=>window.mgOnline?.listen(state=>{if(state?.game!=='game1')return;pos=state.pos;playing=state.playing;$('marker').style.left=pos+'%';if(!playing&&state.winner){$('result').innerHTML=(state.winner==='me'?'방장 승리':'방장 패배')+'<small>라운드 결과</small>';$('done').classList.remove('hidden')}}));$('done').onclick=()=>location.href='../index.html';</script><div id="miniSoundPanel" style="position:fixed;right:14px;bottom:14px;z-index:9999"><button id="miniSoundToggle" type="button" aria-pressed="true" style="border:1px solid #ffffff35;border-radius:999px;padding:10px 14px;background:#10251a;color:#effff4;font:700 13px Arial,sans-serif;box-shadow:0 6px 22px #0006;cursor:pointer"> 소리 켜짐</button></div><script>(function(){let enabled=localStorage.getItem('miniGameSound')!=='off',audio=null,lastKeySound=0;const btn=document.getElementById('miniSoundToggle');function label(){btn.textContent=enabled?'소리 켜짐':'소리 꺼짐';btn.setAttribute('aria-pressed',String(enabled))}function sound(kind='ui'){if(!enabled)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audio=audio||new AC();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const seq=kind==='win'?[523,659,784]:kind==='score'?[660,880]:kind==='hit'?[220,165]:kind==='bounce'?[420]:kind==='jump'?[440,660]:kind==='key'?[330]:[520];seq.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='hit'?'triangle':'sine';o.frequency.setValueAtTime(hz,now+i*.075);g.gain.setValueAtTime(.0001,now+i*.075);g.gain.exponentialRampToValueAtTime(((kind==='ui'||kind==='key')?0.035:0.065),now+i*.075+.012);g.gain.exponentialRampToValueAtTime(.0001,now+i*.075+.11);o.connect(g);g.connect(audio.destination);o.start(now+i*.075);o.stop(now+i*.075+.12)})}catch(e){}}window.miniGameSound=sound;btn.addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('miniGameSound',enabled?'on':'off');label();if(enabled)sound('ui')});document.addEventListener('click',e=>{if(e.target.closest('#miniSoundPanel'))return;if(e.target.closest('button'))sound('ui')},true);document.addEventListener('keydown',e=>{if(e.repeat||!['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code))return;const now=performance.now();if(now-lastKeySound>75){sound('key');lastKeySound=now}},true);label()})();</script><script type="module" src="../online-sync.js"></script></body></html>
