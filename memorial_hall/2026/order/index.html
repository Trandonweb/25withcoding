<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>축제 주문 시스템 보안 점검</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#17211b;background:#f3f6f4}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(100%,520px);background:#fff;border:1px solid #dce6df;border-radius:20px;padding:28px;box-shadow:0 10px 36px #173b2512}
    .badge{display:inline-block;background:#fff0d8;color:#865400;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700}
    h1{font-size:1.4rem;margin:18px 0 10px}p{line-height:1.7;color:#526158}
    a{display:inline-block;margin-top:10px;padding:11px 15px;border-radius:10px;background:#23834a;color:#fff;text-decoration:none;font-weight:650}
    small{display:block;margin-top:18px;color:#6b786f;line-height:1.5}
    @media(prefers-color-scheme:dark){:root{color:#e9f1eb;background:#111814}main{background:#1b251f;border-color:#33443a}p,small{color:#b2c1b6}}
  </style>
</head>
<body><main>
  <span class="badge">보안 점검 중</span>
  <h1>축제 주문 시스템을 임시 중단했습니다.</h1>
  <p>현재 관리자 비밀번호가 브라우저 코드에 포함되어 있고, 서버 측 주문 권한 검증을 확인할 수 없어 주문 기능을 잠시 중단합니다. 이 페이지는 주문 데이터에 연결하지 않습니다.</p>
  <a href="/memorial_hall">기념관 홈으로</a>
  <small>주문 시스템은 서버 측 권한 검증과 Firestore 규칙 검토 후 다시 열 예정입니다.</small>
</main></body>
</html>
