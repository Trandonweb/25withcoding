<script type="module">

const firebaseConfig={apiKey:'AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9',authDomain:'festivallikes.firebaseapp.com',projectId:'festivallikes',storageBucket:'festivallikes.firebasestorage.app',messagingSenderId:'782245120700',appId:'1:782245120700:web:c61e16313e9ae688e6deb9'};
const loginConfig={apiKey:'AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20',authDomain:'points2026-f5e50.firebaseapp.com',projectId:'points2026-f5e50'};
const db=getFirestore(initializeApp(firebaseConfig)),loginDB=getFirestore(initializeApp(loginConfig,'loginApp'));
const $=id=>document.getElementById(id),coinCharacters={1:'A',2:'F',3:'K',4:'P',5:'U'},CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';let last='';
function discriminator(people){return coinCharacters[Number(people)]||''}
function random(n){const a=new Uint32Array(n);crypto.getRandomValues(a);return Array.from(a,x=>CHARS[x%CHARS.length]).join('')}
function alpha(){const a=new Uint32Array(1);crypto.getRandomValues(a);return 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[a[0]%26]}
function booth(){return document.querySelector('input[name="booth"]:checked').value}
function updateRule(){const t=$('team').value,b=booth(),p=document.querySelector('input[name="people"]:checked')?.value,d=p?discriminator(p):'판별문자';$('rule').innerHTML=b==='coding'?`현재 <strong>코딩과 함께라면</strong> · <strong>${t}팀</strong><br>코드 형식: <span class="code-rule">(이용권 수)(랜덤)(랜덤)(랜덤)(판별문자)</span><br>판별문자: <strong>A=1인권 · F=2인권 · K=3인권 · P=4인권 · U=5인권</strong>${p?` · 현재 <strong>${d}</strong>`:''}`:`현재 <strong>S A N C A F E</strong> · <strong>${t}팀</strong><br>코드 형식: <span class="code-rule">(알파벳)(랜덤)(랜덤)(랜덤)(판별문자)</span><br>판별문자: <strong>A=1인권 · F=2인권 · K=3인권 · P=4인권 · U=5인권</strong>${p?` · 현재 <strong>${d}</strong>`:''}`}
function makeCode(p,b){const lastChar=discriminator(p);return b==='coding'?`${p}${random(3)}${lastChar}`:`${alpha()}${random(3)}${lastChar}`}
async function access(){const id=localStorage.getItem('userId');if(!id){$('denied').style.display='flex';return false}try{const s=await getDoc(doc(loginDB,'users',id));if(!s.exists())throw 0;const u=s.data();if(!(u.role==='president'||u.role==='vice'||u.coinManager===true))throw 0;$('app').style.display='block';return true}catch(e){$('denied').style.display='flex';return false}}
async function generate(){const sel=document.querySelector('input[name="people"]:checked');if(!sel){$('status').className='status error';$('status').textContent='이용권 수를 선택해주세요.';return}const p=Number(sel.value),b=booth(),t=Number($('team').value);$('generate').disabled=true;$('issued').style.display='none';$('status').className='status';$('status').textContent='이용권을 발급하는 중...';try{let saved=null;for(let i=0;i<20&&!saved;i++){const code=makeCode(p,b),ref=doc(db,'accesscodes',code);const ok=await runTransaction(db,async tx=>{if((await tx.get(ref)).exists())return false;tx.set(ref,{max:p,used:0,active:true,team:t,booth:b,createdAt:serverTimestamp(),createdBy:localStorage.getItem('userId')||'unknown'});return true});if(ok)saved=code}if(!saved)throw Error('FAIL');last=saved;$('issuedCode').textContent=saved;$('issuedInfo').textContent=`${t}팀 · ${b==='coding'?'코딩과 함께라면':'S A N C A F E'} · ${p}인권 · 판별문자 ${discriminator(p)}`;$('issued').style.display='block';$('status').className='status success';$('status').textContent=`${saved} 발급 완료!`;sel.checked=false;updateRule()}catch(e){console.error(e);$('status').className='status error';$('status').textContent='이용권 발급에 실패했습니다.'}finally{$('generate').disabled=false}}
$('generate').onclick=generate;$('team').onchange=updateRule;document.querySelectorAll('input[name="booth"]').forEach(x=>x.onchange=updateRule);document.querySelectorAll('input[name="people"]').forEach(x=>x.onchange=updateRule);
$('copy').onclick=async()=>{if(!last)return;try{await navigator.clipboard.writeText(last);$('copy').textContent='복사됨';setTimeout(()=>$('copy').textContent='복사하기',1200)}catch(e){alert(`코드: ${last}`)}};
function name(b){return b==='sancafe'?'S A N C A F E':'코딩과 함께라면'}function date(x){return x?.toDate?x.toDate().toLocaleString('ko-KR'):'-'}
async function toggle(id,a){const n=!a;if(!confirm(`이 이용권을 ${n?'활성화':'비활성화'}할까요?\n\n${id}`))return;try{await updateDoc(doc(db,'accesscodes',id),{active:n})}catch(e){alert('변경에 실패했습니다.')}}async function del(id){if(!confirm(`정말 삭제할까요?\n\n${id}`))return;try{await deleteDoc(doc(db,'accesscodes',id))}catch(e){alert('삭제에 실패했습니다.')}}

let latestCodes=[];

 if(!latestCodes.length){alert('내보낼 이용권 데이터가 없습니다.');return}

 const wb=XLSX.utils.book_new();
 const rows=[
  ['2026 FESTIVAL','이용권 발급 현황 보고서','','','','','','',''],
  ['코딩과 함께라면 × S A N C A F E','발급 데이터 관리용 · 생성 시각: '+new Date().toLocaleString('ko-KR'),'','','','','','',''],
  ['총 이용권',latestCodes.length,'활성',latestCodes.filter(x=>x.active).length,'비활성',latestCodes.filter(x=>!x.active).length,'총 허용 이용',latestCodes.reduce((n,x)=>n+x.max,0),'총 사용 횟수'],
  [null,null,null,null,null,null,null,null,latestCodes.reduce((n,x)=>n+x.used,0)],
  [],
  ['인증키','팀','부스','권한 인원','사용 횟수','잔여 횟수','상태','발급 일시','발급 관리자']
 ];
 latestCodes.forEach(x=>rows.push([x.code,x.team?x.team+'팀':'-',x.booth==='coding'?'코딩과 함께라면':x.booth==='sancafe'?'S A N C A F E':'-',x.max,x.used,x.remaining,x.active?'활성':'비활성',x.createdAt,x.createdBy||'-']));
 const ws=XLSX.utils.aoa_to_sheet(rows);
 ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:8}},{s:{r:1,c:0},e:{r:1,c:8}}];
 ws['!cols']=[{wch:16},{wch:9},{wch:23},{wch:12},{wch:12},{wch:12},{wch:11},{wch:23},{wch:20}];

 ws['!freeze']={xSplit:0,ySplit:6};
 const green='00C853',dark='15151C',white='FFFFFF',muted='667085';
 function style(cell,s){if(ws[cell])ws[cell].s=s}

 for(let c=0;c<9;c++){const col=XLSX.utils.encode_col(c);style(col+'1',titleStyle);style(col+'2',subtitleStyle)}
 for(const cell of ['A3','C3','E3','G3','I3'])style(cell,{font:{name:'맑은 고딕',sz:10,bold:true,color:{rgb:white}},fill:{fgColor:{rgb:'16803D'}},alignment:{horizontal:'center',vertical:'center'}});
 for(const cell of ['B3','D3','F3','H3','I4'])style(cell,{font:{name:'맑은 고딕',sz:14,bold:true,color:{rgb:'101820'}},fill:{fgColor:{rgb:'E8F8EE'}},alignment:{horizontal:'center',vertical:'center'}});
 for(let c=0;c<9;c++)style(XLSX.utils.encode_col(c)+'6',{font:{name:'맑은 고딕',sz:10,bold:true,color:{rgb:white}},fill:{fgColor:{rgb:green}},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:{bottom:{style:'medium',color:{rgb:'008A3A'}}}});
 for(let r=7;r<=rows.length;r++){
  for(let c=0;c<9;c++){
   const cell=XLSX.utils.encode_cell({r:r-1,c});
   style(cell,{font:{name:'맑은 고딕',sz:10,color:{rgb:'20252B'}},fill:{fgColor:{rgb:r%2===0?'F2F8F4':'FFFFFF'}},alignment:{vertical:'center',horizontal:c===0?'center':(c===3||c===4||c===5?'center':'left')},border:{bottom:{style:'thin',color:{rgb:'DDE5DF'}}}});
  }
  style('G'+r,{font:{name:'맑은 고딕',sz:10,bold:true,color:{rgb:latestCodes[r-7]?.active?'16803D':'C0392B'}},fill:{fgColor:{rgb:latestCodes[r-7]?.active?'E8F8EE':'FDECEC'}},alignment:{horizontal:'center',vertical:'center'}});
  ws['!rows'][r-1]={hpt:22};
 }
 ws['!sheetViews']=[{showGridLines:false}];
 XLSX.utils.book_append_sheet(wb,ws,'이용권 현황');
 const guide=XLSX.utils.aoa_to_sheet([
  ['사용 안내'],
  ['2026 FESTIVAL · 이용권 관리'],
  ['1. 첫 번째 시트에서 인증키별 팀, 부스, 이용 가능 인원, 사용량 및 상태를 확인할 수 있습니다.'],
  ['2. 비활성 이용권은 상태 열에 비활성으로 표시됩니다.'],
  ['3. 이 파일은 다운로드 시점의 스냅샷이며, 이후 사이트에서 변경한 내용은 자동 반영되지 않습니다.'],
  ['4. 인증키는 이용권 접근에 사용될 수 있으므로 파일을 안전하게 보관하세요.'],
  [''],
  ['다운로드 시각',new Date().toLocaleString('ko-KR')],
  ['관리 페이지','https://25withcoding.kr/2026festival/coins.html']
 ]);
 guide['!cols']=[{wch:88},{wch:34}];
 guide['!merges']=[{s:{r:0,c:0},e:{r:0,c:1}},{s:{r:1,c:0},e:{r:1,c:1}},{s:{r:2,c:0},e:{r:2,c:1}},{s:{r:3,c:0},e:{r:3,c:1}},{s:{r:4,c:0},e:{r:4,c:1}},{s:{r:5,c:0},e:{r:5,c:1}}];
 styleGuide(guide,XLSX);
 XLSX.utils.book_append_sheet(wb,guide,'안내');
 const stamp=new Date().toISOString().slice(0,10).replace(/-/g,'');
 XLSX.writeFile(wb,'2026_Festival_이용권현황_'+stamp+'.xlsx',{cellStyles:true});
}

 for(let c=0;c<2;c++){const a=XLSX.utils.encode_col(c)+'1';if(ws[a])ws[a].s={font:{name:'맑은 고딕',sz:18,bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'101820'}},alignment:{vertical:'center'}}}

 const selected=[...document.querySelectorAll('.pass-select:checked')].map(x=>latestCodes.find(c=>c.code===x.value)).filter(Boolean);
 if(!selected.length){alert('먼저 배부할 이용권의 체크 박스를 선택해주세요.');return}
 if(!window.XLSX){alert('Excel 모듈을 불러오지 못했습니다. 페이지를 새로고침한 뒤 다시 시도해주세요.');return}
 const wb=XLSX.utils.book_new(),rows=[['2026  /  SCHOOL FESTIVAL','','','','','','','',''],['FESTIVAL PASS · 배부용 이용권','','','','','','','','']];
 const ws=XLSX.utils.aoa_to_sheet(rows);
 ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:8}},{s:{r:1,c:0},e:{r:1,c:8}}];
 ws['!cols']=[{wch:4},{wch:12},{wch:12},{wch:12},{wch:12},{wch:4},{wch:4},{wch:12},{wch:12}];
 ws['!rows']=[{hpt:26},{hpt:22}];
 const green='16803D',ink='17352A',mint='EAF5EC',white='FFFFFF',gray='5F7165',line='C8D9CC';
 function cellStyle(addr,s){if(ws[addr])ws[addr].s=s}
 for(let col=0;col<9;col++){const a=XLSX.utils.encode_col(col);cellStyle(a+'1',{font:{name:'맑은 고딕',sz:16,bold:true,color:{rgb:white}},fill:{fgColor:{rgb:ink}},alignment:{horizontal:'center',vertical:'center'}});cellStyle(a+'2',{font:{name:'맑은 고딕',sz:11,bold:true,color:{rgb:green}},fill:{fgColor:{rgb:mint}},alignment:{horizontal:'center',vertical:'center'}})}
 selected.forEach((x,i)=>{
  const top=4+i*9;
  const booth=x.booth==='coding'?'코딩과 함께라면':'S A N C A F E';
  const ticket=[
   ['2026  /  SCHOOL FESTIVAL','','','','','','','',''],
   [booth,'','','','','','','',''],
   ['FESTIVAL PASS  ·  인증키','','','','','','','',''],

   [(x.team?x.team+'팀':'팀 미지정')+'   ·   '+x.max+'인 이용권','','','','','','','',''],
   [x.active?'입장 시 이 인증키를 제시해 주세요.':'비활성 이용권 · 배부하지 마세요.','','','','','','','',''],

  ];
  ticket.forEach((r,j)=>{const row=top+j;XLSX.utils.sheet_add_aoa(ws,[r],{origin:'A'+row});ws['!rows'][row-1]={hpt:[22,28,20,38,23,22,18,20][j]};ws['!merges']=ws['!merges']||[];ws['!merges'].push({s:{r:row-1,c:0},e:{r:row-1,c:8}});const addr='A'+row;const font=j===3?{name:'Consolas',sz:24,bold:true,color:{rgb:green}}:{name:'맑은 고딕',sz:j===1?15:(j===0?9:10),bold:j===0||j===1||j===3||j===7,color:{rgb:j===0||j===7?white:(j===1?ink:gray)}};const fill=j===0||j===7?{fgColor:{rgb:j===0?ink:green}}:(j===1||j===4?{fgColor:{rgb:mint}}:undefined);cellStyle(addr,{font,fill,alignment:{horizontal:'center',vertical:'center',wrapText:true},border:{top:{style:j===0?'medium':'thin',color:{rgb:line}},bottom:{style:j===7?'medium':'thin',color:{rgb:line}},left:{style:'medium',color:{rgb:green}},right:{style:'medium',color:{rgb:green}}}})});
  if(i<selected.length-1){const gap=top+8;ws['!rows'][gap-1]={hpt:12}}
 });
 ws['!autofilter']=undefined;ws['!sheetViews']=[{showGridLines:false}];
 XLSX.utils.book_append_sheet(wb,ws,'배부용 이용권');
 const stamp=new Date().toISOString().slice(0,10).replace(/-/g,'');
 XLSX.writeFile(wb,'2026_Festival_배부용_선택_'+stamp+'.xlsx',{cellStyles:true});

function load(){onSnapshot(query(collection(db,'accesscodes'),orderBy('createdAt','desc')),s=>{latestCodes=s.docs.filter(x=>x.id!=='_meta').map(x=>{const v=x.data(),used=Number(v.used??v.usedCount??0),max=Number(v.max??v.maxUses??0);return{code:x.id,team:v.team,booth:v.booth,max,used,remaining:Math.max(0,max-used),active:v.active!==false,createdAt:date(v.createdAt),createdBy:v.createdBy||'-'}});const list=$('list');list.innerHTML='';if(!s.size){list.innerHTML='<div class="empty">아직 발급된 이용권이 없습니다.</div>';return}s.forEach(x=>{const v=x.data(),used=Number(v.used||0),max=Number(v.max||0),active=v.active!==false,remaining=Math.max(0,max-used),el=document.createElement('div');el.className='code-item';el.innerHTML=`<label style="display:flex;align-items:center;gap:8px;grid-column:1/-1;color:#bbb;font-size:13px"><input class="pass-select" type="checkbox" value="${x.id}" style="width:18px;height:18px;accent-color:#00c853"> 배부용 출력에 포함</label><div><div class="code">${x.id}</div><div class="info">${v.team?`${v.team}팀 · `:''}${v.booth?`${name(v.booth)} · `:''}${used}/${max} 사용 · 잔여 ${remaining}<br>발급: ${date(v.createdAt)}</div></div><span class="badge ${active?'':'inactive'}">${active?'활성':'비활성'}</span><button class="action" data-action="toggle">${active?'비활성화':'활성화'}</button><button class="action danger" data-action="delete">삭제</button>`;el.querySelector('[data-action="toggle"]').onclick=()=>toggle(x.id,active);el.querySelector('[data-action="delete"]').onclick=()=>del(x.id);list.appendChild(el)})},e=>{console.error(e);$('list').innerHTML='<div class="empty">이용권을 불러오지 못했습니다.</div>'})}
updateRule();access().then(ok=>{if(ok)load()});
