<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2026 Festival · 이용권 관리</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: sans-serif;
  background: #0f0f14;
  color: white;
}

/* ================================
   Header
================================ */

header {
  position: sticky;
  top: 0;
  z-index: 100;

  padding: 18px 24px;

  background: linear-gradient(
    90deg,
    #00c853,
    #64dd17
  );

  box-shadow: 0 4px 20px rgba(0,0,0,.3);
}

.header-inner {
  max-width: 1100px;
  margin: auto;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 20px;
}

.logo {
  font-family: "Black Han Sans", sans-serif;
  font-size: 25px;
}

.back {
  color: white;
  text-decoration: none;
  font-size: 14px;
}

.back:hover {
  text-decoration: underline;
}


/* ================================
   Container
================================ */

.container {
  width: min(1100px, calc(100% - 32px));
  margin: 30px auto 60px;
}


/* ================================
   Page title
================================ */

.page-title {
  margin-bottom: 25px;
}

.page-title h1 {
  margin: 0;

  font-family:
    "Black Han Sans",
    sans-serif;

  font-size: 32px;
}

.page-title p {
  margin: 8px 0 0;

  color: #aaa;

  font-size: 14px;
}


/* ================================
   Card
================================ */

.card {
  background: #1c1c25;

  border:
    1px solid
    rgba(255,255,255,.06);

  border-radius: 18px;

  padding: 24px;

  margin-bottom: 20px;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.2);
}

.card-title {
  margin: 0 0 18px;

  font-size: 19px;
  font-weight: bold;
}


/* ================================
   Coin types
================================ */

.coin-types {
  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 10px;
}

.coin-type {
  position: relative;
}

.coin-type input {
  position: absolute;

  opacity: 0;

  pointer-events: none;
}

.coin-type label {
  display: block;

  padding: 16px 8px;

  text-align: center;

  background: #15151c;

  border:
    1px solid
    #353540;

  border-radius: 12px;

  cursor: pointer;

  transition: .2s;
}

.coin-type label:hover {
  border-color: #00c853;
}

.coin-type input:checked + label {
  border-color: #00c853;

  background:
    rgba(0,200,83,.12);

  box-shadow:
    0 0 0 2px
    rgba(0,200,83,.08);
}

.coin-number {
  font-size: 22px;
  font-weight: bold;
}

.coin-char {
  margin-top: 5px;

  color: #8cff9c;

  font-size: 12px;
}


/* ================================
   Generate button
================================ */

.generate-btn {
  width: 100%;

  height: 52px;

  margin-top: 18px;

  border: none;

  border-radius: 12px;

  background:
    linear-gradient(
      90deg,
      #00c853,
      #64dd17
    );

  color: white;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

  transition: .2s;
}

.generate-btn:hover {
  filter: brightness(.93);
}

.generate-btn:active {
  transform: scale(.99);
}

.generate-btn:disabled {
  opacity: .5;

  cursor: not-allowed;
}


/* ================================
   Status
================================ */

.status {
  min-height: 20px;

  margin-top: 12px;

  text-align: center;

  color: #aaa;

  font-size: 13px;
}

.status.error {
  color: #ff7070;
}

.status.success {
  color: #8cff9c;
}


/* ================================
   Code list
================================ */

.code-list {
  display: flex;

  flex-direction: column;

  gap: 10px;
}

.code-item {
  display: grid;

  grid-template-columns:
    1fr
    auto
    auto
    auto
    auto;

  align-items: center;

  gap: 12px;

  padding: 15px;

  background: #15151c;

  border-radius: 12px;

  transition: .15s;
}

.code-item:hover {
  background: #191921;
}

.code-main {
  min-width: 0;
}

.code {
  font-family: monospace;

  font-size: 18px;

  font-weight: bold;

  letter-spacing: 1px;

  word-break: break-all;
}

.code-info {
  margin-top: 5px;

  color: #999;

  font-size: 12px;
}

.badge {
  padding: 6px 9px;

  border-radius: 8px;

  background:
    rgba(0,200,83,.12);

  color: #8cff9c;

  font-size: 12px;

  white-space: nowrap;
}


/* ================================
   Buttons
================================ */

.action-btn {
  border: none;

  border-radius: 8px;

  padding: 9px 12px;

  background: #292933;

  color: white;

  cursor: pointer;

  transition: .15s;

  white-space: nowrap;
}

.action-btn:hover {
  background: #353540;
}

.action-btn.danger {
  color: #ff8585;
}

.action-btn.danger:hover {
  background:
    rgba(255,80,80,.12);
}


/* ================================
   Empty
================================ */

.empty {
  padding: 35px;

  text-align: center;

  color: #777;
}

.loading {
  padding: 50px;

  text-align: center;

  color: #aaa;
}


/* ================================
   Access denied
================================ */

#denied {
  display: none;

  min-height: 100vh;

  align-items: center;

  justify-content: center;

  padding: 20px;
}

.denied-card {
  width:
    min(420px, 100%);

  padding: 35px;

  text-align: center;

  background: #1c1c25;

  border-radius: 20px;
}

.denied-icon {
  font-size: 48px;
}

.denied-card h1 {
  margin: 12px 0;
}

.denied-card p {
  color: #aaa;

  line-height: 1.7;
}

.denied-card a {
  display: inline-block;

  margin-top: 15px;

  color: #8cff9c;
}


/* ================================
   App
================================ */

#app {
  display: none;
}


/* ================================
   Mobile
================================ */

@media (max-width: 800px) {

  .coin-types {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .code-item {
    grid-template-columns:
      1fr auto;
  }

  .badge {
    justify-self: start;
  }

  .action-btn {
    width: 100%;
  }

}


@media (max-width: 500px) {

  .coin-types {
    grid-template-columns:
      1fr;
  }

  .container {
    width:
      calc(100% - 20px);
  }

  .card {
    padding: 17px;
  }

  .page-title h1 {
    font-size: 27px;
  }

  .logo {
    font-size: 20px;
  }

  header {
    padding: 15px;
  }

}
</style>
</head>


<body>

<main class="container">

<script type="module">


/* ==================================================
   Firebase
================================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  onSnapshot,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


/* ==================================================
   Festival Firebase
================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9Q",

  authDomain:
    "festivallikes.firebaseapp.com",

  projectId:
    "festivallikes",

  storageBucket:
    "festivallikes.firebasestorage.app",

  messagingSenderId:
    "782245120700",

  appId:
    "1:782245120700:web:c61e16313e9ae688e6deb9"

};


const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getFirestore(app);


/* ==================================================
   로그인 Firebase
================================================== */

const loginFirebaseConfig = {

  apiKey:
    "AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",

  authDomain:
    "points2026-f5e50.firebaseapp.com",

  projectId:
    "points2026-f5e50"

};


const loginApp =
  initializeApp(
    loginFirebaseConfig,
    "loginApp"
  );


const loginDB =
  getFirestore(loginApp);


/* ==================================================
   Elements
================================================== */

const appElement =
  document.getElementById(
    "app"
  );


const deniedElement =
  document.getElementById(
    "denied"
  );


const generateButton =
  document.getElementById(
    "generateButton"
  );


const generateStatus =
  document.getElementById(
    "generateStatus"
  );


const codeList =
  document.getElementById(
    "codeList"
  );


/* ==================================================
   이용권 규칙
================================================== */

const coinCharacters = {

  1: "L",
  2: "W",
  3: "B",
  4: "M",
  5: "X"

};


/* ==================================================
   관리자 권한 확인
================================================== */

async function checkAdminAccess() {

  const userId =
    localStorage.getItem(
      "userId"
    );


  if (!userId) {

    denyAccess();

    return false;

  }


  try {

    const userRef =
      doc(
        loginDB,
        "users",
        userId
      );


    const userSnap =
      await getDoc(
        userRef
      );


    if (!userSnap.exists()) {

      denyAccess();

      return false;

    }


    const user =
      userSnap.data();


    /*
     * 접근 가능한 계정
     *
     * president
     * vice
     * coinManager === true
     */

    const allowed =
      user.role === "president" ||
      user.role === "vice" ||
      user.coinManager === true;


    if (!allowed) {

      denyAccess();

      return false;

    }


    appElement.style.display =
      "block";

    return true;

  }

  catch (error) {

    console.error(
      "관리자 권한 확인 실패:",
      error
    );

    denyAccess();

    return false;

  }

}


/* ==================================================
   접근 거부
================================================== */

function denyAccess() {

  appElement.style.display =
    "none";

  deniedElement.style.display =
    "flex";

}


/* ==================================================
   랜덤 코드
================================================== */

function randomString(length) {

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


  let result = "";


  const randomValues =
    new Uint32Array(
      length
    );


  crypto.getRandomValues(
    randomValues
  );


  for (
    let i = 0;
    i < length;
    i++
  ) {

    result +=
      chars[
        randomValues[i] %
        chars.length
      ];

  }


  return result;

}


/* ==================================================
   코드 생성
================================================== */

function createAccessCode(
  people
) {

  /*
   * 65 + 인원 × 11
   *
   * 1 → 76 → L
   * 2 → 87 → W
   * 3 → 98 → B
   * 4 → 109 → M
   * 5 → 120 → X
   *
   * JavaScript에서 ASCII를
   * 직접 계산해서 마지막 문자를 생성
   */

  const ascii =
    65 + people * 11;


  const lastCharacter =
    String.fromCharCode(
      ascii
    ).toUpperCase();


  return (
    "F26-" +
    randomString(5) +
    lastCharacter
  ).toUpperCase();

}


/* ==================================================
   코드 발급
================================================== */

async function generateCode() {

  const selected =
    document.querySelector(
      'input[name="coinType"]:checked'
    );


  if (!selected) {

    generateStatus.className =
      "status error";

    generateStatus.textContent =
      "이용권 종류를 선택해주세요.";

    return;

  }


  const people =
    Number(
      selected.value
    );


  if (
    people < 1 ||
    people > 5
  ) {

    return;

  }


  generateButton.disabled =
    true;


  generateStatus.className =
    "status";


  generateStatus.textContent =
    "이용권을 발급하는 중...";


  try {

    let code;

    let codeRef;


    /*
     * 중복 방지
     */

    while (true) {

      code =
        createAccessCode(
          people
        );


      codeRef =
        doc(
          db,
          "accessCodes",
          code
        );


      const existing =
        await getDoc(
          codeRef
        );


      if (
        !existing.exists()
      ) {

        break;

      }

    }


    /* ================================
       _meta 최초 생성
    ================================= */

    const metaRef =
      doc(
        db,
        "accessCodes",
        "_meta"
      );


    const metaSnap =
      await getDoc(
        metaRef
      );


    if (
      !metaSnap.exists()
    ) {

      await setDoc(
        metaRef,
        {

          initialized:
            true,

          version:
            1,

          createdAt:
            serverTimestamp()

        }
      );

    }


    /* ================================
       코드 저장
    ================================= */

    await setDoc(
      codeRef,
      {

        type:
          `${people}인권`,

        people:
          people,

        maxUses:
          people,

        usedCount:
          0,

        active:
          true,

        createdAt:
          serverTimestamp(),

        createdBy:
          localStorage.getItem(
            "userId"
          )

      }
    );


    generateStatus.className =
      "status success";


    generateStatus.textContent =
      `${code} 발급 완료!`;


    selected.checked =
      false;

  }

  catch (error) {

    console.error(
      "이용권 발급 실패:",
      error
    );


    generateStatus.className =
      "status error";


    generateStatus.textContent =
      "이용권 발급에 실패했습니다.";

  }


  generateButton.disabled =
    false;

}


/* ==================================================
   코드 복사
================================================== */

async function copyCode(
  code,
  button
) {

  try {

    await navigator.clipboard.writeText(
      code
    );


    const oldText =
      button.textContent;


    button.textContent =
      "복사됨";


    setTimeout(
      () => {

        button.textContent =
          oldText;

      },
      1200
    );

  }

  catch (error) {

    console.error(
      error
    );


    alert(
      "코드를 복사하지 못했습니다.\n\n" +
      code
    );

  }

}


/* ==================================================
   폐기 / 재활성화
================================================== */

async function toggleCode(
  id,
  active
) {

  const action =
    active
      ? "폐기"
      : "재활성화";


  const confirmed =
    confirm(
      `이 이용권을 ${action}할까요?\n\n${id}`
    );


  if (!confirmed) {
    return;
  }


  try {

    await updateDoc(

      doc(
        db,
        "accessCodes",
        id
      ),

      {
        active:
          !active
      }

    );

  }

  catch (error) {

    console.error(
      "이용권 상태 변경 실패:",
      error
    );


    alert(
      "이용권 상태 변경에 실패했습니다."
    );

  }

}


/* ==================================================
   삭제
================================================== */

async function deleteCode(
  id
) {

  const confirmed =
    confirm(

      `정말 이 이용권을 삭제할까요?\n\n` +

      `${id}\n\n` +

      `⚠️ 삭제하면 복구할 수 없습니다.`

    );


  if (!confirmed) {

    return;

  }


  try {

    await deleteDoc(

      doc(
        db,
        "accessCodes",
        id
      )

    );


    /*
     * onSnapshot이 자동으로
     * 목록을 갱신한다.
     */

  }

  catch (error) {

    console.error(
      "이용권 삭제 실패:",
      error
    );


    alert(
      "이용권 삭제에 실패했습니다."
    );

  }

}


/* ==================================================
   이용권 목록
================================================== */

function loadCodes() {

  onSnapshot(

    collection(
      db,
      "accessCodes"
    ),


    snapshot => {

      const codes = [];


      snapshot.forEach(
        item => {

          /*
           * _meta 제외
           */

          if (
            item.id === "_meta"
          ) {

            return;

          }


          codes.push({

            id:
              item.id,

            ...item.data()

          });

        }
      );


      /*
       * 최신 발급 순
       */

      codes.sort(
        (a, b) => {

          const aTime =
            a.createdAt
              ?.toMillis?.() || 0;


          const bTime =
            b.createdAt
              ?.toMillis?.() || 0;


          return bTime - aTime;

        }
      );


      codeList.innerHTML =
        "";


      if (
        codes.length === 0
      ) {

        codeList.innerHTML = `

          <div class="empty">

            아직 발급된 이용권이 없습니다.

          </div>

        `;

        return;

      }


      codes.forEach(
        item => {

          const used =
            Number(
              item.usedCount || 0
            );


          const max =
            Number(
              item.maxUses ||
              item.people ||
              1
            );


          const active =
            item.active !== false;


          const element =
            document.createElement(
              "div"
            );


          element.className =
            "code-item";


          element.innerHTML = `

            <div class="code-main">

              <div class="code">
                ${item.id}
              </div>

              <div class="code-info">

                ${used} / ${max}명 사용

              </div>

            </div>


            <div class="badge">

              ${
                item.type ||
                `${max}인권`
              }

            </div>


            <button
              class="action-btn copy-btn"
            >
              복사
            </button>


            <button
              class="
                action-btn
                toggle-btn
                ${active ? "danger" : ""}
              "
            >

              ${
                active
                  ? "폐기"
                  : "재활성화"
              }

            </button>


            <button
              class="
                action-btn
                danger
                delete-btn
              "
            >
              삭제
            </button>

          `;


          /* 복사 */

          const copyButton =
            element.querySelector(
              ".copy-btn"
            );


          copyButton.onclick =
            () => {

              copyCode(
                item.id,
                copyButton
              );

            };


          /* 폐기 / 재활성화 */

          const toggleButton =
            element.querySelector(
              ".toggle-btn"
            );


          toggleButton.onclick =
            () => {

              toggleCode(
                item.id,
                active
              );

            };


          /* 삭제 */

          const deleteButton =
            element.querySelector(
              ".delete-btn"
            );


          deleteButton.onclick =
            () => {

              deleteCode(
                item.id
              );

            };


          codeList.appendChild(
            element
          );

        }
      );

    },


    error => {

      console.error(
        "이용권 목록 불러오기 실패:",
        error
      );


      codeList.innerHTML = `

        <div class="empty">

          이용권 목록을 불러오지 못했습니다.

        </div>

      `;

    }

  );

}


/* ==================================================
   시작
================================================== */

generateButton.addEventListener(
  "click",
  generateCode
);


const allowed =
  await checkAdminAccess();


if (allowed) {

  loadCodes();

}

</script>

</body>
</html>
