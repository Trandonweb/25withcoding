<!DOCTYPE html>
<html lang="ko">

<title>코딩과 함께라면 2026 Festival</title>

<style>
:root{
  --primary-color:#27ae60;
  --secondary-color:#64dd17;
  --bg-color:#0f0f14;
  --card-bg:#1c1c25;
  --text-color:#fff;
  --muted-color:#aaa;
  --border-color:rgba(39,174,96,.35);
  --input-bg:#15151c;
  --input-border:#3a3a45;
  --header-text:#fff;
  --accent-soft:rgba(39,174,96,.18)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:sans-serif;
  background:var(--bg-color);
  color:var(--text-color);
  transition:background .25s,color .25s
}

.gate-open{
  overflow:hidden
}

#festivalGate{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(
      circle at 10% 10%,
      color-mix(in srgb,var(--primary-color) 25%,transparent),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 90%,
      color-mix(in srgb,var(--secondary-color) 22%,transparent),
      transparent 35%
    ),
    var(--bg-color)
}

.gate-card{
  width:min(420px,100%);
  padding:34px 28px;
  text-align:center;
  background:var(--card-bg);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  box-shadow:0 25px 70px rgba(0,0,0,.5)
}

.gate-icon{
  font-size:52px;
  margin-bottom:8px
}

.gate-title{
  margin:0;
  font-family:'Black Han Sans',sans-serif;
  font-size:32px;
  background:linear-gradient(
    90deg,
    var(--primary-color),
    var(--secondary-color)
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent
}

.gate-description{
  margin:14px 0 24px;
  color:var(--muted-color);
  font-size:14px;
  line-height:1.7
}

.gate-input{
  width:100%;
  height:50px;
  padding:0 16px;
  border:1px solid var(--input-border);
  border-radius:13px;
  background:var(--input-bg);
  color:var(--text-color);
  outline:none;
  font-size:15px;
  text-align:center;
  transition:.2s
}

.gate-input::placeholder{
  color:#777
}

.gate-input:focus{
  border-color:var(--primary-color);
  box-shadow:0 0 0 3px color-mix(
    in srgb,
    var(--primary-color) 15%,
    transparent
  )
}

.gate-button{
  width:100%;
  height:50px;
  margin-top:10px;
  border:none;
  border-radius:13px;
  background:linear-gradient(
    90deg,
    var(--primary-color),
    var(--secondary-color)
  );
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s
}

.gate-button:hover{
  filter:brightness(.92);
  transform:translateY(-1px)
}

.gate-button:active{
  transform:translateY(0)
}

.gate-button:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none
}

.gate-divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:18px 0;
  color:#666;
  font-size:12px
}

.gate-divider:before,
.gate-divider:after{
  content:"";
  flex:1;
  height:1px;
  background:#33333d
}

.gate-error{
  min-height:20px;
  margin-top:10px;
  color:#ff7070;
  font-size:13px
}

.gate-success{
  min-height:20px;
  margin-top:10px;
  color:#7cff91;
  font-size:13px
}

.gate-loading{
  color:var(--muted-color);
  font-size:14px
}

.session-box{
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  background:color-mix(
    in srgb,
    var(--primary-color) 8%,
    var(--card-bg)
  );
  border:1px solid color-mix(
    in srgb,
    var(--primary-color) 25%,
    transparent
  );
  text-align:left
}

.session-label{
  display:block;
  margin-bottom:8px;
  color:var(--text-color);
  font-size:13px;
  font-weight:bold
}

.session-select{
  width:100%;
  height:44px;
  padding:0 12px;
  border:1px solid var(--input-border);
  border-radius:10px;
  background:var(--input-bg);
  color:var(--text-color);
  font-size:14px;
  outline:none
}

.session-hint{
  margin-top:7px;
  color:var(--muted-color);
  font-size:11px
}

.gate-session-area{
  display:none
}

.gate-session-area.show{
  display:block
}

#festivalGate.hidden{
  display:none
}

.home-link{
  position:fixed;
  top:18px;
  left:20px;
  color:rgba(255,255,255,.75);
  text-decoration:none;
  font-size:13px;
  z-index:1000
}

.home-link:hover{
  color:white
}

/* =========================
   축제 타이머
========================= */

#festivalTimer{
  position:fixed;
  top:16px;
  right:18px;
  z-index:2000;
  display:flex;
  align-items:center;
  gap:9px;
  padding:7px 9px 7px 14px;
  border-radius:12px;
  background:rgba(21,21,28,.92);
  border:1px solid var(--border-color);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
  font-size:13px;
  font-weight:bold;
  backdrop-filter:blur(8px)
}

#festivalTimer strong{
  color:var(--secondary-color);
  font-family:monospace;
  font-size:16px
}

#festivalPauseButton{
  border:1px solid rgba(255,255,255,.16);
  border-radius:8px;
  padding:5px 8px;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
  transition:.15s;
  white-space:nowrap
}

#festivalPauseButton:hover{
  background:rgba(255,255,255,.16)
}

#festivalPauseButton:active{
  transform:scale(.96)
}

.timer-warning{
  border-color:#ffb74d!important
}

.timer-warning strong{
  color:#ffcc80!important
}

.timer-danger{
  border-color:#ff5252!important;
  animation:timerPulse .6s infinite alternate
}

.timer-danger strong{
  color:#ff7777!important
}

@keyframes timerPulse{
  from{
    transform:scale(1)
  }
  to{
    transform:scale(1.04)
  }
}

/* =========================
   일시정지 화면
========================= */

#festivalPauseOverlay{
  position:fixed;
  inset:0;
  z-index:10000;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000;
  color:#fff;
  text-align:center;
  user-select:none;
}

#festivalPauseOverlay.show{
  display:flex
}

.pause-message{
  font-size:clamp(24px,5vw,42px);
  font-weight:bold;
  letter-spacing:.02em
}

/*
 * 일시정지 중에는 오버레이가 모든 화면을 덮는다.
 * 오버레이 클릭으로 재개할 수 있도록 한다.
 */
#festivalPauseOverlay{
  cursor:pointer
}

#festivalNotice{
  position:fixed;
  left:50%;
  top:72px;
  z-index:3000;
  transform:translate(-50%,-20px);
  opacity:0;
  pointer-events:none;
  width:min(420px,calc(100% - 28px));
  padding:14px 18px;
  border-radius:14px;
  text-align:center;
  background:var(--card-bg);
  border:1px solid var(--primary-color);
  box-shadow:0 15px 40px rgba(0,0,0,.4);
  transition:.25s;
  font-size:14px;
  font-weight:bold
}

#festivalNotice.show{
  transform:translate(-50%,0);
  opacity:1
}

.notice-danger{
  border-color:#ff5252!important;
  color:#ffb0b0
}

header{

.subtitle{

.grid{

.card img{

.info{

.title{

.desc{

.likes{

.like-btn{

@media(max-width:768px){
  .grid{

    font-size:28px

  }

  #festivalTimer strong{
    font-size:14px
  }

  #festivalPauseButton{
    padding:5px 6px;
    font-size:10px
  }
}
</style>

/* =========================

const firebaseConfig={
  apiKey:"AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9Q",

  projectId:"festivallikes",

};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


const loginFirebaseConfig={
  apiKey:"AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",

  projectId:"points2026-f5e50"
};

const loginApp=initializeApp(
  loginFirebaseConfig,
  "loginApp"
);

const loginDB=getFirestore(loginApp);


/* =========================
   기본 설정
========================= */

const SETTINGS_KEY="coding_with_ramen_settings";

const THEME_COLORS=[
  "#27ae60",
  "#3498db",
  "#e84393",
  "#9b59b6",
  "#e74c3c"
];

const THEME_SECONDARY={
  "#27ae60":"#64dd17",
  "#3498db":"#5dade2",
  "#e84393":"#fd79a8",
  "#9b59b6":"#c39bd3",
  "#e74c3c":"#ff7675"
};


/* =========================
   DOM
========================= */

const festivalGate=
  document.getElementById("festivalGate");

const guestArea=
  document.getElementById("guestArea");

const memberCodeArea=
  document.getElementById("memberCodeArea");

const loadingArea=
  document.getElementById("loadingArea");

const gateDescription=
  document.getElementById("gateDescription");

const gateError=
  document.getElementById("gateError");

const memberGateError=
  document.getElementById("memberGateError");

const festivalTimer=
  document.getElementById("festivalTimer");

const festivalTimerValue=
  document.getElementById("festivalTimerValue");

const festivalPauseButton=

const festivalPauseOverlay=

const festivalNotice=
  document.getElementById("festivalNotice");

const accessSessionCount=
  document.getElementById("accessSessionCount");

const memberSessionCount=
  document.getElementById("memberSessionCount");


/* =========================
   상태
========================= */

let timerInterval=null;
let noticeTimeout=null;
let adminChallenge=null;

/* 일시정지 상태 */
let festivalPaused=false;
let festivalPauseStartedAt=0;


/* =========================
   테마
========================= */

function applyTheme(
  primary,
  source="visitor"
){
  primary=String(primary||"").toLowerCase();

  if(!THEME_COLORS.includes(primary)){
    primary=THEME_COLORS[0];
  }

  const secondary=
    THEME_SECONDARY[primary]||primary;

  document.documentElement.style.setProperty(
    "--primary-color",
    primary
  );

  document.documentElement.style.setProperty(
    "--secondary-color",
    secondary
  );

  document.documentElement.style.setProperty(
    "--border-color",
    `color-mix(in srgb, ${primary} 35%, transparent)`
  );

  document.documentElement.style.setProperty(
    "--accent-soft",
    `color-mix(in srgb, ${primary} 18%, transparent)`
  );

  document.body.dataset.themeSource=source;
}


function applyVisitorRandomTheme(){
  const primary=
    THEME_COLORS[
      Math.floor(
        Math.random()*THEME_COLORS.length
      )
    ];

  applyTheme(
    primary,
    "visitor"
  );
}


async function applyMemberTheme(userId){

  try{

    const saved=
      localStorage.getItem(SETTINGS_KEY);

    let settings={};

    if(saved){

      try{
        settings=
          JSON.parse(saved)||{};
      }catch(e){
        console.warn(
          "저장된 컬러 테마를 읽지 못했습니다.",
          e
        );
      }

    }

    let primary=
      settings.primaryColor;

    const snap=
      await getDoc(
        doc(loginDB,"users",userId)
      );

    if(snap.exists()){

      const firebaseSettings=
        snap.data().settings||{};

      primary=
        firebaseSettings.primaryColor||
        primary;

      if(primary){

        settings={
          ...settings,
          ...firebaseSettings
        };

        localStorage.setItem(
          SETTINGS_KEY,
          JSON.stringify(settings)
        );

      }

    }

    if(
      !THEME_COLORS.includes(
        String(primary||"").toLowerCase()
      )
    ){
      primary="#27ae60";
    }

    applyTheme(
      primary,
      "member"
    );

  }catch(error){

    console.error(
      "부원 컬러 테마 적용 실패:",
      error
    );

    applyTheme(
      "#27ae60",
      "member-fallback"
    );

  }

}

========================= */

  festivalGate.classList.add(

  gateDescription.textContent=

}


/* =========================
   이용 횟수
========================= */

function fillSessionOptions(
  select,
  max=5
){

  select.innerHTML="";

  const count=
    Math.max(
      1,
      Math.min(
        5,
        Number(max)||5
      )
    );

  for(
    let i=1;
    i<=count;
    i++
  ){

    const option=
      document.createElement("option");

    option.value=
      String(i);

    option.textContent=
      `${i}회 (${i*30}분)`;

    if(i===1){
      option.selected=true;
    }

    select.appendChild(
      option
    );

  }

}


fillSessionOptions(
  accessSessionCount
);

fillSessionOptions(
  memberSessionCount
);


/* =========================
   타이머
========================= */

function formatRemaining(ms){

  const total=
    Math.max(
      0,
      Math.ceil(ms/1000)
    );

  return `${
    String(
      Math.floor(total/60)
    ).padStart(2,"0")
  }:${
    String(
      total%60
    ).padStart(2,"0")
  }`;

}


function showNotice(
  message,
  danger=false
){

  clearTimeout(
    noticeTimeout
  );

  festivalNotice.textContent=
    message;

  festivalNotice.className=
    danger
      ? "show notice-danger"
      : "show";

  noticeTimeout=
    setTimeout(
      ()=>{
        festivalNotice.classList.remove(
          "show"
        );
      },
      5000
    );

}


/* =========================
   일시정지
========================= */

function pauseFestival(){

  if(festivalPaused){
    return;
  }

  festivalPaused=true;

  festivalPauseStartedAt=
    Date.now();

  clearInterval(
    timerInterval
  );

  timerInterval=null;

  festivalPauseOverlay.classList.add(
    "show"
  );

  festivalPauseButton.textContent=
    "재개";

}


/*
 * 일시정지된 시간만큼 만료 시각을
 * 뒤로 밀어 실제 이용 시간이 차감되지 않도록 한다.
 */
function resumeFestival(){

  if(!festivalPaused){
    return;
  }

  const pausedDuration=
    Date.now()-
    festivalPauseStartedAt;

  festivalPaused=false;

  festivalPauseStartedAt=0;

  festivalPauseOverlay.classList.remove(
    "show"
  );

  festivalPauseButton.textContent=
    "일시정지";

  const expiresAt=
    Number(
      sessionStorage.getItem(
        "festival2026AccessExpiresAt"
      )
    );

  if(
    Number.isFinite(expiresAt)
  ){

    const newExpiresAt=
      expiresAt+
      pausedDuration;

    sessionStorage.setItem(
      "festival2026AccessExpiresAt",
      String(newExpiresAt)
    );

    startFestivalTimer(
      newExpiresAt
    );

  }

}


/* 버튼 클릭 */
festivalPauseButton.addEventListener(
  "click",
  event=>{

    event.stopPropagation();

    if(festivalPaused){
      resumeFestival();
    }else{
      pauseFestival();
    }

  }
);


/*
 * 검은색 일시정지 화면을 클릭해도
 * 재개할 수 있도록 한다.
 */
festivalPauseOverlay.addEventListener(
  "click",
  ()=>{
    if(festivalPaused){
      resumeFestival();
    }
  }
);


/*
 * 일시정지 중에는 모든 키 입력을 차단한다.
 *
 * capture 단계에서 막기 때문에
 * 축제 내부 게임에서 등록한 keydown,
 * keyup 등의 이벤트보다 먼저 차단된다.
 */
function blockKeysWhilePaused(event){

  if(!festivalPaused){
    return;
  }

  event.preventDefault();
  event.stopPropagation();
  event.stopImmediatePropagation();

}


window.addEventListener(
  "keydown",
  blockKeysWhilePaused,
  true
);

window.addEventListener(
  "keyup",
  blockKeysWhilePaused,
  true
);

window.addEventListener(
  "keypress",
  blockKeysWhilePaused,
  true
);


/* =========================
   타이머 시작
========================= */

function startFestivalTimer(
  expiresAt
){

  clearInterval(
    timerInterval
  );

  festivalTimer.style.display=
    "flex";

  let warnedFive=false;
  let warnedTen=false;

  const tick=()=>{

    /*
     * 혹시 타이머가 실행되는 순간
     * 일시정지 상태라면 시간 계산을
     * 변경하지 않는다.
     */
    if(festivalPaused){
      return;
    }

    const remaining=
      expiresAt-
      Date.now();

    if(remaining<=0){

      clearInterval(
        timerInterval
      );

      timerInterval=null;

      sessionStorage.removeItem(
        "festival2026CodeAccess"
      );

      sessionStorage.removeItem(
        "festival2026AccessCode"
      );

      sessionStorage.removeItem(
        "festival2026AccessExpiresAt"
      );

      sessionStorage.removeItem(
        "festival2026AccessSessions"
      );

      festivalTimer.style.display=
        "none";

      festivalPauseOverlay.classList.remove(
        "show"
      );

      festivalPaused=false;

      showNotice(
        "이용 시간이 종료되었습니다. 축제에서 나갑니다.",
        true
      );

      setTimeout(
        ()=>{
          location.reload();
        },
        1200
      );

      return;
    }

    festivalTimerValue.textContent=
      formatRemaining(
        remaining
      );

    festivalTimer.classList.toggle(
      "timer-warning",
      remaining<=300000 &&
      remaining>10000
    );

    festivalTimer.classList.toggle(
      "timer-danger",
      remaining<=10000
    );

    if(
      remaining<=300000 &&
      !warnedFive
    ){

      warnedFive=true;

      showNotice(
        "⏰ 축제 이용 시간이 5분 남았습니다."
      );

    }

    if(
      remaining<=10000 &&
      !warnedTen
    ){

      warnedTen=true;

      showNotice(
        "⚠️ 이용 시간이 10초 남았습니다.",
        true
      );

    }

  };

  tick();

  timerInterval=
    setInterval(
      tick,
      250
    );

}


/* =========================
   새 코드 세션
========================= */

function startNewCodeSession(
  sessionCount=1
){

  const count=
    Math.max(
      1,
      Math.min(
        5,
        Number(sessionCount)||1
      )
    );

  const expiresAt=
    Date.now()+
    count*
    30*
    60*
    1000;

  sessionStorage.setItem(
    "festival2026AccessExpiresAt",
    String(expiresAt)
  );

  sessionStorage.setItem(
    "festival2026AccessSessions",
    String(count)
  );

  startFestivalTimer(
    expiresAt
  );

}


/* =========================
   기존 세션 복구
========================= */

function restoreCodeSession(){

  const expiresAt=
    Number(
      sessionStorage.getItem(
        "festival2026AccessExpiresAt"
      )
    );

  if(
    !Number.isFinite(expiresAt) ||
    expiresAt<=Date.now()
  ){

    sessionStorage.removeItem(
      "festival2026CodeAccess"
    );

    sessionStorage.removeItem(
      "festival2026AccessCode"
    );

    sessionStorage.removeItem(
      "festival2026AccessExpiresAt"
    );

    sessionStorage.removeItem(
      "festival2026AccessSessions"
    );

    return false;

  }

  startFestivalTimer(
    expiresAt
  );

  return true;

}


/* =========================
   관리자 기능
========================= */

function randomAdminChallenge(){

  const alphabet=
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  const letter=
    alphabet[
      Math.floor(
        Math.random()*
        alphabet.length
      )
    ];

  const first=
    Math.floor(
      Math.random()*5
    )+1;

  const second=
    Math.floor(
      Math.random()*5
    )+1;

  const answer=
    alphabet[
      (
        alphabet.indexOf(letter)-
        (first+second)+
        26
      )%26
    ];

  adminChallenge={
    answer,
    expiresAt:
      Date.now()+120000
  };

  return `${letter}${first}${second}`;

}


function adminTime(){

  const challenge=
    randomAdminChallenge();

  console.log(
    challenge
  );

  return challenge;

}


function adminAnswer(
  answer
){

  if(
    !adminChallenge ||
    adminChallenge.expiresAt<Date.now()
  ){

    console.warn(
      "관리자 인증 문제가 만료되었습니다. admin.time()을 다시 실행하세요."
    );

    return false;
  }

  const value=
    String(
      answer||""
    )
    .trim()
    .toUpperCase();

  if(
    value!==adminChallenge.answer
  ){

    console.warn(
      "관리자 인증 실패"
    );

    return false;
  }

  window.__festivalAdminActive=
    true;

  adminChallenge=null;

  console.log(
    "관리자 모드 활성화"
  );

  return true;

}


function adminClose(){

  window.__festivalAdminActive=
    false;

  adminChallenge=null;

  console.log(
    "관리자 모드 종료"
  );

}


function adminReset(
  minutes
){

  if(
    !window.__festivalAdminActive
  ){

    console.warn(
      "관리자 모드가 활성화되어 있지 않습니다."
    );

    return false;

  }

  const value=
    Number(minutes);

  if(
    !Number.isFinite(value) ||
    value<0
  ){

    console.warn(
      "시간은 0 이상의 숫자(분)여야 합니다."
    );

    return false;

  }

  /*
   * 관리자 리셋 시 일시정지 상태도
   * 확실하게 해제한다.
   */
  festivalPaused=false;
  festivalPauseStartedAt=0;

  festivalPauseOverlay.classList.remove(
    "show"
  );

  festivalPauseButton.textContent=
    "일시정지";

  const expiresAt=
    Date.now()+
    value*
    60*
    1000;

  sessionStorage.setItem(
    "festival2026AccessExpiresAt",
    String(expiresAt)
  );

  sessionStorage.setItem(
    "festival2026CodeAccess",
    "true"
  );

  sessionStorage.setItem(
    "festival2026AccessSessions",
    String(
      Math.ceil(value/30)
    )
  );

  startFestivalTimer(
    expiresAt
  );

  enterFestival();

  console.log(
    `축제 이용 시간이 ${value}분으로 재설정되었습니다.`
  );

  return true;

}


window.admin={
  time:adminTime,
  answer:adminAnswer,
  close:adminClose
};

window.time={
  reset:adminReset,

  remaining:()=>{
    const expiresAt=
      Number(
        sessionStorage.getItem(
          "festival2026AccessExpiresAt"
        )
      );

    const remaining=
      Number.isFinite(expiresAt)
        ? Math.max(
            0,
            expiresAt-Date.now()
          )
        : 0;

    console.log(
      formatRemaining(
        remaining
      )
    );

    return remaining;
  }
};

/* =========================
   이용 코드
========================= */

function normalizeCode(
  value
){

  return String(
    value||""
  )
  .trim()
  .toUpperCase();

}


async function redeemAccessCode(
  rawCode,
  requestedSessions=1
){

  const code=
    normalizeCode(
      rawCode
    );

  const sessions=
    Math.max(
      1,
      Math.min(
        5,
        Number(requestedSessions)||1
      )
    );

  if(
    !/^[A-Z0-9]{5}$/.test(code)
  ){

    return{
      success:false,
      message:
        "축제 이용 코드는 정확히 5자리입니다."
    };

  }

  const codeRef=
    doc(
      db,
      "accesscodes",
      code
    );

  try{

    const result=
      await runTransaction(
        db,
        async transaction=>{

          const snap=
            await transaction.get(
              codeRef
            );

          if(!snap.exists()){
            throw new Error(
              "CODE_NOT_FOUND"
            );
          }

          const data=
            snap.data();

          if(
            data.active===false
          ){

            throw new Error(
              "CODE_INACTIVE"
            );

          }

          const max=
            Number(data.max);

          const used=
            Number(data.used||0);

          if(
            !Number.isInteger(max) ||
            max<1 ||
            max>5
          ){

            throw new Error(
              "CODE_INVALID"
            );

          }

          const remaining=
            max-used;

          if(
            used>=max
          ){

            throw new Error(
              "CODE_EXHAUSTED"
            );

          }

          if(
            sessions>remaining
          ){

            throw new Error(
              "CODE_NOT_ENOUGH"
            );

          }

          transaction.update(
            codeRef,
            {
              used:
                used+sessions
            }
          );

          return{
            people:max,
            used:
              used+sessions,
            max,
            remaining:
              remaining-sessions
          };

        }
      );

    sessionStorage.setItem(
      "festival2026CodeAccess",
      "true"
    );

    sessionStorage.setItem(
      "festival2026AccessCode",
      code
    );

    startNewCodeSession(
      sessions
    );

    return{
      success:true,
      message:
        `${sessions}회 이용 (${sessions*30}분)으로 입장했습니다.`,
      ...result
    };

  }catch(error){

    console.error(
      "이용 코드 처리 오류:",
      error
    );

    switch(error.message){

      case"CODE_NOT_FOUND":
        return{
          success:false,
          message:
            "존재하지 않는 이용 코드입니다."
        };

      case"CODE_INACTIVE":
        return{
          success:false,
          message:
            "사용할 수 없는 이용 코드입니다."
        };

      case"CODE_EXHAUSTED":
        return{
          success:false,
          message:
            "이 코드는 모두 사용되었습니다."
        };

      case"CODE_NOT_ENOUGH":
        return{
          success:false,
          message:
            "선택한 횟수만큼 사용할 수 있는 이용권이 남아있지 않습니다."
        };

      case"CODE_INVALID":
        return{
          success:false,
          message:
            "올바르지 않은 이용 코드입니다."
        };

      default:
        return{
          success:false,
          message:
            "코드 확인 중 오류가 발생했습니다."
        };

    }

  }

}


/* =========================
   남은 이용 횟수
========================= */

async function updateSessionChoices(
  rawCode,
  select
){

  const code=
    normalizeCode(
      rawCode
    );

  if(
    !/^[A-Z0-9]{5}$/.test(code)
  ){
    return;
  }

  if(!select){
    return;
  }

  try{

    const snap=
      await getDoc(
        doc(
          db,
          "accesscodes",
          code
        )
      );

    if(!snap.exists()){
      return;
    }

    const data=
      snap.data();

    if(
      data.active===false
    ){
      return;
    }

    const remaining=
      Math.max(
        0,
        Number(data.max||0)-
        Number(data.used||0)
      );

    if(remaining>0){

      fillSessionOptions(
        select,
        remaining
      );

    }

  }catch(error){

    console.error(
      "남은 이용 횟수 확인 실패:",
      error
    );

  }

}


function bindCodeInput(
  input,
  select
){

  input.addEventListener(
    "input",
    ()=>{
      input.value=
        input.value.toUpperCase();

      if(
        input.value.length===5
      ){

        updateSessionChoices(
          input.value,
          select
        );

      }

    }
  );

}

/* =========================
   코드 입장 처리
========================= */

async function handleCode(
  input,
  select,
  button,
  errorElement
){

  errorElement.className=
    "gate-error";

  errorElement.textContent="";

  button.disabled=true;

  button.textContent=
    "확인 중...";

  try{

    const result=
      await redeemAccessCode(
        input.value,
        select.value
      );

    if(result.success){

      errorElement.className=
        "gate-success";

      errorElement.textContent=
        result.message;

      setTimeout(
        enterFestival,
        450
      );

    }else{

      errorElement.textContent=
        result.message;

    }

  }catch(error){

    console.error(
      "입장 처리 오류:",
      error
    );

    errorElement.textContent=
      "입장 처리 중 오류가 발생했습니다.";

  }finally{

    button.disabled=false;

    button.textContent=
      "코드로 입장";

  }

}

/* =========================
   축제 접근 확인
========================= */

async function checkFestivalAccess(){

  if(
    sessionStorage.getItem(
      "festival2026CodeAccess"
    )==="true"
  ){

    applyVisitorRandomTheme();

    if(
      restoreCodeSession()
    ){

      enterFestival();

      return;

    }

  }

  const userId=
    localStorage.getItem(
      "userId"
    );

  if(!userId){

    showGuestGate();

    return;

  }

  try{

    const userSnap=
      await getDoc(
        doc(
          loginDB,
          "users",
          userId
        )
      );

    if(
      userSnap.exists()
    ){

      await applyMemberTheme(
        userId
      );

      enterFestival();

      return;

    }

    showCodeGate();

  }catch(error){

    console.error(
      "로그인 상태 확인 실패:",
      error
    );

    showCodeGate();

    gateDescription.textContent=
      "로그인 상태를 확인하지 못했습니다. 이용 코드를 입력해주세요.";

  }

}


checkFestivalAccess();


/* =========================
   작품 목록
========================= */

const grid=
  document.getElementById(
    "grid"
  );


function loadProjects(){

  onSnapshot(
    collection(
      db,
      "projects"
    ),

    snap=>{

      grid.innerHTML="";

      const projects=[];

      snap.forEach(
        docSnap=>{
          projects.push({
            id:docSnap.id,
            ...docSnap.data()
          });
        }
      );

      projects.sort(
        (a,b)=>
          (b.likes||0)-
          (a.likes||0)
      );

      const totalLikes=
        projects.reduce(
          (sum,p)=>
            sum+
            (p.likes||0),
          0
        );

      document.getElementById(
        "subtitle"
      ).innerHTML=
        `<div>since 2025</div>
         <div>❤️ 지금까지 ${totalLikes.toLocaleString()}번의 응원이 도착했어요</div>`;


      projects.forEach(
        (p,index)=>{

          const medal=
            index===0
              ?"🥇 "
              :index===1
                ?"🥈 "
                :index===2
                  ?"🥉 "
                  :"";

          const card=
            document.createElement(
              "div"
            );

          card.className=
            "card";

          card.innerHTML=
            `<img
              src="${p.thum}"
              alt="${p.id}"
            >
            <div class="info">
              <div class="title">
                ${medal}${p.id}
              </div>

              <div class="desc">
                ${p.detail}
              </div>

              <div class="likes">
                ❤️ ${p.likes||0}
              </div>

              <button class="like-btn">
                응원하기
              </button>
            </div>`;


          card.onclick=()=>{
            location.href=
              p.url;
          };


          card
            .querySelector(
              ".like-btn"
            )
            .onclick=
            async event=>{

              event.stopPropagation();

              try{

                await updateDoc(
                  doc(
                    db,
                    "projects",
                    p.id
                  ),
                  {
                    likes:
                      increment(1)
                  }
                );

              }catch(error){

                console.error(
                  "응원 처리 실패:",
                  error
                );

              }

            };


          grid.appendChild(
            card
          );

        }
      );

    },

    error=>{
      console.error(
        "작품 목록 불러오기 실패:",
        error
      );
    }
  );

}


loadProjects();
