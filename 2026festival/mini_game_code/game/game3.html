<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>키 반응 대결 | MINI GAME</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#071b12,#123b27);color:#fff;display:flex;align-items:center;justify-content:center}.wrap{width:min(900px,94vw);text-align:center;padding:24px}.top{display:flex;justify-content:space-between;opacity:.75}.title{font-size:clamp(32px,6vw,52px);font-weight:900;margin:12px}.timer{font-size:34px;font-weight:900}.score{display:flex;justify-content:center;gap:50px;font-size:19px;font-weight:800}.score span{display:block;font-size:46px}.arena{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.side{padding:28px 18px;border-radius:26px;background:rgba(255,255,255,.07)}.side h2{margin:0 0 18px}.target{width:min(190px,32vw);height:min(190px,32vw);min-width:120px;min-height:120px;margin:0 auto 20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,8vw,72px);font-weight:900;box-shadow:0 0 25px rgba(255,255,255,.18);user-select:none}.green{background:#27ae60}.red{background:#e74c3c}.hint{min-height:28px;color:#b9d9c5}.result{font-size:30px;font-weight:900;margin:22px 0;min-height:45px}.result small{display:block;font-size:14px;opacity:.7;margin:7px}.done{border:0;border-radius:14px;padding:14px 28px;background:#1ea857;color:#fff;font-weight:800;font-size:17px;cursor:pointer}.note{font-size:13px;color:#ffd98a;margin-top:9px}.hidden{display:none!important}@media(max-width:650px){.arena{gap:8px}.side{padding:20px 8px}.target{min-width:105px;min-height:105px}}</style></head><body><div class="wrap"><div class="top"><span id="round"></span><span id="mode"></span></div><div class="title">⚡ 키 반응 대결</div><div class="timer" id="timer">10.0</div><div class="score"><div>🟢 WASD<span id="me">0</span></div><div>🔴 방향키<span id="opp">0</span></div></div><div class="arena"><div class="side"><h2>WASD</h2><div class="target green" id="green">W</div><div class="hint">W A S D 중 표시된 키를 누르세요.</div></div><div class="side"><h2>방향키</h2><div class="target red" id="red">↑</div><div class="hint">↑ ↓ ← → 중 표시된 키를 누르세요.</div></div></div><div class="note hidden" id="note">온라인 상대 입력은 연결 후 반영됩니다.</div><div class="result" id="result"></div><button class="done hidden" id="done">결과 확인 →</button></div><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu',modeName:'컴퓨터와 대전'};const mode=s.mode||'cpu';let me=0,opp=0,playing=true,start=performance.now(),ai=null;const g=document.getElementById('green'),r=document.getElementById('red');const wasd=['w','a','s','d'],arrows=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'],arrowText={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'};document.getElementById('mode').textContent=s.modeName||'컴퓨터와 대전';document.getElementById('round').textContent=s.round?`${s.round}번째 게임`:'';if(mode==='online')document.getElementById('note').classList.remove('hidden');function randomize(){g.textContent=wasd[Math.floor(Math.random()*4)].toUpperCase();const k=arrows[Math.floor(Math.random()*4)];r.dataset.key=k;r.textContent=arrowText[k]}function score(w){if(!playing)return;if(w==='me')me++;else opp++;document.getElementById(w==='me'?'me':'opp').textContent=w==='me'?me:opp;randomize()}function key(e){if(!playing)return;if(wasd.includes(e.key.toLowerCase())&&e.key.toLowerCase()===g.textContent.toLowerCase())score('me');if(arrows.includes(e.key)&&e.key===r.dataset.key&&mode==='local')score('opp')}document.addEventListener('keydown',key);function cpu(){if(!playing)return;score('opp');ai=setTimeout(cpu,500+Math.random()*550)}if(mode==='cpu')ai=setTimeout(cpu,500+Math.random()*550);function tick(){if(!playing)return;const t=Math.max(0,10-(performance.now()-start)/1000);document.getElementById('timer').textContent=t.toFixed(1);if(t<=0){finish();return}requestAnimationFrame(tick)}function finish(){if(!playing)return;playing=false;clearTimeout(ai);const w=me>opp?'me':me<opp?'opp':'draw';document.getElementById('result').innerHTML=(w==='me'?'🎉 승리!':w==='opp'?'😮 패배!':'🤝 무승부!')+`<small>최종 점수 ${me} : ${opp}</small>`;document.getElementById('done').classList.remove('hidden');localStorage.setItem('miniGameResult',JSON.stringify({game:'⚡ 키 반응 대결',winner:w,me,opp}))}document.getElementById('done').onclick=()=>location.href='../index.html';randomize();requestAnimationFrame(tick);</script></body></html>
