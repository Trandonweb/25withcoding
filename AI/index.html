    display: flex;

    transition: 0.15s;

.menu-btn:active {

.user-status {

.status-text {

    left: 0;
}

.side-top {
    padding: 18px;
}

    min-height: 48px;

    padding: 12px 14px;

    margin-bottom: 9px;

    border: 0;
    border-radius: 13px;

    background: var(--surface);

    text-align: left;

    font-size: 15px;

    cursor: pointer;

    transition: 0.15s;
}

.side-btn:hover {
    background: var(--surface-hover);
}

.side-btn:active {

}

        2px
        7px;

        14px

    border-radius: 11px;

    cursor: pointer;

    margin-bottom: 3px;

    transition: 0.15s;
}

.chat-item:hover {
    background: var(--surface);
}

.chat-item.active {

    color: var(--primary-dark);
}

.chat-title {
    font-size: 14px;

    font-weight: 600;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.chat-date {
    font-size: 11px;

    color: #999;

    margin-top: 4px;

/* =========================
   프로젝트
========================= */

        18px;

}

}

.project-item:hover {
    background: var(--surface);
}

.project-item.active {
    background: #e8f5e9;

    color: var(--primary-dark);

    font-weight: 600;
}

/* =========================
   프로필
========================= */

.profile {

        12px
        14px
        14px;

        13px;

    align-items: center;
}

.profile-circle {

    height: 36px;

}

.profile-id {

}

   오버레이
========================= */

.overlay {

    position: fixed;

    background: rgba(0, 0, 0, 0.25);

    z-index: 90;
}

.overlay.show {
    display: block;
}

/* =========================
   메인
========================= */

.main {
    position: relative;

    height: calc(100dvh - var(--header-height));

    display: flex;
    flex-direction: column;

    min-width: 0;
}

/* =========================
   메시지
========================= */

.messages {

        20px

.message {

        auto;

    right: 0;

}

        0 3px 18px rgba(39, 174, 96, 0.14);
}

        11px
        8px;

    font-size: 15px;

    background: transparent;

    color: var(--text);
}

    color: #999;
}

    height: 45px;

    border-radius: 50%;

    color: #fff;

    font-size: 18px;

    place-items: center;

    transition:

        transform 0.15s;
}

.send:hover {
    background: var(--primary-dark);
}

.send:active {
    transform: scale(0.92);
}

.send:disabled {
    opacity: 0.55;

    cursor: not-allowed;

========================= */

.project-modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.4);

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.project-modal.show {
    display: flex;
}

.modal-box {
    width: min(430px, 100%);

    background: #fff;

    border-radius: 20px;

    padding: 24px;

    box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.2);

    animation: modalIn 0.18s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: scale(0.97) translateY(5px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.modal-box h3 {
    margin:
        0
        0
        14px;

    font-size: 20px;
}

.modal-box input {
    display: block;

    width: 100%;

    border:
        1px solid
        var(--border);

    border-radius: 12px;

    margin:
        9px
        0;

    padding: 13px;

    outline: none;

    font-size: 14px;
}

.modal-box input:focus {
    border-color: var(--primary);
}

.modal-buttons {
    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 16px;
}

.modal-buttons button {
    min-height: 44px;

    padding:
        10px
        16px;

    border: 0;

    border-radius: 10px;

    cursor: pointer;
}

.cancel-btn {
    background: #eee;
}

.create-btn {
    background: var(--primary);

    color: #fff;
}

<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    limit,
    serverTimestamp,
    updateDoc
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* ======================================================
   FIREBASE
====================================================== */

const mainFirebaseConfig = {

    apiKey:
        "AIzaSyBgArbW8dArbW8dO7OSYsTVEQtRHT049U20",

    authDomain:
        "points2026-f5e50.firebaseapp.com",

    projectId:
        "points2026-f5e50",

    storageBucket:
        "points2026-f5e50.firebasestorage.app",

    messagingSenderId:
        "248724251417",

    appId:
        "1:248724251417:web:02d85cdc4addac98069b88"
};


const cobyFirebaseConfig = {

    apiKey:
        "AIzaSyAiO65YzYeRfuf6fCzosuW7OAVV47o47Js",

    authDomain:
        "coby-ai-328dd.firebaseapp.com",

    projectId:
        "coby-ai-328dd",

    storageBucket:
        "coby-ai-328dd.firebasestorage.app",

    messagingSenderId:
        "865530259286",

    appId:
        "1:865530259286:web:6feaa5781dc538700b18f7"
};


const mainApp =
    initializeApp(
        mainFirebaseConfig,
        "mainApp"
    );


const cobyApp =
    initializeApp(
        cobyFirebaseConfig,
        "cobyApp"
    );


const mainDb =
    getFirestore(mainApp);


const db =
    getFirestore(cobyApp);


/* ======================================================
   STATE
====================================================== */

let currentUserId = null;

let currentPerson = null;

let currentConversationId = null;

let currentProjectId = null;

let currentProject = null;

let isSending = false;


/* ======================================================
   API
====================================================== */

const API_URL =
    "https://two5withcoding.onrender.com/chat";


/* ======================================================
   HELPERS
====================================================== */

const $ = id =>
    document.getElementById(id);


const people = () =>
    collection(
        db,
        "people",
        currentUserId,
        "conversations"
    );


const projects = () =>
    collection(
        db,
        "people",
        currentUserId,
        "projects"
    );


const messagesRef = () =>
    collection(
        db,
        "people",
        currentUserId,
        "conversations",
        currentConversationId,
        "messages"
    );


/* ======================================================
   STATUS
====================================================== */

function setStatus(
    text,
    connected = false
) {

    $("statusText").textContent =
        text;

    $("statusDot")
        .classList
        .toggle(
            "connected",
            connected
        );
}


/* ======================================================
   PROFILE
====================================================== */

function updateProfile() {

    const name =
        currentPerson?.name ||
        currentUserId ||
        "사용자";

    $("profileName")
        .textContent = name;

    $("profileId")
        .textContent =
        currentUserId
            ? `학번 ${currentUserId}`
            : "-";

    $("profileCircle")
        .textContent =
        name.charAt(0);
}


/* ======================================================
   HTML ESCAPE
====================================================== */

function escapeHtml(text) {

    return String(text)
        .replace(
            /[&<>'"]/g,
            char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "'": "&#39;",
                '"': "&quot;"
            })[char]
        );
}


/* ======================================================
   DATE
====================================================== */

function formatDate(timestamp) {

    if (!timestamp)
        return "";

    const date =
        timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);

    return date.toLocaleDateString(
        "ko-KR",
        {
            month: "numeric",
            day: "numeric"
        }
    );
}


/* ======================================================
   SIDEBAR
====================================================== */

function openMenu() {

    $("sidebar")
        .classList
        .add("open");

    $("overlay")
        .classList
        .add("show");
}


function closeMenu() {

    $("sidebar")
        .classList
        .remove("open");

    $("overlay")
        .classList
        .remove("show");
}


window.openMenu = openMenu;
window.closeMenu = closeMenu;


/* ======================================================
   MESSAGE UI
====================================================== */

function clearMessages() {

    $("messages").innerHTML = "";
}


function addMessage(
    role,
    content
) {

    const element =
        document.createElement("div");

    element.className =
        `message ${
            role === "user"
                ? "user"
                : "ai"
        }`;

    element.innerHTML = `
        <div class="message-label">
            ${
                role === "user"
                    ? "YOU"
                    : "COBY"
            }
        </div>

        ${escapeHtml(content)}
    `;

    $("messages")
        .appendChild(element);

    requestAnimationFrame(() => {

        $("messages").scrollTop =
            $("messages").scrollHeight;

    });
}


function showWelcome() {

    clearMessages();

    const element =
        document.createElement("div");

    element.className =
        "welcome";

    element.id =
        "welcome";

    element.innerHTML = `
        <h2>
            어서오세요!
        </h2>

        <p>
            무한한 상상의 나래를 펼쳐요 🚀<br>
            Coby가 당신의 코딩 여정을 함께합니다.
        </p>
    `;

    $("messages")
        .appendChild(element);
}


/* ======================================================
   USER LOAD
====================================================== */

async function loadUser() {

    currentUserId =
        localStorage.getItem("userId");


    if (!currentUserId) {

        setStatus(
            "로그인이 필요합니다"
        );

        updateProfile();

        return false;
    }


    try {

        const snapshot =
            await getDoc(
                doc(
                    mainDb,
                    "users",
                    currentUserId
                )
            );


        currentPerson =
            snapshot.exists()

                ? {
                    schoolNumber:
                        currentUserId,

                    ...snapshot.data()
                }

                : {
                    schoolNumber:
                        currentUserId
                };


        await setDoc(

            doc(
                db,
                "people",
                currentUserId
            ),

            {
                schoolNumber:
                    currentUserId,

                name:
                    currentPerson.name ||
                    "사용자",

                updatedAt:
                    serverTimestamp()
            },

            {
                merge: true
            }

        );


        updateProfile();


        setStatus(
            `${currentPerson.name || "사용자"}님`,
            true
        );


        await Promise.all([
            loadChats(),
            loadProjects()
        ]);


        return true;

    } catch (error) {

        console.error(error);

        setStatus(
            "Firebase 연결 실패"
        );

        updateProfile();

        alert(
            "Coby Firebase 연결에 실패했습니다.\n\n" +
            "Firestore 보안 규칙도 확인해주세요."
        );

        return false;
    }
}


/* ======================================================
   LOAD CHATS
====================================================== */

async function loadChats() {

    if (!currentUserId)
        return;


    const snapshot =
        await getDocs(

            query(
                people(),
                orderBy(
                    "updatedAt",
                    "desc"
                ),
                limit(30)
            )

        );


    $("chatList").innerHTML = "";


    if (snapshot.empty) {

        $("chatList").innerHTML =
            `
            <div class="empty-chat">
                아직 대화가 없습니다.
            </div>
            `;

        return;
    }


    snapshot.forEach(
        snapshotItem => {

            const data =
                snapshotItem.data();


            const element =
                document.createElement("div");


            element.className =
                "chat-item" +
                (
                    snapshotItem.id ===
                    currentConversationId
                        ? " active"
                        : ""
                );


            element.onclick =
                () =>
                    openConversation(
                        snapshotItem.id
                    );


            element.innerHTML = `

                <div class="chat-title">
                    ${escapeHtml(
                        data.title ||
                        "새 대화"
                    )}
                </div>

                <div class="chat-date">
                    ${formatDate(
                        data.updatedAt
                    )}
                </div>

            `;


            $("chatList")
                .appendChild(element);

        }
    );
}


/* ======================================================
   LOAD PROJECTS
====================================================== */

async function loadProjects() {

    if (!currentUserId)
        return;


    const snapshot =
        await getDocs(

            query(
                projects(),
                orderBy(
                    "updatedAt",
                    "desc"
                ),
                limit(30)
            )

        );


    $("projectList").innerHTML = "";


    if (snapshot.empty) {

        $("projectList").innerHTML =
            `
            <div class="empty-chat">
                프로젝트가 없습니다.
            </div>
            `;

        return;
    }


    snapshot.forEach(
        snapshotItem => {

            const data =
                snapshotItem.data();


            const element =
                document.createElement("div");


            element.className =
                "project-item" +
                (
                    snapshotItem.id ===
                    currentProjectId
                        ? " active"
                        : ""
                );


            element.onclick =
                () =>
                    selectProject(
                        snapshotItem.id,
                        data
                    );


            element.textContent =
                "📁 " +
                (
                    data.name ||
                    "이름 없음"
                );


            $("projectList")
                .appendChild(element);

        }
    );
}


/* ======================================================
   CREATE CONVERSATION
====================================================== */

async function createConversation(
    projectId = null
) {

    const reference =
        await addDoc(
            people(),
            {
                title:
                    "새 대화",

                projectId:
                    projectId || null,

                createdAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()
            }
        );


    currentConversationId =
        reference.id;


    currentProjectId =
        projectId || null;


    showWelcome();


    await loadChats();


    return reference.id;
}


/* ======================================================
   NEW CHAT
====================================================== */

async function newChat() {

    if (!currentUserId) {

        alert(
            "먼저 로그인해주세요."
        );

        return;
    }


    await createConversation(
        currentProjectId
    );


    closeMenu();


    $("userInput")
        .focus();
}


window.newChat =
    newChat;


/* ======================================================
   OPEN CONVERSATION
====================================================== */

async function openConversation(id) {

    if (!currentUserId)
        return;


    currentConversationId =
        id;


    const conversationSnapshot =
        await getDoc(
            doc(
                db,
                "people",
                currentUserId,
                "conversations",
                id
            )
        );


    if (!conversationSnapshot.exists())
        return;


    const conversation =
        conversationSnapshot.data();


    currentProjectId =
        conversation.projectId ||
        null;


    currentProject =
        null;


    if (currentProjectId) {

        const projectSnapshot =
            await getDoc(
                doc(
                    db,
                    "people",
                    currentUserId,
                    "projects",
                    currentProjectId
                )
            );


        if (projectSnapshot.exists()) {

            currentProject =
                projectSnapshot.data();
        }
    }


    const messagesSnapshot =
        await getDocs(

            query(
                messagesRef(),
                orderBy(
                    "createdAt",
                    "asc"
                )
            )

        );


    clearMessages();


    if (messagesSnapshot.empty) {

        showWelcome();

    } else {

        messagesSnapshot.forEach(
            snapshotItem => {

                const message =
                    snapshotItem.data();


                addMessage(
                    message.role,
                    message.content
                );

            }
        );
    }


    await loadChats();

    await loadProjects();

    closeMenu();
}


/* ======================================================
   PROJECT
====================================================== */

async function selectProject(
    id,
    data
) {

    currentProjectId =
        id;

    currentProject =
        data;


    await createConversation(id);


    await loadProjects();


    closeMenu();
}


window.selectProject =
    selectProject;


/* ======================================================
   PROJECT MODAL
====================================================== */

function openProjectModal() {

    $("projectModal")
        .classList
        .add("show");

    $("projectNameInput")
        .focus();
}


function closeProjectModal() {

    $("projectModal")
        .classList
        .remove("show");

    $("projectNameInput")
        .value = "";

    $("projectDescriptionInput")
        .value = "";
}


window.openProjectModal =
    openProjectModal;

window.closeProjectModal =
    closeProjectModal;


/* ======================================================
   CREATE PROJECT
====================================================== */

async function createProject() {

    if (!currentUserId) {

        alert(
            "먼저 로그인해주세요."
        );

        return;
    }


    const name =
        $("projectNameInput")
            .value
            .trim();


    const description =
        $("projectDescriptionInput")
            .value
            .trim();


    if (!name) {

        alert(
            "프로젝트 이름을 입력하세요."
        );

        return;
    }


    try {

        const reference =
            await addDoc(
                projects(),
                {
                    name,
                    description,

                    createdAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()
                }
            );


        closeProjectModal();


        await loadProjects();


        await createConversation(
            reference.id
        );


        closeMenu();


    } catch (error) {

        console.error(error);

        alert(
            "프로젝트 생성에 실패했습니다."
        );
    }
}


window.createProject =
    createProject;


/* ======================================================
   PROJECT CONTEXT
====================================================== */

async function getProjectContext() {

    if (
        !currentProjectId ||
        !currentUserId
    ) {
        return [];
    }


    try {

        const conversations =
            await getDocs(

                query(
                    people(),
                    orderBy(
                        "updatedAt",
                        "desc"
                    ),
                    limit(10)
                )

            );


        const context = [];


        for (
            const conversation
            of conversations.docs
        ) {

            const data =
                conversation.data();


            if (
                data.projectId !==
                currentProjectId
            ) {
                continue;
            }


            if (
                conversation.id ===
                currentConversationId
            ) {
                continue;
            }


            const messageSnapshot =
                await getDocs(

                    query(
                        collection(
                            db,
                            "people",
                            currentUserId,
                            "conversations",
                            conversation.id,
                            "messages"
                        ),

                        orderBy(
                            "createdAt",
                            "desc"
                        ),

                        limit(6)
                    )

                );


            const messages =
                [...messageSnapshot.docs]
                    .reverse();


            messages.forEach(
                messageSnapshot => {

                    const message =
                        messageSnapshot.data();


                    context.push({

                        role:
                            message.role,

                        content:
                            message.content

                    });

                }
            );
        }


        return context.slice(-30);


    } catch (error) {

        console.warn(
            "프로젝트 컨텍스트 로드 실패",
            error
        );

        return [];
    }
}


/* ======================================================
   SEND MESSAGE
====================================================== */

async function sendMessage() {

    if (isSending)
        return;


    const input =
        $("userInput");


    const text =
        input.value.trim();


    if (!text)
        return;


    if (!currentUserId) {

        alert(
            "먼저 로그인해주세요."
        );

        return;
    }


    if (!currentConversationId) {

        await createConversation(
            currentProjectId
        );
    }


    isSending = true;


    $("sendButton")
        .disabled = true;


    input.value = "";


    if ($("welcome")) {

        $("welcome")
            .remove();
    }


    addMessage(
        "user",
        text
    );


    try {

        /* =========================
           사용자 메시지 저장
        ========================= */

        await addDoc(
            messagesRef(),
            {
                role:
                    "user",

                content:
                    text,

                createdAt:
                    serverTimestamp()
            }
        );


        const conversationReference =
            doc(
                db,
                "people",
                currentUserId,
                "conversations",
                currentConversationId
            );


        const conversationSnapshot =
            await getDoc(
                conversationReference
            );


        if (
            conversationSnapshot.exists()
        ) {

            const conversation =
                conversationSnapshot.data();


            if (
                conversation.title ===
                    "새 대화" ||
                !conversation.title
            ) {

                await updateDoc(

                    conversationReference,

                    {
                        title:
                            text.length > 35
                                ? text.slice(
                                    0,
                                    35
                                ) + "…"
                                : text,

                        updatedAt:
                            serverTimestamp()
                    }

                );

            } else {

                await updateDoc(

                    conversationReference,

                    {
                        updatedAt:
                            serverTimestamp()
                    }

                );
            }
        }


        /* =========================
           프로젝트 컨텍스트
        ========================= */

        const context =
            await getProjectContext();


        /* =========================
           AI 서버
        ========================= */

        const response =
            await fetch(
                API_URL,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            studentId:
                                currentUserId,

                            userId:
                                currentUserId,

                            conversationId:
                                currentConversationId,

                            projectId:
                                currentProjectId,

                            project:
                                currentProject ||
                                null,

                            context:
                                context

                        })
                }
            );


        if (!response.ok) {

            throw new Error(
                `API ${response.status}`
            );
        }


        const data =
            await response.json();


        const answer =
            data.answer ??
            data.reply ??
            data.response ??
            data.message ??
            "응답을 받지 못했습니다.";


        /* =========================
           AI 메시지 표시
        ========================= */

        addMessage(
            "assistant",
            answer
        );


        /* =========================
           AI 메시지 저장
        ========================= */

        await addDoc(
            messagesRef(),
            {
                role:
                    "assistant",

                content:
                    answer,

                createdAt:
                    serverTimestamp()
            }
        );


        await updateDoc(
            conversationReference,
            {
                updatedAt:
                    serverTimestamp()
            }
        );


        await loadChats();


    } catch (error) {

        console.error(
            "AI 요청 오류:",
            error
        );


        addMessage(
            "assistant",
            "죄송해요. 응답을 가져오는 중 오류가 발생했어요.\n잠시 후 다시 시도해주세요."
        );


    } finally {

        isSending = false;


        $("sendButton")
            .disabled = false;


        input.focus();
    }
}


window.sendMessage =
    sendMessage;


/* ======================================================
   KEYBOARD
====================================================== */

$("userInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


$("projectNameInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                createProject();
            }
        }
    );


/* ======================================================
   MODAL BACKGROUND
====================================================== */

$("projectModal")
    .addEventListener(
        "click",
        event => {

            if (
                event.target ===
                $("projectModal")
            ) {

                closeProjectModal();
            }
        }
    );


/* ======================================================
   ESC
====================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeMenu();

            closeProjectModal();
        }
    }
);


/* ======================================================
   INITIALIZE
====================================================== */

(async () => {

    const success =
        await loadUser();


    if (!success)
        return;


    try {

        const conversations =
            await getDocs(

                query(
                    people(),
                    orderBy(
                        "updatedAt",
                        "desc"
                    ),
                    limit(1)
                )

            );


        if (
            !conversations.empty
        ) {

            await openConversation(
                conversations
                    .docs[0]
                    .id
            );

        } else {

            await createConversation(
                null
            );
        }


    } catch (error) {

        console.error(
            "초기 대화 로드 실패:",
            error
        );

        await createConversation(
            null
        );
    }

})();
