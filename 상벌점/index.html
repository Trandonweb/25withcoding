<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>상벌점</title>
</head>
<body>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",
  authDomain: "points2026-f5e50.firebaseapp.com",
  projectId: "points2026-f5e50",
  storageBucket: "points2026-f5e50.firebasestorage.app",
  messagingSenderId: "248724251417",
  appId: "1:248724251417:web:02d85cdc4addac98069b88"
};
const auth = getAuth(initializeApp(firebaseConfig));
let preferredPersistence = browserLocalPersistence;
try {
  const savedSettings = JSON.parse(localStorage.getItem("coding_with_ramen_settings") || "{}");
  if (savedSettings.keepLogin === false) preferredPersistence = browserSessionPersistence;
} catch {}
await setPersistence(auth, preferredPersistence).catch(async error => {
  console.warn("로그인 유지 설정 적용 실패, 세션 유지 방식으로 전환:", error);
  await setPersistence(auth, browserSessionPersistence);
});
onAuthStateChanged(auth, user => {
  const match = (user?.email || "").match(/^(\d{5})@auth\.25withcoding\.kr$/i);
  if (match) {
    localStorage.setItem("userId", match[1]);
    location.replace("/상벌점/main.html");
    return;
  }
  localStorage.removeItem("userId");
  localStorage.removeItem("firebaseIdToken");
  location.replace("/signin?redirect=" + encodeURIComponent("/상벌점/main.html"));
});
</script>
</body>
</html>
