<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>무한의 계단 - 확장 모드</title>
<style>
body {
    margin: 0;
    background-color: #111;
    color: white;
    font-family: 'Arial', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
}
#ui {
    text-align: center;
    margin-bottom: 10px;
    width: min(60vh, calc(100vw - 40px));
}
#score-board {
    font-size: 18px;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}
#timer-bar-container {
    width: 100%;
    box-sizing: border-box;
    height: 16px;
    background-color: #222;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 10px;
    border: 2px solid #fff;
}
#timer-bar {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ff4757, #ff6b81);
    transition: width 0.1s linear;
}
#canvas-container {
    position: relative;
    width: auto;
    height: min(calc(100vh - 100px), 90vh);
    aspect-ratio: 2 / 3;
    max-width: calc(100vw - 40px);
    flex-shrink: 1;
}
canvas {
    display: block;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    border: 4px solid #fff;
    border-radius: 12px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.8);
}
.overlay {
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    background-color: rgba(0, 0, 0, 0.9);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
}
.overlay h1 {
    color: #ffd32a;
    font-size: 30px;
    margin-bottom: 15px;
    text-shadow: 3px 3px 0px #000;
}
.menu-btn {
    padding: 10px 20px;
    font-size: 15px;
    font-weight: bold;
    background-color: #2ecc71;
    color: white;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    box-shadow: 0 4px 0px #27ae60;
    transition: 0.1s;
    margin: 6px;
    width: 210px;
}
.menu-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0px #27ae60;
}
.shop-btn {
    background-color: #e67e22;
    box-shadow: 0 4px 0px #d35400;
}
.map-btn {
    background-color: #1abc9c;
    box-shadow: 0 4px 0px #16a085;
}
.mode-btn {
    background-color: #9b59b6;
    box-shadow: 0 4px 0px #8e44ad;
}
.fever-btn {
    background-color: #e74c3c;
    box-shadow: 0 4px 0px #c0392b;
}
.skin-card, .map-card {
    background: #222;
    border: 2px solid #444;
    border-radius: 8px;
    padding: 8px 12px;
    margin: 4px;
    width: 240px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.skin-card.selected, .map-card.selected {
    border-color: #2ecc71;
    background: #1b3322;
}
.action-select-btn {
    padding: 5px 12px;
    font-size: 11px;
    font-weight: bold;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
#controls {
    margin-top: 15px;
    font-size: 12px;
    color: #aaa;
    text-align: center;
    line-height: 1.4;
}
.btn-hint {
    display: inline-block;
    padding: 2px 5px;
    background: #444;
    color: #fff;
    border-radius: 4px;
    font-weight: bold;
    border: 1px solid #666;
}
</style>
</head>
<body>

<div id="ui">
    <div id="score-board">
        MAX: <span id="max-score" style="color:#ffd32a;">0</span> | SCORE: <span id="current-score">0</span> | GEM: <span id="current-gems" style="color:#00e8ff;">0</span>
    </div>
    <div id="timer-bar-container">
        <div id="timer-bar"></div>
    </div>
</div>

<div id="canvas-container">
    <!-- 홈 화면 -->
    <div id="startScreen" class="overlay">
        <h1>무한의 계단</h1>
        <button class="menu-btn" onclick="startGame(0)">일반 모드 시작</button>
        <button class="menu-btn mode-btn" onclick="openModeSelect()">모드 선택</button>
        <button class="menu-btn shop-btn" onclick="openShop()">캐릭터 상점</button>
        <button class="menu-btn map-btn" onclick="openMapSelect()">맵 변경 (무료)</button>
    </div>

    <!-- 모드 선택 화면 -->
    <div id="modeScreen" class="overlay" style="display: none;">
        <h1 style="color: #9b59b6;">모드 선택</h1>
        <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;">
            <button class="menu-btn mode-btn" style="width: 240px;" onclick="startGame(1)">유리계단 모드<br><span style="font-size:10px; color:#ddd;">(150계단 달성시 '유리인간' 해금)</span></button>
            <button class="menu-btn fever-btn" style="width: 240px;" onclick="startGame(2)">피버 모드<br><span style="font-size:10px; color:#ddd;">(직진 전용 / 50계단마다 방향 전환)</span></button>
        </div>
        <button class="menu-btn" style="background-color: #7f8c8d; box-shadow: 0 4px 0px #7f8c8d;" onclick="closeModeSelect()">돌아가기</button>
    </div>

    <!-- 상점 화면 -->
    <div id="shopScreen" class="overlay" style="display: none;">
        <h1 style="color: #e67e22;">캐릭터 상점</h1>
        <div id="skin-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 10px;"></div>
        <button class="menu-btn" style="background-color: #7f8c8d; box-shadow: 0 4px 0px #7f8c8d;" onclick="closeShop()">돌아가기</button>
    </div>

    <!-- 맵 선택 화면 -->
    <div id="mapScreen" class="overlay" style="display: none;">
        <h1 style="color: #1abc9c;">맵 변경 (무료)</h1>
        <div id="map-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 10px;"></div>
        <button class="menu-btn" style="background-color: #7f8c8d; box-shadow: 0 4px 0px #7f8c8d;" onclick="closeMapSelect()">돌아가기</button>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="gameOverScreen" class="overlay" style="display: none;">
        <h1 style="color: #ff4757;">GAME OVER</h1>
        <div style="text-align: center; margin-bottom: 15px;">
            <p style="font-size: 16px; margin-bottom: 6px;">최종 점수: <span id="final-score" style="color:#ffd32a; font-weight:bold;">0</span>점</p>
            <p style="font-size: 16px; margin-bottom: 6px;">획득 보석: <span id="earned-gems" style="color:#00e8ff; font-weight:bold;">0</span>개</p>
            <p id="unlock-notice" style="font-size: 14px; color: #2ecc71; margin-top: 8px; font-weight: bold; display: none;"></p>
        </div>
        <button class="menu-btn" style="background-color:#3498db; box-shadow:0 4px 0px #2980b9;" onclick="restartGame()">다시 도전 (Space)</button>
        <button class="menu-btn" style="background-color:#7f8c8d; box-shadow:0 4px 0px #7f8c8d;" onclick="goHome()">홈으로</button>
    </div>

    <canvas id="gameCanvas" width="360" height="540"></canvas>
</div>

<div id="controls">
    [방향 전환] : <span class="btn-hint">A</span> / <span class="btn-hint">←</span> |
    [그대로 오르기] : <span class="btn-hint">D</span> / <span class="btn-hint">→</span>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('current-score');
const maxScoreEl = document.getElementById('max-score');
const gemsEl = document.getElementById('current-gems');
const finalScoreEl = document.getElementById('final-score');
const earnedGemsEl = document.getElementById('earned-gems');
const timerBar = document.getElementById('timer-bar');
const unlockNoticeEl = document.getElementById('unlock-notice');

const startScreen = document.getElementById('startScreen');
const modeScreen = document.getElementById('modeScreen');
const shopScreen = document.getElementById('shopScreen');
const mapScreen = document.getElementById('mapScreen');
const gameOverScreen = document.getElementById('gameOverScreen');

const STAIR_WIDTH = 42;
const STAIR_HEIGHT = 12;
const STEP_X = 35;
const STEP_Y = 16;

const CENTER_X = canvas.width / 2;
const CENTER_Y = canvas.height - 180;

let score = 0;
let gameGems = 0;
let totalGems = 0;
let gameMode = 0;

let maxScore = 0;
maxScoreEl.textContent = maxScore;

let savedSkinsState = JSON.parse(localStorage.getItem('infiniteStairs_skins')) || {};
let skins = [
    { id: 0, name: "기본이", price: 0, unlocked: true, bodyColor: "#9b59b6", faceColor: "#fdb45c", hairColor: "#4a2306", hairType: "short", deathType: "fall" },
    { id: 1, name: "유리인간", price: 0, unlocked: savedSkinsState[1] || false, specialUnlock: "유리계단 150계단", bodyColor: "rgba(255,255,255,0.25)", faceColor: "rgba(255,255,255,0.25)", hairColor: "rgba(255,255,255,0.4)", hairType: "none", deathType: "shatter", isGlass: true },
    { id: 2, name: "파이어맨", price: 0, unlocked: savedSkinsState[2] || false, specialUnlock: "피버모드 클리어", bodyColor: "#e74c3c", faceColor: "#fffa65", hairColor: "#c0392b", hairType: "ninja", deathType: "burnUp" },
    { id: 3, name: "사이버 닌자", price: 150, unlocked: savedSkinsState[3] !== undefined ? savedSkinsState[3] : false, bodyColor: "#111111", faceColor: "#111111", hairColor: "#111111", hairType: "ninja", deathType: "shadowDash" },
    { id: 4, name: "황금 로봇", price: 150, unlocked: savedSkinsState[4] !== undefined ? savedSkinsState[4] : false, bodyColor: "#f1c40f", faceColor: "#f1c40f", hairColor: "#f1c40f", hairType: "robot", deathType: "explode" },
    { id: 5, name: "긴머리 소녀", price: 150, unlocked: savedSkinsState[5] !== undefined ? savedSkinsState[5] : false, bodyColor: "#e91e63", faceColor: "#ffcc80", hairColor: "#3e2723", hairType: "long", deathType: "dizzySpin" },
    { id: 6, name: "스페이스 파일럿", price: 150, unlocked: savedSkinsState[6] !== undefined ? savedSkinsState[6] : false, bodyColor: "#3498db", faceColor: "#ffffff", hairColor: "#bdc3c7", hairType: "propeller", deathType: "flyAway" },
    { id: 7, name: "꼬마 마법사", price: 150, unlocked: savedSkinsState[7] !== undefined ? savedSkinsState[7] : false, bodyColor: "#8e44ad", faceColor: "#ffd32a", hairColor: "#e67e22", hairType: "long", deathType: "broomFly" },
    { id: 8, name: "제트 슬라이더", price: 150, unlocked: savedSkinsState[8] !== undefined ? savedSkinsState[8] : false, bodyColor: "#e74c3c", faceColor: "#fffa65", hairColor: "#2c3e50", hairType: "ninja", deathType: "spinDrop" }
];
let currentSkinId = 0;

let maps = [
    { id: 0, name: "밝은 도시", theme: "city" },
    { id: 1, name: "초록 정글", theme: "jungle" },
    { id: 2, name: "고대 피라미드", theme: "pyramid" },
    { id: 3, name: "푸른 바다", theme: "ocean" }
];
let currentMapId = 0;

let isPlaying = false;
let deathTimer = 0;
let activeDeathType = "fall";

let timeLimit = 100;
let timeDecreaseRate = 0.18;

let player = {
    direction: 1,
    walkFrame: 0,
    currentIndex: 0
};

let stairs = [];
let cameraX = 0;
let cameraY = 0;
let targetCameraX = 0;
let targetCameraY = 0;

let turnConsecutiveCount = 0;
let lastTurnDirectionChange = 0;

// 배경 오브젝트 초기화
let cityBuildings = [];
for(let i = 0; i < 6; i++) {
    cityBuildings.push({
        x: i * 65 + 10,
        height: 180 + (i * 30) % 150,
        width: 45,
        color: ['#34495e', '#2c3e50', '#3d566e', '#253746'][i % 4]
    });
}

let jungleTrees = [];
for(let i = 0; i < 12; i++) {
    jungleTrees.push({
        x: i * 40 + Math.random() * 20,
        y: 300 + Math.random() * 80,
        size: 30 + Math.random() * 20
    });
}

let pyramidStars = [];
for(let i = 0; i < 40; i++) {
    pyramidStars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height * 0.6,
        size: Math.random() * 2 + 0.5,
        alpha: Math.random() * 0.8 + 0.2
    });
}

let oceanBubbles = [];
for(let i = 0; i < 25; i++) {
    oceanBubbles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 4 + 2,
        speed: Math.random() * 0.5 + 0.2
    });
}

let glassDecorations = [];
for(let i = 0; i < 20; i++) {
    glassDecorations.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 30 + 10,
        angle: Math.random() * Math.PI
    });
}

let fireParticles = [];
for(let i = 0; i < 30; i++) {
    fireParticles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 4 + 2,
        speed: Math.random() * 2 + 1
    });
}

function saveSkinsData() {
    let data = {};
    skins.forEach(s => {
        if (s.id !== 0) data[s.id] = s.unlocked;
    });
    localStorage.setItem('infiniteStairs_skins', JSON.stringify(data));
}

function updateGemsDisplay() {
    gemsEl.textContent = totalGems;
    localStorage.setItem('infiniteStairs_gems', totalGems);
}

function loadGems() {
    totalGems = parseInt(localStorage.getItem('infiniteStairs_gems')) || 0;
    updateGemsDisplay();
}

function openShop() {
    startScreen.style.display = 'none';
    shopScreen.style.display = 'flex';
    renderShop();
}

function closeShop() {
    shopScreen.style.display = 'none';
    startScreen.style.display = 'flex';
}

function renderShop() {
    let list = document.getElementById('skin-list');
    list.innerHTML = '';

    skins.forEach(skin => {
        let div = document.createElement('div');
        div.className = 'skin-card' + (skin.id === currentSkinId ? ' selected' : '');

        let info = document.createElement('div');
        info.style.fontSize = '12px';
        let nameSpan = document.createElement('span');
        nameSpan.textContent = skin.name;
        nameSpan.style.fontWeight = 'bold';
        info.appendChild(nameSpan);

        if (skin.specialUnlock) {
            let unlockSpan = document.createElement('div');
            unlockSpan.textContent = skin.specialUnlock;
            unlockSpan.style.fontSize = '9px';
            unlockSpan.style.color = '#aaa';
            info.appendChild(unlockSpan);
        }

        if (skin.price > 0) {
            let priceSpan = document.createElement('div');
            priceSpan.textContent = skin.price + ' GEM';
            priceSpan.style.fontSize = '9px';
            priceSpan.style.color = '#00e8ff';
            info.appendChild(priceSpan);
        }

        div.appendChild(info);

        let btn = document.createElement('button');
        btn.className = 'action-select-btn';
        if (skin.unlocked) {
            if (skin.id === currentSkinId) {
                btn.textContent = '사용 중';
                btn.style.backgroundColor = '#2ecc71';
                btn.style.color = 'white';
            } else {
                btn.textContent = '선택';
                btn.style.backgroundColor = '#3498db';
                btn.style.color = 'white';
                btn.onclick = () => selectSkin(skin.id);
            }
        } else if (skin.price > 0) {
            btn.textContent = '구매';
            btn.style.backgroundColor = '#e67e22';
            btn.style.color = 'white';
            btn.onclick = () => buySkin(skin.id);
        } else {
            btn.textContent = '잠김';
            btn.style.backgroundColor = '#555';
            btn.style.color = '#aaa';
            btn.disabled = true;
        }

        div.appendChild(btn);
        list.appendChild(div);
    });
}

function buySkin(id) {
    let skin = skins.find(s => s.id === id);
    if (!skin || skin.unlocked) return;

    if (totalGems >= skin.price) {
        totalGems -= skin.price;
        skin.unlocked = true;
        saveSkinsData();
        updateGemsDisplay();
        renderShop();
    } else {
        alert('보석이 부족합니다! 게임을 플레이해서 보석을 모아주세요.');
    }
}

function selectSkin(id) {
    let skin = skins.find(s => s.id === id);
    if (skin && skin.unlocked) {
        currentSkinId = id;
        renderShop();
    }
}

function openModeSelect() {
    startScreen.style.display = 'none';
    modeScreen.style.display = 'flex';
}

function closeModeSelect() {
    modeScreen.style.display = 'none';
    startScreen.style.display = 'flex';
}

function openMapSelect() {
    startScreen.style.display = 'none';
    mapScreen.style.display = 'flex';
    renderMapSelect();
}

function closeMapSelect() {
    mapScreen.style.display = 'none';
    startScreen.style.display = 'flex';
}

function renderMapSelect() {
    let list = document.getElementById('map-list');
    list.innerHTML = '';

    maps.forEach(map => {
        let div = document.createElement('div');
        div.className = 'map-card' + (map.id === currentMapId ? ' selected' : '');

        let info = document.createElement('div');
        info.style.fontSize = '12px';
        let nameSpan = document.createElement('span');
        nameSpan.textContent = map.name;
        nameSpan.style.fontWeight = 'bold';
        info.appendChild(nameSpan);

        div.appendChild(info);

        let btn = document.createElement('button');
        btn.className = 'action-select-btn';

        if (map.id === currentMapId) {
            btn.textContent = '사용 중';
            btn.style.backgroundColor = '#2ecc71';
            btn.style.color = 'white';
        } else {
            btn.textContent = '선택';
            btn.style.backgroundColor = '#3498db';
            btn.style.color = 'white';
            btn.onclick = () => selectMap(map.id);
        }

        div.appendChild(btn);
        list.appendChild(div);
    });
}

function selectMap(id) {
    if (maps.find(m => m.id === id)) {
        currentMapId = id;
        renderMapSelect();
    }
}

function initializeGame() {
    stairs = [];
    score = 0;
    gameGems = 0;
    scoreEl.textContent = score;
    timeLimit = 100;
    timeDecreaseRate = 0.18;
    player.currentIndex = 0;
    player.direction = 1;
    player.walkFrame = 0;
    turnConsecutiveCount = 0;
    lastTurnDirectionChange = 0;
    cameraX = 0;
    cameraY = 0;
    targetCameraX = 0;
    targetCameraY = 0;

    let startX = CENTER_X - STAIR_WIDTH / 2;
    let startY = canvas.height - 40;

    stairs.push({ x: startX, y: startY, dir: 1, color: '#f1c40f' });

    for(let i = 0; i < 100; i++) {
        generateNextStair();
    }

    isPlaying = true;
    startScreen.style.display = 'none';
    modeScreen.style.display = 'none';
    shopScreen.style.display = 'none';
    mapScreen.style.display = 'none';
    gameOverScreen.style.display = 'none';

    timerBar.style.width = '100%';
    requestAnimationFrame(gameLoop);
}

function generateNextStair() {
    let last = stairs[stairs.length - 1];
    let newDir;

    if (gameMode === 2) {
        if (stairs.length % 50 === 0) {
            newDir = -last.dir;
        } else {
            newDir = last.dir;
        }
    } else {
        if (Math.random() < 0.5) {
            newDir = -1;
        } else {
            newDir = 1;
        }
    }

    let newX = last.x + newDir * STEP_X;
    let newY = last.y - STEP_Y;

    if (newX < 40) {
        newX = 40;
        newDir = 1;
    }
    if (newX > canvas.width - 40 - STAIR_WIDTH) {
        newX = canvas.width - 40 - STAIR_WIDTH;
        newDir = -1;
    }

    let colors = ['#f1c40f', '#e67e22', '#2ecc71', '#3498db', '#9b59b6'];
    stairs.push({
        x: newX,
        y: newY,
        dir: newDir,
        color: colors[stairs.length % colors.length]
    });
}

function startGame(mode) {
    gameMode = mode;
    initializeGame();
}

function restartGame() {
    initializeGame();
}

function goHome() {
    isPlaying = false;
    deathTimer = 0;
    gameOverScreen.style.display = 'none';
    startScreen.style.display = 'flex';
    score = 0;
    scoreEl.textContent = 0;
    timerBar.style.width = '100%';
}

function checkStep(direction) {
    if (!isPlaying) return;

    let current = stairs[player.currentIndex];
    let next = stairs[player.currentIndex + 1];

    if (!next) return;

    if (direction === next.dir) {
        score++;
        gameGems++;
        totalGems++;
        updateGemsDisplay();

        scoreEl.textContent = score;
        player.walkFrame = (player.walkFrame + 1) % 2;
        player.currentIndex++;

        if (gameMode === 2) {
            timeLimit = Math.min(100, timeLimit + 4.0);
            timeDecreaseRate = 0.40 + (score * 0.001);
        } else {
            timeLimit = Math.min(100, timeLimit + 5);
            let hundredMultiplier = Math.floor(score / 100);
            timeDecreaseRate = 0.18 + (score * 0.0006) + (hundredMultiplier * 0.05);
        }

        const targetStair = stairs[player.currentIndex];
        targetCameraX = -targetStair.x;
        targetCameraY = -targetStair.y;

        if (stairs.length - player.currentIndex < 30) {
            generateNextStair();
        }
    } else {
        triggerDeath();
    }
}

function triggerDeath() {
    isPlaying = false;

    if (score > maxScore) {
        maxScore = score;
        maxScoreEl.textContent = maxScore;
        
        totalGems += 10;
        gameGems += 10;
        updateGemsDisplay();
    }

    const activeSkin = skins.find(s => s.id === currentSkinId) || skins[0];
    activeDeathType = activeSkin.deathType || "fall";

    deathTimer = 1;

    setTimeout(() => {
        endGame();
    }, 850);
}

function endGame() {
    deathTimer = 0;
    finalScoreEl.textContent = score;
    earnedGemsEl.textContent = gameGems;

    let unlockedMsg = "";
    if (gameMode === 1 && score >= 150) {
        const glassHuman = skins.find(s => s.id === 1);
        if (!glassHuman.unlocked) {
            glassHuman.unlocked = true;
            saveSkinsData();
            unlockedMsg = "🎉 유리계단 150계단 달성! '유리인간' 캐릭터 해금!";
        }
    } else if (gameMode === 2 && score >= 100) {
        const fireMan = skins.find(s => s.id === 2);
        if (!fireMan.unlocked) {
            fireMan.unlocked = true;
            saveSkinsData();
            unlockedMsg = "🎉 피버모드 달성! '파이어맨' 캐릭터 해금!";
        }
    }

    if (unlockedMsg !== "") {
        unlockNoticeEl.textContent = unlockedMsg;
        unlockNoticeEl.style.display = "block";
    } else {
        unlockNoticeEl.style.display = "none";
    }

    gameOverScreen.style.display = 'flex';
}

function gameLoop() {
    if (!isPlaying && deathTimer === 0) return;

    if (isPlaying) {
        timeLimit -= timeDecreaseRate;
        if (timeLimit <= 0) {
            timeLimit = 0;
            timerBar.style.width = '0%';
            triggerDeath();
            return;
        }
        timerBar.style.width = timeLimit + '%';

        cameraX += (targetCameraX - cameraX) * 0.35;
        cameraY += (targetCameraY - cameraY) * 0.35;
    } else if (deathTimer > 0) {
        deathTimer += 1;
    }

    draw();

    if (isPlaying || deathTimer > 0) {
        requestAnimationFrame(gameLoop);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameMode === 1) {
        let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGrad.addColorStop(0, '#192a56');
        bgGrad.addColorStop(1, '#273c75');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.lineWidth = 1.5;
        glassDecorations.forEach(g => {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.save();
            ctx.translate(g.x, g.y);
            ctx.rotate(g.angle);
            ctx.fillRect(-g.size/2, -g.size/2, g.size, g.size);
            ctx.strokeRect(-g.size/2, -g.size/2, g.size, g.size);
            ctx.restore();
        });
    } else if (gameMode === 2) {
        let hellGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        hellGrad.addColorStop(0, '#2c0b0e');
        hellGrad.addColorStop(1, '#8e2a2a');
        ctx.fillStyle = hellGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        fireParticles.forEach(p => {
            p.y -= p.speed;
            if (p.y < 0) p.y = canvas.height;
            ctx.fillStyle = `rgba(255, 193, 7, ${Math.random() * 0.6 + 0.2})`;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });
    } else {
        drawBackground();
    }

    ctx.save();
    ctx.translate(canvas.width / 2 + cameraX, canvas.height - 160 + cameraY);

    stairs.forEach((stair, index) => {
        if (index < player.currentIndex - 8 || index > player.currentIndex + 30) return;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.fillRect(stair.x + 3, stair.y + 4, STAIR_WIDTH, STAIR_HEIGHT);

        ctx.fillStyle = stair.color;
        ctx.fillRect(stair.x, stair.y, STAIR_WIDTH, STAIR_HEIGHT);

        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(stair.x, stair.y, STAIR_WIDTH, STAIR_HEIGHT);
    });

    let currentStair = stairs[player.currentIndex];
    let px = currentStair.x + STAIR_WIDTH / 2;
    let py = currentStair.y - 25;

    drawPlayer(px, py);

    ctx.restore();

    if (!isPlaying && deathTimer > 0) {
        drawDeathAnimation();
    }
}

function drawBackground() {
    let map = maps.find(m => m.id === currentMapId) || maps[0];

    if (map.theme === 'city') {
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#74b9ff');
        grad.addColorStop(1, '#dfe6e9');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.arc(320, 80, 35, 0, Math.PI * 2);
        ctx.fill();

        cityBuildings.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x, canvas.height - 100 - b.height, b.width, b.height);
            ctx.fillStyle = '#f5f6fa';
            for(let row = 0; row < 5; row++) {
                for(let col = 0; col < 3; col++) {
                    ctx.fillRect(b.x + 5 + col * 12, canvas.height - 90 - b.height + row * 35, 7, 10);
                }
            }
        });

        ctx.fillStyle = '#2d3436';
        ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
        ctx.fillStyle = '#636e72';
        ctx.fillRect(0, canvas.height - 70, canvas.width, 5);

        ctx.strokeStyle = '#f1c40f';
        ctx.lineWidth = 3;
        for(let x = 0; x < canvas.width; x += 50) {
            ctx.beginPath();
            ctx.moveTo(x, canvas.height - 40);
            ctx.lineTo(x + 25, canvas.height - 40);
            ctx.stroke();
        }
    } else if (map.theme === 'jungle') {
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#55efc4');
        grad.addColorStop(1, '#2ecc71');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        jungleTrees.forEach(t => {
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(t.x - 5, t.y, 10, canvas.height - t.y);
            ctx.fillStyle = '#145a32';
            ctx.beginPath();
            ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1e8449';
            ctx.beginPath();
            ctx.arc(t.x + 15, t.y + 5, t.size * 0.7, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.fillStyle = '#27ae60';
        ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
    } else if (map.theme === 'pyramid') {
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#2c3e50');
        grad.addColorStop(1, '#8e44ad');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        pyramidStars.forEach(s => {
            ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
            ctx.fillRect(s.x, s.y, s.size, s.size);
        });

        ctx.fillStyle = '#d35400';
        ctx.beginPath();
        ctx.moveTo(80, canvas.height - 120);
        ctx.lineTo(180, canvas.height - 250);
        ctx.lineTo(280, canvas.height - 120);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#e67e22';
        ctx.fillRect(0, canvas.height - 110, canvas.width, 110);
    } else if (map.theme === 'ocean') {
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#0984e3');
        grad.addColorStop(1, '#00cec9');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        oceanBubbles.forEach(b => {
            b.y -= b.speed;
            if (b.y < 0) b.y = canvas.height;
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
            ctx.stroke();
        });

        ctx.fillStyle = 'rgba(0, 105, 92, 0.5)';
        for(let i = 0; i < 6; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 70, canvas.height);
            ctx.lineTo(i * 70 + 20, canvas.height - 100);
            ctx.lineTo(i * 70 + 35, canvas.height - 80);
            ctx.lineTo(i * 70 + 50, canvas.height - 130);
            ctx.lineTo(i * 70 + 65, canvas.height);
            ctx.closePath();
            ctx.fill();
        }
    }
}

function drawPlayer(x, y) {
    let skin = skins.find(s => s.id === currentSkinId) || skins[0];

    ctx.save();
    if (player.direction === -1) {
        ctx.scale(-1, 1);
        x = -x;
    }

    let bob = player.walkFrame === 0 ? 0 : -2;

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y + 22, 14, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    if (skin.isGlass) {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        ctx.fillRect(x - 12, y + bob - 20, 24, 20);
        ctx.strokeRect(x - 12, y + bob - 20, 24, 20);
        ctx.beginPath();
        ctx.arc(x, y + bob - 28, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    } else if (skin.hairType === 'robot') {
        ctx.fillStyle = skin.bodyColor;
        ctx.fillRect(x - 12, y + bob - 20, 24, 20);
        ctx.fillStyle = skin.faceColor;
        ctx.fillRect(x - 9, y + bob - 33, 18, 13);
        ctx.fillStyle = '#111';
        ctx.fillRect(x - 6, y + bob - 29, 4, 3);
        ctx.fillRect(x + 2, y + bob - 29, 4, 3);
        ctx.fillStyle = skin.hairColor;
        ctx.fillRect(x - 3, y + bob - 39, 6, 6);
    } else {
        // body
        ctx.fillStyle = skin.bodyColor;
        ctx.fillRect(x - 12, y + bob - 20, 24, 20);

        // face
        ctx.fillStyle = skin.faceColor;
        ctx.beginPath();
        ctx.arc(x, y + bob - 28, 9, 0, Math.PI * 2);
        ctx.fill();

        // hair
        ctx.fillStyle = skin.hairColor;
        if (skin.hairType === 'long') {
            ctx.beginPath();
            ctx.arc(x, y + bob - 33, 10, Math.PI, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(x - 10, y + bob - 33, 4, 14);
            ctx.fillRect(x + 6, y + bob - 33, 4, 14);
        } else if (skin.hairType === 'ninja') {
            ctx.fillRect(x - 10, y + bob - 36, 20, 6);
        } else if (skin.hairType === 'propeller') {
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(x - 8, y + bob - 37, 16, 5);
            ctx.fillStyle = '#3498db';
            ctx.fillRect(x - 2, y + bob - 42, 4, 6);
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(x - 12, y + bob - 44, 24, 2);
        } else {
            ctx.beginPath();
            ctx.arc(x, y + bob - 33, 10, Math.PI, Math.PI * 2);
            ctx.fill();
        }

        // face details
        ctx.fillStyle = '#111';
        ctx.fillRect(x - 4, y + bob - 29, 2, 2);
        ctx.fillRect(x + 2, y + bob - 29, 2, 2);
    }

    // legs
    ctx.strokeStyle = skin.bodyColor;
    ctx.lineWidth = 4;
    if (player.walkFrame === 0) {
        ctx.beginPath();
        ctx.moveTo(x - 5, y + bob);
        ctx.lineTo(x - 8, y + bob + 12);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + 5, y + bob);
        ctx.lineTo(x + 8, y + bob + 12);
        ctx.stroke();
    } else {
        ctx.beginPath();
        ctx.moveTo(x - 5, y + bob);
        ctx.lineTo(x - 10, y + bob + 10);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + 5, y + bob);
        ctx.lineTo(x + 10, y + bob + 10);
        ctx.stroke();
    }

    ctx.restore();
}

function drawDeathAnimation() {
    let progress = deathTimer / 50;
    if (progress > 1) progress = 1;

    let currentStair = stairs[player.currentIndex];
    let px = currentStair.x + STAIR_WIDTH / 2 + cameraX;
    let py = currentStair.y - 25 + cameraY;

    ctx.save();

    if (activeDeathType === 'shatter') {
        ctx.globalAlpha = Math.max(0, 1 - progress);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        for(let i = 0; i < 12; i++) {
            let angle = (Math.PI * 2 / 12) * i;
            let dist = progress * 100;
            ctx.fillRect(px + Math.cos(angle) * dist, py + Math.sin(angle) * dist, 5, 5);
        }
    } else if (activeDeathType === 'burnUp') {
        ctx.globalAlpha = Math.max(0, 1 - progress);
        ctx.fillStyle = '#ff6b00';
        ctx.beginPath();
        ctx.arc(px, py, 10 + progress * 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffd32a';
        ctx.beginPath();
        ctx.arc(px, py - progress * 30, 5 + progress * 10, 0, Math.PI * 2);
        ctx.fill();
    } else if (activeDeathType === 'shadowDash') {
        ctx.globalAlpha = Math.max(0, 1 - progress);
        ctx.fillStyle = '#111';
        ctx.fillRect(px - progress * 80, py - 20, 24, 20);
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(px - progress * 160, py - 15, 100, 5);
    } else if (activeDeathType === 'explode') {
        ctx.globalAlpha = Math.max(0, 1 - progress);
        for(let i = 0; i < 16; i++) {
            let angle = (Math.PI * 2 / 16) * i;
            let dist = progress * 90;
            ctx.fillStyle = i % 2 === 0 ? '#f1c40f' : '#e67e22';
            ctx.fillRect(px + Math.cos(angle) * dist, py + Math.sin(angle) * dist, 6, 6);
        }
    } else if (activeDeathType === 'dizzySpin') {
        ctx.globalAlpha = Math.max(0, 1 - progress);
        ctx.translate(px, py);
        ctx.rotate(progress * Math.PI * 4);
        drawPlayer(0, 0);
    } else if (activeDeathType === 'flyAway') {
        ctx.globalAlpha = Math.max(0, 1 - progress);
        ctx.translate(px + progress * 80, py - progress * 120, 0);
        drawPlayer(0, 0);
    } else if (activeDeathType === 'broomFly') {
        ctx.globalAlpha = Math.max(0, 1 - progress);
        ctx.translate(px + progress * 80, py - progress * 80, 0);
        ctx.rotate(progress * Math.PI);
        ctx.fillStyle = '#8e44ad';
        ctx.fillRect(-20, 5, 40, 4);
        drawPlayer(0, 0);
    } else if (activeDeathType === 'spinDrop') {
        ctx.globalAlpha = Math.max(0, 1 - progress);
        ctx.translate(px, py + progress * 150);
        ctx.rotate(progress * Math.PI * 6);
        drawPlayer(0, 0);
    } else {
        ctx.globalAlpha = Math.max(0, 1 - progress);
        ctx.translate(px + progress * 30, py + progress * 50);
        ctx.rotate(progress * Math.PI * 2);
        drawPlayer(0, 0);
    }

    ctx.restore();
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
        e.preventDefault();
        checkStep(-1);
    }
    if (e.code === 'KeyD' || e.code === 'ArrowRight') {
        e.preventDefault();
        checkStep(1);
    }
    if (e.code === 'Space') {
        if (gameOverScreen.style.display === 'flex') {
            e.preventDefault();
            restartGame();
        }
    }
});

loadGems();
</script>
