<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>축제 주문</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f6f8;color:#222}button{font:inherit;cursor:pointer}.role-screen{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:#111;color:#fff}.role-screen h1{font-size:28px}.role-screen p{color:#aaa}.setup-card{width:min(440px,calc(100vw - 32px));padding:30px;background:#1c1c1c;border:1px solid #383838;border-radius:20px;text-align:left}.setup-card h1,.setup-card>p{text-align:center}.setup-label{display:block;font-size:14px;font-weight:700;margin:20px 0 9px;color:#ddd}.setup-buttons{display:flex;gap:8px;flex-wrap:wrap}.setup-btn{flex:1;min-width:65px;border:1px solid #555;border-radius:10px;padding:12px 8px;background:#292929;color:#fff}.setup-btn.selected{background:#168a4b;border-color:#168a4b}.setup-card input{width:100%;padding:13px;border-radius:10px;border:1px solid #555;background:#111;color:#fff;font:inherit}.setup-start{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:#168a4b;color:#fff;font-weight:800}.setup-error{color:#ff8a8a!important;min-height:18px;font-size:13px}.setup-card .hint{font-size:13px;text-align:left;margin-bottom:0}.app{display:none;height:100vh}.client{width:100%;height:100%;display:grid;grid-template-columns:3fr 1fr}.menu{padding:28px;overflow:auto}.menu h1{margin:0 0 22px;font-size:32px}.kiosk{color:#168a4b;font-size:16px;margin-bottom:6px}.menus{display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:20px}.menu-card{border:0;border-radius:20px;background:#fff;padding:28px;min-height:190px;text-align:left;box-shadow:0 5px 18px #00000012;transition:.15s;position:relative}.menu-card:hover{transform:translateY(-2px)}.menu-card.sold-out{opacity:.62}.sold-out-label{display:inline-block;margin-left:8px;padding:4px 7px;border-radius:6px;background:#b42318;color:#fff;font-size:13px;vertical-align:middle}.menu-card .qty-btn:disabled{opacity:.35;cursor:not-allowed}.menu-card .name{font-size:27px;font-weight:800}.menu-card .price{font-size:22px;margin-top:12px;color:#168a4b}.menu-description{min-height:30px;line-height:1.45}.voucher-label{display:block;margin-top:14px;font-size:14px;font-weight:700}.voucher-select{width:100%;margin-top:7px;padding:11px;border:1px solid #cfd5d9;border-radius:9px;background:#fff;color:#222;font:inherit}.controls{display:flex;align-items:center;gap:10px;margin-top:25px}.qty-btn{width:48px;height:48px;border:0;border-radius:12px;background:#168a4b;color:#fff;font-size:28px;font-weight:700}.qty-btn.minus{background:#e5e7e9;color:#222}.qty-num{min-width:42px;text-align:center;font-size:24px;font-weight:800}.qty-btn:disabled{opacity:.45;cursor:not-allowed}.cart{background:#fff;border-left:1px solid #ddd;padding:24px;display:flex;flex-direction:column;min-width:280px}.cart h2{margin:0 0 18px}.cart-list{flex:1;overflow:auto}.cart-item{padding:13px 0;border-bottom:1px solid #eee}.cart-item-row{display:flex;justify-content:space-between;gap:8px}.qty{font-size:14px;color:#777}.total{border-top:2px solid #222;padding-top:18px;font-size:25px;font-weight:800}.paidbox{margin-top:12px;padding:12px;border-radius:10px;background:#e9f8ef;color:#168a4b;font-weight:700;text-align:center}.host{height:100vh;padding:24px;display:flex;flex-direction:column}.host-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.host h1{margin:0}.host-content{display:grid;grid-template-rows:minmax(220px,1.2fr) minmax(160px,1fr);gap:16px;min-height:0;flex:1}.host-list,.history-list{background:#fff;border-radius:14px;overflow:auto;min-height:0}.history-wrap h2{font-size:18px;margin:0 0 8px}.order-row{display:grid;grid-template-columns:105px 85px minmax(130px,1fr) 55px 100px 100px 240px;gap:10px;padding:14px;border-bottom:1px solid #eee;align-items:center}.order-row.header{font-weight:800;background:#f1f3f5;position:sticky;top:0;z-index:1}.status{font-weight:700}.paid{color:#168a4b}.cancelled{color:#b42318}.empty{padding:28px;text-align:center;color:#888}.hint{font-size:13px;color:#888;margin-top:8px}.action-btn{border:0;border-radius:8px;padding:8px 10px;font-weight:700;margin:2px;background:#168a4b;color:#fff}.action-btn.secondary{background:#e5e7eb;color:#222}.action-btn.danger{background:#b42318;color:#fff}.host-total{font-size:25px;font-weight:800;margin:0 0 16px}.action-group{display:flex;flex-wrap:wrap;gap:3px}.language-bar{position:fixed;top:10px;right:12px;z-index:10000;display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #555;border-radius:10px;background:#171717;color:#fff;font-size:13px;box-shadow:0 3px 12px #0002}.language-bar select{padding:6px 8px;border-radius:7px;border:1px solid #777;background:#242424;color:#fff;font:inherit}.host{padding-top:58px}
@media(max-width:800px){.client{grid-template-columns:1fr}.cart{border-left:0;border-top:1px solid #ddd;height:38vh}.menu{height:62vh;padding:16px}.menus{grid-template-columns:1fr 1fr;gap:10px}.menu-card{min-height:145px;padding:16px}.menu-card .name{font-size:20px}.menu-card .price{font-size:17px}.controls{margin-top:12px}.qty-btn{width:40px;height:40px}.qty-num{font-size:20px}.host-content{grid-template-rows:minmax(250px,1.2fr) minmax(180px,1fr)}.order-row{grid-template-columns:75px 55px minmax(90px,1fr) 35px 65px 65px minmax(150px,1.4fr);gap:5px;padding:10px;font-size:12px}.action-btn{padding:6px 7px;font-size:11px}}
</style>
</head>
<body>
<div class="language-bar"><label for="languageSelect">언어 / Language</label><select id="languageSelect" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select></div>
<div id="roleScreen" class="role-screen"><div class="setup-card"><h1>축제 주문 시스템</h1><p>사용할 화면과 키오스크를 선택하세요.</p><div class="setup-label">화면 선택</div><div class="setup-buttons"><button type="button" class="setup-btn selected" id="chooseClient">주문 키오스크</button><button type="button" class="setup-btn" id="chooseHost">관리자</button></div><div class="setup-label">키오스크 번호</div><div class="setup-buttons" id="kioskChoices"><button type="button" class="setup-btn selected" data-kiosk="1">1번</button><button type="button" class="setup-btn" data-kiosk="2">2번</button><button type="button" class="setup-btn" data-kiosk="3">3번</button><button type="button" class="setup-btn" data-kiosk="4">4번</button></div><p class="hint" id="setupHint">주문할 키오스크 번호를 하나 선택하세요.</p><label class="setup-label" for="setupPassword">접속 비밀번호</label><input id="setupPassword" type="password" autocomplete="current-password" placeholder="비밀번호 입력"><button type="button" class="setup-start" id="setupStart">시작하기</button><p class="setup-error" id="setupError" role="alert"></p></div></div>
<div id="clientApp" class="app"><div class="client"><main class="menu"><div id="clientKiosk" class="kiosk"></div><div id="rtcStatus" class="hint">P2P 연결 준비 중...</div><h1>주문하기</h1><div id="menus" class="menus"></div></main><aside class="cart"><h2>담은 메뉴</h2><div id="cartList" class="cart-list"><div class="empty">아직 담은 메뉴가 없습니다.</div></div><div class="total">총 <span id="total">0</span>원</div><div id="paidBox"></div></aside></div></div>
<div id="hostApp" class="app"><div class="host"><div class="host-top"><div><h1>주문 관리자</h1><div class="hint" id="hostInfo"></div><div class="hint" id="rtcHostStatus">WebRTC 연결 준비 중...</div></div><div class="host-total">총 매출 <span id="hostTotal">0</span>원</div></div><div class="host-content"><div class="host-list"><div class="order-row header"><div>키오스크</div><div>주문 번호</div><div>메뉴</div><div>수량</div><div>금액</div><div>상태</div><div>처리</div></div><div id="hostList"></div></div><section class="history-wrap"><h2>이전 주문 기록 · 불러오기로 키오스크에 복원</h2><div class="history-list"><div class="order-row header"><div>키오스크</div><div>주문 번호</div><div>메뉴</div><div>수량</div><div>금액</div><div>상태</div><div>처리</div></div><div id="historyList"></div></div></section></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getFirestore,doc,onSnapshot,setDoc,updateDoc,collection,addDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBwjCbt7ykOHRHpVpfvnKBxlI-XIllqPsQ",authDomain:"festival2026-admin.firebaseapp.com",projectId:"festival2026-admin",storageBucket:"festival2026-admin.firebasestorage.app",messagingSenderId:"909628177160",appId:"1:909628177160:web:d7360a9c017b4fee828abd"};
const db=getFirestore(initializeApp(firebaseConfig));
let language=document.getElementById("languageSelect").value==="en"?"en":"ko";
document.getElementById("languageSelect").addEventListener("change",e=>{language=e.target.value==="en"?"en":"ko";});
const PASSWORD="25withcoding";
const menus=[{id:"m1",name:"아이스티",price:1500,description:"구매 시 코딩과 함께라면 부스 무료 체험 가능"},{id:"m2",name:"레몬에이드",price:1500,description:"구매 시 코딩과 함께라면 부스 무료 체험 가능"},{id:"m3",name:"아이스 초코",price:1500,description:"구매 시 코딩과 함께라면 부스 무료 체험 가능"},{id:"m4",name:"음료 교환권 사용",price:0,description:"원하는 음료 1개를 선택하세요",voucher:true}];
const voucherDrinks=["아이스티","레몬에이드","아이스 초코"];
const drinkIds={1:"m1",2:"m2",3:"m3"};
let soldOut={m1:false,m2:false,m3:false};
const availabilityDoc=doc(db,"orderSettings","menuAvailability");
window.o={o:async function(which,available=false){if(role!=="host"){console.warn("o.o()는 관리자 화면에서만 사용할 수 있습니다.");return;}const key=String(which);if(!Object.prototype.hasOwnProperty.call(drinkIds,key)){console.warn("사용법: o.o(\"1\") 아이스티 품절, o.o(\"2\") 레몬에이드 품절, o.o(\"3\") 아이스 초코 품절. 재판매는 o.o(\"1\", true)처럼 입력하세요.");return;}const id=drinkIds[key];soldOut[id]=available!==true;try{await setDoc(availabilityDoc,{soldOut,updatedAt:Date.now()},{merge:true});console.info((menus.find(m=>m.id===id)?.name||id)+(soldOut[id]?" 품절 처리 완료":" 판매 재개 완료"));}catch(e){console.error("품절 상태 저장 실패",e);}}};
function voucherItemId(drink){return "m4__"+voucherDrinks.indexOf(drink);}
function orderLines(o){const items=o?.items||{};const lines=menus.filter(m=>!m.voucher&&Number(items[m.id]||0)>0).map(m=>({id:m.id,name:m.name,price:m.price,qty:Number(items[m.id]||0)}));for(const drink of voucherDrinks){const id=voucherItemId(drink),qty=Number(items[id]||0);if(qty>0)lines.push({id,name:"음료 교환권 사용 ("+drink+")",price:0,qty});}return lines;}

const SESSION_KEY="festivalOrderSetup";
let selectedRole="client",selectedKiosks=["1"],role=null,kiosks=[],orders={},writeQueues={},rtcPeers={},rtcChannels={},rtcListeners=[],rtcSeenOffers={};
const rtcDisabled=new Set(),rtcTimers={};
function useFirebaseOnly(k,reason){if(rtcDisabled.has(k))return;rtcDisabled.add(k);clearTimeout(rtcTimers[k]);const pc=rtcPeers[k];if(pc){try{pc.onicecandidate=null;pc.ondatachannel=null;pc.close();}catch(_){}delete rtcPeers[k];}const ch=rtcChannels[k];if(ch){try{ch.close();}catch(_){}delete rtcChannels[k];}const msg=language==="en"?"WebRTC unavailable — Firebase only":"WebRTC 연결 실패 — Firebase만 사용 중";rtcStatus(msg);console.warn("Kiosk "+k+" switched to Firebase-only mode",reason||"");}
function watchRtcTimeout(k){clearTimeout(rtcTimers[k]);rtcTimers[k]=setTimeout(()=>{const pc=rtcPeers[k],ch=rtcChannels[k];if(!rtcDisabled.has(k)&&(!pc||pc.connectionState!=="connected"||!ch||ch.readyState!=="open"))useFirebaseOnly(k,"connection timeout");},12000);}
function orderDoc(k){return doc(db,"order","kiosk-"+k);}
function updateSetupUI(){
 document.getElementById("chooseClient").classList.toggle("selected",selectedRole==="client");
 document.getElementById("chooseHost").classList.toggle("selected",selectedRole==="host");
 document.querySelectorAll("[data-kiosk]").forEach(b=>b.classList.toggle("selected",selectedKiosks.includes(b.dataset.kiosk)));
 const hint=document.getElementById("setupHint");
 hint.textContent=selectedRole==="client"?"주문할 키오스크 번호를 하나 선택하세요.":"관리할 키오스크를 선택하세요. 여러 개를 선택할 수 있습니다.";
}
document.getElementById("chooseClient").addEventListener("click",()=>{selectedRole="client";selectedKiosks=[selectedKiosks[0]||"1"];updateSetupUI();});
document.getElementById("chooseHost").addEventListener("click",()=>{selectedRole="host";if(!selectedKiosks.length)selectedKiosks=["1"];updateSetupUI();});
document.getElementById("kioskChoices").addEventListener("click",e=>{const b=e.target.closest("[data-kiosk]");if(!b)return;const k=b.dataset.kiosk;if(selectedRole==="client")selectedKiosks=[k];else if(selectedKiosks.includes(k)){if(selectedKiosks.length>1)selectedKiosks=selectedKiosks.filter(x=>x!==k);}else if(selectedKiosks.length<4)selectedKiosks=[...selectedKiosks,k];updateSetupUI();});
document.getElementById("setupStart").addEventListener("click",()=>{
 const error=document.getElementById("setupError");
 if(document.getElementById("setupPassword").value!==PASSWORD){error.textContent="비밀번호가 올바르지 않습니다.";return;}
 if(!selectedKiosks.length){error.textContent="키오스크 번호를 하나 이상 선택하세요.";return;}
 role=selectedRole;kiosks=[...selectedKiosks];
 try{sessionStorage.setItem(SESSION_KEY,JSON.stringify({role,kiosks,unlocked:true}));}catch(e){console.warn("세션 설정 저장 실패",e);}
 error.textContent="";start();
});
document.getElementById("setupPassword").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("setupStart").click();});

const money=n=>Number(n||0).toLocaleString("ko-KR"),emptyOrder=()=>({items:{},total:0,status:"waiting",updatedAt:Date.now()});
function renderMenus(){document.getElementById("menus").innerHTML=menus.map(m=>{const unavailable=!!soldOut[m.id]&&!m.voucher;return `<div class="menu-card ${unavailable?"sold-out":""}"><div class="name">${m.name}${unavailable?' <span class="sold-out-label">품절</span>':""}</div><div class="price">${money(m.price)}원</div><div class="hint menu-description">${m.description||""}</div>${m.voucher?`<label class="voucher-label" for="voucherChoice">교환할 음료</label><select id="voucherChoice" class="voucher-select">${voucherDrinks.map(d=>`<option value="${d}" ${soldOut[drinkIds[voucherDrinks.indexOf(d)+1]]?"disabled":""}>${d}${soldOut[drinkIds[voucherDrinks.indexOf(d)+1]]?" (품절)":""}</option>`).join("")}</select>`:""}<div class="controls"><button class="qty-btn minus" data-id="${m.id}" data-delta="-1">−</button><div class="qty-num" id="qty-${m.id}">0</div><button class="qty-btn" data-id="${m.id}" data-delta="1" ${unavailable?"disabled":""}>+</button></div></div>`}).join("");document.querySelectorAll(".qty-btn").forEach(b=>b.onclick=()=>changeQty(b.dataset.id,Number(b.dataset.delta)));const select=document.getElementById("voucherChoice");if(select){const available=voucherDrinks.filter(d=>!soldOut[drinkIds[voucherDrinks.indexOf(d)+1]]);if(available.length)select.value=available[0];}}
async function changeQty(id,delta){
 const kiosk=kiosks[0],current=orders[kiosk]||emptyOrder();
 if(current.status==='paid'||current.status==='cancelled')return;
 const selected=document.getElementById("voucherChoice")?.value||voucherDrinks[0];
 const targetId=id==="m4"?voucherItemId(selected):id;
 if(delta>0&&((id!=="m4"&&soldOut[id])||(id==="m4"&&soldOut[drinkIds[voucherDrinks.indexOf(selected)+1]]))){alert("해당 음료는 품절되었습니다.");return;}
 const items={...(current.items||{})};
 items[targetId]=Math.max(0,(Number(items[targetId])||0)+delta);
 if(items[targetId]===0)delete items[targetId];
 const total=orderLines({items}).reduce((sum,line)=>sum+line.price*line.qty,0);
 const hasItems=orderLines({items}).length>0;
 const next={...current,items,total,status:'waiting',orderNo:hasItems?(current.orderNo||nextOrderNo(kiosk)):null,updatedAt:Date.now(),kiosk};
 orders[kiosk]=next;renderClient(next);sendRtc(kiosk,{type:"order",order:next});
 writeQueues[kiosk]=(writeQueues[kiosk]||Promise.resolve()).then(()=>setDoc(orderDoc(kiosk),next));
 try{await writeQueues[kiosk];}catch(e){console.error('ORDER_WRITE_ERROR',e);alert('주문 저장 실패: Firestore Rules에서 order 문서 쓰기를 허용해야 합니다. '+e.message);}
}
function renderClient(o){menus.forEach(m=>{const el=document.getElementById("qty-"+m.id);if(el)el.textContent=m.voucher?voucherDrinks.reduce((n,d)=>n+Number(o.items?.[voucherItemId(d)]||0),0):o.items?.[m.id]||0});const rows=orderLines(o).map(line=>`<div class="cart-item"><div class="cart-item-row"><b>${line.name}</b><b>${money(line.price*line.qty)}원</b></div><div class="qty">${line.qty}개 × ${money(line.price)}원</div></div>`).join("");document.getElementById("cartList").innerHTML=rows||'<div class="empty">아직 담은 메뉴가 없습니다.</div>';document.getElementById("total").textContent=money(o.total);document.getElementById("paidBox").innerHTML=o.status==='paid'?'<div class="paidbox">결제 완료</div>':o.status==='cancelled'?'<div class="paidbox" style="background:#fdecec;color:#b42318">결제 취소</div>':'';document.querySelectorAll('.qty-btn').forEach(b=>b.disabled=o.status==='paid'||o.status==='cancelled');}
function itemCount(o){return Object.values(o.items||{}).reduce((n,v)=>n+Number(v||0),0);}
function historyFor(k){return Array.isArray((orders[k]||{}).history)?orders[k].history:[];}
function nextOrderNo(k,sourceHistory=historyFor(k)){const maxSeq=sourceHistory.reduce((max,h)=>{const raw=String(h.orderNo||h.id||"");const n=Number(raw.slice(String(k).length));return raw.startsWith(String(k))&&Number.isFinite(n)?Math.max(max,n):max;},0);return String(k)+String(maxSeq+1).padStart(2,"0");}
function renderHost(){
 let html="",grand=0,historyHtml="";
 for(const k of kiosks){
  const o=orders[k]||emptyOrder();
  const entries=orderLines(o);
  const menuText=entries.map(line=>line.name+" × "+line.qty).join(", ");
  const quantity=entries.reduce((n,line)=>n+line.qty,0);
  const statusText=o.status==="paid"?"결제 완료":o.status==="cancelled"?"결제 취소":entries.length?"결제 대기":"-";
  html+='<div class="order-row"><div>'+k+'번 키오스크</div><div>'+(o.orderNo||"-")+'</div><div>'+(menuText||"주문 없음")+'</div><div>'+quantity+'</div><div>'+money(o.total||0)+'원</div><div class="status '+(o.status==="paid"?"paid":o.status==="cancelled"?"cancelled":"")+'">'+statusText+'</div><div class="action-group"><button class="action-btn" data-action="complete" data-kiosk="'+k+'" '+(!entries.length||o.status==="paid"||o.status==="cancelled"?'disabled':'')+'>결제 완료</button></div></div>';
  [...historyFor(k)].reverse().forEach(h=>{
   const lines=orderLines(h);
   const status=h.status==="paid"?"결제 완료":h.status==="cancelled"?"결제 취소":"결제 대기";
   const quantity=lines.reduce((n,line)=>n+line.qty,0);
   const menuText=lines.map(line=>line.name+" × "+line.qty).join(", ")||"메뉴 없음";
   historyHtml+='<div class="order-row"><div>'+k+'번 키오스크</div><div>'+(h.orderNo||h.id||"-")+'</div><div>'+menuText+'</div><div>'+quantity+'</div><div>'+money(h.total||0)+'원</div><div class="status '+(h.status==="paid"?"paid":h.status==="cancelled"?"cancelled":"")+'">'+status+'</div><div class="action-group"><button class="action-btn secondary" data-action="load" data-kiosk="'+k+'" data-history="'+h.id+'">불러오기</button><button class="action-btn secondary" data-action="undo-history" data-kiosk="'+k+'" data-history="'+h.id+'" '+(h.status!=="paid"?'disabled':'')+'>결제 완료 취소</button><button class="action-btn danger" data-action="cancel-history" data-kiosk="'+k+'" data-history="'+h.id+'" '+(h.status!=="paid"?'disabled':'')+'>결제 취소</button></div></div>';
   if(h.status==="paid")grand+=Number(h.total||0);
  });
 }
 document.getElementById("hostList").innerHTML=html;
 document.getElementById("historyList").innerHTML=historyHtml||'<div class="empty">아직 이전 주문 기록이 없습니다.</div>';
 document.getElementById("hostTotal").textContent=money(grand);
 document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{const k=b.dataset.kiosk,a=b.dataset.action;if(a==="complete")completePayment(k);else if(a==="load")loadHistory(k,b.dataset.history);else if(a==="undo-history")undoHistoryCompletion(k,b.dataset.history);else if(a==="cancel-history")cancelHistoryOrder(k,b.dataset.history);});
}
async function saveOrder(k,next){orders[k]=next;renderHost();sendRtc(k,{type:"order",order:next});try{await setDoc(orderDoc(k),next);}catch(e){console.error("ORDER_ACTION_ERROR",e);alert("처리 실패: Firestore Rules에서 order 문서 쓰기를 허용해야 합니다. "+e.message);}}
async function completePayment(k){
 const o=orders[k]||emptyOrder();if(!itemCount(o)){alert("완료할 주문이 없습니다.");return;}if(o.status==="paid"||o.status==="cancelled"){alert("이미 처리된 주문입니다.");return;}
 const history=[...historyFor(k)];
 const orderNo=o.orderNo||nextOrderNo(k);
 const archived={id:orderNo,orderNo,kiosk:k,items:{...(o.items||{})},total:Number(o.total||0),status:"paid",updatedAt:Date.now()};
 history.push(archived);
 await saveOrder(k,{...emptyOrder(),orderNo:nextOrderNo(k,history),history,updatedAt:Date.now(),kiosk:k,lastAction:"paid",nextOrderSeq:Number(orderNo.slice(String(k).length))+1});
}
async function cancelHistoryOrder(k,id){const o=orders[k]||emptyOrder(),history=historyFor(k),h=history.find(x=>x.id===id);if(!h||h.status!=="paid")return;if(!confirm("이 주문의 결제를 취소할까요? 주문 기록은 유지됩니다."))return;await saveOrder(k,{...o,history:history.map(x=>x.id===id?{...x,status:"cancelled",updatedAt:Date.now()}:x),updatedAt:Date.now(),kiosk:k,lastAction:"payment-cancelled"});}
async function undoHistoryCompletion(k,id){const o=orders[k]||emptyOrder(),history=historyFor(k),h=history.find(x=>x.id===id);if(!h||h.status!=="paid")return;if(itemCount(o)){alert("현재 진행 중인 주문이 있어 되돌릴 수 없습니다. 먼저 현재 주문을 비워 주세요.");return;}await saveOrder(k,{...o,items:{...(h.items||{})},total:Number(h.total||0),status:"waiting",orderNo:h.orderNo,history:history.filter(x=>x.id!==id),updatedAt:Date.now(),kiosk:k,lastAction:"payment-undone"});}
async function loadHistory(k,id){const o=orders[k]||emptyOrder(),h=historyFor(k).find(x=>x.id===id);if(!h){alert("해당 주문 기록을 찾을 수 없습니다.");return;}if(itemCount(o)&&!confirm("현재 주문을 이전 주문으로 덮어쓸까요? 현재 주문은 기록에 보존되지 않습니다."))return;await saveOrder(k,{...o,items:{...(h.items||{})},total:Number(h.total||0),status:"waiting",orderNo:null,status:"waiting",updatedAt:Date.now(),kiosk:k,lastAction:"history-loaded"});}
async function pay(k){await completePayment(k);}


let rtcConfig={iceServers:[{urls:"stun:stun.relay.metered.ca:80"}]};
async function loadRtcConfig(){
 try{
  const response=await fetch("https://two5withcoding.onrender.com/turn-credentials",{cache:"no-store"});
  if(!response.ok)throw new Error("TURN 자격 증명 서버 HTTP "+response.status);
  const data=await response.json();
  if(!Array.isArray(data.iceServers)||!data.iceServers.length)throw new Error("iceServers 응답이 비어 있습니다.");
  rtcConfig={iceServers:data.iceServers};
  console.info("Metered TURN 설정을 불러왔습니다.");
 }catch(e){
  console.warn("TURN 설정을 불러오지 못했습니다. STUN 연결을 시도합니다.",e);
 }
}
function rtcSignalDoc(k){return doc(db,"webrtcRooms","kiosk-"+k);}
function rtcCandidateCollection(k,side){return collection(db,"webrtcRooms","kiosk-"+k,side+"Candidates");}
function rtcStatus(text){const a=document.getElementById("rtcStatus");if(a)a.textContent=text;const b=document.getElementById("rtcHostStatus");if(b)b.textContent=text;}
function sendRtc(k,message){if(rtcDisabled.has(k))return;const ch=rtcChannels[k];if(ch&&ch.readyState==="open"){try{ch.send(JSON.stringify(message));}catch(e){useFirebaseOnly(k,e);}}}
function attachChannel(k,ch){if(rtcDisabled.has(k)){try{ch.close();}catch(_){}return;}rtcChannels[k]=ch;ch.onopen=()=>{if(rtcDisabled.has(k))return;clearTimeout(rtcTimers[k]);rtcStatus((language==="en"?"WebRTC connected · Kiosk ":"WebRTC P2P 연결됨 · ")+k+(language==="en"?"":"번 키오스크"));const o=orders[k];if(o)sendRtc(k,{type:"order",order:o});};ch.onclose=()=>{if(rtcChannels[k]===ch)delete rtcChannels[k];useFirebaseOnly(k,"data channel closed");};ch.onmessage=e=>{if(rtcDisabled.has(k))return;try{const msg=JSON.parse(e.data);if(msg.type!=="order"||!msg.order)return;orders[k]={...emptyOrder(),...msg.order};if(role==="host")renderHost();else renderClient(orders[k]);}catch(err){console.warn("Invalid WebRTC message",err);}};}
async function addIceCandidates(pc,k,side){const unsub=onSnapshot(rtcCandidateCollection(k,side),snap=>{snap.docChanges().forEach(async change=>{if(change.type!=="added")return;try{await pc.addIceCandidate(new RTCIceCandidate(change.doc.data().candidate));}catch(e){console.warn("ICE candidate skipped",e);}});},e=>console.warn("ICE listener",e));rtcListeners.push(unsub);}
async function startClientRtc(k){
 if(rtcDisabled.has(k))return;watchRtcTimeout(k);
 try{
  await loadRtcConfig();
  if(rtcDisabled.has(k))return;
  const pc=new RTCPeerConnection(rtcConfig);rtcPeers[k]=pc;
  pc.onconnectionstatechange=()=>{if(rtcDisabled.has(k))return;if(pc.connectionState==="connected"){clearTimeout(rtcTimers[k]);rtcStatus((language==="en"?"WebRTC connected · Kiosk ":"WebRTC P2P 연결됨 · ")+k+(language==="en"?"":"번 키오스크"));}else if(["failed","closed"].includes(pc.connectionState))useFirebaseOnly(k,pc.connectionState);else if(pc.connectionState==="disconnected"){setTimeout(()=>{if(!rtcDisabled.has(k)&&rtcPeers[k]?.connectionState==="disconnected")useFirebaseOnly(k,"disconnected");},3000);}};
  pc.onicecandidate=e=>{if(e.candidate)addDoc(rtcCandidateCollection(k,"client"),{candidate:e.candidate.toJSON(),createdAt:Date.now()}).catch(err=>console.warn("ICE write",err));};
  const ch=pc.createDataChannel("orders");attachChannel(k,ch);
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);
  await setDoc(rtcSignalDoc(k),{offer:{type:offer.type,sdp:offer.sdp},answer:null,updatedAt:Date.now()},{merge:true});
  const unsub=onSnapshot(rtcSignalDoc(k),async snap=>{const data=snap.data();if(!data?.answer||pc.currentRemoteDescription)return;try{await pc.setRemoteDescription(new RTCSessionDescription(data.answer));}catch(e){console.warn("Set answer failed",e);}});
  rtcListeners.push(unsub);await addIceCandidates(pc,k,"host");
 }catch(e){console.warn("WebRTC client setup failed; switching to Firebase-only mode",e);useFirebaseOnly(k,e);}
}
async function startHostRtc(k){
 if(rtcDisabled.has(k))return;
 await loadRtcConfig();
 const unsub=onSnapshot(rtcSignalDoc(k),async snap=>{
  if(rtcDisabled.has(k))return;const data=snap.data();if(!data?.offer)return;
  watchRtcTimeout(k);
  const signature=data.offer.sdp;if(rtcSeenOffers[k]===signature)return;rtcSeenOffers[k]=signature;
  try{
   const pc=new RTCPeerConnection(rtcConfig);rtcPeers[k]=pc;
   pc.onconnectionstatechange=()=>{if(rtcDisabled.has(k))return;if(pc.connectionState==="connected"){clearTimeout(rtcTimers[k]);rtcStatus((language==="en"?"WebRTC connected · Kiosk ":"WebRTC P2P 연결됨 · 키오스크 ")+k);}else if(["failed","closed"].includes(pc.connectionState))useFirebaseOnly(k,pc.connectionState);else if(pc.connectionState==="disconnected"){setTimeout(()=>{if(!rtcDisabled.has(k)&&rtcPeers[k]?.connectionState==="disconnected")useFirebaseOnly(k,"disconnected");},3000);}};
   pc.onicecandidate=e=>{if(e.candidate)addDoc(rtcCandidateCollection(k,"host"),{candidate:e.candidate.toJSON(),createdAt:Date.now()}).catch(err=>console.warn("ICE write",err));};
   pc.ondatachannel=e=>attachChannel(k,e.channel);
   await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
   const answer=await pc.createAnswer();await pc.setLocalDescription(answer);
   await setDoc(rtcSignalDoc(k),{answer:{type:answer.type,sdp:answer.sdp},updatedAt:Date.now()},{merge:true});
   await addIceCandidates(pc,k,"client");
  }catch(e){console.warn("WebRTC host setup failed; switching to Firebase-only mode",e);useFirebaseOnly(k,e);}
 });
 rtcListeners.push(unsub);
}

function start(){
 document.getElementById("roleScreen").style.display="none";
 if(role==="client"){
  document.getElementById("clientApp").style.display="block";
  document.getElementById("clientKiosk").textContent=kiosks[0]+"번 키오스크";
  renderMenus();
  const k=kiosks[0];
  startClientRtc(k);
  try{
   onSnapshot(orderDoc(k),s=>{orders[k]=s.exists()?{...emptyOrder(),...s.data()}:emptyOrder();renderClient(orders[k]);},e=>{console.error("ORDER_LISTEN_ERROR",e);alert("주문 데이터 읽기 실패: "+e.message);});
  }catch(e){console.error("ORDER_LISTEN_SETUP_ERROR",e);alert("주문 연결 실패: "+e.message);}
 }else{
  document.getElementById("hostApp").style.display="block";
  document.getElementById("hostInfo").textContent="관리 키오스크: "+kiosks.join(", ")+"번";
  kiosks.forEach(k=>{
   startHostRtc(k);
   try{
    onSnapshot(orderDoc(k),s=>{orders[k]=s.exists()?{...emptyOrder(),...s.data()}:emptyOrder();renderHost();},e=>{console.error("ORDER_LISTEN_ERROR",e);alert("주문 데이터 읽기 실패: "+e.message);});
   }catch(e){console.error("ORDER_LISTEN_SETUP_ERROR",e);alert("주문 연결 실패: "+e.message);}
  });
 }
 try{
  onSnapshot(availabilityDoc,s=>{soldOut={m1:false,m2:false,m3:false,...(s.exists()?s.data().soldOut||{}:{})};if(role==="client"){renderMenus();renderClient(orders[kiosks[0]]||emptyOrder());}},e=>console.error("MENU_AVAILABILITY_LISTEN_ERROR",e));
 }catch(e){console.error("MENU_AVAILABILITY_SETUP_ERROR",e);}
}

try{const saved=JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null");if(saved&&["client","host"].includes(saved.role)&&Array.isArray(saved.kiosks)){selectedRole=saved.role;selectedKiosks=saved.kiosks.filter(k=>["1","2","3","4"].includes(k)).slice(0,4);if(selectedRole==="client")selectedKiosks=[selectedKiosks[0]||"1"];updateSetupUI();if(saved.unlocked&&selectedKiosks.length){role=selectedRole;kiosks=[...selectedKiosks];start();}}}catch(e){console.warn("설정 복원 실패",e);}
</script>
<script>
(()=>{const select=document.getElementById('languageSelect');const map={"축제 주문 시스템":"Festival Ordering","사용할 화면과 키오스크를 선택하세요.":"Choose a screen and kiosk to use.","화면 선택":"Screen","주문 키오스크":"Order Kiosk","관리자":"Admin","키오스크 번호":"Kiosk Number","주문할 키오스크 번호를 하나 선택하세요.":"Select one kiosk for placing orders.","관리할 키오스크를 선택하세요. 여러 개를 선택할 수 있습니다.":"Select one or more kiosks to manage.","비밀번호 입력":"Enter password","시작하기":"Start","비밀번호가 올바르지 않습니다.":"Incorrect password.","키오스크 번호를 하나 이상 선택하세요.":"Select at least one kiosk.","주문하기":"Place an Order","담은 메뉴":"Your Order","아직 담은 메뉴가 없습니다.":"Your order is empty.","총 매출":"Total Sales","주문 관리자":"Order Admin","이전 주문 기록 · 불러오기로 키오스크에 복원":"Order History · Load an order to restore it to a kiosk","키오스크":"Kiosk","주문 번호":"Order #","메뉴":"Items","수량":"Qty","금액":"Amount","상태":"Status","처리":"Actions","아이스티":"Iced Tea","레몬에이드":"Lemonade","아이스 초코":"Iced Chocolate","음료 교환권 사용":"Drink Voucher","원하는 음료 1개를 선택하세요":"Choose one drink to redeem.","구매 시 코딩과 함께라면 부스 무료 체험 가능":"Includes a free trial at the Coding Together booth.","품절":"SOLD OUT","교환할 음료":"Choose a drink","결제 완료":"Paid","결제 취소":"Payment Cancelled","결제 대기":"Awaiting Payment","주문 없음":"No order","메뉴 없음":"No items","불러오기":"Load","결제 완료 취소":"Undo Payment","아직 이전 주문 기록이 없습니다.":"No previous orders.","WebRTC 연결 준비 중...":"Preparing WebRTC connection...","P2P 연결 준비 중...":"Preparing P2P connection...","원":" KRW","번 키오스크":" Kiosk","번":""};const originals=new WeakMap();let busy=false;function translateText(s){if(select.value!=='en')return s;let out=s;for(const [ko,en] of Object.entries(map))out=out.split(ko).join(en);return out;}window.__festivalTranslate=translateText;const nativeAlert=window.alert.bind(window);const nativeConfirm=window.confirm.bind(window);window.alert=message=>nativeAlert(translateText(String(message)));window.confirm=message=>nativeConfirm(translateText(String(message)));function walk(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(!originals.has(n))originals.set(n,n.nodeValue);const original=originals.get(n);const next=select.value==='en'?translateText(original):original;if(n.nodeValue!==next)n.nodeValue=next;}root.querySelectorAll?.('[placeholder]').forEach(el=>{if(!el.dataset.originalPlaceholder)el.dataset.originalPlaceholder=el.placeholder;el.placeholder=select.value==='en'?translateText(el.dataset.originalPlaceholder):el.dataset.originalPlaceholder;});}select.addEventListener('change',()=>{busy=true;document.documentElement.lang=select.value;walk(document.body);busy=false;try{localStorage.setItem('festivalOrderLanguage',select.value)}catch(e){}});try{select.value=localStorage.getItem('festivalOrderLanguage')==='en'?'en':'ko'}catch(e){}document.documentElement.lang=select.value;walk(document.body);new MutationObserver(records=>{if(busy)return;busy=true;for(const r of records){if(r.type==='childList')r.addedNodes.forEach(n=>{if(n.nodeType===Node.TEXT_NODE){if(!originals.has(n))originals.set(n,n.nodeValue);n.nodeValue=translateText(originals.get(n));}else if(n.nodeType===Node.ELEMENT_NODE)walk(n);});else if(r.type==='characterData'){if(!originals.has(r.target))originals.set(r.target,r.target.nodeValue);const translated=translateText(originals.get(r.target));if(r.target.nodeValue!==translated)r.target.nodeValue=translated;}}busy=false;}).observe(document.body,{subtree:true,childList:true,characterData:true});})();
