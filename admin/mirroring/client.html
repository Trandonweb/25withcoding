<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화면 공유</title>
<style>
body{margin:0;font-family:sans-serif;background:#f0f0f0;display:flex;justify-content:center;align-items:center;height:100vh}.box{width:90%;max-width:600px;background:#fff;padding:30px;border-radius:20px;box-shadow:0 0 20px rgba(0,0,0,.1)}h1{margin-top:0;color:#27ae60}.status{margin-top:20px;font-size:18px;font-weight:bold}.warn{margin-top:25px;color:#c0392b;line-height:1.7}
</style>
</head>
<body>
<div class="box">
<h1>화면 공유</h1>
<p>관리자에게 화면을 공유하고 있습니다.<br>이 창을 닫지 마세요.</p>
<div class="status" id="status">연결 준비중...</div>
<div class="warn">- 창을 닫으면 화면 공유가 종료됩니다.<br>- 새로고침하지 마세요.<br>- 뒤로가기 하지 마세요.<br>- 공유를 직접 종료하면 관리자에게 즉시 표시됩니다.</div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import{getFirestore,doc,getDoc,updateDoc,onSnapshot,arrayUnion,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",authDomain:"points2026-f5e50.firebaseapp.com",projectId:"points2026-f5e50",storageBucket:"points2026-f5e50.firebasestorage.app",messagingSenderId:"248724251417",appId:"1:248724251417:web:02d85cdc4addac98069b88"};
const db=getFirestore(initializeApp(firebaseConfig));
const userId=localStorage.getItem("userId");
if(!userId){alert("로그인이 필요합니다.");location.href="/";throw new Error("로그인 필요")}
const userRef=doc(db,"users",userId),statusEl=document.getElementById("status");
const setStatus=t=>statusEl.innerText=t;
const rtcConfig={iceServers:[{urls:"stun:stun.relay.metered.ca:80"},{urls:"turn:standard.relay.metered.ca:80",username:"cc29acf1a234c7ca3a5ae899",credential:"CW4V8T/D1+AnGnED"},{urls:"turn:standard.relay.metered.ca:80?transport=tcp",username:"cc29acf1a234c7ca3a5ae899",credential:"CW4V8T/D1+AnGnED"},{urls:"turn:standard.relay.metered.ca:443",username:"cc29acf1a234c7ca3a5ae899",credential:"CW4V8T/D1+AnGnED"},{urls:"turns:standard.relay.metered.ca:443?transport=tcp",username:"cc29acf1a234c7ca3a5ae899",credential:"CW4V8T/D1+AnGnED"}]};
let pc=null,stream=null,unsubscribe=null,heartbeatTimer=null,reconnectTimer=null,disconnected=false,reconnecting=false,settingAnswer=false,currentSessionId=null,currentSharingState=false;
const addedAdminCandidates=new Set();
function cleanupPeerConnection(){if(pc){try{pc.close()}catch(e){}pc=null}}
async function fullDisconnect(){if(disconnected)return;disconnected=true;if(reconnectTimer)clearTimeout(reconnectTimer);if(heartbeatTimer)clearInterval(heartbeatTimer);if(unsubscribe)unsubscribe();if(stream)stream.getTracks().forEach(t=>t.stop());cleanupPeerConnection();try{await updateDoc(userRef,{online:false,state:"offline",mode:"firebase",sharing:false,sharingStartedAt:null,sessionId:null,clientOffer:null,adminAnswer:null,clientCandidates:[],adminCandidates:[],updatedAt:serverTimestamp()})}catch(e){console.warn(e)}}
window.addEventListener("pagehide",()=>{fullDisconnect()});
async function initWebRTC(){try{setStatus("화면 선택창을 열고 있습니다...");stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:10},audio:false});const track=stream.getVideoTracks()[0];if(!track){throw new Error("화면 공유 트랙을 가져오지 못했습니다.")}track.onended=async()=>{await fullDisconnect();alert("화면 공유가 종료되었습니다.");location.href="/"};await executeNegotiation()}catch(e){console.error(e);if(!disconnected)alert(e.message)}}
function triggerRestart(delayMs){if(disconnected||reconnecting||reconnectTimer)return;reconnectTimer=setTimeout(()=>{reconnectTimer=null;executeRestartNegotiation()},delayMs)}
async function executeNegotiation(isRestart=false){if(disconnected)return;reconnecting=true;try{cleanupPeerConnection();setStatus(isRestart?"재연결 시도 중...":"WEBRTC 연결 준비중...");pc=new RTCPeerConnection(rtcConfig);stream.getTracks().forEach(track=>pc.addTrack(track,stream));pc.onconnectionstatechange=()=>{const state=pc.connectionState;console.log("[CLIENT] Connection State:",state);if(state==="failed")executeRestartNegotiation();else if(state==="disconnected")triggerRestart(5000);else if(state==="connected"){if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null}setStatus(currentSharingState?"관리자에게 화면을 전송 중입니다.":"관리자와 연결됨. 공유 대기 중")}}};pc.onicecandidate=async e=>{if(!e.candidate)return;try{await updateDoc(userRef,{clientCandidates:arrayUnion(e.candidate.toJSON()),updatedAt:serverTimestamp()})}catch(e){console.error(e)}};currentSessionId="sess_"+Math.random().toString(36).substring(2)+Date.now();addedAdminCandidates.clear();await updateDoc(userRef,{online:true,state:"connecting",mode:"webrtc",sharing:false,sessionId:currentSessionId,clientOffer:null,clientCandidates:[],adminAnswer:null,adminCandidates:[],updatedAt:serverTimestamp()});const offer=await pc.createOffer();await pc.setLocalDescription(offer);await updateDoc(userRef,{clientOffer:{type:offer.type,sdp:offer.sdp,sessionId:currentSessionId},updatedAt:serverTimestamp()});setStatus("관리자 연결을 기다리는 중...")}catch(e){console.error("[CLIENT] 협상 에러:",e)}finally{reconnecting=false}}
async function executeRestartNegotiation(){await executeNegotiation(true)}
function watchAdminSignal(){unsubscribe=onSnapshot(userRef,async snap=>{if(!snap.exists()||!pc)return;const data=snap.data();if(data.sessionId!==currentSessionId)return;currentSharingState=data.sharing===true;if(currentSharingState&&pc.connectionState==="connected")setStatus("관리자에게 화면을 전송 중입니다.");else setStatus(pc.connectionState==="connected"?"관리자와 연결됨. 공유 대기 중":"관리자 연결 중...");if(data.adminAnswer&&!pc.currentRemoteDescription&&!settingAnswer){if(!data.adminAnswer.sessionId||data.adminAnswer.sessionId!==currentSessionId)return;settingAnswer=true;try{await pc.setRemoteDescription(new RTCSessionDescription({type:data.adminAnswer.type,sdp:data.adminAnswer.sdp}))}catch(e){console.error("[CLIENT] 원격 디스크립션 설정 에러:",e)}finally{settingAnswer=false}}if(Array.isArray(data.adminCandidates)&&pc.currentRemoteDescription)for(const candidate of data.adminCandidates){const key=JSON.stringify(candidate);if(addedAdminCandidates.has(key))continue;try{await pc.addIceCandidate(new RTCIceCandidate(candidate));addedAdminCandidates.add(key)}catch(e){console.warn("[CLIENT] Candidate 추가 실패:",e)}}})}
(async()=>{const snap=await getDoc(userRef);if(!snap.exists()){alert("계정을 찾을 수 없습니다.");location.href="/";return}heartbeatTimer=setInterval(async()=>{if(disconnected||!pc)return;try{const connected=pc.connectionState==="connected";await updateDoc(userRef,{online:true,state:connected?"live":"connecting",mode:"webrtc",sharing:connected&&currentSharingState,sessionId:currentSessionId,updatedAt:serverTimestamp()})}catch(e){console.error("Heartbeat 에러:",e)}},10000);await initWebRTC();watchAdminSignal()})();
</script>
</body>
</html>
