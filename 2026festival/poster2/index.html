<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S A N C A F E | 축제 카페 포스터</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;600;700;900&display=swap');
*{box-sizing:border-box}body{margin:0;background:#e8e2d5;color:#172f58;font-family:'Noto Sans KR',sans-serif}
.tools{position:sticky;top:0;z-index:2;display:flex;justify-content:center;padding:12px;background:#f6f0e4ee}
button{border:0;background:#183967;color:#fff;border-radius:999px;padding:10px 18px;font-weight:900;cursor:pointer}
.poster{width:210mm;height:297mm;margin:18px auto;padding:13mm;position:relative;overflow:hidden;background:#f8f1e3;border:2px solid #183967;box-shadow:0 12px 35px #18396722}
.poster:before{content:"";position:absolute;right:-25mm;top:34mm;width:100mm;height:100mm;border-radius:50%;background:#ffd16d;opacity:.6}
.poster:after{content:"";position:absolute;left:-25mm;bottom:30mm;width:80mm;height:80mm;border-radius:50%;border:2px dashed #e86c43;opacity:.7}
.content{height:100%;position:relative;z-index:1;display:flex;flex-direction:column}
.kicker{font-size:10pt;letter-spacing:.2em;font-weight:900;color:#e45d3d}
h1{font-family:'Black Han Sans',sans-serif;font-size:34pt;line-height:1.12;letter-spacing:.01em;margin:5mm 0 2mm;color:#183967}
.sub{font-family:'Nanum Pen Script',cursive;font-size:22pt;color:#e45d3d;transform:rotate(-2deg);margin-bottom:3mm}
.art{height:60mm;display:flex;align-items:center;justify-content:center;gap:10mm}
.lemon{width:34mm;height:34mm;border-radius:50%;background:#ffd44f;border:4px solid #e9a82d;position:relative;transform:rotate(-13deg);box-shadow:0 6px 0 #18396715}
.lemon:before{content:"";position:absolute;inset:6mm;border:2px solid #fff4be;border-radius:50%;background:repeating-conic-gradient(#fff4be 0 9deg,#ffd44f 9deg 45deg)}
.glass{width:35mm;height:44mm;border:3px solid #183967;border-radius:4mm 4mm 10mm 10mm;background:linear-gradient(180deg,#ffffffaa 0 18%,#ffcf4c 19% 100%);position:relative;transform:rotate(4deg)}
.glass:before{content:"";position:absolute;top:-8mm;left:15mm;width:2mm;height:20mm;background:#e45d3d;transform:rotate(12deg);border-radius:3px}
.glass:after{content:"S";position:absolute;inset:12mm 0 auto;text-align:center;font-family:'Black Han Sans';font-size:20pt;color:#183967}
.offer{background:#e65e3d;color:#fffaf0;padding:5mm;border-radius:2mm;text-align:center;transform:rotate(-1deg);box-shadow:5px 5px 0 #183967}
.offer small{font-size:10pt;letter-spacing:.13em;font-weight:900}
.offer strong{display:block;font-family:'Black Han Sans',sans-serif;font-size:27pt;line-height:1.2;margin:2mm 0}
.offer strong span{color:#ffdf73}
.offer p{font-size:9pt;font-weight:700;margin:0;color:#fff3d8}
.menu-title{margin:8mm 0 3mm;font-size:10pt;letter-spacing:.15em;font-weight:900;color:#e45d3d}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
.item{background:#fffaf0;border:1px solid #183967;border-radius:50% 50% 3mm 3mm;text-align:center;padding:5mm 1mm 4mm}
.item b{display:block;font-size:10.5pt;white-space:nowrap}
.item span{display:block;color:#e45d3d;font-size:8pt;font-weight:900;margin-top:2mm}
.price{margin:7mm 0 0;text-align:center;font-family:'Black Han Sans',sans-serif;font-size:22pt;color:#183967}
.price small{font-family:'Noto Sans KR',sans-serif;font-size:9pt}
.note{text-align:center;font-size:9pt;font-weight:700;margin-top:2mm}
.footer{margin-top:auto;padding-top:4mm;border-top:2px solid #183967;display:flex;justify-content:space-between;font-size:8pt;font-weight:900;letter-spacing:.04em}
.footer span:last-child{color:#e45d3d}
@page{size:A4;margin:0}@media print{body{background:#fff}.tools{display:none}.poster{margin:0;border:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width:700px){.poster{width:100%;height:auto;min-height:141vw;margin:0;padding:6vw}.content{min-height:125vw}h1{font-size:9vw}.offer strong{font-size:7vw}.art{height:22vw}.lemon,.glass{transform:scale(.75)}}
</style>
</head>
<body>
<div class="tools"><button onclick="window.print()">A4 포스터 인쇄 / PDF 저장</button></div>
<main class="poster"><div class="content">
<div class="kicker">A LITTLE CAFE IN YOUR FESTIVAL</div>
<h1>S A N C A F E</h1>
<div class="sub">오늘 축제, 한 잔의 여유.</div>
<div class="art"><div class="lemon"></div><div class="glass"></div></div>
<section class="offer">
<small>ONE DRINK, ONE MORE SMILE</small>
<strong>하나 사면<br><span>반대쪽은 공짜!</span></strong>
<p>코딩과 함께라면 부스에서 구매해도 같은 혜택!</p>
</section>
<div class="menu-title">TODAY'S MENU / 오늘의 메뉴</div>
<div class="menu">
<div class="item"><b>아이스티</b><span>ICE TEA</span></div>
<div class="item"><b>레몬에이드</b><span>LEMON ADE</span></div>
<div class="item"><b>초코라테</b><span>CHOCO LATTE</span></div>
</div>
<div class="price">1,500원 <small>/ 한 잔</small></div>
<div class="note">두 부스를 오가며 즐기는 축제 한정 혜택</div>
<div class="footer"><span>코딩과 함께라면 × S A N C A F E</span><span>SEE YOU AT THE FESTIVAL!</span></div>
</div></main>
</body></html>
