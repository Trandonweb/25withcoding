ginPath();ctx.arc(-o.r*.25,-o.r*.1,o.r*.09,0,Math.PI*2);ctx.arc(o.r*.35,-o.r*.1,o.r*.09,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#172033';ctx.beginPath();ctx.moveTo(-o.r*.18,o.r*.25);ctx.quadraticCurveTo(0,o.r*.43,o.r*.2,o.r*.25);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 20px Malgun Gothic';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.clicks,0,o.r*.55);ctx.restore()}function healDraw(h){ctx.save();let p=Math.sin(h.pulse)*4;ctx.translate(h.x,h.y);ctx.shadowBlur=28;ctx.shadowColor=C.g;ctx.fillStyle='rgba(57,255,154,.22)';ctx.beginPath();ctx.arc(0,0,h.r+9+p,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=C.g;ctx.beginPath();ctx.arc(0,0,h.r,0,6.28);ctx.fill();ctx.fillStyle=C.b;ctx.fillRect(-5,-14,10,28);ctx.fillRect(-14,-5,28,10);ctx.strokeStyle=C.w;ctx.lineWidth=3;ctx.stroke();ctx.restore()}
function bulletDraw(b){ctx.save();ctx.shadowBlur=18;ctx.shadowColor=b.color;ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.28);ctx.fill();ctx.restore()}
function bossPathDraw(){if(!boss||bossNo<2||bossNo>4)return;ctx.save();ctx.globalAlpha=.28;ctx.lineWidth=3;ctx.setLineDash([10,9]);ctx.strokeStyle=bossNo===2?C.bl:bossNo===3?C.y:C.o;if(bossNo===2){let p=boss.r+35,t=155,b=H-85;ctx.strokeRect(p,t,W-2*p,b-t)}else if(bossNo===3){ctx.beginPath();ctx.moveTo(boss.r+35,190);ctx.lineTo(W-boss.r-35,190);ctx.moveTo(boss.r+35,H-80);ctx.lineTo(W-boss.r-35,H-80);ctx.stroke()}else{ctx.beginPath();ctx.arc(W/2,H/2,175,0,Math.PI*2);ctx.stroke()}ctx.setLineDash([]);ctx.globalAlpha=1;if(bossNo===2){ctx.fillStyle=C.bl;ctx.font='bold 18px Malgun Gothic';ctx.textAlign='center';ctx.fillText('BOSS 2 · 사각형 이동',W/2,145)}else if(bossNo===3){ctx.fillStyle=C.y;ctx.font='bold 18px Malgun Gothic';ctx.textAlign='center';ctx.fillText(boss.moveMode==='vertical'?'BOSS 3 · 상하 이동':'BOSS 3 · 좌우 이동',W/2,145)}else{ctx.fillStyle=C.o;ctx.font='bold 18px Malgun Gothic';ctx.textAlign='center';ctx.fillText('BOSS 4 · 원형 이동',W/2,145)}ctx.restore()}
function bossDraw(){if(!boss)return;bossPathDraw();let bc=['#3498ff','#39e66b','#ffe34d','#ff982e','#ff4057'][bossNo-1];ctx.save();ctx.translate(boss.x,boss.y);ctx.shadowBlur=28;ctx.shadowColor=bc;ctx.strokeStyle='#24112f';ctx.lineWidth=12;ctx.lineCap='round';for(let s of [-1,1])for(let k=0;k<3;k++){let yy=(k-1)*boss.r*.48;ctx.beginPath();ctx.moveTo(s*boss.r*.58,yy);ctx.lineTo(s*(boss.r*.95),yy-12);ctx.lineTo(s*(boss.r*1.08),yy+5);ctx.stroke()}ctx.fillStyle=bc;ctx.strokeStyle='#24112f';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(0,8,boss.r*.82,boss.r*.78,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=bossNo===5?'#8d142c':'#33134c';ctx.beginPath();ctx.ellipse(0,-boss.r*.18,boss.r*.62,boss.r*.55,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=bc;ctx.strokeStyle='#24112f';ctx.lineWidth=5;for(let s of [-1,1]){ctx.beginPath();ctx.moveTo(s*boss.r*.38,-boss.r*.48);ctx.lineTo(s*boss.r*.68,-boss.r*.95);ctx.lineTo(s*boss.r*.72,-boss.r*.45);ctx.closePath();ctx.fill();ctx.stroke()}ctx.fillStyle='#fff5cf';ctx.beginPath();ctx.ellipse(-boss.r*.25,-boss.r*.2,boss.r*.17,boss.r*.2,-.2,0,Math.PI*2);ctx.ellipse(boss.r*.25,-boss.r*.2,boss.r*.17,boss.r*.2,.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff3d5a';ctx.beginPath();ctx.arc(-boss.r*.22,-boss.r*.18,boss.r*.09,0,Math.PI*2);ctx.arc(boss.r*.28,-boss.r*.18,boss.r*.09,0,Math.PI*2);ctx.fill();ctx.fillStyle='#190d20';ctx.beginPath();ctx.ellipse(0,boss.r*.23,boss.r*.3,boss.r*.18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*boss.r*.15,boss.r*.16);ctx.lineTo(i*boss.r*.15+5,boss.r*.29);ctx.lineTo(i*boss.r*.15-5,boss.r*.29);ctx.closePath();ctx.fill()}ctx.restore();let bw=400,bh=22,bx=boss.x-bw/2,by=boss.y-boss.r-42;ctx.fillStyle='#161b29';ctx.fillRect(bx,by,bw,bh);ctx.fillStyle=bc;ctx.fillRect(bx,by,bw*boss.hp/boss.max,bh);ctx.strokeStyle=C.w;ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);ctx.fillStyle=C.w;ctx.font='bold 20px Malgun Gothic';ctx.textAlign='center';ctx.fillText(`${bossNo===5?'FINAL BOSS':'BOSS '+bossNo}  HP ${boss.hp}/${boss.max}`,boss.x,by-10)}function hud(){ctx.fillStyle='rgba(7,12,22,.88)';ctx.fillRect(18,18,390,112);ctx.strokeStyle='rgba(85,231,255,.35)';ctx.strokeRect(18,18,390,112);ctx.textAlign='left';ctx.fillStyle=C.w;ctx.font='bold 25px Malgun Gothic';ctx.fillText(`SCORE  ${score}`,34,53);ctx.fillStyle=wave>=4?C.r:C.y;ctx.font='bold 22px Malgun Gothic';ctx.fillText(`WAVE ${wave}/5  ${state==='PLAY'?Math.ceil((900-waveTime)/60)+'s':bossNo===5?'FINAL BOSS':'BOSS FIGHT'}`,34,92);ctx.fillStyle=C.w;ctx.font='bold 18px Malgun Gothic';ctx.textAlign='right';ctx.fillText(`SERVER HP  ${lives}/7`,W-25,78);ctx.fillStyle=soundEnabled?C.g:C.r;ctx.font='bold 15px Malgun Gothic';ctx.fillText(`SOUND ${soundEnabled?'ON':'OFF'} · V`,W-25,100);for(let i=0;i<7;i++){let x=W-237+i*31;ctx.fillStyle=i<lives?C.r:'#242b39';ctx.fillRect(x,28,27,31);ctx.strokeStyle=i<lives?'#ff7185':'#394153';ctx.strokeRect(x,28,27,31)}}
function effects(){particles.forEach(p=>{ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.28);ctx.fill()});rings.forEach(r=>{ctx.globalAlpha=r.life/22;ctx.strokeStyle=r.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.28);ctx.stroke()});texts.forEach(t=>{ctx.globalAlpha=t.life/55;ctx.fillStyle=t.color;ctx.font='bold 22px Malgun Gothic';ctx.textAlign='center';ctx.fillText(t.t,t.x,t.y)});ctx.globalAlpha=1}
function story(lines,title){background();ctx.fillStyle='rgba(9,14,25,.95)';ctx.beginPath();ctx.roundRect(55,70,W-110,H-140,22);ctx.fill();ctx.strokeStyle='rgba(85,231,255,.55)';ctx.lineWidth=2;ctx.stroke();ctx.textAlign='left';ctx.fillStyle=C.c;ctx.font='bold 34px Malgun Gothic';ctx.fillText(title,95,140);ctx.font='25px Malgun Gothic';lines.forEach((s,i)=>{ctx.fillStyle=i===lines.length-1?C.y:C.w;ctx.fillText(s,95,210+i*72)})}
function end(){ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=state==='WIN'?C.g:C.r;ctx.font='bold 70px Malgun Gothic';ctx.fillText(state==='WIN'?'VICTORY!':'GAME OVER',W/2,310);ctx.fillStyle=C.w;ctx.font='29px Malgun Gothic';ctx.fillText(state==='WIN'?'5개의 웨이브와 모든 보스를 돌파했습니다!':'서버가 파괴되었습니다...',W/2,375);ctx.font='23px Malgun Gothic';ctx.fillText(`최종 점수 ${score}  |  R: 다시 시작  M: 메뉴`,W/2,450)}
canvas.addEventListener('mousemove',e=>{let r=canvas.getBoundingClientRect();mouseX=(e.clientX-r.left)*W/r.width;mouseY=(e.clientY-r.top)*H/r.height});canvas.addEventListener('mousedown',e=>{if(e.button!==0)return;if(state==='START'&&mouseX>=360&&mouseX<=640&&mouseY>=430&&mouseY<=505){playSound('start');startMusic();reset();state='STORY';return}if(state!=='PLAY'&&state!=='BOSS')return;if(state==='BOSS'&&boss&&Math.hypot(boss.x-mouseX,boss.y-mouseY)<boss.r){boss.hp--;score+=50;playSound('attack');particlesAt(boss.x,boss.y,C.p,18,4);ring(boss.x,boss.y,C.p);shake=5;if(boss.hp<=0){playSound(bossNo>=5?'win':'clear');score+=500+bossNo*150;particlesAt(boss.x,boss.y,C.g,70,7);bullets=[];obstacles=[];if(bossNo>=5)state='WIN';else{wave++;state='BOSS_CLEAR'}}return}for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i];if(Math.hypot(o.x-mouseX,o.y-mouseY)<o.r){o.clicks--;score+=o.clicks<=0?100:10;playSound('hit');particlesAt(o.x,o.y,mobs[o.max].color,8,2.5);ring(o.x,o.y,mobs[o.max].color);if(o.clicks<=0)obstacles.splice(i,1);break}}});
window.addEventListener('keydown',e=>{keys.add(e.code);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)||e.code.startsWith('Key'))e.preventDefault();if(e.code==='KeyV'){soundEnabled=!soundEnabled;if(soundEnabled){playSound('start');startMusic()}else{stopMusic()}}if(e.code==='Space'){if(state==='STORY')beginWave();else if(state==='BOSS_CLEAR')beginWave()}if((state==='OVER'||state==='WIN')&&e.code==='KeyR'){reset();state='STORY'}if((state==='OVER'||state==='WIN')&&e.code==='KeyM')state='START'});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());
function render(){ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);if(state==='START'){background();ctx.textAlign='center';ctx.shadowBlur=25;ctx.shadowColor=C.g;ctx.fillStyle=C.g;ctx.font='bold 60px Malgun Gothic';ctx.fillText('BUG OFF!',W/2,245);ctx.shadowBlur=0;ctx.fillStyle=C.w;ctx.font='29px Malgun Gothic';ctx.fillText('5개의 웨이브와 점점 강해지는 보스를 돌파하세요!',W/2,315);ctx.fillText('WASD / 방향키 이동 · 마우스 클릭 공격',W/2,355);ctx.fillStyle=C.g;ctx.font='23px Malgun Gothic';ctx.fillText('💚 회복 아이템을 먹으면 HP +3',W/2,395);ctx.fillStyle='rgba(57,255,154,.12)';ctx.beginPath();ctx.roundRect(360,430,280,75,16);ctx.fill();ctx.strokeStyle=C.g;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=C.g;ctx.font='bold 31px Malgun Gothic';ctx.fillText('GAME START',W/2,477)}else if(state==='STORY')story(['버그 바이러스가 5단계로 서버를 침공하기 시작했다!','1보스는 기존 패턴을 유지한다.','2보스는 맵 가장자리를 따라 사각형으로 이동한다.','3보스는 좌우 이동 후 랜덤한 시간에 상하 이동으로 전환한다.','4보스는 맵 중앙을 중심으로 원을 그리며 이동한다!','[스페이스바를 누르면 1웨이브 시작]'],'SYSTEM ALERT');else if(state==='BOSS_CLEAR')story([`${bossNo===5?'FINAL BOSS':'BOSS '+bossNo} 격파!`,`다음 목표: WAVE ${wave} → ${wave===5?'FINAL BOSS':'BOSS '+wave}`,wave===4?'4웨이브: 등장 속도 증가 + 다양한 적!':wave===5?'5웨이브: 최강 적이 등장하지만 등장량은 제한됩니다!':'더 빠르고 강한 버그가 등장합니다!','💚 회복 아이템으로 HP를 관리하세요!','[스페이스바를 눌러 다음 웨이브]'],'WAVE CLEAR');else if(state==='PLAY'||state==='BOSS'){background();items.forEach(healDraw);obstacles.forEach(mobDraw);bullets.forEach(bulletDraw);if(state==='BOSS')bossDraw();playerDraw();hud();effects()}else{background();playerDraw();hud();effects();end()}ctx.restore();if(flash){ctx.fillStyle=`rgba(255,60,80,${flash/40})`;ctx.fillRect(0,0,W,H)}requestAnimationFrame(loop)}function loop(){update();render()}requestAnimationFrame(loop);
</script></body></html>
