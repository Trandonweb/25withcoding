<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#27ae60">
  <title>계정 복구 | 코딩과 함께라면</title>
  <style>
    :root{--bg:#f0f0f0;--card:#fff;--text:#171717;--muted:#666;--primary:#27ae60;--border:#dfe7e2;--field:#f8fafc}
    body.dark{--bg:#121212;--card:#1e1e1e;--text:#f5f5f5;--muted:#aaa;--border:#383838;--field:#2a2a2a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font-family:'Malgun Gothic',Arial,sans-serif}
    .card{width:min(100%,420px);padding:30px;border:1px solid var(--border);border-radius:22px;background:var(--card);box-shadow:0 8px 30px #0000000d}
    h1{margin:0 0 8px;font-size:22px}h2{margin:0 0 22px;color:var(--muted);font-size:14px;font-weight:400}
    p{color:var(--muted);font-size:13px;line-height:1.7}
    label{display:block;margin:15px 0 6px;font-size:13px;font-weight:700}
    input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;background:var(--field);color:var(--text);font-size:15px}
    input:focus{outline:2px solid color-mix(in srgb,var(--primary) 35%,transparent);border-color:var(--primary)}
    button{width:100%;min-height:46px;margin-top:14px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .secondary{display:block;margin-top:18px;text-align:center;color:var(--muted);font-size:13px;text-decoration:none}
    .secondary:hover{text-decoration:underline}
    .status{min-height:22px;margin-top:12px;color:var(--primary);font-size:13px;line-height:1.6;overflow-wrap:anywhere}
    .hidden{display:none!important}
    .notice{padding:12px;border-radius:12px;background:var(--bg);font-size:13px;line-height:1.6}
  </style>
</head>
<body>
  <main class="card">
    <h1>코딩과 함께라면</h1>
    <h2 id="subtitle">계정 복구</h2>

    <section id="resetPanel" class="hidden">
      <p>학번을 입력하면 인증된 복구 이메일이 등록된 경우에만 비밀번호 재설정 링크를 보냅니다. 계정 존재 여부는 화면에 표시하지 않습니다.</p>
      <form id="resetForm">
        <label for="studentId">학번</label>
        <input id="studentId" inputmode="numeric" autocomplete="username" maxlength="5" pattern="[0-9]{5}" placeholder="학번 5자리" required>
        <button id="resetButton" type="submit">재설정 링크 받기</button>
      </form>
      <div id="resetStatus" class="status" role="status" aria-live="polite"></div>
    </section>

    <section id="verifyPanel" class="hidden">
      <p>로그인한 계정에 실제 이메일을 등록하면, 나중에 비밀번호를 잊었을 때 복구 링크를 받을 수 있습니다. 인증 메일은 일반 텍스트로 전송됩니다.</p>
      <div class="notice" id="accountLabel"></div>
      <form id="emailForm">
        <label for="recoveryEmail">복구 이메일</label>
        <input id="recoveryEmail" type="email" autocomplete="email" maxlength="254" placeholder="실제로 메일을 받을 수 있는 주소" required>
        <button id="sendCodeButton" type="submit">인증 코드 보내기</button>
      </form>
      <form id="codeForm" class="hidden">
        <label for="verificationCode">이메일 인증 코드</label>
        <input id="verificationCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6자리 코드" required>
        <button id="verifyButton" type="submit">이메일 인증 및 등록</button>
      </form>
      <div id="verifyStatus" class="status" role="status" aria-live="polite"></div>
    </section>

    <section id="loginRequired" class="hidden">
      <p>복구 이메일을 등록하려면 먼저 학번으로 로그인해야 합니다.</p>
      <a class="secondary" href="/signin">로그인으로 돌아가기</a>
    </section>

    <a class="secondary" href="/signin">로그인으로 돌아가기</a>
  </main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",
  authDomain: "points2026-f5e50.firebaseapp.com",
  projectId: "points2026-f5e50",
  storageBucket: "points2026-f5e50.firebasestorage.app",
  messagingSenderId: "248724251417",
  appId: "1:248724251417:web:02d85cdc4addac98069b88"
};
// Keep the existing project configuration local to this file; never add service secrets here.
const auth = getAuth(initializeApp(firebaseConfig));
async function post(path, body, token) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const response = await fetch(path, { method: "POST", headers, body: JSON.stringify(body) });
  let data = {};
  try { data = await response.json(); } catch {}
  if (!response.ok) throw new Error(data.error || "request_failed");
  return data;
}
const resetPanel = document.getElementById("resetPanel");
const verifyPanel = document.getElementById("verifyPanel");
const loginRequired = document.getElementById("loginRequired");
const resetForm = document.getElementById("resetForm");
const emailForm = document.getElementById("emailForm");
const codeForm = document.getElementById("codeForm");
const resetStatus = document.getElementById("resetStatus");
const verifyStatus = document.getElementById("verifyStatus");
let signedInUser = null;
let verifiedStudentId = "";
let pendingEmail = "";

const savedSettings = (() => { try { return JSON.parse(localStorage.getItem("coding_with_ramen_settings") || "{}"); } catch { return {}; } })();
document.body.classList.toggle("dark", Boolean(savedSettings.darkMode));
if (typeof savedSettings.primaryColor === "string" && /^#[0-9a-f]{6}$/i.test(savedSettings.primaryColor)) {
  document.documentElement.style.setProperty("--primary", savedSettings.primaryColor);
}

onAuthStateChanged(auth, user => {
  signedInUser = user;
  const match = (user?.email || "").match(/^(\d{5})@auth\.25withcoding\.kr$/i);
  if (user && match) {
    verifiedStudentId = match[1];
    resetPanel.classList.add("hidden");
    loginRequired.classList.add("hidden");
    verifyPanel.classList.remove("hidden");
    document.getElementById("accountLabel").textContent = "로그인 계정: " + verifiedStudentId;
  } else if (user) {
    resetPanel.classList.add("hidden");
    verifyPanel.classList.add("hidden");
    loginRequired.classList.remove("hidden");
  } else {
    verifyPanel.classList.add("hidden");
    loginRequired.classList.add("hidden");
    resetPanel.classList.remove("hidden");
  }
});

emailForm.addEventListener("submit", async event => {
  event.preventDefault();
  if (!signedInUser || !verifiedStudentId) return;
  const email = document.getElementById("recoveryEmail").value.trim().toLowerCase();
  const button = document.getElementById("sendCodeButton");
  button.disabled = true;
  verifyStatus.textContent = "인증 메일을 보내는 중...";
  try {
    const token = await signedInUser.getIdToken();
    const result = await post("/api/points2026/recovery/start-verification", { email }, token);
    pendingEmail = email;
    codeForm.classList.remove("hidden");
    verifyStatus.textContent = result.message || "인증 코드를 보냈습니다.";
  } catch (error) {
    verifyStatus.textContent = error.message === "recovery_service_not_configured"
      ? "이메일 복구 서비스 설정이 아직 완료되지 않았습니다."
      : "인증 메일을 보내지 못했습니다. 잠시 후 다시 시도해 주세요.";
  } finally {
    button.disabled = false;
  }
});

codeForm.addEventListener("submit", async event => {
  event.preventDefault();
  if (!signedInUser || !verifiedStudentId || !pendingEmail) return;
  const code = document.getElementById("verificationCode").value.trim();
  const button = document.getElementById("verifyButton");
  button.disabled = true;
  verifyStatus.textContent = "이메일을 확인하는 중...";
  try {
    const token = await signedInUser.getIdToken();
    const result = await post("/api/points2026/recovery/verify-email", { code }, token);
    verifyStatus.textContent = result.message || "복구 이메일을 등록했습니다.";
    codeForm.classList.add("hidden");
    emailForm.reset();
  } catch {
    verifyStatus.textContent = "인증에 실패했거나 코드가 만료되었습니다. 새 코드를 요청해 주세요.";
  } finally {
    button.disabled = false;
  }
});

resetForm.addEventListener("submit", async event => {
  event.preventDefault();
  const studentId = document.getElementById("studentId").value.trim();
  const button = document.getElementById("resetButton");
  button.disabled = true;
  resetStatus.textContent = "요청을 처리하는 중...";
  try {
    const result = await post("/api/points2026/recovery/request-reset", { studentId });
    resetStatus.textContent = result.message || "요청을 처리했습니다. 등록된 이메일과 스팸함을 확인해 주세요.";
  } catch {
    resetStatus.textContent = "현재 요청을 처리할 수 없습니다. 잠시 후 다시 시도해 주세요.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
