    function waitForAuthUser(){
      return new Promise((resolve,reject)=>{
        let unsubscribe=null;
        let unsubscribeAfterAttach=false;
        let settled=false;
        const finish=(callback,value)=>{
          if(settled)return;

      const link=event.target.closest(".main-nav a[href]");
      if(!link)return;
      const user=localStorage.getItem("userId");
      if(!user&&new URL(link.href,location.href).pathname==="/apply"){
        event.preventDefault();showSiteToast("지원 가능한 기간이 아닙니다.");
      }
    });
    let lastRenderedAuthUid=null;
    let authUiUpdateQueue=Promise.resolve();
    function handleAuthUiError(error){
      console.error("[AUTH] 메인 페이지 로그인 UI 초기화 실패",error?.code||error,error);
      const btn=document.getElementById("authBtn"),label=document.getElementById("authLabel"),dropdown=document.getElementById("profileDropdown"),wrap=document.getElementById("profileMenuWrap"),signoutBtn=document.getElementById("signoutBtn");
      if(wrap)wrap.hidden=false;
      if(dropdown){dropdown.hidden=true;dropdown.classList.remove("open")}
      if(btn){btn.setAttribute("aria-label","로그인");btn.onclick=()=>{location.href="/signin/?redirect=%2F"}}
      if(label)label.textContent="로그인";
      if(signoutBtn)signoutBtn.hidden=true;
    }
    onAuthStateChanged(auth,authUser=>{
      const uid=authUser?.uid||null;
      if(uid===lastRenderedAuthUid)return;
      lastRenderedAuthUid=uid;
      authUiUpdateQueue=authUiUpdateQueue.then(async()=>{
        await updateUI(authUser);
        const attendanceBtn=document.getElementById("attendanceBtn");
        if(attendanceBtn)await renderAttendanceButton(attendanceBtn).catch(e=>console.error("[ATTENDANCE] 홈 연동 실패",e));
      }).catch(handleAuthUiError);
    },error=>handleAuthUiError(error));
    const siteHeader=document.getElementById("siteHeader");const navRevealTrigger=document.getElementById("navRevealTrigger");let lastScrollY=window.scrollY,scrollTick=false;
    window.addEventListener("scroll",()=>{if(scrollTick)return;scrollTick=true;requestAnimationFrame(()=>{const currentY=window.scrollY;if(currentY<40)siteHeader.classList.remove("nav-hidden");else siteHeader.classList.add("nav-hidden");lastScrollY=currentY;scrollTick=false})},{passive:true});
    navRevealTrigger.addEventListener("mouseenter",()=>siteHeader.classList.remove("nav-hidden"));
    navRevealTrigger.addEventListener("click",()=>siteHeader.classList.remove("nav-hidden"));
    siteHeader.addEventListener("mouseenter",()=>siteHeader.classList.remove("nav-hidden"));

  </script>
<script>
  // One-time cleanup of legacy homepage caches/workers from older deployments.
  // Keep this scoped to known legacy cache names; never erase unrelated app data.
  const legacyCleanupKey = "25withcoding-legacy-homepage-cleanup-v1";
  if (!localStorage.getItem(legacyCleanupKey)) {
    (async () => {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          const legacyKeys = keys.filter(key => /^coding-club-v[12]$/.test(key));
          await Promise.all(legacyKeys.map(key => caches.delete(key)));
        }
        localStorage.setItem(legacyCleanupKey, "done");
      } catch (error) {
        console.warn("기존 홈페이지 캐시 정리 실패:", error);
      }
    })();
  }
</script>
