<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코딩과 함께라면 2026 Festival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{--primary-color:#27ae60;--secondary-color:#64dd17;--bg-color:#0f0f14;--card-bg:#1c1c25;--text-color:#fff;--muted-color:#aaa;--border-color:rgba(39,174,96,.35);--input-bg:#15151c;--input-border:#3a3a45;--header-text:#fff;--accent-soft:rgba(39,174,96,.18)}
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:var(--bg-color);color:var(--text-color);transition:background .25s,color .25s}.gate-open{overflow:hidden}
#festivalGate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 10% 10%,color-mix(in srgb,var(--primary-color) 25%,transparent),transparent 35%),radial-gradient(circle at 90% 90%,color-mix(in srgb,var(--secondary-color) 22%,transparent),transparent 35%),var(--bg-color)}
.gate-card{width:min(420px,100%);padding:34px 28px;text-align:center;background:var(--card-bg);border:1px solid rgba(255,255,255,.08);border-radius:24px;box-shadow:0 25px 70px rgba(0,0,0,.5)}.gate-icon{font-size:52px;margin-bottom:8px}.gate-title{margin:0;font-family:'Black Han Sans',sans-serif;font-size:32px;background:linear-gradient(90deg,var(--primary-color),var(--secondary-color));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.gate-description{margin:14px 0 24px;color:var(--muted-color);font-size:14px;line-height:1.7}.gate-input{width:100%;height:50px;padding:0 16px;border:1px solid var(--input-border);border-radius:13px;background:var(--input-bg);color:var(--text-color);outline:none;font-size:15px;text-align:center;transition:.2s}.gate-input::placeholder{color:#777}.gate-input:focus{border-color:var(--primary-color);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary-color) 15%,transparent)}.gate-button{width:100%;height:50px;margin-top:10px;border:none;border-radius:13px;background:linear-gradient(90deg,var(--primary-color),var(--secondary-color));color:white;font-size:15px;font-weight:bold;cursor:pointer;transition:.2s}.gate-button:hover{filter:brightness(.92);transform:translateY(-1px)}.gate-button:active{transform:translateY(0)}.gate-button:disabled{opacity:.6;cursor:not-allowed;transform:none}.gate-divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:#666;font-size:12px}.gate-divider:before,.gate-divider:after{content:"";flex:1;height:1px;background:#33333d}.gate-error{min-height:20px;margin-top:10px;color:#ff7070;font-size:13px}.gate-success{min-height:20px;margin-top:10px;color:#7cff91;font-size:13px}.gate-loading{color:var(--muted-color);font-size:14px}.session-box{margin-top:14px;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--primary-color) 8%,var(--card-bg));border:1px solid color-mix(in srgb,var(--primary-color) 25%,transparent);text-align:left}.session-label{display:block;margin-bottom:8px;color:var(--text-color);font-size:13px;font-weight:bold}.session-select{width:100%;height:44px;padding:0 12px;border:1px solid var(--input-border);border-radius:10px;background:var(--input-bg);color:var(--text-color);font-size:14px;outline:none}.session-hint{margin-top:7px;color:var(--muted-color);font-size:11px}.gate-session-area{display:none}.gate-session-area.show{display:block}#festivalGate.hidden{display:none}.home-link{position:fixed;top:18px;left:20px;color:rgba(255,255,255,.75);text-decoration:none;font-size:13px;z-index:1000}.home-link:hover{color:white}
#festivalTimer{position:fixed;top:16px;right:18px;z-index:2000;padding:9px 14px;border-radius:12px;background:rgba(21,21,28,.92);border:1px solid var(--border-color);box-shadow:0 8px 25px rgba(0,0,0,.25);font-size:13px;font-weight:bold;backdrop-filter:blur(8px)}#festivalTimer strong{color:var(--secondary-color);font-family:monospace;font-size:16px;margin-left:5px}.timer-warning{border-color:#ffb74d!important}.timer-warning strong{color:#ffcc80!important}.timer-danger{border-color:#ff5252!important;animation:timerPulse .6s infinite alternate}.timer-danger strong{color:#ff7777!important}@keyframes timerPulse{from{transform:scale(1)}to{transform:scale(1.04)}}
#festivalNotice{position:fixed;left:50%;top:72px;z-index:3000;transform:translate(-50%,-20px);opacity:0;pointer-events:none;width:min(420px,calc(100% - 28px));padding:14px 18px;border-radius:14px;text-align:center;background:var(--card-bg);border:1px solid var(--primary-color);box-shadow:0 15px 40px rgba(0,0,0,.4);transition:.25s;font-size:14px;font-weight:bold}#festivalNotice.show{transform:translate(-50%,0);opacity:1}.notice-danger{border-color:#ff5252!important;color:#ffb0b0}
header{text-align:center;padding:12px 20px;font-family:'Black Han Sans',sans-serif;font-size:30px;background:linear-gradient(90deg,var(--primary-color),var(--secondary-color));color:var(--header-text);box-shadow:0 4px 20px rgba(0,0,0,.3)}.subtitle{text-align:center;padding:10px;color:color-mix(in srgb,var(--primary-color) 55%,white);font-size:14px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:20px}.card{background:var(--card-bg);border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s;display:flex;flex-direction:column;border:1px solid color-mix(in srgb,var(--primary-color) 18%,transparent)}.card:hover{transform:scale(1.03);border-color:color-mix(in srgb,var(--primary-color) 45%,transparent)}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.info{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}.title{font-weight:bold;font-size:18px}.desc{font-size:13px;color:#bbb;height:2.6em;overflow:hidden}.likes{color:var(--secondary-color);margin-top:auto}.like-btn{margin-top:8px;padding:8px;border:none;border-radius:6px;cursor:pointer;background:var(--primary-color);color:white;font-weight:bold}
@media(max-width:768px){.grid{grid-template-columns:1fr}header{font-size:24px}.gate-card{padding:30px 22px}.gate-title{font-size:28px}#festivalTimer{top:10px;right:10px;font-size:11px;padding:7px 10px}#festivalTimer strong{font-size:14px}}
</style>
</head>
<body class="gate-open">
<div id="festivalGate"><div class="gate-card"><div class="gate-icon">🎉</div><h1 class="gate-title">2026 FESTIVAL</h1><div class="gate-description" id="gateDescription">축제 입장 정보를 확인하고 있습니다...</div><div id="guestArea" style="display:none"><button class="gate-button" id="loginButton">로그인하기</button><div class="gate-divider">또는</div><input id="accessCodeInput" class="gate-input" type="text" maxlength="5" placeholder="5자리 축제 이용 코드를 입력하세요" autocomplete="off" autocapitalize="characters" spellcheck="false"><div class="session-box"><label class="session-label" for="accessSessionCount">이번 입장에서 사용할 횟수</label><select id="accessSessionCount" class="session-select"></select><div class="session-hint">1회 = 30분 · 기본값은 1회입니다.</div></div><button class="gate-button" id="accessCodeButton">코드로 입장</button><div class="gate-error" id="gateError"></div></div><div id="memberCodeArea" style="display:none"><input id="memberAccessCodeInput" class="gate-input" type="text" maxlength="5" placeholder="5자리 축제 이용 코드를 입력하세요" autocomplete="off" autocapitalize="characters" spellcheck="false"><div class="session-box"><label class="session-label" for="memberSessionCount">이번 입장에서 사용할 횟수</label><select id="memberSessionCount" class="session-select"></select><div class="session-hint">1회 = 30분 · 기본값은 1회입니다.</div></div><button class="gate-button" id="memberAccessCodeButton">코드로 입장</button><div class="gate-error" id="memberGateError"></div></div><div id="loadingArea" class="gate-loading">확인 중...</div></div></div>
<div id="festivalTimer" style="display:none">남은 시간<strong id="festivalTimerValue">30:00</strong></div><div id="festivalNotice"></div>
<a class="home-link" href="/">Home</a><header>코딩과 함께라면 2026 Festival</header><div class="subtitle" id="subtitle"><div>since 2025</div><div>❤️ 지금까지 0번의 응원이 도착했어요!</div></div><div class="grid" id="grid"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import{getFirestore,collection,onSnapshot,doc,updateDoc,increment,getDoc,runTransaction}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9Q",authDomain:"festivallikes.firebaseapp.com",projectId:"festivallikes",storageBucket:"festivallikes.firebasestorage.app",messagingSenderId:"782245120700",appId:"1:782245120700:web:c61e16313e9ae688e6deb9"};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
const loginFirebaseConfig={apiKey:"AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",authDomain:"points2026-f5e50.firebaseapp.com",projectId:"points2026-f5e50"};
const loginApp=initializeApp(loginFirebaseConfig,"loginApp"),loginDB=getFirestore(loginApp);
const SETTINGS_KEY="coding_with_ramen_settings";
const THEME_COLORS=["#27ae60","#3498db","#e84393","#9b59b6","#e74c3c"];
const THEME_SECONDARY={"#27ae60":"#64dd17","#3498db":"#5dade2","#e84393":"#fd79a8","#9b59b6":"#c39bd3","#e74c3c":"#ff7675"};
const festivalGate=document.getElementById("festivalGate"),guestArea=document.getElementById("guestArea"),memberCodeArea=document.getElementById("memberCodeArea"),loadingArea=document.getElementById("loadingArea"),gateDescription=document.getElementById("gateDescription"),gateError=document.getElementById("gateError"),memberGateError=document.getElementById("memberGateError"),festivalTimer=document.getElementById("festivalTimer"),festivalTimerValue=document.getElementById("festivalTimerValue"),festivalNotice=document.getElementById("festivalNotice"),accessSessionCount=document.getElementById("accessSessionCount"),memberSessionCount=document.getElementById("memberSessionCount");
let timerInterval=null,noticeTimeout=null,adminChallenge=null;
function applyTheme(primary,source="visitor"){primary=String(primary||"").toLowerCase();if(!THEME_COLORS.includes(primary))primary=THEME_COLORS[0];const secondary=THEME_SECONDARY[primary]||primary;document.documentElement.style.setProperty("--primary-color",primary);document.documentElement.style.setProperty("--secondary-color",secondary);document.documentElement.style.setProperty("--border-color",`color-mix(in srgb, ${primary} 35%, transparent)`);document.documentElement.style.setProperty("--accent-soft",`color-mix(in srgb, ${primary} 18%, transparent)`);document.body.dataset.themeSource=source}
function applyVisitorRandomTheme(){const primary=THEME_COLORS[Math.floor(Math.random()*THEME_COLORS.length)];applyTheme(primary,"visitor")}
async function applyMemberTheme(userId){try{const saved=localStorage.getItem(SETTINGS_KEY);let settings={};if(saved){try{settings=JSON.parse(saved)||{}}catch(e){console.warn("저장된 컬러 테마를 읽지 못했습니다.",e)}}let primary=settings.primaryColor;const snap=await getDoc(doc(loginDB,"users",userId));if(snap.exists()){const firebaseSettings=snap.data().settings||{};primary=firebaseSettings.primaryColor||primary;if(primary){settings={...settings,...firebaseSettings};localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}}if(!THEME_COLORS.includes(String(primary||"").toLowerCase()))primary="#27ae60";applyTheme(primary,"member")}catch(error){console.error("부원 컬러 테마 적용 실패:",error);applyTheme("#27ae60","member-fallback")}}
function enterFestival(){festivalGate.classList.add("hidden");document.body.classList.remove("gate-open")}
function showGuestGate(){applyVisitorRandomTheme();loadingArea.style.display="none";guestArea.style.display="block";memberCodeArea.style.display="none";gateDescription.textContent="축제에 입장하려면 로그인하거나 이용 코드를 입력해주세요."}
function showCodeGate(){applyVisitorRandomTheme();loadingArea.style.display="none";guestArea.style.display="none";memberCodeArea.style.display="block";gateDescription.textContent="축제 이용 코드를 입력해주세요."}
function fillSessionOptions(select,max=5){select.innerHTML="";const count=Math.max(1,Math.min(5,Number(max)||5));for(let i=1;i<=count;i++){const option=document.createElement("option");option.value=String(i);option.textContent=`${i}회 (${i*30}분)`;if(i===1)option.selected=true;select.appendChild(option)}}
fillSessionOptions(accessSessionCount);fillSessionOptions(memberSessionCount);
function formatRemaining(ms){const total=Math.max(0,Math.ceil(ms/1000));return`${String(Math.floor(total/60)).padStart(2,"0")}:${String(total%60).padStart(2,"0")}`}
function showNotice(message,danger=false){clearTimeout(noticeTimeout);festivalNotice.textContent=message;festivalNotice.className=danger?"show notice-danger":"show";noticeTimeout=setTimeout(()=>festivalNotice.classList.remove("show"),5000)}
function startFestivalTimer(expiresAt){clearInterval(timerInterval);festivalTimer.style.display="block";let warnedFive=false,warnedTen=false;const tick=()=>{const remaining=expiresAt-Date.now();if(remaining<=0){clearInterval(timerInterval);sessionStorage.removeItem("festival2026CodeAccess");sessionStorage.removeItem("festival2026AccessCode");sessionStorage.removeItem("festival2026AccessExpiresAt");festivalTimer.style.display="none";showNotice("이용 시간이 종료되었습니다. 축제에서 나갑니다.",true);setTimeout(()=>location.reload(),1200);return}festivalTimerValue.textContent=formatRemaining(remaining);festivalTimer.classList.toggle("timer-warning",remaining<=300000&&remaining>10000);festivalTimer.classList.toggle("timer-danger",remaining<=10000);if(remaining<=300000&&!warnedFive){warnedFive=true;showNotice("⏰ 축제 이용 시간이 5분 남았습니다.")}if(remaining<=10000&&!warnedTen){warnedTen=true;showNotice("⚠️ 이용 시간이 10초 남았습니다.",true)}};tick();timerInterval=setInterval(tick,250)}
function startNewCodeSession(sessionCount=1){const count=Math.max(1,Math.min(5,Number(sessionCount)||1));const expiresAt=Date.now()+count*30*60*1000;sessionStorage.setItem("festival2026AccessExpiresAt",String(expiresAt));sessionStorage.setItem("festival2026AccessSessions",String(count));startFestivalTimer(expiresAt)}
function restoreCodeSession(){const expiresAt=Number(sessionStorage.getItem("festival2026AccessExpiresAt"));if(!Number.isFinite(expiresAt)||expiresAt<=Date.now()){sessionStorage.removeItem("festival2026CodeAccess");sessionStorage.removeItem("festival2026AccessCode");sessionStorage.removeItem("festival2026AccessExpiresAt");sessionStorage.removeItem("festival2026AccessSessions");return false}startFestivalTimer(expiresAt);return true}
function randomAdminChallenge(){const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ";const letter=alphabet[Math.floor(Math.random()*alphabet.length)];const first=Math.floor(Math.random()*5)+1;const second=Math.floor(Math.random()*5)+1;const answer=alphabet[(alphabet.indexOf(letter)-(first+second)+26)%26];adminChallenge={answer,expiresAt:Date.now()+120000};return`${letter}${first}${second}`}
function adminTime(){const challenge=randomAdminChallenge();console.log(challenge);return challenge}
function adminAnswer(answer){if(!adminChallenge||adminChallenge.expiresAt<Date.now()){console.warn("관리자 인증 문제가 만료되었습니다. admin.time()을 다시 실행하세요.");return false}const value=String(answer||"").trim().toUpperCase();if(value!==adminChallenge.answer){console.warn("관리자 인증 실패");return false}window.__festivalAdminActive=true;adminChallenge=null;console.log("관리자 모드 활성화");return true}
function adminClose(){window.__festivalAdminActive=false;adminChallenge=null;console.log("관리자 모드 종료")}
function adminReset(minutes){if(!window.__festivalAdminActive){console.warn("관리자 모드가 활성화되어 있지 않습니다.");return false}const value=Number(minutes);if(!Number.isFinite(value)||value<0){console.warn("시간은 0 이상의 숫자(분)여야 합니다.");return false}const expiresAt=Date.now()+value*60*1000;sessionStorage.setItem("festival2026AccessExpiresAt",String(expiresAt));sessionStorage.setItem("festival2026CodeAccess","true");sessionStorage.setItem("festival2026AccessSessions",String(Math.ceil(value/30)));startFestivalTimer(expiresAt);enterFestival();console.log(`축제 이용 시간이 ${value}분으로 재설정되었습니다.`);return true}
window.admin={time:adminTime,answer:adminAnswer,close:adminClose};window.time={reset:adminReset,remaining:()=>{const expiresAt=Number(sessionStorage.getItem("festival2026AccessExpiresAt"));const remaining=Number.isFinite(expiresAt)?Math.max(0,expiresAt-Date.now()):0;console.log(formatRemaining(remaining));return remaining}};
document.getElementById("loginButton").addEventListener("click",()=>{const redirect=encodeURIComponent("/2026festival/");location.href=`/signin/?redirect=${redirect}`});
function normalizeCode(value){return String(value||"").trim().toUpperCase()}
async function redeemAccessCode(rawCode,requestedSessions=1){const code=normalizeCode(rawCode);const sessions=Math.max(1,Math.min(5,Number(requestedSessions)||1));if(!/^[A-Z0-9]{5}$/.test(code))return{success:false,message:"축제 이용 코드는 정확히 5자리입니다."};const codeRef=doc(db,"accesscodes",code);try{const result=await runTransaction(db,async transaction=>{const snap=await transaction.get(codeRef);if(!snap.exists())throw new Error("CODE_NOT_FOUND");const data=snap.data();if(data.active===false)throw new Error("CODE_INACTIVE");const max=Number(data.max);const used=Number(data.used||0);if(!Number.isInteger(max)||max<1||max>5)throw new Error("CODE_INVALID");const remaining=max-used;if(used>=max)throw new Error("CODE_EXHAUSTED");if(sessions>remaining)throw new Error("CODE_NOT_ENOUGH");transaction.update(codeRef,{used:used+sessions});return{people:max,used:used+sessions,max,remaining:remaining-sessions}});sessionStorage.setItem("festival2026CodeAccess","true");sessionStorage.setItem("festival2026AccessCode",code);startNewCodeSession(sessions);return{success:true,message:`${sessions}회 이용 (${sessions*30}분)으로 입장했습니다.`,...result}}catch(error){console.error("이용 코드 처리 오류:",error);switch(error.message){case"CODE_NOT_FOUND":return{success:false,message:"존재하지 않는 이용 코드입니다."};case"CODE_INACTIVE":return{success:false,message:"사용할 수 없는 이용 코드입니다."};case"CODE_EXHAUSTED":return{success:false,message:"이 코드는 모두 사용되었습니다."};case"CODE_NOT_ENOUGH":return{success:false,message:"선택한 횟수만큼 사용할 수 있는 이용권이 남아있지 않습니다."};case"CODE_INVALID":return{success:false,message:"올바르지 않은 이용 코드입니다."};default:return{success:false,message:"코드 확인 중 오류가 발생했습니다."}}}}
async function updateSessionChoices(rawCode,select){const code=normalizeCode(rawCode);if(!/^[A-Z0-9]{5}$/.test(code))return;if(!select)return;try{const snap=await getDoc(doc(db,"accesscodes",code));if(!snap.exists())return;const data=snap.data();if(data.active===false)return;const remaining=Math.max(0,Number(data.max||0)-Number(data.used||0));if(remaining>0)fillSessionOptions(select,remaining)}catch(error){console.error("남은 이용 횟수 확인 실패:",error)}}
function bindCodeInput(input,select){input.addEventListener("input",()=>{input.value=input.value.toUpperCase();if(input.value.length===5)updateSessionChoices(input.value,select)})}
bindCodeInput(document.getElementById("accessCodeInput"),accessSessionCount);bindCodeInput(document.getElementById("memberAccessCodeInput"),memberSessionCount);
async function handleCode(input,select,button,errorElement){errorElement.className="gate-error";errorElement.textContent="";button.disabled=true;button.textContent="확인 중...";try{const result=await redeemAccessCode(input.value,select.value);if(result.success){errorElement.className="gate-success";errorElement.textContent=result.message;setTimeout(enterFestival,450)}else errorElement.textContent=result.message}catch(error){console.error("입장 처리 오류:",error);errorElement.textContent="입장 처리 중 오류가 발생했습니다."}finally{button.disabled=false;button.textContent="코드로 입장"}}
document.getElementById("accessCodeButton").addEventListener("click",()=>handleCode(document.getElementById("accessCodeInput"),accessSessionCount,document.getElementById("accessCodeButton"),gateError));
document.getElementById("memberAccessCodeButton").addEventListener("click",()=>handleCode(document.getElementById("memberAccessCodeInput"),memberSessionCount,document.getElementById("memberAccessCodeButton"),memberGateError));
for(const id of ["accessCodeInput","memberAccessCodeInput"])document.getElementById(id).addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById(id==="accessCodeInput"?"accessCodeButton":"memberAccessCodeButton").click()});
async function checkFestivalAccess(){if(sessionStorage.getItem("festival2026CodeAccess")==="true"){applyVisitorRandomTheme();if(restoreCodeSession()){enterFestival();return}}const userId=localStorage.getItem("userId");if(!userId){showGuestGate();return}try{const userSnap=await getDoc(doc(loginDB,"users",userId));if(userSnap.exists()){await applyMemberTheme(userId);enterFestival();return}showCodeGate()}catch(error){console.error("로그인 상태 확인 실패:",error);showCodeGate();gateDescription.textContent="로그인 상태를 확인하지 못했습니다. 이용 코드를 입력해주세요."}}
checkFestivalAccess();
const grid=document.getElementById("grid");
function loadProjects(){onSnapshot(collection(db,"projects"),snap=>{grid.innerHTML="";const projects=[];snap.forEach(docSnap=>projects.push({id:docSnap.id,...docSnap.data()}));projects.sort((a,b)=>(b.likes||0)-(a.likes||0));const totalLikes=projects.reduce((sum,p)=>sum+(p.likes||0),0);document.getElementById("subtitle").innerHTML=`<div>since 2025</div><div>❤️ 지금까지 ${totalLikes.toLocaleString()}번의 응원이 도착했어요</div>`;projects.forEach((p,index)=>{const medal=index===0?"🥇 ":index===1?"🥈 ":index===2?"🥉 ":"";const card=document.createElement("div");card.className="card";card.innerHTML=`<img src="${p.thum}" alt="${p.id}"><div class="info"><div class="title">${medal}${p.id}</div><div class="desc">${p.detail}</div><div class="likes">❤️ ${p.likes||0}</div><button class="like-btn">응원하기</button></div>`;card.onclick=()=>{location.href=p.url};card.querySelector(".like-btn").onclick=async event=>{event.stopPropagation();try{await updateDoc(doc(db,"projects",p.id),{likes:increment(1)})}catch(error){console.error("응원 처리 실패:",error)}};grid.appendChild(card)})},error=>console.error("작품 목록 불러오기 실패:",error))}
loadProjects();
</script>
</body>
</html>
