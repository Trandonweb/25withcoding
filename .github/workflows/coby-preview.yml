name: COBY Preview Artifact

# IMPORTANT: This workflow must never deploy to GitHub Pages.
# The Pages deployment is the production 25withcoding.kr site; publishing ./AI
# here replaces the entire site root with COBY and makes every visitor see COBY.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Include 2026 pages in the COBY preview package
        run: |
          mkdir -p AI/2026
          cp -R 2026/. AI/2026/

      - name: Upload COBY preview artifact (not GitHub Pages)
        uses: actions/upload-artifact@v4
        with:
          name: coby-preview
          path: ./AI
          if-no-files-found: error
          retention-days: 7
