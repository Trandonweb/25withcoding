<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인디 보스 레이드 - 격전!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui">
        <div>보스 HP: <span id="boss-hp">30000</span></div>
        <div>시간: <span id="live-timer">0.00초</span></div>
        <div>플레이어 HP: <span id="player-hp">3</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- Ready? GO! 레이어 -->
        <div id="countdown-overlay">
            <div id="countdown-text">Ready?</div>
        </div>

        <!-- 1. 시작 화면 -->
        <div id="start-screen" class="screen">
            <div class="title" style="color: #ff4757;">MEGA BOSS RAID</div>
            <div class="subtitle">
                보스 체력: <b>30,000</b><br>
                마우스 좌클릭을 유지하면 연속으로 발사됩니다.<br>
                가장 빠른 기록으로 보스를 처치하고 <b>일격 코인</b>을 차지하세요!
            </div>
            <button class="btn btn-start" onclick="initiateGameFlow()">보스전 시작</button>
        </div>

        <!-- 2. 승리 결과 화면 -->
        <div id="victory-screen" class="screen">
            <div class="title" style="color: #2ed573;">🎉 VICTORY! 🎉</div>
            <div class="subtitle" id="clear-time-result" style="font-size: 24px; color: #fff; margin-bottom: 20px;">
                클리어 시간: 0.00초
            </div>
            
            <div class="red-coin-box">
                <div class="red-coin"></div>
                <div class="reward-text">[일격 코인]을 획득했습니다!</div>
            </div>

            <button class="btn btn-restart" onclick="resetToTitle()">타이틀로 돌아가기</button>
        </div>

        <!-- 3. 게임 오버 화면 -->
        <div id="gameover-screen" class="screen">
            <div class="title" style="color: #ff4757;">GAME OVER</div>
            <div class="subtitle">체력이 다 달아 쓰러졌습니다.</div>
            <button class="btn btn-restart" onclick="resetToTitle()">다시 시도하기</button>
        </div>
    </div>

    <p style="color: #aaa; margin-top: 15px;">
        이동: <b>WASD / 방향키</b> | 공격: <b>마우스 좌클릭 드래그(연사)</b>
    </p>

    <script src="script.js"></script>
</body>
</html>
