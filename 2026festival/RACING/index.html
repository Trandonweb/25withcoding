<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RACING | 2026 Festival</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0d;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}.box{padding:9px 13px;border-radius:12px;background:#0009;backdrop-filter:blur(5px);font-weight:800}.box small{display:block;font-size:10px;opacity:.6}.box b{font-size:20px}.menu{position:fixed;inset:0;display:grid;place-items:center;background:#0008;z-index:5}.card{text-align:center;background:#07100bd9;padding:34px 40px;border-radius:25px;box-shadow:0 20px 70px #000}.card h1{font-size:58px;margin:0 0 8px}.card p{opacity:.7;line-height:1.7}.btn{border:0;border-radius:12px;padding:14px 30px;background:#20b85d;color:white;font-size:17px;font-weight:800}.hidden{display:none}.controls{position:fixed;bottom:20px;left:20px;right:20px;display:flex;justify-content:space-between;z-index:4;pointer-events:none}.group{display:flex;gap:10px}.ctrl{pointer-events:auto;width:68px;height:60px;border:1px solid #ffffff44;border-radius:16px;background:#0008;color:white;font-size:24px;font-weight:900}.pedal{font-size:13px;width:75px}@media(min-width:700px){.controls{opacity:.5}}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="box"><small>SPEED</small><b><span id="spd">0</span> km/h</b></div><div class="box"><small>DISTANCE</small><b><span id="dist">0.00</span> km</b></div></div><div id="menu" class="menu"><div class="card"><h1>RACING</h1><p>운전석에서 직접 달려보세요.<br>W/↑ 가속 · S/↓ 브레이크 · A/D 조향 · SPACE 부스터</p><button class="btn" onclick="start()">RACE START</button></div></div><div id="over" class="menu hidden"><div class="card"><h1>CRASH!</h1><p>주행 거리 <b id="final">0</b> km</p><button class="btn" onclick="start()">RESTART</button></div></div><div class="controls"><div class="group"><button class="ctrl" id="L">◀</button><button class="ctrl" id="R">▶</button></div><div class="group"><button class="ctrl pedal" id="B">BRAKE</button><button class="ctrl pedal" id="A">ACCEL</button><button class="ctrl" id="N">⚡</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,dpr,run=false,last=0,dist=0,velocity=0,px=0,steer=0,boost=0,road=0,spawnTimer=0,cars=[];const keys={};function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;function start(){run=true;dist=0;velocity=0;px=0;steer=0;boost=0;road=0;spawnTimer=.8;cars=[];menu.classList.add('hidden');over.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}function crash(){run=false;final.textContent=dist.toFixed(2);over.classList.remove('hidden')}function key(e,v){keys[e.code]=v;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));function hold(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[k]=false}hold('L','ArrowLeft');hold('R','ArrowRight');hold('A','ArrowUp');hold('B','ArrowDown');hold('N','Space');function makeCar(){cars.push({x:(Math.random()*2-1)*.72,z:.03,v:.55+Math.random()*.25,col:['#e74c3c','#3498db','#f1c40f','#9b59b6'][Math.floor(Math.random()*4)]})}function roadPoint(z){let p=clamp(z,0,1),w=lerp(W*.08,W*.94,p),cx=W/2+Math.sin(road*.65+p*3)*W*.055*p;return{cx,w,y:lerp(H*.38,H*.88,p)}}function drawCar(xx,yy,s,col){let w=62*s,h=110*s;x.save();x.translate(xx,yy);x.fillStyle='#0008';x.beginPath();x.ellipse(0,5,w*.65,8*s,0,0,7);x.fill();x.fillStyle='#111';x.fillRect(-w*.55,-h*.15,w*.16,h*.45);x.fillRect(w*.39,-h*.15,w*.16,h*.45);x.fillStyle=col;x.beginPath();x.roundRect(-w/2,-h/2,w,h,8*s);x.fill();x.fillStyle='#1b2930';x.beginPath();x.roundRect(-w*.34,-h*.34,w*.68,h*.25,5*s);x.fill();x.fillStyle='#fff0ad';x.fillRect(-w*.34,h*.23,w*.18,5*s);x.fillRect(w*.16,h*.23,w*.18,5*s);x.restore()}function drawWorld(){let sky=x.createLinearGradient(0,0,0,H*.55);sky.addColorStop(0,'#142d45');sky.addColorStop(1,'#83a98d');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#254c2e';x.fillRect(0,H*.38,W,H*.62);for(let i=0;i<14;i++){let z=((i/14+road*.8)%1),p=roadPoint(z),s=.15+z*.85,side=i%2?-1:1,xx=p.cx+side*(p.w/2+35*s);x.fillStyle='#163522';x.beginPath();x.arc(xx,p.y-30*s,20*s,0,7);x.fill();x.fillStyle='#8e9a80';x.fillRect(xx-2*s,p.y-18*s,4*s,18*s)}let near=roadPoint(1),far=roadPoint(0);x.fillStyle='#292b2c';x.beginPath();x.moveTo(far.cx-far.w/2,far.y);x.lineTo(far.cx+far.w/2,far.y);x.lineTo(near.cx+near.w/2,near.y);x.lineTo(near.cx-near.w/2,near.y);x.closePath();x.fill();x.strokeStyle='#f1ead4';x.lineWidth=6;x.beginPath();x.moveTo(far.cx-far.w/2,far.y);x.lineTo(near.cx-near.w/2,near.y);x.moveTo(far.cx+far.w/2,far.y);x.lineTo(near.cx+near.w/2,near.y);x.stroke();x.strokeStyle='#ffffff99';x.lineWidth=4;for(let l=-.33;l<=.33;l+=.66)for(let i=0;i<12;i++){let z=((i/12+road*1.7)%1),z2=Math.min(1,z+.055+z*.045),a=roadPoint(z),b=roadPoint(z2);x.beginPath();x.moveTo(a.cx+a.w*l,a.y);x.lineTo(b.cx+b.w*l,b.y);x.stroke()}cars.slice().sort((a,b)=>a.z-b.z).forEach(q=>{let p=roadPoint(q.z),s=.16+q.z*.95,xx=p.cx+q.x*p.w*.42;drawCar(xx,p.y,s,q.col)});x.fillStyle='#11181a';x.beginPath();x.moveTo(0,H);x.lineTo(0,H*.89);x.quadraticCurveTo(W*.5,H*.76,W,H*.89);x.lineTo(W,H);x.closePath();x.fill();x.strokeStyle='#0a0b0c';x.lineWidth=Math.max(10,W*.018);x.beginPath();x.arc(W*.5,H*.92,Math.min(W,H)*.09,0,Math.PI*2);x.stroke();x.lineWidth=7;x.beginPath();x.moveTo(W*.5,H*.92);x.lineTo(W*.5,H*.99);x.moveTo(W*.5,H*.92);x.lineTo(W*.44,H*.96);x.moveTo(W*.5,H*.92);x.lineTo(W*.56,H*.96);x.stroke();x.fillStyle='#0b1112';x.beginPath();x.moveTo(0,0);x.lineTo(W*.055,0);x.lineTo(W*.13,H*.72);x.lineTo(0,H*.78);x.closePath();x.fill();x.beginPath();x.moveTo(W,0);x.lineTo(W*.945,0);x.lineTo(W*.87,H*.72);x.lineTo(W,H*.78);x.closePath();x.fill()}function loop(t){if(!run)return;let dt=Math.min(.035,(t-last)/1000);last=t;let accel=keys.ArrowUp||keys.KeyW,brake=keys.ArrowDown||keys.KeyS,target=accel?330:205;if(brake)target=70;if(keys.Space||boost>0){boost=1;target+=180}else boost=Math.max(0,boost-dt*2.5);velocity=lerp(velocity,target,1-Math.pow(.0008,dt));let dir=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);steer=lerp(steer,dir,1-Math.pow(.001,dt));px+=steer*dt*(.55+velocity/500);px*=.995;px=clamp(px,-1.05,1.05);road+=velocity*dt/800;dist+=velocity*dt/3600;spawnTimer-=dt;if(spawnTimer<=0){makeCar();spawnTimer=Math.max(.35,.95-velocity/600)}cars.forEach(q=>q.z+=dt*q.v*(.25+velocity/350));cars=cars.filter(q=>q.z<1.08);for(const q of cars)if(q.z>.75&&q.z<.96&&Math.abs(q.x-px)<.24){crash();return}document.getElementById('spd').textContent=Math.round(velocity);document.getElementById('dist').textContent=dist.toFixed(2);drawWorld();requestAnimationFrame(loop)}</script></body></html>
