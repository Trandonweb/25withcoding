<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>탁구 대결 | MINI GAME</title><style>*{box-sizing:border-box}:root{color-scheme:dark;--g:#53e88a}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#17442c,transparent 42%),#050b08;color:#f3fff6;font-family:Arial,'Noto Sans KR',sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(950px,100%)}.top{display:flex;justify-content:space-between;color:#a9c5b2;font-size:12px;letter-spacing:.1em}h1{font-size:clamp(30px,5vw,46px);margin:14px 0 4px}.sub{color:#b8cdbf;line-height:1.7}canvas{display:block;width:100%;height:auto;margin:18px 0;border:1px solid #ffffff20;border-radius:18px;background:#06100a;box-shadow:0 20px 55px #0005}.score{display:flex;justify-content:center;gap:55px;font-size:16px}.score b{display:block;font-size:34px;text-align:center}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}button{border:0;border-radius:12px;padding:12px 18px;background:var(--g);color:#062012;font-weight:800;cursor:pointer}.secondary{background:#ffffff12;color:white;border:1px solid #ffffff20}.hint{color:#a9c5b2;font-size:13px}#message{min-height:26px;margin-top:14px;font-weight:750}.hidden{display:none!important}</style></head><body><main class="wrap"><div class="top"><span>MINI GAME / 08</span><span id="round"></span></div><h1>탁구 대결</h1><div class="sub">공을 받아쳐 상대 코트에 떨어뜨리세요. 먼저 5점을 얻으면 승리합니다.</div><div class="score"><div><span id="leftLabel">플레이어</span><b id="leftScore">0</b></div><div><span id="rightLabel">컴퓨터</span><b id="rightScore">0</b></div></div><canvas id="court" width="900" height="480" aria-label="탁구 게임"></canvas><div class="bar"><button id="start">시작 / 다시 시작</button><button class="secondary" id="done" hidden>결과 확인 →</button><span class="hint" id="controls">W/S 또는 ↑/↓로 패들을 움직이세요.</span></div><div id="message">시작을 눌러 게임하세요.</div></main><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu'};const mode=s.mode||'cpu';document.getElementById('round').textContent=s.round?s.round+'번째 게임':'';if(mode==='local'){leftLabel.textContent='1P';rightLabel.textContent='2P';controls.textContent='1P: W/S · 2P: ↑/↓'}if(mode==='online')message.textContent='온라인 입력 동기화는 아직 연결되지 않아 로컬 플레이만 가능합니다.';
const cv=document.getElementById('court'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;let p1=H/2,p2=H/2,bx=W/2,by=H/2,vx=5,vy=3,score1=0,score2=0,playing=false,over=false,keys=new Set(),raf=0,lastHit=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function serve(dir){bx=W/2;by=H/2;vx=dir*5;vy=(Math.random()-.5)*6;lastHit=0}
function reset(){score1=score2=0;p1=p2=H/2;document.getElementById('leftScore').textContent=document.getElementById('rightScore').textContent='0';over=false;playing=true;document.getElementById('done').hidden=true;document.getElementById('message').textContent='경기 진행 중';serve(Math.random()<.5?-1:1);cancelAnimationFrame(raf);loop()}
function finish(w){if(over)return;over=true;playing=false;document.getElementById('message').textContent=w==='me'?'1P 승리!':mode==='local'?'2P 승리!':'컴퓨터 승리!';localStorage.setItem('miniGameResult',JSON.stringify({game:'탁구 대결',winner:w,me:score1,opp:score2}));document.getElementById('done').hidden=false;window.miniGameSound?.('win')}
function point(player){if(player===1){score1++;leftScore.textContent=score1;window.miniGameSound?.('score')}else{score2++;rightScore.textContent=score2;window.miniGameSound?.('score')}if(score1>=5||score2>=5){finish(score1>score2?'me':'opp');return}serve(player===1?1:-1)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a2114';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff2a';ctx.lineWidth=3;ctx.strokeRect(18,18,W-36,H-36);ctx.setLineDash([12,12]);ctx.beginPath();ctx.moveTo(W/2,18);ctx.lineTo(W/2,H-18);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#53e88a';ctx.fillRect(42,p1-48,13,96);ctx.fillStyle='#ffd477';ctx.fillRect(W-55,p2-48,13,96);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a9c5b2';ctx.font='bold 14px Arial';ctx.fillText('P1',40,42);ctx.textAlign='right';ctx.fillText(mode==='local'?'P2':'CPU',W-40,42);ctx.textAlign='left'}
function loop(){if(!playing){draw();return}if(keys.has('KeyW'))p1-=6;if(keys.has('KeyS'))p1+=6;if(keys.has('ArrowUp'))p2-=6;if(keys.has('ArrowDown'))p2+=6;p1=clamp(p1,68,H-68);if(mode==='cpu'){const diff=by-p2;p2+=clamp(diff*.075,-4.2,4.2)}else p2=clamp(p2,68,H-68);bx+=vx;by+=vy;if(by<30||by>H-30){vy*=-1;window.miniGameSound?.('bounce')}if(bx<67&&bx>45&&Math.abs(by-p1)<61&&vx<0){vx=Math.abs(vx)*1.045;vy+=((by-p1)/60)*2.5;window.miniGameSound?.('hit')}if(bx>W-67&&bx<W-45&&Math.abs(by-p2)<61&&vx>0){vx=-Math.abs(vx)*1.045;vy+=((by-p2)/60)*2.5;window.miniGameSound?.('hit')}if(bx<15)point(2);if(bx>W-15)point(1);vy=clamp(vy,-8,8);draw();raf=requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();keys.add(e.code)});document.addEventListener('keyup',e=>keys.delete(e.code));document.getElementById('start').onclick=reset;document.getElementById('done').onclick=()=>location.href='../index.html';draw();
</script></main><div id="miniSoundPanel" style="position:fixed;right:14px;bottom:14px;z-index:9999"><button id="miniSoundToggle" type="button" aria-pressed="true" style="border:1px solid #ffffff35;border-radius:999px;padding:10px 14px;background:#10251a;color:#effff4;font:700 13px Arial,sans-serif;box-shadow:0 6px 22px #0006;cursor:pointer">🔊 소리 켜짐</button></div><script>(function(){let enabled=localStorage.getItem('miniGameSound')!=='off',audio=null,lastKeySound=0;const btn=document.getElementById('miniSoundToggle');function label(){btn.textContent=enabled?'🔊 소리 켜짐':'🔇 소리 꺼짐';btn.setAttribute('aria-pressed',String(enabled))}function sound(kind='ui'){if(!enabled)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audio=audio||new AC();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const seq=kind==='win'?[523,659,784]:kind==='score'?[660,880]:kind==='hit'?[220,165]:kind==='bounce'?[420]:kind==='jump'?[440,660]:kind==='key'?[330]:[520];seq.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='hit'?'triangle':'sine';o.frequency.setValueAtTime(hz,now+i*.075);g.gain.setValueAtTime(.0001,now+i*.075);g.gain.exponentialRampToValueAtTime(kind==='ui'||kind==='key'?.035:.065,now+i*.075+.012);g.gain.exponentialRampToValueAtTime(.0001,now+i*.075+.11);o.connect(g);g.connect(audio.destination);o.start(now+i*.075);o.stop(now+i*.075+.12)})}catch(e){}}window.miniGameSound=sound;btn.addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('miniGameSound',enabled?'on':'off');label();if(enabled)sound('ui')});document.addEventListener('click',e=>{if(e.target.closest('#miniSoundPanel'))return;if(e.target.closest('button'))sound('ui')},true);document.addEventListener('keydown',e=>{if(e.repeat||!['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code))return;const now=performance.now();if(now-lastKeySound>75){sound('key');lastKeySound=now}},true);label()})();</script></body></html>
