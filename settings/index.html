<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환경 설정 | 코딩과 함께라면</title>
<meta name="theme-color" content="#27ae60">
<style>
:root{--bg:#f0f0f0;--card:#fff;--text:#171717;--muted:#666;--primary:#27ae60;--border:#dfe7e2}
body.dark{--bg:#121212;--card:#1e1e1e;--text:#f5f5f5;--muted:#aaa;--border:#383838}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;transition:background .2s,color .2s}
header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px);border-bottom:1px solid var(--primary);background:var(--card)}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:800;text-decoration:none}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--primary);color:#fff}
.back{color:var(--primary);text-decoration:none;font-size:14px;font-weight:700}
main{width:min(760px,92%);margin:42px auto 70px}.eyebrow{color:var(--primary);font-size:12px;font-weight:800;letter-spacing:2px}h1{margin:10px 0 8px;font-size:clamp(28px,5vw,40px)}.intro{color:var(--muted);line-height:1.7;margin:0 0 28px}
.panel{padding:24px;margin:14px 0;background:var(--card);border:1px solid var(--border);border-radius:20px}.panel h2{font-size:18px;margin:0 0 18px}.setting{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 0;border-top:1px solid var(--border)}.setting:first-of-type{border-top:0}.setting-title{font-weight:750}.setting-desc{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.5}
.switch{position:relative;width:48px;height:27px;flex-shrink:0}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:99px;background:#999;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;border-radius:50%;background:white;transition:.2s}.switch input:checked+.slider{background:var(--primary)}.switch input:checked+.slider:before{transform:translateX(21px)}
.colors{display:flex;gap:10px;flex-wrap:wrap}.color{width:30px;height:30px;border:3px solid var(--card);outline:2px solid transparent;border-radius:50%;cursor:pointer}.color.selected{outline-color:var(--text)}.field{width:100%;margin-top:10px;padding:12px 13px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}.primary-btn{margin-top:14px;padding:12px 16px;border:0;border-radius:10px;background:var(--primary);color:white;font-weight:800;cursor:pointer}.status{min-height:20px;margin-top:10px;color:var(--primary);font-size:13px}.signed-out{padding:18px;border-radius:12px;background:var(--bg);color:var(--muted)}
@media(max-width:520px){header{height:64px;padding:0 4%}.panel{padding:18px}.setting{gap:12px}}
</style>
</head>
<body>
<header><a class="brand" href="/"><span class="logo">&lt;/&gt;</span><span>코딩과 함께라면</span></a><a class="back" href="/">홈으로 돌아가기 ←</a></header>
<main>
<div class="eyebrow">PREFERENCES</div><h1>환경 설정</h1><p class="intro">화면 테마와 계정 환경을 설정할 수 있어요. 설정은 이 브라우저에 저장되며, 로그인한 경우 계정 설정과 동기화됩니다.</p>
<section class="panel"><h2>화면 설정</h2>
<div class="setting"><div><div class="setting-title">다크 모드</div><div class="setting-desc">화면을 어둡게 표시합니다.</div></div><label class="switch"><input id="darkMode" type="checkbox"><span class="slider"></span></label></div>
<div class="setting"><div><div class="setting-title">포인트 컬러</div><div class="setting-desc">사이트의 대표 색상을 선택합니다.</div></div></div>
<div class="colors" aria-label="포인트 컬러 선택">
<button class="color" style="background:#27ae60" data-color="#27ae60" aria-label="초록색"></button><button class="color" style="background:#3498db" data-color="#3498db" aria-label="파란색"></button><button class="color" style="background:#e84393" data-color="#e84393" aria-label="분홍색"></button><button class="color" style="background:#9b59b6" data-color="#9b59b6" aria-label="보라색"></button><button class="color" style="background:#e74c3c" data-color="#e74c3c" aria-label="빨간색"></button>
</div>
<div class="setting"><div><div class="setting-title">로그인 상태 유지</div><div class="setting-desc">브라우저를 다시 열어도 로그인 상태를 유지합니다.</div></div><label class="switch"><input id="keepLogin" type="checkbox"><span class="slider"></span></label></div>
<div id="settingsStatus" class="status" aria-live="polite"></div>
</section>
<section class="panel"><h2>비밀번호 변경</h2><div id="passwordArea"><div class="signed-out">비밀번호를 변경하려면 먼저 로그인해 주세요.</div></div></section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBgOAO72ArW8dO7OSYsTVEQtRHT049U20",authDomain:"points2026-f5e50.firebaseapp.com",projectId:"points2026-f5e50"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);const KEY="coding_with_ramen_settings";
const defaults={darkMode:false,primaryColor:"#27ae60",keepLogin:true};
const user=localStorage.getItem("userId");
function readLocal(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{return {...defaults}}}
function apply(s){document.body.classList.toggle("dark",!!s.darkMode);document.documentElement.style.setProperty("--primary",s.primaryColor||defaults.primaryColor);document.querySelectorAll(".color").forEach(b=>b.classList.toggle("selected",b.dataset.color===(s.primaryColor||defaults.primaryColor)));document.getElementById("darkMode").checked=!!s.darkMode;document.getElementById("keepLogin").checked=!!s.keepLogin}
let settings=readLocal();apply(settings);
async function save(key,value){settings[key]=value;localStorage.setItem(KEY,JSON.stringify(settings));apply(settings);const status=document.getElementById("settingsStatus");status.textContent="설정 저장 중…";if(user){try{await setDoc(doc(db,"users",user),{settings:{[key]:value}},{merge:true});status.textContent="설정이 저장되었습니다."}catch(e){console.error(e);status.textContent="이 기기에는 저장했지만 계정 동기화에 실패했습니다."}}else status.textContent="이 기기에 설정을 저장했습니다."}
document.getElementById("darkMode").addEventListener("change",e=>save("darkMode",e.target.checked));
document.getElementById("keepLogin").addEventListener("change",e=>save("keepLogin",e.target.checked));
document.querySelectorAll(".color").forEach(b=>b.addEventListener("click",()=>save("primaryColor",b.dataset.color)));
if(user){try{const snap=await getDoc(doc(db,"users",user));if(snap.exists()){const remote=snap.data().settings||{};settings={...defaults,...remote};localStorage.setItem(KEY,JSON.stringify(settings));apply(settings)}}catch(e){console.warn("계정 설정 불러오기 실패",e)}}
const area=document.getElementById("passwordArea");
if(user){area.innerHTML='<input id="currentPassword" class="field" type="password" autocomplete="current-password" placeholder="현재 비밀번호"><input id="newPassword" class="field" type="password" autocomplete="new-password" placeholder="새 비밀번호 (6자 이상)"><input id="confirmPassword" class="field" type="password" autocomplete="new-password" placeholder="새 비밀번호 확인"><button id="changePassword" class="primary-btn" type="button">비밀번호 변경</button><div id="passwordStatus" class="status" aria-live="polite"></div>';document.getElementById("changePassword").addEventListener("click",async()=>{const current=document.getElementById("currentPassword").value,next=document.getElementById("newPassword").value,confirm=document.getElementById("confirmPassword").value,status=document.getElementById("passwordStatus"),button=document.getElementById("changePassword");if(!current||!next||!confirm){status.textContent="모든 항목을 입력해 주세요.";return}if(next.length<6){status.textContent="새 비밀번호는 6자 이상이어야 합니다.";return}if(next!==confirm){status.textContent="새 비밀번호가 일치하지 않습니다.";return}button.disabled=true;try{const ref=doc(db,"users",user),snap=await getDoc(ref);if(!snap.exists()||snap.data().password!==current){status.textContent="현재 비밀번호가 올바르지 않습니다.";return}await updateDoc(ref,{password:next});status.textContent="비밀번호가 변경되었습니다.";document.getElementById("currentPassword").value="";document.getElementById("newPassword").value="";document.getElementById("confirmPassword").value=""}catch(e){console.error(e);status.textContent="비밀번호 변경에 실패했습니다."}finally{button.disabled=false}})}
</script>
</body>
</html>
