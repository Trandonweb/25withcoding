<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>화면 공유</title>
<style>
body{margin:0;font-family:sans-serif;background:#f0f0f0;display:flex;justify-content:center;align-items:center;height:100vh;}
.box{width:90%;max-width:600px;background:white;padding:30px;border-radius:20px;box-shadow:0 0 20px rgba(0,0,0,.1);}
h1{margin-top:0;color:#27ae60;}
.status{margin-top:20px;font-size:18px;font-weight:bold;}
.warn{margin-top:25px;color:red;line-height:1.7;}
</style>
</head>
<body>

<div class="box">
<h1>화면 공유 중</h1>
<p>관리자에게 화면을 공유하고 있습니다.<br>이 창을 닫지 마세요.</p>
<div class="status" id="status">연결 준비중...</div>
<div class="warn">
- 창을 닫으면 화면 공유가 종료됩니다.<br>
- 새로고침하지 마세요.<br>
- 뒤로가기 하지 마세요.<br>
- 공유가 종료되면 다시 로그인해야 합니다.
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {getFirestore, doc, getDoc, updateDoc, onSnapshot, arrayUnion, serverTimestamp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig={
    apiKey:"AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",
    authDomain:"points2026-f5e50.firebaseapp.com",
    projectId:"points2026-f5e50",
    storageBucket:"points2026-f5e50.firebasestorage.app",
    messagingSenderId:"248724251417",
    appId:"1:248724251417:web:02d85cdc4addac98069b88"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const userId=localStorage.getItem("userId");

if(!userId){ alert("로그인이 필요합니다."); location.href="/"; }

const userRef=doc(db,"users",userId);
const statusEl=document.getElementById("status");

function setStatus(text){ 
    statusEl.innerText = text; 
}

const rtcConfig = {
    iceServers: [
        { urls: "stun:stun.relay.metered.ca:80" },
        { urls: "turn:standard.relay.metered.ca:80", username: "cc29acf1a234c7ca3a5ae899", credential: "CW4V8T/D1+AnGnED" },
        { urls: "turn:standard.relay.metered.ca:80?transport=tcp", username: "cc29acf1a234c7ca3a5ae899", credential: "CW4V8T/D1+AnGnED" },
        { urls: "turn:standard.relay.metered.ca:443", username: "cc29acf1a234c7ca3a5ae899", credential: "CW4V8T/D1+AnGnED" },
        { urls: "turns:standard.relay.metered.ca:443?transport=tcp", username: "cc29acf1a234c7ca3a5ae899", credential: "CW4V8T/D1+AnGnED" }
    ]
};

let pc = null;
let stream = null;
let unsubscribe = null;
let heartbeatTimer = null;
let reconnectTimer = null; // [지적 반영] 중복 타이머 생성을 막기 위한 변수
let disconnected = false;
let reconnecting = false;
const addedAdminCandidates = new Set();

function cleanupPeerConnection() {
    if (pc) {
        try { pc.close(); } catch(e) {}
        pc = null;
    }
}

async function fullDisconnect() {
    if (disconnected) return;
    disconnected = true;

    if (reconnectTimer) clearTimeout(reconnectTimer);
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    if (unsubscribe) unsubscribe();
    if (stream) stream.getTracks().forEach(track => track.stop());
    cleanupPeerConnection();

    try {
        await updateDoc(userRef, {
            online: false, 
            state: "offline", 
            mode: "firebase", 
            sharing: false, 
            sharingStartedAt: null,
            sessionId: null, // 세션 초기화
            clientOffer: null, 
            adminAnswer: null,
            clientCandidates: [], 
            adminCandidates: [],
            updatedAt: serverTimestamp()
        });
    } catch (e) { console.warn(e); }
}

window.addEventListener("beforeunload", (e) => { 
    fullDisconnect();
    e.preventDefault(); 
    e.returnValue = ""; 
});
window.addEventListener("unload", () => { fullDisconnect(); });

async function initWebRTC() {
    try {
        if (!stream) {
            setStatus("화면 선택창을 열고 있습니다...");
            stream = await navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:10 }, audio:false });

            stream.getVideoTracks()[0].onended = async () => { 
                await fullDisconnect();
                alert("화면 공유가 종료되었습니다."); 
                location.href = "/"; 
            };
        }

        await executeNegotiation();

    } catch(e) { 
        console.error(e); 
        alert(e.message); 
    }
}

// [지적 반영] 재연결 타이머 중복 실행 원천 방지 및 안전한 재협상 로직
function triggerRestart() {
    if (disconnected || reconnecting) return;
    if (reconnectTimer) return; // 이미 재연결 대기 중이면 중복 예약 안 함

    reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        executeRestartNegotiation();
    }, 2000);
}

async function executeNegotiation(isRestart = false) {
    if (disconnected) return;
    reconnecting = true;

    try {
        cleanupPeerConnection();
        setStatus(isRestart ? "재연결 시도 중..." : "WEBRTC 연결 준비중...");
        
        pc = new RTCPeerConnection(rtcConfig);
        if (stream) {
            stream.getTracks().forEach(track => { pc.addTrack(track, stream); });
        }

        pc.onconnectionstatechange = () => {
            console.log("[CLIENT] Connection State:", pc.connectionState);
            if (pc.connectionState === "disconnected" || pc.connectionState === "failed") {
                triggerRestart();
            }
        };

        pc.onicecandidate = async (event) => {
            if(!event.candidate) return;
            try {
                await updateDoc(userRef, { clientCandidates: arrayUnion(event.candidate.toJSON()) });
            } catch(e){ console.error(e); }
        };

        // [지적 반영] 고유 세션 ID 생성으로 구버전 Answer/Offer 꼬임(Race Condition) 방지
        const currentSessionId = "sess_" + Math.random().toString(36).substring(2) + Date.now();
        addedAdminCandidates.clear();

        await updateDoc(userRef, {
            online: true, 
            state: "live", 
            mode: "webrtc", 
            sessionId: currentSessionId,
            clientOffer: null, 
            clientCandidates: [],
            adminAnswer: null, 
            adminCandidates: [],
            updatedAt: serverTimestamp()
        });

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        
        await updateDoc(userRef, { 
            clientOffer: { type: offer.type, sdp: offer.sdp, sessionId: currentSessionId },
            updatedAt: serverTimestamp()
        });
        setStatus("관리자와 연결됨. (관리자와 공유 대기 중)");

    } catch(e) {
        console.error("[CLIENT] 협상 에러:", e);
    } finally {
        reconnecting = false;
    }
}

async function executeRestartNegotiation() {
    await executeNegotiation(true);
}

function watchAdminSignal() {
    unsubscribe = onSnapshot(userRef, async (snapshot) => {
        if (!snapshot.exists() || !pc) return;
        const data = snapshot.data();

        if (data.sharing === true) {
            setStatus("관리자와 공유 중");
        } else {
            setStatus("관리자와 연결됨. (관리자와 공유 대기 중)");
        }

        // [지적 반영] 들어온 Answer가 현재 세션의 것인지 검증하여 Race Condition 완벽 차단
        if (data.adminAnswer && !pc.currentRemoteDescription) {
            if (data.adminAnswer.sessionId && data.sessionId && data.adminAnswer.sessionId !== data.sessionId) {
                console.warn("[CLIENT] 지난 세션의 낡은 Answer 무시됨");
                return;
            }
            try {
                const answer = new RTCSessionDescription({ type: data.adminAnswer.type, sdp: data.adminAnswer.sdp });
                await pc.setRemoteDescription(answer);
                console.log("[CLIENT] setRemoteDescription 성공");
            } catch (e) { 
                console.error("[CLIENT] 원격 디스크립션 설정 에러:", e); 
            }
        }

        if (data.adminCandidates && Array.isArray(data.adminCandidates)) {
            for (const candidate of data.adminCandidates) {
                if (!pc.currentRemoteDescription) continue; 
                const key = JSON.stringify(candidate);
                if (addedAdminCandidates.has(key)) continue;

                try {
                    await pc.addIceCandidate(new RTCIceCandidate(candidate));
                    addedAdminCandidates.add(key);
                } catch (e) { console.warn("[CLIENT] Candidate 추가 실패:", e); }
            }
        }
    });
}

(async () => {
    const snap = await getDoc(userRef);
    if (!snap.exists()) { alert("계정을 찾을 수 없습니다."); location.href = "/"; return; }
    
    heartbeatTimer = setInterval(async () => {
        try {
            await updateDoc(userRef, { online: true, updatedAt: serverTimestamp() });
        } catch (e) { console.error("Heartbeat 에러:", e); }
    }, 30000);

    await initWebRTC();
    watchAdminSignal();
})();
</script>
</body>
</html>
