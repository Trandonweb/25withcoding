<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>관리자 | 코딩과 함께라면</title>
<style>
:root{--bg-color:#f0f0f0;--card-bg:#fff;--text-color:#111;--header-bg:#fff;--border-color:var(--primary-color,#27ae60);--header-text:var(--primary-color,#27ae60);--card-hover-bg:color-mix(in srgb,var(--primary-color) 8%,white);--primary-color:#27ae60;--btn-bg:#e0e0e0;--btn-text:#333;--btn-hover:#d0d0d0}body.dark-mode{--bg-color:#121212;--card-bg:#1E1E1E;--text-color:#fff;--header-bg:#1E1E1E;--border-color:var(--primary-color);--header-text:var(--primary-color);--card-hover-bg:color-mix(in srgb,var(--primary-color) 15%,#1E1E1E);--btn-bg:#2C2C2C;--btn-text:#fff;--btn-hover:#3A3A3A}*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:var(--bg-color);color:var(--text-color);transition:background .2s,color .2s}header{background:var(--header-bg);color:var(--text-color);padding:20px 30px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08);border-bottom:3px solid var(--border-color)}.header-left{display:flex;align-items:center;gap:20px}.header-btn{background:var(--btn-bg);border:none;color:var(--btn-text);padding:10px 18px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:bold}.header-btn:hover{background:var(--btn-hover)}header h1{font-size:26px;color:var(--header-text)}header p{color:#888;margin-top:5px}#logout{background:#ff5b5b;border:none;color:#fff;padding:10px 18px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:bold}.container{max-width:1200px;margin:auto;padding:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.card{background:var(--card-bg);color:var(--text-color);padding:25px;border-radius:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .2s,background .2s,border .2s;border:2px solid transparent}.card:hover{transform:translateY(-5px);background:var(--card-hover-bg)}.main{border-left:6px solid var(--primary-color);border-top:2px solid var(--border-color);border-right:2px solid var(--border-color);border-bottom:2px solid var(--border-color)}.disabled{opacity:.45;cursor:default}footer{text-align:center;padding:30px;color:#888}#loading{position:fixed;inset:0;background:var(--bg-color);color:var(--text-color);display:flex;justify-content:center;align-items:center;font-size:25px;z-index:2000}
</style></head>
<body>
<div id="loading">확인 중...</div>
<header><div class="header-left"><button id="homeBtn" class="header-btn">홈</button><div><h1>관리자 페이지</h1><p id="welcome">불러오는 중...</p></div></div><div><button id="logout">로그아웃</button></div></header>
<div class="container"><div class="grid">
<div class="card main" id="mirroring"><h2>🖥 화면 모니터링</h2><p>학생 화면 실시간 확인</p></div>
<div class="card main" id="users"><h2>👥 사용자 관리</h2><p>사용자 정보 관리</p></div>
<div class="card main" id="attendance"><h2>📅 출석체크 관리</h2><p>출석 운영일 및 휴무일 관리</p></div>
<div class="card disabled"><h2>🏅 상벌점 관리</h2><p>준비 중</p></div>
<div class="card disabled"><h2>📊 통계</h2><p>준비 중</p></div>
</div></div>
<footer>2026 코딩과 함께라면 | 관리자 페이지</footer>
<script type="module">
import{requireAdmin}from"./js/auth.js";
const SETTINGS_KEY="coding_with_ramen_settings";
function applyStoredSettings(){try{const s=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}");document.body.classList.toggle("dark-mode",!!s.darkMode);if(s.primaryColor)document.documentElement.style.setProperty("--primary-color",s.primaryColor)}catch(e){console.error("설정 로드 실패",e)}}
applyStoredSettings();
try{const user=await requireAdmin();document.getElementById("welcome").innerHTML=`안녕하세요, <b>${user.name}</b>님 (${user.role})`;document.getElementById("loading").style.display="none"}catch(e){console.error(e)}
document.getElementById("homeBtn").onclick=()=>location.href="/index.html";
document.getElementById("logout").onclick=()=>{localStorage.removeItem("userId");location.href="/signin/"};
document.getElementById("mirroring").onclick=()=>location.href="/admin/mirroring.html";
document.getElementById("users").onclick=()=>location.href="/admin/users.html";
document.getElementById("attendance").onclick=()=>location.href="/admin/attendance.html";
</script>
</body></html>
