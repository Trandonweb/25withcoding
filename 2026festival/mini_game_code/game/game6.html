<div class="heading"><div><h1>장애물 슈팅</h1><p>캐릭터는 화면 위아래를 왕복합니다. Space로 내 이동 방향을 바꾸고 Enter로 발사하세요.</p></div><div class="status"><small>승리 조건</small><br><strong>4 HIT</strong></div></div>

</main><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu'};
const mode=s.mode||'cpu';document.getElementById('round').textContent=s.round?s.round+'번째 게임':'';
document.getElementById('opponentLabel').textContent=mode==='local'?'상대 · 자동 왕복 + ENTER':'컴퓨터 · 자동 조작';
const cv=document.getElementById('arena'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
let y1=H*.5,y2=H*.5,h1=0,h2=0,bullets=[],obstacles=[],tick=0,playing=false,flash=[],playerDir=1,cpuDir=1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function placeObstacle(o){const palette=[{fill:'#2d6945',edge:'#53e88a',glow:'#a8ffc4'},{fill:'#315c91',edge:'#79aaff',glow:'#c6ddff'},{fill:'#8b4c2f',edge:'#ffad73',glow:'#ffe0c4'},{fill:'#7b426d',edge:'#f09be0',glow:'#ffd6f7'},{fill:'#8a7130',edge:'#ffcf67',glow:'#fff0b8'}];const color=palette[Math.floor(Math.random()*palette.length)];o.x=W*.5-35+Math.random()*70;o.y=35+Math.random()*(H-115);o.w=22+Math.random()*15;o.h=38+Math.random()*56;o.kind='block';o.color=color;}
for(let i=0;i<5;i++){const o={};placeObstacle(o);let attempts=0;while(obstacles.some(q=>Math.abs(q.y-o.y)<75)&&attempts++<15)placeObstacle(o);obstacles.push(o)}
function fire(p,y){if(!playing)return;bullets.push({x:p===1?130:W-130,y:y??(p===1?y1:y2),vx:p===1?8:-8,vy:0,p,life:0})}
function move(p,d){if(p===1)y1=clamp(y1+d,28,H-28);else if(mode==='local')y2=clamp(y2+d,28,H-28)}
function reversePlayer(){if(playing)playerDir*=-1;}
function relocate(o){placeObstacle(o);let attempts=0;while(obstacles.some(q=>q!==o&&Math.abs(q.y-o.y)<48)&&attempts++<12)placeObstacle(o)}
function obstacleEffect(b,o){const roll=Math.random();if(roll<.38){b.vy=(Math.random()<.5?-1:1)*(2.5+Math.random()*2.8);b.vx*=.82;flash.push({x:o.x+o.w/2,y:o.y+o.h/2,color:'#ffcf67',life:18});document.getElementById('message').textContent='↗ 총알 굴절!';}
else if(roll<.72){for(const sign of [-1,1])bullets.push({x:b.x,y:b.y,vx:b.vx,vy:sign*(2.1+Math.random()*1.4),p:b.p,life:0});b.dead=true;flash.push({x:o.x+o.w/2,y:o.y+o.h/2,color:'#79aaff',life:18});document.getElementById('message').textContent=' 총알 분열! 두 발로 나뉘었다';}
else{b.dead=true;flash.push({x:o.x+o.w/2,y:o.y+o.h/2,color:'#f07d8b',life:18});document.getElementById('message').textContent='× 총알 소멸!';}
relocate(o);flash.push({x:o.x+o.w/2,y:o.y+o.h/2,color:'#53e88a',life:18})}
function end(w){if(!playing)return;playing=false;const winner=w;localStorage.setItem('miniGameResult',JSON.stringify({game:' 장애물 슈팅',winner,me:4-h1,opp:4-h2}));document.getElementById('message').textContent=mode==='local'?(winner==='me'?'1P 승':'2P 승'):(winner==='me'?'승리 · 상대의 피격 횟수가 한도에 도달했습니다.':'패배 · 피격 횟수가 한도에 도달했습니다.');document.getElementById('done').classList.remove('hidden');draw()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#07110b';ctx.fillRect(0,0,W,H);
// subtle star/grid
ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.fillStyle='#214632';ctx.fillRect(W/2-2,0,4,H);
ctx.fillStyle='#53e88a';ctx.fillRect(70,y1-18,38,36);ctx.fillStyle='#07110b';ctx.fillRect(91,y1-7,12,14);ctx.fillStyle='#ffcf67';ctx.fillRect(W-108,y2-18,38,36);ctx.fillStyle='#07110b';ctx.fillRect(W-103,y2-7,12,14);
for(const o of obstacles){const col=o.color||{fill:'#2d6945',edge:'#53e88a',glow:'#a8ffc4'};ctx.globalAlpha=.35;ctx.fillStyle=col.edge;ctx.fillRect(o.x-5,o.y-5,o.w+10,o.h+10);ctx.globalAlpha=1;ctx.fillStyle=col.fill;ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle=col.edge;ctx.lineWidth=2.5;ctx.strokeRect(o.x,o.y,o.w,o.h);ctx.fillStyle=col.glow;ctx.fillRect(o.x+o.w*.25,o.y+o.h*.25,o.w*.5,3);ctx.fillRect(o.x+o.w*.25,o.y+o.h*.62,o.w*.5,2)}
for(const b of bullets){ctx.strokeStyle=b.p===1?'#a8ffc4':'#ffe2a0';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*1.8,b.y-b.vy*1.8);ctx.stroke();ctx.fillStyle=b.p===1?'#53e88a':'#ffcf67';ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill()}
for(const f of flash){ctx.globalAlpha=Math.max(0,f.life/18);ctx.strokeStyle=f.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,22-f.life*.5,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
ctx.fillStyle='#a9c5b2';ctx.font='14px Arial';ctx.fillText('PLAYER',24,24);ctx.textAlign='right';ctx.fillText(mode==='cpu'?'CPU':'PLAYER 2',W-24,24);ctx.textAlign='left'}
function frame(){if(!playing)return;tick++;y1+=playerDir*3.4;if(y1>=H-28){y1=H-28;playerDir=-1}else if(y1<=28){y1=28;playerDir=1}if(mode==='cpu'){y2+=cpuDir*2.8;if(y2>=H-28){y2=H-28;cpuDir=-1}else if(y2<=28){y2=28;cpuDir=1}}else if(mode==='local'){y2+=cpuDir*3;if(y2>=H-28){y2=H-28;cpuDir=-1}else if(y2<=28){y2=28;cpuDir=1}}
if(mode==='cpu'&&tick%38===0)fire(2,y2+(Math.random()-.5)*12);
for(const b of bullets){b.x+=b.vx;b.y+=b.vy;b.life++;for(const o of obstacles){if(!b.dead&&b.x>=o.x&&b.x<=o.x+o.w&&b.y>=o.y&&b.y<=o.y+o.h){obstacleEffect(b,o);break}}if(!b.dead){if(b.p===1&&b.x>=W-125&&Math.abs(b.y-y2)<27){h2++;b.dead=true;document.getElementById('hits2').textContent=h2;if(h2>=4){end('me');return}}else if(b.p===2&&b.x<=125&&Math.abs(b.y-y1)<27){h1++;b.dead=true;document.getElementById('hits1').textContent=h1;if(h1>=4){end('opp');return}}}}
bullets=bullets.filter(b=>!b.dead&&b.x>-15&&b.x<W+15&&b.y>-15&&b.y<H+15&&b.life<180);flash.forEach(f=>f.life--);flash=flash.filter(f=>f.life>0);draw();requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'){e.preventDefault();reversePlayer()}if(e.code==='KeyW'||e.code==='Enter'&&mode!=='local'){e.preventDefault();fire(1)}if(mode==='local'&&e.code==='KeyO'){e.preventDefault();fire(2)}if(e.code==='KeyA')move(1,-24);if(e.code==='KeyQ')move(1,24);if(mode==='local'&&e.code==='KeyL')move(2,-24);if(mode==='local'&&e.code==='KeyP')move(2,24);if(mode!=='local'&&e.code==='KeyS')move(1,24)},true);document.body.tabIndex=0;document.addEventListener('pointerdown',()=>{try{window.focus()}catch(e){}},true);
document.getElementById('up').onclick=()=>move(1,-26);document.getElementById('down').onclick=()=>move(1,26);document.getElementById('fire').onclick=()=>fire(1);document.getElementById('done').onclick=()=>location.href='../index.html';if(mode==='local')document.getElementById('message').textContent='1P: A/Q 이동 · W 발사 · 2P: L/P 이동 · O 발사';draw();function startCountdown(){const cd=document.getElementById('mgShootCountdown'),seq=['3!','2!','1!','GO!'];let i=0;cd.style.display='grid';function next(){cd.textContent=seq[i];cd.className=i===3?'show go':'show';void cd.offsetWidth;cd.classList.add('show');if(i===3){document.getElementById('message').textContent='시작! 장애물을 피해서 발사하세요.';setTimeout(()=>{cd.style.display='none';playing=true;requestAnimationFrame(frame)},420);return}i++;setTimeout(next,650)}next()}startCountdown();
</script><div id="miniSoundPanel" style="position:fixed;right:14px;bottom:14px;z-index:9999"><button id="miniSoundToggle" type="button" aria-pressed="true" style="border:1px solid #ffffff35;border-radius:999px;padding:10px 14px;background:#10251a;color:#effff4;font:700 13px Arial,sans-serif;box-shadow:0 6px 22px #0006;cursor:pointer"> 소리 켜짐</button></div><script>(function(){let enabled=localStorage.getItem('miniGameSound')!=='off',audio=null,lastKeySound=0;const btn=document.getElementById('miniSoundToggle');function label(){btn.textContent=enabled?'소리 켜짐':'소리 꺼짐';btn.setAttribute('aria-pressed',String(enabled))}function sound(kind='ui'){if(!enabled)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audio=audio||new AC();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const seq=kind==='win'?[523,659,784]:kind==='score'?[660,880]:kind==='hit'?[220,165]:kind==='bounce'?[420]:kind==='jump'?[440,660]:kind==='key'?[330]:[520];seq.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='hit'?'triangle':'sine';o.frequency.setValueAtTime(hz,now+i*.075);g.gain.setValueAtTime(.0001,now+i*.075);g.gain.exponentialRampToValueAtTime(((kind==='ui'||kind==='key')?0.035:0.065),now+i*.075+.012);g.gain.exponentialRampToValueAtTime(.0001,now+i*.075+.11);o.connect(g);g.connect(audio.destination);o.start(now+i*.075);o.stop(now+i*.075+.12)})}catch(e){}}window.miniGameSound=sound;btn.addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('miniGameSound',enabled?'on':'off');label();if(enabled)sound('ui')});document.addEventListener('click',e=>{if(e.target.closest('#miniSoundPanel'))return;if(e.target.closest('button'))sound('ui')},true);document.addEventListener('keydown',e=>{if(e.repeat||!['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code))return;const now=performance.now();if(now-lastKeySound>75){sound('key');lastKeySound=now}},true);label()})();</script><script type="module" src="../online-sync.js"></script>
<script>
/* Tablet keyboard focus and automatic result display */
(function(){
  try{localStorage.removeItem('miniGameResult')}catch(e){}
  document.body.tabIndex=0;
  const focusGame=()=>{try{document.body.focus({preventScroll:true})}catch(e){document.body.focus()}};
  window.addEventListener('pageshow',()=>setTimeout(focusGame,100));
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('button,input,textarea,select'))focusGame()},{passive:true});
  const css=document.createElement('style');
  css.textContent='#mgAutoResult{position:fixed;inset:0;z-index:20000;display:none;place-items:center;padding:20px;background:#07110ddd;backdrop-filter:blur(10px)}#mgAutoResult .panel{width:min(460px,94vw);padding:30px;border:1px solid #b6f6ca;border-radius:24px;background:#f8fff9;color:#17251c;text-align:center;box-shadow:0 24px 80px #0005;font-family:Arial,sans-serif}#mgAutoResult .headline{font-size:clamp(34px,8vw,54px);font-weight:950;margin:12px 0}#mgAutoResult .detail{color:#617166;line-height:1.6}#mgAutoResult button{margin-top:22px;border:0;border-radius:12px;padding:14px 24px;background:#187447;color:white;font-weight:850;font-size:15px}#mgTabletPad{position:fixed;left:10px;bottom:10px;z-index:8000;display:flex;gap:6px;flex-wrap:wrap;max-width:85vw}#mgTabletPad button{touch-action:manipulation;min-width:44px;min-height:42px;padding:9px 12px;border:1px solid #b9d9c3;border-radius:12px;background:#f7fff8;color:#173d28;font-weight:850;box-shadow:0 4px 14px #0002}';
  document.head.appendChild(css);
  const overlay=document.createElement('div');overlay.id='mgAutoResult';
  overlay.innerHTML='<div class="panel"><div style="font-size:12px;font-weight:850;letter-spacing:.15em;color:#187447">MATCH RESULT</div><div class="headline" id="mgAutoHeadline">경기 종료</div><div class="detail" id="mgAutoDetail">최종 결과</div><button id="mgAutoBack">메뉴로 돌아가기</button></div>';
  document.body.appendChild(overlay);
  document.getElementById('mgAutoBack').onclick=()=>location.href='../index.html';
  let shown=false;

  function showResult(data){
    if(shown||!data||!data.winner)return;
    shown=true;
    const settings=JSON.parse(localStorage.getItem('miniGameSettings')||'null');document.getElementById('mgAutoHeadline').textContent=settings?.mode==='local'?(data.winner==='me'?'1P 승':data.winner==='opp'?'2P 승':'무승부'):(data.winner==='me'?'승리':data.winner==='opp'?'패배':'무승부');
    const score=data.me!==undefined||data.opp!==undefined?'최종 점수 '+(data.me??0)+' : '+(data.opp??0):'';
    document.getElementById('mgAutoDetail').textContent=[data.game||'미니게임',score].filter(Boolean).join(' · ');
    overlay.style.display='grid';
  }
  function checkResult(){let raw;try{raw=localStorage.getItem('miniGameResult')}catch(e){return}if(raw){try{showResult(JSON.parse(raw))}catch(e){}}}
  const originalSetItem=Storage.prototype.setItem;
  Storage.prototype.setItem=function(key,value){
    originalSetItem.call(this,key,value);
    if(key==='miniGameResult'){try{showResult(JSON.parse(value))}catch(e){}}
  };
  const observer=new MutationObserver(checkResult);
  observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','hidden','style']});
  // On-screen backup controls for touchscreen tablets
  const n=(location.pathname.match(/game([1-9])\.html/)||[])[1];
  const keys={'1':[['A','KeyA'],['L','KeyL']],'2':[['A','KeyA'],['L','KeyL']],'3':[['반응','Enter']],'5':[['점프','Space']],'6':[['위','ArrowUp'],['아래','ArrowDown'],['발사','Enter'],['방향','Space']],'7':[['왼쪽','KeyA'],['오른쪽','KeyD'],['발사','KeyS'],['P2 ←','ArrowLeft'],['P2 →','ArrowRight'],['P2 발사','ArrowDown']],'8':[['위','ArrowUp'],['아래','ArrowDown'],['시작','Enter']],'9':[['왼쪽','ArrowLeft'],['오른쪽','ArrowRight'],['점프','Space'],['P2 점프','ArrowUp']]};
  if(keys[n]){
    const pad=document.createElement('div');pad.id='mgTabletPad';
    keys[n].forEach(([label,code])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{focusGame();const key=code==='Space'?' ':code==='Enter'?'Enter':code.startsWith('Key')?code.slice(3).toLowerCase():code;document.dispatchEvent(new KeyboardEvent('keydown',{key,code,bubbles:true,cancelable:true}));if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyS'].includes(code))document.dispatchEvent(new KeyboardEvent('keyup',{key,code,bubbles:true,cancelable:true}))};pad.appendChild(b)});
    document.body.appendChild(pad);
  }
})();
</script>
</body></html>
