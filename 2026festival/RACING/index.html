<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RACING</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050708;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;top:14px;left:14px;right:14px;z-index:5;display:flex;justify-content:space-between;pointer-events:none}.readout{min-width:110px;padding:8px 12px;border-radius:10px;background:#050708b8;border:1px solid #ffffff18;backdrop-filter:blur(7px)}.readout span{display:block;font-size:10px;letter-spacing:1.5px;color:#9ba5a8}.readout strong{font-size:21px}.center{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:5;padding:7px 13px;border-radius:20px;background:#050708b8;font-size:12px;opacity:.85}.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#0008}.panel{width:min(430px,calc(100% - 32px));padding:35px;text-align:center;border-radius:24px;background:#0b1110f2;box-shadow:0 30px 100px #000}.panel h1{font-size:58px;letter-spacing:5px;margin:0}.panel p{color:#b9c1c2;line-height:1.7}.start{border:0;padding:14px 30px;border-radius:12px;background:#24c46a;color:white;font-size:17px;font-weight:900}.hide{display:none}.controls{position:fixed;z-index:7;left:16px;right:16px;bottom:18px;display:flex;justify-content:space-between;pointer-events:none}.cluster{display:flex;gap:9px}.control{pointer-events:auto;width:64px;height:58px;border:1px solid #ffffff2b;border-radius:15px;background:#080b0ccc;color:#fff;font-weight:900;font-size:23px}.pedal{width:74px;font-size:11px}.hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:6;font-size:11px;color:#ffffff66;pointer-events:none}@media(min-width:800px){.controls{opacity:.35}.controls:hover{opacity:1}.hint{display:block}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="readout"><span>SPEED</span><strong><b id="speed">0</b> km/h</strong></div><div class="readout"><span>DISTANCE</span><strong><b id="distance">0.00</b> km</strong></div></div>
<div class="center" id="gear">N · READY</div>
<div class="screen" id="startScreen"><div class="panel"><h1>RACING</h1><p>실제 운전석 시점으로 달립니다.<br><b>W / ↑</b> 가속　<b>S / ↓</b> 브레이크<br><b>A / D</b> 조향　<b>SPACE</b> 니트로</p><button class="start" onclick="startGame()">START ENGINE</button></div></div>
<div class="screen hide" id="crashScreen"><div class="panel"><h1>CRASH</h1><p>주행 거리 <b id="result">0.00</b> km</p><button class="start" onclick="startGame()">RESTART</button></div></div>
<div class="controls"><div class="cluster"><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div><div class="cluster"><button class="control pedal" id="brake">BRAKE</button><button class="control pedal" id="gas">GAS</button><button class="control" id="nitro">⚡</button></div></div>
<div class="hint">WASD / 방향키 / SPACE</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1,running=false,last=0,time=0,speed=0,distance=0,carX=0,steer=0,throttle=0,brake=0,nitro=0,shake=0,curve=0,curveTarget=0,roadTravel=0,spawnClock=0,traffic=[];const keys={};
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const lerp=(a,b,t)=>a+(b-a)*t;
function press(code,v){keys[code]=v;if(v&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(code))event?.preventDefault?.()}
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
function bind(id,code){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[code]=true;b.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[code]=false))}bind('left','ArrowLeft');bind('right','ArrowRight');bind('gas','ArrowUp');bind('brake','ArrowDown');bind('nitro','Space');
function startGame(){running=true;last=performance.now();time=0;speed=0;distance=0;carX=0;steer=0;nitro=0;shake=0;curve=0;curveTarget=0;roadTravel=0;spawnClock=.7;traffic=[];document.getElementById('startScreen').classList.add('hide');document.getElementById('crashScreen').classList.add('hide');requestAnimationFrame(loop)}
function crash(){running=false;document.getElementById('result').textContent=distance.toFixed(2);document.getElementById('crashScreen').classList.remove('hide')}
function roadAt(z){const p=clamp(z,0,1);const horizon=H*.38,ground=H*.90;const perspective=p*p;const width=lerp(W*.045,W*.93,perspective);const bend=curve*(p*p)*W*.20;const center=W/2+bend;return{p,width,center,y:lerp(horizon,ground,p)}}
function roadOffset(z){return Math.sin((roadTravel*.55+z*4))*curve*W*.04}
function spawnTraffic(){let lane=(Math.random()*2-1)*.72;traffic.push({z:.02,x:lane,speed:.48+Math.random()*.34,color:['#d94141','#2979d8','#f0bd3d','#e9e9e9','#7d55c7'][Math.floor(Math.random()*5)],seed:Math.random()*10})}
function carShape(cx,cy,s,color){const w=70*s,h=116*s;ctx.save();ctx.translate(cx,cy);ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,h*.46,w*.64,8*s,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#101214';ctx.fillRect(-w*.56,-h*.12,w*.16,h*.48);ctx.fillRect(w*.40,-h*.12,w*.16,h*.48);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,9*s);ctx.fill();ctx.fillStyle='#16262d';ctx.beginPath();ctx.roundRect(-w*.32,-h*.34,w*.64,h*.27,7*s);ctx.fill();ctx.fillStyle='#bfe9f5';ctx.globalAlpha=.75;ctx.fillRect(-w*.24,-h*.27,w*.48,h*.10);ctx.globalAlpha=1;ctx.fillStyle='#fff2b0';ctx.fillRect(-w*.34,h*.27,w*.18,5*s);ctx.fillRect(w*.16,h*.27,w*.18,5*s);ctx.restore()}
function drawRoad(){
 let sky=ctx.createLinearGradient(0,0,0,H*.5);sky.addColorStop(0,'#091421');sky.addColorStop(.55,'#40647b');sky.addColorStop(1,'#9eb29a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // distant hills
 ctx.fillStyle='#274b42';ctx.beginPath();ctx.moveTo(0,H*.43);for(let i=0;i<=12;i++)ctx.lineTo(i*W/12,H*.35+Math.sin(i*1.8+curve)*H*.035);ctx.lineTo(W,H*.55);ctx.lineTo(0,H*.55);ctx.fill();
 ctx.fillStyle='#24472b';ctx.fillRect(0,H*.43,W,H*.57);
 const far=roadAt(0),near=roadAt(1);ctx.fillStyle='#26292a';ctx.beginPath();ctx.moveTo(far.center-far.width/2,far.y);ctx.lineTo(far.center+far.width/2,far.y);ctx.lineTo(near.center+near.width/2,near.y);ctx.lineTo(near.center-near.width/2,near.y);ctx.closePath();ctx.fill();
 // edge lines
 ctx.strokeStyle='#f4f0d7';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(far.center-far.width/2,far.y);ctx.lineTo(near.center-near.width/2,near.y);ctx.moveTo(far.center+far.width/2,far.y);ctx.lineTo(near.center+near.width/2,near.y);ctx.stroke();
 // center dashed road markings
 for(let lane=-.34;lane<=.34;lane+=.68){for(let i=0;i<14;i++){let z=((i/14+roadTravel*1.15)%1);let z2=Math.min(1,z+.035+z*.055);let a=roadAt(z),b=roadAt(z2);ctx.strokeStyle='#ffffffb0';ctx.lineWidth=3+z*3;ctx.beginPath();ctx.moveTo(a.center+a.width*lane,a.y);ctx.lineTo(b.center+b.width*lane,b.y);ctx.stroke()}}
 // roadside poles / trees moving toward player
 for(let i=0;i<18;i++){let z=(i/18+roadTravel*.72)%1,p=roadAt(z),s=.12+z*.9;for(const side of [-1,1]){let xx=p.center+side*(p.width/2+W*.035*s)+roadOffset(z);ctx.fillStyle='#172c22';ctx.beginPath();ctx.arc(xx,p.y-42*s,18*s,0,Math.PI*2);ctx.fill();ctx.fillStyle='#85827a';ctx.fillRect(xx-2*s,p.y-25*s,4*s,25*s)}}
 // traffic sorted far -> near
 traffic.slice().sort((a,b)=>a.z-b.z).forEach(v=>{let p=roadAt(v.z),s=.10+v.z*.95;let xx=p.center+v.x*p.width*.42+roadOffset(v.z);carShape(xx,p.y,s,v.color)});
}
function drawCockpit(){
 // dashboard / hood
 ctx.fillStyle='#0b1011';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H*.88);ctx.quadraticCurveTo(W*.5,H*.75,W,H*.88);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
 // instrument binnacle
 ctx.fillStyle='#202728';ctx.beginPath();ctx.roundRect(W*.34,H*.865,W*.32,H*.16,25);ctx.fill();
 // steering wheel
 const r=Math.min(W,H)*.095;let wheelX=W*.5+steer*W*.035,wheelY=H*.93;ctx.strokeStyle='#070909';ctx.lineWidth=Math.max(11,W*.018);ctx.beginPath();ctx.arc(wheelX,wheelY,r,0,Math.PI*2);ctx.stroke();ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(wheelX,wheelY);ctx.lineTo(wheelX,wheelY+r*.75);ctx.moveTo(wheelX,wheelY);ctx.lineTo(wheelX-r*.62,wheelY+r*.45);ctx.moveTo(wheelX,wheelY);ctx.lineTo(wheelX+r*.62,wheelY+r*.45);ctx.stroke();
 // windshield pillars
 ctx.fillStyle='#070b0c';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W*.055,0);ctx.lineTo(W*.12,H*.72);ctx.lineTo(0,H*.80);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W*.945,0);ctx.lineTo(W*.88,H*.72);ctx.lineTo(W,H*.80);ctx.closePath();ctx.fill();
 // speed gauge
 ctx.fillStyle='#090d0e';ctx.beginPath();ctx.arc(W*.23,H*.94,42,0,Math.PI*2);ctx.fill();ctx.fillStyle='#bde8cf';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(Math.round(speed),W*.23,H*.95);ctx.font='9px system-ui';ctx.fillText('KM/H',W*.23,H*.98);ctx.textAlign='left';
 if(nitro>0){ctx.fillStyle='#8fffb5';ctx.font='bold 14px system-ui';ctx.fillText('NITRO',W*.72,H*.95)}
}
function update(dt){
 const gas=keys.ArrowUp||keys.KeyW,br=keys.ArrowDown||keys.KeyS;const left=keys.ArrowLeft||keys.KeyA,right=keys.ArrowRight||keys.KeyD;const direction=(right?1:0)-(left?1:0);
 if(gas)throttle=lerp(throttle,1,dt*8);else throttle=lerp(throttle,0,dt*3);if(br)brake=lerp(brake,1,dt*10);else brake=lerp(brake,0,dt*5);
 if(keys.Space)nitro=lerp(nitro,1,dt*8);else nitro=lerp(nitro,0,dt*3);
 const target=30+throttle*255-brake*190+nitro*155;speed=lerp(speed,clamp(target,0,410),1-Math.pow(.00001,dt));
 steer=lerp(steer,direction,1-Math.pow(.00005,dt));carX+=steer*dt*(.34+speed/330);carX*=Math.pow(.965,dt*60);carX=clamp(carX,-1.08,1.08);
 // road curves change gradually
 curveTarget=Math.sin(time*.045)*.7+Math.sin(time*.021+2)*.35;if(Math.random()<dt*.08)curveTarget=(Math.random()*2-1)*.9;curve=lerp(curve,curveTarget,dt*.18);roadTravel+=speed*dt/900;distance+=speed*dt/3600;
 spawnClock-=dt;if(spawnClock<=0){spawnTraffic();spawnClock=clamp(1.15-speed/520,.34,.95)}traffic.forEach(v=>v.z+=dt*(.19+speed/480-v.speed*.18));traffic=traffic.filter(v=>v.z<1.08);
 for(const v of traffic){if(v.z>.73&&v.z<.96&&Math.abs(v.x-carX)<.22){shake=.35;crash();return}}
 shake=Math.max(0,shake-dt);time+=dt;
}
function loop(t){if(!running)return;let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake*20,(Math.random()-.5)*shake*12);drawRoad();drawCockpit();ctx.restore();document.getElementById('speed').textContent=Math.round(speed);document.getElementById('distance').textContent=distance.toFixed(2);document.getElementById('gear').textContent=speed<1?'N · READY':speed<70?'1 · DRIVE':speed<140?'2 · DRIVE':speed<210?'3 · DRIVE':speed<290?'4 · DRIVE':'5 · FAST';requestAnimationFrame(loop)}
</script>
</body>
</html>
