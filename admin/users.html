<!DOCTYPE html>
<html>
<head>
  <title>코딩과 함께라면_사용자_관리</title>

  <style>

    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #f0f0f0;
    }

    h2 {
      margin-bottom: 10px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 20px;
      margin-bottom: 15px;
    }

    input, select {
      padding: 10px;
      border-radius: 12px;
      border: none;
      margin: 5px;
      background: #f5f5f5;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background: #e6e6e6;
    }

    .user {
      padding: 10px;
      border-radius: 12px;
      background: #f9f9f9;
      margin-top: 8px;
    }

  </style>
</head>

<body>

<div class="top-bar">

  <button onclick="goBack()">
    뒤로가기
  </button>

  <h2>사용자 관리</h2>

</div>

<div class="card">

  <h3>학생 추가</h3>

  <input id="newId" placeholder="학번">

  <input id="newName" placeholder="이름">

  <select id="newRole">

    <option value="student">
      학생
    </option>

  </select>

  <button onclick="createUser()">
    추가
  </button>

</div>

<div class="card">

  <h3>사용자 검색</h3>

  <input id="searchInput" placeholder="학번 또는 이름 검색" oninput="filterUsers()" style="width: 80%;">

</div>

<div class="card">

  <h3 id="selectedCountText">선택된 사용자 : 0명</h3>

  <div id="selectedUserList" style="margin-bottom: 10px; color: #555; max-height: 150px; overflow-y: auto;">
    선택된 사용자가 없습니다.
  </div>

  <button onclick="batchChangeRole()">
    권한 변경
  </button>

  <button onclick="batchResetPassword()">
    비밀번호 초기화
  </button>

  <button onclick="batchDeleteUsers()">
    삭제
  </button>

  <select id="batchRoleSelect" style="margin-left: 10px;">
    <option value="student">학생</option>
  </select>

</div>

<div class="card">

  <h3>사용자 목록</h3>

  <div id="userList">
    로딩중...
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc
}
from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey:
    "AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",

  authDomain:
    "points2026-f5e50.firebaseapp.com",

  projectId:
    "points2026-f5e50"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const myId =
  localStorage.getItem("userId");

if (!myId) {

  alert("로그인이 필요합니다.");

  location.href = "/index.html";
  throw new Error("로그인 필요");

}

const mySnap =
  await getDoc(doc(db, "users", myId));

if (!mySnap.exists()) {

  alert("사용자 없음");

  location.href = "/index.html";
  throw new Error("사용자 없음");

}

const myData = mySnap.data();

/*--------------------------------------------------
  접근 권한 확인 함수
--------------------------------------------------*/
if (myData.role === "student") {
  alert("접근 권한이 없습니다.");
  location.replace("/admin");
  throw new Error("권한 없음");
}

/* 전역 변수 설정 및 president 권한일 때만 추가 선택지 부여 */
let allUsers = [];
let selectedUsers = [];

if (myData.role === "president") {
  document.getElementById("newRole").innerHTML = `
    <option value="student">학생</option>
    <option value="vice">부회장</option>
    <option value="president">회장</option>
  `;
  document.getElementById("batchRoleSelect").innerHTML = `
    <option value="student">학생</option>
    <option value="vice">부회장</option>
    <option value="president">회장</option>
  `;
}

/*--------------------------------------------------
  권한 한글화 함수
--------------------------------------------------*/
function roleToText(role) {

  if (role === "president") {
    return "회장";
  }

  if (role === "vice") {
    return "부회장";
  }

  return "학생";

}

/*--------------------------------------------------
  뒤로가기 함수
--------------------------------------------------*/
window.goBack = () => {
  location.href = "/admin";
};

/*--------------------------------------------------
  유저 생성 함수
--------------------------------------------------*/
window.createUser = async () => {

  const id = document.getElementById("newId").value.trim();
  const name = document.getElementById("newName").value.trim();
  const role = document.getElementById("newRole").value;

  if (!id || !name) {
    alert("입력해주세요.");
    return;
  }

  /* 학번 5자리 및 숫자 검사 */
  if (id.length !== 5) {
    alert("학번은 5자리입니다.");
    return;
  }

  if (isNaN(id)) {
    alert("숫자만 입력해주세요.");
    return;
  }

  /* 상세 학번 규칙 검증 (학년 1~3, 반 1~9, 번호 1~99) */
  const gradeNum = Number(id[0]);
  const classNum = Number(id.slice(1, 3));
  const numberNum = Number(id.slice(3, 5));

  if (
    gradeNum < 1 || gradeNum > 3 ||
    classNum < 1 || classNum > 9 ||
    numberNum < 1 || numberNum > 99
  ) {
    alert("올바른 학번이 아닙니다.");
    return;
  }

  /* vice 권한 생성 제한 검사 (개발자 도구 조작 방어 포함) */
  if (myData.role === "vice") {
    if (role === "vice" || role === "president") {
      alert("권한이 없습니다.");
      return;
    }
  }

  try {
    const ref = doc(db, "users", id);
    const snap = await getDoc(ref);

    if (snap.exists()) {
      alert("이미 존재하는 학번");
      return;
    }

    const grade = id.charAt(0);

    await setDoc(ref, {
      grade: grade,
      name: name,
      password: "qwer1234!",
      role: role,
      score: 0
      /* TODO: 추후 최초 로그인 시 비밀번호 변경 도입 시 passwordChanged: false 추가 검토 */
    });

    alert("생성 완료");
    location.reload();
  } catch (error) {
    alert("생성 중 오류가 발생했습니다.");
  }

};

/*--------------------------------------------------
  유저 데이터 불러오기 및 렌더링 함수
--------------------------------------------------*/
async function loadUsers() {
  const userListDiv = document.getElementById("userList");
  userListDiv.innerHTML = "로딩중...";

  try {
    const querySnapshot = await getDocs(collection(db, "users"));
    allUsers = [];

    querySnapshot.forEach((docu) => {
      allUsers.push({
        id: docu.id,
        ...docu.data()
      });
    });

    /* 숫자 기준 학번 정렬 */
    allUsers.sort((a, b) => {
      return Number(a.id) - Number(b.id);
    });

    renderUserList(allUsers);
  } catch (error) {
    userListDiv.innerHTML = "데이터를 불러오는 중 오류가 발생했습니다.";
  }
}

/*--------------------------------------------------
  유저 목록 화면 출력 함수
--------------------------------------------------*/
function renderUserList(users) {
  const userListDiv = document.getElementById("userList");
  userListDiv.innerHTML = "";

  for (const user of users) {
    const div = document.createElement("div");
    div.className = "user";

    let selectable = true;
    let statusText = "";

    /* 본인 계정 체크 */
    if (user.id === myId) {
      selectable = false;
      statusText = "(본인 계정)";
    } 
    /* vice 관리 정책 체크 */
    else if (myData.role === "vice") {
      if (user.role === "vice" || user.role === "president") {
        selectable = false;
        statusText = roleToText(user.role);
      }
    }

    let checkboxHTML = "";
    if (selectable) {
      const isChecked = selectedUsers.includes(user.id) ? "checked" : "";
      checkboxHTML = `<label><input type="checkbox" value="${user.id}" onchange="toggleSelectUser('${user.id}')" ${isChecked}> 선택</label>`;
    } else {
      checkboxHTML = `<span>${statusText}</span>`;
    }

    div.innerHTML = `
      <b>${user.id}</b> ${user.name}
      <br><br>
      [${roleToText(user.role)}]
      <br><br>
      ${checkboxHTML}
    `;

    userListDiv.appendChild(div);
  }
}

/*--------------------------------------------------
  사용자 검색 필터링 함수
--------------------------------------------------*/
window.filterUsers = () => {
  const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
  
  if (!keyword) {
    renderUserList(allUsers);
    return;
  }

  const filtered = [];
  for (const user of allUsers) {
    if (user.id.toLowerCase().includes(keyword) || user.name.toLowerCase().includes(keyword)) {
      filtered.push(user);
    }
  }

  renderUserList(filtered);
};

/*--------------------------------------------------
  체크박스 선택 관리 함수 (중복 방어 포함)
--------------------------------------------------*/
window.toggleSelectUser = (id) => {
  const index = selectedUsers.indexOf(id);
  if (index > -1) {
    selectedUsers.splice(index, 1);
  } else {
    if (!selectedUsers.includes(id)) {
      selectedUsers.push(id);
    }
  }
  updateSelectedUI();
};

/*--------------------------------------------------
  선택된 사용자 UI 업데이트 함수
--------------------------------------------------*/
function updateSelectedUI() {
  const countText = document.getElementById("selectedCountText");
  const selectedListDiv = document.getElementById("selectedUserList");

  countText.innerText = `선택된 사용자 : ${selectedUsers.length}명`;

  if (selectedUsers.length === 0) {
    selectedListDiv.innerText = "선택된 사용자가 없습니다.";
    return;
  }

  let textArray = [];
  for (const id of selectedUsers) {
    for (const user of allUsers) {
      if (user.id === id) {
        textArray.push(`${user.id} ${user.name}`);
      }
    }
  }

  selectedListDiv.innerHTML = textArray.join("<br>");
}

/*--------------------------------------------------
  다중 권한 변경 함수
--------------------------------------------------*/
window.batchChangeRole = async () => {
  if (selectedUsers.length === 0) {
    alert("선택된 사용자가 없습니다.");
    return;
  }

  /* 개발자 도구 조작 등을 통한 본인 권한 변경 방어 */
  for (const id of selectedUsers) {
    if (id === myId) {
      alert("본인의 권한은 변경할 수 없습니다.");
      return;
    }
  }

  const newRole = document.getElementById("batchRoleSelect").value;

  /* vice 권한 변경 제한 검사 (개발자 도구 조작 방어 포함) */
  if (myData.role === "vice") {
    if (newRole === "vice" || newRole === "president") {
      alert("권한이 없습니다.");
      return;
    }
  }

  let namesArray = [];
  for (const id of selectedUsers) {
    for (const user of allUsers) {
      if (user.id === id) {
        namesArray.push(`${user.id} ${user.name}`);
      }
    }
  }

  const confirmMessage = `${selectedUsers.length}명의 권한을 변경하시겠습니까?\n\n` + namesArray.join("\n");

  if (!confirm(confirmMessage)) {
    return;
  }

  try {
    for (const id of selectedUsers) {
      const targetUser = allUsers.find(user => user.id === id);
      /* 기존 권한과 변경하려는 권한이 같으면 불필요한 요청 방지 */
      if (targetUser && targetUser.role === newRole) {
        continue;
      }

      await updateDoc(doc(db, "users", id), {
        role: newRole
      });
    }

    alert("권한 변경 완료");
    selectedUsers = [];
    location.reload();
  } catch (error) {
    alert("권한 변경 중 오류가 발생했습니다.");
  }
};

/*--------------------------------------------------
  다중 비밀번호 초기화 함수
--------------------------------------------------*/
window.batchResetPassword = async () => {
  if (selectedUsers.length === 0) {
    alert("선택된 사용자가 없습니다.");
    return;
  }

  let namesArray = [];
  for (const id of selectedUsers) {
    for (const user of allUsers) {
      if (user.id === id) {
        namesArray.push(`${user.id} ${user.name}`);
      }
    }
  }

  const confirmMessage = `${selectedUsers.length}명의 비밀번호를 초기화하시겠습니까?\n\n` + namesArray.join("\n");

  if (!confirm(confirmMessage)) {
    return;
  }

  try {
    for (const id of selectedUsers) {
      await updateDoc(doc(db, "users", id), {
        password: "qwer1234!"
        /* TODO: 추후 비밀번호 변경 도입 시 passwordChanged: false 추가 검토 */
      });
    }

    alert("비밀번호 초기화 완료");
    selectedUsers = [];
    location.reload();
  } catch (error) {
    alert("비밀번호 초기화 중 오류가 발생했습니다.");
  }
};

/*--------------------------------------------------
  다중 삭제 함수
--------------------------------------------------*/
window.batchDeleteUsers = async () => {
  if (selectedUsers.length === 0) {
    alert("선택된 사용자가 없습니다.");
    return;
  }

  /* 개발자 도구 조작 등을 통한 본인 계정 삭제 방어 */
  for (const id of selectedUsers) {
    if (id === myId) {
      alert("본인의 계정은 삭제할 수 없습니다.");
      return;
    }
  }

  let namesArray = [];
  for (const id of selectedUsers) {
    for (const user of allUsers) {
      if (user.id === id) {
        namesArray.push(`${user.id} ${user.name}`);
      }
    }
  }

  const confirmMessage = `${selectedUsers.length}명을 삭제하시겠습니까?\n\n` + namesArray.join("\n");

  if (!confirm(confirmMessage)) {
    return;
  }

  try {
    for (const id of selectedUsers) {
      /* TODO: 추후 notes, mirroring 등 연관 컬렉션 데이터 삭제 로직 추가 필요 */
      await deleteDoc(doc(db, "users", id));
    }

    alert("삭제 완료");
    selectedUsers = [];
    location.reload();
  } catch (error) {
    alert("삭제 중 오류가 발생했습니다.");
  }
};

/* 초기 로딩 실행 */
loadUsers();

</script>

</body>
</html>
