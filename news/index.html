<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#27ae60">
<meta name="description" content="코딩과 함께라면의 새로운 소식을 확인하세요.">
<title>소식 | 코딩과 함께라면</title>
<link rel="icon" href="/logo1.png">
<style>
:root{color-scheme:light;--bg:#f4f7f4;--surface:#fff;--text:#17231b;--muted:#68766d;--green:#27ae60;--line:rgba(24,55,34,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;line-height:1.65}
a{color:inherit;text-decoration:none}.top{height:76px;padding:0 clamp(20px,7vw,100px);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.78);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.04em}.brand img{width:34px;height:34px;object-fit:contain}.back{font-size:14px;font-weight:750;color:var(--muted)}
main{width:min(900px,calc(100% - 40px));margin:0 auto;padding:76px 0 110px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.16em;color:#16834a}h1{font-size:clamp(42px,7vw,68px);letter-spacing:-.075em;line-height:1.05;margin:14px 0}.intro{color:var(--muted);margin:0 0 42px}.list{display:grid;gap:14px}.news-card{display:block;padding:25px 28px;border:1px solid var(--line);border-radius:22px;background:var(--surface);transition:transform .2s,border-color .2s,box-shadow .2s}.news-card:hover{transform:translateY(-3px);border-color:rgba(39,174,96,.45);box-shadow:0 14px 35px rgba(24,65,38,.08)}.meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:750}.dot{width:5px;height:5px;border-radius:50%;background:var(--green)}.news-card h2{font-size:22px;letter-spacing:-.045em;margin:11px 0 5px}.news-card p{margin:0;color:var(--muted);font-size:14px}.arrow{float:right;color:var(--green);font-size:20px;font-weight:800}.empty,.error{padding:30px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted)}footer{padding:25px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:600px){main{padding-top:55px}.news-card{padding:21px}.news-card h2{font-size:19px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/"><img src="/logo1.png" alt=""><span>코딩과 함께라면</span></a><a class="back" href="/">메인으로 ↗</a></header>
<main>
<div class="eyebrow">NEWS & UPDATES</div>
<h1>우리의 소식</h1>
<p class="intro">코딩과 함께라면에서 전하는 새로운 소식과 활동 기록입니다.</p>
<section id="newsList" class="list" aria-live="polite"><div class="empty">소식을 불러오는 중입니다.</div></section>
</main>
<footer>2026 코딩과 함께라면 | SINCE 2025</footer>
<script>
(async function(){
 const list=document.getElementById("newsList");
 try{
  const response=await fetch("/news/news.json",{cache:"no-store"});
  if(!response.ok) throw new Error("소식 목록을 불러오지 못했습니다.");
  const data=await response.json();
  const items=Array.isArray(data)?data:(Array.isArray(data.items)?data.items:[]);
  if(!items.length){list.innerHTML='<div class="empty">아직 등록된 소식이 없습니다.</div>';return;}
  list.replaceChildren();
  for(const item of items){
   if(!item||typeof item.slug!=="string") continue;
   const articleResponse=await fetch("/news/"+encodeURIComponent(item.slug)+"/index.html",{cache:"no-store"});
   if(!articleResponse.ok) continue;
   const html=await articleResponse.text();
   const doc=new DOMParser().parseFromString(html,"text/html");
   const title=doc.querySelector('meta[name="news-title"]')?.content||doc.title||item.slug;
   const summary=doc.querySelector('meta[name="news-summary"]')?.content||"";
   const date=doc.querySelector('meta[name="news-date"]')?.content||"";
   const card=document.createElement("a");
   card.className="news-card";
   card.href="/news/"+encodeURIComponent(item.slug)+"/";
   const meta=document.createElement("div");meta.className="meta";
   const dot=document.createElement("span");dot.className="dot";
   const dateText=document.createElement("span");dateText.textContent=date;
   meta.append(dot,dateText);
   const heading=document.createElement("h2");heading.textContent=title;
   const description=document.createElement("p");description.textContent=summary;
   const arrow=document.createElement("span");arrow.className="arrow";arrow.textContent="↗";
   card.append(meta,heading,description,arrow);list.append(card);
  }
  if(!list.children.length) list.innerHTML='<div class="empty">표시할 수 있는 소식이 없습니다.</div>';
 }catch(error){list.innerHTML='<div class="error">소식을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';console.error(error);}
})();
</script>

<script src="/script.js" defer></script>
</body>
</html>
