<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>코딩과 함께라면_로그인</title>
  <style>
    :root {
      --bg-color: #f0f0f0;
      --card-bg: #ffffff;
      --text-color: #111111;
      --sub-text: #666666;
      --input-bg: #f8fafc;
      --input-border: #e1e8ed;
      --input-focus-bg: #ffffff;
      --primary-color: #27ae60;
      --btn-bg: var(--primary-color);
      --btn-hover: color-mix(in srgb, var(--primary-color) 85%, black);
      --btn-text: #ffffff;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1E1E1E;
      --text-color: #FFFFFF;
      --sub-text: #AAAAAA;
      --input-bg: #2A2A2A;
      --input-border: #333333;
      --input-focus-bg: #1E1E1E;
      --btn-bg: var(--primary-color);
      --btn-hover: color-mix(in srgb, var(--primary-color) 85%, black);
      --btn-text: #FFFFFF;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Malgun Gothic', sans-serif;
      transition: background 0.2s, color 0.2s;
    }

    .card {
      background: var(--card-bg);
      color: var(--text-color);
      padding: 35px 30px;
      border-radius: 24px;
      text-align: center;
      width: 320px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--input-border);
      transition: background 0.2s, border 0.2s;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: var(--text-color);
    }

    h2 {
      font-size: 14px;
      margin-bottom: 25px;
      color: var(--sub-text);
      font-weight: normal;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      margin: 8px 0;
      border-radius: 16px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--primary-color);
      background: var(--input-focus-bg);
    }

    .pw-wrap {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .pw-wrap input {
      margin-right: 0;
    }

    .toggle {
      position: absolute;
      right: 15px;
      cursor: pointer;
      font-size: 16px;
      opacity: 0.6;
      transition: 0.2s;
      user-select: none;
    }

    .toggle:hover {
      opacity: 1;
    }

    button {
      position: relative;
      padding: 14px;
      margin-top: 15px;
      width: 100%;
      height: 50px;
      border-radius: 16px;
      border: none;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: filter 0.2s, background 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button:hover:not(:disabled) {
      filter: brightness(0.9);
    }

    button:disabled {
      cursor: default;
      opacity: 0.8;
    }

    /* 로딩 스피너 스타일 */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<div class="card">
  <h1>2026 코딩과 함께라면</h1>
  <h2>로그인</h2>

  <input id="id" placeholder="학번을 입력하세요.">

  <div class="pw-wrap">
    <input id="pw" type="password" placeholder="비밀번호를 입력하세요.">
    <span class="toggle" onclick="togglePw()">👁</span>
  </div>

  <button id="loginBtn" onclick="login()">로그인</button>
</div>

<script>
const AUTH_API = "https://25withcoding.trandonwebtoon.workers.dev/login";
const SETTINGS_KEY = "coding_with_ramen_settings";

function applyStoredSettings() {
  const saved = localStorage.getItem(SETTINGS_KEY);
  if (!saved) return;
  try {
    const settings = JSON.parse(saved);
    document.body.classList.toggle("dark-mode", Boolean(settings.darkMode));
    if (settings.primaryColor) {
      document.documentElement.style.setProperty("--primary-color", settings.primaryColor);
    }
  } catch (error) {
    console.error("설정 로드 실패", error);
  }
}

applyStoredSettings();

const params = new URLSearchParams(window.location.search);
const requestedRedirect = params.get("redirect") || "/";
const redirect = requestedRedirect.startsWith("/") && !requestedRedirect.startsWith("//")
  ? requestedRedirect
  : "/";

if (localStorage.getItem("userId") && localStorage.getItem("firebaseIdToken")) {
  location.replace(redirect);
}

window.togglePw = () => {
  const pw = document.getElementById("pw");
  pw.type = pw.type === "password" ? "text" : "password";
};

window.login = async () => {
  const idInput = document.getElementById("id");
  const pwInput = document.getElementById("pw");
  const loginBtn = document.getElementById("loginBtn");
  const id = idInput.value.trim();
  const password = pwInput.value;

  if (!id || !password) {
    alert("학번과 비밀번호를 입력하세요.");
    return;
  }

  loginBtn.disabled = true;
  loginBtn.innerHTML = '<div class="spinner"></div>';

  try {
    const response = await fetch(AUTH_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ studentId: id, password })
    });
    const result = await response.json().catch(() => ({}));

    if (!response.ok || !result.success || !result.idToken) {
      alert(result.error || "로그인에 실패했습니다. 학번과 비밀번호를 확인해 주세요.");
      return;
    }

    localStorage.setItem("userId", id);
    localStorage.setItem("firebaseIdToken", result.idToken);
    if (result.refreshToken) localStorage.setItem("firebaseRefreshToken", result.refreshToken);
    location.replace(redirect);
  } catch (error) {
    console.error("로그인 요청 실패", error);
    alert("로그인 서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.");
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "로그인";
  }
};

document.getElementById("id").addEventListener("keydown", event => {
  if (event.key === "Enter") window.login();
});
document.getElementById("pw").addEventListener("keydown", event => {
  if (event.key === "Enter") window.login();
});
</script>

</body>
</html>
