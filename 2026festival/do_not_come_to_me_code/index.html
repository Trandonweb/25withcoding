<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>코딩과 함께라면 - 버그 소탕 순발력 테스트</title><style>*{box-sizing:border-box}body{margin:0;background:#05060a;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:'Malgun Gothic','맑은 고딕',sans-serif}canvas{width:min(98vw,1400px);height:auto;aspect-ratio:4/3;border:2px solid #5dffb0;border-radius:12px;box-shadow:0 0 30px rgba(0,255,150,.22),inset 0 0 40px #000;background:#05070c;cursor:crosshair}</style></head><body><canvas id="gameCanvas" width="1000" height="750"></canvas><script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),W=1000,H=750,C={w:'#f5f7ff',b:'#05070c',r:'#ff3d5a',g:'#39ff9a',bl:'#4d7cff',y:'#ffe45c',p:'#a855f7',c:'#55e7ff',o:'#ff9f43'};
let state='START',score=0,lives=10,wave=1,bossNo=0,waveTime=0,spawnTimer=0,healTimer=0,spawnRate=55,boss=null,obstacles=[],items=[],particles=[],texts=[],rings=[],shake=0,flash=0;const player={x:500,y:375,r:31,speed:5};let keys=new Set(),mouseX=500,mouseY=375;
const mobs={1:{color:C.bl,r:24},2:{color:C.y,r:30},3:{color:C.r,r:35},4:{color:C.p,r:40},5:{color:C.o,r:45}};
function reset(){score=0;lives=10;wave=1;bossNo=0;waveTime=0;spawnTimer=0;healTimer=0;spawnRate=55;boss=null;obstacles=[];items=[];particles=[];texts=[];rings=[];player.x=W/2;player.y=H/2}
function particlesAt(x,y,color,n=15,p=3){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=Math.random()*p+1;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:25+Math.random()*25,max:50,color,size:2+Math.random()*4})}}function ring(x,y,color){rings.push({x,y,r:5,life:22,color})}function text(x,y,t,color=C.w){texts.push({x,y,t,color,life:55})}
function spawn(){let e=['top','bottom','left','right'][Math.floor(Math.random()*4)],r=Math.random(),maxClicks=wave===1?(r>.85?3:r>.5?2:1):wave===2?(r>.72?4:r>.35?2:1):(r>.62?5:r>.28?3:1),rad=mobs[maxClicks].r,x,y;if(e==='top'){x=Math.random()*W;y=-rad}else if(e==='bottom'){x=Math.random()*W;y=H+rad}else if(e==='left'){x=-rad;y=Math.random()*H}else{x=W+rad;y=Math.random()*H}return{x,y,r:rad,clicks:maxClicks,max:maxClicks,speed:1.7+Math.random()*1.7+wave*.15,phase:Math.random()*6.28}}
function spawnHeal(){if(lives>=10||items.length>=2)return;items.push({x:100+Math.random()*(W-200),y:180+Math.random()*(H-280),r:21,life:600,pulse:0})}function makeBoss(){let hp=35+bossNo*15;return{x:W/2,y:-120,r:bossNo===3?88:75,hp,max:hp,vy:1.2,dir:1,phase:0}}function beginWave(){state='PLAY';waveTime=0;spawnTimer=0;healTimer=0;spawnRate=Math.max(28,58-wave*7);obstacles=[];items=[];boss=null}function beginBoss(){bossNo=wave;boss=makeBoss();state='BOSS';obstacles=[];items=[];spawnTimer=0}
function update(){if(state==='PLAY'){waveTime++;spawnTimer++;healTimer++;if(spawnTimer>=spawnRate){obstacles.push(spawn());spawnTimer=0}if(healTimer>=480){spawnHeal();healTimer=0}if(waveTime>=900)beginBoss()}if(state==='BOSS'&&boss){boss.phase+=.03;if(boss.y<150)boss.y+=boss.vy;else{boss.x+=boss.dir*(1.5+bossNo*.25);if(boss.x<120||boss.x>W-120)boss.dir*=-1}spawnTimer++;healTimer++;if(spawnTimer>=Math.max(45,90-bossNo*12)){let o=spawn();o.x=boss.x;o.y=boss.y+60;obstacles.push(o);spawnTimer=0}if(healTimer>=540){spawnHeal();healTimer=0}}
if(state==='PLAY'||state==='BOSS'){let dx=(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0),dy=(keys.has('ArrowDown')||keys.has('KeyS')?1:0)-(keys.has('ArrowUp')||keys.has('KeyW')?1:0);if(dx||dy){let len=Math.hypot(dx,dy);player.x+=dx/len*player.speed;player.y+=dy/len*player.speed}player.x=Math.max(45,Math.min(W-45,player.x));player.y=Math.max(160,Math.min(H-45,player.y));for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i],dx=player.x-o.x,dy=player.y-o.y,d=Math.hypot(dx,dy);if(d){o.x+=dx/d*o.speed;o.y+=dy/d*o.speed}if(d<player.r+o.r){lives--;particlesAt(player.x,player.y,C.r,20,3);flash=8;shake=7;obstacles.splice(i,1);if(lives<=0)state='OVER'}}for(let i=items.length-1;i>=0;i--){let h=items[i];h.life--;h.pulse+=.12;if(Math.hypot(player.x-h.x,player.y-h.y)<player.r+h.r){let old=lives;lives=Math.min(10,lives+2);text(h.x,h.y-30,`HP +${lives-old}`,C.g);particlesAt(h.x,h.y,C.g,24,4);ring(h.x,h.y,C.g);items.splice(i,1);score+=30}else if(h.life<=0)items.splice(i,1)}}particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.life--});particles=particles.filter(p=>p.life>0);rings.forEach(r=>{r.r+=4;r.life--});rings=rings.filter(r=>r.life>0);texts.forEach(t=>{t.y-=.7;t.life--});texts=texts.filter(t=>t.life>0);shake*=.88;if(flash)flash--}
function background(){let g=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,680);g.addColorStop(0,'#111a2a');g.addColorStop(1,'#03050a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(90,150,190,.08)';for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
function playerDraw(){ctx.save();ctx.shadowBlur=20;ctx.shadowColor=C.g;ctx.fillStyle='#0b251b';ctx.beginPath();ctx.arc(player.x,player.y,39,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=C.g;ctx.lineWidth=4;ctx.stroke();ctx.fillStyle=C.g;ctx.beginPath();ctx.arc(player.x,player.y,20,0,6.28);ctx.fill();ctx.fillStyle=C.b;ctx.beginPath();ctx.arc(player.x-7,player.y-5,4,0,6.28);ctx.arc(player.x+7,player.y-5,4,0,6.28);ctx.fill();ctx.restore()}
function mobDraw(o){let m=mobs[o.max];ctx.save();ctx.translate(o.x,o.y);ctx.rotate(Math.sin(performance.now()/300+o.phase)*.12);ctx.shadowBlur=18;ctx.shadowColor=m.color;ctx.fillStyle=m.color;ctx.beginPath();ctx.arc(0,0,o.r,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=C.w;ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=o.max===1?C.w:C.b;ctx.font=`bold ${o.max>=4?25:28}px Malgun Gothic`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.clicks,0,1);ctx.restore()}
function healDraw(h){ctx.save();let p=Math.sin(h.pulse)*4;ctx.translate(h.x,h.y);ctx.shadowBlur=28;ctx.shadowColor=C.g;ctx.fillStyle='rgba(57,255,154,.22)';ctx.beginPath();ctx.arc(0,0,h.r+9+p,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=C.g;ctx.beginPath();ctx.arc(0,0,h.r,0,6.28);ctx.fill();ctx.fillStyle=C.b;ctx.fillRect(-5,-14,10,28);ctx.fillRect(-14,-5,28,10);ctx.strokeStyle=C.w;ctx.lineWidth=3;ctx.stroke();ctx.restore()}
function bossDraw(){if(!boss)return;ctx.save();ctx.translate(boss.x,boss.y);ctx.shadowBlur=30;ctx.shadowColor=C.p;ctx.fillStyle='#5b1a91';ctx.beginPath();ctx.roundRect(-boss.r,-boss.r,boss.r*2,boss.r*2,22);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=C.p;ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#180b25';ctx.beginPath();ctx.arc(0,0,50,0,6.28);ctx.fill();ctx.fillStyle=C.r;ctx.beginPath();ctx.arc(-19,-6,10,0,6.28);ctx.arc(19,-6,10,0,6.28);ctx.fill();ctx.restore();let bw=360,bh=22,bx=boss.x-bw/2,by=boss.y-boss.r-42;ctx.fillStyle='#161b29';ctx.fillRect(bx,by,bw,bh);ctx.fillStyle=C.r;ctx.fillRect(bx,by,bw*boss.hp/boss.max,bh);ctx.strokeStyle=C.w;ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);ctx.fillStyle=C.w;ctx.font='bold 20px Malgun Gothic';ctx.textAlign='center';ctx.fillText(`BOSS ${bossNo}  HP ${boss.hp}/${boss.max}`,boss.x,by-10)}
function hud(){ctx.fillStyle='rgba(7,12,22,.88)';ctx.fillRect(18,18,380,112);ctx.strokeStyle='rgba(85,231,255,.35)';ctx.strokeRect(18,18,380,112);ctx.textAlign='left';ctx.fillStyle=C.w;ctx.font='bold 25px Malgun Gothic';ctx.fillText(`SCORE  ${score}`,34,53);ctx.fillStyle=wave>=3?C.r:C.y;ctx.font='bold 22px Malgun Gothic';ctx.fillText(`WAVE ${wave}  ${state==='PLAY'?Math.ceil((900-waveTime)/60)+'s':'BOSS FIGHT'}`,34,92);ctx.fillStyle=C.w;ctx.font='bold 18px Malgun Gothic';ctx.textAlign='right';ctx.fillText(`SERVER HP  ${lives}/10`,W-25,78);for(let i=0;i<10;i++){let x=W-330+i*31;ctx.fillStyle=i<lives?C.r:'#242b39';ctx.fillRect(x,28,27,31);ctx.strokeStyle=i<lives?'#ff7185':'#394153';ctx.strokeRect(x,28,27,31)}}
function effects(){particles.forEach(p=>{ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.28);ctx.fill()});rings.forEach(r=>{ctx.globalAlpha=r.life/22;ctx.strokeStyle=r.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.28);ctx.stroke()});texts.forEach(t=>{ctx.globalAlpha=t.life/55;ctx.fillStyle=t.color;ctx.font='bold 22px Malgun Gothic';ctx.textAlign='center';ctx.fillText(t.t,t.x,t.y)});ctx.globalAlpha=1}
function story(lines,title){background();ctx.fillStyle='rgba(9,14,25,.95)';ctx.beginPath();ctx.roundRect(55,70,W-110,H-140,22);ctx.fill();ctx.strokeStyle='rgba(85,231,255,.55)';ctx.lineWidth=2;ctx.stroke();ctx.textAlign='left';ctx.fillStyle=C.c;ctx.font='bold 34px Malgun Gothic';ctx.fillText(title,95,140);ctx.font='25px Malgun Gothic';lines.forEach((s,i)=>{ctx.fillStyle=i===lines.length-1?C.y:C.w;ctx.fillText(s,95,210+i*72)})}
function end(){ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=state==='WIN'?C.g:C.r;ctx.font='bold 70px Malgun Gothic';ctx.fillText(state==='WIN'?'VICTORY!':'GAME OVER',W/2,310);ctx.fillStyle=C.w;ctx.font='29px Malgun Gothic';ctx.fillText(state==='WIN'?'3명의 보스를 모두 쓰러뜨렸습니다!':'서버가 파괴되었습니다...',W/2,375);ctx.font='23px Malgun Gothic';ctx.fillText(`최종 점수 ${score}  |  R: 다시 시작  M: 메뉴`,W/2,450)}
canvas.addEventListener('mousemove',e=>{let r=canvas.getBoundingClientRect();mouseX=(e.clientX-r.left)*W/r.width;mouseY=(e.clientY-r.top)*H/r.height});canvas.addEventListener('mousedown',e=>{if(e.button!==0)return;if(state==='START'&&mouseX>=360&&mouseX<=640&&mouseY>=430&&mouseY<=505){reset();state='STORY';return}if(state!=='PLAY'&&state!=='BOSS')return;if(state==='BOSS'&&boss&&Math.hypot(boss.x-mouseX,boss.y-mouseY)<boss.r){boss.hp--;score+=50;particlesAt(boss.x,boss.y,C.p,18,4);ring(boss.x,boss.y,C.p);shake=5;if(boss.hp<=0){score+=500;particlesAt(boss.x,boss.y,C.g,70,7);if(bossNo>=3)state='WIN';else{wave++;state='BOSS_CLEAR'}}return}for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i];if(Math.hypot(o.x-mouseX,o.y-mouseY)<o.r){o.clicks--;score+=o.clicks<=0?100:10;particlesAt(o.x,o.y,mobs[o.max].color,8,2.5);ring(o.x,o.y,mobs[o.max].color);if(o.clicks<=0)obstacles.splice(i,1);break}}});
window.addEventListener('keydown',e=>{keys.add(e.code);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)||e.code.startsWith('Key'))e.preventDefault();if(e.code==='Space'){if(state==='STORY')beginWave();else if(state==='BOSS_CLEAR')beginWave()}if((state==='OVER'||state==='WIN')&&e.code==='KeyR'){reset();state='STORY'}if((state==='OVER'||state==='WIN')&&e.code==='KeyM')state='START'});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());
function render(){ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);if(state==='START'){background();ctx.textAlign='center';ctx.shadowBlur=25;ctx.shadowColor=C.g;ctx.fillStyle=C.g;ctx.font='bold 60px Malgun Gothic';ctx.fillText('버그 소탕 순발력 테스트',W/2,260);ctx.shadowBlur=0;ctx.fillStyle=C.w;ctx.font='30px Malgun Gothic';ctx.fillText('WASD / 방향키로 서버를 움직이세요!',W/2,330);ctx.fillStyle=C.g;ctx.font='24px Malgun Gothic';ctx.fillText('💚 회복 아이템을 먹으면 HP +2',W/2,380);ctx.fillStyle='rgba(57,255,154,.12)';ctx.beginPath();ctx.roundRect(360,430,280,75,16);ctx.fill();ctx.strokeStyle=C.g;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=C.g;ctx.font='bold 31px Malgun Gothic';ctx.fillText('GAME START',W/2,477)}else if(state==='STORY')story(['평화롭던 코딩 세상에 버그 바이러스가 침공했다...','WASD 또는 방향키로 서버를 움직여라!','다가오는 버그를 클릭해서 제거하고 10칸의 체력을 지켜라!','초록색 ❤️ 회복 아이템을 먹으면 체력이 +2!','[스페이스바를 누르면 1웨이브 시작]'],'SYSTEM ALERT');else if(state==='BOSS_CLEAR')story([`BOSS ${bossNo} 격파!`,`다음 목표: WAVE ${wave} → BOSS ${wave}`,'더 빠르고 강한 버그가 등장합니다!','💚 회복 아이템으로 HP를 관리하세요!','[스페이스바를 눌러 다음 웨이브]'],'WAVE CLEAR');else if(state==='PLAY'||state==='BOSS'){background();items.forEach(healDraw);obstacles.forEach(mobDraw);if(state==='BOSS')bossDraw();playerDraw();hud();effects()}else{background();playerDraw();hud();effects();end()}ctx.restore();if(flash){ctx.fillStyle=`rgba(255,60,80,${flash/40})`;ctx.fillRect(0,0,W,H)}requestAnimationFrame(loop)}function loop(){update();render()}requestAnimationFrame(loop);
</script></body></html>
