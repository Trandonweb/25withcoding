name: Connect COBY markup renderer

on:
  push:
    paths:
      - '.github/workflows/coby-markup-connect.yml'

permissions:
  contents: write

jobs:
  connect-renderer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Connect COBY markup assets
        shell: python
        run: |
          from pathlib import Path

          path = Path('AI/index.html')
          text = path.read_text(encoding='utf-8')

          css_tag = '<link rel="stylesheet" href="coby-markup.css">'
          js_tag = '<script src="coby-markup.js"></script>'

          if css_tag not in text:
              marker = '<title>Coby AI</title>'
              if marker not in text:
                  raise SystemExit('Safe stop: Coby AI title marker was not found.')
              text = text.replace(marker, marker + '\n' + css_tag, 1)

          if js_tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Safe stop: </body> marker was not found.')
              text = text.replace(marker, js_tag + '\n\n' + marker, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit and push only if changed
        shell: bash
        run: |
          if git diff --quiet -- AI/index.html; then
            echo 'COBY loader lines are already connected.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI/index.html
          git commit -m 'fix: connect COBY markup renderer'
          git push