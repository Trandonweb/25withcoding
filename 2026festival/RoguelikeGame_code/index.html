<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>도트 로그라이크 - 고정 배경 버전</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {

      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
      gap: 20px;
      overflow-x: auto;
      
      /* 🌟 깃허브 Raw 이미지 경로 적용 (bg.png) */
      background-image: url('https://raw.githubusercontent.com/Trandonweb/25withcoding/main/25withcoding/2026festival/RoguelikeGame_code/bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* ℹ️ 왼쪽 가이드 & 사이드 메뉴 박스 (투명도 유지: rgba 0.5 적용) */

      background-color: rgba(255, 255, 255, 0.5); 
      border: 4px solid #009688;
      box-shadow: 0 0 20px rgba(0, 150, 136, 0.3);
      width: 300px;
      padding: 18px;
      text-align: left;
      font-size: 12px;
      line-height: 1.7;
      color: #111; 
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(2px); 
    }

    #howto-container h2 {
      font-size: 15px;
      color: #00796b;
      margin-top: 0;
      margin-bottom: 14px;
      text-shadow: 1px 1px #eee;
      border-bottom: 3px solid #009688;
      padding-bottom: 8px;
    }

    .guide-item { margin-bottom: 12px; font-weight: bold; }
    .guide-sym { font-size: 15px; margin-right: 6px; }

    .side-btn-container {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

      font-size: 12px;
      padding: 12px;
      text-align: center;
      border-width: 3px;
      border-style: solid;
      font-family: 'Press Start 2P', monospace;
      cursor: pointer;
      transition: 0.1s;
    }
    #btn-restart { background-color: rgba(224, 242, 241, 0.9); border-color: #009688; color: #00796b; }
    #btn-restart:hover:not(:disabled) { background-color: #009688; color: #fff; }

    #btn-save:hover:not(:disabled) { background-color: #e91e63; color: #fff; }
