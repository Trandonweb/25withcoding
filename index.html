    const app=initializeApp(firebaseConfig); const db=getFirestore(app);
    const SETTINGS_KEY="coding_with_ramen_settings"; const COBY_LIGHT_LOGO="/AI/COBY_AI_logo.png"; const COBY_DARK_LOGO="/AI/COBY_AI_logo_dark_mode.png";

    function avatarSvg(config={}){const c={...defaultSettings.avatarConfig,...(config||{})};const paths={code:'<path d="M39 40 27 56l12 16M73 40l12 16-12 16M63 34 49 78" fill="none" stroke="ICON" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>',terminal:'<rect x="25" y="29" width="62" height="54" rx="8" fill="none" stroke="ICON" stroke-width="6"/><path d="m39 45 10 9-10 9M57 64h16" fill="none" stroke="ICON" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>',cpu:'<rect x="34" y="34" width="44" height="44" rx="7" fill="none" stroke="ICON" stroke-width="6"/><rect x="45" y="45" width="22" height="22" rx="3" fill="none" stroke="ICON" stroke-width="4"/><path d="M44 22v12m12-12v12m12-12v12M44 78v12m12-12v12m12-12v12M22 44h12m-12 12h12m-12 12h12M78 44h12M78 56h12M78 68h12" stroke="ICON" stroke-width="4" stroke-linecap="round"/>',gamepad:'<path d="M35 42h42a15 15 0 0 1 14 19l-5 15a8 8 0 0 1-13 3L61 69H51L39 79a8 8 0 0 1-13-3l-5-15a15 15 0 0 1 14-19Z" fill="none" stroke="ICON" stroke-width="5" stroke-linejoin="round"/><path d="M36 51v14m-7-7h14m27-3h.1m8 8h.1" stroke="ICON" stroke-width="5" stroke-linecap="round"/>',rocket:'<path d="M56 73c-13-8-18-20-13-35 3-9 12-18 25-22 3 13-1 24-10 33M44 59 31 72l-2-16 12-8M57 69l-2 14 15-12 2-12" fill="none" stroke="ICON" stroke-width="5" stroke-linejoin="round"/><circle cx="61" cy="39" r="5" fill="none" stroke="ICON" stroke-width="4"/>',zap:'<path d="M61 18 32 59h21l-3 35 31-47H59l2-29Z" fill="ICON" stroke="ICON" stroke-linejoin="round"/>',star:'<path d="m56 19 11 23 25 3-18 17 5 25-23-13-23 13 5-25-18-17 25-3 11-23Z" fill="none" stroke="ICON" stroke-width="5" stroke-linejoin="round"/>',layers:'<path d="m56 22 34 18-34 18-34-18 34-18Zm-34 30 34 18 34-18M22 64l34 18 34-18" fill="none" stroke="ICON" stroke-width="5" stroke-linejoin="round"/>',music:'<path d="M68 69V27l21-5v42M68 37l21-5" fill="none" stroke="ICON" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="54" cy="72" rx=     function removeLogoBackground(image,threshold=45){const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});if(!ctx)return null;canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;ctx.drawImage(image,0,0);const data=ctx.getImageData(0,0,canvas.width,canvas.height),pixels=data.data,corners=[[0,0],[canvas.width-1,0],[0,canvas.height-1],[canvas.width-1,canvas.height-1]],backgrounds=corners.map(([x,y])=>{const i=(y*canvas.width+x)*4;return [pixels[i],pixels[i+1],pixels[i+2]]});for(let i=0;i<pixels.length;i+=4){const r=pixels[i],g=pixels[i+1],b=pixels[i+2],isBackground=backgrounds.some(([br,bg,bb])=>Math.sqrt((r-br)**2+(g-bg)**2+(b-bb)**2)<=threshold);if(isBackground)pixels[i+3]=0}ctx.putImageData(data,0,0);return canvas.toDataURL("image/png")}

    function syncSettingsUI(){const settings=getStoredSettings();const darkModeToggle=document.getElementById("darkModeToggle");const keepLoginToggle=document.getElementById("keepLoginToggle");if(darkModeToggle)darkModeToggle.checked=!!settings.darkMode;if(keepLoginToggle)keepLoginToggle.checked=!!settings.keepLogin;applySettings(settings)}
    window.toggleSetting=async function(key,value){const settings=getStoredSettings();settings[key]=value;saveStoredSettings(settings);applySettings(settings);const user=localStorage.getItem("userId");if(user){try{await setDoc(doc(db,"users",user),{settings:{[key]:value}},{merge:true})}catch(e){console.error("설정 동기화 실패",e)}}};
    window.changeThemeColor=async function(color){const settings=getStoredSettings();settings.primaryColor=color;saveStoredSettings(settings);applySettings(settings);const user=localStorage.getItem("userId");if(user){try{await setDoc(doc(db,"users",user),{settings:{primaryColor:color}},{merge:true})}catch(e){console.error("컬러 테마 동기화 실패",e)}}};
    applySettings(getStoredSettings());renderAvatar(getStoredSettings().avatarConfig);
    function go(path){location.href=path} window.go=go;
    function goPoint(){const user=localStorage.getItem("userId");location.href=user?"/상벌점/main.html":"/signin?redirect=/상벌점/main.html"} window.goPoint=goPoint;
    async function checkUserSettings(userId){const userRef=doc(db,"users",userId),snap=await getDoc(userRef);if(!snap.exists())return {};const data=snap.data(),firebaseSettings=data.settings||{},settings={darkMode:firebaseSettings.darkMode??defaultSettings.darkMode,primaryColor:firebaseSettings.primaryColor??defaultSettings.primaryColor,keepLogin:firebaseSettings.keepLogin??defaultSettings.keepLogin,avatarConfig:firebaseSettings.avatarConfig??defaultSettings.avatarConfig},updateData={};if(firebaseSettings.darkMode===undefined)updateData.darkMode=settings.darkMode;if(firebaseSettings.primaryColor===undefined)updateData.primaryColor=settings.primaryColor;if(firebaseSettings.keepLogin===undefined)updateData.keepLogin=settings.keepLogin;if(firebaseSettings.avatarConfig===undefined)updateData.avatarConfig=settings.avatarConfig;if(Object.keys(updateData).length>0)await setDoc(userRef,{settings:updateData},{merge:true});saveStoredSettings(settings);applySettings(settings);renderAvatar(settings.avatarConfig);return data}
    async function updateUI(){
      const user=localStorage.getItem("userId");
      const btn=document.getElementById("authBtn");
      const label=document.getElementById("authLabel");
      const studentNumber=document.getElementById("studentNumber");
      const dropdown=document.getElementById("profileDropdown");
      const signoutBtn=document.getElementById("signoutBtn");
      if(user){
        let data={};try{data=await checkUserSettings(user)||{}}catch(e){console.warn("사용자 정보 불러오기 실패",e)}
        const adminNav=document.getElementById("adminNavItem");
        if(adminNav)adminNav.hidden=!(data.role==="president"||data.role==="vice");const adminColumn=document.getElementById("adminDropdownColumn");if(adminColumn)adminColumn.hidden=!(data.role==="president"||data.role==="vice");
        const name=data.name||data.userName||data.username||data.displayName||data.studentName||"이름 미등록";
        btn.setAttribute("aria-label","프로필 메뉴 열기");
        label.textContent=(String(name).trim().replace(/\s+/g,"").slice(0,3)||"이름 미등록");
        studentNumber.textContent="";
        studentNumber.hidden=false;
        document.getElementById("profileAccountLabel").textContent="학번: "+user+" · 이름: "+name;
        const currentSettings=getStoredSettings();renderAvatar((data.settings&&data.settings.avatarConfig)||currentSettings.avatarConfig);
        btn.onclick=()=>{const open=dropdown.classList.toggle("open");btn.setAttribute("aria-expanded",String(open))};
        signoutBtn.hidden=false;
        signoutBtn.onclick=()=>{location.href="/signout?redirect=/"};
      }else{
        const adminNav=document.getElementById("adminNavItem");if(adminNav)adminNav.hidden=true;const adminColumn=document.getElementById("adminDropdownColumn");if(adminColumn)adminColumn.hidden=true;
        btn.setAttribute("aria-label","로그인");
        label.textContent="로그인";
        renderAvatar(getStoredSettings().avatarConfig);
        studentNumber.textContent="";
        studentNumber.hidden=true;
        document.getElementById("profileAccountLabel").textContent="로그인되어 있지 않습니다.";
        btn.onclick=()=>{location.href="/signin?redirect=/"};
        dropdown.classList.remove("open");
        signoutBtn.hidden=true;
      }
      document.addEventListener("click",event=>{if(!event.target.closest(".profile-menu-wrap")){dropdown.classList.remove("open");btn.setAttribute("aria-expanded","false")}});
      syncSettingsUI();
    }
    window.changePassword=async function(){const user=localStorage.getItem("userId");if(!user){alert("로그인 후 이용할 수 있습니다.");return}const currentPassword=document.getElementById("currentPassword").value,newPassword=document.getElementById("newPassword").value,confirmPassword=document.getElementById("confirmPassword").value,button=document.getElementById("passwordChangeBtn");if(!currentPassword||!newPassword||!confirmPassword){alert("현재 비밀번호와 새 비밀번호를 모두 입력하세요.");return}if(newPassword.length<6){alert("새 비밀번호는 6자 이상이어야 합니다.");return}if(newPassword!==confirmPassword){alert("새 비밀번호가 서로 일치하지 않습니다.");return}if(currentPassword===newPassword){alert("현재 비밀번호와 다른 비밀번호를 입력하세요.");return}button.disabled=true;button.textContent="확인 중...";try{const userRef=doc(db,"users",user),snap=await getDoc(userRef);if(!snap.exists()){alert("사용자 정보를 찾을 수 없습니다.");return}const data=snap.data();if(currentPassword!==data.password){alert("현재 비밀번호가 올바르지 않습니다.");return}await updateDoc(userRef,{password:newPassword});document.getElementById("currentPassword").value="";document.getElementById("newPassword").value="";document.getElementById("confirmPassword").value="";alert("비밀번호가 변경되었습니다.")}catch(e){console.error("비밀번호 변경 실패",e);alert("비밀번호 변경 중 오류가 발생했습니다.")}finally{button.disabled=false;button.textContent="비밀번호 변경"}};
    window.togglePasswordForm=function(){const setting=document.getElementById("passwordSetting"),toggle=setting.querySelector(".password-toggle"),isOpen=setting.classList.toggle("open");toggle.setAttribute("aria-expanded",String(isOpen))};
    updateUI().then(()=>{const attendanceBtn=document.getElementById("attendanceBtn");if(attendanceBtn)renderAttendanceButton(attendanceBtn).catch(e=>console.error("[ATTENDANCE] 홈 연동 실패",e));});
    const siteHeader=document.getElementById("siteHeader");const navRevealTrigger=document.getElementById("navRevealTrigger");let lastScrollY=window.scrollY,scrollTick=false;
    window.addEventListener("scroll",()=>{if(scrollTick)return;scrollTick=true;requestAnimationFrame(()=>{const currentY=window.scrollY;if(currentY<40)siteHeader.classList.remove("nav-hidden");else siteHeader.classList.add("nav-hidden");lastScrollY=currentY;scrollTick=false})},{passive:true});
    navRevealTrigger.addEventListener("mouseenter",()=>siteHeader.classList.remove("nav-hidden"));
    navRevealTrigger.addEventListener("click",()=>siteHeader.classList.remove("nav-hidden"));
    siteHeader.addEventListener("mouseenter",()=>siteHeader.classList.remove("nav-hidden"));

  </script>
<script>
  // One-time cleanup of legacy homepage caches/workers from older deployments.
  // Keep this scoped to known legacy cache names; never erase unrelated app data.
  const legacyCleanupKey = "25withcoding-legacy-homepage-cleanup-v1";
  if (!localStorage.getItem(legacyCleanupKey)) {
    (async () => {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          const legacyKeys = keys.filter(key => /^coding-club-v[12]$/.test(key));
          await Promise.all(legacyKeys.map(key => caches.delete(key)));
        }
        localStorage.setItem(legacyCleanupKey, "done");
      } catch (error) {
        console.warn("기존 홈페이지 캐시 정리 실패:", error);
      }
    })();
  }
</script>
