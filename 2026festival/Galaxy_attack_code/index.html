<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Galaxy Attack</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050814;color:#edf4ff;font-family:system-ui,'Noto Sans KR',sans-serif}body{display:grid;place-items:center}.game{width:100%;height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#17244c,#050814 65%)}header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-weight:800;letter-spacing:.08em}header span{font-size:12px;color:#a9bbef}canvas{display:block;width:100%;flex:1;min-height:0;touch-action:none}.help{text-align:center;padding:8px;font-size:12px;color:#9eacd0}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#030612b8;text-align:center;padding:20px}.overlay.hidden{display:none}.panel{max-width:420px;padding:30px;border:1px solid #5368a8;background:#101a35;border-radius:18px;box-shadow:0 20px 70px #0008}.panel h1{font-size:clamp(28px,6vw,48px);margin:0 0 8px;letter-spacing:.04em}.panel p{color:#c1ccef;line-height:1.6}.panel button{border:0;border-radius:9px;padding:12px 24px;background:#75a5ff;color:#071127;font-weight:900;font-size:16px;cursor:pointer}@media(max-width:600px){header{padding:8px 10px}.help{font-size:10px}}
</style></head><body><main class="game"><header><strong>GALAXY ATTACK</strong><span>점수 <b id="score">0</b>　목숨 <b id="lives">3</b></span></header><canvas id="game"></canvas><div class="help">이동: ← → 또는 A / D · 발사: SPACE · 모바일: 화면을 좌우로 드래그</div></main><div class="overlay" id="overlay"><div class="panel"><h1>GALAXY ATTACK</h1><p>몰려오는 적 함대를 격추하고 은하계를 지켜라.</p><p>← → 또는 A / D 로 이동, SPACE 로 발사</p><button id="start">게임 시작</button></div></div>
<script>
(()=>{const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),overlay=document.querySelector('#overlay'),startBtn=document.querySelector('#start');let w=0,h=0,player,bullets,enemies,stars,keys={},score=0,lives=3,running=false,last=0,spawn=0,frame=0,pointerX=null;
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);if(player)player.y=h-45}
window.addEventListener('resize',resize);function reset(){score=0;lives=3;bullets=[];enemies=[];stars=Array.from({length:90},()=>({x:Math.random()*w,y:Math.random()*h,s:Math.random()*1.8+.4,v:Math.random()*45+15}));player={x:w/2,y:h-45,r:13,cool:0};scoreEl.textContent=score;livesEl.textContent=lives;spawn=0;frame=0}
function start(){resize();reset();running=true;overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function end(){running=false;overlay.classList.remove('hidden');overlay.querySelector('h1').textContent='MISSION '+(lives?'COMPLETE':'FAILED');overlay.querySelector('p').textContent='최종 점수: '+score;startBtn.textContent='다시 시작'}
function shoot(){bullets.push({x:player.x,y:player.y-14,v:440});player.cool=.22}
function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.035);last=now;frame+=dt;ctx.clearRect(0,0,w,h);ctx.fillStyle='#050814';ctx.fillRect(0,0,w,h);ctx.fillStyle='#a9c7ff';for(const s of stars){s.y+=s.v*dt;if(s.y>h){s.y=0;s.x=Math.random()*w}ctx.globalAlpha=.35+s.s/3;ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.globalAlpha=1;
const speed=330;if(keys.ArrowLeft||keys.a||keys.A)player.x-=speed*dt;if(keys.ArrowRight||keys.d||keys.D)player.x+=speed*dt;if(pointerX!==null)player.x+=(pointerX-player.x)*Math.min(1,dt*9);player.x=Math.max(18,Math.min(w-18,player.x));player.cool-=dt;if((keys[' ']||keys.Space)&&player.cool<=0)shoot();
ctx.fillStyle='#80b5ff';ctx.beginPath();ctx.moveTo(player.x,player.y-17);ctx.lineTo(player.x-14,player.y+13);ctx.lineTo(player.x,player.y+7);ctx.lineTo(player.x+14,player.y+13);ctx.closePath();ctx.fill();ctx.fillStyle='#d8f3ff';ctx.fillRect(player.x-2,player.y-5,4,10);
for(const b of bullets){b.y-=b.v*dt;ctx.fillStyle='#8bf5ff';ctx.fillRect(b.x-2,b.y-8,4,12)}bullets=bullets.filter(b=>b.y>-15);
spawn-=dt;if(spawn<=0){const cols=Math.max(1,Math.min(8,Math.floor(w/55)));for(let i=0;i<cols;i++)if(Math.random()<.75)enemies.push({x:20+Math.random()*(w-40),y:-20-Math.random()*70,r:11+Math.random()*4,v:55+Math.random()*50+score*.025,hp:1});spawn=Math.max(.3,1.05-score/1500)}
for(const e of enemies){e.y+=e.v*dt;ctx.fillStyle='#ff668e';ctx.beginPath();ctx.moveTo(e.x,e.y-e.r);ctx.lineTo(e.x+e.r,e.y);ctx.lineTo(e.x+e.r*.55,e.y+e.r*.7);ctx.lineTo(e.x-e.r*.55,e.y+e.r*.7);ctx.lineTo(e.x-e.r,e.y);ctx.closePath();ctx.fill()}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];let hit=false;for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){bullets.splice(j,1);hit=true;break}}if(hit){enemies.splice(i,1);score+=10;scoreEl.textContent=score;continue}if(e.y>h+20){enemies.splice(i,1);lives--;livesEl.textContent=lives;if(lives<=0){end();return}}}
requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(!running&&e.key==='Enter')start()});window.addEventListener('keyup',e=>keys[e.key]=false);canvas.addEventListener('pointerdown',e=>{pointerX=e.clientX-canvas.getBoundingClientRect().left;keys[' ']=true});canvas.addEventListener('pointermove',e=>{if(e.buttons)pointerX=e.clientX-canvas.getBoundingClientRect().left});canvas.addEventListener('pointerup',()=>{pointerX=null;keys[' ']=false});startBtn.addEventListener('click',start);resize()})();
</script></body></html>
