<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020403">
<title>코딩과 함께라면 — Intro</title>
<style>
:root{--bg:#020304;--green:#27ae60;--white:#f7fbf9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020304;color:var(--white);font-family:"Segoe UI","Noto Sans KR",system-ui,sans-serif}
#intro{position:fixed;inset:0;background:#020304;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%}
.vignette{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.18) 65%,rgba(0,0,0,.88) 100%)}
.flash{position:absolute;inset:0;z-index:5;background:#fff;opacity:0;pointer-events:none}
#logoWrap{position:absolute;z-index:6;left:50%;top:50%;width:min(560px,78vw);transform:translate(-50%,-50%) scale(.78);opacity:0;filter:blur(15px) brightness(.7);text-align:center;pointer-events:none}
#logo{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.fallback{font-weight:800;font-size:clamp(30px,7vw,70px);letter-spacing:.08em;white-space:nowrap}.sub{margin-top:14px;font-size:11px;letter-spacing:.55em;color:rgba(255,255,255,.55)}
#caption{position:absolute;z-index:7;left:50%;top:calc(50% + min(25vw,190px));transform:translateX(-50%);font-size:9px;letter-spacing:.42em;color:rgba(255,255,255,.32);opacity:0;white-space:nowrap}
#start{position:absolute;z-index:10;left:50%;bottom:6vh;transform:translate(-50%,0);opacity:1;visibility:visible;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:12px 23px;background:rgba(255,255,255,.035);backdrop-filter:blur(12px);color:rgba(255,255,255,.8);cursor:pointer;transition:.7s}
#start.ready{animation:pulse 2.4s infinite}
#start:hover{border-color:rgba(39,174,96,.55);background:rgba(39,174,96,.09);transform:translate(-50%,-2px) scale(1.03)}
#blackout{position:absolute;inset:0;z-index:20;background:#000;opacity:0;pointer-events:none;transition:opacity .65s}
#blackout.active{opacity:1}
#intro.leave{opacity:0;visibility:hidden;transition:opacity .8s}
#main{position:fixed;inset:0;display:grid;place-items:center;background:#080a09;opacity:0;visibility:hidden;transition:.8s}
#main.visible{opacity:1;visibility:visible}.placeholder{padding:30px;text-align:center;border:1px solid rgba(255,255,255,.08);border-radius:22px;background:rgba(255,255,255,.025)}
@keyframes logoIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.78);filter:blur(15px) brightness(.7)}55%{opacity:1;filter:blur(0) brightness(1.55)}100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0) brightness(1)}}
@keyframes captionIn{to{opacity:1}}@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(39,174,96,0)}50%{box-shadow:0 0 30px rgba(39,174,96,.1)}}
@media(prefers-reduced-motion:reduce){#logoWrap{animation:none!important;opacity:1!important;transform:translate(-50%,-50%)!important;filter:none!important}.flash{display:none}}
.codePanel,.keyPanel{position:absolute;z-index:4;opacity:0;pointer-events:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em}.codePanel{left:6%;top:13%;width:min(330px,40vw);padding:13px 15px;border:1px solid rgba(80,210,255,.18);background:rgba(3,8,12,.24);box-shadow:0 0 28px rgba(60,180,255,.06),inset 0 0 20px rgba(80,170,255,.025);color:rgba(160,230,255,.72);font-size:11px;line-height:1.6}.keyPanel{right:6%;bottom:13%;width:min(255px,34vw);height:82px;padding:11px 13px;border:1px solid rgba(185,110,255,.18);background:rgba(10,5,18,.23);box-shadow:0 0 30px rgba(150,80,255,.06);color:rgba(220,185,255,.68);font-size:10px;line-height:1.55}.cursor{display:inline-block;width:6px;height:11px;background:currentColor;vertical-align:-2px;animation:blink .7s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style>
</head>
<body>
<section id="intro" aria-label="코딩과 함께라면 인트로">
<canvas id="scene" aria-hidden="true"></canvas>
<div class="vignette"></div><div class="codePanel" id="codePanel">const world = await coding();<br>light.create();<br>scene.enter();<br><span class="cursor"></span></div><div class="keyPanel" id="keyPanel">KEYBOARD INPUT<br><span style="opacity:.55">user@coby:~$</span> <span id="typed"></span><span class="cursor"></span></div>
<div class="flash"></div>
<div id="logoWrap">
<img id="logo" src="../logo_dark_mode_remove_bg.png" alt="코딩과 함께라면 로고">
<div class="fallback" style="display:none">코딩과 함께라면<div class="sub">WITH CODING</div></div>
</div>
<div id="caption">ENTER THE WORLD OF CODING</div>
<button id="start" type="button">재생하기</button>
<div id="blackout"></div>
</section>
<main id="main"><div class="placeholder"><h1>MAIN SCENE</h1><p>실제 작품에서는 인트로 후 다음 페이지로 이동합니다.</p></div></main>
<script>
const intro=document.getElementById("intro"),canvas=document.getElementById("scene"),ctx=canvas.getContext("2d"),logoWrap=document.getElementById("logoWrap"),logo=document.getElementById("logo"),caption=document.getElementById("caption"),start=document.getElementById("start"),blackout=document.getElementById("blackout"),main=document.getElementById("main"),flash=document.querySelector(".flash");
let W=innerWidth,H=innerHeight,dpr=1,raf,startTime=0,done=false;
const lights=[
 {color:[70,220,255],x:.10,y:.28,angle:.08,size:1.0},
 {color:[100,115,255],x:.82,y:.34,angle:2.85,size:.82},
 {color:[190,90,255],x:.22,y:.70,angle:-.14,size:.72},
 {color:[65,255,205],x:.77,y:.68,angle:3.20,size:.58}
];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
function glowLine(x1,y1,x2,y2,color,width,alpha){
 const g=ctx.createLinearGradient(x1,y1,x2,y2);
 g.addColorStop(0,"rgba("+color[0]+","+color[1]+","+color[2]+",0)");
 g.addColorStop(.35,"rgba("+color[0]+","+color[1]+","+color[2]+","+alpha+")");
 g.addColorStop(.7,"rgba("+color[0]+","+color[1]+","+color[2]+","+alpha+")");
 g.addColorStop(1,"rgba("+color[0]+","+color[1]+","+color[2]+",0)");
 ctx.save();ctx.lineCap="round";ctx.strokeStyle=g;ctx.lineWidth=width;ctx.shadowBlur=24;ctx.shadowColor="rgba("+color[0]+","+color[1]+","+color[2]+","+alpha+")";ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()
}
function drawScene(t){
 const e=t-startTime;
 ctx.fillStyle="#020304";ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation="lighter";
 const cx=W*(.5+.035*Math.sin(e*.00042)),cy=H*(.5+.028*Math.cos(e*.00055));
 // 0~1.6s: 아주 가까운 빛이 카메라 앞에서 깨어난다.
 const first=Math.min(1,e/1600);
 const pulse=Math.sin(first*Math.PI);
 const nearR=Math.min(W,H)*(.035+.055*first);
 const nearG=ctx.createRadialGradient(W*.5,H*.52,0,W*.5,H*.52,nearR*4.5);
 nearG.addColorStop(0,"rgba(190,250,255,"+(.10+.12*pulse)+")");
 nearG.addColorStop(.18,"rgba(65,220,255,"+(.07+.08*pulse)+")");
 nearG.addColorStop(1,"rgba(65,220,255,0)");
 ctx.fillStyle=nearG;ctx.beginPath();ctx.arc(W*.5,H*.52,nearR*4.5,0,Math.PI*2);ctx.fill();
 if(first>.22){
   const q=Math.min(1,(first-.22)/.78);
   const edge=W*(.05+.10*q);
   glowLine(W*.5-edge,H*.52-edge*.18,W*.5-edge*.34,H*.52-edge*.06,[65,220,255],1.1+1.1*q,.16+.16*q);
   glowLine(W*.5+edge,H*.52+edge*.18,W*.5+edge*.34,H*.52+edge*.06,[65,220,255],1.1+1.1*q,.16+.16*q);
 }
 // 0.7~3.8s: 카메라가 지나가는 작은 빛의 구조물들
 const structures=[
  [.08,.25,.18,.10,[65,220,255],1.0],
  [.88,.22,-.16,.13,[105,125,255],.85],
  [.18,.76,.20,-.10,[190,90,255],.75],
  [.83,.72,-.20,-.08,[65,255,205],.72],
  [.48,.12,.14,.06,[90,160,255],.62],
  [.57,.88,-.12,.05,[175,105,255],.58]
 ];
 if(e>520){
   const q=Math.min(1,(e-520)/3000);
   for(let i=0;i<structures.length;i++){
     const s=structures[i],delay=i*.16,a=Math.max(0,Math.min(1,(q-delay)*2.0));
     if(!a)continue;
     const pulse=1+.12*Math.sin(e*.003+i);
     const x=W*(s[0]+Math.sin(e*.00034+i*1.7)*.018),y=H*(s[1]+Math.cos(e*.00031+i)*.018);
     const len=(48+70*s[5])*a*pulse;
     glowLine(x-len*s[2],y-len*s[3],x+len*.52*s[2],y+len*.52*s[3],s[4],.75+1.25*s[5],a*.58);
     ctx.beginPath();ctx.arc(x,y,1.8+3*s[5],0,Math.PI*2);
     ctx.fillStyle="rgba("+s[4][0]+","+s[4][1]+","+s[4][2]+","+a*.78+")";
     ctx.shadowBlur=22;ctx.shadowColor="rgba("+s[4][0]+","+s[4][1]+","+s[4][2]+",.8)";ctx.fill();
   }
 }
 // 1.8~4.8s: 웅장함을 만드는 깊은 공간 프레임 — 많지만 길지 않게
 if(e>1800){
   const q=Math.min(1,(e-1800)/3000);
   const frames=[
    {x:.12,y:.40,w:.18,h:.22,c:[55,205,255],d:.0},
    {x:.86,y:.43,w:.20,h:.24,c:[105,110,255],d:.6},
    {x:.25,y:.18,w:.15,h:.14,c:[180,90,255],d:1.1},
    {x:.74,y:.80,w:.16,h:.13,c:[65,240,205],d:1.7}
   ];
   for(const f of frames){
     const a=Math.max(0,Math.min(1,(q-f.d*.12)*1.8));
     if(!a)continue;
     const drift=Math.sin(e*.0003+f.d)*22;
     const x=W*f.x+drift,y=H*f.y;
     const w=W*f.w*a,h=H*f.h*a;
     glowLine(x-w/2,y-h/2,x+w/2,y-h/2,f.c,1.18, a*.34);
     glowLine(x+w/2,y-h/2,x+w/2,y+h/2,f.c,1.18,a*.30);
     glowLine(x+w/2,y+h/2,x-w/2,y+h/2,f.c,1.18,a*.27);
     glowLine(x-w/2,y+h/2,x-w/2,y-h/2,f.c,1.0,a*.30);
   }
 }
 // 3.0~5.5s: 카메라가 구조물을 통과하는 순간, 짧은 주변 광선
 if(e>3000){
   const q=Math.min(1,(e-3000)/2500),speed=q*q;
   const cols=[[70,220,255],[105,120,255],[190,90,255],[65,255,205]];
   for(let i=0;i<10;i++){
     const ang=i*Math.PI*.2+.32;
     const side=(i%2?1:-1),r1=W*(.20+.035*i)*speed;
     const r2=r1+W*(.055+.018*Math.sin(i+e*.001));
     const x1=cx+Math.cos(ang)*r1,y1=cy+Math.sin(ang)*r1*.62;
     const x2=cx+Math.cos(ang)*r2,y2=cy+Math.sin(ang)*r2*.62;
     glowLine(x1,y1,x2,y2,cols[i%4],.55+speed*.9,.10+speed*.16);
   }
 }
 // 4.8~6.6s: 장면이 열리면서 모든 색이 중앙으로 연결
 if(e>4800){
   const q=Math.min(1,(e-4800)/1800),ease=q*q*(3-2*q);
   const beams=[
    [[-.05,.24],[.40,.45],[70,220,255]],
    [[1.05,.24],[.60,.45],[105,120,255]],
    [[.08,1.06],[.42,.64],[190,90,255]],
    [[.94,1.05],[.58,.64],[65,255,205]]
   ];
   for(const b of beams){
     const a=b[0],c=b[1],col=b[2];
     const ax=a[0]+(c[0]-a[0])*ease,ay=a[1]+(c[1]-a[1])*ease;
     glowLine(W*ax,H*ay,W*(c[0]+(a[0]-c[0])*.12*ease),H*(c[1]+(a[1]-c[1])*.12*ease),col,.8+2.5*ease,.17+.24*ease);
   }
 }
 // 6.0~7.7s: 중앙 수렴
 if(e>6000){
   const q=Math.min(1,(e-6000)/1700),ease=q*q*(3-2*q);
   const cols=[[70,220,255],[105,120,255],[190,90,255],[65,255,205]];
   for(let i=0;i<4;i++){
     const ang=i*Math.PI/2+.4,r=Math.max(12,W*.46*(1-ease));
     glowLine(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r*.65,cx+Math.cos(ang)*r*.10,cy+Math.sin(ang)*r*.065,cols[i],1.1+3.1*ease,.20+.32*ease);
   }
   ctx.beginPath();ctx.arc(cx,cy,8+28*ease,0,Math.PI*2);
   ctx.fillStyle="rgba(245,255,255,"+(.05+.31*ease)+")";ctx.shadowBlur=70;ctx.shadowColor="rgba(170,240,255,.9)";ctx.fill();
 }
 ctx.globalCompositeOperation="source-over";
 // 깊이감을 위한 아주 약한 중앙 비네트
 const vg=ctx.createRadialGradient(cx,cy,Math.min(W,H)*.08,cx,cy,Math.max(W,H)*.75);
 vg.addColorStop(0,"rgba(255,255,255,.018)");vg.addColorStop(1,"rgba(0,0,0,.20)");
 ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 if(e<1150){ctx.fillStyle="rgba(2,3,4,"+Math.max(0,1-e/1150)+")";ctx.fillRect(0,0,W,H)}
 if(e>7600&&!done){done=true;revealLogo()}
 if(e<12000)raf=requestAnimationFrame(drawScene);
}
function revealLogo(){
 const codePanel=document.getElementById("codePanel"),keyPanel=document.getElementById("keyPanel");
 codePanel.animate([{opacity:0,transform:"translateY(10px)"},{opacity:.78,transform:"translateY(0)"}],{duration:700,fill:"forwards"});
 keyPanel.animate([{opacity:0,transform:"translateY(10px)"},{opacity:.68,transform:"translateY(0)"}],{duration:700,delay:350,fill:"forwards"});
 flash.animate([{opacity:0},{opacity:.88},{opacity:0}],{duration:500,easing:"cubic-bezier(.2,.8,.2,1)"});
 logoWrap.style.animation="logoIn 1.05s cubic-bezier(.16,1,.3,1) forwards";
 caption.style.animation="captionIn .9s .7s forwards";
 setTimeout(()=>{start.disabled=false;start.textContent="작품으로 들어가기";start.style.opacity="1";start.style.visibility="visible";start.classList.add("ready")},2100);
}
logo.onerror=()=>{logo.style.display="none";logo.nextElementSibling.style.display="block"};
function nextUrl(){const n=new URLSearchParams(location.search).get("next");if(!n)return null;try{const u=new URL(n,location.origin);return u.origin===location.origin?u.pathname+u.search+u.hash:null}catch{return null}}
async function enter(){start.disabled=true;start.classList.remove("ready");blackout.classList.add("active");await new Promise(r=>setTimeout(r,620));const n=nextUrl();if(n){location.href=n;return}intro.classList.add("leave");main.classList.add("visible");cancelAnimationFrame(raf)}

// ── Procedural cinematic soundtrack ─────────────────────────────
let audioCtx=null,musicStarted=false,musicTimer=null,musicGain=null;
const NOTE={C:261.63,D:293.66,E:329.63,F:349.23,G:392,A:440,B:493.88};
function midi(n){return 440*Math.pow(2,(n-69)/12)}
function tone(freq,when,dur,type="sine",gain=.035,filter=1800){
 if(!audioCtx)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
 o.type=type;o.frequency.setValueAtTime(freq,when);
 f.type="lowpass";f.frequency.setValueAtTime(filter,when);f.Q.value=.5;
 g.gain.setValueAtTime(.0001,when);
 g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),when+.025);
 g.gain.exponentialRampToValueAtTime(.0001,when+dur);
 o.connect(f);f.connect(g);g.connect(musicGain);o.start(when);o.stop(when+dur+.04);
}
function sweep(when){
 if(!audioCtx)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type="sine";o.frequency.setValueAtTime(90,when);o.frequency.exponentialRampToValueAtTime(620,when+1.25);
 g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(.045,when+.55);g.gain.exponentialRampToValueAtTime(.0001,when+1.35);
 o.connect(g);g.connect(musicGain);o.start(when);o.stop(when+1.4);
}
function startMusic(){
 if(musicStarted)return;
 musicStarted=true;
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 audioCtx.resume();
 musicGain=audioCtx.createGain();musicGain.gain.value=.72;musicGain.connect(audioCtx.destination);
 const now=audioCtx.currentTime+.08;
 // Original progression: Dm → Bb → F → C
 const chords=[[50,53,57],[46,50,53],[41,45,48],[48,52,55]];
 const padDur=3.0;
 for(let bar=0;bar<4;bar++){
   const t=now+bar*padDur;
   chords[bar].forEach((n,i)=>{
     tone(midi(n),t,padDur*1.12,"sine",.025-i*.003,900);
     tone(midi(n+12),t+.04,padDur*1.05,"triangle",.012,1500);
   });
   tone(midi([38,34,29,36][bar]),t,padDur*.9,"triangle",.028,650);
 }
 // Rising pulse as the world opens
 for(let i=0;i<12;i++){
   const t=now+.55+i*.45;
   const n=[62,65,69,74][i%4]+(i>7?12:0);
   tone(midi(n),t,.34,"triangle",.018,.08?1200:1200);
 }
 // Bright convergence / logo reveal
 [62,69,74,81].forEach((n,i)=>tone(midi(n),now+5.55+i*.12,1.25,"sine",.035,2400));
 sweep(now+5.7);
 sweep(now+7.0);
 // A soft afterglow motif
 [74,77,81,86,81,77].forEach((n,i)=>tone(midi(n),now+8.15+i*.34,.55,"sine",.022,2200));
 // Keep it alive under the logo with a quiet loop.
 musicTimer=setTimeout(()=>{musicStarted=false;startMusic()},11000);
}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!startTime)beginIntro();else if(e.key==="Enter"&&start.classList.contains("ready"))enter()});const typed=document.getElementById("typed");let typedText="";document.addEventListener("keydown",ev=>{if(ev.key.length===1&&typedText.length<32){typedText+=ev.key;typed.textContent=typedText}else if(ev.key==="Backspace"){typedText=typedText.slice(0,-1);typed.textContent=typedText}});addEventListener("resize",resize);
resize();startTime=0;function beginIntro(){if(startTime)return;start.disabled=true;start.classList.remove("ready");start.style.opacity="0";start.style.visibility="hidden";startMusic();if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();startTime=performance.now();raf=requestAnimationFrame(drawScene)}start.addEventListener("click",beginIntro);
</script>
</body>
</html>
