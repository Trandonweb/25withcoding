<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coby AI</title>

<style>
*{box-sizing:border-box}

:root{
  --primary:#27ae60;
  --bg:#fff;
  --card:#f5f5f5;
  --text:#222;
  --sub:#777;
  --border:#ddd;
}

body{
  margin:0;
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

.header{
  height:64px;
  display:flex;
  align-items:center;
  padding:0 20px;
  position:relative;
  background:linear-gradient(to bottom,#eee,#fff);
  border-bottom:1px solid #eee;
}

.menu-btn{
  width:42px;
  height:42px;
  border-radius:12px;
  border:none;
  background:#fff;
  font-size:24px;
  cursor:pointer;
}

.logo{
  margin-left:15px;
  font-size:22px;
  font-weight:700;
  color:var(--primary);
}

.user-status{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  color:var(--sub);
}

.status-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#aaa;
}

.status-dot.connected{
  background:#27ae60;
}

.sidebar{
  position:fixed;
  left:-300px;
  top:0;
  width:300px;
  height:100vh;
  background:#fff;
  box-shadow:3px 0 20px rgba(0,0,0,.12);
  transition:.3s;
  z-index:10;
  display:flex;
  flex-direction:column;
}

.sidebar.open{
  left:0;
}

.side-top{
  padding:20px;
}

.side-btn{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border:none;
  border-radius:12px;
  background:#f5f5f5;
  text-align:left;
  font-size:15px;
  cursor:pointer;
}

.side-btn:hover{
  background:#eaeaea;
}

.side-title{
  margin-top:20px;
  margin-bottom:5px;
  font-size:13px;
  color:#777;
}

.chat-list{
  flex:1;
  overflow:auto;
  padding:10px 20px;
}

.chat-item{
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:4px;
}

.chat-item:hover{
  background:#f1f1f1;
}

.chat-item.active{
  background:#e8f5e9;
  color:#188b48;
}

.chat-title{
  font-size:14px;
  font-weight:600;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.chat-date{
  font-size:11px;
  color:#999;
  margin-top:4px;
}

.project-section{
  padding:10px 20px;
  border-top:1px solid #eee;
}

.project-title{
  font-size:13px;
  color:#777;
  margin-bottom:8px;
}

.project-item{
  padding:9px 10px;
  border-radius:9px;
  cursor:pointer;
  font-size:14px;
}

.project-item:hover{
  background:#f1f1f1;
}

.profile{
  margin:15px;
  padding:12px;
  border-radius:30px;
  background:#f3f3f3;
  display:flex;
  align-items:center;
  cursor:pointer;
}

.profile-circle{
  width:35px;
  height:35px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-right:10px;
  font-weight:bold;
}

.profile-info{
  display:flex;
  flex-direction:column;
}

.profile-name{
  font-weight:bold;
  font-size:14px;
}

.profile-id{
  font-size:11px;
  color:#888;
}

.main{
  height:calc(100vh - 64px);
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  overflow:auto;
  padding:30px max(20px,8vw);
}

.welcome{
  margin-top:100px;
  text-align:center;
}

.welcome h2{
  font-size:28px;
}

.welcome p{
  color:#666;
  font-size:16px;
}

.message{
  max-width:800px;
  margin:20px auto;
  padding:15px;
  border-radius:15px;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.6;
}

.ai{
  background:#f5f5f5;
}

.user{
  background:var(--primary);
  color:#fff;
  margin-left:auto;
}

.input-area{
  padding:20px;
  display:flex;
  justify-content:center;
}

.input-box{
  width:min(800px,90%);
  display:flex;
  background:#fff;
  border:1px solid #ddd;
  border-radius:25px;
  padding:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}

input{
  flex:1;
  border:none;
  outline:none;
  padding:12px;
  font-size:15px;
}

.send{
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
  font-size:18px;
}

.send:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.2);
  z-index:5;
}

.overlay.show{
  display:block;
}

.empty-chat{
  color:#999;
  text-align:center;
  padding:30px 10px;
  font-size:13px;
}

.project-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:30;
  align-items:center;
  justify-content:center;
}

.project-modal.show{
  display:flex;
}

.modal-box{
  width:min(420px,90%);
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 10px 40px rgba(0,0,0,.2);
}

.modal-box h3{
  margin-top:0;
}

.modal-box input{
  width:100%;
  border:1px solid var(--border);
  border-radius:12px;
  margin:10px 0;
}

.modal-buttons{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:15px;
}

.modal-buttons button{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.cancel-btn{
  background:#eee;
}

.create-btn{
  background:var(--primary);
  color:white;
}

@media(max-width:600px){
  .messages{
    padding:20px 12px;
  }

  .message{
    max-width:95%;
  }

  .user-status{
    display:none;
  }
}
</style>
</head>

<body>

<div class="header">
  <button class="menu-btn" onclick="openMenu()">☰</button>
  <div class="logo">🤖 Coby AI</div>

  <div class="user-status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">사용자 확인 중...</span>
  </div>
</div>

<div class="sidebar" id="sidebar">

  <div class="side-top">

    <button class="side-btn" onclick="newChat()">
      ＋ 새 채팅
    </button>

    <button class="side-btn" onclick="openProjectModal()">
      📁 새 프로젝트
    </button>

    <div class="side-title">
      최근 대화
    </div>

  </div>

  <div class="chat-list" id="chatList">
    <div class="empty-chat">
      대화를 불러오는 중...
    </div>
  </div>

  <div class="project-section">

    <div class="project-title">
      프로젝트
    </div>

    <div id="projectList">
      <div class="empty-chat">
        프로젝트가 없습니다.
      </div>
    </div>

  </div>

  <div class="profile">

    <div class="profile-circle" id="profileCircle">
      ?
    </div>

    <div class="profile-info">
      <div class="profile-name" id="profileName">
        사용자 확인 중...
      </div>

      <div class="profile-id" id="profileId">
        -
      </div>
    </div>

  </div>

</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="main">

  <div class="messages" id="messages">

    <div class="welcome" id="welcome">

      <h2>어서오세요!</h2>

      <p>
        무한한 상상의 나래를 펼쳐요 🚀<br>
        Coby가 당신의 코딩 여정을 함께합니다.
      </p>

    </div>

  </div>

  <div class="input-area">

    <div class="input-box">

      <input
        id="userInput"
        placeholder="Coby에게 무엇이든 물어보세요"
        autocomplete="off"
      >

      <button
        class="send"
        id="sendButton"
        onclick="sendMessage()"
      >
        ↑
      </button>

    </div>

  </div>

</div>

<div class="project-modal" id="projectModal">

  <div class="modal-box">

    <h3>새 프로젝트</h3>

    <input
      id="projectNameInput"
      placeholder="프로젝트 이름"
      maxlength="50"
    >

    <input
      id="projectDescriptionInput"
      placeholder="프로젝트 설명 (선택)"
      maxlength="200"
    >

    <div class="modal-buttons">

      <button
        class="cancel-btn"
        onclick="closeProjectModal()"
      >
        취소
      </button>

      <button
        class="create-btn"
        onclick="createProject()"
      >
        만들기
      </button>

    </div>

  </div>

</div>
<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  getDocs,
  addDoc,
  updateDoc,
  query,
  orderBy,
  limit,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


/*
========================================================
기존 서비스 Firebase
========================================================

여기는 로그인 / 사용자 정보를 담당하는 Firebase.

현재 네 사이트의 사용자 정보가 들어 있는 Firebase임.
========================================================
*/

const mainFirebaseConfig = {

  apiKey: "AIzaSyBgArbW8dArb8dO7OSYsTVEQtRHT049U20",

  authDomain:
    "points2026-f5e50.firebaseapp.com",

  projectId:
    "points2026-f5e50",

  storageBucket:
    "points2026-f5e50.firebasestorage.app",

  messagingSenderId:
    "248724251417",

  appId:
    "1:248724251417:web:02d85cdc4addac98069b88"

};


/*
========================================================
Coby Firebase
========================================================

여기는 Coby의 대화 / 프로젝트 / 메시지를 저장하는
전용 Firebase.

절대로 기존 사용자 DB와 섞지 않음.
========================================================
*/

const cobyFirebaseConfig = {

  apiKey:
    "AIzaSyAiO65YzYeRfuf6fCzosuW7OAVV47o47Js",

  authDomain:
    "coby-ai-328dd.firebaseapp.com",

  databaseURL:
    "https://coby-ai-328dd-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "coby-ai-328dd",

  storageBucket:
    "coby-ai-328dd.firebasestorage.app",

  messagingSenderId:
    "865530259286",

  appId:
    "1:865530259286:web:6feaa5781dc538700b18f7"

};


/*
========================================================
Firebase 초기화
========================================================
*/

const mainApp =
  initializeApp(
    mainFirebaseConfig,
    "mainApp"
  );

const cobyApp =
  initializeApp(
    cobyFirebaseConfig,
    "cobyApp"
  );


/*
기존 서비스 인증

주의:
Coby Firestore의 데이터는 별도 프로젝트에 저장하지만
사용자 확인은 기존 Firebase를 사용함.
*/

const mainAuth =
  getAuth(mainApp);


/*
Coby Firestore
*/

const db =
  getFirestore(cobyApp);


/*
========================================================
전역 상태
========================================================
*/

let currentUser = null;

let currentPersonId = null;

let currentPerson = null;

let currentConversationId = null;

let currentProjectId = null;

let currentProject = null;


/*
========================================================
UI 헬퍼
========================================================
*/

function setStatus(text, connected = false){

  document.getElementById(
    "statusText"
  ).textContent = text;

  const dot =
    document.getElementById("statusDot");

  dot.classList.toggle(
    "connected",
    connected
  );

}


function updateProfile(){

  const name =
    currentPerson?.name ||
    currentUser?.displayName ||
    "사용자";

  const schoolNumber =
    currentPerson?.schoolNumber ||
    currentPersonId ||
    "-";

  document.getElementById(
    "profileName"
  ).textContent = name;

  document.getElementById(
    "profileId"
  ).textContent =
    `학번 ${schoolNumber}`;

  document.getElementById(
    "profileCircle"
  ).textContent =
    name.charAt(0).toUpperCase();

}


/*
========================================================
사용자 정보 확인
========================================================

기존 Firebase 로그인 사용자를 기준으로
Coby 사용자 ID를 결정함.

우선순위:

1. Firestore users/{uid}
2. Firestore users/{학번}
3. Auth UID

현재 네 기존 DB 구조에 맞춰 나중에 정확한
필드명을 하나로 고정할 수 있음.
========================================================
*/

async function resolveCurrentPerson(user){

  if(!user){
    throw new Error(
      "로그인된 사용자가 없습니다."
    );
  }

  /*
  기존 users/{uid}
  */

  const uidRef =
    doc(
      getFirestore(mainApp),
      "users",
      user.uid
    );

  const uidSnap =
    await getDoc(uidRef);

  if(uidSnap.exists()){

    const data =
      uidSnap.data();

    const schoolNumber =
      data.schoolNumber ||
      data.studentId ||
      data.studentNumber ||
      data.studentNo ||
      data.id ||
      null;

    if(schoolNumber){

      return {
        id: String(schoolNumber),
        data
      };

    }

  }


  /*
  혹시 Auth UID 자체가 학번인 경우
  */

  if(/^\d{4,10}$/.test(user.uid)){

    return {
      id: user.uid,
      data: {
        name:
          user.displayName ||
          "사용자",

        schoolNumber:
          user.uid
      }
    };

  }


  /*
  마지막 fallback

  기존 서비스의 실제 사용자 문서 구조를
  확인하기 전까지는 UID를 사용.
  */

  return {

    id: user.uid,

    data: {

      name:
        user.displayName ||
        "사용자",

      schoolNumber:
        user.uid

    }

  };

}


/*
========================================================
Coby 사람 문서 생성
========================================================
*/

async function ensureCobyPerson(){

  if(!currentPersonId){
    return;
  }

  const personRef =
    doc(
      db,
      "people",
      currentPersonId
    );

  const snap =
    await getDoc(personRef);

  if(!snap.exists()){

    await setDoc(
      personRef,
      {

        name:
          currentPerson?.name ||
          currentUser?.displayName ||
          "사용자",

        schoolNumber:
          currentPersonId,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }
    );

  }else{

    currentPerson =
      snap.data();

  }

  updateProfile();

}
/*
========================================================
메시지 UI
========================================================
*/

function addMessage(
  text,
  type,
  messageId = null
){

  const messages =
    document.getElementById(
      "messages"
    );

  const message =
    document.createElement("div");

  message.className =
    `message ${type}`;

  message.textContent =
    text;

  if(messageId){

    message.dataset.messageId =
      messageId;

  }

  messages.appendChild(
    message
  );

  messages.scrollTop =
    messages.scrollHeight;

  return message;

}


/*
========================================================
채팅 화면 초기화
========================================================
*/

function clearMessages(){

  const messages =
    document.getElementById(
      "messages"
    );

  messages.innerHTML = "";

}


/*
========================================================
새 채팅
========================================================
*/

async function newChat(){

  currentConversationId =
    null;

  currentProjectId =
    null;

  currentProject =
    null;

  clearMessages();

  const welcome =
    document.createElement("div");

  welcome.className =
    "welcome";

  welcome.id =
    "welcome";

  welcome.innerHTML = `
    <h2>Coby와 새로운 대화를 시작해요!</h2>
    <p>
      무엇을 만들고 싶은지 이야기해주세요 🚀
    </p>
  `;

  document
    .getElementById("messages")
    .appendChild(welcome);

  closeMenu();

  document
    .getElementById("userInput")
    .focus();

}


/*
========================================================
대화 제목 생성
========================================================
*/

function createConversationTitle(text){

  let title =
    text.trim();

  if(title.length > 30){

    title =
      title.substring(0,30) +
      "...";

  }

  return title || "새 대화";

}


/*
========================================================
새 대화 Firestore 생성
========================================================
*/

async function createConversation(firstMessage){

  if(!currentPersonId){
    throw new Error(
      "사용자 정보가 없습니다."
    );
  }

  const conversationsRef =
    collection(
      db,
      "people",
      currentPersonId,
      "conversations"
    );

  const conversationRef =
    await addDoc(
      conversationsRef,
      {

        title:
          createConversationTitle(
            firstMessage
          ),

        projectId:
          currentProjectId || null,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }
    );

  currentConversationId =
    conversationRef.id;

  return currentConversationId;

}


/*
========================================================
메시지 저장
========================================================
*/

async function saveMessage(
  role,
  content
){

  if(
    !currentPersonId ||
    !currentConversationId
  ){

    return;

  }

  const messagesRef =
    collection(
      db,
      "people",
      currentPersonId,
      "conversations",
      currentConversationId,
      "messages"
    );

  await addDoc(
    messagesRef,
    {

      role,

      content,

      createdAt:
        serverTimestamp()

    }
  );


  /*
  대화 updatedAt 갱신
  */

  await updateDoc(
    doc(
      db,
      "people",
      currentPersonId,
      "conversations",
      currentConversationId
    ),
    {

      updatedAt:
        serverTimestamp()

    }
  );

}


/*
========================================================
최근 대화 불러오기
========================================================
*/

async function loadRecentConversations(){

  const list =
    document.getElementById(
      "chatList"
    );

  list.innerHTML = "";

  if(!currentPersonId){

    list.innerHTML =
      `<div class="empty-chat">
        로그인이 필요합니다.
      </div>`;

    return;

  }

  const ref =
    collection(
      db,
      "people",
      currentPersonId,
      "conversations"
    );

  const q =
    query(
      ref,
      orderBy(
        "updatedAt",
        "desc"
      ),
      limit(30)
    );

  const snapshot =
    await getDocs(q);

  if(snapshot.empty){

    list.innerHTML =
      `<div class="empty-chat">
        아직 대화가 없습니다.
      </div>`;

    return;

  }


  snapshot.forEach(
    conversationSnap => {

      const data =
        conversationSnap.data();

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "chat-item";

      item.dataset.id =
        conversationSnap.id;

      const title =
        data.title ||
        "제목 없는 대화";

      item.innerHTML = `
        <div class="chat-title">
          ${escapeHtml(title)}
        </div>
        <div class="chat-date">
          ${formatDate(data.updatedAt)}
        </div>
      `;

      item.onclick =
        () => loadConversation(
          conversationSnap.id
        );

      list.appendChild(item);

    }
  );

}


/*
========================================================
대화 불러오기
========================================================
*/

async function loadConversation(
  conversationId
){

  if(!currentPersonId){
    return;
  }

  currentConversationId =
    conversationId;

  const conversationRef =
    doc(
      db,
      "people",
      currentPersonId,
      "conversations",
      conversationId
    );

  const conversationSnap =
    await getDoc(
      conversationRef
    );

  if(!conversationSnap.exists()){
    return;
  }

  const conversation =
    conversationSnap.data();

  currentProjectId =
    conversation.projectId ||
    null;

  clearMessages();

  const messagesRef =
    collection(
      db,
      "people",
      currentPersonId,
      "conversations",
      conversationId,
      "messages"
    );

  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );

  const snapshot =
    await getDocs(
      messagesQuery
    );

  snapshot.forEach(
    messageSnap => {

      const data =
        messageSnap.data();

      addMessage(
        data.content || "",
        data.role === "user"
          ? "user"
          : "ai",

    )

}

========================================================
*/

async function loadProjects(){

  const list =
    document.getElementById(
      "projectList"
    );

  list.innerHTML = "";

  if(!currentPersonId){
    return;
  }

  const projectsRef =
    collection(
      db,
      "people",
      currentPersonId,
      "projects"
    );

  const snapshot =
    await getDocs(
      projectsRef
    );

  if(snapshot.empty){

    list.innerHTML =
      `<div class="empty-chat">
        프로젝트가 없습니다.
      </div>`;

    return;

  }

  snapshot.forEach(
    projectSnap => {

      const data =
        projectSnap.data();

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "project-item";

      item.textContent =
        `📁 ${data.name || "프로젝트"}`;

      item.onclick =
        () => selectProject(
          projectSnap.id,
          data
        );

      list.appendChild(item);

    }
  );

}

  if(!currentPersonId){

    );

  const projectsRef =
    collection(
      db,
      "people",
      currentPersonId,
      "projects"
    );

  const projectRef =
    await addDoc(
      projectsRef,
      {

        name,

        description,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }
    );

  currentProjectId =
    projectRef.id;

  currentProject = {

    name,

    description

  };

  closeProjectModal();

  await loadProjects();

}

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/*
========================================================
날짜 표시
========================================================
*/

function formatDate(timestamp){

  if(!timestamp){
    return "방금";
  }

  try{

    const date =
      timestamp.toDate();

    return date.toLocaleDateString(
      "ko-KR",
      {
        month:"numeric",
        day:"numeric"
      }
    );

  }catch{

    return "방금";

  }

}

/*
========================================================
Coby API
========================================================
*/

async function sendMessage(){

  const input =
    document.getElementById(
      "userInput"
    );

  const button =
    document.getElementById(
      "sendButton"
    );

  const text =
    input.value.trim();

  if(
    !text ||
    button.disabled
  ){

    return;

  }


  /*
  첫 메시지라면 새 대화 생성
  */

  if(!currentConversationId){

    try{

      await createConversation(
        text
      );

    }catch(error){

      console.error(
        "Conversation creation error:",
        error
      );

      alert(
        "대화를 저장할 수 없습니다."
      );

      return;

    }

  }


  /*
  화면에 사용자 메시지 표시
  */

  const welcome =
    document.getElementById(
      "welcome"
    );

  if(welcome){
    welcome.remove();
  }

  addMessage(
    text,
    "user"
  );


  /*
  Firebase에 사용자 메시지 저장
  */

  try{

    await saveMessage(
      "user",
      text
    );

  }catch(error){

    console.error(
      "User message save error:",
      error
    );

  }


  input.value = "";

  button.disabled = true;


  const thinking =
    addMessage(
      "Coby가 생각하고 있어요...",
      "ai"
    );


  /*
  프로젝트 컨텍스트 전달

  현재는 프로젝트 ID와 메시지만 전달.
  이후 프로젝트의 과거 대화를 가져와서
  Render API에 context로 전달할 수 있음.
  */

  const requestBody = {

    message:text,

    personId:
      currentPersonId,

    conversationId:
      currentConversationId,

    projectId:
      currentProjectId || null

  };


  try{

    const response =
      await fetch(
        "https://two5withcoding.onrender.com/chat",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              requestBody
            )

        }
      );


    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const data =
      await response.json();

    const answer =
      data.answer ||
      "응답이 없습니다.";


    thinking.textContent =
      answer;


    /*
    AI 응답 저장
    */

    await saveMessage(
      "assistant",
      answer
    );


    /*
    최근 대화 목록 갱신
    */

    await loadRecentConversations();


  }catch(error){

    console.error(
      "Coby API error:",
      error
    );

    thinking.textContent =
      "Coby 서버에 연결하지 못했어요. Render 서버의 /chat API를 확인해주세요.";

  }


  button.disabled = false;

  input.focus();

}

/*
========================================================
기존 Firebase 로그인 감시
========================================================

핵심 부분.

Coby 자체 로그인은 만들지 않고,
기존 points2026 Firebase의 로그인 상태를 사용함.
========================================================
*/

onAuthStateChanged(
  mainAuth,
  async user => {

    try{

      if(!user){

        currentUser = null;

        currentPersonId = null;

        setStatus(
          "로그인이 필요합니다.",
          false
        );

        document
          .getElementById(
            "profileName"
          )
          .textContent =
            "로그인 필요";

        document
          .getElementById(
            "profileId"
          )
          .textContent =
            "-";

        document
          .getElementById(
            "chatList"
          )
          .innerHTML =
            `<div class="empty-chat">
              기존 사이트에 로그인해주세요.
            </div>`;

        return;

      }


      currentUser =
        user;


      /*
      기존 Firebase 사용자 정보 확인
      */

      const resolved =
        await resolveCurrentPerson(
          user
        );


      currentPersonId =
        resolved.id;

      currentPerson =
        resolved.data;


      /*
      Coby DB의 people/{학번} 생성
      */

      await ensureCobyPerson();


      setStatus(
        `${currentPersonId} 로그인됨`,
        true
      );


      /*
      데이터 로딩
      */

      await loadRecentConversations();

      await loadProjects();


      updateProfile();


    }catch(error){

      console.error(
        "Coby initialization error:",
        error
      );

      setStatus(
        "사용자 정보를 불러오지 못했습니다.",
        false
      );

      console.error(error);

    }

  }
);

</script>
