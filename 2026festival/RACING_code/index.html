<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RACING</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0d;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}.hud{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 5px #000;font-size:18px}.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.82);padding:32px 40px;border-radius:20px;text-align:center;pointer-events:auto;min-width:300px}.panel h1{font-size:42px;margin:0 0 12px}.panel p{line-height:1.6;color:#ddd}.btn{border:0;border-radius:12px;padding:13px 26px;font-size:18px;font-weight:900;cursor:pointer}.hidden{display:none}.mobile{position:absolute;bottom:20px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}.mobile button{pointer-events:auto;border:1px solid #aaa;background:rgba(0,0,0,.35);color:#fff;border-radius:16px;height:65px;min-width:78px;font-weight:900;font-size:16px}.steer{display:flex;gap:10px}.steer button{font-size:30px;width:75px}.pedals{display:flex;gap:10px}.brake{background:rgba(180,40,40,.35)!important}.gas{background:rgba(30,150,70,.35)!important}.boost{background:rgba(30,100,190,.35)!important}@media(min-width:800px){.mobile{display:none}}</style></head>
<body><canvas id="game"></canvas><div id="ui"><div class="hud"><span id="score">DIST 0 m</span><span id="speed">0 km/h</span></div>
<div id="start" class="panel"><h1>🏎️ RACING</h1><p>운전자의 시점에서 자유롭게 조향하세요.<br>W/↑ 가속 · S/↓ 브레이크 · A/D 조향<br>SPACE 부스터</p><button class="btn" id="startBtn">START</button></div>
<div id="over" class="panel hidden"><h1>CRASH!</h1><p id="result">DIST 0 m</p><button class="btn" id="restartBtn">RESTART</button></div>
<div class="mobile"><div class="steer"><button id="left">◀</button><button id="right">▶</button></div><div class="pedals"><button class="brake" id="brake">BRAKE</button><button class="boost" id="boost">BOOST</button><button class="gas" id="gas">GAS</button></div></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,dpr,last=0,playing=false,dist=0,speed=0,boost=0,steer=0,accel=false,brake=false,keys={};
let car={x:0,heading:0};let traffic=[];let spawn=0;
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function roadPoint(depth,lane){let horizon=H*.40, t=1-depth, y=horizon+t*(H-horizon), roadW=80+t*t*W*1.05;return{x:W/2+lane*roadW*.34-car.x*roadW*.15,y,w:roadW}}
function road(){let horizon=H*.40;let grad=x.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#80a9c0');grad.addColorStop(.4,'#b9c6c8');grad.addColorStop(1,'#263126');x.fillStyle=grad;x.fillRect(0,0,W,H);x.fillStyle='#343638';x.beginPath();x.moveTo(W/2-42,horizon);x.lineTo(W/2+42,horizon);x.lineTo(W*1.03,H);x.lineTo(-W*.03,H);x.closePath();x.fill();
for(let i=0;i<18;i++){let z=(i/18+dist*.018)%1;let p=roadPoint(z,0);let yy=p.y;let half=p.w/2;x.fillStyle=i%2?'#fff':'#d33';x.fillRect(W/2-half,yy,half*.025,Math.max(2,5*(1-z)));x.fillRect(W/2+half-half*.025,yy,half*.025,Math.max(2,5*(1-z)))}
for(let lane=-.5;lane<=.5;lane+=1){x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=2;x.beginPath();let a=roadPoint(.98,lane),b=roadPoint(.02,lane);x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
function trafficCar(t){let p=roadPoint(t.z,t.lane);let s=.25+(1-t.z)*.85,w=54*s,h=90*s;x.save();x.translate(p.x,p.y-h/2);x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(0,h*.55,w*.65,7*s,0,0,Math.PI*2);x.fill();x.fillStyle=t.color;x.beginPath();x.roundRect(-w/2,-h/2,w,h,7*s);x.fill();x.fillStyle='#a9d9e8';x.fillRect(-w*.3,-h*.18,w*.6,h*.22);x.fillStyle='#ffdd65';x.fillRect(-w*.35,-h*.42,w*.18,5*s);x.fillRect(w*.17,-h*.42,w*.18,5*s);x.restore()}
function cockpit(){let v=ctx=>{};x.fillStyle='rgba(0,0,0,.28)';x.fillRect(0,H*.82,W,H*.18);x.fillStyle='#15181b';x.beginPath();x.moveTo(0,H);x.lineTo(W*.22,H*.84);x.lineTo(W*.39,H*.84);x.lineTo(W*.32,H);x.closePath();x.fill();x.beginPath();x.moveTo(W,H);x.lineTo(W*.78,H*.84);x.lineTo(W*.61,H*.84);x.lineTo(W*.68,H);x.closePath();x.fill();x.strokeStyle='#0b0d0f';x.lineWidth=18;x.beginPath();x.arc(W/2,H*1.03,Math.min(W,H)*.25,Math.PI*1.15,Math.PI*1.85);x.stroke();x.fillStyle='#222';x.fillRect(W/2-4,H*.88,8,H*.12)}
function draw(){x.clearRect(0,0,W,H);road();traffic.forEach(trafficCar);cockpit();if(boost>0){x.fillStyle='rgba(50,140,255,.16)';x.fillRect(0,0,W,H)} }
function reset(){dist=0;speed=0;boost=0;car.x=0;car.heading=0;traffic=[];spawn=.8}
function start(){reset();playing=true;document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden')}
function crash(){playing=false;document.getElementById('result').textContent='DIST '+Math.floor(dist)+' m';document.getElementById('over').classList.remove('hidden')}
function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;if(playing){let gas=accel||keys.w||keys.ArrowUp,br=brake||keys.s||keys.ArrowDown;let target=gas?26:0;if(br)target=0;speed+=(target-speed)*(br?7:2.2)*dt;speed-=speed*.06*dt;if(boost>0){speed+=32*dt;boost-=dt}speed=Math.max(0,Math.min(38,speed));let steerInput=(keys.a||keys.ArrowLeft?-1:0)+(keys.d||keys.ArrowRight?1:0)+steer;car.heading+=(steerInput*1.9-car.heading)*7*dt;car.x+=car.heading*speed*.0019;car.x*=.999;car.x=Math.max(-1.15,Math.min(1.15,car.x));dist+=speed*dt*.92;spawn-=dt;if(spawn<=0){traffic.push({z:.02,lane:(Math.random()*1.8-.9),color:['#1976d2','#e53935','#f5c542','#8e44ad'][Math.floor(Math.random()*4)]});spawn=Math.max(.35,1.1-speed*.018)}traffic.forEach(t=>t.z+=speed*dt*.025);traffic=traffic.filter(t=>t.z<1.05);for(const t of traffic)if(t.z>.86&&Math.abs(t.lane-car.x)<.25){crash();break}document.getElementById('score').textContent='DIST '+Math.floor(dist)+' m';document.getElementById('speed').textContent=Math.floor(speed*7.5)+' km/h'}draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){boost=1.4;e.preventDefault()}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);
function hold(id,fn){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();fn(true)};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();fn(false)}}hold('left',v=>steer=v?-1:0);hold('right',v=>steer=v?1:0);hold('gas',v=>accel=v);hold('brake',v=>brake=v);document.getElementById('boost').onpointerdown=e=>{e.preventDefault();boost=1.4};document.getElementById('startBtn').onclick=start;document.getElementById('restartBtn').onclick=start;requestAnimationFrame(loop);
</script></body></html>
