<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>출석체크 관리 | 코딩과 함께라면</title>
<style>
:root{--bg:#f0f0f0;--card:#fff;--text:#111;--primary:#27ae60;--muted:#777;--border:#e5e7eb}body.dark-mode{--bg:#121212;--card:#1e1e1e;--text:#fff;--border:#333;--muted:#aaa}*{box-sizing:border-box}body{margin:0;padding:24px;font-family:Arial,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back,.save,.remove{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer}.back{background:var(--card);color:var(--text)}.save{background:var(--primary);color:#fff}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.date{padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text)}.list{margin-top:14px;display:flex;flex-direction:column;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:12px}.muted{color:var(--muted);font-size:13px}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 8px}.empty{color:var(--muted);padding:8px 0}.remove{background:#eee;color:#333}.dark-mode .remove{background:#333;color:#fff}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><button class="back" onclick="location.href='/admin/'">← 관리자</button><h1>출석체크 관리</h1><span></span></div>
<div class="card"><h2>출석체크 운영</h2><p class="muted">매주 월·수·금 12:20~13:25에 열립니다. 대한민국 공휴일은 자동으로 제외되며, 아래에서 추가 휴무일을 지정할 수 있습니다.</p><div class="row"><input class="date" id="dateInput" type="date"><button class="save" id="addBtn">휴무일 추가</button></div></div>
<div class="card"><h2>추가 휴무일</h2><div id="list" class="list"><div class="empty">불러오는 중...</div></div></div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import{requireAdmin}from"./js/auth.js";
const firebaseConfig={apiKey:"AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",authDomain:"points2026-f5e50.firebaseapp.com",projectId:"points2026-f5e50"};
const db=getFirestore(initializeApp(firebaseConfig));
const ref=doc(db,"attendanceSettings","main");
const SETTINGS_KEY="coding_with_ramen_settings";
try{const s=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}");document.body.classList.toggle("dark-mode",!!s.darkMode);if(s.primaryColor)document.documentElement.style.setProperty("--primary",s.primaryColor)}catch(e){}
await requireAdmin();
let closedDates=[];
async function load(){const snap=await getDoc(ref);closedDates=snap.exists()?(snap.data().closedDates||[]):[];closedDates=[...new Set(closedDates)].sort();render()}
function render(){const el=document.getElementById("list");if(!closedDates.length){el.innerHTML='<div class="empty">추가로 지정된 휴무일이 없습니다.</div>';return}el.innerHTML=closedDates.map(d=>`<div class="item"><span>${d}</span><button class="remove" data-date="${d}">삭제</button></div>`).join("");el.querySelectorAll(".remove").forEach(b=>b.onclick=async()=>{closedDates=closedDates.filter(d=>d!==b.dataset.date);await setDoc(ref,{closedDates,updatedAt:new Date().toISOString()},{merge:true});render()})}
document.getElementById("addBtn").onclick=async()=>{const d=document.getElementById("dateInput").value;if(!d)return alert("날짜를 선택하세요.");if(closedDates.includes(d))return alert("이미 등록된 날짜입니다.");closedDates.push(d);closedDates.sort();await setDoc(ref,{closedDates,updatedAt:new Date().toISOString()},{merge:true});document.getElementById("dateInput").value="";render()};
load();
</script>
</body>
</html>
