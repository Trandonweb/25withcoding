<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>코딩과 함께라면 2026 Festival</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: sans-serif;
  background: #0f0f14;
  color: white;
}

/* =========================================
   Festival Gate
========================================= */

#festivalGate {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(0, 200, 83, 0.20),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(100, 221, 23, 0.18),
      transparent 35%
    ),
    #0f0f14;
}

.gate-card {
  width: min(420px, 100%);
  padding: 34px 28px;

  text-align: center;

  background: rgba(28, 28, 37, 0.96);

  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;

  box-shadow:
    0 25px 70px rgba(0,0,0,0.5);
}

.gate-icon {
  font-size: 52px;
  margin-bottom: 8px;
}

.gate-title {
  margin: 0;

  font-family: 'Black Han Sans', sans-serif;
  font-size: 32px;

  background: linear-gradient(
    90deg,
    #00c853,
    #64dd17
  );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.gate-description {
  margin: 14px 0 24px;

  color: #aaa;

  font-size: 14px;
  line-height: 1.7;
}

/* Gate input */

.gate-input {
  width: 100%;
  height: 50px;

  padding: 0 16px;

  border: 1px solid #3a3a45;
  border-radius: 13px;

  background: #15151c;
  color: white;

  outline: none;

  font-size: 15px;
  text-align: center;

  transition: 0.2s;
}

.gate-input::placeholder {
  color: #777;
}

.gate-input:focus {
  border-color: #00c853;

  box-shadow:
    0 0 0 3px rgba(0,200,83,0.12);
}

/* Gate buttons */

.gate-button {
  width: 100%;
  height: 50px;

  margin-top: 10px;

  border: none;
  border-radius: 13px;

  background: linear-gradient(
    90deg,
    #00c853,
    #64dd17
  );

  color: white;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;

  transition: 0.2s;
}

.gate-button:hover {
  filter: brightness(0.92);
  transform: translateY(-1px);
}

.gate-button:active {
  transform: translateY(0);
}

.gate-divider {
  display: flex;
  align-items: center;

  gap: 10px;

  margin: 18px 0;

  color: #666;

  font-size: 12px;
}

.gate-divider::before,
.gate-divider::after {
  content: "";

  flex: 1;

  height: 1px;

  background: #33333d;
}

.gate-error {
  min-height: 20px;

  margin-top: 10px;

  color: #ff7070;

  font-size: 13px;
}

.gate-loading {
  color: #aaa;
  font-size: 14px;
}

/* Gate hidden */

#festivalGate.hidden {
  display: none;
}

body.gate-open {
  overflow: hidden;
}


/* =========================================
   Home
========================================= */

.home-link {
  position: fixed;
  top: 18px;
  left: 20px;

  color: rgba(255,255,255,0.75);

  text-decoration: none;
  font-size: 13px;

  z-index: 1000;
}

.home-link:hover {
  color: white;
}


/* =========================================
   Header
========================================= */

header {
  text-align: center;

  padding: 12px 20px;

  font-family: 'Black Han Sans', sans-serif;

  font-size: 30px;

  background:
    linear-gradient(
      90deg,
      #00c853,
      #64dd17
    );

  color: white;

  box-shadow:
    0 4px 20px rgba(0,0,0,.3);
}


/* =========================================
   Subtitle
========================================= */

.subtitle {
  text-align: center;

  padding: 10px;

  color: #b8ffb8;

  font-size: 14px;

  line-height: 1.8;
}


/* =========================================
   Grid
========================================= */

.grid {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 20px;

  padding: 20px;
}


/* =========================================
   Mobile
========================================= */

@media (max-width: 768px) {

  .grid {
    grid-template-columns: 1fr;
  }

  header {
    font-size: 24px;
  }

  .gate-card {
    padding: 30px 22px;
  }

  .gate-title {
    font-size: 28px;
  }

}


/* =========================================
   Card
========================================= */

.card {
  background: #1c1c25;

  border-radius: 14px;

  overflow: hidden;

  cursor: pointer;

  transition: 0.2s;

  display: flex;

  flex-direction: column;
}

.card:hover {
  transform: scale(1.03);
}

.card img {
  width: 100%;

  aspect-ratio: 16 / 9;

  object-fit: cover;

  display: block;
}

.info {
  padding: 12px;

  display: flex;

  flex-direction: column;

  gap: 6px;

  flex: 1;
}

.title {
  font-weight: bold;

  font-size: 18px;
}

.desc {
  font-size: 13px;

  color: #bbb;

  height: 2.6em;

  overflow: hidden;
}

.likes {
  color: #64dd17;

  margin-top: auto;
}

.like-btn {
  margin-top: 8px;

  padding: 8px;

  border: none;

  border-radius: 6px;

  cursor: pointer;

  background: #00c853;

  color: white;

  font-weight: bold;
}
</style>
</head>

<body class="gate-open">


<!-- =========================================
     Festival Gate
========================================= -->

<div id="festivalGate">

  <div class="gate-card">

    <div class="gate-icon">
      🎉
    </div>

    <h1 class="gate-title">
      2026 FESTIVAL
    </h1>

    <div
      class="gate-description"
      id="gateDescription"
    >
      축제 입장 정보를 확인하고 있습니다...
    </div>


    <!-- 로그인하지 않은 경우 -->

    <div
      id="guestArea"
      style="display:none;"
    >

      <button
        class="gate-button"
        id="loginButton"
      >
        로그인하기
      </button>


      <div class="gate-divider">
        또는
      </div>


      <input
        id="accessCodeInput"
        class="gate-input"
        type="text"
        maxlength="30"
        placeholder="축제 이용 코드를 입력하세요"
        autocomplete="off"
      >


      <button
        class="gate-button"
        id="accessCodeButton"
      >
        코드로 입장
      </button>


      <div
        class="gate-error"
        id="gateError"
      ></div>

    </div>


    <!-- 로그인했지만 코드가 필요한 경우 -->

    <div
      id="memberCodeArea"
      style="display:none;"
    >

      <input
        id="memberAccessCodeInput"
        class="gate-input"
        type="text"
        maxlength="30"
        placeholder="축제 이용 코드를 입력하세요"
        autocomplete="off"
      >


      <button
        class="gate-button"
        id="memberAccessCodeButton"
      >
        코드로 입장
      </button>


      <div
        class="gate-error"
        id="memberGateError"
      ></div>

    </div>


    <div
      id="loadingArea"
      class="gate-loading"
    >
      확인 중...
    </div>

  </div>

</div>


<!-- =========================================
     Festival
========================================= -->

<a
  class="home-link"
  href="/"
>
  Home
</a>


<header>
  코딩과 함께라면 2026 Festival
</header>


<div
  class="subtitle"
  id="subtitle"
>
  <div>since 2025</div>

  <div>
    ❤️ 지금까지 0번의 응원이 도착했어요!
  </div>
</div>


<div
  class="grid"
  id="grid"
></div>


<script type="module">

/* =========================================
   Firebase
   Festival
========================================= */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";


import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  increment,
  getDoc
} from
"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


/* =========================================
   Festival Firebase
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9Q",

  authDomain:
    "festivallikes.firebaseapp.com",

  projectId:
    "festivallikes",

  storageBucket:
    "festivallikes.firebasestorage.app",

  messagingSenderId:
    "782245120700",

  appId:
    "1:782245120700:web:c61e16313e9ae688e6deb9"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


/* =========================================
   Login Firebase
========================================= */

const loginFirebaseConfig = {

  apiKey:
    "AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",

  authDomain:
    "points2026-f5e50.firebaseapp.com",

  projectId:
    "points2026-f5e50"

};


const loginApp =
  initializeApp(
    loginFirebaseConfig,
    "loginApp"
  );


const loginDB =
  getFirestore(loginApp);


/* =========================================
   Gate Elements
========================================= */

const festivalGate =
  document.getElementById(
    "festivalGate"
  );


const guestArea =
  document.getElementById(
    "guestArea"
  );


const memberCodeArea =
  document.getElementById(
    "memberCodeArea"
  );


const loadingArea =
  document.getElementById(
    "loadingArea"
  );


const gateDescription =
  document.getElementById(
    "gateDescription"
  );


const gateError =
  document.getElementById(
    "gateError"
  );


const memberGateError =
  document.getElementById(
    "memberGateError"
  );


/* =========================================
   Festival Enter
========================================= */

function enterFestival() {

  festivalGate.classList.add(
    "hidden"
  );

  document.body.classList.remove(
    "gate-open"
  );

}


/* =========================================
   Guest Gate
========================================= */

function showGuestGate() {

  loadingArea.style.display =
    "none";

  guestArea.style.display =
    "block";

  memberCodeArea.style.display =
    "none";

  gateDescription.textContent =
    "축제에 입장하려면 로그인하거나 이용 코드를 입력해주세요.";

}


/* =========================================
   Code Gate
========================================= */

function showCodeGate() {

  loadingArea.style.display =
    "none";

  guestArea.style.display =
    "none";

  memberCodeArea.style.display =
    "block";

  gateDescription.textContent =
    "로그인된 계정입니다. 축제 이용 코드를 입력해주세요.";

}


/* =========================================
   Login Button
========================================= */

document
  .getElementById(
    "loginButton"
  )
  .addEventListener(
    "click",
    () => {

      const redirect =
        encodeURIComponent(
          "/2026festival/"
        );

      location.href =
        `/signin/?redirect=${redirect}`;

    }
  );


/* =========================================
   Code
   현재는 다음 단계에서 Firebase
   accessCodes와 연결
========================================= */

document
  .getElementById(
    "accessCodeButton"
  )
  .addEventListener(
    "click",
    () => {

      gateError.textContent =
        "축제 이용 코드 시스템이 아직 연결되지 않았습니다.";

    }
  );


document
  .getElementById(
    "memberAccessCodeButton"
  )
  .addEventListener(
    "click",
    () => {

      memberGateError.textContent =
        "축제 이용 코드 시스템이 아직 연결되지 않았습니다.";

    }
  );


/* =========================================
   Enter Key
========================================= */

document
  .getElementById(
    "accessCodeInput"
  )
  .addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter"
      ) {

        document
          .getElementById(
            "accessCodeButton"
          )
          .click();

      }

    }
  );


document
  .getElementById(
    "memberAccessCodeInput"
  )
  .addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter"
      ) {

        document
          .getElementById(
            "memberAccessCodeButton"
          )
          .click();

      }

    }
  );


/* =========================================
   Check Member
========================================= */

async function checkFestivalAccess() {

  const userId =
    localStorage.getItem(
      "userId"
    );


  /*
   * 로그인하지 않은 경우
   */

  if (!userId) {

    showGuestGate();

    return;

  }


  try {

    /*
     * users/{학번}
     */

    const userRef =
      doc(
        loginDB,
        "users",
        userId
      );


    const userSnap =
      await getDoc(
        userRef
      );


    /*
     * 계정이 실제로 존재하지 않는 경우
     */

    if (
      !userSnap.exists()
    ) {

      localStorage.removeItem(
        "userId"
      );

      showGuestGate();

      return;

    }


    const userData =
      userSnap.data();


    /*
     * 부원 권한
     *
     * student = 부원
     * vice = 부회장
     * president = 회장
     *
     * 모두 프리패스
     */

    const isMember =
      userData.role === "student" ||
      userData.role === "vice" ||
      userData.role === "president";


    if (isMember) {

      enterFestival();

      return;

    }


    /*
     * 혹시 새로운 role이 생기면
     * 코드 인증으로 처리
     */

    showCodeGate();

  }

  catch (error) {

    console.error(
      "축제 입장 확인 오류:",
      error
    );

    loadingArea.textContent =
      "입장 정보를 확인하지 못했습니다.";

    gateDescription.textContent =
      "잠시 후 다시 시도해주세요.";

  }

}


/* =========================================
   Start Access Check
========================================= */

checkFestivalAccess();


/* =========================================
   Projects
========================================= */

const grid =
  document.getElementById(
    "grid"
  );


function loadProjects() {

  onSnapshot(
    collection(
      db,
      "projects"
    ),

    (snap) => {

      grid.innerHTML = "";

      let projects = [];


      snap.forEach(
        docSnap => {

          projects.push({

            id:
              docSnap.id,

            ...docSnap.data()

          });

        }
      );


      /* 응원 순 정렬 */

      projects.sort(
        (a, b) =>
          b.likes - a.likes
      );


      /* 총 응원 수 */

      const totalLikes =
        projects.reduce(
          (sum, p) =>
            sum + (p.likes || 0),
          0
        );


      document
        .getElementById(
          "subtitle"
        )
        .innerHTML = `

          <div>
            since 2025
          </div>

          <div>
            ❤️ 지금까지
            ${totalLikes.toLocaleString()}
            번의 응원이 도착했어요
          </div>

        `;


      /* 프로젝트 */

      projects.forEach(
        (p, index) => {

          const medal =

            index === 0
              ? "🥇 "

            : index === 1
              ? "🥈 "

            : index === 2
              ? "🥉 "

            : "";


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "card";


          card.innerHTML = `

            <img
              src="${p.thum}"
            >

            <div class="info">

              <div class="title">
                ${medal}${p.id}
              </div>

              <div class="desc">
                ${p.detail}
              </div>

              <div class="likes">
                ❤️ ${p.likes}
              </div>

              <button
                class="like-btn"
              >
                응원하기
              </button>

            </div>

          `;


          /* 카드 클릭 */

          card.onclick = () => {

            location.href =
              p.url;

          };


          /* 좋아요 */

          card
            .querySelector(
              ".like-btn"
            )
            .onclick =
            async (e) => {

              e.stopPropagation();


              await updateDoc(

                doc(
                  db,
                  "projects",
                  p.id
                ),

                {
                  likes:
                    increment(1)
                }

              );

            };


          grid.appendChild(
            card
          );

        }
      );

    }
  );

}


loadProjects();

</script>

</body>
</html>
