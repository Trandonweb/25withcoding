<div id="시작"><div class="패널"><h1>네온<br><span>전초기지</span></h1><p>훈련 구역에 진입하세요. 적을 조준하고 처치하며 살아남으세요.<br>아래 버튼을 누르면 마우스 조준이 활성화되고 게임이 시작됩니다.</p><div class="조작법"><div class="키"><b>W A S D</b> 이동</div><div class="키"><b>마우스</b> 조준</div><div class="키"><b>왼쪽 클릭</b> 발사</div><div class="키"><b>ESC</b> 마우스 해제</div></div><button id="시작버튼" type="button">게임 시작</button></div></div>
<div id="화면"><div class="상단"><div class="수치"><small>체력</small><span id="체력">100</span> / 100<div class="체력바"><div id="체력채움" class="체력채움"></div></div></div><div class="오른쪽">훈련 구역 01 // 진행 중<br>적 <strong id="적수">5</strong> &nbsp; 처치 <strong id="처치">0</strong></div></div><div class="조준점"><i></i></div><div id="메시지" class="메시지"></div><div class="어두운가장자리"></div><div class="상태">네온 전초기지 // 훈련 시뮬레이션</div></div>
<script type="module">

scene.add(new THREE.HemisphereLight(0xbfd9e6,0x11151a,1.6));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(10,22,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);

for(let i=0;i<10;i++){const x=(i%5)*9-18,z=Math.floor(i/5)*12-6;상자(x,1.3,z,2.3,2.6,2.3,new THREE.MeshStandardMaterial({color:0x34444d,roughness:.72}))}for(let i=0;i<8;i++){const a=i*Math.PI/4,x=Math.cos(a)*20,z=Math.sin(a)*20;const l=new THREE.PointLight(i%2?0xff526b:0x65f6ff,7,10);l.position.set(x,3,z);scene.add(l);상자(x,1.1,z,.3,2.2,.3,new THREE.MeshStandardMaterial({color:0x18242a,emissive:i%2?0x4d0712:0x06343b,emissiveIntensity:2}))}

controls.addEventListener('lock',()=>{if(게임시작)시작.style.display='none'});controls.addEventListener('unlock',()=>{if(!게임종료){시작.style.display='flex';게임시작=false}});

let 마지막=performance.now();function 반복(now){requestAnimationFrame(반복);const dt=Math.min((now-마지막)/1000,.05);마지막=now;if(controls.isLocked&&!게임종료){const d=new THREE.Vector3((키.KeyD?1:0)-(키.KeyA?1:0),0,(키.KeyS?1:0)-(키.KeyW?1:0));if(d.lengthSq())d.normalize();controls.moveRight(d.x*7*dt);controls.moveForward(d.z*7*dt);camera.position.x=THREE.MathUtils.clamp(camera.position.x,-25.5,25.5);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-25.5,25.5);for(const e of 적들){const dx=camera.position.x-e.position.x,dz=camera.position.z-e.position.z,거리=Math.hypot(dx,dz);e.userData.공격대기-=dt;if(거리>2.5){e.position.x+=dx/거리*1.3*dt;e.position.z+=dz/거리*1.3*dt}else if(e.userData.공격대기<=0){피해(8);e.userData.공격대기=1}e.lookAt(camera.position.x,1.1,camera.position.z)}생성시간-=dt;if(생성시간<=0&&적들.length<9){적생성();생성시간=3.5}}renderer.render(scene,camera)}requestAnimationFrame(반복);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
