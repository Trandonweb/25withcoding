<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>키 반응 대결 | MINI GAME</title>
<style>
*{box-sizing:border-box}:root{color-scheme:dark;--line:rgba(150,255,190,.18);--green:#53e88a}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,#17442c,transparent 42%),radial-gradient(ellipse at 100% 100%,#102d20,transparent 45%),#050b08;color:#f3fff6;font-family:Inter,'Noto Sans KR',Arial,sans-serif;display:grid;place-items:center;padding:20px}
.wrap{width:min(850px,100%);text-align:center}.top{display:flex;justify-content:space-between;color:#a9c5b2;font-size:12px;letter-spacing:.1em}.title{font-size:clamp(32px,6vw,52px);font-weight:900;letter-spacing:-.04em;margin:16px 0 8px}.timer{font-size:34px;font-weight:900}.score{display:flex;justify-content:center;gap:clamp(28px,8vw,80px);font-size:17px;font-weight:800;margin:16px 0 24px}.score span{display:block;font-size:42px;margin-top:4px}.arena{border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,#ffffff0c,#ffffff03);padding:clamp(22px,5vw,42px);box-shadow:0 22px 60px #0005}.instruction{color:#b8cdbf;line-height:1.8}.target{width:clamp(150px,30vw,230px);height:clamp(150px,30vw,230px);margin:22px auto;border-radius:32px;display:grid;place-items:center;background:linear-gradient(145deg,#35d779,#14884a);border:2px solid #a8ffc4;color:#052012;font-size:clamp(64px,12vw,100px);font-weight:950;box-shadow:0 0 55px #53e88a2b;user-select:none}.target.pulse{animation:pulse .22s ease}@keyframes pulse{50%{transform:scale(.94)}}.keyhelp{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:18px}.keyhelp span{border:1px solid var(--line);background:#ffffff08;padding:8px 12px;border-radius:10px;color:#d9f6e3;font-size:13px}.result{font-size:28px;font-weight:900;margin:22px 0;min-height:44px}.result small{display:block;font-size:14px;color:#b8cdbf;margin-top:7px}.done{border:0;border-radius:14px;padding:14px 28px;background:#1ea857;color:#fff;font-weight:800;font-size:17px;cursor:pointer}.done:hover{background:#2cc66a}.hidden{display:none!important}.note{color:#ffd98a;font-size:13px;margin-top:12px}
/* Responsive full-screen layout: keep the game inside the visible viewport. */
html{width:100%;height:100%;overflow:hidden}
body{width:100%;height:100dvh;min-height:0!important;overflow:hidden!important;padding:clamp(6px,1.2vh,14px)!important;overscroll-behavior:none}
.wrap{width:min(100%,1000px);max-height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:clamp(3px,0.7vh,8px);padding:0!important;margin:auto}
.wrap>*{flex-shrink:0}
h1,.heading h1{font-size:clamp(21px,4.2vh,42px)!important;line-height:1.08;margin:clamp(2px,0.5vh,7px) 0!important}
p,.sub,.desc,.help{font-size:clamp(11px,1.65vh,15px);line-height:1.35}
canvas{max-width:100%;max-height:43dvh;width:auto;height:auto;object-fit:contain;margin-block:clamp(3px,0.6vh,8px)!important}
button,.btn{padding:clamp(7px,1.2vh,12px) clamp(10px,2vw,18px);font-size:clamp(11px,1.6vh,15px)}
#message{min-height:0!important;margin:clamp(2px,0.4vh,6px) 0!important;font-size:clamp(11px,1.6vh,15px)}
.top{flex-shrink:0}
@media(max-width:650px){body{padding:6px!important}.wrap{width:100%;gap:3px}.heading{margin:4px 0 6px!important}.controls{grid-template-columns:1fr 1fr!important;gap:5px!important}.control{padding:6px!important}.control span{font-size:10px!important}.arena{padding:4px!important}.scores{margin:4px 0!important}.score{padding:5px 8px!important}.score strong{font-size:clamp(16px,3vh,22px)!important}.help{margin:4px 0!important}.bottom{gap:5px!important}}
@media(max-height:620px){canvas{max-height:35dvh}.heading{margin:3px 0 5px!important}.scores{margin:3px 0!important}.controls{gap:4px!important}.control{padding:5px 8px!important}.help{margin:3px 0!important}}

/* Refined MINI GAME interface */
:root{color-scheme:light;--mg-ink:#17251c;--mg-muted:#617166;--mg-green:#187447;--mg-line:#dbe5dc}
body{background:#f2f5f1!important;color:var(--mg-ink)!important;font-family:Inter,'Noto Sans KR',system-ui,sans-serif!important}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 0% 0%,#dceee0 0,transparent 40%);z-index:-1}
.wrap{color:var(--mg-ink)!important}
.top,.sub,.desc,.muted,.hint,.instruction,.info,.help,.round,.note{color:var(--mg-muted)!important}
.arena,.setting,.summary,.history,.card,.score,.keyhelp span{background:#fff!important;color:var(--mg-ink)!important;border:1px solid var(--mg-line)!important;box-shadow:0 12px 35px #203b2810!important}
.card{border-radius:16px!important}
button,.btn,.next,.done,.resultBtn{background:#187447!important;color:#fff!important;border:1px solid #187447!important;border-radius:11px!important;font-weight:750!important}
button:disabled{opacity:.42!important}
button:hover,.btn:hover,.next:hover,.done:hover{background:#12613a!important;box-shadow:0 7px 18px #18744722!important}
input{background:#fff!important;color:var(--mg-ink)!important;border:1px solid #cbd8cd!important}
.cell{background:#e8eee9!important;border:1px solid #d5e0d7!important}
.cell.me,.p1{background:#2e9b5c!important}.cell.opp,.p2{background:#edbd56!important}
.icon{display:none!important}
#miniSoundPanel button{background:#fff!important;color:#23412d!important;border:1px solid #d4e0d5!important;box-shadow:0 4px 14px #0001!important}
@media(max-width:650px){.card .desc{display:none!important}#projectShortDescription,#projectCreator{display:block!important}.wrap{padding:0!important}}
</style></head><body><main class="wrap"><div class="top"><span>MINI GAME / 03</span><span id="mode"></span><span id="round"></span></div><div class="title">키 반응 대결</div><div class="timer" id="timer">10.0</div><div class="score"><div><span id="meLabel">플레이어</span><span id="me">0</span></div><div><span id="oppLabel">컴퓨터</span><span id="opp">0</span></div></div><section class="arena"><div class="instruction" id="instruction">중앙에 표시되는 키를 가장 먼저 입력하세요.</div><div class="target" id="target">W</div><div class="instruction" id="subInstruction">표시된 키를 누르면 점수가 올라갑니다.</div><div class="keyhelp" id="keyhelp"><span>W</span><span>A</span><span>S</span><span>D</span></div></section><div class="note hidden" id="note">온라인 상대 입력은 연결 후 반영됩니다.</div><div class="result" id="result"></div><button class="done hidden" id="done">결과 확인 →</button></main>
<script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu',modeName:'컴퓨터와 대전'},mode=s.mode||'cpu';
let me=0,opp=0,playing=true,start=performance.now(),ai=null,targetKey='ArrowUp',roundLocked=false;
const target=document.getElementById('target'),keys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'],arrowText={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'},wasd={ArrowUp:'w',ArrowDown:'s',ArrowLeft:'a',ArrowRight:'d'};
document.getElementById('round').textContent=s.round? s.round+'번째 게임':'';
if(mode==='local'){document.getElementById('meLabel').textContent='1P';document.getElementById('oppLabel').textContent='2P';document.getElementById('instruction').textContent='중앙의 같은 키를 먼저 누르는 사람이 점수를 얻습니다.';document.getElementById('subInstruction').textContent='표시된 방향키를 누르세요. (1P: WASD도 가능)';document.getElementById('keyhelp').innerHTML='<span>↑ 위</span><span>↓ 아래</span><span>← 왼쪽</span><span>→ 오른쪽</span>';}
else {document.getElementById('instruction').textContent='중앙에 표시되는 키를 컴퓨터보다 먼저 입력하세요.';document.getElementById('subInstruction').textContent='표시된 키를 누르면 점수가 올라갑니다.';document.getElementById('keyhelp').innerHTML='<span>↑ 위</span><span>↓ 아래</span><span>← 왼쪽</span><span>→ 오른쪽</span>';}
document.getElementById('mode').textContent=s.modeName||'컴퓨터와 대전';
if(mode==='online')document.getElementById('note').classList.remove('hidden');
function randomize(){targetKey=keys[Math.floor(Math.random()*keys.length)];target.textContent=arrowText[targetKey];target.classList.remove('pulse');void target.offsetWidth;target.classList.add('pulse');roundLocked=false}
function award(w){if(!playing||roundLocked)return;roundLocked=true;if(w==='me')me++;else opp++;document.getElementById(w==='me'?'me':'opp').textContent=w==='me'?me:opp;setTimeout(()=>{if(playing)randomize()},120)}
function key(e){if(!playing||roundLocked)return;if(mode==='local'){if(e.key===targetKey){e.preventDefault();award('opp')}else if(e.key.toLowerCase()===wasd[targetKey]){e.preventDefault();award('me')}}else if(e.key===targetKey){e.preventDefault();award('me')}}
document.addEventListener('keydown',key);
function cpu(){if(!playing||mode!=='cpu')return;const delay=350+Math.random()*750;ai=setTimeout(()=>{if(!playing)return;if(!roundLocked){award('opp')}cpu()},delay)}
if(mode==='cpu')cpu();
function tick(){if(!playing)return;const t=Math.max(0,10-(performance.now()-start)/1000);document.getElementById('timer').textContent=t.toFixed(1);if(t<=0){finish();return}requestAnimationFrame(tick)}
function finish(){if(!playing)return;playing=false;clearTimeout(ai);const w=me>opp?'me':me<opp?'opp':'draw';document.getElementById('result').innerHTML=(mode==='local'?(w==='me'?'1P 승':w==='opp'?'2P 승':'무승부'):(w==='me'?'승리':w==='opp'?'패배':'무승부'))+'<small>최종 점수 '+me+' : '+opp+'</small>';document.getElementById('done').classList.remove('hidden');localStorage.setItem('miniGameResult',JSON.stringify({game:' 키 반응 대결',winner:w,me,opp}))}
document.getElementById('done').onclick=()=>location.href='../index.html';
randomize();requestAnimationFrame(tick);
</script><div id="miniSoundPanel" style="position:fixed;right:14px;bottom:14px;z-index:9999"><button id="miniSoundToggle" type="button" aria-pressed="true" style="border:1px solid #ffffff35;border-radius:999px;padding:10px 14px;background:#10251a;color:#effff4;font:700 13px Arial,sans-serif;box-shadow:0 6px 22px #0006;cursor:pointer"> 소리 켜짐</button></div><script>(function(){let enabled=localStorage.getItem('miniGameSound')!=='off',audio=null,lastKeySound=0;const btn=document.getElementById('miniSoundToggle');function label(){btn.textContent=enabled?'소리 켜짐':'소리 꺼짐';btn.setAttribute('aria-pressed',String(enabled))}function sound(kind='ui'){if(!enabled)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audio=audio||new AC();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const seq=kind==='win'?[523,659,784]:kind==='score'?[660,880]:kind==='hit'?[220,165]:kind==='bounce'?[420]:kind==='jump'?[440,660]:kind==='key'?[330]:[520];seq.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='hit'?'triangle':'sine';o.frequency.setValueAtTime(hz,now+i*.075);g.gain.setValueAtTime(.0001,now+i*.075);g.gain.exponentialRampToValueAtTime(((kind==='ui'||kind==='key')?0.035:0.065),now+i*.075+.012);g.gain.exponentialRampToValueAtTime(.0001,now+i*.075+.11);o.connect(g);g.connect(audio.destination);o.start(now+i*.075);o.stop(now+i*.075+.12)})}catch(e){}}window.miniGameSound=sound;btn.addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('miniGameSound',enabled?'on':'off');label();if(enabled)sound('ui')});document.addEventListener('click',e=>{if(e.target.closest('#miniSoundPanel'))return;if(e.target.closest('button'))sound('ui')},true);document.addEventListener('keydown',e=>{if(e.repeat||!['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code))return;const now=performance.now();if(now-lastKeySound>75){sound('key');lastKeySound=now}},true);label()})();</script><script type="module" src="../online-sync.js"></script>
<script>
/* Tablet keyboard focus and automatic result display */
(function(){
  try{localStorage.removeItem('miniGameResult')}catch(e){}
  document.body.tabIndex=0;
  const focusGame=()=>{try{document.body.focus({preventScroll:true})}catch(e){document.body.focus()}};
  window.addEventListener('pageshow',()=>setTimeout(focusGame,100));
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('button,input,textarea,select'))focusGame()},{passive:true});
  const css=document.createElement('style');
  css.textContent='#mgAutoResult{position:fixed;inset:0;z-index:20000;display:none;place-items:center;padding:20px;background:#07110ddd;backdrop-filter:blur(10px)}#mgAutoResult .panel{width:min(460px,94vw);padding:30px;border:1px solid #b6f6ca;border-radius:24px;background:#f8fff9;color:#17251c;text-align:center;box-shadow:0 24px 80px #0005;font-family:Arial,sans-serif}#mgAutoResult .headline{font-size:clamp(34px,8vw,54px);font-weight:950;margin:12px 0}#mgAutoResult .detail{color:#617166;line-height:1.6}#mgAutoResult button{margin-top:22px;border:0;border-radius:12px;padding:14px 24px;background:#187447;color:white;font-weight:850;font-size:15px}#mgTabletPad{position:fixed;left:10px;bottom:10px;z-index:8000;display:flex;gap:6px;flex-wrap:wrap;max-width:85vw}#mgTabletPad button{touch-action:manipulation;min-width:44px;min-height:42px;padding:9px 12px;border:1px solid #b9d9c3;border-radius:12px;background:#f7fff8;color:#173d28;font-weight:850;box-shadow:0 4px 14px #0002}';
  document.head.appendChild(css);
  const overlay=document.createElement('div');overlay.id='mgAutoResult';
  overlay.innerHTML='<div class="panel"><div style="font-size:12px;font-weight:850;letter-spacing:.15em;color:#187447">MATCH RESULT</div><div class="headline" id="mgAutoHeadline">경기 종료</div><div class="detail" id="mgAutoDetail">최종 결과</div><button id="mgAutoBack">메뉴로 돌아가기</button></div>';
  document.body.appendChild(overlay);
  document.getElementById('mgAutoBack').onclick=()=>location.href='../index.html';
  let shown=false;

  function showResult(data){
    if(shown||!data||!data.winner)return;
    shown=true;
    const settings=JSON.parse(localStorage.getItem('miniGameSettings')||'null');document.getElementById('mgAutoHeadline').textContent=settings?.mode==='local'?(data.winner==='me'?'1P 승':data.winner==='opp'?'2P 승':'무승부'):(data.winner==='me'?'승리':data.winner==='opp'?'패배':'무승부');
    const score=data.me!==undefined||data.opp!==undefined?'최종 점수 '+(data.me??0)+' : '+(data.opp??0):'';
    document.getElementById('mgAutoDetail').textContent=[data.game||'미니게임',score].filter(Boolean).join(' · ');
    overlay.style.display='grid';
  }
  function checkResult(){let raw;try{raw=localStorage.getItem('miniGameResult')}catch(e){return}if(raw){try{showResult(JSON.parse(raw))}catch(e){}}}
  const originalSetItem=Storage.prototype.setItem;
  Storage.prototype.setItem=function(key,value){
    originalSetItem.call(this,key,value);
    if(key==='miniGameResult'){try{showResult(JSON.parse(value))}catch(e){}}
  };
  const observer=new MutationObserver(checkResult);
  observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','hidden','style']});
  // On-screen backup controls for touchscreen tablets
  const n=(location.pathname.match(/game([1-9])\.html/)||[])[1];
  const keys={'1':[['A','KeyA'],['L','KeyL']],'2':[['A','KeyA'],['L','KeyL']],'3':[['반응','Enter']],'5':[['점프','Space']],'6':[['위','ArrowUp'],['아래','ArrowDown'],['발사','Enter'],['방향','Space']],'7':[['왼쪽','KeyA'],['오른쪽','KeyD'],['발사','KeyS'],['P2 ←','ArrowLeft'],['P2 →','ArrowRight'],['P2 발사','ArrowDown']],'8':[['위','ArrowUp'],['아래','ArrowDown'],['시작','Enter']],'9':[['왼쪽','ArrowLeft'],['오른쪽','ArrowRight'],['점프','Space'],['P2 점프','ArrowUp']]};
  if(keys[n]){
    const pad=document.createElement('div');pad.id='mgTabletPad';
    keys[n].forEach(([label,code])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{focusGame();const key=(n==='3'&&label==='반응')?targetKey:code==='Space'?' ':code==='Enter'?'Enter':code.startsWith('Key')?code.slice(3).toLowerCase():code;document.dispatchEvent(new KeyboardEvent('keydown',{key,code,bubbles:true,cancelable:true}));if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyS'].includes(code))document.dispatchEvent(new KeyboardEvent('keyup',{key,code,bubbles:true,cancelable:true}))};pad.appendChild(b)});
    document.body.appendChild(pad);
  }
})();
</script>
</body></html>
