  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    import { renderAttendanceButton } from "/attendance.js";
    const firebaseConfig={apiKey:"AIzaSyBgOAO72ArW8dO7OSYsTVEQtRHT049U20",authDomain:"points2026-f5e50.firebaseapp.com",projectId:"points2026-f5e50"};
    const app=initializeApp(firebaseConfig); const db=getFirestore(app);
    const SETTINGS_KEY="coding_with_ramen_settings"; const COBY_LIGHT_LOGO="/AI/COBY_AI_logo.png"; const COBY_DARK_LOGO="/AI/COBY_AI_logo_dark_mode.png";
    const defaultSettings={darkMode:false,primaryColor:"#27ae60",keepLogin:true,avatarConfig:{skin:"#f2c6a0",hair:"short",shirt:"#27ae60",background:"#e7f7ed",accessory:"none"}};
    function getStoredSettings(){const saved=localStorage.getItem(SETTINGS_KEY);if(saved){try{return {...defaultSettings,...JSON.parse(saved)}}catch(e){return {...defaultSettings}}}return {...defaultSettings}}
    function saveStoredSettings(settings){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}
    function avatarSvg(config={}){const c={...defaultSettings.avatarConfig,...(config||{})};const hair=c.hair==="long"?'M38 49 Q30 18 50 14 Q72 8 82 30 L80 70 L69 70 L66 42 Q53 52 43 42 L43 70 L35 70 Z':c.hair==="curly"?'M35 39 Q28 17 43 17 Q49 5 59 14 Q73 8 78 23 Q88 31 79 43 L73 36 L43 36 Z':c.hair==="spiky"?'M36 34 L31 22 L43 26 L47 12 L56 23 L67 13 L69 27 L81 23 L77 43 Z':'M37 39 Q33 15 57 14 Q78 14 78 39 L70 32 Q55 40 43 32 Z';const accessory=c.accessory==="glasses"?'<g fill="none" stroke="#253047" stroke-width="2.5"><rect x="40" y="37" width="13" height="9" rx="3"/><rect x="61" y="37" width="13" height="9" rx="3"/><path d="M53 41h8"/></g>':c.accessory==="star"?'<path d="M76 12l2.5 5.5 6 .5-4.5 4 1.5 6-5.5-3-5.5 3 1.5-6-4.5-4 6-.5z" fill="#f5b82e"/>':'';return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112"><rect width="112" height="112" rx="56" fill="'+c.background+'"/><path d="M20 112 Q23 78 45 76 L67 76 Q89 80 92 112" fill="'+c.shirt+'"/><path d="M48 67h16v16H48z" fill="'+c.skin+'"/><ellipse cx="56" cy="46" rx="23" ry="28" fill="'+c.skin+'"/><path d="'+(c.hair==="long"?'M38 48 Q30 18 50 14 Q72 8 82 30 L80 70 L69 70 L66 42 Q53 52 43 42 L43 70 L35 70 Z':hair)+'" fill="#3a2b27"/><ellipse cx="47" cy="47" rx="2.2" ry="2.8" fill="#292524"/><ellipse cx="65" cy="47" rx="2.2" ry="2.8" fill="#292524"/><path d="M49 59 Q56 64 63 59" fill="none" stroke="#a9544a" stroke-width="2.5" stroke-linecap="round"/>'+accessory+'</svg>'} 
    function renderAvatar(config){const avatar=document.getElementById("profileAvatar");if(avatar)avatar.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(avatarSvg(config))}
    function removeLogoBackground(image,threshold=45){const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});if(!ctx)return null;canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;ctx.drawImage(image,0,0);const data=ctx.getImageData(0,0,canvas.width,canvas.height),pixels=data.data,corners=[[0,0],[canvas.width-1,0],[0,canvas.height-1],[canvas.width-1,canvas.height-1]],backgrounds=corners.map(([x,y])=>{const i=(y*canvas.width+x)*4;return [pixels[i],pixels[i+1],pixels[i+2]]});for(let i=0;i<pixels.length;i+=4){const r=pixels[i],g=pixels[i+1],b=pixels[i+2],isBackground=backgrounds.some(([br,bg,bb])=>Math.sqrt((r-br)**2+(g-bg)**2+(b-bb)**2)<=threshold);if(isBackground)pixels[i+3]=0}ctx.putImageData(data,0,0);return canvas.toDataURL("image/png")}
    function updateCobyLogo(darkMode){const logo=document.getElementById("cobyLogo");if(!logo)return;const target=darkMode?COBY_DARK_LOGO:COBY_LIGHT_LOGO;logo.dataset.source=target;const image=new Image();image.onload=()=>{if(darkMode){try{const processed=removeLogoBackground(image);if(processed){logo.src=processed;return}}catch(e){console.warn("COBY 로고 자동 배경제거 실패",e)}}logo.src=target};image.onerror=()=>{logo.src=target};image.src=target}
    function applySettings(settings){document.body.classList.toggle("dark-mode",!!settings.darkMode);if(settings.primaryColor)document.documentElement.style.setProperty("--primary-color",settings.primaryColor);document.querySelectorAll(".color-circle").forEach(circle=>circle.classList.toggle("selected",circle.getAttribute("data-color")===settings.primaryColor));updateCobyLogo(!!settings.darkMode)}
    function syncSettingsUI(){const settings=getStoredSettings();document.getElementById("darkModeToggle").checked=!!settings.darkMode;document.getElementById("keepLoginToggle").checked=!!settings.keepLogin;applySettings(settings)}
    window.toggleSetting=async function(key,value){const settings=getStoredSettings();settings[key]=value;saveStoredSettings(settings);applySettings(settings);const user=localStorage.getItem("userId");if(user){try{await setDoc(doc(db,"users",user),{settings:{[key]:value}},{merge:true})}catch(e){console.error("설정 동기화 실패",e)}}};
    window.changeThemeColor=async function(color){const settings=getStoredSettings();settings.primaryColor=color;saveStoredSettings(settings);applySettings(settings);const user=localStorage.getItem("userId");if(user){try{await setDoc(doc(db,"users",user),{settings:{primaryColor:color}},{merge:true})}catch(e){console.error("컬러 테마 동기화 실패",e)}}};
    applySettings(getStoredSettings());renderAvatar(getStoredSettings().avatarConfig);
    function go(path){location.href=path} window.go=go;
    function goPoint(){const user=localStorage.getItem("userId");location.href=user?"/상벌점/main.html":"/signin?redirect=/상벌점/main.html"} window.goPoint=goPoint;
    async function checkUserSettings(userId){const userRef=doc(db,"users",userId),snap=await getDoc(userRef);if(!snap.exists())return {};const data=snap.data(),firebaseSettings=data.settings||{},settings={darkMode:firebaseSettings.darkMode??defaultSettings.darkMode,primaryColor:firebaseSettings.primaryColor??defaultSettings.primaryColor,keepLogin:firebaseSettings.keepLogin??defaultSettings.keepLogin,avatarConfig:firebaseSettings.avatarConfig??defaultSettings.avatarConfig},updateData={};if(firebaseSettings.darkMode===undefined)updateData.darkMode=settings.darkMode;if(firebaseSettings.primaryColor===undefined)updateData.primaryColor=settings.primaryColor;if(firebaseSettings.keepLogin===undefined)updateData.keepLogin=settings.keepLogin;if(firebaseSettings.avatarConfig===undefined)updateData.avatarConfig=settings.avatarConfig;if(Object.keys(updateData).length>0)await setDoc(userRef,{settings:updateData},{merge:true});saveStoredSettings(settings);applySettings(settings);renderAvatar(settings.avatarConfig);return data}
    async function updateUI(){
      const user=localStorage.getItem("userId");
      const btn=document.getElementById("authBtn");
      const label=document.getElementById("authLabel");
      const studentNumber=document.getElementById("studentNumber");
      const dropdown=document.getElementById("profileDropdown");
      const signoutBtn=document.getElementById("signoutBtn");
      if(user){
        let data={};try{data=await checkUserSettings(user)||{}}catch(e){console.warn("사용자 정보 불러오기 실패",e)}
        const adminNav=document.getElementById("adminNavItem");
        if(adminNav)adminNav.hidden=!(data.role==="president"||data.role==="vice");
        const name=data.name||data.userName||data.username||data.displayName||data.studentName||"이름 미등록";
        btn.setAttribute("aria-label","프로필 메뉴 열기");
        label.textContent=(String(name).trim().replace(/\s+/g,"").slice(0,3)||"이름 미등록");
        studentNumber.textContent="";
        studentNumber.hidden=false;
        document.getElementById("profileAccountLabel").textContent="학번: "+user+" · 이름: "+name;
        const currentSettings=getStoredSettings();renderAvatar((data.settings&&data.settings.avatarConfig)||currentSettings.avatarConfig);
        btn.onclick=()=>{const open=dropdown.classList.toggle("open");btn.setAttribute("aria-expanded",String(open))};
        signoutBtn.hidden=false;
        signoutBtn.onclick=()=>{location.href="/signout?redirect=/"};
      }else{
        const adminNav=document.getElementById("adminNavItem");if(adminNav)adminNav.hidden=true;

    window.changePassword=async function(){const user=localStorage.getItem("userId");if(!user){alert("로그인 후 이용할 수 있습니다.");return}const currentPassword=document.getElementById("currentPassword").value,newPassword=document.getElementById("newPassword").value,confirmPassword=document.getElementById("confirmPassword").value,button=document.getElementById("passwordChangeBtn");if(!currentPassword||!newPassword||!confirmPassword){alert("현재 비밀번호와 새 비밀번호를 모두 입력하세요.");return}if(newPassword.length<6){alert("새 비밀번호는 6자 이상이어야 합니다.");return}if(newPassword!==confirmPassword){alert("새 비밀번호가 서로 일치하지 않습니다.");return}if(currentPassword===newPassword){alert("현재 비밀번호와 다른 비밀번호를 입력하세요.");return}button.disabled=true;button.textContent="확인 중...";try{const userRef=doc(db,"users",user),snap=await getDoc(userRef);if(!snap.exists()){alert("사용자 정보를 찾을 수 없습니다.");return}const data=snap.data();if(currentPassword!==data.password){alert("현재 비밀번호가 올바르지 않습니다.");return}await updateDoc(userRef,{password:newPassword});document.getElementById("currentPassword").value="";document.getElementById("newPassword").value="";document.getElementById("confirmPassword").value="";alert("비밀번호가 변경되었습니다.")}catch(e){console.error("비밀번호 변경 실패",e);alert("비밀번호 변경 중 오류가 발생했습니다.")}finally{button.disabled=false;button.textContent="비밀번호 변경"}};

    const siteHeader=document.getElementById("siteHeader");const navRevealTrigger=document.getElementById("navRevealTrigger");let lastScrollY=window.scrollY,scrollTick=false;

<script>
  // One-time cleanup of legacy homepage caches/workers from older deployments.
  // Keep this scoped to known legacy cache names; never erase unrelated app data.
  const legacyCleanupKey = "25withcoding-legacy-homepage-cleanup-v1";
  if (!localStorage.getItem(legacyCleanupKey)) {
    (async () => {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          const legacyKeys = keys.filter(key => /^coding-club-v[12]$/.test(key));
          await Promise.all(legacyKeys.map(key => caches.delete(key)));
        }
        localStorage.setItem(legacyCleanupKey, "done");
      } catch (error) {
        console.warn("기존 홈페이지 캐시 정리 실패:", error);
      }
    })();
  }
</script>
