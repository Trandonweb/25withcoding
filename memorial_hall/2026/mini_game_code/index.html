<section id="modeScreen" class="screen"><div class="logo"> MINI GAME</div><div class="sub" id="projectShortDescription">친구 또는 컴퓨터와 다양한 미니게임 대결을 즐겨 보세요.</div><div class="cards mode-cards"><button class="card mode-card" onclick="chooseMode(this,'cpu','컴퓨터와 대전')"><span class="mode-kicker">1 PLAYER</span><div class="title">컴퓨터와 대전</div><div class="desc">AI 상대와 실력을 겨뤄 보세요.</div><span class="mode-detail">난이도 설정 가능</span></button><button class="card mode-card" onclick="chooseMode(this,'local','한 컴퓨터로 1대1')"><span class="mode-kicker">2 PLAYERS</span><div class="title">한 컴퓨터로 1대1</div><div class="desc">한 기기에서 친구와 대결하세요.</div><span class="mode-detail">키보드로 함께 플레이</span></button></div><button id="modeNext" class="next" disabled onclick="showSettings()">다음 →</button></section>
<script>
/* Fail-safe for the first mode-selection screen: keep its buttons usable even if a later script fails. */
(function(){
  function wireModeButtons(){
    const screen=document.getElementById('modeScreen');
    if(!screen)return;
    const cards=Array.from(screen.querySelectorAll('.cards .card'));
    const next=document.getElementById('modeNext');
    const choices=[
      {value:'cpu',name:'컴퓨터와 대전'},
      {value:'local',name:'한 컴퓨터로 1대1'}
    ];
    cards.forEach((card,index)=>{
      card.onclick=function(){
        cards.forEach(item=>item.classList.remove('selected'));
        card.classList.add('selected');
        window.__mgFallbackMode=choices[index].value;
        window.__mgFallbackModeName=choices[index].name;
        if(typeof window.chooseMode==='function'){
          try{window.chooseMode(card,choices[index].value,choices[index].name)}catch(error){console.error(error)}
        }
        if(next)next.disabled=false;
      };
    });
    if(next)next.onclick=function(){
      const value=window.__mgFallbackMode;
      if(!value){return}
      try{
        if(typeof window.showSettings==='function'){
          window.showSettings();
          return;
        }
      }catch(error){console.error(error)}
      document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));
      const settings=document.getElementById('settingsScreen');
      settings.classList.remove('hidden');
      const label=document.getElementById('modeLabel');
      if(label)label.textContent=window.__mgFallbackModeName;
    };
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wireModeButtons,{once:true});
  else wireModeButtons();
})();
</script>
<section id="settingsScreen" class="screen hidden"><div class="round">STEP 2</div><h1>게임 설정</h1><div class="sub" id="modeLabel"></div><div class="setting hidden" id="cpuDifficultySetting"><h2>컴퓨터 난이도</h2><div class="sets"><button type="button" class="setbtn" data-difficulty="easy" onclick="chooseDifficulty(this,'easy')">쉬움</button><button type="button" class="setbtn selected" data-difficulty="normal" onclick="chooseDifficulty(this,'normal')">보통</button><button type="button" class="setbtn" data-difficulty="hard" onclick="chooseDifficulty(this,'hard')">어려움</button></div><p class="desc">컴퓨터의 반응 속도와 플레이 실력을 조절합니다.</p></div><div class="setting"><h2>몇 판으로 승부할까요?</h2><div class="sets"><button class="setbtn selected" onclick="chooseRounds(this,1)">단판</button><button class="setbtn" onclick="chooseRounds(this,3)">3판 2선승</button><button class="setbtn" onclick="chooseRounds(this,5)">5판 3선승</button><button class="setbtn" onclick="chooseRounds(this,7)">7판 4선승</button><button class="setbtn" onclick="chooseRounds(this,9)">9판 5선승</button></div></div><div class="setting"><h2>게임</h2><div class="cards"><button class="card" onclick="chooseGame(this,'select','게임 선택')"><div class="icon"></div><div class="title">게임 선택</div><div class="desc">플레이할 게임을 직접 선택</div></button><button class="card" onclick="chooseGame(this,'random','랜덤')"><div class="icon"></div><div class="title">랜덤</div><div class="desc">게임을 무작위로 결정</div></button></div></div><button id="startBtn" class="next" disabled onclick="startSetup()">게임 시작 →</button><br><button class="back" onclick="backToMode()">← 이전</button></section>
<section id="gameSelectScreen" class="screen hidden"><div class="round">STEP 3</div><h1>게임 선택</h1><div class="sub">이번 매치에서 플레이할 게임을 골라주세요.</div><div class="cards"><button class="card" onclick="pickActualGame('game1',' 줄다리기')"><div class="icon"></div><div class="title">줄다리기</div><div class="desc">빠르게 당기기</div></button><button class="card" onclick="pickActualGame('game2',' 영역 채우기')"><div class="icon"></div><div class="title">영역 채우기</div><div class="desc">20초 영역 싸움</div></button><button class="card" onclick="pickActualGame('game3',' 키 반응 대결')"><div class="icon"></div><div class="title">키 반응 대결</div><div class="desc">키보드 반응 속도</div></button><button class="card" onclick="pickActualGame('game4',' 4목')"><div class="icon"></div><div class="title">4목</div><div class="desc">네 개를 먼저 연결</div></button><button class="card" onclick="pickActualGame('game5',' 점프 러너')"><div class="icon"></div><div class="title">점프 러너</div><div class="desc">장애물을 피하며 점프</div></button><button class="card" onclick="pickActualGame('game6',' 장애물 슈팅')"><div class="icon"></div><div class="title">장애물 슈팅</div><div class="desc">장애물 효과를 활용한 슈팅 대결</div></button><button class="card" onclick="pickActualGame('game7',' 활쏘기 대결')"><div class="icon"></div><div class="title">활쏘기 대결</div><div class="desc">각도 조준 · 활시위 당겼다 놓기</div></button><button class="card" onclick="pickActualGame('game8',' 탁구 대결')"><div class="icon"></div><div class="title">탁구 대결</div><div class="desc">패들을 움직여 공을 받아치기</div></button><button class="card" onclick="pickActualGame('game9',' 회피 서바이벌')"><div class="icon"></div><div class="title">회피 서바이벌</div><div class="desc">떨어지는 장애물을 피해 생존</div></button></div><button class="back" onclick="backToSettings()">← 게임 재선택</button></section>
<section id="readyScreen" class="screen hidden"><div class="round">READY</div><h1>게임 준비 완료!</h1><div class="summary" id="summary"></div><button class="next" onclick="startMatch()">플레이 시작 ▶</button><br><button class="back" onclick="backToSetup()">← 게임 재선택</button></section>
<section id="resultScreen" class="screen hidden"><div class="round">RESULT</div><h1 id="resultTitle">이번 게임 결과</h1><div class="score" id="resultScore">0 : 0</div><div id="resultGame"></div><button class="next" id="continueBtn" onclick="continueMatch()">다음 게임 →</button></section>
<section id="finalScreen" class="screen hidden"><div class="round">MATCH COMPLETE</div><h1>매치 종료</h1><div class="score" id="finalScore">0 : 0</div><div id="finalText"></div><div class="history" id="history"></div><button class="next" onclick="location.href=location.pathname">새 매치</button></section>
</div><script>
(async function loadProjectIntroMetadata(){
  const readMetadata = async file => {
    try {
      const response = await fetch("../mini_game/" + file, {cache:"no-store"});
      return response.ok ? (await response.text()).trim() : "";
    } catch { return ""; }
  };
  const explanation = await readMetadata("explanation.txt");
  const descriptionElement = document.getElementById("projectShortDescription");
  if (explanation && descriptionElement) {
    const shortDescription = explanation.split(/(?<=[.!?。！？])\\s*/)[0].trim();
    if (shortDescription) descriptionElement.textContent = shortDescription;
  }
})();
</script>
<script>
let mode=null,modeName='',rounds=1,gameChoice=null,gameName='',difficulty='normal';let match=null;const games=['game1','game2','game3','game4','game5','game6','game7','game8','game9'];
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function onlineRoomReady(){const r=JSON.parse(localStorage.getItem('miniGameRoom')||'null');return !!(r&&r.connected&&r.hostLive&&r.guestLive)}
function chooseMode(el,v,n){document.querySelectorAll('#modeScreen .card').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');mode=v;modeName=n;document.getElementById('modeNext').disabled=false;document.getElementById('cpuDifficultySetting').classList.toggle('hidden',v!=='cpu')}
function chooseDifficulty(el,v){difficulty=v;document.querySelectorAll('#cpuDifficultySetting [data-difficulty]').forEach(x=>x.classList.toggle('selected',x===el))}
function showSettings(){document.getElementById('modeLabel').textContent=modeName;show('settingsScreen')}
function chooseRounds(el,v){el.parentElement.querySelectorAll('.setbtn').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');rounds=v}
function chooseGame(el,v,n){document.querySelectorAll('#settingsScreen .card').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');gameChoice=v;gameName=n;document.getElementById('startBtn').disabled=false}
function startSetup(){if(gameChoice==='select'){match={mode,modeName,rounds,need:Math.floor(rounds/2)+1,choice:'select',difficulty:mode==='cpu'?difficulty:'normal',scoreMe:0,scoreOpp:0,round:1,history:[]};localStorage.setItem('miniGameSettings',JSON.stringify(match));show('gameSelectScreen')}else prepareMatch('random')}
function pickActualGame(id,n){if(!match){match={mode,modeName,rounds,need:Math.floor(rounds/2)+1,choice:'select',difficulty:mode==='cpu'?difficulty:'normal',scoreMe:0,scoreOpp:0,round:1,history:[]}}match.game=id;match.gameName=n;localStorage.setItem('miniGameSettings',JSON.stringify(match));show('readyScreen');document.getElementById('summary').innerHTML=`<span>${match.modeName}</span><br><b>${match.round}번째 게임 · ${match.rounds===1?'단판':match.rounds+'판 '+match.need+'선승'}</b><br>${n}`}
function prepareMatch(choice,n){match={mode,modeName,rounds,need:Math.floor(rounds/2)+1,choice,difficulty:mode==='cpu'?difficulty:'normal',scoreMe:0,scoreOpp:0,round:1,history:[]};if(choice!=='random'){match.game=choice;match.gameName=n}localStorage.setItem('miniGameSettings',JSON.stringify(match));show('readyScreen');document.getElementById('summary').innerHTML=`<span>${modeName}</span><br><b>${rounds===1?'단판':rounds+'판 '+match.need+'선승'}</b><br>${choice==='random'?' 매 판 랜덤 게임':n}`}
function startMatch(){launchGame()}
function launchGame(){if(!match)return;let id=match.choice==='random'?games[Math.floor(Math.random()*games.length)]:match.game;match.currentGame=id;match.launchId=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);localStorage.setItem('miniGameSettings',JSON.stringify(match));localStorage.setItem('miniGameSelected',id);location.href='game/'+id+'.html'}
function consumeResult(){const r=JSON.parse(localStorage.getItem('miniGameResult')||'null');if(!r)return false;localStorage.removeItem('miniGameResult');if(!match)return false;match.scoreMe+=r.winner==='me'?1:0;match.scoreOpp+=r.winner==='opp'?1:0;match.history.push({game:r.game||match.currentGame,winner:r.winner,me:r.me,opp:r.opp});return true}
window.addEventListener('pageshow',()=>{const saved=JSON.parse(localStorage.getItem('miniGameSettings')||'null');if(!saved||!saved.mode)return;if(!match&&localStorage.getItem('miniGameResult')){match=saved;consumeResult();show('resultScreen');renderResult()}})
function renderResult(){const last=match.history[match.history.length-1];document.getElementById('resultTitle').textContent=match.mode==='local'?(last.winner==='me'?'1P 승':last.winner==='opp'?'2P 승':'무승부'):(last.winner==='me'?'승리':last.winner==='opp'?'패배':'무승부');document.getElementById('resultScore').textContent=`${last.me} : ${last.opp}`;document.getElementById('resultGame').textContent=last.game;const done=match.scoreMe>=match.need||match.scoreOpp>=match.need||match.round>=match.rounds;document.getElementById('continueBtn').textContent=done?'최종 결과 보기':'다음 게임 →'}
function continueMatch(){if(match.scoreMe>=match.need||match.scoreOpp>=match.need||match.round>=match.rounds){showFinal();return}match.round++;localStorage.setItem('miniGameSettings',JSON.stringify(match));if(match.choice==='select'){show('gameSelectScreen');return}show('readyScreen');document.getElementById('summary').innerHTML=`<span>${match.modeName}</span><br><b>${match.round}번째 게임</b><br> 이번 판은 랜덤으로 결정`}
function showFinal(){document.getElementById('finalScore').textContent=`${match.scoreMe} : ${match.scoreOpp}`;document.getElementById('finalText').textContent=match.mode==='local'?(match.scoreMe>match.scoreOpp?'최종 결과: 1P 승':match.scoreMe<match.scoreOpp?'최종 결과: 2P 승':'무승부'):(match.scoreMe>match.scoreOpp?'최종 승리':match.scoreMe<match.scoreOpp?'최종 패배':'무승부');document.getElementById('history').innerHTML=match.history.map((x,i)=>`${i+1}. ${x.game} — ${match.mode==='local'?(x.winner==='me'?'1P 승':x.winner==='opp'?'2P 승':'무승부'):(x.winner==='me'?'승리':x.winner==='opp'?'패배':'무승부')} (${x.me}:${x.opp})`).join('<br>');localStorage.removeItem('miniGameSettings');show('finalScreen')}
function backToMode(){show('modeScreen')}

function backToSettings(){show('settingsScreen')}
function backToSetup(){show('gameSelectScreen')}
if(localStorage.getItem('miniGameResult')){const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null');if(s){match=s;consumeResult();show('resultScreen');renderResult()}}
</script></body></html>
