<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코딩과 함께라면 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">

<style>
:root{
  --primary-color:#27ae60;
  --secondary-color:#64dd17;
  --bg-color:#0f0f14;
  --card-bg:#1c1c25;
  --text-color:#fff;
  --muted-color:#aaa;
  --border-color:rgba(39,174,96,.35);
  --input-bg:#15151c;
  --input-border:#3a3a45;
  --header-text:#fff;
  --accent-soft:rgba(39,174,96,.18)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:sans-serif;
  background:var(--bg-color);
  color:var(--text-color);
  transition:background .25s,color .25s
}

.gate-open{
  overflow:hidden
}

#festivalGate{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(
      circle at 10% 10%,
      color-mix(in srgb,var(--primary-color) 25%,transparent),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 90%,
      color-mix(in srgb,var(--secondary-color) 22%,transparent),
      transparent 35%
    ),
    var(--bg-color)
}

.gate-card{
  width:min(420px,100%);
  padding:34px 28px;
  text-align:center;
  background:var(--card-bg);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  box-shadow:0 25px 70px rgba(0,0,0,.5)
}

.gate-icon{
  font-size:52px;
  margin-bottom:8px
}

.gate-title{
  margin:0;
  font-family:'Black Han Sans',sans-serif;
  font-size:32px;
  background:linear-gradient(
    90deg,
    var(--primary-color),
    var(--secondary-color)
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent
}

.gate-description{
  margin:14px 0 24px;
  color:var(--muted-color);
  font-size:14px;
  line-height:1.7
}

.gate-input{
  width:100%;
  height:50px;
  padding:0 16px;
  border:1px solid var(--input-border);
  border-radius:13px;
  background:var(--input-bg);
  color:var(--text-color);
  outline:none;
  font-size:15px;
  text-align:center;
  transition:.2s
}

.gate-input::placeholder{
  color:#777
}

.gate-input:focus{
  border-color:var(--primary-color);
  box-shadow:0 0 0 3px color-mix(
    in srgb,
    var(--primary-color) 15%,
    transparent
  )
}

.gate-button{
  width:100%;
  height:50px;
  margin-top:10px;
  border:none;
  border-radius:13px;
  background:linear-gradient(
    90deg,
    var(--primary-color),
    var(--secondary-color)
  );
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s
}

.gate-button:hover{
  filter:brightness(.92);
  transform:translateY(-1px)
}

.gate-button:active{
  transform:translateY(0)
}

.gate-button:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none
}

.gate-divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:18px 0;
  color:#666;
  font-size:12px
}

.gate-divider:before,
.gate-divider:after{
  content:"";
  flex:1;
  height:1px;
  background:#33333d
}

.gate-error{
  min-height:20px;
  margin-top:10px;
  color:#ff7070;
  font-size:13px
}

.gate-success{
  min-height:20px;
  margin-top:10px;
  color:#7cff91;
  font-size:13px
}

.gate-loading{
  color:var(--muted-color);
  font-size:14px
}

.session-box{
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  background:color-mix(
    in srgb,
    var(--primary-color) 8%,
    var(--card-bg)
  );
  border:1px solid color-mix(
    in srgb,
    var(--primary-color) 25%,
    transparent
  );
  text-align:left
}

.session-label{
  display:block;
  margin-bottom:8px;
  color:var(--text-color);
  font-size:13px;
  font-weight:bold
}

.session-select{
  width:100%;
  height:44px;
  padding:0 12px;
  border:1px solid var(--input-border);
  border-radius:10px;
  background:var(--input-bg);
  color:var(--text-color);
  font-size:14px;
  outline:none
}

.session-hint{
  margin-top:7px;
  color:var(--muted-color);
  font-size:11px
}

.gate-session-area{
  display:none
}

.gate-session-area.show{
  display:block
}

#festivalGate.hidden{
  display:none
}

.home-link{
  position:fixed;
  top:18px;
  left:20px;
  color:rgba(255,255,255,.75);
  text-decoration:none;
  font-size:13px;
  z-index:1000
}

.home-link:hover{
  color:white
}

/* 축제 이용 시간은 내부 세션 관리에만 사용하며 화면에는 표시하지 않습니다. */

#festivalTimer{
  position:fixed;
  top:16px;
  right:18px;
  z-index:2000;
  display:none!important;
  align-items:center;
  gap:9px;
  padding:7px 9px 7px 14px;
  border-radius:12px;
  background:rgba(21,21,28,.92);
  border:1px solid var(--border-color);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
  font-size:13px;
  font-weight:bold;
  backdrop-filter:blur(8px)
}

#festivalTimer strong{
  color:var(--secondary-color);
  font-family:monospace;
  font-size:16px
}

#festivalPauseButton{
  border:1px solid rgba(255,255,255,.16);
  border-radius:8px;
  padding:5px 8px;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
  transition:.15s;
  white-space:nowrap
}

#festivalPauseButton:hover{
  background:rgba(255,255,255,.16)
}

#festivalPauseButton:active{
  transform:scale(.96)
}

#festivalEndButton{
  border:1px solid rgba(255,100,100,.55);
  border-radius:8px;
  padding:5px 8px;
  background:rgba(180,35,24,.18);
  color:#ffb0a8;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
  transition:.15s
}

#festivalEndButton:hover{
  background:rgba(180,35,24,.35)
}

#festivalEndButton:active{
  transform:scale(.96)
}

.timer-warning{
  border-color:#ffb74d!important
}

.timer-warning strong{
  color:#ffcc80!important
}

.timer-danger{
  border-color:#ff5252!important;
  animation:timerPulse .6s infinite alternate
}

.timer-danger strong{
  color:#ff7777!important
}

@keyframes timerPulse{
  from{
    transform:scale(1)
  }
  to{
    transform:scale(1.04)
  }
}

/* 일시정지 화면은 공개 뷰어에서 표시하지 않습니다. */

#festivalPauseOverlay{
  display:none!important;
  position:fixed;
  inset:0;
  z-index:10000;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000;
  color:#fff;
  text-align:center;
  user-select:none;
}

#festivalPauseOverlay.show{
  display:flex
}

.pause-message{
  font-size:clamp(24px,5vw,42px);
  font-weight:bold;
  letter-spacing:.02em
}

/*
 * 일시정지 중에는 오버레이가 모든 화면을 덮는다.
 * 오버레이 클릭으로 재개할 수 있도록 한다.
 */
#festivalPauseOverlay{
  cursor:pointer
}

#festivalNotice{
  position:fixed;
  left:50%;
  top:72px;
  z-index:3000;
  transform:translate(-50%,-20px);
  opacity:0;
  pointer-events:none;
  width:min(420px,calc(100% - 28px));
  padding:14px 18px;
  border-radius:14px;
  text-align:center;
  background:var(--card-bg);
  border:1px solid var(--primary-color);
  box-shadow:0 15px 40px rgba(0,0,0,.4);
  transition:.25s;
  font-size:14px;
  font-weight:bold
}

#festivalNotice.show{
  transform:translate(-50%,0);
  opacity:1
}

.notice-danger{
  border-color:#ff5252!important;
  color:#ffb0b0
}

#musicToggle{
  position:fixed;
  top:14px;
  right:18px;
  z-index:1500;
  min-width:112px;
  padding:10px 14px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:999px;
  background:rgba(21,21,28,.88);
  color:#fff;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  backdrop-filter:blur(10px);
  box-shadow:0 5px 18px rgba(0,0,0,.25);
  transition:background .2s,transform .2s,border-color .2s
}
#musicToggle:hover{
  background:rgba(39,174,96,.28);
  border-color:var(--primary-color);
  transform:translateY(-1px)
}
#musicToggle:focus-visible{
  outline:2px solid var(--secondary-color);
  outline-offset:3px
}

header{
  text-align:center;
  padding:12px 20px;
  font-family:'Black Han Sans',sans-serif;
  font-size:30px;
  background:linear-gradient(
    90deg,
    var(--primary-color),
    var(--secondary-color)
  );
  color:var(--header-text);
  box-shadow:0 4px 20px rgba(0,0,0,.3)
}

.subtitle{
  text-align:center;
  padding:10px;
  color:color-mix(
    in srgb,
    var(--primary-color) 55%,
    white
  );
  font-size:14px;
  line-height:1.8
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  padding:20px
}

.card{
  background:var(--card-bg);
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
  display:flex;
  flex-direction:column;
  border:1px solid color-mix(
    in srgb,
    var(--primary-color) 18%,
    transparent
  )
}

.card:hover{
  transform:scale(1.03);
  border-color:color-mix(
    in srgb,
    var(--primary-color) 45%,
    transparent
  )
}

.card img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  display:block
}

.info{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:6px;
  flex:1
}

.title{
  font-weight:bold;
  font-size:18px
}

.desc{
  font-size:13px;
  color:#bbb;
  height:2.6em;
  overflow:hidden
}

.likes{
  color:var(--secondary-color);
  margin-top:auto
}

.like-btn:disabled{opacity:.45;cursor:not-allowed;filter:saturate(.45)}

.like-btn{
  margin-top:8px;
  padding:8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:var(--primary-color);
  color:white;
  font-weight:bold
}

@media(max-width:768px){
  .grid{
    grid-template-columns:1fr
  }

  header{
    font-size:24px
  }

  .gate-card{
    padding:30px 22px
  }

  .gate-title{
    font-size:28px
  }

  #festivalTimer{
    top:10px;
    right:10px;
    font-size:11px;
    padding:6px 7px 6px 10px;
    gap:6px
  }

  #festivalTimer strong{
    font-size:14px
  }

  #festivalPauseButton{
    padding:5px 6px;
    font-size:10px
  }
}
</style>
</head>

<body>

<div id="festivalNotice"></div>

<a
  class="home-link"
  href="/memorial_hall/"
>
  기념관 홈
</a>

<button id="musicToggle" type="button" aria-label="배경 음악 재생">♫ 음악 재생</button>

<header>
  코딩과 함께라면 2026
</header>

<div
  class="subtitle"
  id="subtitle"
>
  <div>since 2025</div>
  <div>❤️ 지금까지 0번의 응원이 도착했어요!</div>
</div>

<div
  class="grid"
  id="grid"
></div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  setDoc,
  increment,
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


/* =========================
   Firebase
========================= */

const firebaseConfig={
  apiKey:"AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9",
  authDomain:"festivallikes.firebaseapp.com",
  projectId:"festivallikes",
  storageBucket:"festivallikes.firebasestorage.app",
  messagingSenderId:"782245120700",
  appId:"1:782245120700:web:c61e16313e9ae688e6deb9"
};

const app=initializeApp(firebaseConfig,"festivalApp");
const db=getFirestore(app);


/* =========================
   기본 설정
========================= */

const SETTINGS_KEY="coding_with_ramen_settings";

const THEME_COLORS=[
  "#27ae60",
  "#3498db",
  "#e84393",
  "#9b59b6",
  "#e74c3c"
];

const THEME_SECONDARY={
  "#27ae60":"#64dd17",
  "#3498db":"#5dade2",
  "#e84393":"#fd79a8",
  "#9b59b6":"#c39bd3",
  "#e74c3c":"#ff7675"
};


function applyTheme(
  primary,
  source="visitor"
){
  primary=String(primary||"").toLowerCase();

  if(!THEME_COLORS.includes(primary)){
    primary=THEME_COLORS[0];
  }

  const secondary=
    THEME_SECONDARY[primary]||primary;

  document.documentElement.style.setProperty(
    "--primary-color",
    primary
  );

  document.documentElement.style.setProperty(
    "--secondary-color",
    secondary
  );

  document.documentElement.style.setProperty(
    "--border-color",
    `color-mix(in srgb, ${primary} 35%, transparent)`
  );

  document.documentElement.style.setProperty(
    "--accent-soft",
    `color-mix(in srgb, ${primary} 18%, transparent)`
  );

  document.body.dataset.themeSource=source;
}


function applyVisitorRandomTheme(){
  const primary=
    THEME_COLORS[
      Math.floor(
        Math.random()*THEME_COLORS.length
      )
    ];

  applyTheme(
    primary,
    "visitor"
  );
}


applyVisitorRandomTheme();

const festivalNotice=document.getElementById("festivalNotice");
let noticeTimeout=null;

function showNotice(
  message,
  danger=false
){

  clearTimeout(
    noticeTimeout
  );

  festivalNotice.textContent=
    message;

  festivalNotice.className=
    danger
      ? "show notice-danger"
      : "show";

  noticeTimeout=
    setTimeout(
      ()=>{
        festivalNotice.classList.remove(
          "show"
        );
      },
      5000
    );

}


/* =========================
   작품 목록
========================= */



/* =========================
   작품 목록
========================= */

const grid=
  document.getElementById(
    "grid"
  );


const GITHUB_TREE_URL="https://api.github.com/repos/Trandonweb/25withcoding/git/trees/main?recursive=1";
const RAW_GITHUB_ROOT="https://raw.githubusercontent.com/Trandonweb/25withcoding/main/";
let discoveredProjects=[];
let projectLikes=new Map();
let projectDocs=new Map();
let projectsLoading=true;

// 한국 시간 기준 2026년 10월 23일 00:00부터 응원 활성화
const SUPPORT_START_AT = new Date("2026-10-23T00:00:00+09:00").getTime();
function supportAllowed(){ return Date.now() >= SUPPORT_START_AT; }
function updateSupportButtons(){
  document.querySelectorAll(".like-btn").forEach(button=>{
    button.disabled = !supportAllowed();
    button.title = supportAllowed() ? "" : "응원하기는 2026년 10월 23일 00:00부터 가능합니다.";
  });
}
setInterval(updateSupportButtons, 1000);

function fileText(path){
  return fetch(RAW_GITHUB_ROOT+path)
    .then(response=>response.ok?response.text():"")
    .then(value=>String(value||"").trim())
    .catch(()=> "");
}

function safeImageUrl(path){
  return RAW_GITHUB_ROOT+path.split("/").map(encodeURIComponent).join("/");
}

function makeText(tag,className,value){
  const node=document.createElement(tag);
  if(className) node.className=className;
  node.textContent=value||"";
  return node;
}

function renderProjects(){
  if(projectsLoading) return;

  grid.replaceChildren();

  if(!discoveredProjects.length){
    grid.appendChild(makeText("div","empty","연동된 작품을 찾지 못했습니다. 작품 폴더와 _code 폴더를 확인해주세요."));
    return;
  }

  const projects=[...discoveredProjects].sort((a,b)=>
    (projectLikes.get(b.id)||0)-(projectLikes.get(a.id)||0)
  );

  const totalLikes=projects.reduce((sum,p)=>sum+(projectLikes.get(p.id)||0),0);
  document.getElementById("subtitle").innerHTML=
    `<div>since 2025</div><div>❤️ 지금까지 ${totalLikes.toLocaleString()}번의 응원이 도착했어요</div>`;

  projects.forEach((p,index)=>{
    const card=document.createElement("article");
    card.className="card";
    card.tabIndex=0;
    card.setAttribute("role","link");
    card.setAttribute("aria-label",p.title+" 작품 정보 보기");

    const openProject=()=>{ location.href="/memorial_hall/2026/"+encodeURIComponent(p.id)+"/"; };
    card.addEventListener("click",openProject);
    card.addEventListener("keydown",event=>{
      if(event.target!==card) return;
      if(event.key==="Enter"||event.key===" "){
        event.preventDefault();
        openProject();
      }
    });

    const existing=projectDocs.get(p.id)||{};
    const thumbnail=p.thumbnail||String(existing.thum||"");
    if(thumbnail){
      const img=document.createElement("img");
      img.alt=p.title+" 썸네일";
      img.loading="lazy";
      const imageCandidates=p.thumbnailCandidates||[thumbnail];
      let imageCandidateIndex=0;
      img.onerror=()=>{
        imageCandidateIndex++;
        if(imageCandidateIndex<imageCandidates.length){
          img.src=imageCandidates[imageCandidateIndex];
        }else{
          img.remove();
        }
      };
      img.src=imageCandidates[0]||thumbnail;
      card.appendChild(img);
    }

    const info=makeText("div","info","");
    const medal=index===0?"🥇 ":index===1?"🥈 ":index===2?"🥉 ":"";
    info.appendChild(makeText("div","title",medal+p.title));
    const description=p.description||String(existing.detail||"");
    const madeBy=p.madeBy||String(existing.madeby||existing.madeBy||existing.author||"");
    info.appendChild(makeText("div","desc",description||"작품 소개가 등록되지 않았습니다."));
    if(madeBy) info.appendChild(makeText("div","project-maker","제작자 · "+madeBy));

    // 선택창에서도 뷰어와 동일한 Firebase projects 문서의 응원 수를 사용합니다.
    const likes=Number(projectLikes.get(p.id)||0);
    info.appendChild(makeText("div","likes","응원 "+likes.toLocaleString()+"회"));
    const likeButton=makeText("button","like-btn","응원하기");
    likeButton.type="button";
    // 2026-10-23 00:00(KST) 전까지는 응원 기능을 비활성화합니다.
    likeButton.disabled=!supportAllowed();
    likeButton.title=supportAllowed()?"":"응원하기는 2026년 10월 23일 00:00부터 가능합니다.";
    likeButton.addEventListener("click",async event=>{
      event.preventDefault();
      event.stopPropagation();
      if(likeButton.disabled || !supportAllowed()) { updateSupportButtons(); return; }
      likeButton.disabled=true;
      likeButton.textContent="처리 중...";
      likeButton.title="";
      try{
        await setDoc(doc(db,"projects",p.id),{likes:increment(1)},{merge:true});
        likeButton.textContent="응원 완료";
        likeButton.title="응원해 주셔서 감사합니다!";
      }catch(error){
        console.error("선택창 응원 처리 실패:",error);
        likeButton.textContent="실패";
        likeButton.title="Firebase 쓰기 권한 또는 연결을 확인해 주세요: "+(error?.message||error);
      }finally{
        setTimeout(()=>{
          likeButton.textContent="응원하기";
          updateSupportButtons();
        },1500);
      }
    });
    info.appendChild(likeButton);
    card.appendChild(info);
    grid.appendChild(card);
  });
}

async function discoverProjectFolders(){
  // 작품 목록은 GitHub Tree API 응답에 의존하지 않고 현재 저장소에 존재하는
  // 작품 폴더와 대응 _code 폴더를 수동으로 등록합니다.
  const manualProjectIds=[
    "FPS",
    "Galaxy_attack",
    "Team_Fortress_Classic",
    "bigkid",
    "do_not_come_to_me",
    "maze",
    "mini_game",
    "number",
    "이준혁"
  ];

  try{
    const projects=await Promise.all(manualProjectIds.map(async id=>{
      const folder="memorial_hall/2026/"+id;
      const [title,description,madeBy,how]=await Promise.all([
        fileText(folder+"/title.txt"),
        fileText(folder+"/explanation.txt"),
        fileText(folder+"/madeby.txt"),
        fileText(folder+"/how.txt")
      ]);

      const existing=projectDocs.get(id)||{};
      const thumbnailPaths=[
        folder+"/thumbnail.png",
        folder+"/thubnail.png",
        folder+"/thumbnail.jpg",
        folder+"/thumbnail.jpeg",
        folder+"/thumbnail.webp",
        folder+"/thumbnail.svg",
        folder+"/thumb.png",
        folder+"/thumb.jpg",
        folder+"/thumb.webp",
        folder+"/thumb.jpeg",
        folder+"/thumbnail.gif"
      ];
      const thumbnailCandidates=thumbnailPaths.map(safeImageUrl);
      const savedThumbnail=String(existing.thum||existing.thumbnail||"");

      return {
        id,
        title:title||String(existing.title||id),
        description:description||String(existing.detail||""),
        madeBy:madeBy||String(existing.madeby||existing.madeBy||existing.author||""),
        how:how||String(existing.howto||existing.how||""),
        thumbnail:thumbnailCandidates[0]||savedThumbnail,
        thumbnailCandidates:savedThumbnail
          ?[...thumbnailCandidates,savedThumbnail]
          :thumbnailCandidates
      };
    }));

    discoveredProjects=projects;
    projectsLoading=false;
    renderProjects();
  }catch(error){
    console.error("수동 작품 목록 불러오기 실패:",error);
    projectsLoading=false;
    grid.replaceChildren(makeText("div","empty","작품 목록을 불러오지 못했습니다. 네트워크 연결을 확인해주세요."));
  }
}

function loadProjects(){
  onSnapshot(
    collection(db,"projects"),
    snap=>{
      projectLikes=new Map();
      projectDocs=new Map();
      snap.forEach(docSnap=>{
        const data=docSnap.data()||{};
        projectLikes.set(docSnap.id,Number(data.likes)||0);
        projectDocs.set(docSnap.id,data);
      });
      renderProjects();
    },
    error=>{
      console.error("작품 응원 데이터 불러오기 실패:",error);
      showNotice("응원 수를 불러오지 못했습니다.",true);
    }
  );

  discoverProjectFolders();
}


loadProjects();



</script>


<script>
/*
 * 2026 기념관 오리지널 배경음악
 * 신나는 신스팝 느낌의 멜로디를 Web Audio API로 실시간 생성합니다.
 * 브라우저가 허용하면 자동 재생하고, 차단되면 첫 화면 클릭으로 시작합니다.
 */
(() => {
  const button = document.getElementById("musicToggle");
  if (!button) return;

  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) {
    button.textContent = "음악 미지원";
    button.disabled = true;
    return;
  }

  let audioContext = null;
  let scheduler = null;
  let nextNoteTime = 0;
  let step = 0;
  let playing = false;
  let waitingForClick = false;

  const tempo = 116;
  const beat = 60 / tempo;
  const lookAhead = 0.12;
  const scheduleInterval = 25;

  // D - A - Bm - G 진행을 바탕으로 한 밝은 신스팝 멜로디
  const progression = [
    { bass: 73.42, chord: [293.66, 369.99, 440.00], notes: [587.33, 659.25, 739.99, 880.00, 739.99, 659.25, 587.33, 493.88] },
    { bass: 55.00, chord: [220.00, 261.63, 329.63], notes: [659.25, 739.99, 880.00, 987.77, 880.00, 739.99, 659.25, 587.33] },
    { bass: 61.74, chord: [246.94, 293.66, 369.99], notes: [493.88, 587.33, 659.25, 739.99, 659.25, 587.33, 493.88, 440.00] },
    { bass: 49.00, chord: [196.00, 246.94, 293.66], notes: [587.33, 659.25, 739.99, 880.00, 739.99, 659.25, 587.33, 523.25] }
  ];

  function makeTone(frequency, time, duration, volume, wave, attack = 0.015, endFrequency = frequency) {
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const filter = audioContext.createBiquadFilter();

    oscillator.type = wave;
    oscillator.frequency.setValueAtTime(frequency, time);
    if (endFrequency !== frequency) {
      oscillator.frequency.exponentialRampToValueAtTime(endFrequency, time + duration);
    }

    filter.type = "lowpass";
    filter.frequency.setValueAtTime(wave === "sawtooth" ? 2400 : 4200, time);
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(volume, time + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

    oscillator.connect(filter);
    filter.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start(time);
    oscillator.stop(time + duration + 0.02);
  }

  function scheduleStep(index, time) {
    const bar = Math.floor(index / 8) % progression.length;
    const position = index % 8;
    const part = progression[bar];

    // 부드러운 화음 패드
    if (position === 0) {
      part.chord.forEach((frequency, i) => {
        makeTone(frequency, time, beat * 7.7, i === 0 ? 0.012 : 0.009, "triangle", 0.45);
      });
      // 박자를 잡아 주는 베이스
      makeTone(part.bass, time, beat * 1.7, 0.045, "sawtooth", 0.025, part.bass * 1.01);
      makeTone(part.bass * 2, time + beat * 2, beat * 1.4, 0.025, "triangle", 0.02);
      makeTone(part.bass, time + beat * 4, beat * 1.7, 0.04, "sawtooth", 0.025);
      makeTone(part.bass * 2, time + beat * 6, beat * 1.3, 0.024, "triangle", 0.02);
    }

    // 경쾌한 8분음표 멜로디
    const note = part.notes[position];
    makeTone(note, time, beat * 0.72, 0.035, "square", 0.012);
    makeTone(note * 2, time, beat * 0.35, 0.008, "sine", 0.008);

    // 가벼운 리듬 펄스
    if (position % 2 === 0) {
      makeTone(110, time, 0.055, 0.012, "sine", 0.005, 55);
    }
  }

  function schedule() {
    while (nextNoteTime < audioContext.currentTime + lookAhead) {
      scheduleStep(step, nextNoteTime);
      nextNoteTime += beat / 2;
      step++;
    }
  }

  function updateButton() {
    button.textContent = playing ? "♫ 음악 끄기" : "♫ 음악 켜기";
    button.setAttribute("aria-label", playing ? "배경 음악 끄기" : "배경 음악 켜기");
  }

  function removeFirstClickListener() {
    if (waitingForClick) {
      document.removeEventListener("click", startFromFirstClick);
      waitingForClick = false;
    }
  }

  async function startMusic() {
    if (!audioContext) audioContext = new AudioContextClass();
    await audioContext.resume();

    if (audioContext.state !== "running") {
      throw new Error("오디오 재생이 브라우저에서 아직 허용되지 않았습니다.");
    }

    removeFirstClickListener();
    if (!playing) {
      playing = true;
      nextNoteTime = audioContext.currentTime + 0.08;
      scheduler = window.setInterval(schedule, scheduleInterval);
      schedule();
    }
    updateButton();
  }

  async function stopMusic() {
    if (scheduler) {
      window.clearInterval(scheduler);
      scheduler = null;
    }
    playing = false;
    if (audioContext && audioContext.state === "running") {
      await audioContext.suspend();
    }
    updateButton();
  }

  async function startFromFirstClick() {
    if (!playing) {
      try {
        await startMusic();
      } catch (error) {
        console.warn("첫 클릭 후에도 음악을 시작하지 못했습니다:", error);
      }
    }
  }

  function waitForFirstClick() {
    if (waitingForClick || playing) return;
    waitingForClick = true;
    button.textContent = "화면을 클릭하면 음악 재생";
    document.addEventListener("click", startFromFirstClick);
  }

  button.addEventListener("click", async (event) => {
    event.stopPropagation();
    button.disabled = true;
    try {
      if (playing) await stopMusic();
      else await startMusic();
    } catch (error) {
      console.warn("배경 음악 재생 실패:", error);
      waitForFirstClick();
    } finally {
      button.disabled = false;
    }
  });

  // 탭을 이동해도 음악을 멈추지 않습니다.
  // 페이지가 백그라운드에 있어도 AudioContext가 계속 재생하도록 둡니다.

  // 페이지 진입 즉시 자동 재생을 시도합니다.
  startMusic().catch(() => {
    waitForFirstClick();
  });
})();
</script>

<script src="/script.js" defer></script>
