<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>코딩과 함께라면 2026 Festival 관리자</title>


<style>

*{
  box-sizing:border-box;
}


body{

  margin:0;
  padding:20px;

  background:#0b0b10;
  color:white;

  font-family:'Malgun Gothic',sans-serif;

}


/* 헤더 */

header{

  margin:-20px -20px 25px;

  padding:22px;

  text-align:center;

  font-size:26px;

  font-weight:bold;

  background:
  linear-gradient(90deg,#00c853,#64dd17);

  box-shadow:
  0 5px 20px rgba(0,0,0,.4);

}



/* 앱 */

#app{

  max-width:900px;

  margin:auto;

}



/* 박스 */

.panel{

  background:#171720;

  padding:25px;

  border-radius:18px;

  margin-bottom:25px;

  box-shadow:
  0 10px 30px rgba(0,0,0,.35);

}



/* 제목 */

h2{

  margin-top:0;

  border-bottom:
  1px solid #333;

  padding-bottom:10px;

}



/* 입력 */

label{

  display:block;

  margin-bottom:6px;

  color:#ddd;

  font-weight:bold;

}



input,
textarea,
select{

  width:100%;

  padding:13px;

  margin-bottom:18px;

  background:#111118;

  color:white;

  border:1px solid #333;

  border-radius:10px;

  font-size:15px;

}



input:focus,
textarea:focus,
select:focus{

  outline:none;

  border-color:#00c853;

}



textarea{

  min-height:100px;

}



/* URL */


.url-box{

  display:flex;

  margin-bottom:18px;

}



.url-prefix{

  display:flex;

  align-items:center;

  padding:0 15px;

  background:#252530;

  color:#aaa;

  white-space:nowrap;

  border-radius:
  10px 0 0 10px;

}



.url-box input{

  margin:0;

  border-radius:
  0 10px 10px 0;

}



/* 버튼 */

button{

  border:0;

  border-radius:12px;

  padding:13px 20px;

  font-weight:bold;

  cursor:pointer;

  transition:.2s;

}



button:hover{

  transform:translateY(-2px);

}



.add{

  width:100%;

  background:#00c853;

  color:white;

}



/* 작품 카드 */

.card{

  background:#111118;

  padding:18px;

  border-radius:15px;

  margin-top:15px;

  border-left:
  5px solid #00c853;

}



.card-title{

  font-size:20px;

  font-weight:bold;

}



.badge{

  display:inline-block;

  padding:5px 10px;

  margin-top:8px;

  border-radius:20px;

  background:#333;

  font-size:13px;

}



/* 삭제 */

.delete{

  float:right;

  background:#d32f2f;

  color:white;

  padding:8px 15px;

}



@media(max-width:600px){

 body{

  padding:12px;

 }


 header{

  margin:-12px -12px 20px;

  font-size:22px;

 }


 .url-box{

  display:block;

 }


 .url-prefix{

  padding:12px;

  border-radius:
  10px 10px 0 0;

 }


 .url-box input{

  border-radius:
  0 0 10px 10px;

 }

}


</style>

</head>


<body>


<header>
🛠 코딩과 함께라면<br>
2026 Festival 관리자
</header>



<div id="app" style="display:none">


<div class="panel">


<h2>작품 추가</h2>


<label>작품명</label>
<input id="title">


<label>개발자</label>
<input id="by">


<label>설명</label>
<textarea id="detail"></textarea>


<label>사용법</label>
<textarea id="howto"></textarea>


<label>참고사항</label>
<textarea id="note"></textarea>


<label>유형</label>

<select id="type" onchange="changeType()">

<option value="github">
GitHub
</option>

<option value="entry">
Entry
</option>

</select>



<label>URL</label>

<div class="url-box">

<span class="url-prefix">
https://25withcoding.kr/2026festival/
</span>

<input id="url"
placeholder="페이지 주소">

</div>



<label>썸네일 URL</label>

<div class="url-box">

<span class="url-prefix">
https://25withcoding.kr/2026festival/
</span>

<input id="thum"
placeholder="이미지 주소">

</div>



<div id="embedBox" style="display:none">

<label>
엔트리 퍼가기 코드
</label>

<textarea id="embed"></textarea>

</div>



<button class="add" onclick="addProject()">
+ 작품 추가
</button>


</div>



<div class="panel">


<h2>등록된 작품</h2>


<div id="list"></div>


</div>



</div>





<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";


import {

getFirestore,
collection,
getDocs,
doc,
setDoc,
deleteDoc

}

from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";



const pw=prompt("관리자 비밀번호");


if(pw!=="20262326"){

document.body.innerHTML="접근 거부";

throw new Error("Denied");

}



document.getElementById("app").style.display="block";



const firebaseConfig={

apiKey:"AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9Q",

authDomain:"festivallikes.firebaseapp.com",

projectId:"festivallikes",

storageBucket:"festivallikes.firebasestorage.app",

messagingSenderId:"782245120700",

appId:"1:782245120700:web:c61e16313e9ae688e6deb9"

};



const app=initializeApp(firebaseConfig);

const db=getFirestore(app);




window.changeType=function(){

const type=
document.getElementById("type").value;


document.getElementById("embedBox").style.display=
type==="entry"?"block":"none";

};





window.addProject=async function(){


const title=
document.getElementById("title").value.trim();


if(!title){

alert("작품명을 입력하세요");

return;

}


const type=
document.getElementById("type").value;



await setDoc(
doc(db,"projects",title),
{

by:document.getElementById("by").value,

detail:document.getElementById("detail").value,

howto:document.getElementById("howto").value,

note:document.getElementById("note").value,

type:type,

url:
"https://25withcoding.kr/2026festival/"+
document.getElementById("url").value.replace(/^\/+/,""),

thum:
"https://25withcoding.kr/2026festival/" +
document.getElementById("thum").value.replace(/^\/+/,""),

embed:
type==="entry"?
document.getElementById("embed").value:"",

likes:0

});



alert("추가 완료");

loadProjects();

};





window.removeProject=async function(id){


if(!confirm(id+" 삭제?"))
return;


await deleteDoc(doc(db,"projects",id));


loadProjects();

};





async function loadProjects(){


const list=document.getElementById("list");

list.innerHTML="";


const snap=
await getDocs(collection(db,"projects"));



snap.forEach(d=>{


const data=d.data();


const div=document.createElement("div");


div.className="card";


div.innerHTML=`

<button class="delete"
onclick="removeProject('${d.id}')">
삭제
</button>

<div class="card-title">
${d.id}
</div>

<br>

👤 ${data.by||""}

<br>

<span class="badge">
${data.type||""}
</span>

`;



list.appendChild(div);


});


}



loadProjects();


</script>


</body>
</html>
