<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>탁구 대결 | MINI GAME</title><style>*{box-sizing:border-box}:root{color-scheme:dark;--g:#53e88a}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#17442c,transparent 42%),#050b08;color:#f3fff6;font-family:Arial,'Noto Sans KR',sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(950px,100%)}.top{display:flex;justify-content:space-between;color:#a9c5b2;font-size:12px;letter-spacing:.1em}h1{font-size:clamp(30px,5vw,46px);margin:14px 0 4px}.sub{color:#b8cdbf;line-height:1.7}canvas{display:block;width:100%;height:auto;margin:18px 0;border:1px solid #ffffff20;border-radius:18px;background:#06100a;box-shadow:0 20px 55px #0005}.score{display:flex;justify-content:center;gap:55px;font-size:16px}.score b{display:block;font-size:34px;text-align:center}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}button{border:0;border-radius:12px;padding:12px 18px;background:var(--g);color:#062012;font-weight:800;cursor:pointer}.secondary{background:#ffffff12;color:white;border:1px solid #ffffff20}.hint{color:#a9c5b2;font-size:13px}#message{min-height:26px;margin-top:14px;font-weight:750}.hidden{display:none!important}/* Responsive full-screen layout: keep the game inside the visible viewport. */
html{width:100%;height:100%;overflow:hidden}
body{width:100%;height:100dvh;min-height:0!important;overflow:hidden!important;padding:clamp(6px,1.2vh,14px)!important;overscroll-behavior:none}
.wrap{width:min(100%,1000px);max-height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:clamp(3px,0.7vh,8px);padding:0!important;margin:auto}
.wrap>*{flex-shrink:0}
h1,.heading h1{font-size:clamp(21px,4.2vh,42px)!important;line-height:1.08;margin:clamp(2px,0.5vh,7px) 0!important}
p,.sub,.desc,.help{font-size:clamp(11px,1.65vh,15px);line-height:1.35}
canvas{max-width:100%;max-height:43dvh;width:auto;height:auto;object-fit:contain;margin-block:clamp(3px,0.6vh,8px)!important}
button,.btn{padding:clamp(7px,1.2vh,12px) clamp(10px,2vw,18px);font-size:clamp(11px,1.6vh,15px)}
#message{min-height:0!important;margin:clamp(2px,0.4vh,6px) 0!important;font-size:clamp(11px,1.6vh,15px)}
.top{flex-shrink:0}
@media(max-width:650px){body{padding:6px!important}.wrap{width:100%;gap:3px}.heading{margin:4px 0 6px!important}.controls{grid-template-columns:1fr 1fr!important;gap:5px!important}.control{padding:6px!important}.control span{font-size:10px!important}.arena{padding:4px!important}.scores{margin:4px 0!important}.score{padding:5px 8px!important}.score strong{font-size:clamp(16px,3vh,22px)!important}.help{margin:4px 0!important}.bottom{gap:5px!important}}
@media(max-height:620px){canvas{max-height:35dvh}.heading{margin:3px 0 5px!important}.scores{margin:3px 0!important}.controls{gap:4px!important}.control{padding:5px 8px!important}.help{margin:3px 0!important}}

/* Refined MINI GAME interface */
:root{color-scheme:light;--mg-ink:#17251c;--mg-muted:#617166;--mg-green:#187447;--mg-line:#dbe5dc}
body{background:#f2f5f1!important;color:var(--mg-ink)!important;font-family:Inter,'Noto Sans KR',system-ui,sans-serif!important}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 0% 0%,#dceee0 0,transparent 40%);z-index:-1}
.wrap{color:var(--mg-ink)!important}
.top,.sub,.desc,.muted,.hint,.instruction,.info,.help,.round,.note{color:var(--mg-muted)!important}
.arena,.setting,.summary,.history,.card,.score,.keyhelp span{background:#fff!important;color:var(--mg-ink)!important;border:1px solid var(--mg-line)!important;box-shadow:0 12px 35px #203b2810!important}
.card{border-radius:16px!important}
button,.btn,.next,.done,.resultBtn{background:#187447!important;color:#fff!important;border:1px solid #187447!important;border-radius:11px!important;font-weight:750!important}
button:disabled{opacity:.42!important}
button:hover,.btn:hover,.next:hover,.done:hover{background:#12613a!important;box-shadow:0 7px 18px #18744722!important}
input{background:#fff!important;color:var(--mg-ink)!important;border:1px solid #cbd8cd!important}
.cell{background:#e8eee9!important;border:1px solid #d5e0d7!important}
.cell.me,.p1{background:#2e9b5c!important}.cell.opp,.p2{background:#edbd56!important}
.icon{display:none!important}
#miniSoundPanel button{background:#fff!important;color:#23412d!important;border:1px solid #d4e0d5!important;box-shadow:0 4px 14px #0001!important}
@media(max-width:650px){.card .desc{display:none!important}#projectShortDescription,#projectCreator{display:block!important}.wrap{padding:0!important}}
</style></head><body><main class="wrap"><div class="top"><span>MINI GAME / 08</span><span id="round"></span></div><h1>탁구 대결</h1><div class="sub">공을 받아쳐 상대 코트에 떨어뜨리세요. 먼저 5점을 얻으면 승리합니다.</div><div class="score"><div><span id="leftLabel">플레이어</span><b id="leftScore">0</b></div><div><span id="rightLabel">컴퓨터</span><b id="rightScore">0</b></div></div><canvas id="court" width="900" height="480" aria-label="탁구 게임"></canvas><div class="bar"><button id="start">시작 / 다시 시작</button><button class="secondary" id="done" hidden>결과 확인 →</button><span class="hint" id="controls">W/S 또는 ↑/↓로 패들을 움직이세요.</span></div><div id="message">시작을 눌러 게임하세요.</div></main><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu'};const mode=s.mode||'cpu';document.getElementById('round').textContent=s.round?s.round+'번째 게임':'';if(mode==='local'){document.getElementById('leftLabel').textContent='1P';document.getElementById('rightLabel').textContent='2P';document.getElementById('controls').textContent='1P: W/S · 2P: ↑/↓'}if(mode==='online')document.getElementById('message').textContent='온라인 입력 동기화는 아직 연결되지 않아 로컬 플레이만 가능합니다.';
const cv=document.getElementById('court'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;let p1=H/2,p2=H/2,bx=W/2,by=H/2,vx=5,vy=3,score1=0,score2=0,playing=false,over=false,keys=new Set(),raf=0,lastHit=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function serve(dir){bx=W/2;by=H/2;vx=dir*5;vy=(Math.random()-.5)*6;lastHit=0}
function reset(){score1=score2=0;p1=p2=H/2;document.getElementById('leftScore').textContent=document.getElementById('rightScore').textContent='0';over=false;playing=false;document.getElementById('done').hidden=true;document.getElementById('message').textContent='곧 시작합니다.';serve(Math.random()<.5?-1:1);cancelAnimationFrame(raf);beginUniversalCountdown(()=>{playing=true;document.getElementById('message').textContent='경기 진행 중';loop()})}
function finish(w){if(over)return;over=true;playing=false;document.getElementById('message').textContent=w==='me'?'1P 승리!':mode==='local'?'2P 승리!':'컴퓨터 승리!';localStorage.setItem('miniGameResult',JSON.stringify({game:'탁구 대결',winner:w,me:score1,opp:score2}));document.getElementById('done').hidden=false;window.miniGameSound?.('win')}
function point(player){if(player===1){score1++;document.getElementById('leftScore').textContent=score1;window.miniGameSound?.('score')}else{score2++;document.getElementById('rightScore').textContent=score2;window.miniGameSound?.('score')}if(score1>=5||score2>=5){finish(score1>score2?'me':'opp');return}serve(player===1?1:-1)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a2114';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff2a';ctx.lineWidth=3;ctx.strokeRect(18,18,W-36,H-36);ctx.setLineDash([12,12]);ctx.beginPath();ctx.moveTo(W/2,18);ctx.lineTo(W/2,H-18);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#53e88a';ctx.fillRect(42,p1-48,13,96);ctx.fillStyle='#ffd477';ctx.fillRect(W-55,p2-48,13,96);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a9c5b2';ctx.font='bold 14px Arial';ctx.fillText('P1',40,42);ctx.textAlign='right';ctx.fillText(mode==='local'?'P2':'CPU',W-40,42);ctx.textAlign='left'}
function loop(){if(!playing){draw();return}if(keys.has('KeyW'))p1-=6;if(keys.has('KeyS'))p1+=6;if(keys.has('ArrowUp'))p2-=6;if(keys.has('ArrowDown'))p2+=6;p1=clamp(p1,68,H-68);if(mode==='cpu'){const diff=by-p2;p2+=clamp(diff*.075,-4.2,4.2)}else p2=clamp(p2,68,H-68);bx+=vx;by+=vy;if(by<30||by>H-30){vy*=-1;window.miniGameSound?.('bounce')}if(bx<67&&bx>45&&Math.abs(by-p1)<61&&vx<0){vx=Math.abs(vx)*1.045;vy+=((by-p1)/60)*2.5;window.miniGameSound?.('hit')}if(bx>W-67&&bx<W-45&&Math.abs(by-p2)<61&&vx>0){vx=-Math.abs(vx)*1.045;vy+=((by-p2)/60)*2.5;window.miniGameSound?.('hit')}if(bx<15)point(2);if(bx>W-15)point(1);vy=clamp(vy,-8,8);draw();raf=requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','Space','KeyW','KeyS'].includes(e.code))e.preventDefault();keys.add(e.code)},true);window.addEventListener('keyup',e=>keys.delete(e.code),true);document.getElementById('start').onclick=reset;document.getElementById('done').onclick=()=>location.href='../index.html';document.body.tabIndex=0;document.addEventListener('pointerdown',()=>{try{document.body.focus({preventScroll:true})}catch(e){}},true);draw();reset();
function beginUniversalCountdown(onGo){let overlay=document.getElementById('mgUniversalCountdown');if(!overlay){overlay=document.createElement('div');overlay.id='mgUniversalCountdown';overlay.style.cssText='position:fixed;inset:0;z-index:100000;display:grid;place-items:center;background:#07130de8;color:#fff;font:800 clamp(64px,16vw,140px)/1 Arial,sans-serif;letter-spacing:.04em';document.body.appendChild(overlay)}let seq=['3!','2!','1!','GO!'],i=0;overlay.style.display='grid';const step=()=>{overlay.textContent=seq[i];overlay.style.color=i===3?'#72f0a1':'#fff';window.miniGameSound?.(i===3?'win':'key');if(i++<3)setTimeout(step,650);else setTimeout(()=>{overlay.style.display='none';onGo?.()},420)};step()}document.body.tabIndex=0;document.addEventListener('pointerdown',()=>{try{document.body.focus({preventScroll:true})}catch(e){}},true);</script></main><div id="miniSoundPanel" style="position:fixed;right:14px;bottom:14px;z-index:9999"><button id="miniSoundToggle" type="button" aria-pressed="true" style="border:1px solid #ffffff35;border-radius:999px;padding:10px 14px;background:#10251a;color:#effff4;font:700 13px Arial,sans-serif;box-shadow:0 6px 22px #0006;cursor:pointer"> 소리 켜짐</button></div><script>(function(){let enabled=localStorage.getItem('miniGameSound')!=='off',audio=null,lastKeySound=0;const btn=document.getElementById('miniSoundToggle');function label(){btn.textContent=enabled?'소리 켜짐':'소리 꺼짐';btn.setAttribute('aria-pressed',String(enabled))}function sound(kind='ui'){if(!enabled)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{audio=audio||new AC();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const seq=kind==='win'?[523,659,784]:kind==='score'?[660,880]:kind==='hit'?[220,165]:kind==='bounce'?[420]:kind==='jump'?[440,660]:kind==='key'?[330]:[520];seq.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='hit'?'triangle':'sine';o.frequency.setValueAtTime(hz,now+i*.075);g.gain.setValueAtTime(.0001,now+i*.075);g.gain.exponentialRampToValueAtTime(((kind==='ui'||kind==='key')?0.035:0.065),now+i*.075+.012);g.gain.exponentialRampToValueAtTime(.0001,now+i*.075+.11);o.connect(g);g.connect(audio.destination);o.start(now+i*.075);o.stop(now+i*.075+.12)})}catch(e){}}window.miniGameSound=sound;btn.addEventListener('click',()=>{enabled=!enabled;localStorage.setItem('miniGameSound',enabled?'on':'off');label();if(enabled)sound('ui')});document.addEventListener('click',e=>{if(e.target.closest('#miniSoundPanel'))return;if(e.target.closest('button'))sound('ui')},true);document.addEventListener('keydown',e=>{if(e.repeat||!['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code))return;const now=performance.now();if(now-lastKeySound>75){sound('key');lastKeySound=now}},true);label()})();</script><script type="module" src="../online-sync.js"></script>
<script>
/* Tablet keyboard focus and automatic result display */
(function(){
  try{localStorage.removeItem('miniGameResult')}catch(e){}
  document.body.tabIndex=0;
  const focusGame=()=>{try{document.body.focus({preventScroll:true})}catch(e){document.body.focus()}};
  window.addEventListener('pageshow',()=>setTimeout(focusGame,100));
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('button,input,textarea,select'))focusGame()},{passive:true});
  const css=document.createElement('style');
  css.textContent='#mgAutoResult{position:fixed;inset:0;z-index:20000;display:none;place-items:center;padding:20px;background:#07110ddd;backdrop-filter:blur(10px)}#mgAutoResult .panel{width:min(460px,94vw);padding:30px;border:1px solid #b6f6ca;border-radius:24px;background:#f8fff9;color:#17251c;text-align:center;box-shadow:0 24px 80px #0005;font-family:Arial,sans-serif}#mgAutoResult .headline{font-size:clamp(34px,8vw,54px);font-weight:950;margin:12px 0}#mgAutoResult .detail{color:#617166;line-height:1.6}#mgAutoResult button{margin-top:22px;border:0;border-radius:12px;padding:14px 24px;background:#187447;color:white;font-weight:850;font-size:15px}#mgTabletPad{position:fixed;left:10px;bottom:10px;z-index:8000;display:flex;gap:6px;flex-wrap:wrap;max-width:85vw}#mgTabletPad button{touch-action:manipulation;min-width:44px;min-height:42px;padding:9px 12px;border:1px solid #b9d9c3;border-radius:12px;background:#f7fff8;color:#173d28;font-weight:850;box-shadow:0 4px 14px #0002}';
  document.head.appendChild(css);
  const overlay=document.createElement('div');overlay.id='mgAutoResult';
  overlay.innerHTML='<div class="panel"><div style="font-size:12px;font-weight:850;letter-spacing:.15em;color:#187447">MATCH RESULT</div><div class="headline" id="mgAutoHeadline">경기 종료</div><div class="detail" id="mgAutoDetail">최종 결과</div><button id="mgAutoBack">메뉴로 돌아가기</button></div>';
  document.body.appendChild(overlay);
  document.getElementById('mgAutoBack').onclick=()=>location.href='../index.html';
  let shown=false;

  function showResult(data){
    if(shown||!data||!data.winner)return;
    shown=true;
    const settings=JSON.parse(localStorage.getItem('miniGameSettings')||'null');document.getElementById('mgAutoHeadline').textContent=settings?.mode==='local'?(data.winner==='me'?'1P 승':data.winner==='opp'?'2P 승':'무승부'):(data.winner==='me'?'승리':data.winner==='opp'?'패배':'무승부');
    const score=data.me!==undefined||data.opp!==undefined?'최종 점수 '+(data.me??0)+' : '+(data.opp??0):'';
    document.getElementById('mgAutoDetail').textContent=[data.game||'미니게임',score].filter(Boolean).join(' · ');
    overlay.style.display='grid';
  }
  function checkResult(){let raw;try{raw=localStorage.getItem('miniGameResult')}catch(e){return}if(raw){try{showResult(JSON.parse(raw))}catch(e){}}}
  const originalSetItem=Storage.prototype.setItem;
  Storage.prototype.setItem=function(key,value){
    originalSetItem.call(this,key,value);
    if(key==='miniGameResult'){try{showResult(JSON.parse(value))}catch(e){}}
  };
  const observer=new MutationObserver(checkResult);
  observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','hidden','style']});
  // On-screen backup controls for touchscreen tablets
  const n=(location.pathname.match(/game([1-9])\.html/)||[])[1];
  const keys={'1':[['A','KeyA'],['L','KeyL']],'2':[['A','KeyA'],['L','KeyL']],'3':[['반응','Enter']],'5':[['점프','Space']],'6':[['위','ArrowUp'],['아래','ArrowDown'],['발사','Enter'],['방향','Space']],'7':[['왼쪽','KeyA'],['오른쪽','KeyD'],['발사','KeyS'],['P2 ←','ArrowLeft'],['P2 →','ArrowRight'],['P2 발사','ArrowDown']],'8':[['위','ArrowUp'],['아래','ArrowDown'],['시작','Enter']],'9':[['왼쪽','ArrowLeft'],['오른쪽','ArrowRight'],['점프','Space'],['P2 점프','ArrowUp']]};
  if(keys[n]){
    const pad=document.createElement('div');pad.id='mgTabletPad';
    keys[n].forEach(([label,code])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{focusGame();const key=code==='Space'?' ':code==='Enter'?'Enter':code.startsWith('Key')?code.slice(3).toLowerCase():code;document.dispatchEvent(new KeyboardEvent('keydown',{key,code,bubbles:true,cancelable:true}));if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyS'].includes(code))document.dispatchEvent(new KeyboardEvent('keyup',{key,code,bubbles:true,cancelable:true}))};pad.appendChild(b)});
    document.body.appendChild(pad);
  }
})();
</script>
