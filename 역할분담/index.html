<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>역할분담 | 코딩과 함께라면</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:24px; background:#f5f7f8; font-family:Arial,"Noto Sans KR",sans-serif; color:#222; }
    .container { width:min(900px,100%); background:#fff; border-radius:20px; padding:32px; box-shadow:0 10px 35px rgba(0,0,0,.08); }
    h1 { margin:0 0 8px; text-align:center; font-size:clamp(26px,5vw,40px); }
    .description { margin:0 0 28px; text-align:center; color:#666; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; overflow:hidden; border-radius:14px; }
    th,td { border:2px solid #222; height:120px; text-align:center; vertical-align:middle; }
    th { height:64px; background:#27ae60; color:white; font-size:20px; }
    th:first-child { width:90px; }
    td:first-child { background:#f0f0f0; font-weight:700; font-size:20px; }
    .balls { display:flex; justify-content:center; align-items:center; gap:14px; }
    .ball { width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:3px solid #222; font-size:24px; font-weight:800; box-shadow:0 4px 8px rgba(0,0,0,.12); }
    .ball.a { background:#3498db; color:white; border-color:#21618c; }
    .ball.b { background:#f39c12; color:white; border-color:#b9770e; }
    button { display:block; margin:24px auto 0; padding:12px 24px; border:0; border-radius:10px; background:#27ae60; color:white; font-size:16px; font-weight:700; cursor:pointer; }
    button:hover { background:#219653; }
    @media (max-width:600px) { .container{padding:18px;} th,td{height:95px;} th{font-size:16px;} th:first-child{width:62px;} .ball{width:46px;height:46px;font-size:19px;} .balls{gap:7px;} }
  </style>
</head>
<body>
  <main class="container">
    <h1>역할분담</h1>
    <p class="description">A색 공 1~5번과 B색 공 1~3번을 무작위로 배치합니다.</p>
    <table>
      <thead><tr><th></th><th>코딩과 함께라면</th><th>싼 카페</th></tr></thead>
      <tbody>
        <tr><td>1팀</td><td><div class="balls" id="team1-coding"></div></td><td><div class="balls" id="team1-cafe"></div></td></tr>
        <tr><td>2팀</td><td><div class="balls" id="team2-coding"></div></td><td><div class="balls" id="team2-cafe"></div></td></tr>
      </tbody>
    </table>
    <button type="button" onclick="randomize()">다시 랜덤 배치</button>
  </main>
  <script>
    function shuffle(array) {
      for (let i=array.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [array[i],array[j]]=[array[j],array[i]]; }
      return array;
    }
    function createBall(type, number) {
      const ball=document.createElement('div');
      ball.className=`ball ${type.toLowerCase()}`;
      ball.textContent=number;
      return ball;
    }
    function randomize() {
      const cells=[
        document.getElementById('team1-coding'),
        document.getElementById('team1-cafe'),
        document.getElementById('team2-coding'),
        document.getElementById('team2-cafe')
      ];
      cells.forEach(cell=>cell.innerHTML='');

      // A색 공: 1~5, 각 번호는 한 번씩만 사용
      const aBalls=shuffle([1,2,3,4,5]).map(number=>({type:'A',number}));
      // B색 공: 1~3, 각 번호는 한 번씩만 사용
      const bBalls=shuffle([1,2,3]).map(number=>({type:'B',number}));

      // B색 공은 서로 다른 칸에 배치
      const bCellIndexes=shuffle([0,1,2,3]).slice(0,3);
      bBalls.forEach((ball,index)=>cells[bCellIndexes[index]].appendChild(createBall(ball.type,ball.number)));

      // 남은 5개 자리에 A색 공을 무작위 배치 → 모든 칸에 정확히 2개
      const remainingSlots=[];
      cells.forEach((cell,cellIndex)=>{
        for(let i=cell.children.length;i<2;i++) remainingSlots.push(cellIndex);
      });
      shuffle(remainingSlots).forEach((cellIndex,index)=>{
        const ball=aBalls[index];
        cells[cellIndex].appendChild(createBall(ball.type,ball.number));
      });
    }
    randomize();
  </script>
</body>
</html>
