<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Festival · 이용권 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#0f0f14;color:white}header{position:sticky;top:0;z-index:100;padding:18px 24px;background:linear-gradient(90deg,#00c853,#64dd17);box-shadow:0 4px 20px rgba(0,0,0,.3)}.header-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-family:"Black Han Sans",sans-serif;font-size:25px}.back{color:white;text-decoration:none;font-size:14px}.container{width:min(1100px,calc(100% - 32px));margin:30px auto 60px}.page-title{margin-bottom:25px}.page-title h1{margin:0;font-family:"Black Han Sans",sans-serif;font-size:32px}.page-title p{margin:8px 0 0;color:#aaa;font-size:14px}.card{background:#1c1c25;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:24px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,.2)}.card-title{margin:0 0 18px;font-size:19px;font-weight:bold}.coin-types{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.coin-type{position:relative}.coin-type input{position:absolute;opacity:0;pointer-events:none}.coin-type label{display:block;padding:16px 8px;text-align:center;background:#15151c;border:1px solid #353540;border-radius:12px;cursor:pointer;transition:.2s}.coin-type label:hover{border-color:#00c853}.coin-type input:checked+label{border-color:#00c853;background:rgba(0,200,83,.12);box-shadow:0 0 0 2px rgba(0,200,83,.08)}.coin-number{font-size:22px;font-weight:bold}.coin-char{margin-top:5px;color:#8cff9c;font-size:12px}.generate-btn{width:100%;height:52px;margin-top:18px;border:none;border-radius:12px;background:linear-gradient(90deg,#00c853,#64dd17);color:white;font-size:16px;font-weight:bold;cursor:pointer}.generate-btn:disabled{opacity:.5;cursor:not-allowed}.status{min-height:20px;margin-top:12px;text-align:center;color:#aaa;font-size:13px}.status.error{color:#ff7070}.status.success{color:#8cff9c}.issued{display:none;margin-top:18px;padding:22px;text-align:center;background:#15151c;border:1px solid rgba(0,200,83,.25);border-radius:16px}.issued-title{font-weight:bold;color:#8cff9c}.issued-code{margin:8px 0;font-family:monospace;font-size:34px;font-weight:bold;letter-spacing:3px}.issued-type{color:#aaa;margin-bottom:12px}.copy-issued{border:none;border-radius:10px;padding:10px 16px;background:#292933;color:white;cursor:pointer}.code-list{display:flex;flex-direction:column;gap:10px}.code-item{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:15px;background:#15151c;border-radius:12px}.code{font-family:monospace;font-size:18px;font-weight:bold;letter-spacing:1px}.code-info{margin-top:5px;color:#999;font-size:12px;line-height:1.6}.badge{padding:6px 9px;border-radius:8px;background:rgba(0,200,83,.12);color:#8cff9c;font-size:12px;white-space:nowrap}.action-btn{border:none;border-radius:8px;padding:9px 12px;background:#292933;color:white;cursor:pointer;white-space:nowrap}.action-btn.danger{color:#ff8585}.empty,.loading{padding:35px;text-align:center;color:#777}#denied{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}.denied-card{width:min(420px,100%);padding:35px;text-align:center;background:#1c1c25;border-radius:20px}.denied-icon{font-size:48px}.denied-card p{color:#aaa;line-height:1.7}.denied-card a{display:inline-block;margin-top:15px;color:#8cff9c}#app{display:none}@media(max-width:800px){.coin-types{grid-template-columns:repeat(2,1fr)}.code-item{grid-template-columns:1fr auto}.code-item .delete-btn{grid-column:2}.badge{justify-self:start}}@media(max-width:500px){.coin-types{grid-template-columns:1fr}.container{width:calc(100% - 20px)}.card{padding:17px}.page-title h1{font-size:27px}.logo{font-size:20px}.issued-code{font-size:28px}}
</style>
</head>
<body>
<div id="denied"><div class="denied-card"><div class="denied-icon">🔒</div><h1>접근 권한이 없습니다</h1><p>2026 Festival 이용권 관리 페이지는 지정된 관리자만 사용할 수 있습니다.</p><a href="/2026festival/">축제 페이지로 돌아가기</a></div></div>
<div id="app"><header><div class="header-inner"><div class="logo">2026 Festival · 이용권 관리</div><a class="back" href="/2026festival/">축제로 돌아가기</a></div></header><main class="container"><div class="page-title"><h1>🎟 이용권 관리</h1><p>축제 입장용 이용권을 발급하고 관리합니다.</p></div>
<section class="card"><h2 class="card-title">이용권 발급</h2><div class="coin-types"><div class="coin-type"><input type="radio" name="coinType" id="coin1" value="1"><label for="coin1"><div class="coin-number">1인권</div><div class="coin-char">마지막 문자 · A</div></label></div><div class="coin-type"><input type="radio" name="coinType" id="coin2" value="2"><label for="coin2"><div class="coin-number">2인권</div><div class="coin-char">마지막 문자 · F</div></label></div><div class="coin-type"><input type="radio" name="coinType" id="coin3" value="3"><label for="coin3"><div class="coin-number">3인권</div><div class="coin-char">마지막 문자 · K</div></label></div><div class="coin-type"><input type="radio" name="coinType" id="coin4" value="4"><label for="coin4"><div class="coin-number">4인권</div><div class="coin-char">마지막 문자 · P</div></label></div><div class="coin-type"><input type="radio" name="coinType" id="coin5" value="5"><label for="coin5"><div class="coin-number">5인권</div><div class="coin-char">마지막 문자 · U</div></label></div></div><button class="generate-btn" id="generateButton">이용권 발급</button><div class="status" id="generateStatus"></div><div class="issued" id="issuedBox"><div class="issued-title">발급 완료</div><div class="issued-code" id="issuedCode"></div><div class="issued-type" id="issuedType"></div><button class="copy-issued" id="copyIssued">복사하기</button></div></section>
<section class="card"><h2 class="card-title">발급된 이용권</h2><div class="code-list" id="codeList"><div class="loading">이용권을 불러오는 중...</div></div></section></main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,collection,onSnapshot,deleteDoc,serverTimestamp,runTransaction,query,orderBy}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9Q",authDomain:"festivallikes.firebaseapp.com",projectId:"festivallikes",storageBucket:"festivallikes.firebasestorage.app",messagingSenderId:"782245120700",appId:"1:782245120700:web:c61e16313e9ae688e6deb9"};
const loginFirebaseConfig={apiKey:"AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20",authDomain:"points2026-f5e50.firebaseapp.com",projectId:"points2026-f5e50"};
const db=getFirestore(initializeApp(firebaseConfig));const loginDB=getFirestore(initializeApp(loginFirebaseConfig,"loginApp"));
const appElement=document.getElementById("app"),deniedElement=document.getElementById("denied"),generateButton=document.getElementById("generateButton"),generateStatus=document.getElementById("generateStatus"),codeList=document.getElementById("codeList"),issuedBox=document.getElementById("issuedBox"),issuedCode=document.getElementById("issuedCode"),issuedType=document.getElementById("issuedType"),copyIssued=document.getElementById("copyIssued");
const coinCharacters={1:"A",2:"F",3:"K",4:"P",5:"U"};let lastIssuedCode="";
function denyAccess(){appElement.style.display="none";deniedElement.style.display="flex"}
async function checkAdminAccess(){const userId=localStorage.getItem("userId");if(!userId){denyAccess();return false}try{const snap=await getDoc(doc(loginDB,"users",userId));if(!snap.exists()){denyAccess();return false}const user=snap.data();const allowed=user.role==="president"||user.role==="vice"||user.coinManager===true;if(!allowed){denyAccess();return false}appElement.style.display="block";return true}catch(error){console.error("관리자 권한 확인 실패:",error);denyAccess();return false}}
function randomPrefix(){const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";const values=new Uint32Array(4);crypto.getRandomValues(values);return Array.from(values,v=>chars[v%chars.length]).join("")}
function createAccessCode(people){return(randomPrefix()+coinCharacters[people]).toUpperCase()}
async function generateCode(){const selected=document.querySelector('input[name="coinType"]:checked');if(!selected){generateStatus.className="status error";generateStatus.textContent="이용권 종류를 선택해주세요.";return}const people=Number(selected.value);generateButton.disabled=true;issuedBox.style.display="none";generateStatus.className="status";generateStatus.textContent="이용권을 발급하는 중...";try{let savedCode=null;for(let attempt=0;attempt<20&&!savedCode;attempt++){const code=createAccessCode(people);const codeRef=doc(db,"accesscodes",code);const created=await runTransaction(db,async transaction=>{const existing=await transaction.get(codeRef);if(existing.exists())return false;transaction.set(codeRef,{max:people,used:0,active:true,createdAt:serverTimestamp(),createdBy:localStorage.getItem("userId")||"unknown"});return true});if(created)savedCode=code}if(!savedCode)throw new Error("CODE_GENERATION_FAILED");lastIssuedCode=savedCode;issuedCode.textContent=savedCode;issuedType.textContent=`${people}인권`;issuedBox.style.display="block";generateStatus.className="status success";generateStatus.textContent=`${savedCode} 발급 완료!`;selected.checked=false}catch(error){console.error("이용권 발급 실패:",error);generateStatus.className="status error";generateStatus.textContent=error.message==="CODE_GENERATION_FAILED"?"코드 생성에 실패했습니다. 다시 시도해주세요.":"이용권 발급에 실패했습니다."}finally{generateButton.disabled=false}}
copyIssued.addEventListener("click",async()=>{if(!lastIssuedCode)return;try{await navigator.clipboard.writeText(lastIssuedCode);copyIssued.textContent="복사됨";setTimeout(()=>copyIssued.textContent="복사하기",1200)}catch(error){console.error("코드 복사 실패:",error);alert(`코드를 복사하지 못했습니다.\n\n${lastIssuedCode}`)}});
async function deleteCode(id){if(!confirm(`정말 이 이용권을 삭제할까요?\n\n${id}\n\n삭제하면 더 이상 입장에 사용할 수 없습니다.`))return;try{await deleteDoc(doc(db,"accesscodes",id))}catch(error){console.error("이용권 삭제 실패:",error);alert("이용권 삭제에 실패했습니다.")}}
function formatDate(timestamp){if(!timestamp?.toDate)return"-";return timestamp.toDate().toLocaleString("ko-KR")}
function loadCodes(){const codesQuery=query(collection(db,"accesscodes"),orderBy("createdAt","desc"));onSnapshot(codesQuery,snapshot=>{const codes=[];snapshot.forEach(item=>codes.push({id:item.id,...item.data()}));codeList.innerHTML="";if(!codes.length){codeList.innerHTML='<div class="empty">아직 발급된 이용권이 없습니다.</div>';return}codes.forEach(item=>{const used=Number(item.used||0),max=Number(item.max||0),remaining=Math.max(max-used,0);const element=document.createElement("div");element.className="code-item";element.innerHTML=`<div><div class="code">${item.id}</div><div class="code-info">사용 ${used} / ${max}명 · 남은 ${remaining}명<br>발급일 ${formatDate(item.createdAt)} · 발급자 ${item.createdBy||"-"}</div></div><div class="badge">${max}인권</div><button class="action-btn copy-btn">복사</button><button class="action-btn danger delete-btn">삭제</button>`;element.querySelector(".copy-btn").onclick=async()=>{try{await navigator.clipboard.writeText(item.id);element.querySelector(".copy-btn").textContent="복사됨";setTimeout(()=>element.querySelector(".copy-btn").textContent="복사",1000)}catch(error){console.error("코드 복사 실패:",error);alert(`코드를 복사하지 못했습니다.\n\n${item.id}`)}};element.querySelector(".delete-btn").onclick=()=>deleteCode(item.id);codeList.appendChild(element)})},error=>{console.error("이용권 목록 불러오기 실패:",error);codeList.innerHTML='<div class="empty">이용권 목록을 불러오지 못했습니다.</div>'})}
generateButton.addEventListener("click",generateCode);const allowed=await checkAdminAccess();if(allowed)loadCodes();
</script>
</body>
</html>
