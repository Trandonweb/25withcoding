name: Cloudflare Worker regression tests

on:
  push:
    branches:
      - main
      - security/cloudflare-worker-backend
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/worker-tests.yml"

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Worker regression tests
        run: node --test cloudflare-worker/test/worker.test.js
