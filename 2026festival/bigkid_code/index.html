<!doctype html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미니게임 천국 - 오목 + 체스 + UNO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2e6d2;color:#222;font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center}#app{width:min(1100px,100vw);min-height:700px;padding:22px;display:flex;flex-direction:column;align-items:center}h1{margin:8px 0 22px;font-size:42px}button{border:0;border-radius:10px;padding:13px 24px;font-size:18px;font-weight:700;cursor:pointer;background:#4682b4;color:#fff}button:hover{filter:brightness(1.08)}button:disabled{background:#999;cursor:not-allowed}.screen{width:100%;display:flex;flex-direction:column;align-items:center}.menu{display:grid;gap:14px;width:min(360px,90vw)}.menu button{height:60px}.secondary{background:#666}.danger{background:#b44646}.game-wrap{width:100%;display:grid;grid-template-columns:minmax(600px,800px) 250px;gap:18px;align-items:start}.board-card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 8px 28px #0002}.side{background:#ebdec8;border-radius:16px;padding:18px;min-height:500px}.side h2{margin-top:0}.status{font-weight:800;margin:12px 0}.hint{font-size:14px;line-height:1.55;color:#555}.hidden{display:none}.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.topbar button{padding:9px 15px;font-size:15px}canvas{display:block;max-width:100%;height:auto;margin:auto;border-radius:8px}.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.choices button{min-width:150px}.uno-area{background:#237844;border-radius:16px;padding:18px;min-height:620px;color:#fff}.uno-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:120px}.uno-card{width:72px;height:108px;border-radius:12px;border:4px solid #fff;box-shadow:0 4px 8px #0004;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;cursor:pointer;color:#fff;text-shadow:0 1px 2px #000}.uno-card.small{cursor:default;width:52px;height:78px;font-size:18px}.uno-red{background:#dc3232}.uno-yellow{background:#f5cd32;color:#222;text-shadow:none}.uno-green{background:#32a050}.uno-blue{background:#3264d2}.uno-wild{background:#222}.uno-center{display:flex;justify-content:center;align-items:center;gap:24px;margin:20px 0}.draw{width:95px;height:130px;border-radius:12px;background:repeating-linear-gradient(45deg,#222 0 8px,#555 8px 16px);border:4px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer}.color-pick{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}.color-box{background:#fff;border-radius:16px;padding:24px;display:grid;gap:10px;grid-template-columns:1fr 1fr}.color-box h3{grid-column:1/-1;margin:0 0 5px;text-align:center}.message{min-height:28px;text-align:center;font-weight:700}.kbd{font-family:monospace;background:#ffffff99;border-radius:4px;padding:2px 5px}@media(max-width:900px){#app{padding:10px}.game-wrap{grid-template-columns:1fr}.side{min-height:0}.game-wrap{display:flex;flex-direction:column}.board-card{width:100%}h1{font-size:32px}}
</style>

<body><main id="app"></main>
<script>
'use strict';
const app=document.getElementById('app');
let gameState='MAIN_MENU',selectedGame=null,gameMode=null,difficulty=null;
let aiThinking=false,aiTimer=null;
const $=s=>document.querySelector(s);
function button(text,fn,cls=''){const b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b}
function shell(title){app.innerHTML='';const top=document.createElement('div');top.className='topbar';top.append(button('← 메뉴',()=>showMode()));const h=document.createElement('h1');h.textContent=title;top.append(h);top.append(document.createElement('span'));app.append(top)}
function mainMenu(){gameState='MAIN_MENU';app.innerHTML='<h1>미니게임 천국</h1>';const m=document.createElement('div');m.className='menu';m.append(button('⚫ 오목',()=>selectGame('OMOK')));m.append(button('♔ 체스',()=>selectGame('CHESS')));m.append(button('🃏 UNO',()=>selectGame('UNO')));app.append(m)}
function selectGame(g){selectedGame=g;showMode()}
function showMode(){gameState='MODE_SELECT';shell(selectedGame==='OMOK'?'오목':selectedGame==='CHESS'?'체스':'UNO');const m=document.createElement('div');m.className='menu';if(selectedGame!=='UNO')m.append(button('🤖 AI와 플레이',()=>showDifficulty()));m.append(button('👥 2인용 플레이 (로컬)',()=>startGame('MULTI')));m.append(button('🌐 온라인 (준비 중)',()=>{},'secondary'));m.append(button('뒤로 가기',mainMenu,'secondary'));app.append(m)}
function showDifficulty(){gameState='DIFFICULTY_SELECT';shell('AI 난이도 선택');const m=document.createElement('div');m.className='menu';m.append(button('쉬움',()=>startGame('AI','EASY')));m.append(button('어려움',()=>startGame('AI','HARD'),'danger'));m.append(button('뒤로 가기',showMode,'secondary'));app.append(m)}
function startGame(mode,diff=null){gameMode=mode;difficulty=diff;gameState='PLAYING';if(selectedGame==='OMOK')resetOmok();if(selectedGame==='CHESS')resetChess();if(selectedGame==='UNO')resetUno()}

// ===================== 오목 =====================
const N=15;let ob=[],oturn=1,omsg='',winLine=null;
const dirs=[[0,1],[1,0],[1,1],[1,-1]];
function resetOmok(){ob=Array.from({length:N},()=>Array(N).fill(0));oturn=1;omsg='흑돌부터 시작합니다.';winLine=null;drawOmok()}
function inside(r,c){return r>=0&&r<N&&c>=0&&c<N}
function lineInfo(b,r,c,p,dr,dc){let a=0,nr=r-dr,nc=c-dc;while(inside(nr,nc)&&b[nr][nc]===p){a++;nr-=dr;nc-=dc}const open1=inside(nr,nc)&&b[nr][nc]===0;let d=0;nr=r+dr;nc=c+dc;while(inside(nr,nc)&&b[nr][nc]===p){d++;nr+=dr;nc+=dc}const open2=inside(nr,nc)&&b[nr][nc]===0;return[a+d+1,open1,open2]}
function omokWin(b,r,c,p){return dirs.some(([dr,dc])=>lineInfo(b,r,c,p,dr,dc)[0]>=5)}
function forbidden(b,r,c){if(b[r][c])return true;b[r][c]=1;if(omokWin(b,r,c,1)){b[r][c]=0;return false}let th=0;for(const [dr,dc] of dirs){const [n,a,d]=lineInfo(b,r,c,1,dr,dc);if(n===3&&a&&d)th++}b[r][c]=0;return th>=2}
function candidates(b,limit=30){let stones=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(b[r][c])stones.push([r,c]);if(!stones)return [[7,7]];let set=new Set;for(const [r,c] of stones)for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){let nr=r+dr,nc=c+dc;if(inside(nr,nc)&&!b[nr][nc])set.add(nr+','+nc)}let a=[...set].map(s=>s.split(',').map(Number));a.sort((x,y)=>scoreMove(b,y[0],y[1])-scoreMove(b,x[0],x[1]));return a.slice(0,limit)}
function scoreMove(b,r,c){let s=0;for(const p of [2,1]){b[r][c]=p;for(const [dr,dc] of dirs){const [n,a,d]=lineInfo(b,r,c,p,dr,dc);if(n>=5)s+=p===2?100000:80000;else if(n===4)s+=p===2?5000:4500;else if(n===3&&a&&d)s+=p===2?900:700;else if(n===3)s+=p===2?200:150}b[r][c]=0}return s}
function findWin(b,p){for(const [r,c] of candidates(b,60)){b[r][c]=p;let w=omokWin(b,r,c,p);b[r][c]=0;if(w)return[r,c]}return null}
function aiOmok(){let w=findWin(ob,2)||findWin(ob,1);if(w)return w;let cs=candidates(ob,30);if(difficulty==='EASY')return cs[Math.floor(Math.random()*Math.min(8,cs.length))];let best=cs[0],bs=-1e9;for(const [r,c] of cs){if(forbidden(ob,r,c))continue;let s=scoreMove(ob,r,c);ob[r][c]=2;let reply=findWin(ob,1);if(reply)s-=3500;ob[r][c]=0;if(s>bs){bs=s;best=[r,c]}}return best}
function drawOmok(){shell('오목');const wrap=document.createElement('div');wrap.className='game-wrap';const card=document.createElement('div');card.className='board-card';const cv=document.createElement('canvas');cv.width=cv.height=600;card.append(cv);const side=document.createElement('div');side.className='side';side.innerHTML='<h2>오목</h2><div class="status" id="status"></div><p class="hint">15×15 바둑판입니다.<br>흑은 정확히 5목, 백은 5목 이상으로 승리합니다.<br>흑의 삼삼은 금수입니다.</p>';wrap.append(card,side);app.append(wrap);const ctx=cv.getContext('2d'),cell=40,mar=20;ctx.fillStyle='#deb887';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#333';for(let i=0;i<N;i++){ctx.beginPath();ctx.moveTo(mar+i*cell,mar);ctx.lineTo(mar+i*cell,580);ctx.stroke();ctx.beginPath();ctx.moveTo(mar,mar+i*cell);ctx.lineTo(580,mar+i*cell);ctx.stroke()}for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(ob[r][c]){ctx.beginPath();ctx.arc(mar+c*cell,mar+r*cell,15,0,Math.PI*2);ctx.fillStyle=ob[r][c]===1?'#141414':'#fafafa';ctx.fill();if(ob[r][c]===2){ctx.strokeStyle='#555';ctx.stroke()}}if(winLine){ctx.strokeStyle='#e22';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(mar+winLine[1]*cell,mar+winLine[0]*cell);ctx.lineTo(mar+winLine[3]*cell,mar+winLine[2]*cell);ctx.stroke();ctx.lineWidth=1}$('#status').textContent=omsg+(gameMode==='AI'&&oturn===2&&!gameState.includes('OVER')?' AI 생각중...':'');cv.onclick=e=>{if(gameState!=='PLAYING'||(gameMode==='AI'&&oturn===2))return;const q=cv.getBoundingClientRect(),c=Math.round((e.clientX-q.left-mar)/cell),r=Math.round((e.clientY-q.top-mar)/cell);if(!inside(r,c)||ob[r][c])return;if(oturn===1&&forbidden(ob,r,c)){omsg='금수(삼삼) 자리입니다!';drawOmok();return}ob[r][c]=oturn;if(omokWin(ob,r,c,oturn)){omsg=(oturn===1?'플레이어 1(흑돌)':'플레이어 2(백돌)')+' 승리!';gameState='GAME_OVER';drawOmok();return}if(ob.every(row=>row.every(Boolean))){omsg='무승부!';gameState='GAME_OVER';drawOmok();return}oturn=oturn===1?2:1;drawOmok();if(gameMode==='AI'&&oturn===2){aiThinking=true;setTimeout(()=>{if(gameState!=='PLAYING')return;const m=aiOmok();aiThinking=false;if(!m){omsg='무승부!';gameState='GAME_OVER';drawOmok();return}ob[m[0]][m[1]]=2;if(omokWin(ob,m[0],m[1],2)){omsg='AI(백돌) 승리!';gameState='GAME_OVER'}else if(ob.every(row=>row.every(Boolean))){omsg='무승부!';gameState='GAME_OVER'}else{oturn=1}drawOmok()},500)}}

// ===================== 체스 =====================
const initBoard=[['r','n','b','q','k','b','n','r'],Array(8).fill('p'),...Array.from({length:4},()=>Array(8).fill('.')),Array(8).fill('P'),['R','N','B','Q','K','B','N','R']];let cb,cturn,sel,valid,rights,ep,cm;
const sym={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};const val={p:100,n:320,b:330,r:500,q:900,k:20000};
function resetChess(){cb=initBoard.map(r=>r.slice());cturn='W';sel=null;valid=[];rights={WK:true,WQ:true,BK:true,BQ:true};ep=null;cm='';drawChess()}
function clone(b){return b.map(r=>r.slice())}function white(p){return p!=='.'&&p===p.toUpperCase()}
function kingPos(b,w){const k=w?'K':'k';for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]===k)return[r,c];return null}
function attacked(b,r,c,byW){const pawn=byW?'P':'p',pr=r+(byW?1:-1);for(const dc of[-1,1])if(pr>=0&&pr<8&&c+dc>=0&&c+dc<8&&b[pr][c+dc]===pawn)return true;const kn=byW?'N':'n';for(const [dr,dc] of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]])if(r+dr>=0&&r+dr<8&&c+dc>=0&&c+dc<8&&b[r+dr][c+dc]===kn)return true;for(const [dr,dc,pcs] of[[0,1,'rq'],[0,-1,'rq'],[1,0,'rq'],[-1,0,'rq'],[1,1,'bq'],[1,-1,'bq'],[-1,1,'bq'],[-1,-1,'bq']]){let nr=r+dr,nc=c+dc;while(nr>=0&&nr<8&&nc>=0&&nc<8){let p=b[nr][nc];if(p!=='.'){if(p.toLowerCase()&&pcs.includes(p.toLowerCase())&&white(p)===byW)return true;break}nr+=dr;nc+=dc}}for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if((dr||dc)&&r+dr>=0&&r+dr<8&&c+dc>=0&&c+dc<8&&b[r+dr][c+dc]===(byW?'K':'k'))return true;return false}
function inCheck(b,w){const k=kingPos(b,w);return !k||attacked(b,k[0],k[1],!w)}
function rawMoves(r,c,b,R,E){const p=b[r][c],w=white(p),out=[];if(p==='.'))return out;const add=(nr,nc)=>{if(nr<0||nr>7||nc<0||nc>7)return false;const t=b[nr][nc];if(t==='.')out.push([nr,nc]);else if(white(t)!==w&&t.toLowerCase()!=='k')out.push([nr,nc]);return t==='.'};if(p.toLowerCase()==='p'){let d=w?-1:1,s=w?6:1,nr=r+d;if(nr>=0&&nr<8&&b[nr][c]==='.'){out.push([nr,c]);if(r===s&&b[r+2*d][c]==='.')out.push([r+2*d,c])}for(const dc of[-1,1]){let nc=c+dc;if(nr>=0&&nr<8&&nc>=0&&nc<8){let t=b[nr][nc];if(t!=='.'&&white(t)!==w&&t.toLowerCase()!=='k')out.push([nr,nc]);if(E&&E[0]===nr&&E[1]===nc)out.push([nr,nc])}}}else if(p.toLowerCase()==='n'){for(const [dr,dc] of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]])add(r+dr,c+dc)}else if('rbq'.includes(p.toLowerCase())){const ds=[];if('rq'.includes(p.toLowerCase()))ds.push([0,1],[0,-1],[1,0],[-1,0]);if('bq'.includes(p.toLowerCase()))ds.push([1,1],[1,-1],[-1,1],[-1,-1]);for(const[dr,dc]of ds){let nr=r+dr,nc=c+dc;while(nr>=0&&nr<8&&nc>=0&&nc<8){let t=b[nr][nc];if(t==='.')out.push([nr,nc]);else{if(white(t)!==w&&t.toLowerCase()!=='k')out.push([nr,nc]);break}nr+=dr;nc+=dc}}}else if(p.toLowerCase()==='k'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);if(w&&r===7&&c===4&&!inCheck(b,true)){if(R.WK&&b[7][5]==='.'&&b[7][6]==='.'&&b[7][7]==='R'&&!attacked(b,7,5,false)&&!attacked(b,7,6,false))out.push([7,6]);if(R.WQ&&b[7][3]==='.'&&b[7][2]==='.'&&b[7][1]==='.'&&b[7][0]==='R'&&!attacked(b,7,3,false)&&!attacked(b,7,2,false))out.push([7,2])}if(!w&&r===0&&c===4&&!inCheck(b,false)){if(R.BK&&b[0][5]==='.'&&b[0][6]==='.'&&b[0][7]==='r'&&!attacked(b,0,5,true)&&!attacked(b,0,6,true))out.push([0,6]);if(R.BQ&&b[0][3]==='.'&&b[0][2]==='.'&&b[0][1]==='.'&&b[0][0]==='r'&&!attacked(b,0,3,true)&&!attacked(b,0,2,true))out.push([0,2])}}return out}
function makeMove(b,m,R,E){let n=clone(b),nr={...R},ne=null,[sr,sc]=m[0],[tr,tc]=m[1],p=n[sr][sc],cap=n[tr][tc];if(p.toLowerCase()==='p'&&E&&tr===E[0]&&tc===E[1]&&cap==='.'&&sc!==tc)n[p==='P'?tr+1:tr-1][tc]='.';if(p.toLowerCase()==='k'&&Math.abs(tc-sc)===2){if(tc===6){n[sr][5]=n[sr][7];n[sr][7]='.'}else{n[sr][3]=n[sr][0];n[sr][0]='.'}}n[tr][tc]=p;n[sr][sc]='.';if(p==='P'&&tr===0)n[tr][tc]='Q';if(p==='p'&&tr===7)n[tr][tc]='q';if(p==='K')nr.WK=nr.WQ=false;if(p==='k')nr.BK=nr.BQ=false;if(p==='R'&&sr===7&&sc===0)nr.WQ=false;if(p==='R'&&sr===7&&sc===7)nr.WK=false;if(p==='r'&&sr===0&&sc===0)nr.BQ=false;if(p==='r'&&sr===0&&sc===7)nr.BK=false;if(cap==='R'&&tr===7&&tc===0)nr.WQ=false;if(cap==='R'&&tr===7&&tc===7)nr.WK=false;if(cap==='r'&&tr===0&&tc===0)nr.BQ=false;if(cap==='r'&&tr===0&&tc===7)nr.BK=false;if(p.toLowerCase()==='p'&&Math.abs(tr-sr)===2)ne=[(sr+tr)>>1,sc];return[n,nr,ne]}
function legal(r,c,b,R,E){const p=b[r][c];if(p==='.')return[];const w=white(p),out=[];for(const t of rawMoves(r,c,b,R,E)){const [nb,nr,ne]=makeMove(b,[[r,c],t],R,E);if(!inCheck(nb,w))out.push(t)}return out}
function allMoves(w,b,R,E){let a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]!=='.'&&white(b[r][c])===w)for(const t of legal(r,c,b,R,E))a.push([[r,c],t]);return a}
function evalChess(b){let s=0;for(const row of b)for(const p of row)if(p!=='.')s+=(white(p)?1:-1)*val[p.toLowerCase()];return s}
function mini(b,d,a,be,w,R,E){const moves=allMoves(w,b,R,E);if(!moves.length)return inCheck(b,w)?(w?-100000:100000):0;if(!d)return evalChess(b);if(w){let best=-1e9;for(const m of moves){const[n,nr,ne]=makeMove(b,m,R,E);best=Math.max(best,mini(n,d-1,a,be,false,nr,ne));a=Math.max(a,best);if(be<=a)break}return best}else{let best=1e9;for(const m of moves){const[n,nr,ne]=makeMove(b,m,R,E);best=Math.min(best,mini(n,d-1,a,be,true,nr,ne));be=Math.min(be,best);if(be<=a)break}return best}}
function chessAI(){const ms=allMoves(false,cb,rights,ep);if(!ms.length)return null;let best=ms[0],bs=1e9,d=difficulty==='HARD'?3:2;for(const m of ms){const[n,nr,ne]=makeMove(cb,m,rights,ep),s=mini(n,d-1,-1e9,1e9,true,nr,ne);if(s<bs){bs=s;best=m}}return best}
function chessEnd(){const ms=allMoves(cturn==='W',cb,rights,ep);if(ms.length)return false;cm=inCheck(cb,cturn==='W')?(cturn==='W'?'흑(Black) 승리! 체크메이트':'백(White) 승리! 체크메이트'):'무승부! 스테일메이트';gameState='GAME_OVER';return true}
function drawChess(){shell('체스');const wrap=document.createElement('div');wrap.className='game-wrap';const card=document.createElement('div');card.className='board-card';const cv=document.createElement('canvas');cv.width=cv.height=640;card.append(cv);const side=document.createElement('div');side.className='side';side.innerHTML='<h2>체스</h2><div class="status" id="cstatus"></div><p class="hint">백부터 시작합니다.<br>말을 클릭한 뒤 초록 점이 표시된 칸을 클릭하세요.<br>캐슬링, 앙파상, 자동 프로모션을 지원합니다.</p>';wrap.append(card,side);app.append(wrap);const ctx=cv.getContext('2d'),sz=80;for(let r=0;r<8;r++)for(let c=0;c<8;c++){ctx.fillStyle=(r+c)%2?'#b58863':'#f0d9b5';ctx.fillRect(c*sz,r*sz,sz,sz);if(sel&&sel[0]===r&&sel[1]===c){ctx.strokeStyle='#ffe000';ctx.lineWidth=4;ctx.strokeRect(c*sz+2,r*sz+2,76,76)}if(valid.some(x=>x[0]===r&&x[1]===c)){ctx.fillStyle='#35c850';ctx.beginPath();ctx.arc(c*sz+40,r*sz+40,9,0,7);ctx.fill()}if(cb[r][c]!=='.'){ctx.font='58px "Segoe UI Symbol","DejaVu Sans"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=white(cb[r][c])?'#fff':'#222';ctx.strokeStyle=white(cb[r][c])?'#222':'#fff';ctx.lineWidth=3;ctx.strokeText(sym[cb[r][c]],c*sz+40,r*sz+43);ctx.fillText(sym[cb[r][c]],c*sz+40,r*sz+43)}}$('#cstatus').textContent=cm||(gameMode==='AI'?(cturn==='W'?'백 (플레이어)':'AI 생각중...'):(cturn==='W'?'백 턴':'흑 턴'));cv.onclick=e=>{if(gameState!=='PLAYING'||(gameMode==='AI'&&cturn==='B'))return;const q=cv.getBoundingClientRect(),c=Math.floor((e.clientX-q.left)*8/q.width),r=Math.floor((e.clientY-q.top)*8/q.height),p=cb[r][c];if(sel===null){if(p!=='.'&&white(p)===(cturn==='W')){sel=[r,c];valid=legal(r,c,cb,rights,ep);drawChess()}}else{if(p!=='.'&&white(p)===(cturn==='W')){sel=[r,c];valid=legal(r,c,cb,rights,ep);drawChess();return}if(valid.some(x=>x[0]===r&&x[1]===c)){[cb,rights,ep]=makeMove(cb,[sel,[r,c]],rights,ep);cturn=cturn==='W'?'B':'W';sel=null;valid=[];if(!chessEnd())drawChess();if(gameState==='PLAYING'&&gameMode==='AI'&&cturn==='B'){setTimeout(()=>{if(gameState!=='PLAYING')return;const m=chessAI();if(m){[cb,rights,ep]=makeMove(cb,m,rights,ep);cturn='W';chessEnd();drawChess()}},500)}}else{sel=null;valid=[];drawChess()}}}}

// ===================== UNO =====================
const UC=['RED','YELLOW','GREEN','BLUE'],UCSS={RED:'uno-red',YELLOW:'uno-yellow',GREEN:'uno-green',BLUE:'uno-blue',WILD:'uno-wild'};let uh=[[],[]],draw=[],discard=[],up=0,udir=1,ucolor=null,umsg='',ucolorChoice=false,pendingWild=null;
function card(c,v){return{color:c,value:v}}
function makeDeck(){let d=[];for(const c of UC){d.push(card(c,'0'));for(let n=1;n<=9;n++)d.push(card(c,''+n),card(c,''+n));for(const v of['SKIP','REVERSE','DRAW2'])d.push(card(c,v),card(c,v))}for(let i=0;i<4;i++)d.push(card('WILD','WILD'),card('WILD','WILD_DRAW4'));return d.sort(()=>Math.random()-.5)}
function resetUno(){let d=makeDeck();uh=[[...d.splice(0,7)],[...d.splice(0,7)]];draw=d;discard=[];let first;do{first=draw.pop()}while(first.value!=='0'&&draw.length);discard.push(first);ucolor=first.color;up=0;udir=1;umsg='플레이어 1부터 시작합니다.';ucolorChoice=false;pendingWild=null;drawUno()}
function refill(){if(discard.length<=1)return;const top=discard.pop();draw.push(...discard.splice(0));draw.sort(()=>Math.random()-.5);discard.push(top)}
function playable(c){const t=discard.at(-1);return c.color==='WILD'||c.color===ucolor||c.value===t.value}
function wild4legal(p,c){return c.value!=='WILD_DRAW4'||!uh[p].some(x=>x.color!=='WILD'&&x.color===ucolor)}
function next(){up=(up+udir+2)%2}
function drawCards(p,n){let a=[];for(let i=0;i<n;i++){if(!draw.length)refill();if(!draw.length)break;const c=draw.pop();uh[p].push(c);a.push(c)}return a}
function playUno(p,i){if(p!==up||ucolorChoice)return;const c=uh[p][i];if(!c||!playable(c)){umsg='그 카드는 지금 낼 수 없습니다.';drawUno();return}if(c.value==='WILD_DRAW4'&&!wild4legal(p,c)){umsg='현재 색 카드가 있어 +4를 낼 수 없습니다.';drawUno();return}uh[p].splice(i,1);discard.push(c);if(uh[p].length===0){umsg='플레이어 '+(p+1)+' 승리!';gameState='GAME_OVER';drawUno();return}if(c.color==='WILD'){pendingWild=c;ucolorChoice=true;umsg='색상을 선택하세요.';drawUno();return}ucolor=c.color;if(c.value==='SKIP')next();else if(c.value==='REVERSE'){udir*=-1;next()}else if(c.value==='DRAW2'){const q=next();drawCards(q,2);next()}else next();umsg='카드를 냈습니다.';drawUno()}
function finishWild(color){if(!pendingWild)return;ucolor=color;const c=pendingWild;if(c.value==='WILD_DRAW4'){const q=next();drawCards(q,4);next()}else next();pendingWild=null;ucolorChoice=false;umsg='색상: '+color;drawUno()}
function drawUno(){shell('UNO');const area=document.createElement('div');area.className='uno-area';const top=document.createElement('div');top.innerHTML='<div class="message">'+umsg+'</div><div style="text-align:center;margin-bottom:10px">'+(up===0?'▶ 플레이어 1 턴':'▶ 플레이어 2 턴')+'</div>';area.append(top);const p2=document.createElement('div');p2.className='uno-row';uh[1].forEach(()=>{const x=document.createElement('div');x.className='uno-card small uno-wild';x.textContent='UNO';p2.append(x)});area.append(p2);const center=document.createElement('div');center.className='uno-center';const dr=document.createElement('div');dr.className='draw';dr.textContent='DRAW';dr.onclick=()=>{if(gameState!=='PLAYING'||up!==0||ucolorChoice)return;const a=drawCards(0,1);if(!a.length){umsg='뽑을 카드가 없습니다.';next()}else if(!playable(a[0])||!wild4legal(0,a[0])){umsg='카드를 뽑았습니다. 턴을 넘깁니다.';next()}else umsg='뽑은 카드를 바로 낼 수 있습니다.';drawUno()};center.append(dr);if(discard.length){const t=discard.at(-1),x=document.createElement('div');x.className='uno-card '+UCSS[t.color];x.textContent=t.value==='WILD_DRAW4'?'+4':t.value==='WILD'?'WILD':t.value;x.style.cursor='default';center.append(x)}area.append(center);const p1=document.createElement('div');p1.className='uno-row';uh[0].forEach((c,i)=>{const x=document.createElement('div');x.className='uno-card '+UCSS[c.color];x.textContent=c.value==='WILD_DRAW4'?'+4':c.value==='WILD'?'WILD':c.value;x.onclick=()=>playUno(0,i);p1.append(x)});area.append(p1);const hint=document.createElement('div');hint.className='hint';hint.style.color='#fff';hint.style.textAlign='center';hint.innerHTML=gameMode==='MULTI'?'P2는 위쪽 손패를 클릭하거나 <span class="kbd">1~9</span>로 선택, <span class="kbd">D</span>로 뽑기':'플레이어 1이 직접 조작합니다. AI 모드는 UNO에서는 지원하지 않습니다.';area.append(hint);app.append(area);if(gameMode==='MULTI'){p2.innerHTML='';uh[1].forEach((c,i)=>{const x=document.createElement('div');x.className='uno-card '+UCSS[c.color];x.textContent=c.value==='WILD_DRAW4'?'+4':c.value==='WILD'?'WILD':c.value;x.onclick=()=>playUno(1,i);p2.append(x)})}if(ucolorChoice){const ov=document.createElement('div');ov.className='color-pick';const box=document.createElement('div');box.className='color-box';const h=document.createElement('h3');h.textContent='색상 선택';box.append(h);UC.forEach(c=>box.append(button(c,()=>finishWild(c),UCSS[c])));ov.append(box);app.append(ov)}}
window.addEventListener('keydown',e=>{if(gameState==='PLAYING'&&selectedGame==='UNO'&&gameMode==='MULTI'&&up===1&&!ucolorChoice){if(e.key>='1'&&e.key<='9'){const i=+e.key-1;if(i<uh[1].length)playUno(1,i)}else if(e.key.toLowerCase()==='d'){const a=drawCards(1,1);if(!a.length){umsg='뽑을 카드가 없습니다. 턴을 넘깁니다.';next()}else if(!playable(a[0])||!wild4legal(1,a[0])){umsg='P2가 카드를 뽑았습니다. 턴을 넘깁니다.';next()}else umsg='P2가 카드를 뽑았습니다. 바로 낼 수 있습니다.';drawUno()}}});
mainMenu();
</script>
