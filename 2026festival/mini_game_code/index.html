<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MINI GAME</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#071b12,#123b27);color:#fff;display:flex;align-items:center;justify-content:center}.wrap{width:min(920px,92vw);padding:30px 0}.screen{text-align:center}.hidden{display:none!important}.logo{font-size:clamp(42px,7vw,70px);font-weight:900;margin-bottom:8px}.sub{opacity:.7;margin-bottom:35px}.modes,.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:27px 16px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;transition:.2s;min-height:170px}.card:hover,.card.selected{transform:translateY(-4px);background:rgba(30,168,87,.2);border-color:#35d27b}.icon{font-size:44px;margin-bottom:13px}.title{font-size:21px;font-weight:800}.desc{font-size:14px;opacity:.65;margin-top:8px}.step{font-size:13px;letter-spacing:2px;color:#5ee18e;margin-bottom:10px;font-weight:bold}.setting{background:rgba(255,255,255,.07);border-radius:22px;padding:28px;margin:15px 0}.setting h2{margin:0 0 20px}.sets{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.setbtn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;padding:13px 20px;border-radius:12px;cursor:pointer;font-size:15px}.setbtn.selected{background:#1ea857;border-color:#55e68d;font-weight:bold}.games{grid-template-columns:repeat(2,1fr)}.gamecard{min-height:130px}.random{grid-column:1/-1}.next{margin-top:20px;border:0;border-radius:14px;padding:15px 38px;background:#1ea857;color:#fff;font-size:17px;font-weight:800;cursor:pointer}.next:disabled{opacity:.35;cursor:not-allowed}.summary{background:rgba(255,255,255,.08);border-radius:20px;padding:28px;margin:20px 0;font-size:18px;line-height:2}.back{border:0;background:transparent;color:#aaa;cursor:pointer;margin-top:15px}.tag{display:inline-block;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.1);font-size:12px;margin:3px}
@media(max-width:650px){.modes{grid-template-columns:1fr}.choices{grid-template-columns:1fr 1fr}.card{min-height:125px;padding:20px 10px}.random{grid-column:1/-1}}
</style></head>
<body><div class="wrap">
<section id="modeScreen" class="screen">
<div class="logo">🎮 MINI GAME</div><div class="sub">누구와 플레이할까요?</div>
<div class="modes">
<button class="card" onclick="chooseMode(this,'cpu','컴퓨터와 대전')"><div class="icon">🤖</div><div class="title">컴퓨터와 대전</div><div class="desc">AI와 1대1</div></button>
<button class="card" onclick="chooseMode(this,'local','한 컴퓨터로 1대1')"><div class="icon">👥</div><div class="title">한 컴퓨터로 1대1</div><div class="desc">친구와 같은 컴퓨터</div></button>
<button class="card" onclick="chooseMode(this,'online','온라인 대전')"><div class="icon">🌐</div><div class="title">온라인 대전</div><div class="desc">다른 컴퓨터의 플레이어</div></button>
</div><button id="modeNext" class="next" disabled onclick="showSettings()">다음 →</button>
</section>

<section id="settingsScreen" class="screen hidden">
<div class="step">STEP 2</div><h1>게임 설정</h1><div class="sub" id="modeLabel"></div>
<div class="setting"><h2>🏆 몇 판으로 승부할까요?</h2><div class="sets">
<button class="setbtn selected" onclick="chooseRounds(this,1)">단판</button>
<button class="setbtn" onclick="chooseRounds(this,3)">3판 2선승</button>
<button class="setbtn" onclick="chooseRounds(this,5)">5판 3선승</button>
<button class="setbtn" onclick="chooseRounds(this,7)">7판 4선승</button>
</div></div>
<div class="setting"><h2>🎲 어떤 게임을 할까요?</h2><div class="choices games">
<button class="card gamecard" onclick="chooseGame(this,'reaction','⚡ 반응속도')"><div class="icon">⚡</div><div class="title">반응속도</div><div class="desc">신호가 나오면 빠르게 클릭</div></button>
<button class="card gamecard" onclick="chooseGame(this,'al','🅰️ A vs L')"><div class="icon">🅰️</div><div class="title">A vs L</div><div class="desc">A와 L 중 먼저 누르기</div></button>
<button class="card gamecard random" onclick="chooseGame(this,'random','🎲 랜덤')"><div class="icon">🎲</div><div class="title">랜덤</div><div class="desc">게임을 무작위로 선택</div></button>
</div></div>
<button id="startBtn" class="next" disabled onclick="startGame()">게임 시작 →</button><br><button class="back" onclick="backToMode()">← 이전</button>
</section>

<section id="readyScreen" class="screen hidden"><div class="step">READY</div><h1>게임 준비 완료!</h1><div class="summary" id="summary"></div><button class="next" onclick="alert('이제 실제 게임 화면을 연결하면 됩니다!')">플레이 시작 ▶</button><br><button class="back" onclick="backToSettings()">← 설정 변경</button></section>
</div>
<script>
let mode=null,modeName='',rounds=1,game=null,gameName='';
function chooseMode(el,v,n){document.querySelectorAll('#modeScreen .card').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');mode=v;modeName=n;document.getElementById('modeNext').disabled=false}
function showSettings(){document.getElementById('modeScreen').classList.add('hidden');document.getElementById('settingsScreen').classList.remove('hidden');document.getElementById('modeLabel').textContent=modeName}
function chooseRounds(el,v){document.querySelectorAll('.setbtn').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');rounds=v}
function chooseGame(el,v,n){document.querySelectorAll('.gamecard').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');game=v;gameName=n;document.getElementById('startBtn').disabled=false}
function startGame(){document.getElementById('settingsScreen').classList.add('hidden');document.getElementById('readyScreen').classList.remove('hidden');let win=Math.floor(rounds/2)+1;let g=game==='random'?'🎲 랜덤으로 게임 선택':gameName;document.getElementById('summary').innerHTML=`<span class="tag">${modeName}</span><br><b>${rounds===1?'단판':rounds+'판 '+win+'선승'}</b><br>${g}`}
function backToMode(){document.getElementById('settingsScreen').classList.add('hidden');document.getElementById('modeScreen').classList.remove('hidden')}
function backToSettings(){document.getElementById('readyScreen').classList.add('hidden');document.getElementById('settingsScreen').classList.remove('hidden')}
</script></body></html>
