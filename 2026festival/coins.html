const firebaseConfig={apiKey:'AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9',authDomain:'festivallikes.firebaseapp.com',projectId:'festivallikes',storageBucket:'festivallikes.firebasestorage.app',messagingSenderId:'782245120700',appId:'1:782245120700:web:c61e16313e9ae688e6deb9'};
const loginConfig={apiKey:'AIzaSyBgOAO72ArbW8dO7OSYsTVEQtRHT049U20',authDomain:'points2026-f5e50.firebaseapp.com',projectId:'points2026-f5e50'};
const db=getFirestore(initializeApp(firebaseConfig)),loginDB=getFirestore(initializeApp(loginConfig,'loginApp'));
const $=id=>document.getElementById(id),coinCharacters={1:'A',2:'F',3:'K',4:'P',5:'U'},CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';let last='';
function discriminator(people){return coinCharacters[Number(people)]||''}
function random(n){const a=new Uint32Array(n);crypto.getRandomValues(a);return Array.from(a,x=>CHARS[x%CHARS.length]).join('')}
function alpha(){const a=new Uint32Array(1);crypto.getRandomValues(a);return 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[a[0]%26]}
function booth(){return document.querySelector('input[name="booth"]:checked').value}
function updateRule(){const t=$('team').value,b=booth(),p=document.querySelector('input[name="people"]:checked')?.value,d=p?discriminator(p):'판별문자';$('rule').innerHTML=b==='coding'?`현재 <strong>코딩과 함께라면</strong> · <strong>${t}팀</strong><br>코드 형식: <span class="code-rule">(이용권 수)(랜덤)(랜덤)(랜덤)(판별문자)</span><br>판별문자: <strong>A=1인권 · F=2인권 · K=3인권 · P=4인권 · U=5인권</strong>${p?` · 현재 <strong>${d}</strong>`:''}`:`현재 <strong>S A N C A F E</strong> · <strong>${t}팀</strong><br>코드 형식: <span class="code-rule">(알파벳)(랜덤)(랜덤)(랜덤)(판별문자)</span><br>판별문자: <strong>A=1인권 · F=2인권 · K=3인권 · P=4인권 · U=5인권</strong>${p?` · 현재 <strong>${d}</strong>`:''}`}
function makeCode(p,b){const lastChar=discriminator(p);return b==='coding'?`${p}${random(3)}${lastChar}`:`${alpha()}${random(3)}${lastChar}`}

async function generate(){
 const sel=document.querySelector('input[name="people"]:checked');
 if(!sel){$('status').className='status error';$('status').textContent='이용권 수를 선택해주세요.';return}
 const quantity=Number($('quantity').value);
 if(!Number.isInteger(quantity)||quantity<1||quantity>100){$('status').className='status error';$('status').textContent='생성 개수는 1~100 사이의 정수로 입력해주세요.';return}
 const p=Number(sel.value),b=booth(),t=Number($('team').value);
 $('generate').disabled=true;$('issued').style.display='none';$('status').className='status';$('status').textContent=quantity+'개 이용권을 발급하는 중...';
 const created=[];
 try{
  for(let n=0;n<quantity;n++){
   let saved=null;
   for(let attempt=0;attempt<30&&!saved;attempt++){
    const code=makeCode(p,b),ref=doc(db,'accesscodes',code);
    const ok=await runTransaction(db,async tx=>{if((await tx.get(ref)).exists())return false;tx.set(ref,{max:p,used:0,active:true,team:t,booth:b,createdAt:serverTimestamp(),createdBy:localStorage.getItem('userId')||'unknown'});return true});
    if(ok)saved=code;
   }
   if(!saved)throw new Error('중복 코드가 반복되어 '+(n+1)+'번째 발급에서 중단되었습니다.');
   created.push(saved);$('status').textContent='발급 중... '+created.length+' / '+quantity;
  }
  last=created[0];$('issuedCode').textContent=created.length===1?created[0]:created.length+'개 발급 완료';
  $('issuedInfo').textContent=t+'팀 · '+(b==='coding'?'코딩과 함께라면':'S A N C A F E')+' · '+p+'인권 · '+created.length+'개 생성'+(created.length>1?' · 복사하기는 첫 번째 인증키를 복사합니다.':' · 판별문자 '+discriminator(p));
  $('issued').style.display='block';$('status').className='status success';$('status').textContent=created.length===quantity?quantity+'개 이용권 발급 완료!':created.length+'/'+quantity+'개 발급됨. 일부 발급에 실패했습니다.';
  sel.checked=false;updateRule();
  if(created.length>1){const box=document.createElement('div');box.style.cssText='margin-top:12px;text-align:left;font:13px monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;background:#101018;padding:12px;border-radius:8px';box.textContent=created.join('\n');$('issued').appendChild(box)}
 }catch(e){console.error(e);$('status').className='status error';$('status').textContent='발급 중 오류: '+e.message+' 이미 발급된 '+created.length+'개는 유지됩니다.';if(created.length){last=created[0];$('issuedCode').textContent=created.length+'개 발급됨';$('issuedInfo').textContent=created.join(' · ');$('issued').style.display='block'}}
 finally{$('generate').disabled=false}
}
$('generate').onclick=generate;$('team').onchange=updateRule;document.querySelectorAll('input[name="booth"]').forEach(x=>x.onchange=updateRule);document.querySelectorAll('input[name="people"]').forEach(x=>x.onchange=updateRule);
$('copy').onclick=async()=>{if(!last)return;try{await navigator.clipboard.writeText(last);$('copy').textContent='복사됨';setTimeout(()=>$('copy').textContent='복사하기',1200)}catch(e){alert(`코드: ${last}`)}};
function name(b){return b==='sancafe'?'S A N C A F E':'코딩과 함께라면'}function date(x){return x?.toDate?x.toDate().toLocaleString('ko-KR'):'-'}
async function toggle(id,a){const n=!a;if(!confirm(`이 이용권을 ${n?'활성화':'비활성화'}할까요?\n\n${id}`))return;try{await updateDoc(doc(db,'accesscodes',id),{active:n})}catch(e){alert('변경에 실패했습니다.')}}async function del(id){if(!confirm(`정말 삭제할까요?\n\n${id}`))return;try{await deleteDoc(doc(db,'accesscodes',id))}catch(e){alert('삭제에 실패했습니다.')}}

 if(!latestCodes.length){alert('내보낼 이용권 데이터가 없습니다.');return}

 const wb=XLSX.utils.book_new();
 const rows=[

  ['총 이용권',latestCodes.length,'활성',latestCodes.filter(x=>x.active).length,'비활성',latestCodes.filter(x=>!x.active).length,'총 허용 이용',latestCodes.reduce((n,x)=>n+x.max,0),'총 사용 횟수'],
  [null,null,null,null,null,null,null,null,latestCodes.reduce((n,x)=>n+x.used,0)],

 ];
 latestCodes.forEach(x=>rows.push([x.code,x.team?x.team+'팀':'-',x.booth==='coding'?'코딩과 함께라면':x.booth==='sancafe'?'S A N C A F E':'-',x.max,x.used,x.remaining,x.active?'활성':'비활성',x.createdAt,x.createdBy||'-']));
 const ws=XLSX.utils.aoa_to_sheet(rows);
 ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:8}},{s:{r:1,c:0},e:{r:1,c:8}}];
 ws['!cols']=[{wch:16},{wch:9},{wch:23},{wch:12},{wch:12},{wch:12},{wch:11},{wch:23},{wch:20}];

 ws['!freeze']={xSplit:0,ySplit:6};
 const green='00C853',dark='15151C',white='FFFFFF',muted='667085';

 const titleStyle={font:{name:'맑은 고딕',sz:20,bold:true,color:{rgb:white}},fill:{fgColor:{rgb:'101820'}},alignment:{vertical:'center',horizontal:'left'}};

 for(let c=0;c<9;c++){const col=XLSX.utils.encode_col(c);style(col+'1',titleStyle);style(col+'2',subtitleStyle)}
 for(const cell of ['A3','C3','E3','G3','I3'])style(cell,{font:{name:'맑은 고딕',sz:10,bold:true,color:{rgb:white}},fill:{fgColor:{rgb:'16803D'}},alignment:{horizontal:'center',vertical:'center'}});
 for(const cell of ['B3','D3','F3','H3','I4'])style(cell,{font:{name:'맑은 고딕',sz:14,bold:true,color:{rgb:'101820'}},fill:{fgColor:{rgb:'E8F8EE'}},alignment:{horizontal:'center',vertical:'center'}});
 for(let c=0;c<9;c++)style(XLSX.utils.encode_col(c)+'6',{font:{name:'맑은 고딕',sz:10,bold:true,color:{rgb:white}},fill:{fgColor:{rgb:green}},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:{bottom:{style:'medium',color:{rgb:'008A3A'}}}});
 for(let r=7;r<=rows.length;r++){
  for(let c=0;c<9;c++){
   const cell=XLSX.utils.encode_cell({r:r-1,c});
   style(cell,{font:{name:'맑은 고딕',sz:10,color:{rgb:'20252B'}},fill:{fgColor:{rgb:r%2===0?'F2F8F4':'FFFFFF'}},alignment:{vertical:'center',horizontal:c===0?'center':(c===3||c===4||c===5?'center':'left')},border:{bottom:{style:'thin',color:{rgb:'DDE5DF'}}}});
  }
  style('G'+r,{font:{name:'맑은 고딕',sz:10,bold:true,color:{rgb:latestCodes[r-7]?.active?'16803D':'C0392B'}},fill:{fgColor:{rgb:latestCodes[r-7]?.active?'E8F8EE':'FDECEC'}},alignment:{horizontal:'center',vertical:'center'}});
  ws['!rows'][r-1]={hpt:22};

  ['3. 이 파일은 다운로드 시점의 스냅샷이며, 이후 사이트에서 변경한 내용은 자동 반영되지 않습니다.'],

  [''],
  ['다운로드 시각',new Date().toLocaleString('ko-KR')],
  ['관리 페이지','https://25withcoding.kr/2026festival/coins.html']

 styleGuide(guide,XLSX);
 XLSX.utils.book_append_sheet(wb,guide,'안내');
 const stamp=new Date().toISOString().slice(0,10).replace(/-/g,'');
 XLSX.writeFile(wb,'2026_Festival_이용권현황_'+stamp+'.xlsx',{cellStyles:true});
}
function styleGuide(ws,XLSX){
 for(let c=0;c<2;c++){const a=XLSX.utils.encode_col(c)+'1';if(ws[a])ws[a].s={font:{name:'맑은 고딕',sz:18,bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'101820'}},alignment:{vertical:'center'}}}
 for(let r=2;r<=6;r++){const a='A'+r;if(ws[a])ws[a].s={font:{name:'맑은 고딕',sz:11,color:{rgb:'27332B'}},fill:{fgColor:{rgb:r%2?'F2F8F4':'FFFFFF'}},alignment:{vertical:'center',wrapText:true}}}
 if(ws['A8'])ws['A8'].s={font:{name:'맑은 고딕',sz:10,bold:true,color:{rgb:'16803D'}}};
 if(ws['A9'])ws['A9'].s={font:{name:'맑은 고딕',sz:10,bold:true,color:{rgb:'16803D'}}};
 ws['!rows']=[{hpt:32},{hpt:24},{hpt:30},{hpt:25},{hpt:30},{hpt:38},{hpt:10},{hpt:22},{hpt:22}];
}
$('excel').onclick=downloadManagementExcel;
$('distribution').onclick=downloadDistributionExcel;
$('selectAll').onclick=()=>document.querySelectorAll('.pass-select').forEach(x=>x.checked=true);
$('clearSelect').onclick=()=>document.querySelectorAll('.pass-select').forEach(x=>x.checked=false);
$('deleteSelected').onclick=async()=>{
 const selected=[...document.querySelectorAll('.pass-select:checked')].map(x=>x.value);
 if(!selected.length){alert('삭제할 이용권을 먼저 선택해주세요.');return}
 const typed=prompt('선택한 '+selected.length+'개 이용권을 영구 삭제합니다.\n계속하려면 DELETE를 입력하세요.');
 if(typed!=='DELETE')return;
 $('deleteSelected').disabled=true;
 try{for(let i=0;i<selected.length;i++){await deleteDoc(doc(db,'accesscodes',selected[i]))}alert(selected.length+'개 이용권을 삭제했습니다.')}catch(e){console.error(e);alert('일부 삭제에 실패했을 수 있습니다. 목록을 새로 확인해주세요.')}finally{$('deleteSelected').disabled=false}
};


function downloadDistributionExcel(){
 const picked=[...document.querySelectorAll('.pass-select:checked')].map(c=>latestCodes.find(x=>x.code===c.value)).filter(Boolean);
 if(!picked.length){alert('먼저 배부할 이용권을 선택해주세요.');return}
 const inactive=picked.filter(x=>x.active===false);
 if(inactive.length&&!confirm('비활성 이용권 '+inactive.length+'개는 출력에서 제외됩니다. 계속할까요?'))return;
 const items=picked.filter(x=>x.active!==false);
 if(!items.length){alert('출력할 수 있는 활성 이용권이 없습니다.');return}
 let style=document.getElementById('distributionPrintStyle');
 if(!style){
  style=document.createElement('style');style.id='distributionPrintStyle';
  style.textContent=`
  #distributionPrintOverlay{position:fixed;inset:0;z-index:9999;background:#292933;overflow:auto;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
  #distributionPrintOverlay .dp-bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:#15151c;color:white}
  #distributionPrintOverlay .dp-bar button{border:0;border-radius:8px;padding:10px 16px;background:#333;color:#fff;font-weight:bold}
  #distributionPrintOverlay .dp-bar .dp-print{background:#16803d}
  #distributionPrintOverlay .dp-pages{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 0}
  #distributionPrintOverlay .dp-sheet{width:210mm;height:297mm;padding:5mm;background:#fff;box-sizing:border-box;overflow:hidden;box-shadow:0 4px 24px #0008}
  #distributionPrintOverlay .dp-grid{width:200mm;height:287mm;display:grid;grid-template-columns:repeat(7,28.5714mm);grid-template-rows:repeat(10,28.7mm);border-top:.25mm dashed #888;border-left:.25mm dashed #888}
  #distributionPrintOverlay .dp-cell{position:relative;border-right:.25mm dashed #888;border-bottom:.25mm dashed #888;min-width:0;min-height:0;box-sizing:border-box}
  #distributionPrintOverlay .dp-ticket{position:absolute;inset:1mm;border:.35mm solid var(--accent);border-radius:1.6mm;background:var(--paper);overflow:hidden;box-sizing:border-box;color:#171717}
  #distributionPrintOverlay .dp-ticket:before{content:'';position:absolute;left:0;right:0;top:0;height:1.3mm;background:var(--accent)}
  #distributionPrintOverlay .dp-ticket:after{content:'✦  ✦  ✦';position:absolute;right:1mm;top:2mm;font-size:1.5mm;color:var(--accent)}
  #distributionPrintOverlay .dp-code{position:absolute;left:.5mm;right:.5mm;top:8.3mm;display:flex;align-items:baseline;justify-content:center;gap:.5mm;white-space:nowrap;line-height:1}
  #distributionPrintOverlay .dp-n{font-size:2.1mm;font-weight:700;color:var(--accent)}
  #distributionPrintOverlay .dp-key{font:800 3.3mm/1 Consolas,Menlo,'Courier New',monospace;letter-spacing:.01em;color:#171717}
  #distributionPrintOverlay .dp-brand{position:absolute;left:1.2mm;bottom:1.6mm;white-space:nowrap;line-height:1;color:var(--accent)}
  #distributionPrintOverlay .dp-brand.coding{font:400 1.75mm/1 'Black Han Sans','Malgun Gothic',sans-serif}
  #distributionPrintOverlay .dp-brand.sancafe{font:700 1.45mm/1 Georgia,'Times New Roman',serif;letter-spacing:.25mm}
  #distributionPrintOverlay .dp-brand:before{content:'';display:block;width:4mm;height:.35mm;background:var(--accent);margin-bottom:.75mm}
  @page{size:A4 portrait;margin:0}
  @media print{html,body{margin:0!important;padding:0!important;background:#fff!important}body>*:not(#distributionPrintOverlay){display:none!important}#distributionPrintOverlay{position:static;overflow:visible;background:#fff}#distributionPrintOverlay .dp-bar{display:none}#distributionPrintOverlay .dp-pages{display:block;padding:0}#distributionPrintOverlay .dp-sheet{margin:0;box-shadow:none;break-after:page;page-break-after:always}#distributionPrintOverlay .dp-sheet:last-child{break-after:auto;page-break-after:auto}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  `;
  document.head.appendChild(style);
 }
 document.getElementById('distributionPrintOverlay')?.remove();
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const PER=70,pages=Math.ceil(items.length/PER);
 let sheets='';
 for(let p=0;p<pages;p++){
  const pageItems=items.slice(p*PER,(p+1)*PER);
  sheets+='<section class="dp-sheet"><div class="dp-grid">';
  for(const x of pageItems){
   const cafe=x.booth==='sancafe',accent=cafe?'#6b3a1c':'#0b6b3d',paper=cafe?'#fbf5ee':'#f4faf6',brand=cafe?'S A N C A F E':'코딩과 함께라면';
   sheets+='<div class="dp-cell"><div class="dp-ticket" style="--accent:'+accent+';--paper:'+paper+'"><div class="dp-code"><span class="dp-n">'+esc(x.max)+'인용 :</span><span class="dp-key">'+esc(x.code)+'</span></div><div class="dp-brand '+(cafe?'sancafe':'coding')+'">'+brand+'</div></div></div>';
  }
  sheets+='</div></section>';
 }
 const ov=document.createElement('div');ov.id='distributionPrintOverlay';
 ov.innerHTML='<div class="dp-bar"><div>배부용 이용권 미리보기 · '+items.length+'장 · A4 '+pages+'페이지 · 페이지당 최대 70장</div><div style="display:flex;gap:8px"><button class="dp-print" id="dpPrint">인쇄</button><button id="dpClose">닫기</button></div></div><div class="dp-pages">'+sheets+'</div>';
 document.body.appendChild(ov);
 const close=()=>{ov.remove();document.removeEventListener('keydown',escKey)};
 const escKey=e=>{if(e.key==='Escape')close()};
 document.addEventListener('keydown',escKey);
 ov.querySelector('#dpClose').onclick=close;
 ov.querySelector('#dpPrint').onclick=()=>window.print();
}
function load(){onSnapshot(query(collection(db,'accesscodes'),orderBy('createdAt','desc')),s=>{latestCodes=s.docs.filter(x=>x.id!=='_meta').map(x=>{const v=x.data(),used=Number(v.used??v.usedCount??0),max=Number(v.max??v.maxUses??0);return{code:x.id,team:v.team,booth:v.booth,max,used,remaining:Math.max(0,max-used),active:v.active!==false,createdAt:date(v.createdAt),createdBy:v.createdBy||'-'}});const list=$('list');list.innerHTML='';if(!s.size){list.innerHTML='<div class="empty">아직 발급된 이용권이 없습니다.</div>';return}s.forEach(x=>{const v=x.data(),used=Number(v.used||0),max=Number(v.max||0),active=v.active!==false,remaining=Math.max(0,max-used),el=document.createElement('div');el.className='code-item';el.innerHTML=`<label style="display:flex;align-items:center;gap:8px;grid-column:1/-1;color:#bbb;font-size:13px"><input class="pass-select" type="checkbox" value="${x.id}" style="width:18px;height:18px;accent-color:#00c853"> 배부용 출력에 포함</label><div><div class="code">${x.id}</div><div class="info">${v.team?`${v.team}팀 · `:''}${v.booth?`${name(v.booth)} · `:''}${used}/${max} 사용 · 잔여 ${remaining}<br>발급: ${date(v.createdAt)}</div></div><span class="badge ${active?'':'inactive'}">${active?'활성':'비활성'}</span><button class="action" data-action="toggle">${active?'비활성화':'활성화'}</button><button class="action danger" data-action="delete">삭제</button>`;el.querySelector('[data-action="toggle"]').onclick=()=>toggle(x.id,active);el.querySelector('[data-action="delete"]').onclick=()=>del(x.id);list.appendChild(el)})},e=>{console.error(e);$('list').innerHTML='<div class="empty">이용권을 불러오지 못했습니다.</div>'})}
updateRule();access().then(ok=>{if(ok)load()});
</script>
