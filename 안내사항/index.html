<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안내사항 프레젠테이션</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#f4f6f8;color:#222}body{padding:28px}.app{max-width:1100px;margin:0 auto}header{margin-bottom:20px}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#777;font-size:14px}.editor{background:#fff;border:1px solid #e2e5e8;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.06)}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid #eee}.toolbar label{font-size:13px;color:#666;font-weight:600}input[type=color]{width:42px;height:34px;padding:2px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer}select{height:36px;padding:0 10px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:14px}button{border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;transition:.15s}button:hover{transform:translateY(-1px)}#presentationBtn{margin-left:auto;background:#1ea857;color:white}#clearBtn{background:#f1f3f5;color:#555}#editor{margin-top:18px;min-height:480px;padding:22px;outline:none;border:1px solid #e4e7ea;border-radius:12px;line-height:1.7;font-size:26px;white-space:pre-wrap;overflow:auto}#editor:empty:before{content:attr(data-placeholder);color:#aaa}.help{font-size:13px;color:#888;margin-top:12px}.presentation{display:none;position:fixed;inset:0;background:#111;z-index:20;color:#fff}.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:7vw 9vw;overflow:hidden}.slide-content{width:100%;max-width:1500px;max-height:80vh;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;line-height:1.35}.controls{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;align-items:center;gap:12px;z-index:2}.controls button{background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.2)}#slideCounter{font-size:13px;color:#bbb;min-width:55px;text-align:center}#closePresentation{position:absolute;right:22px;top:18px;background:rgba(255,255,255,.12);color:#fff;z-index:3}.hint{position:absolute;left:22px;top:20px;color:#777;font-size:12px;z-index:3}@media(max-width:650px){body{padding:14px}#presentationBtn{margin-left:0}#editor{min-height:65vh;font-size:20px}.slide{padding:15vw 7vw}.hint{display:none}}
</style>
</head>
<body>
<div class="app"><header><h1>안내사항 만들기</h1><p class="sub">내용을 작성한 뒤 프레젠테이션으로 바로 확인하세요.</p></header><section class="editor"><div class="toolbar"><label for="fontColor">글자 색</label><input id="fontColor" type="color" value="#222222" title="글자 색"><label for="fontSize">글자 크기</label><select id="fontSize"><option value="18">18px</option><option value="22">22px</option><option value="26" selected>26px</option><option value="32">32px</option><option value="40">40px</option><option value="52">52px</option><option value="64">64px</option></select><button id="clearBtn">초기화</button><button id="presentationBtn">▶ 프레젠테이션</button></div><div id="editor" contenteditable="true" spellcheck="false" data-placeholder="여기에 안내사항을 입력하세요.&#10;&#10;예시)&#10;2026 축제 안내&#10;행사 일시: 9월 18일&#10;장소: 본관 강당&#10;많은 참여 부탁드립니다!"></div><div class="help">글자 색과 크기만 지정할 수 있습니다. 프레젠테이션에서는 내용의 길이에 맞춰 글자 크기가 자동 조절됩니다.</div></section></div>
<div id="presentation" class="presentation"><button id="closePresentation">✕ 닫기</button><div class="hint">← → 또는 ↑ ↓ 로 슬라이드 이동 · Esc로 닫기</div><div class="slide"><div id="slideContent" class="slide-content"></div></div><div class="controls"><button id="prevBtn">← 이전</button><span id="slideCounter">1 / 1</span><button id="nextBtn">다음 →</button></div></div>
<script>
const editor=document.getElementById('editor'),color=document.getElementById('fontColor'),size=document.getElementById('fontSize'),presentation=document.getElementById('presentation'),slideContent=document.getElementById('slideContent'),slideCounter=document.getElementById('slideCounter');let slides=[],current=0;
function save(){localStorage.setItem('noticePresentationContent',editor.innerHTML);localStorage.setItem('noticePresentationColor',color.value);localStorage.setItem('noticePresentationSize',size.value)}
function applyStyle(){editor.style.color=color.value;editor.style.fontSize=size.value+'px';save()}
function load(){const c=localStorage.getItem('noticePresentationContent');if(c)editor.innerHTML=c;const co=localStorage.getItem('noticePresentationColor');if(co)color.value=co;const s=localStorage.getItem('noticePresentationSize');if(s)size.value=s;applyStyle()}
color.addEventListener('input',applyStyle);size.addEventListener('change',applyStyle);editor.addEventListener('input',save);
document.getElementById('clearBtn').onclick=()=>{if(confirm('작성한 내용을 모두 지울까요?')){editor.innerHTML='';save();editor.focus()}};
function cleanText(){return editor.innerText.replace(/\r/g,'').trim()}
function makeSlides(){const raw=cleanText();if(!raw){alert('먼저 내용을 입력해주세요.');return false}let blocks=raw.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);if(blocks.length===1){const lines=raw.split('\n').map(x=>x.trim()).filter(Boolean);if(lines.length>3)blocks=lines.reduce((a,line)=>{if(!a.length||a[a.length-1].length>120)a.push(line);else a[a.length-1]+='\n'+line;return a},[])}slides=blocks.length?blocks:[raw];current=0;return true}
function autoFont(text){const chars=text.replace(/\s/g,'').length,lines=text.split('\n').length;let px=76;if(chars>35)px=64;if(chars>60)px=54;if(chars>100)px=44;if(chars>160)px=36;if(chars>240)px=30;if(chars>360)px=25;if(chars>500)px=21;if(lines>=5)px=Math.min(px,34);if(lines>=8)px=Math.min(px,28);if(lines>=12)px=Math.min(px,23);return Math.max(18,px)}
function showSlide(){const text=slides[current]||'';slideContent.textContent=text;slideContent.style.color=color.value;slideContent.style.fontSize=autoFont(text)+'px';slideCounter.textContent=(current+1)+' / '+slides.length;document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===slides.length-1}
function openPresentation(){if(!makeSlides())return;presentation.style.display='block';document.body.style.overflow='hidden';showSlide()}function closePresentation(){presentation.style.display='none';document.body.style.overflow=''}
document.getElementById('presentationBtn').onclick=openPresentation;document.getElementById('closePresentation').onclick=closePresentation;document.getElementById('prevBtn').onclick=()=>{if(current>0){current--;showSlide()}};document.getElementById('nextBtn').onclick=()=>{if(current<slides.length-1){current++;showSlide()}};
document.addEventListener('keydown',e=>{if(presentation.style.display!=='block')return;if(e.key==='Escape')closePresentation();if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();if(current<slides.length-1){current++;showSlide()}}if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();if(current>0){current--;showSlide()}}});load();
</script>
</body>
</html>
