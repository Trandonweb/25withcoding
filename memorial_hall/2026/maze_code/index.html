<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>미로 탈출 아케이드</title>
<style>
:root{--black:#0f0f14;--white:#f5f5f5;--blue:#2980b9;--red:#e74c3c;--green:#2ecc71;--yellow:#f1c40f;--purple:#9b59b6;--gray:#646464;--cyan:#00ced1}
*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--white);font-family:"Malgun Gothic","맑은 고딕",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
#app{width:min(100%,760px);padding:14px}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border:1px solid #333;outline:none;background:var(--black)}
.note{text-align:center;color:#aaa;font-size:13px;margin-top:9px}
</style></head>
<body><div id="app"><canvas id="game" width="656" height="408" tabindex="0"></canvas><div class="note">방향키로 이동 · Enter로 선택 · R로 메뉴 복귀 · 게임 화면을 클릭하면 키보드 조작 가능</div></div>
<script>
(()=>{
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const BLACK="#0f0f14",WHITE="#f5f5f5",BLUE="#2980b9",RED="#e74c3c",GREEN="#2ecc71",YELLOW="#f1c40f",PURPLE="#9b59b6",GRAY="#646464",CYAN="#00ced1";
const TILE=32,COLS=18,ROWS=9,W=COLS*TILE+80,H=ROWS*TILE+120;canvas.width=W;canvas.height=H;
const FONT='18px "Malgun Gothic","맑은 고딕",sans-serif',TITLE='bold 30px "Malgun Gothic","맑은 고딕",sans-serif',BIG='bold 38px "Malgun Gothic","맑은 고딕",sans-serif';
let gameState="MENU",menuSelection=0,currentStage=0,score=0,lives=3,hasKey=false,playerPos=[1,1],remainingTime=60,startTime=0,currentMaze=[],nextLifeScore=300;
const maxStages=5;
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function txt(t,x,y,f=FONT,c=WHITE,align="left"){ctx.font=f;ctx.fillStyle=c;ctx.textAlign=align;ctx.textBaseline="alphabetic";ctx.fillText(t,x,y)}
function box(x,y,w,h,r,fill,stroke=null,line=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=line;ctx.strokeStyle=stroke;ctx.stroke()}}
function generateBalancedMaze(stageNum,isDark=false){
 const m=Array.from({length:ROWS},()=>Array(COLS).fill(1));
 for(let r=1;r<ROWS-1;r+=2)for(let c=1;c<COLS-1;c+=2){m[r][c]=0;if(r+1<ROWS-1)m[r+1][c]=0;if(c+1<COLS-1)m[r][c+1]=0}
 const start=[1,1],key=[ROWS-2,1],exit=[ROWS-2,COLS-2];let [r,c]=start;m[r][c]=0;
 while(r!==key[0]||c!==key[1]){if(r<key[0]&&(c===key[1]||Math.random()<.5))r++;else if(r>key[0]&&(c===key[1]||Math.random()<.5))r--;else if(c<key[1])c++;else if(c>key[1])c--;m[r][c]=0}
 [r,c]=key;
 while(r!==exit[0]||c!==exit[1]){if(r<exit[0]&&(c===exit[0]||Math.random()<.5))r++;else if(r>exit[0]&&(c===exit[0]||Math.random()<.5))r--;else if(c<exit[1])c++;else if(c>exit[1])c--;m[r][c]=0}
 for(let i=0;i<8+stageNum*6;i++)m[ri(1,ROWS-2)][ri(1,COLS-2)]=0;
 m[1][1]=0;m[ROWS-2][1]=3;m[ROWS-2][COLS-2]=2;m[1][2]=0;m[2][1]=0;
 const empty=[];for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++)if(m[y][x]===0&&!(y===1&&x===1)&&!(y===ROWS-2&&x===1)&&!(y===ROWS-2&&x===COLS-2))empty.push([y,x]);
 for(let i=empty.length-1;i>0;i--){let j=ri(0,i);[empty[i],empty[j]]=[empty[j],empty[i]]}
 for(let i=0,n=(isDark?4+stageNum:4+stageNum*2);i<n&&empty.length;i++){let [y,x]=empty.pop();m[y][x]=5}
 for(let i=0;i<6&&empty.length;i++){let [y,x]=empty.pop();m[y][x]=4}
 return m
}
function loadStageMap(){currentMaze=generateBalancedMaze(currentStage+1,gameState==="DARK");hasKey=false;playerPos=[1,1];startTime=Date.now();remainingTime=60}
function startGame(mode){currentStage=0;score=0;nextLifeScore=300;lives=mode==="NORMAL"?3:1;gameState=mode;loadStageMap()}
function handleKey(k){
 if(gameState==="MENU"){if(k==="ArrowUp")menuSelection=(menuSelection+2)%3;else if(k==="ArrowDown")menuSelection=(menuSelection+1)%3;else if(k==="Enter"){if(menuSelection===0)startGame("NORMAL");else if(menuSelection===1)startGame("DARK");else gameState="HOW_TO_PLAY"}}
 else if(gameState==="HOW_TO_PLAY"){if(k==="Escape"||k==="Enter")gameState="MENU"}
 else if(gameState==="NORMAL"||gameState==="DARK"){
 let [r,c]=playerPos;if(k==="ArrowUp")r--;else if(k==="ArrowDown")r++;else if(k==="ArrowLeft")c--;else if(k==="ArrowRight")c++;else return;
 if(r<0||r>=ROWS||c<0||c>=COLS)return;let t=currentMaze[r][c];if(t===1)return;playerPos=[r,c];
 if(t===3){hasKey=true;currentMaze[r][c]=0}
 else if(t===4){score+=100;currentMaze[r][c]=0;if(score>=nextLifeScore){if(lives<3)lives++;nextLifeScore+=300}}
 else if(t===5){lives=gameState==="DARK"?0:lives-1;currentMaze[r][c]=0;if(lives<=0)gameState="GAME_OVER"}
 else if(t===2&&hasKey){if(currentStage<maxStages-1){currentStage++;loadStageMap()}else gameState="GAME_WIN"}
 }else if((gameState==="GAME_OVER"||gameState==="GAME_WIN")&&(k==="r"||k==="R"))gameState="MENU"
}
function draw(){
 ctx.fillStyle=BLACK;ctx.fillRect(0,0,W,H);let cx=W/2,cy=H/2;
 if(gameState==="MENU"){
 box(cx-260,cy-130,520,260,12,"#191923",CYAN,2);txt("미로 탈출 아케이드",cx,cy-85,TITLE,GREEN,"center");
 ["1. 일반 모드 (300점마다 목숨 충전)","2. 암흑 모드 (시야 제한 / 함정 즉사)","3. 게임 설명"].forEach((t,i)=>{if(i===menuSelection){box(cx-235,cy-25+i*45,470,36,6,"#283c50");txt("▶ "+t,cx-220,cy-1+i*45,FONT,YELLOW)}else txt("   "+t,cx-220,cy-1+i*45,FONT,WHITE)});
 txt("[방향키] 이동    [ENTER] 선택",cx,cy+105,FONT,"#b4b4b4","center")
 }else if(gameState==="HOW_TO_PLAY"){
 box(cx-300,cy-150,600,300,12,"#191923",CYAN,2);txt("게임 설명",cx-50,cy-125,TITLE,YELLOW);
 ["• 300점마다 목숨 +1 (최대 3개 제한)","• 100% 클리어 가능한 밸런스 미로","• 열쇠(노란색)를 먹어야 출구(초록색) 활성화","• 코인(주황색): 점수 +100점","• 함정(보라색): 밟으면 목숨 차감","• 제한 시간: 스테이지당 60초"].forEach((t,i)=>txt(t,cx-275,cy-70+i*28,FONT,WHITE));
 txt("[ENTER 또는 ESC] 메뉴로 돌아가기",cx,cy+110,FONT,CYAN,"center")
 }else if(gameState==="NORMAL"||gameState==="DARK"){
 remainingTime=Math.max(0,60-Math.floor((Date.now()-startTime)/1000));if(remainingTime===0){gameState="GAME_OVER";draw();return}
 const ox=40,oy=60;
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let x=c*TILE+ox,y=r*TILE+oy,t=currentMaze[r][c];ctx.fillStyle=t===1?BLUE:t===2?(hasKey?GREEN:GRAY):t===5?PURPLE:WHITE;
 if(t===3||t===4){ctx.fillStyle=t===3?YELLOW:"#f39c12";ctx.beginPath();ctx.arc(x+16,y+16,t===3?TILE/3:TILE/4,0,Math.PI*2);ctx.fill()}else ctx.fillRect(x,y,TILE,TILE);
 ctx.strokeStyle="#c8c8c8";ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,TILE-1,TILE-1)}
 let px=playerPos[1]*TILE+16+ox,py=playerPos[0]*TILE+16+oy;ctx.fillStyle=RED;ctx.beginPath();ctx.arc(px,py,TILE/3,0,Math.PI*2);ctx.fill();
 if(gameState==="DARK")for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(Math.abs(r-playerPos[0])+Math.abs(c-playerPos[1])>1){ctx.fillStyle="#0a0a0f";ctx.fillRect(c*TILE+ox,r*TILE+oy,TILE,TILE)}
 ctx.fillStyle="#1e1e1e";ctx.fillRect(0,0,W,50);txt(`[${gameState==="NORMAL"?"일반 모드":"암흑 모드"}] 스테이지:${currentStage+1}/5 | 점수:${score} | 목숨:${"♥ ".repeat(lives)} | 열쇠:${hasKey?"보유":"없음"} | 남은시간:${remainingTime}초`,20,33,FONT,WHITE)
 }else if(gameState==="GAME_WIN"){txt("🎉 전 스테이지 클리어! 🎉",cx,cy-25,BIG,YELLOW,"center");txt("[R] 키를 눌러 메뉴로 돌아가기",cx,cy+35,FONT,WHITE,"center")}
 else if(gameState==="GAME_OVER"){txt("게임 오버",cx,cy-25,BIG,RED,"center");txt("[R] 키를 눌러 메뉴로 돌아가기",cx,cy+35,FONT,WHITE,"center")}
}
function loop(){draw();requestAnimationFrame(loop)}
window.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();handleKey(e.key);draw()});
canvas.addEventListener("click",()=>canvas.focus());loop();
})();
</script></body></html>
