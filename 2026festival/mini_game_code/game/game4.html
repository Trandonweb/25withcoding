<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4목</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#071b12,#123b27);color:white;font-family:Arial,'Noto Sans KR',sans-serif;display:grid;place-items:center;padding:16px}.wrap{width:min(650px,100%);text-align:center}h1{font-size:42px}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:#10251a;padding:12px;border-radius:16px}.cell{aspect-ratio:1;border:0;border-radius:50%;background:#294532;cursor:pointer}.p1{background:#53e88a}.p2{background:#ffcf67}.btn{padding:12px 20px;border:0;border-radius:10px;background:#1ea857;color:white;font-weight:bold;cursor:pointer}.hidden{display:none}.muted{color:#b7cbb9}</style></head><body><main class="wrap"><div id="round"></div><div id="mode"></div><h1>🟢 4목</h1><p>가로·세로·대각선으로 네 개를 먼저 연결하세요.</p><div id="board" class="board"></div><h3 id="message">나의 차례</h3><button id="done" class="btn hidden">결과 확인 →</button><p class="muted">컴퓨터 대전은 AI가 자동으로 둡니다. 1대1은 번갈아 클릭하세요.</p></main><script>
const s=JSON.parse(localStorage.getItem('miniGameSettings')||'null')||{mode:'cpu'};document.getElementById('mode').textContent=s.modeName||'컴퓨터와 대전';document.getElementById('round').textContent=s.round?s.round+'번째 게임':'';const R=6,C=7,b=Array.from({length:6},()=>Array(7).fill(0));let turn=1,over=false;const board=document.getElementById('board');function draw(){board.replaceChildren();for(let r=0;r<R;r++)for(let c=0;c<C;c++){const x=document.createElement('button');x.className='cell'+(b[r][c]?' p'+b[r][c]:'');x.onclick=()=>drop(c);board.appendChild(x)}}function win(p){for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(b[r][c]===p)for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let n=1;for(let k=1;k<4;k++)if(b[r+dr*k]&&b[r+dr*k][c+dc*k]===p)n++;else break;if(n>=4)return true}return false}function put(c,p){for(let r=R-1;r>=0;r--)if(!b[r][c]){b[r][c]=p;return true}return false}function drop(c){if(over||(s.mode==='cpu'&&turn!==1)||b[0][c])return;put(c,turn);after()}function after(){draw();if(win(turn)){over=true;const w=turn===1?'me':'opp';document.getElementById('message').textContent=w==='me'?'🎉 승리!':'상대 승리!';localStorage.setItem('miniGameResult',JSON.stringify({game:'🟢 4목',winner:w,me:turn===1?1:0,opp:turn===2?1:0}));document.getElementById('done').classList.remove('hidden');return}if(b.every(row=>row.every(Boolean))){over=true;document.getElementById('message').textContent='무승부!';localStorage.setItem('miniGameResult',JSON.stringify({game:'🟢 4목',winner:'draw',me:0,opp:0}));document.getElementById('done').classList.remove('hidden');return}turn=turn===1?2:1;document.getElementById('message').textContent=turn===1?'나의 차례':'상대 차례';if(s.mode==='cpu'&&turn===2)setTimeout(ai,300)}function ai(){if(over)return;let cols=[0,1,2,3,4,5,6].filter(c=>!b[0][c]);for(const p of [2,1])for(const c of cols){const copy=b.map(row=>row.slice());let rr=-1;for(let r=R-1;r>=0;r--)if(!copy[r][c]){copy[r][c]=p;rr=r;break}if(rr<0)continue;const original=b.map(row=>row.slice());for(let r=0;r<R;r++)b[r]=copy[r];const yes=win(p);for(let r=0;r<R;r++)b[r]=original[r];if(yes){put(c,2);turn=2;after();return}}const c=cols.sort((a,z)=>Math.abs(a-3)-Math.abs(z-3))[0];put(c,2);turn=2;after()}document.getElementById('done').onclick=()=>location.href='../index.html';draw();</script></body></html>
