<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>코딩과 함께라면 2026 Festival 관리자</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#0b0b10;
  color:white;
  font-family:'Malgun Gothic',sans-serif;
}


/* 상단 */
h1{
  margin:0 -20px 25px;
  padding:20px;

  text-align:center;

  background:linear-gradient(
    90deg,
    #00c853,
    #64dd17
  );

  color:white;

  font-size:26px;

  box-shadow:
  0 5px 20px rgba(0,0,0,.4);
}


/* 전체 영역 */
#app{
  max-width:900px;
  margin:auto;
}


/* 제목 */
h2{
  margin-top:0;
  padding-bottom:10px;

  border-bottom:
  1px solid rgba(255,255,255,.15);
}


/* 카드 */
.panel{

  background:#171720;

  padding:25px;

  border-radius:18px;

  margin-bottom:25px;

  box-shadow:
  0 10px 30px rgba(0,0,0,.3);

}


/* 입력 */
input,
textarea,
select{

  width:100%;

  padding:13px;

  margin-top:8px;
  margin-bottom:18px;

  border-radius:10px;

  border:1px solid #333;

  background:#111118;

  color:white;

  font-size:15px;

}


input:focus,
textarea:focus,
select:focus{

  outline:none;

  border-color:#00c853;

  box-shadow:
  0 0 10px rgba(0,200,83,.4);

}


textarea{

  min-height:100px;

  resize:vertical;

}



/* 라벨 */
label{

  font-weight:bold;

  display:block;

  margin-top:10px;

  color:#ddd;

}



/* URL */
.url-box{

  display:flex;

  margin-bottom:18px;

}


.url-prefix{

  display:flex;

  align-items:center;

  padding:0 14px;

  background:#252530;

  border-radius:
  10px 0 0 10px;

  font-size:14px;

  color:#aaa;

  white-space:nowrap;

}


.url-box input{

  margin:0;

  border-radius:
  0 10px 10px 0;

}



/* 버튼 */

button{

  border:0;

  border-radius:12px;

  padding:13px 20px;

  font-size:15px;

  font-weight:bold;

  transition:.2s;

}


button:hover{

  transform:translateY(-2px);

}


/* 추가 버튼 */

button:not(.delete){

  background:#00c853;

  color:white;

  width:100%;

}


/* 작품 카드 */

.card{

  background:#171720;

  padding:18px;

  margin-top:15px;

  border-radius:15px;

  border-left:
  5px solid #00c853;

}



.card b{

  font-size:20px;

}



.card span{

  display:inline-block;

}


/* 삭제 */

.delete{

  float:right;

  background:#d32f2f;

  color:white;

  padding:8px 15px;

}



hr{

  border:none;

  height:1px;

  background:#333;

  margin:30px 0;

}



/* 모바일 */

@media(max-width:600px){

 body{

  padding:12px;

 }


 h1{

  margin:
  0 -12px 20px;

  font-size:22px;

 }


 .url-box{

  display:block;

 }


 .url-prefix{

  padding:12px;

  border-radius:
  10px 10px 0 0;

 }


 .url-box input{

  border-radius:
  0 0 10px 10px;

 }

}
<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";



import {

getFirestore,

collection,

getDocs,

doc,

setDoc,

deleteDoc

}

from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";





const pw = prompt("관리자 비밀번호");



if(pw !== "20262326"){

document.body.innerHTML="접근 거부";

throw new Error("Denied");

}





document.getElementById("app").style.display="block";






const firebaseConfig = {


apiKey: "AIzaSyAQccv_jkaNQuy1rOCcoFdUfo0GkxQDv9Q",

authDomain:"festivallikes.firebaseapp.com",

projectId:"festivallikes",

storageBucket:"festivallikes.firebasestorage.app",

messagingSenderId:"782245120700",

appId:"1:782245120700:web:c61e16313e9ae688e6deb9"

};






const app = initializeApp(firebaseConfig);


const db = getFirestore(app);







window.changeType=function(){


const type =
document.getElementById("type").value;



document.getElementById("embedBox").style.display =

type==="entry"

?

"block"

:

"none";


};









window.addProject = async function(){



const title =

document.getElementById("title").value.trim();




if(!title){

alert("작품명을 입력하세요");

return;

}





const type =

document.getElementById("type").value;




await setDoc(

doc(db,"projects",title),

{


by:
document.getElementById("by").value,



detail:
document.getElementById("detail").value,



howto:
document.getElementById("howto").value,



note:
document.getElementById("note").value,



type:type,



url:

"https://25withcoding.kr/" +

document

.getElementById("url")

.value

.replace(/^\/+/,""),




thum:

document.getElementById("thum").value,




embed:

type==="entry"

?

document.getElementById("embed").value

:

"",




likes:0


}

);





alert("추가 완료");


loadProjects();


};








window.removeProject = async function(id){



if(!confirm(id+" 삭제?"))

return;




await deleteDoc(

doc(db,"projects",id)

);



loadProjects();


};










async function loadProjects(){



const list =
document.getElementById("list");



list.innerHTML="";




const snap =

await getDocs(

collection(db,"projects")

);





snap.forEach(d=>{



const div =
document.createElement("div");



div.className="card";



div.innerHTML=`

<b>${d.id}</b><br>

${d.data().by || ""}

<br>

유형 : ${d.data().type || ""}

<br><br>


<button class="delete"

onclick="removeProject('${d.id}')">

삭제

</button>

`;



list.appendChild(div);



});



}





loadProjects();



</script>



</body>
</html>
