<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코딩과 함께라면</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#27ae60">
<link rel="apple-touch-icon" href="/app_logo_ver3.png">
<style>
:root{--bg:#F0F0F0;--card:#fff;--text:#111;--primary:#27ae60;--btn:#e0e0e0;--btnText:#333}
body.dark-mode{--bg:#121212;--card:#1e1e1e;--text:#fff;--btn:#2c2c2c;--btnText:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;min-height:100vh;transition:.2s}
header{position:relative;width:100%;padding:22px;background:var(--bg);color:var(--primary);text-align:center;font-size:26px;font-weight:bold;border-bottom:3px solid var(--primary);box-shadow:0 2px 10px #00000014}
.header-left{position:absolute;left:20px;top:16px;display:flex;gap:10px;align-items:center}.header-btn,.auth-btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-size:14px;font-weight:bold}.header-btn{background:var(--btn);color:var(--btnText)}.header-btn:hover{filter:brightness(.95)}.header-btn:disabled{opacity:.65;cursor:default}
#adminBtn,#noticeBtn,#mirrorBtn,#attendanceBtn{display:none}#attendanceBtn{background:var(--primary);color:#fff}.auth-btn{position:absolute;right:20px;top:16px;background:var(--primary);color:#fff}.auth-btn:hover{filter:brightness(.9)}
.container{margin-top:40px;width:90%;max-width:600px}.card{background:var(--card);padding:22px;margin:18px 0;border-radius:18px;cursor:pointer;transition:.2s;border:2px solid var(--primary);box-shadow:0 4px 12px #00000014;text-align:center;font-size:18px;font-weight:bold;color:var(--text)}.card:hover{transform:scale(1.03)}.coby-card{display:flex;align-items:center;justify-content:center;gap:10px;height:69px;padding:10px 22px;text-decoration:none}.coby-title{display:block;width:190px;height:45px;overflow:hidden;border-radius:10px;flex:0 0 190px}.coby-logo{width:100%;height:100%;object-fit:cover}.coby-beta{padding:4px 9px;border-radius:999px;background:var(--primary);color:#fff;font-size:10px;font-weight:800}.footer{margin-top:auto;padding:20px;color:#777;font-size:13px}
.modal-overlay{position:fixed;inset:0;background:#0008;display:flex;justify-content:center;align-items:center;z-index:1000;opacity:0;visibility:hidden}.modal-overlay.active{opacity:1;visibility:visible}.modal-content{background:var(--card);color:var(--text);width:90%;max-width:450px;border-radius:20px;padding:24px;border:2px solid var(--primary);max-height:85vh;overflow-y:auto}.modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--primary);padding-bottom:12px;margin-bottom:20px;font-size:20px;font-weight:bold}.modal-close{background:none;border:0;font-size:22px;cursor:pointer;color:var(--text)}.setting-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #0002}.setting-info{display:flex;flex-direction:column;gap:4px}.setting-title{font-size:16px;font-weight:bold}.setting-desc{font-size:12px;color:#888}.switch{position:relative;display:inline-block;width:50px;height:26px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#ccc;border-radius:26px}.slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}input:checked+.slider{background:var(--primary)}input:checked+.slider:before{transform:translateX(24px)}.color-picker-group{display:flex;gap:8px}.color-circle{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent}.color-circle.selected{border-color:#111;transform:scale(1.15)}.password-setting{display:block}.password-toggle{width:100%;display:flex;justify-content:space-between;padding:14px 0;border:0;background:none;color:var(--text);text-align:left;cursor:pointer}.password-form{display:none;flex-direction:column;gap:9px}.password-setting.open .password-form{display:flex}.password-input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:12px;background:var(--bg);color:var(--text)}.password-change-btn{width:100%;padding:12px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-weight:bold}
@media(max-width:600px){header{padding:58px 20px 20px;font-size:22px}.header-left{top:12px;left:12px;right:12px;gap:6px}.header-btn,.auth-btn{padding:8px 11px;font-size:12px}.auth-btn{top:12px;right:12px}.container{margin-top:25px}.card{margin:14px 0;padding:19px}}
</style>
</head>
<body>
<header><div class="header-left"><button id="attendanceBtn" class="header-btn" type="button">출석체크</button><button id="adminBtn" class="header-btn">관리자</button><button id="noticeBtn" class="header-btn">공지</button><button id="mirrorBtn" class="header-btn">화면공유</button><button id="settingsBtn" class="header-btn">설정</button></div>코딩과 함께라면<button id="authBtn" class="auth-btn">로그인</button></header>
<div class="container"><div class="card" onclick="go('/2026festival/')">🎉 2026 Festival</div><div class="card" onclick="go('/2025/')">2025 기념관</div><div class="card" onclick="go('/memo/')">저장 공간</div><div class="card" onclick="goPoint()">상벌점</div><div class="card" onclick="go('/NOTE/')">설명용 노트</div><a class="card coby-card" href="/AI"><span class="coby-title"><img class="coby-logo" src="/AI/COBY_AI_logo.png" alt="COBY AI"></span><span class="coby-beta">BETA</span></a></div>
<div class="footer">2026 코딩과함께라면 | SINCE 2025</div>
<div id="settingsModal" class="modal-overlay"><div class="modal-content"><div class="modal-header"><span>환경 설정</span><button class="modal-close" id="settingsClose">&times;</button></div><div class="setting-item"><div class="setting-info"><span class="setting-title">다크 모드</span><span class="setting-desc">화면을 어둡게 표시합니다.</span></div><label class="switch"><input type="checkbox" id="darkModeToggle"><span class="slider"></span></label></div><div class="setting-item"><div class="setting-info"><span class="setting-title">포인트 컬러 테마</span></div><div class="color-picker-group"><div class="color-circle" style="background:#27ae60" data-color="#27ae60"></div><div class="color-circle" style="background:#3498db" data-color="#3498db"></div><div class="color-circle" style="background:#e84393" data-color="#e84393"></div><div class="color-circle" style="background:#9b59b6" data-color="#9b59b6"></div><div class="color-circle" style="background:#e74c3c" data-color="#e74c3c"></div></div></div><div class="setting-item"><div class="setting-info"><span class="setting-title">로그인 상태 유지</span></div><label class="switch"><input type="checkbox" id="keepLoginToggle"><span class="slider"></span></label></div><div class="setting-item password-setting" id="passwordSetting"><button type="button" class="password-toggle" id="passwordToggle"><span class="setting-info"><span class="setting-title">비밀번호 변경</span><span class="setting-desc">눌러서 비밀번호 변경</span></span><span>⌄</span></button><div class="password-form"><input class="password-input" id="currentPassword" type="password" placeholder="현재 비밀번호"><input class="password-input" id="newPassword" type="password" placeholder="새 비밀번호"><input class="password-input" id="confirmPassword" type="password" placeholder="새 비밀번호 확인"><button class="password-change-btn" id="passwordChangeBtn">비밀번호 변경</button></div></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import{renderAttendanceButton}from"/attendance.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyBgOAO72ArW8dO7OSYsTVEQtRHT049U20",authDomain:"points2026-f5e50.firebaseapp.com",projectId:"points2026-f5e50"}));
const KEY="coding_with_ramen_settings",defaults={darkMode:false,primaryColor:"#27ae60",keepLogin:true};
const $=id=>document.getElementById(id);function settings(){try{return{...defaults,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{return{...defaults}}}function save(s){localStorage.setItem(KEY,JSON.stringify(s))}function apply(s){document.body.classList.toggle("dark-mode",!!s.darkMode);document.documentElement.style.setProperty("--primary",s.primaryColor||defaults.primaryColor);$("darkModeToggle").checked=!!s.darkMode;$("keepLoginToggle").checked=s.keepLogin!==false;document.querySelectorAll(".color-circle").forEach(x=>x.classList.toggle("selected",x.dataset.color===s.primaryColor));$("cobyLogo").src=s.darkMode?"/AI/COBY_AI_logo_dark_mode.png":"/AI/COBY_AI_logo.png")}
async function loadUserSettings(id){try{const snap=await getDoc(doc(db,"users",id));if(!snap.exists())return;const fs=snap.data().settings||{},s={darkMode:fs.darkMode??defaults.darkMode,primaryColor:fs.primaryColor??defaults.primaryColor,keepLogin:fs.keepLogin??defaults.keepLogin};save(s);apply(s)}catch(e){console.error("설정 불러오기 실패",e);apply(settings())}}
function go(p){location.href=p}window.go=go;function goPoint(){const u=localStorage.getItem("userId");location.href=u?"/상벌점/main.html":"/signin/?redirect=/상벌점/main.html"}window.goPoint=goPoint;
async function updateUI(){const user=localStorage.getItem("userId"),auth=$("authBtn"),admin=$("adminBtn"),notice=$("noticeBtn"),mirror=$("mirrorBtn"),attendance=$("attendanceBtn");admin.style.display=notice.style.display=mirror.style.display="none";attendance.style.display="none";if(user){await loadUserSettings(user);try{const snap=await getDoc(doc(db,"users",user));if(snap.exists()){const role=snap.data().role;if(role==="president"){admin.style.display="block";notice.style.display="block"}else if(role==="vice"){admin.style.display="block";mirror.style.display="block"}else{mirror.style.display="block"}}}catch(e){console.error("역할 확인 실패",e)}attendance.style.display="block";renderAttendanceButton(attendance).catch(e=>console.error("[ATTENDANCE] 렌더링 실패",e));auth.textContent=`${user} 로그아웃`;auth.onclick=()=>location.href="/signout/?redirect=/"}else{auth.textContent="로그인";auth.onclick=()=>location.href="/signin/?redirect=/"}apply(settings())}
$("adminBtn").onclick=()=>location.href="/admin";$("noticeBtn").onclick=()=>location.href="/안내사항/";$("mirrorBtn").onclick=()=>location.href="/admin/mirroring/client.html";$("settingsBtn").onclick=()=>$("settingsModal").classList.add("active");$("settingsClose").onclick=()=>$("settingsModal").classList.remove("active");$("settingsModal").onclick=e=>{if(e.target===$("settingsModal"))$("settingsModal").classList.remove("active")};
$("darkModeToggle").onchange=async e=>{const s=settings();s.darkMode=e.target.checked;save(s);apply(s)};$("keepLoginToggle").onchange=e=>{const s=settings();s.keepLogin=e.target.checked;save(s)};document.querySelectorAll(".color-circle").forEach(x=>x.onclick=async()=>{const s=settings();s.primaryColor=x.dataset.color;save(s);apply(s)});$("passwordToggle").onclick=()=>$("passwordSetting").classList.toggle("open");$("passwordChangeBtn").onclick=async()=>{const u=localStorage.getItem("userId");if(!u)return alert("로그인 후 이용할 수 있습니다.");const cur=$("currentPassword").value,n=$("newPassword").value,c=$("confirmPassword").value;if(!cur||!n||!c)return alert("모든 항목을 입력하세요.");if(n.length<6)return alert("새 비밀번호는 6자 이상이어야 합니다.");if(n!==c)return alert("새 비밀번호가 서로 일치하지 않습니다.");const ref=doc(db,"users",u),snap=await getDoc(ref);if(!snap.exists()||snap.data().password!==cur)return alert("현재 비밀번호가 올바르지 않습니다.");await updateDoc(ref,{password:n});alert("비밀번호가 변경되었습니다.");$("currentPassword").value=$("newPassword").value=$("confirmPassword").value=""};
apply(settings());updateUI();
</script></body></html>
