<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Coins</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===================== -->
    <!-- 메인 메뉴 -->
    <!-- ===================== -->
    <div id="mainMenu" class="menu">

        <h1>🪙 Find the Coins</h1>

        <button id="startBtn">게임 시작</button>
        <button id="continueBtn">이어하기</button>
        <button id="settingsBtn">설정</button>

    </div>


    <!-- ===================== -->
    <!-- HUD -->
    <!-- ===================== -->
    <div id="hud">

        <div id="coinDisplay">
            🪙
            <span id="coinCount">0</span>
        </div>

        <div id="healthDisplay">
            ❤️
            <span id="health">100</span>
        </div>

        <div id="levelDisplay">
            ⭐
            <span id="level">1</span>
        </div>

        <div id="timerDisplay">
            ⏱
            <span id="timer">00:00</span>
        </div>

    </div>


    <!-- ===================== -->
    <!-- 게임 캔버스 -->
    <!-- ===================== -->
    <canvas id="gameCanvas" width="1280" height="720"></canvas>


    <!-- ===================== -->
    <!-- 일시정지 -->
    <!-- ===================== -->
    <div id="pauseMenu" class="menu hidden">

        <h2>일시정지</h2>

        <button id="resumeBtn">계속하기</button>
        <button id="restartBtn">다시 시작</button>
        <button id="exitBtn">메인 메뉴</button>

    </div>


    <!-- ===================== -->
    <!-- 게임 오버 -->
    <!-- ===================== -->
    <div id="gameOver" class="menu hidden">

        <h2>GAME OVER</h2>

        <p>
            획득한 동전 :
            <span id="finalCoins">0</span>
        </p>

        <button id="retryBtn">
            다시 도전
        </button>

        <button id="backMenuBtn">
            메인 메뉴
        </button>

    </div>


    <!-- ===================== -->
    <!-- 스크립트 -->
    <!-- ===================== -->

    <script src="js/input.js"></script>

    <script src="js/player.js"></script>

    <script src="js/camera.js"></script>

    <script src="js/map.js"></script>

    <script src="js/coins.js"></script>

    <script src="js/items.js"></script>

    <script src="js/enemy.js"></script>

    <script src="js/collision.js"></script>

    <script src="js/particle.js"></script>

    <script src="js/shop.js"></script>

    <script src="js/inventory.js"></script>

    <script src="js/achievements.js"></script>

    <script src="js/save.js"></script>

    <script src="js/sound.js"></script>

    <script src="js/ui.js"></script>

    <script src="js/game.js"></script>

</body>
</html>
