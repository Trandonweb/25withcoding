<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#27ae60">
  <meta name="robots" content="noindex">
  <title>페이지를 찾을 수 없습니다 | 코딩과 함께라면</title>
  <style>
    :root {
      --bg-color: #F0F0F0;
      --card-bg: #ffffff;
      --text-color: #111111;
      --muted-color: #777777;
      --primary-color: #27ae60;
      --btn-bg: #e0e0e0;
      --btn-text: #333333;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1E1E1E;
      --text-color: #FFFFFF;
      --muted-color: #aaaaaa;
      --btn-bg: #2C2C2C;
      --btn-text: #FFFFFF;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      transition: background 0.2s, color 0.2s;
    }

    .error-card {
      width: min(92%, 650px);
      padding: 30px;
      text-align: center;
      background: var(--card-bg);
      border: 2px solid var(--primary-color);
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .error-image-wrap {
      width: min(100%, 520px);
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: 14px;
    }

    .error-image {
      display: block;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
    }

    h1 {
      margin: 24px 0 10px;
      font-size: clamp(22px, 5vw, 30px);
    }

    p {
      margin: 0 auto 28px;
      max-width: 440px;
      color: var(--muted-color);
      font-size: 15px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button, a {
      min-width: 145px;
      padding: 12px 18px;
      border-radius: 11px;
      border: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: filter 0.2s, transform 0.2s;
    }

    .home-btn {
      background: var(--primary-color);
      color: #fff;
    }

    .back-btn {
      background: var(--btn-bg);
      color: var(--btn-text);
    }

    button:hover, a:hover {
      transform: translateY(-1px);
      filter: brightness(0.94);
    }

    .brand {
      margin-top: 22px;
      color: var(--muted-color);
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    @media (max-width: 480px) {
      .error-card { padding: 22px 18px 26px; }
      .actions { flex-direction: column; }
      button, a { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="error-card">
    <div class="error-image-wrap">
      <img class="error-image" id="errorImage" src="/404error.png" alt="404 오류">
    </div>

    <h1>페이지를 찾을 수 없습니다.</h1>
    <p>
      입력한 주소가 잘못되었거나,<br>
      찾으시는 페이지가 이동 또는 삭제되었을 수 있습니다.
    </p>

    <div class="actions">
      <a class="home-btn" href="/">🏠 메인으로</a>
      <button class="back-btn" type="button" onclick="history.back()">← 이전 페이지</button>
    </div>

    <div class="brand">2026 코딩과함께라면 | SINCE 2025</div>
  </main>

  <script>
    // 메인 사이트의 설정을 이어받습니다.
    (function () {
      try {
        if (localStorage.getItem('darkMode') === 'true') {
          document.body.classList.add('dark-mode');
        }

        const primaryColor = localStorage.getItem('primaryColor');
        if (primaryColor) {
          document.documentElement.style.setProperty('--primary-color', primaryColor);
        }
      } catch (error) {}
    })();

    /*
     * 404error.png의 바깥쪽 배경을 브라우저에서 자동으로 투명 처리합니다.
     * 별도의 이미지 파일 수정 없이 canvas + flood fill 방식으로 처리합니다.
     * 모서리의 색을 기준으로 비슷한 색의 연결된 영역을 제거하므로,
     * 이미지 내부의 같은 색 요소는 최대한 보존합니다.
     */
    (function removeImageBackground() {
      const img = document.getElementById('errorImage');

      img.addEventListener('load', function () {
        try {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d', { willReadFrequently: true });

          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          ctx.drawImage(img, 0, 0);

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imageData.data;
          const width = canvas.width;
          const height = canvas.height;

          // 네 모서리의 평균 색을 배경색으로 사용합니다.
          const corners = [
            [0, 0],
            [width - 1, 0],
            [0, height - 1],
            [width - 1, height - 1]
          ];

          let bgR = 0, bgG = 0, bgB = 0;
          corners.forEach(([x, y]) => {
            const i = (y * width + x) * 4;
            bgR += data[i];
            bgG += data[i + 1];
            bgB += data[i + 2];
          });
          bgR /= corners.length;
          bgG /= corners.length;
          bgB /= corners.length;

          // 배경색과 얼마나 비슷해야 제거할지 결정합니다.
          const tolerance = 42;
          const maxPixels = width * height;
          const visited = new Uint8Array(maxPixels);
          const queue = new Int32Array(maxPixels);
          let head = 0;
          let tail = 0;

          function colorDistance(i) {
            const dr = data[i] - bgR;
            const dg = data[i + 1] - bgG;
            const db = data[i + 2] - bgB;
            return Math.sqrt(dr * dr + dg * dg + db * db);
          }

          function add(x, y) {
            if (x < 0 || x >= width || y < 0 || y >= height) return;
            const p = y * width + x;
            if (visited[p]) return;
            const i = p * 4;
            if (data[i + 3] === 0 || colorDistance(i) <= tolerance) {
              visited[p] = 1;
              queue[tail++] = p;
            }
          }

          // 이미지 가장자리에서 시작하여 배경 영역만 따라갑니다.
          for (let x = 0; x < width; x++) {
            add(x, 0);
            add(x, height - 1);
          }
          for (let y = 0; y < height; y++) {
            add(0, y);
            add(width - 1, y);
          }

          while (head < tail) {
            const p = queue[head++];
            const x = p % width;
            const y = Math.floor(p / width);
            const i = p * 4;

            data[i + 3] = 0;

            add(x - 1, y);
            add(x + 1, y);
            add(x, y - 1);
            add(x, y + 1);
          }

          ctx.putImageData(imageData, 0, 0);
          img.src = canvas.toDataURL('image/png');
        } catch (error) {
          // 이미지 처리에 실패하면 원본 이미지를 그대로 표시합니다.
          console.warn('404 이미지 배경 제거를 적용하지 못했습니다.', error);
        }
      }, { once: true });
    })();
  </script>
</body>
</html>
